<style>
  .meetings-list .item {
    border-color: #f5f5f5;
    border-radius: 0px;
    border-style: solid;
    border-width: 0px 0px 2px 0px;
    margin: 0px 4px;
    padding: 0px;
  }

  .meetings-list .item .subtitle {
    font-size: 14px;
    text-align: right;
  }

  .meetings-list .item .title {
    font-size: 16px;
    text-align: right;
  }

  .welcome .header #enter_room {
    max-width: 580px;
  }

  .welcome .header #enter_room .enter-room-input-container {
    padding: 2px;
  }

  .welcome .header #enter_room .enter-room-input-container .enter-room-input {
    font-size: 16px;
    height: 40px;
    margin: 2px;
    margin-top: 4px;
  }

  .welcome
    .header
    #enter_room
    .enter-room-input-container
    .enter-room-input.focus-visible {
    outline: unset;
  }

  .welcome .header #enter_room .join-meeting-container {
    border-radius: 8px;
    padding: 0px;
  }

  .welcome .header {
    background-image:
      linear-gradient(0deg, rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.2)),
      url(../images/welcome-background.jpg) !important;
  }

  .welcome .header .header-container {
    margin: 84px auto 72px;
  }

  .welcome .header .header-text-subtitle {
    margin: 64px 0 24px 0;
  }

  .welcome .header .header-text-title {
    font-weight: 600;
  }

  .welcome .welcome-page-button {
    background: #5e27dd;
    border-radius: 0px 8px 8px 0px;
    font-size: 18px;
    font-weight: 600;
    padding: 8px 20px;
  }

  /* "End for all" button changed to "secondary" colors */
  div[class$="hangupMenu"] button[class$="destructive-medium-fullWidth"] {
    background-color: #e0e0e0;
    color: #3d3d3d;
  }

  /* Regular hangup button changed to "destructive" colors */
  div[class$="hangupMenu"] button[class$="secondary-medium-fullWidth"] {
    background-color: #cb2233;
    color: #fff;
  }
</style>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var oidc = params.get("oidc");
  var jwt = params.get("jwt");
  if (oidc === "authorized" && jwt) {
    window.top.location.replace(
      window.location.pathname +
        "?jwt=" + encodeURIComponent(jwt) +
        "#config.prejoinConfig.enabled=false"
    );
  }
})();
</script>
