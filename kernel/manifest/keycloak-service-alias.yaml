# Service alias to map ums-keycloak to nubus-dev-keycloak
# This is a workaround for keycloak-bootstrap expecting "ums-keycloak" hostname
---
apiVersion: v1
kind: Service
metadata:
  name: ums-keycloak
  namespace: gentian-dev
  labels:
    app: keycloak-alias
spec:
  type: ExternalName
  externalName: nubus-dev-keycloak.gentian-dev.svc.cluster.local
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: ums-keycloak
  namespace: gentian-prod
  labels:
    app: keycloak-alias
spec:
  type: ExternalName
  externalName: nubus-prod-keycloak.gentian-prod.svc.cluster.local
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 8080
