---
# Gentian Portal — custom portal frontend deployed from the gentian-ui repo.
#
# Replaces the nubusPortalFrontend sub-chart of the nubus umbrella chart with
# the gentian-ui portal-frontend chart, which bundles custom branding (CSS,
# logo, background image).  The portal-server and portal-consumer sub-charts
# continue to run inside the nubus umbrella chart unchanged.
#
# Chart source: https://github.com/gentian-org/gentian-ui (helm/portal-frontend)
# Values:       gentian-os kernel/services/gentian-portal/values/portal-frontend/
#
# Multi-source:
#   Source 1 ($values): gentian-os repo — provides value files
#   Source 2:           gentian-ui repo — provides the Helm chart
#
# Wave 22: after nubus-manifests (wave 21), which creates the UCR ConfigMap
# (nubus-dev-stack-data-ums-ucr) that the portal-frontend references.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gentian-portal
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "22"
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - env: dev
          - list:
              elements:
                - chart: portal-frontend
                - chart: base-router
                - chart: gentian-login
  template:
    metadata:
      name: "gentian-portal-{{.chart}}-{{.env}}"
      annotations:
        argocd.argoproj.io/sync-wave: "22"
    spec:
      project: gentian
      sources:
        # Source 1: values from gentian-os
        - repoURL: https://github.com/gentian-org/gentian-os
          targetRevision: develop
          ref: values
        # Source 2: Helm chart from gentian-ui
        - repoURL: https://github.com/gentian-org/gentian-ui
          targetRevision: develop
          path: "helm/{{.chart}}"
          helm:
            valueFiles:
              - "$values/kernel/services/gentian-portal/values/{{.chart}}/_base.yaml"
              - "$values/kernel/services/gentian-portal/values/{{.chart}}/{{.env}}/values.yaml"
            releaseName: "gentian-portal-{{.chart}}-{{.env}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "gentian-{{.env}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 2m
        syncOptions:
          - CreateNamespace=false
          - ServerSideApply=true
          - Force=true
