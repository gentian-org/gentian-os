---
# openDesk app group: Pattern-A charts (existingSecret supported).
# Matrix generator: env list × app list  →  one Application per (env, app) pair.
# To add an environment: add one entry to the env list.
# To add an application:  add one entry to the app list.
#
# Current apps in this group:
#   - collabora  (Phase 4C) — waiting on existingSecret confirmation
#
# Nextcloud (3 sub-charts) is currently Pattern B (Tofu-managed) because
# opendesk-nextcloud-{management,aio,notifypush} use set_sensitive.
# Once ZenDiS adds existingSecret support, move nextcloud here.
#
# Usage pattern:
#   Layer 1:  $values/values/env/{env}.yaml           (storageClass, imagePullSecrets)
#   Layer 2:  $values/apps/{app}/values/_base.yaml    (non-secret config, NO env-specific hostnames)
#   Layer 3:  $values/apps/{app}/values/{env}/values.yaml  (existingSecret refs, sizing)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gentian-opendesk
  namespace: argocd
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - matrix:
      generators:
      - list:
          elements: []  # add envs: - env: dev / - env: prod  (once at least one app is uncommented below)
      - list:
          # Phase 4C apps — uncomment each entry when the chart is ready to deploy:
          # - app: collabora
          #   chart: collabora-online
          #   repoURL: registry.opencode.de/bmi/opendesk/components/supplier/collabora/charts-mirror
          #   version: "1.1.45"
          #   wave: "30"
          elements: []  # placeholder: remove [] and uncomment app entries for Phase 4C
  template:
    metadata:
      name: '{{.app}}-{{.env}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{.wave}}'
    spec:
      project: gentian
      sources:
      - repoURL: https://github.com/gentian-org/server
        targetRevision: develop
        ref: values
      - repoURL: '{{.repoURL}}'
        chart: '{{.chart}}'
        targetRevision: '{{.version}}'
        helm:
          valueFiles:
          - $values/values/env/{{.env}}.yaml
          - $values/apps/{{.app}}/values/_base.yaml
          - $values/apps/{{.app}}/values/{{.env}}/values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: 'gentian-{{.env}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
