---
# Stage 1 — Suze (Gentian IdP): OpenFGA + standalone Keycloak prerequisites.
# Helm releases are provisioned by the Suze Crossplane XR (suze composition).
#
# Sync wave 9: after InfraData prerequisites (wave 8) and before Suze claim (Step 14).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gentian-suze
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "9"
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - matrix:
      generators:
      - list:
          elements:
          - env: dev
      - list:
          elements:
          - app: openfga
          - app: keycloak-idp
  template:
    metadata:
      name: '{{.app}}-{{.env}}'
      annotations:
        argocd.argoproj.io/sync-wave: "9"
    spec:
      project: gentian
      source:
        repoURL: https://github.com/gentian-org/gentian-os
        targetRevision: feat/new-security
        path: kernel/services/{{.app}}/manifests/{{.env}}
      destination:
        server: https://kubernetes.default.svc
        namespace: platform-kernel
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 2m
        syncOptions:
        - CreateNamespace=false
        - ServerSideApply=true
      ignoreDifferences:
      - group: external-secrets.io
        kind: ExternalSecret
        jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.data[].remoteRef.nullBytePolicy
        - .metadata.finalizers
