---
# Stage 0 MAC — Kyverno admission controller + baseline ClusterPolicies.
# Sync wave 5: after Crossplane platform (wave 1–3) and before tenant/app workloads.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: gentian
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.3.7
    helm:
      valuesObject:
        admissionController:
          replicas: 1
          container:
            extraArgs:
              # Off by default in Kyverno itself. Needed for
              # raw/05b-metallb-exception.yaml — restricted to metallb-system so
              # only that PolicyException (not one an operator drops in some
              # other namespace) is honored.
              enablePolicyException: "true"
              exceptionNamespace: "metallb-system"
        backgroundController:
          replicas: 1
        cleanupController:
          replicas: 1
          # Default 128Mi OOMs on Crossplane-heavy clusters (~500+ CRDs): the TTL
          # manager starts an informer per GVR.
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
        reportsController:
          replicas: 1
        # bitnami/kubectl tags often fail to pull on homelab; use alpine/k8s (bash + kubectl).
        webhooksCleanup:
          image:
            repository: alpine/k8s
            tag: "1.32.3"
        policyReportsCleanup:
          image:
            repository: alpine/k8s
            tag: "1.32.3"
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: gentian
  source:
    repoURL: https://github.com/gentian-org/gentian-os
    targetRevision: develop
    path: kernel/security/kyverno/policies
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
  ignoreDifferences:
  - group: kyverno.io
    kind: ClusterPolicy
    jqPathExpressions:
    - .spec.admission
    - .spec.background
    - .spec.emitWarning
    - .spec.rules[].skipBackgroundRequests
    - .spec.rules[].validate.allowExistingViolations
