---
# Keycloak provider-keycloak bootstrap: admin credentials + ProviderConfig.
#
# Required for tenant app OIDC Client MRs created by app-default (realm per tenant).
# The full Keycloak client catalogue in keycloak-config/manifests/<env>/ remains
# Keycloak provider ConfigMap — applied when enabled.
#
# Wave 16: after Keycloak IDP (09-suze) and before tenant app reconciliation.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gentian-keycloak-provider
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "16"
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - env: dev
  template:
    metadata:
      name: "keycloak-provider-{{.env}}"
      annotations:
        argocd.argoproj.io/sync-wave: "16"
    spec:
      project: gentian
      source:
        repoURL: https://github.com/gentian-org/gentian-os
        targetRevision: develop
        path: "kernel/services/keycloak-config/manifests"
        helm:
          # env drives every stage-specific string in the chart, so adding a
          # stage needs no new directory — the old manifests/<env> layout meant
          # a missing directory failed as "app path does not exist" with the
          # Application stuck Unknown and no values ConfigMaps created.
          parameters:
            - name: env
              value: '{{.env}}'
          # Only stages that genuinely differ carry a values file; the rest
          # inherit the chart defaults.
          valueFiles:
            - values-{{.env}}.yaml
          ignoreMissingValueFiles: true
      destination:
        server: https://kubernetes.default.svc
        namespace: crossplane-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 2m
        syncOptions:
          - CreateNamespace=false
          - ServerSideApply=true
      ignoreDifferences:
        - group: external-secrets.io
          kind: ExternalSecret
          jqPathExpressions:
            - .spec.data[].remoteRef.conversionStrategy
            - .spec.data[].remoteRef.decodingStrategy
            - .spec.data[].remoteRef.metadataPolicy
            - .spec.target.deletionPolicy
            - .spec.data[].remoteRef.nullBytePolicy
