---
# OpenBao ongoing configuration via Crossplane provider-vault.
#
# Manages the operator-write ACL policy and the gentian-os-operator Kubernetes
# auth role that the gentian-os orchestrator uses to access KV secrets at
# reconcile time.
#
# Resources NOT managed here (handled elsewhere):
#   • eso-read policy + eso role         → Cluster XR (crossplane/compositions/)
#   • crossplane-write policy            → Cluster XR (crossplane/compositions/)
#   • KV v2 mount + Kubernetes auth backend → bao_bootstrap() in install.sh
#
# Wave 15: after infra (wave 10, which deploys OpenBao) and before Suze IdP
#          (wave 20+) which depends on ESO ExternalSecrets reading from OpenBao.
#          The ProviderConfig (crossplane/providers/provider-configs.yaml) and
#          openbao-crossplane-token Secret are created earlier by install.sh
#          bootstrap_openbao_for_crossplane().
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gentian-openbao-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - env: dev
  template:
    metadata:
      name: "openbao-config-{{.env}}"
      annotations:
        argocd.argoproj.io/sync-wave: "15"
    spec:
      project: gentian
      source:
        repoURL: https://github.com/gentian-org/gentian-os
        targetRevision: develop
        path: "kernel/services/openbao-config/manifests"
        helm:
          # env drives every stage-specific string in the chart, so adding a
          # stage needs no new directory — the old manifests/<env> layout meant
          # a missing directory failed as "app path does not exist" with the
          # Application stuck Unknown and no values ConfigMaps created.
          parameters:
            - name: env
              value: '{{.env}}'
          # Only stages that genuinely differ carry a values file; the rest
          # inherit the chart defaults.
          valueFiles:
            - values-{{.env}}.yaml
          ignoreMissingValueFiles: true
      destination:
        server: https://kubernetes.default.svc
        namespace: crossplane-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 2m
        syncOptions:
          - CreateNamespace=false
          - ServerSideApply=true
