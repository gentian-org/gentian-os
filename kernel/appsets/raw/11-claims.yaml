---
# Per-cluster Crossplane claims, from the deployments repository.
#
# This is what makes Phase 4b possible: the Suze and InfraData claims used to be
# applied by install.sh with kubectl, which put them outside drift detection —
# edit the claim in Git and nothing happened until someone re-ran the installer.
# They are per-cluster configuration (§2, surface 2) and belong in
# gentian-deployments, synced like everything else.
#
# The Cluster claim is deliberately NOT here. It is bootstrap: it creates the KV
# mount, the policies and the ClusterSecretStore that ESO needs before any of
# this can resolve a secret. It stays imperative in step 16.
#
# Sync wave 11: after infra-data prerequisites (8) and the Suze services (9), so
# the claims compose against resources that already exist.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gentian-claims
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "11"
spec:
  # Deleting this ApplicationSet must not delete the claims and cascade into
  # every managed resource they own.
  syncPolicy:
    preserveResourcesOnDeletion: true
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - list:
      elements:
      - env: dev
  template:
    metadata:
      name: 'gentian-claims-{{.env}}'
      annotations:
        argocd.argoproj.io/sync-wave: "11"
    spec:
      project: gentian
      source:
        repoURL: deployments.repo.placeholder
        targetRevision: deployments.revision.placeholder
        path: clusters/deployments.cluster.placeholder/kernel/claims
        directory:
          recurse: false
          # cluster.yaml is included, and the double-writer concern that once
          # excluded it is answered rather than ignored.
          #
          # Step 16 applies this same file from git at bootstrap, because the
          # claim composes the AppProject, namespaces and ClusterSecretStore that
          # Argo CD itself needs — the first apply cannot come from Argo. After
          # that the two agree by construction: the installer applies what git
          # says, and scaffolding writes installer-discovered values (nodeIp)
          # into git rather than onto the cluster, so there is one source and two
          # readers, not two writers.
          #
          # Excluding it meant the most important claim in the tree had no
          # reconciler and no drift detection. On ifk-w4h the installer applied
          # it on 17 Aug at 12:54; git changed nine hours later to static-ip with
          # a nodeIp and kernel mail; nothing followed, and the cluster ran for
          # two days believing it was a tunnel cluster with no mail — while this
          # Application reported Synced, truthfully, about the two claims it did
          # manage.
          #
          # prune stays false below. Removing this file, or mistyping the path,
          # would otherwise delete the XCluster and cascade through everything it
          # composes — the same reason the bootstrap Applications carry empty
          # finalizers. selfHeal reconciles drift; nothing here deletes.
      destination:
        server: https://kubernetes.default.svc
        namespace: crossplane-system
      syncPolicy:
        automated:
          # No prune: a claim removed from Git should be removed deliberately,
          # not as a side effect of a branch change. Crossplane garbage-collects
          # everything the claim owns, which is too much to do by accident.
          prune: false
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 2m
        syncOptions:
        - CreateNamespace=false
        - ServerSideApply=true
