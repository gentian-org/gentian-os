---
# Crossplane provider-helm releases for optional kernel mail (Postfix + Dovecot).
# Shared PostgreSQL/MariaDB/Redis/MinIO live in InfraData — see 08-infra-data.yaml.
#
# Each Application syncs kernel/services/<app>/manifests/<env>/:
#   configmap.yaml, externalsecret.yaml, release.yaml (and/or deployment.yaml)
#
# Deployed namespace: gentian-{env} (e.g. gentian-dev) — see manifests.
# Service DNS expected by the operator:
#   postfix-dev.gentian-dev.svc.cluster.local:587
#   dovecot-dev.gentian-dev.svc.cluster.local:24 (LMTP)
#
# NOTE: Charts/images are public placeholders marked UNTESTED in service READMEs.
# Wire-up with MAIL_SERVICE_MODE=kernel + install.sh step 15b / install.sh --only 28.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gentian-infra-helm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "9"
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - matrix:
      generators:
      - list:
          elements:
          - env: dev
      - list:
          elements:
          - app: postfix
          - app: dovecot
  template:
    metadata:
      name: '{{.app}}-{{.env}}'
      annotations:
        argocd.argoproj.io/sync-wave: "9"
    spec:
      project: gentian
      source:
        repoURL: https://github.com/gentian-org/gentian-os
        targetRevision: develop
        path: kernel/services/{{.app}}/manifests
        helm:
          # env drives every stage-specific string in the chart, so adding a
          # stage needs no new directory — the old manifests/<env> layout meant
          # a missing directory failed as "app path does not exist" with the
          # Application stuck Unknown and no values ConfigMaps created.
          parameters:
            - name: env
              value: '{{.env}}'
            # Postfix renders ALLOWED_SENDER_DOMAINS from this. It is rewritten
            # from the literal below by kernel/appsets/templates/appsets.yaml,
            # the same mechanism that rewrites "env: dev".
            - name: kernelDomain
              value: 'kernel.domain.placeholder'
          # Only stages that genuinely differ carry a values file; the rest
          # inherit the chart defaults.
          valueFiles:
            - values-{{.env}}.yaml
          ignoreMissingValueFiles: true
      destination:
        server: https://kubernetes.default.svc
        namespace: gentian-{{.env}}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 2m
        syncOptions:
        - CreateNamespace=false
        - ServerSideApply=true
      ignoreDifferences:
      - group: external-secrets.io
        kind: ExternalSecret
        jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.target.deletionPolicy
        - .spec.data[].remoteRef.nullBytePolicy
