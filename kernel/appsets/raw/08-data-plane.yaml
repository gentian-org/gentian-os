---
# The system tier's data plane: the CNPG cluster tenants and their apps are
# provisioned on.
#
# Sync wave 8, before the identity appset (9) and the claims (11): a tenant's
# desktop asks for a database as soon as its Component reconciles, and a
# cluster whose engine arrives after the tenant does spends that window
# reporting DatabaseUnavailable.
#
# The namespace is composed by the Cluster claim (C-01), not created here:
# which engines a cluster runs is a property of what it declares. This
# ApplicationSet therefore runs in C-02 and not in B-01, and CreateNamespace
# is false so that an Application cannot quietly create an unlabelled
# namespace that no policy selects on.
#
# The kernel's own Postgres is NOT here. kernel-postgres lives in kernel-data,
# is bootstrapped by B-01 before any claim exists, and serves Keycloak,
# OpenFGA and the console. Kernel identity does not share a data plane with
# tenants.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gentian-data-plane
  namespace: ns.gitops.placeholder
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - matrix:
      generators:
      - list:
          elements:
          - env: dev
      - list:
          elements:
          - app: tenant-postgres
            path: kernel/data/tenant-postgres
            namespace: sys.postgresql.placeholder
          # The three Bitnami engines. These charts carry only the
          # prerequisites -- the values ConfigMaps and the credential
          # ExternalSecret -- and the Helm release itself is a provider-helm
          # Release the Cluster composition composes, reading those
          # ConfigMaps by name. The split is v4's and is kept: the values are
          # reviewable as YAML in this repository, and the release is an
          # object Crossplane owns and reconciles.
          - app: infra-mariadb
            path: kernel/services/infra-mariadb/manifests
            namespace: sys.mariadb.placeholder
          - app: infra-redis
            path: kernel/services/infra-redis/manifests
            namespace: sys.cache.placeholder
          - app: infra-minio
            path: kernel/services/infra-minio/manifests
            namespace: sys.s3.placeholder
  template:
    metadata:
      name: '{{.app}}-{{.env}}'
      annotations:
        argocd.argoproj.io/sync-wave: "8"
    spec:
      project: gentian
      source:
        repoURL: https://github.com/gentian-org/gentian-os
        targetRevision: develop
        path: '{{.path}}'
        helm:
          parameters:
            - name: env
              value: '{{.env}}'
            # The engine charts default this to gentian-infra-<env>, which is
            # v4's namespace. Stated here so the objects land where the
            # Cluster claim composed them and the Release's valuesFrom can
            # find them; tenant-postgres ignores it.
            - name: namespace
              value: '{{.namespace}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=false
        - ServerSideApply=true
        retry:
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 2m
          limit: 10
