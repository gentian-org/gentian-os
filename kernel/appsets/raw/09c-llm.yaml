# LiteLLM and its backing stores.
#
# Its own file because it is CONDITIONAL: kernel/appsets/templates/appsets.yaml
# skips this one unless the cluster's claim enables LLM serving.
#
# It used to be three kubectl applies in D-05-llm-serving, straight from the
# installer's working tree — so the LLM stack was outside drift detection
# entirely. Nothing reconciled it, nothing noticed if it was edited on the
# cluster, and what ran reflected whichever checkout last ran install.sh rather
# than any commit. dev/ and prod/ were byte-identical copies of the same three
# files, kept in step by hand.
#
# Two sources. The chart is this repository's; the second is the cluster's
# deployments repository, and the Cluster claim in it is handed to the chart as
# a values file. That is how the claim's spec.llm reaches the chart: which
# models the gateway offers (instances and providers), whether a provider's
# token is fetched, whether the mock model server runs, and whether the
# gateway's NetworkPolicy admits the edge for the console
# (spec.llm.console.enabled). A commit to the claim is a sync of this
# Application.
#
# NOT covered here: the vLLM instances themselves. The gateway offers a model
# for each entry of spec.llm.instances and nothing starts the server behind
# it; kernel/services/llm/chart holds the workload and no Application
# delivers it.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gentian-llm
  namespace: ns.gitops.placeholder
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - matrix:
      generators:
      - list:
          elements:
          - env: dev
      - list:
          elements:
          - app: llm
  template:
    metadata:
      name: '{{.app}}-{{.env}}'
      annotations:
        argocd.argoproj.io/sync-wave: "9"
    spec:
      project: gentian
      sources:
      - repoURL: https://github.com/gentian-org/gentian-os
        targetRevision: develop
        path: kernel/services/{{.app}}/manifests
        helm:
          # The Cluster claim: .Values.spec.llm in the chart.
          valueFiles:
            - $claim/clusters/deployments.cluster.placeholder/kernel/claims/cluster.yaml
          parameters:
            - name: env
              value: '{{.env}}'
            # Where LLM serving runs. v4 left this at the chart's default,
            # platform-kernel, because that was v4's one namespace for
            # everything; on v5 it is a system-tier function of its own and
            # the operator addresses it as layout.System("llm").
            - name: servicesNamespace
              value: 'sys.llm.placeholder'
            # The NetworkPolicies on the pods of this namespace, delivered
            # with the chart like each store's: the cluster's one switch
            # (kernel/appsets/values.yaml storeNetworkPolicies) and the
            # namespaces of the platform's own clients from the layout.
            - name: networkPolicy.enabled
              value: 'store.networkpolicies.placeholder'
            - name: networkPolicy.namespaces.control
              value: 'ns.control.placeholder'
            - name: networkPolicy.namespaces.data
              value: 'ns.data.placeholder'
            - name: networkPolicy.namespaces.edge
              value: 'ns.edge.placeholder'
      - repoURL: deployments.repo.placeholder
        targetRevision: deployments.revision.placeholder
        ref: claim
      destination:
        server: https://kubernetes.default.svc
        namespace: 'sys.llm.placeholder'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=false
        - ServerSideApply=true
        retry:
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 2m
          limit: 10
