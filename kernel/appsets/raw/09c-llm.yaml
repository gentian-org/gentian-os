# LiteLLM and its backing stores.
#
# Its own file because it is CONDITIONAL: kernel/appsets/templates/appsets.yaml
# skips this one unless the cluster's claim enables LLM serving.
#
# It used to be three kubectl applies in D-05-llm-serving, straight from the
# installer's working tree — so the LLM stack was outside drift detection
# entirely. Nothing reconciled it, nothing noticed if it was edited on the
# cluster, and what ran reflected whichever checkout last ran install.sh rather
# than any commit. dev/ and prod/ were byte-identical copies of the same three
# files, kept in step by hand.
#
# NOT covered here: the vLLM GPU release. Its input is spec.llm.instances on the
# Cluster claim, and Argo CD cannot project a claim into Helm values — that one
# belongs in the Cluster Composition, which reads claims by design. Until then
# it stays in D-05.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gentian-llm
  namespace: ns.gitops.placeholder
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - matrix:
      generators:
      - list:
          elements:
          - env: dev
      - list:
          elements:
          - app: llm
  template:
    metadata:
      name: '{{.app}}-{{.env}}'
      annotations:
        argocd.argoproj.io/sync-wave: "9"
    spec:
      project: gentian
      source:
        repoURL: https://github.com/gentian-org/gentian-os
        targetRevision: develop
        path: kernel/services/{{.app}}/manifests
        helm:
          parameters:
            - name: env
              value: '{{.env}}'
            # The mock backend serves a cluster with no GPUs. Rewritten from
            # spec.llm.gpuAcceleration, so turning GPUs on removes it on the
            # next sync instead of leaving it running.
            - name: mockBackend
              value: 'llm.mock.backend.placeholder'
            # Whether spec.llm.providers lists anything, so the chart knows
            # whether an OpenBao path for provider API keys exists to read.
            - name: externalProviders
              value: 'llm.external.providers.placeholder'
            # Whether the gateway's console is served (spec.llm.console.enabled,
            # off by default): whether the gateway's NetworkPolicy admits the
            # edge.
            - name: console.enabled
              value: 'llm.console.placeholder'
            # Where LLM serving runs. v4 left this at the chart's default,
            # platform-kernel, because that was v4's one namespace for
            # everything; on v5 it is a system-tier function of its own and
            # the operator addresses it as layout.System("llm").
            - name: servicesNamespace
              value: 'sys.llm.placeholder'
            # The NetworkPolicies on the pods of this namespace, delivered
            # with the chart like each store's: the cluster's one switch
            # (kernel/appsets/values.yaml storeNetworkPolicies) and the
            # namespaces of the platform's own clients from the layout.
            - name: networkPolicy.enabled
              value: 'store.networkpolicies.placeholder'
            - name: networkPolicy.namespaces.control
              value: 'ns.control.placeholder'
            - name: networkPolicy.namespaces.data
              value: 'ns.data.placeholder'
            - name: networkPolicy.namespaces.edge
              value: 'ns.edge.placeholder'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'sys.llm.placeholder'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=false
        - ServerSideApply=true
        retry:
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 2m
          limit: 10
