---
# Kernel services group: cluster-wide platform services deployed by Argo CD.
# Matrix generator: env list × app list → one Application per (env, app) pair.
#
# User-installable apps are catalogue entries in gentian-apps, synced via
# gentian-catalogue ApplicationSet — not listed here.
#
# Usage pattern:
#   Layer 1:  $values/values/env/{env}.yaml
#   Layer 2:  $values/kernel/services/{app}/values/_base.yaml
#   Layer 3:  $values/kernel/services/{app}/values/{env}/values.yaml
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gentian-kernel-services
  namespace: argocd
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - matrix:
      generators:
      - list:
          elements: []
      - list:
          elements: []
  template:
    metadata:
      name: '{{.app}}-{{.env}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{.wave}}'
    spec:
      project: gentian
      sources:
      - repoURL: https://github.com/gentian-org/gentian-os
        targetRevision: develop
        ref: values
      - repoURL: '{{.repoURL}}'
        chart: '{{.chart}}'
        targetRevision: '{{.version}}'
        helm:
          valueFiles:
          - $values/kernel/values/env/{{.env}}.yaml
          - $values/kernel/services/{{.app}}/values/_base.yaml
          - $values/kernel/services/{{.app}}/values/{{.env}}/values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: 'gentian-{{.env}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
