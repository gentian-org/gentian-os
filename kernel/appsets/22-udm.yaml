---
# UDM provisioning: users and groups in the Nubus LDAP directory.
#
# Deploys provider-http Request managed resources that perform full CRUD
# against the Nubus UDM REST API.  UDM is the authoritative identity source
# in the Nubus/openDesk stack — users and groups created here flow into LDAP
# and are federated into Keycloak automatically via the LDAP federation.
#
# Architecture note:
#   This ApplicationSet deploys raw Crossplane managed resources (Request CRDs)
#   to crossplane-system.  No Helm, no Tofu.  Every user and group is a YAML
#   file in kernel/services/udm/manifests/{env}/ — pure GitOps.
#
# Wave 22: after nubus (wave 21) so the UDM REST API is available.
#          The ESO ExternalSecret (wave 0) is deployed first to ensure
#          the udm-admin-creds secret exists before any Request reconciles.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gentian-udm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "22"
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - env: dev
  template:
    metadata:
      name: "udm-{{.env}}"
      annotations:
        argocd.argoproj.io/sync-wave: "22"
    spec:
      project: gentian
      source:
        repoURL: https://github.com/gentian-org/gentian-os
        targetRevision: develop
        path: "kernel/services/udm/manifests/{{.env}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: crossplane-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 2m
        syncOptions:
          - CreateNamespace=false
          - ServerSideApply=true
      ignoreDifferences:
        - group: external-secrets.io
          kind: ExternalSecret
          jqPathExpressions:
            - .spec.refreshPolicy
            - .spec.refreshInterval
            - .spec.target.template.engineVersion
            - .spec.target.template.mergePolicy
            - .spec.target.deletionPolicy
            - .spec.target.creationPolicy
            - .spec.dataFrom[]?.find?.conversionStrategy
            - .spec.data[]?.remoteRef?.nullBytePolicy
