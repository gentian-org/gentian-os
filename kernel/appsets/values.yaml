# The v5 wrapper's parameters. Namespaces are not among them by name: raw
# files address a kernel namespace as ns.<function>.placeholder and the
# wrapper resolves it from the layout the installer passes in.
stage: dev
targetRevision: develop
kernelDomain: ""
gentianOsRepo: https://github.com/gentian-org/gentian-os
deploymentsRepo: ""
deploymentsRevision: main
deploymentsCluster: ""
# Filled by the installer from kernel/namespaces.yaml. Never set by hand.
namespaces: {}

# Which conditional functions this cluster runs, and the values their charts
# need. Filled by the bootstrap chart from the Cluster claim; a raw file whose
# function is off is skipped by name in templates/appsets.yaml.
mailServiceMode: external
llmEnabled: "false"
relayHost: ""
egressHost: ""
storageClass: ""
# Whether this cluster has GPUs (spec.llm.gpuAcceleration) and whether the
# claim lists external providers. The first decides whether the mock backend
# runs; the second whether the chart reads a vault path for provider keys.
llmGpuAcceleration: "false"
llmExternalProviders: "false"
# Whether the model gateway's console is served at llm.<kernelDomain>
# (spec.llm.console.enabled). Off unless the claim says "true": anything else
# renders the gateway's NetworkPolicy without a rule for the edge.
llmConsoleEnabled: "false"

# Whether the four shared stores -- PostgreSQL, MariaDB, Redis, MinIO -- each
# get the NetworkPolicy that says who may connect to them
# (templates/networkpolicy.yaml in each engine's chart). On unless a cluster
# says otherwise; "false" removes all four and leaves credentials as the only
# check on a connection. From the bootstrap chart's value of the same name.
# The mail servers' charts take the same switch for theirs.
# The same switch carries the policies of the model gateway's namespace
# (kernel/services/llm/manifests), on a cluster that serves models.
storeNetworkPolicies: "true"
