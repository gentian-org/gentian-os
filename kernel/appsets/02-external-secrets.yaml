---
# ExternalSecret applications — one Application per (env, app) pair.
# Matrix generator: env list × app list.
# To add an environment: add one entry to the env list (e.g. - env: prod).
# To add an app:         add one entry to the app list with the correct nsPrefix.
#
# nsPrefix controls which namespace the secrets land in:
#   "gentian"       → gentian-{env}        (application tier)
#   "gentian-infra" → gentian-infra-{env}  (infrastructure tier)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - matrix:
        generators:
          # ── Environments ──────────────────────────────────────────────────
          - list:
              elements:
                - env: dev
                # - env: prod   # uncomment when production environment is ready
          # ── Applications ──────────────────────────────────────────────────
          - list:
              elements:
                # Infrastructure tier (→ gentian-infra-{env})
                # PostgreSQL/MariaDB/Redis/MinIO: kernel/appsets/08-infra-data.yaml + InfraData XR.
                # Application tier (→ gentian-{env})
                - app: globals
                  appDir: _globals
                  nsPrefix: gentian
                # Tenant app secrets sync via catalogue ApplicationSets.
                # Re-enable when those apps return or are replaced.
  template:
    metadata:
      name: "{{.app}}-secrets-{{.env}}"
      annotations:
        argocd.argoproj.io/sync-wave: "2"
    spec:
      project: gentian
      source:
        repoURL: https://github.com/gentian-org/gentian-os
        targetRevision: develop
        path: "kernel/services/{{.appDir}}/secrets/{{.env}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.nsPrefix}}-{{.env}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
