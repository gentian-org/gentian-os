---
# ExternalSecret applications — one Application per (env, app) pair.
# Matrix generator: env list × app list.
# To add an environment: add one entry to the env list (e.g. - env: prod).
# To add an app:         add one entry to the app list with the correct nsPrefix.
#
# nsPrefix controls which namespace the secrets land in:
#   "gentian"       → gentian-{env}        (application tier)
#   "gentian-infra" → gentian-infra-{env}  (infrastructure tier)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - matrix:
        generators:
          # ── Environments ──────────────────────────────────────────────────
          - list:
              elements:
                - env: dev
                # - env: prod   # uncomment when production environment is ready
          # ── Applications ──────────────────────────────────────────────────
          - list:
              elements:
                # Infrastructure tier (→ gentian-infra-{env})
                # NOTE: postgresql and mariadb secrets are now deployed by the
                # opendesk-postgresql-dev / opendesk-mariadb-dev Crossplane apps
                # (kernel/services/opendesk-postgresql|mariadb/manifests/dev/).
                - app: redis
                  appDir: redis
                  nsPrefix: gentian-infra
                - app: minio
                  appDir: minio
                  nsPrefix: gentian-infra
                # Application tier (→ gentian-{env})
                - app: globals
                  appDir: _globals
                  nsPrefix: gentian
                # NOTE: nubus secrets are now in crossplane/apps/nubus/externalsecrets.yaml
                # (deployed via the nubus-manifests-dev ArgoCD app).
                # NOTE: keycloak-bootstrap secrets are now provided directly by the
                # nubus Helm chart (nubus-dev-keycloak-credentials secret).
                - app: intercom-service
                  appDir: intercom-service
                  nsPrefix: gentian
                - app: nextcloud
                  appDir: nextcloud
                  nsPrefix: gentian
                - app: ox-appsuite
                  appDir: ox-appsuite
                  nsPrefix: gentian
  template:
    metadata:
      name: "{{.app}}-secrets-{{.env}}"
      annotations:
        argocd.argoproj.io/sync-wave: "2"
    spec:
      project: gentian
      source:
        repoURL: https://github.com/gentian-org/gentian-os
        targetRevision: develop
        path: "kernel/services/{{.appDir}}/secrets/{{.env}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.nsPrefix}}-{{.env}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
