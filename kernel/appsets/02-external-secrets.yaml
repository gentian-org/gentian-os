---
# ExternalSecret applications — one Application per (env, app) pair.
# Matrix generator: env list × app list.
# To add an environment: add one entry to the env list (e.g. - env: prod).
# To add an app:         add one entry to the app list with the correct nsPrefix.
#
# nsPrefix controls which namespace the secrets land in:
#   "gentian"       → gentian-{env}        (application tier)
#   "gentian-infra" → gentian-infra-{env}  (infrastructure tier)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - matrix:
        generators:
          # ── Environments ──────────────────────────────────────────────────
          - list:
              elements:
                - env: dev
                # - env: prod   # uncomment when production environment is ready
          # ── Applications ──────────────────────────────────────────────────
          - list:
              elements:
                # Infrastructure tier (→ gentian-infra-{env})
                - app: postgresql
                  appDir: postgresql
                  nsPrefix: gentian-infra
                - app: mariadb
                  appDir: mariadb
                  nsPrefix: gentian-infra
                - app: redis
                  appDir: redis
                  nsPrefix: gentian-infra
                - app: minio
                  appDir: minio
                  nsPrefix: gentian-infra
                # Application tier (→ gentian-{env})
                - app: globals
                  appDir: _globals
                  nsPrefix: gentian
                - app: nubus
                  appDir: nubus
                  nsPrefix: gentian
                - app: intercom-service
                  appDir: intercom-service
                  nsPrefix: gentian
                - app: keycloak-bootstrap
                  appDir: keycloak-bootstrap
                  nsPrefix: gentian
                - app: nextcloud
                  appDir: nextcloud
                  nsPrefix: gentian
                # ox-appsuite removed: it is a user-installable app (Layer 200),
                # not a kernel service. Its ExternalSecret belongs in the apps tier
                # and is activated when the AppProfile deploys OX to a tenant.
  template:
    metadata:
      name: "{{.app}}-secrets-{{.env}}"
      annotations:
        argocd.argoproj.io/sync-wave: "2"
    spec:
      project: gentian
      source:
        repoURL: https://github.com/gentian-org/server
        targetRevision: develop
        path: "apps/{{.appDir}}/secrets/{{.env}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.nsPrefix}}-{{.env}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
