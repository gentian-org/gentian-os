---
# Crossplane provider-helm releases for kernel application charts (Nextcloud,
# mail, etc.). Shared PostgreSQL and MariaDB are provisioned by the InfraData
# Crossplane XR — see kernel/appsets/08-infra-data.yaml and
# crossplane/compositions/infra-data.yaml.
#
# Pattern B: Release CR + valuesFrom configMapKeyRef / secretKeyRef.
#
# Sync wave 9: after ESO secrets (wave 2) and infra-data values (wave 8).
#
# Each Application syncs kernel/services/<app>/manifests/<env>/:
#   externalsecret.yaml, configmap.yaml, release.yaml
# Release CRs are cluster-scoped; ConfigMaps and ExternalSecrets use explicit
# namespace: gentian-infra-{env} and are deployed there regardless of the
# Application's destination namespace.
#
# To add an environment: add one entry to the env list.
# To add a chart:        add one entry to the app list.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gentian-infra-helm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "9"
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - matrix:
      generators:
      - list:
          elements:
          - env: dev
      - list:
          elements:
          - app: nextcloud-management
          - app: nextcloud
          - app: nextcloud-notifypush
          - app: collabora
          - app: cryptpad
          - app: postfix
          - app: dovecot
  template:
    metadata:
      name: '{{.app}}-{{.env}}'
      annotations:
        argocd.argoproj.io/sync-wave: "9"
    spec:
      project: gentian
      source:
        repoURL: https://github.com/gentian-org/gentian-os
        targetRevision: develop
        path: kernel/services/{{.app}}/manifests/{{.env}}
      destination:
        server: https://kubernetes.default.svc
        # Cluster-scoped Release CRs ignore destination namespace.
        # ConfigMaps and ExternalSecrets use explicit namespace: gentian-infra-{env}
        # from their manifests, so they land in the correct namespace regardless.
        namespace: gentian-infra-{{.env}}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 2m
        syncOptions:
        - CreateNamespace=false
        - ServerSideApply=true
      # ESO adds default fields (conversionStrategy, decodingStrategy,
      # metadataPolicy, nullBytePolicy) and a cleanup finalizer to every
      # ExternalSecret after ArgoCD applies it.  Ignore those to prevent
      # an infinite OutOfSync / selfHeal loop.
      ignoreDifferences:
      - group: external-secrets.io
        kind: ExternalSecret
        jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.data[].remoteRef.nullBytePolicy
        - .metadata.finalizers
