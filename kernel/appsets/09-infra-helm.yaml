---
# Infra provider-helm releases: openDesk PostgreSQL and MariaDB.
#
# These charts use indexed set_sensitive calls (not a single existingSecret key)
# so they are managed as provider-helm Release CRs with Pattern B migration:
#   - ESO ExternalSecret renders a sensitive-values.yaml Helm values file
#   - Release CR consumes it via valuesFrom.secretKeyRef
#
# Wave 9: after ESO secrets (wave 2) — ensures postgresql-sensitive-values and
# mariadb-sensitive-values Secrets exist before provider-helm reconciles —
# and before nubus (wave 11), which depends on PostgreSQL being available.
#
# Each Application deploys from kernel/services/<app>/manifests/<env>/ which
# contains: externalsecret.yaml, configmap.yaml, release.yaml.
# Release CRs are cluster-scoped; ConfigMaps and ExternalSecrets use explicit
# namespace: gentian-infra-{env} and are deployed there regardless of the
# Application's destination namespace.
#
# To add an environment: add one entry to the env list.
# To add a chart:        add one entry to the app list.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gentian-infra-helm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "9"
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - matrix:
      generators:
      - list:
          elements:
          - env: dev
      - list:
          elements:
          - app: opendesk-postgresql
          - app: opendesk-mariadb
          - app: nextcloud-management
          - app: nextcloud
          - app: nextcloud-notifypush
          - app: postfix
          - app: dovecot
          - app: ox-appsuite
  template:
    metadata:
      name: '{{.app}}-{{.env}}'
      annotations:
        argocd.argoproj.io/sync-wave: "9"
    spec:
      project: gentian
      source:
        repoURL: https://github.com/gentian-org/gentian-os
        targetRevision: develop
        path: kernel/services/{{.app}}/manifests/{{.env}}
      destination:
        server: https://kubernetes.default.svc
        # Cluster-scoped Release CRs ignore destination namespace.
        # ConfigMaps and ExternalSecrets use explicit namespace: gentian-infra-{env}
        # from their manifests, so they land in the correct namespace regardless.
        namespace: gentian-infra-{{.env}}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 2m
        syncOptions:
        - CreateNamespace=false
        - ServerSideApply=true
      # ESO adds default fields (conversionStrategy, decodingStrategy,
      # metadataPolicy, nullBytePolicy) and a cleanup finalizer to every
      # ExternalSecret after ArgoCD applies it.  Ignore those to prevent
      # an infinite OutOfSync / selfHeal loop.
      ignoreDifferences:
      - group: external-secrets.io
        kind: ExternalSecret
        jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.data[].remoteRef.nullBytePolicy
        - .metadata.finalizers
