---
# Nubus plain manifests — currently contains ExternalName Service aliases that
# bridge opendesk's hard-coded "ums-*" hostnames to Gentian's env-prefixed
# nubus service names (e.g. ums-portal-server → nubus-dev-portal-server).
#
# Wave 21: after nubus (wave 20) so the target services exist, and before
#          kernel-services (wave 30) / apps (wave 40) that call these endpoints.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gentian-nubus-manifests
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "21"
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - env: dev
  template:
    metadata:
      name: "nubus-manifests-{{.env}}"
      annotations:
        argocd.argoproj.io/sync-wave: "21"
    spec:
      project: gentian
      source:
        repoURL: https://github.com/gentian-org/gentian-os
        targetRevision: develop
        path: "kernel/services/nubus/manifests/{{.env}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "gentian-{{.env}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 2m
        syncOptions:
          - CreateNamespace=false
          - ServerSideApply=true
