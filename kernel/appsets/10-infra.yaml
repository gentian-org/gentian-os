---
# Infra group: redis, minio (Pattern A — existingSecret supported)
# postgresql and mariadb managed via provider-helm Releases (Pattern B).
# Matrix generator: env list × app list  →  one Application per (env, app) pair.
# To add an environment: add one entry to the env list.
# To add an application:  add one entry to the app list.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gentian-infra
  namespace: argocd
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - matrix:
      generators:
      - list:
          elements:
          - env: dev
      - list:
          elements:
          - app: redis
            chart: redis
            repoURL: registry.opencode.de/bmi/opendesk/components/external/charts/bitnami-charts
            version: "18.6.1"
            wave: "12"
          - app: minio
            chart: minio
            repoURL: registry.opencode.de/bmi/opendesk/components/external/charts/bitnami-charts
            version: "16.0.10"
            wave: "13"
  template:
    metadata:
      name: '{{.app}}-{{.env}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{.wave}}'
    spec:
      project: gentian
      sources:
      - repoURL: https://github.com/gentian-org/gentian-os
        targetRevision: develop
        ref: values
      - repoURL: '{{.repoURL}}'
        chart: '{{.chart}}'
        targetRevision: '{{.version}}'
        helm:
          valueFiles:
          - $values/kernel/values/env/{{.env}}.yaml
          - $values/kernel/services/{{.app}}/values/_base.yaml
          - $values/kernel/services/{{.app}}/values/{{.env}}/values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: 'gentian-infra-{{.env}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
