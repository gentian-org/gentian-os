---
# Argo Helm releases for shared infrastructure data stores (redis, minio).
#
# Chart source: oci://registry-1.docker.io/bitnamicharts/{redis,minio}
# (full OCI path per chart — ArgoCD cannot use repoURL + chart for OCI registries)
# Values: kernel/services/{redis,minio}/values/ layered with kernel/values/env/
#
# PostgreSQL and MariaDB are deployed by the InfraData Crossplane XR
# (crossplane/compositions/infra-data.yaml); values/secrets synced by 08-infra-data.
#
# Matrix generator: env list × app list  →  one Application per (env, app) pair.
# To add an environment: add one entry to the env list.
# To add an application:  add one entry to the app list.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gentian-infra
  namespace: argocd
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - matrix:
      generators:
      - list:
          elements:
          - env: dev
      - list:
          elements:
          - app: redis
            repoURL: oci://registry-1.docker.io/bitnamicharts/redis
            version: "18.6.1"
            wave: "12"
          - app: minio
            repoURL: oci://registry-1.docker.io/bitnamicharts/minio
            version: "16.0.10"
            wave: "13"
  template:
    metadata:
      name: '{{.app}}-{{.env}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{.wave}}'
    spec:
      project: gentian
      sources:
      - repoURL: https://github.com/gentian-org/gentian-os
        targetRevision: feat/new-security
        ref: values
      - repoURL: '{{.repoURL}}'
        targetRevision: '{{.version}}'
        helm:
          valueFiles:
          - $values/kernel/values/env/{{.env}}.yaml
          - $values/kernel/services/{{.app}}/values/_base.yaml
          - $values/kernel/services/{{.app}}/values/{{.env}}/values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: 'gentian-infra-{{.env}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
