---
# Nubus (Keycloak + UCS LDAP + Portal) — Layer 110, IAM kernel service.
# Pattern A stub — Nubus is currently Pattern B (Tofu-managed via infra-workspaces).
# This file will become active when Univention adds existingSecret support to the
# nubus chart and the helm_release block is removed from
# tofu/tenant/infra-workspaces/nubus.tf.
#
# Chart: nubus v1.16.0
# repoURL: registry.opencode.de/bmi/opendesk/components/supplier/univention/charts-mirror
#
# ignoreDifferences required (runtime-generated by Nubus init hooks):
#   - group: ""  kind: ConfigMap  name: nubus-{env}-ldap-server-status
#   - group: ""  kind: Secret     name: nubus-{env}-ecdsa-ca-secret
#   - group: ""  kind: Secret     name: nubus-{env}-guardian-management-api-postgresql-credentials
#   - group: ""  kind: Secret     name: nubus-{env}-portal-consumer-object-storage
#   - group: ""  kind: Secret     name: nubus-{env}-saml-tls
#   - group: ""  kind: Service    name: ums-keycloak
# See also kernel/argocd/projects/gentian.yaml orphanedResources.ignore list.
#
# Nubus must be a standalone ApplicationSet (not part of the 20-iam matrix) because
# per-app ignoreDifferences can only be applied at the Application template level.
# To add an environment: add one entry to the env list.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gentian-nubus
  namespace: argocd
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - list:
      # Currently Pattern B (Tofu-managed). Uncomment when nubus chart gains existingSecret
      # support and helm_release.nubus is removed from infra-workspaces.
      elements: []  # - env: dev
  template:
    metadata:
      name: 'nubus-{{.env}}'
      annotations:
        argocd.argoproj.io/sync-wave: "11"
    spec:
      project: gentian
      sources:
      - repoURL: https://github.com/gentian-org/server
        targetRevision: develop
        ref: values
      - repoURL: registry.opencode.de/bmi/opendesk/components/supplier/univention/charts-mirror
        chart: nubus
        targetRevision: "1.16.0"
        helm:
          valueFiles:
          - $values/values/env/{{.env}}.yaml
          - $values/apps/nubus/values/_base.yaml
          - $values/apps/nubus/values/{{.env}}/values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: 'gentian-{{.env}}'
      ignoreDifferences:
      - group: ""
        kind: ConfigMap
        name: 'nubus-{{.env}}-ldap-server-status'
      - group: ""
        kind: Secret
        name: 'nubus-{{.env}}-ecdsa-ca-secret'
      - group: ""
        kind: Secret
        name: 'nubus-{{.env}}-guardian-management-api-postgresql-credentials'
      - group: ""
        kind: Secret
        name: 'nubus-{{.env}}-portal-consumer-object-storage'
      - group: ""
        kind: Secret
        name: 'nubus-{{.env}}-saml-tls'
      - group: ""
        kind: Service
        name: ums-keycloak
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
