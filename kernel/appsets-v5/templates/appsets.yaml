{{- /*
  Pass raw/*.yaml through verbatim (.Files.Get never re-templates them: they
  carry ApplicationSet templating Argo evaluates at its own sync time). The
  wrapper swaps literals only: the stage, the git ref and origin of gentian-os,
  the deployments placeholders, and the namespace placeholders, which are
  resolved from the layout so that no raw file names a namespace by hand.
*/ -}}
{{- $ns := dict -}}
{{- range .Values.namespaces.kernel }}{{ $_ := set $ns .function .name }}{{ end -}}
{{- if not $ns }}{{ fail "kernel/appsets-v5 needs the namespace layout (.Values.namespaces from kernel/namespaces.yaml)" }}{{ end -}}
{{- /* The system tier under its own prefix. Separate from the kernel map
     rather than merged into it: the two tiers happen to use disjoint function
     names today, and a merge would make a future collision resolve silently
     to whichever was ranged last. */ -}}
{{- $sys := dict -}}
{{- range .Values.namespaces.system }}{{ $_ := set $sys .function .name }}{{ end -}}
{{- range $path, $_ := .Files.Glob "raw/*.yaml" }}
{{- /* A raw file is skipped by NAME when its function is off.

     By name because the file is copied verbatim: it carries ApplicationSet
     templating that Argo evaluates at its own sync time, so a Helm
     conditional cannot live inside one. v4's wrapper does the same.

     Mail and LLM serving are both claim decisions and both compose their own
     namespaces, so a cluster that runs neither gets neither namespace nor
     workload -- rather than an empty namespace and an Application with
     nowhere to sync. */}}
{{- if and (hasSuffix "-mail.yaml" $path) (ne ($.Values.mailServiceMode | default "external") "system") }}
{{- /* skipped: mail.serviceMode is {{ $.Values.mailServiceMode | default "external" }}, so this cluster relays and runs no mail stack of its own */ -}}
{{- else if and (hasSuffix "-llm.yaml" $path) (ne (toString ($.Values.llmEnabled | default "false")) "true") }}
{{- /* skipped: this cluster serves no models */ -}}
{{- else }}
---
{{- $text := $.Files.Get $path
     | replace "env: dev" (printf "env: %s" $.Values.stage)
     | replace "targetRevision: develop" (printf "targetRevision: %s" $.Values.targetRevision)
     | replace "gentian.os.revision.placeholder" $.Values.targetRevision
     | replace "kernel.domain.placeholder" $.Values.kernelDomain
     | replace "https://github.com/gentian-org/gentian-os" $.Values.gentianOsRepo
     | replace "deployments.repo.placeholder" $.Values.deploymentsRepo
     | replace "deployments.revision.placeholder" $.Values.deploymentsRevision
     | replace "deployments.cluster.placeholder" $.Values.deploymentsCluster
     | replace "storage.class.placeholder" ($.Values.storageClass | default "")
     | replace "mail.relay.placeholder" ($.Values.relayHost | default "")
     | replace "mail.egress.placeholder" ($.Values.egressHost | default "")
     | replace "llm.mock.backend.placeholder" (ternary "false" "true" (eq (toString ($.Values.llmGpuAcceleration | default "false")) "true"))
     | replace "llm.external.providers.placeholder" (toString ($.Values.llmExternalProviders | default "false")) }}
{{- range $fn, $name := $ns }}{{ $text = replace (printf "ns.%s.placeholder" $fn) $name $text }}{{ end }}
{{- range $fn, $name := $sys }}{{ $text = replace (printf "sys.%s.placeholder" $fn) $name $text }}{{ end }}
{{- if contains ".placeholder" $text }}{{ fail (printf "%s: an unresolved placeholder remains" $path) }}{{ end }}
{{ $text }}
{{- end }}
{{- end }}
