---
# Manages the Tofu Controller Helm release under ArgoCD.
#
# Chart: oci://ghcr.io/flux-iac/tofu-controller v0.16.1 (public OCI registry)
# Repo registered in argocd namespace: ghcr-flux-iac (enableOCI=true, no auth needed)
#
# Safety guards:
#   prune: false          — ArgoCD never auto-deletes the controller deployment
#   finalizers: []        — removing this Application from Git does NOT cascade-delete
#   selfHeal: true        — drift in values.yaml is reconciled automatically
#
# Adoption: The controller was originally installed via `helm install tofu-controller
# oci://ghcr.io/flux-iac/tofu-controller --set awsPackage.install=false`.
# ArgoCD detects the existing Helm release (sh.helm.release.v1.tofu-controller.*) and
# takes ownership without reinstalling. Verify with:
#   argocd app get tofu-controller
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tofu-controller
  namespace: argocd
  finalizers: []   # intentionally empty — never cascade-delete the controller
spec:
  project: gentian
  sources:
  # Source 1: Tofu Controller Helm chart from ghcr.io/flux-iac OCI registry
  - repoURL: ghcr.io/flux-iac/charts
    chart: tofu-controller
    targetRevision: "0.16.1"
    helm:
      valueFiles:
      - $values/values/tofu-controller.yaml
  # Source 2: Values file from Git (referenced as $values by Source 1)
  - repoURL: https://github.com/gentian-org/server
    targetRevision: develop
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: tofu-system
  syncPolicy:
    automated:
      prune: false     # never auto-delete — tofu-controller manages Terraform workspaces
      selfHeal: true   # drift is reconciled automatically
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
