# The bootstrap Applications are parameterised on these values. Namespaces are
# not among them: every destination is resolved from kernel/namespaces.yaml,
# which the installer copies in as `namespaces` (see B-01), so an Application
# cannot name a namespace the layout does not have.
gentianOsBranch: develop
osRepo: https://github.com/gentian-org/gentian-os
storageClass: ""

# Who hosts the zone, for external-dns; an entry in kernel/platforms.yaml.
# "none" emits no external-dns Application.
dnsProvider: none
dnsProviders: {}
kernelDomain: ""
# The cluster's id in gentian-deployments: what external-dns owns records as,
# so two clusters never fight over one zone.
cluster: ""
# How traffic reaches this cluster (the Cluster claim's networkMode):
# tunnel (the claim's default), or static-ip.
networkMode: tunnel

# Filled by the installer from kernel/namespaces.yaml. Never set by hand.
namespaces: {}

# Pins the installer copies in from versions.yaml (B-01). Never set by hand.
versions:
  headlamp:
    chart: ""
    repo: ""

# The realm the kernel signs people in against. Tenants have their own.
kernelRealm: kernel

headlamp:
  oidc:
    # On once the kernel realm carries the headlamp client and its secret;
    # a fresh cluster starts with token login, which is enough to look at a
    # cluster that has no realm yet. The portal login step turns it on.
    enabled: false
    proxy:
      # The maintained fork of jetstack's kube-oidc-proxy, which the archived
      # original names as its successor.
      image: docker.io/tremolosecurity/kube-oidc-proxy:1.0.13
      # Where the image keeps the public roots that verify the issuer.
      caFile: /etc/ssl/certs/ca-certificates.crt

edge:
  # The perimeter Gateway the operator reconciles in the edge namespace: the
  # ACME HTTP-01 solver's routes attach to its :80 listener.
  gatewayName: perimeter

# The stage and the deployments repository, for the ApplicationSets.
stage: dev
deployments:
  repo: ""
  revision: main
  cluster: ""
# The app of apps is applied by C-02, once its children's prerequisites exist.
appsets:
  enabled: false

# What the kernel-services ConfigMap says beyond the layout.
tenancyMode: multi
acmeStaging: "true"
smtpHost: ""

# Whether this cluster serves LLM, from the Cluster claim's llm.enabled. The
# portal turns it into a capability, and a tile appears only for a capability
# the cluster actually has.
llmEnabled: "false"

# The desktop -- a component every tenant gets from the profile the operator
# chart ships (ui-restructure.md §1). What the bootstrap decides is which
# branch's chart that profile names: a prerelease per branch on a dev cluster,
# and only some branches publish.
desktop:
  chartBranch: develop
  # An exact chart version, which is what a cluster runs once the realm
  # exists: the kernel realm step resolves the branch's newest immutable
  # version and sets it here, because a Helm release under an unchanged
  # version string is never upgraded, so the moving version can only ever
  # install the first build it saw.
  chartVersion: ""

# The operator (and, with it, the director) — applied by D-01, once the
# identity services its reconcilers address exist.
# The administration console's chart, published by gentian-ui beside the
# desktop's. D-03 resolves the moving prerelease for the branch into the
# immutable version it names and passes that as chartVersion; empty falls back
# to the moving one, which installs but never upgrades.
adminConsole:
  chartBranch: develop
  chartVersion: ""
# The concierge's chart, from the same repository and branch, pinned the same
# way.
concierge:
  chartBranch: develop
  chartVersion: ""

operator:
  enabled: false
  image: ghcr.io/gentian-org/gentian-os
  # An exact published tag. The installer sets it to the image built from the
  # checkout's own commit (`<branch>-<sha>`), so the manifests Argo CD syncs
  # and the binary the kubelet pulls come from one commit. Empty falls back to
  # the branch tag, which moves and therefore never rolls a Deployment by
  # itself.
  tag: ""

# The licence report (docs/design/operations.md): once a day the operator
# tells an address what this cluster runs -- its tenants, counts of accounts,
# and the apps installed through the App Store. No personal data, and nothing
# on the cluster depends on the answer.
licenceReport:
  # On unless the installer is told otherwise (--no-licence-report, or
  # GENTIAN_NO_LICENCE_REPORT=1 in install.env). Off, nothing is sent and the
  # App Store is not offered.
  enabled: "true"
  # The default report address. This is the one place it is written: the
  # operator and its chart name no address of their own, and a cluster
  # installed any other way reports nowhere. It can be changed
  # (GENTIAN_LICENCE_REPORT_URL in install.env, which arrives as `url` below)
  # or turned off (above).
  defaultUrl: https://licence.sovrence.com/api/v1/licence-reports
  # Another address for this cluster, from the installer. Empty is the default.
  url: ""

# The ClusterIssuer tenant wildcard certificates are requested from. The
# installer sets it to the issuer it created; empty leaves the stage
# profile's, or the operator chart's default.
tenantDNS01ClusterIssuer: ""

# Which mail stack this cluster runs, from the Cluster claim
# (spec.mail.serviceMode). `system` deploys Postfix and Dovecot into the system
# tier; `external` relays through a provider and deploys neither.
mailServiceMode: external
# The name mail leaves from, when the cluster sends from an address it owns
# (spec.mail.egressHost). Empty means the shared egress or a smarthost.
mailEgressHost: ""

# Whether the shared stores of the system tier -- PostgreSQL, MariaDB, Redis,
# MinIO -- each get the NetworkPolicy that says who may connect to them. On by
# default. "false" removes all four, and a connection is then checked by its
# credentials alone. The installer passes STORE_NETWORK_POLICIES.
storeNetworkPolicies: "true"

# The long key ids Argo CD accepts commits from on the deployments repository
# (AD-2). Passed by the installer, which reads them out of
# clusters/<id>/kernel/signing/keys.env in the deployments checkout -- so what
# the cluster trusts and what the repository says it trusts are one list.
#
# Empty renders no sourceIntegrity policy at all. That is a cluster which has
# not been given keys, not a cluster which trusts everyone by choice: an empty
# key list on an armed policy would refuse every sync, including the one that
# would fix it.
signing:
  keys: []

# On the switches above (appsets.enabled, operator.enabled,
# headlamp.oidc.enabled): the templates compare them to "true" rather than
# testing them for truth. The installer passes every value with --set-string,
# and in a template the string "false" is true -- any non-empty string is. A
# fresh cluster rendered the operator, the appsets and Headlamp's OIDC in B-01,
# phases before any of them could work, and Headlamp waited on a Secret only
# D-03 writes.
