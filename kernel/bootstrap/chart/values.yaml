# The three values the bootstrap Applications are parameterised on.
#
# They were substituted by an allowlisted envsubst, allowlisted because these
# manifests also carry Argo CD's $values expressions and a substitute-everything
# run would silently blank them. Helm has no such hazard: $values is not its
# syntax, so nothing needs listing and nothing can be blanked by omission.
gentianOsBranch: develop
storageClass: ""
stage: dev

# The operator and portal Applications carry more provenance than the six above:
# where the code comes from, where the deployments live, and which cluster and
# stage this is.
osRepo: https://github.com/gentian-org/gentian-os
osImageRepository: ghcr.io/gentian-org/gentian-os
deploymentsRepo: ""
deploymentsBranch: main
uiBranch: develop
portalImageTag: develop
cluster: ""

# The app catalogue: where profile bundles come from.
appsRepo: https://github.com/gentian-org/gentian-apps
appsBranch: main

# The root ApplicationSet's own parameters.
kernelDomain: ""
smtpHost: ""
smtpPort: "587"
