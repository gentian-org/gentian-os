{{- $storage := toString ((.Values.openbao).storage | default "file") }}
{{- if not (has $storage (list "raft" "file")) }}
{{- fail (printf "openbao.storage is %q; it is raft or file" $storage) }}
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao
  namespace: {{ include "ns" (list . "gitops") }}
  finalizers: []
spec:
  project: gentian
  sources:
  - repoURL: https://openbao.github.io/openbao-helm
    chart: openbao
    targetRevision: "0.25.5"
    helm:
      valueFiles:
      - $values/kernel/openbao/values.yaml
      parameters:
      - name: server.dataStorage.storageClass
        value: {{ .Values.storageClass | quote }}
      # The server configuration is HCL inside a values string, so the seal's
      # address cannot be set as a parameter. It is rendered here from the
      # layout and merged last; everything else stays in kernel/openbao/values.yaml.
      valuesObject:
        server:
          standalone:
            config: |
              ui = true

              listener "tcp" {
                tls_disable     = 0
                tls_cert_file   = "/openbao/tls/tls.crt"
                tls_key_file    = "/openbao/tls/tls.key"
                address         = "[::]:8200"
                cluster_address = "[::]:8201"
              }
              {{- if eq $storage "raft" }}
              # Integrated storage, one node. The node's id is the pod's name,
              # and its cluster address the chart's BAO_CLUSTER_ADDR
              # (https://openbao-0.openbao-internal:8201). A migrated volume
              # holds the file backend's directories beside vault.db and raft/;
              # Raft reads neither (docs/guides/recovery.md §5).
              storage "raft" {
                path    = "/openbao/data"
                node_id = "openbao-0"
              }
              {{- else }}
              # A directory of files: a cluster whose claim does not state
              # openbao.storage: raft. No consistent online snapshot exists for
              # it; docs/guides/recovery.md §5 moves it to Raft.
              storage "file" {
                path = "/openbao/data"
              }
              {{- end }}

              # Transit auto-unseal — primary is unsealed by openbao-transit.
              # Token is read from the AUTOUNSEAL_TOKEN environment variable which is
              # populated from the openbao-transit-token Kubernetes Secret.
              seal "transit" {
                address    = "http://openbao-transit.{{ include "ns" (list $ "seal") }}.svc.cluster.local:8200"
                key_name   = "autounseal"
                mount_path = "transit/"
              }
  - repoURL: {{ default "https://github.com/gentian-org/gentian-os" .Values.osRepo }}
    targetRevision: {{ include "gentianOsRevision" . }}
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ include "ns" (list . "secrets") }}
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
  ignoreDifferences:
  - group: apps
    kind: StatefulSet
    jsonPointers:
    - /spec/volumeClaimTemplates
