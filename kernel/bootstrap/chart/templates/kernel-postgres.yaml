---
# kernel-postgres: the CNPG cluster for Keycloak, its extensions, OpenFGA and
# the console. Kernel identity does not share a data plane with tenants; the
# tenant engines are system-* namespaces composed from the Cluster claim.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kernel-postgres
  namespace: {{ include "ns" (list . "gitops") }}
  finalizers: []
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: gentian
  source:
    repoURL: {{ default "https://github.com/gentian-org/gentian-os" .Values.osRepo }}
    targetRevision: {{ .Values.gentianOsBranch }}
    path: kernel/data/kernel-postgres
    helm:
      parameters:
      - name: storageClass
        value: {{ .Values.storageClass | quote }}
      {{- /* The NetworkPolicy on the server's pods: the same switch as the
           stores' (storeNetworkPolicies), compared as a string the way it is
           for them, and the namespaces of its clients from the layout. */}}
      - name: networkPolicy.enabled
        value: {{ ternary "false" "true" (eq (toString .Values.storeNetworkPolicies) "false") | quote }}
      - name: networkPolicy.namespaces.authentication
        value: {{ include "ns" (list . "authentication") }}
      - name: networkPolicy.namespaces.authorization
        value: {{ include "ns" (list . "authorization") }}
      - name: networkPolicy.namespaces.control
        value: {{ include "ns" (list . "control") }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ include "ns" (list . "data") }}
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
