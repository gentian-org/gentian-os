---
# The vault listens with TLS from the first byte. Applied directly by B-01,
# not through an Application: it is a prerequisite of the vault's pod
# starting at all.
#
# Two stages, so that what clients trust does not move. A self-signed CA,
# openbao-ca, valid ten years, signs the vault's serving certificate
# openbao-tls, which cert-manager renews as usual. Everything that verifies
# the vault trusts ca.crt -- External Secrets' stores, the custodian, and the
# internal CA's ClusterIssuer, through the copy B-01 keeps in cert-manager's
# namespace (openbao-ca-bundle). The serving certificate used to be
# self-signed itself, so the anchor changed, key and all, at every renewal.
#
# The CA's key stays in this namespace's Secret openbao-ca-tls, as the
# serving key stays in openbao-tls; only certificates are copied out.
{{- $ns := include "ns" (list . "secrets") }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: openbao-selfsigned
  namespace: {{ $ns }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-ca
  namespace: {{ $ns }}
spec:
  isCA: true
  commonName: openbao-ca
  subject:
    organizations:
      - gentian-os
  secretName: openbao-ca-tls
  # Ten years: renewing it is handing a new anchor to everything above.
  duration: 87600h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    # A renewal keeps the key, so a copy of the old certificate still
    # verifies what the new one signs.
    rotationPolicy: Never
  issuerRef:
    kind: Issuer
    name: openbao-selfsigned
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: openbao-ca
  namespace: {{ $ns }}
spec:
  ca:
    secretName: openbao-ca-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-tls
  namespace: {{ $ns }}
spec:
  dnsNames:
    - openbao.{{ $ns }}.svc.cluster.local
    - openbao.{{ $ns }}.svc
    - openbao
    - localhost
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: Issuer
    name: openbao-ca
  secretName: openbao-tls
