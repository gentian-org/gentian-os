---
# Reloader restarts workloads when a Secret rotates: part of the secrets path,
# so it lives with ESO and OpenBao.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reloader
  namespace: {{ include "ns" (list . "gitops") }}
  finalizers: []
spec:
  project: gentian
  sources:
  - repoURL: {{ .Values.versions.reloader.repo }}
    chart: reloader
    targetRevision: {{ .Values.versions.reloader.chart | quote }}
    helm:
      valueFiles:
      - $values/kernel/values/reloader.yaml
  - repoURL: {{ default "https://github.com/gentian-org/gentian-os" .Values.osRepo }}
    targetRevision: {{ include "gentianOsRevision" . }}
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ include "ns" (list . "secrets") }}
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
