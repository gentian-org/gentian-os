---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: gentian
  namespace: {{ include "ns" (list . "gitops") }}
spec:
  description: Gentian OS kernel, system and tenant deployments
  {{- $osRepo := .Values.osRepo | default "https://github.com/gentian-org/gentian-os" }}
  sourceRepos:
  - {{ $osRepo | quote }}
  - {{ printf "%s/*" $osRepo | quote }}
  # The deployments repository: the claims and tenants Argo syncs from it.
  {{- if .Values.deployments.repo }}
  - {{ .Values.deployments.repo | quote }}
  {{- end }}
  - {{ .Values.appsRepo | default "https://github.com/gentian-org/gentian-apps" | quote }}
  - {{ .Values.uiRepo | default "https://github.com/gentian-org/gentian-ui" | quote }}
  - https://openbao.github.io/openbao-helm
  - ghcr.io/cloudnative-pg/charts
  - ghcr.io/stakater/charts
  - https://kubernetes-sigs.github.io/external-dns/
  - https://kyverno.github.io/kyverno/
  - https://kubernetes-sigs.github.io/headlamp/
  # Every kernel and system namespace, by the layout. Shared and tenant
  # namespaces get their own projects with their own ceilings.
  #
  # The system tier is here because the data plane is delivered the same way
  # the kernel services are -- an Application per engine, synced by Argo into
  # the namespace the Cluster claim composed. An AppProject that listed only
  # the kernel namespaces refused those Applications with "destination is not
  # permitted", which reads as an Argo permission problem three layers from
  # the layout that caused it.
  destinations:
  {{- range .Values.namespaces.kernel }}
  - namespace: {{ .name | quote }}
    server: https://kubernetes.default.svc
  {{- end }}
  {{- range .Values.namespaces.system }}
  - namespace: {{ .name | quote }}
    server: https://kubernetes.default.svc
  {{- end }}
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
