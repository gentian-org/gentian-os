# OpenBao Transit Helm values
# ─────────────────────────────────────────────────────────────────────────────
# This instance acts solely as the auto-unseal engine for the primary OpenBao.
# It holds NO application secrets — only the single transit/keys/autounseal
# encryption key that auto-unseals the primary instance after any pod restart.
#
# Deliberately minimal:
#   - No UI             (not needed for a transit-only engine)
#   - No injector       (ESO handles app secrets; injector is for primary only)
#   - ClusterIP only    (only the primary OpenBao needs to reach this service)
#   - 1 Gi PVC          (tiny — only AEAD key material)
#
# Sealed by:  Shamir (1-of-1)  — keys stored in Bitwarden › gentian/openbao-transit
#                                 and in the openbao-transit-unseal k8s Secret.
# Unsealed:   automatically via the postStart hook below on every pod/node restart.
#             The unseal key is injected from the openbao-transit-unseal k8s Secret.
# ─────────────────────────────────────────────────────────────────────────────

server:
  ha:
    enabled: false

  # RollingUpdate ensures that when the pod template changes (e.g. new postStart
  # hook, new image), the pod is automatically restarted with the new spec.
  # OnDelete (the Helm chart default) caused reboots to restart pods with the
  # stale spec, leaving the postStart hook absent until a manual pod deletion.
  statefulSet:
    updateStrategy: RollingUpdate

  dataStorage:
    enabled: true
    # storageClass is deliberately NOT set here. This file is shared by every
    # cluster (ArgoCD reads it from gentian-os), and the right class differs per
    # cluster. install.sh resolves STORAGE_CLASS — explicit setting, else the
    # cluster default — and passes it as a Helm parameter from
    # kernel/bootstrap/openbao-transit-application.yaml.tmpl, which overrides
    # this file. Omitting it here means an out-of-band `helm install` still
    # lands on the cluster's default class rather than a name that may not exist.
    size: 1Gi
    accessMode: ReadWriteOnce

  # Report ready even when sealed or uninitialised so `kubectl wait` works
  # and the primary's seal backend can probe the health endpoint.
  readinessProbe:
    enabled: true
    path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204

  # Internal-only — primary OpenBao accesses this via cluster DNS.
  # No NodePort needed.
  service:
    type: ClusterIP

  ui:
    enabled: false

  # Inject the Shamir unseal key from the openbao-transit-unseal k8s Secret.
  # Created once by: kubectl create secret generic openbao-transit-unseal \
  #   -n openbao --from-literal=unseal-key=<key-from-bitwarden>
  extraSecretEnvironmentVars:
    - envName: TRANSIT_UNSEAL_KEY
      secretName: openbao-transit-unseal
      secretKey: unseal-key

  # Automatically unseal on every pod start (node reboot, rolling upgrade, etc.)
  # Waits for the listener, then unseals only if already initialized.
  # On a fresh install the vault is not yet initialized — exit cleanly so the
  # pod reaches Running and init-openbao-transit.sh can initialize it.
  # Idempotent: bao operator unseal is a no-op when already unsealed.
  #
  # Loop logic: `bao status` exits 0=unsealed, 1=uninitialized/error, 2=sealed.
  # We break as soon as the listener responds (RC 0 or 2); RC 0 means already
  # unsealed (nothing to do), RC 2 means sealed but reachable (proceed to
  # unseal).  Any other RC means the listener is not up yet — keep waiting.
  # Using the old `until bao status` pattern was wrong: it only exited the loop
  # on RC 0 (unsealed), so a sealed-but-running vault would spin for the full
  # 60s and exit without ever calling `bao operator unseal`.
  postStart:
    - /bin/sh
    - -c
    - |
      WAIT=0
      while true; do
        bao status >/dev/null 2>&1
        RC=$?
        [ $RC -eq 0 ] && exit 0    # already unsealed — nothing to do
        [ $RC -eq 2 ] && break     # sealed but listener is up — proceed
        WAIT=$((WAIT+1))
        [ $WAIT -ge 60 ] && exit 0 # listener not up in 60 s — exit safely
        sleep 1
      done
      bao status 2>/dev/null | grep -q 'Initialized.*true' || exit 0
      bao operator unseal "$TRANSIT_UNSEAL_KEY" || true

  standalone:
    config: |
      ui = false

      listener "tcp" {
        tls_disable     = 1
        address         = "[::]:8200"
        cluster_address = "[::]:8201"
      }
      storage "file" {
        path = "/openbao/data"
      }

# Injector is not needed — ESO handles secret syncing
injector:
  enabled: false
