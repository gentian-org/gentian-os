# A policy with no rules, kept under its name.
#
# Which app a pod belongs to is said by the operator: it sets the labels
# `gentianos.io/app` and `gentianos.io/tenant` on the pod templates of a
# release after the chart is rendered (internal/apprender, the label rule).
# Nothing at admission writes them, and an annotation of those names on a pod
# means nothing.
#
# The Application that syncs this directory does not prune
# (kernel/bootstrap/chart/templates/kyverno.yaml). A cluster that holds a
# policy of this name with rules keeps them until a commit changes the policy,
# so the policy stays here, empty, and is not removed.
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: gentian-promote-app-labels
  annotations:
    policies.kyverno.io/title: App labels are not set at admission
    policies.kyverno.io/category: Platform Integration
    policies.kyverno.io/severity: low
    policies.kyverno.io/description: >-
      Holds no rule. The labels gentianos.io/app and gentianos.io/tenant are
      set by the operator on the pod templates of a release, and nothing
      copies them from a pod's annotations.
    pod-policies.kyverno.io/autogen-controllers: none
spec:
  background: false
  rules: []
