# Baseline Kyverno policies for Gentian OS Stage 0 MAC.
# Platform namespaces are excluded; tenant workloads are validated at admission.
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: gentian-disallow-privileged
  annotations:
    policies.kyverno.io/title: Disallow privileged containers
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: true
  rules:
  - name: privileged-containers
    match:
      any:
      - resources:
          kinds:
          - Pod
    exclude:
      any:
      - resources:
          namespaces:
          - kube-system
          - kube-public
          - kube-node-lease
          - kyverno
          - cert-manager
          - cnpg-system
          - crossplane-system
          - argocd
          - openbao
          - stakater-system
          - envoy-gateway-system
          - platform-kernel
          - gentian-system
          - gpu-operator-resources
    validate:
      message: Privileged containers are not allowed in tenant workloads.
      pattern:
        spec:
          =(ephemeralContainers):
          - =(securityContext):
              =(privileged): "false"
          containers:
          - =(securityContext):
              =(privileged): "false"
          =(initContainers):
          - =(securityContext):
              =(privileged): "false"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: gentian-disallow-host-namespaces
  annotations:
    policies.kyverno.io/title: Disallow host namespaces
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: true
  rules:
  - name: host-namespaces
    match:
      any:
      - resources:
          kinds:
          - Pod
    exclude:
      any:
      - resources:
          namespaces:
          - kube-system
          - kyverno
          - cert-manager
          - cnpg-system
          - crossplane-system
          - argocd
          - openbao
          - stakater-system
          - envoy-gateway-system
          - platform-kernel
          - gentian-system
          - gpu-operator-resources
    validate:
      message: Host PID, IPC, and network namespaces are not allowed.
      pattern:
        spec:
          =(hostPID): "false"
          =(hostIPC): "false"
          =(hostNetwork): "false"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: gentian-require-non-root
  annotations:
    policies.kyverno.io/title: Require non-root containers
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: medium
spec:
  validationFailureAction: Enforce
  background: true
  rules:
  - name: run-as-non-root
    match:
      any:
      - resources:
          kinds:
          - Pod
    exclude:
      any:
      - resources:
          namespaces:
          - kube-system
          - kyverno
          - cert-manager
          - cnpg-system
          - crossplane-system
          - argocd
          - openbao
          - stakater-system
          - envoy-gateway-system
          - platform-kernel
          - gentian-system
          - gpu-operator-resources
      - resources:
          selector:
            matchLabels:
              mac-waiver.gentianos.io/gentian-require-non-root: "approved"
          # AND the tenant namespace must carry the same key, written only by
          # the operator from the PlatformSecurityPolicy allowlist. Without this
          # the pod label above was the entire check, so any chart could exempt
          # itself from this policy and the allowlist was never consulted.
          namespaceSelector:
            matchLabels:
              mac-waiver.gentianos.io/gentian-require-non-root: "approved"
    validate:
      message: Containers must run as non-root or declare runAsNonRoot.
      pattern:
        spec:
          =(securityContext):
            =(runAsNonRoot): "true"
          containers:
          - =(securityContext):
              =(runAsNonRoot): "true"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: gentian-disallow-host-path
  annotations:
    policies.kyverno.io/title: Disallow hostPath volumes
