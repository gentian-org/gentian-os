---
# MetalLB, as minikube's addon ships it (v0.9.6), cannot run under three of
# the baseline policies in gentian-baseline.yaml:
#
#   gentian-disallow-host-namespaces   the speaker answers ARP, which needs
#                                      the host's network
#   gentian-require-seccomp            neither workload sets a seccomp profile
#   gentian-restrict-capabilities      the speaker holds NET_ADMIN and NET_RAW,
#                                      and nothing drops ALL
#
# All three were met as admission denials on a real cluster, one after the
# other: lifting the first only uncovered the next.
#
# Each policy is named twice below. Kyverno derives a second rule, called
# autogen-<rule>, from every rule that matches Pods, and that derived rule is
# the one a DaemonSet or a Deployment is admitted against. The plain rule is
# listed as well for a Pod created on its own.
#
# The exception is confined to MetalLB's namespace. It belongs to clusters
# that run MetalLB and to no others, so it is kept apart from the policies
# every cluster shares; whatever installs it should keep it apart too.
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: metallb-speaker-host-network
  namespace: metallb-system
spec:
  match:
    any:
      - resources:
          namespaces: [metallb-system]
          kinds: [Pod, DaemonSet, Deployment]
  exceptions:
    - policyName: gentian-disallow-host-namespaces
      ruleNames: [host-namespaces, autogen-host-namespaces]
    - policyName: gentian-require-seccomp
      ruleNames: [seccomp, autogen-seccomp]
    - policyName: gentian-restrict-capabilities
      ruleNames: [restrict-capabilities, autogen-restrict-capabilities]
