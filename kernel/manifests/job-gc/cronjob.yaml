apiVersion: batch/v1
kind: CronJob
metadata:
  name: gentian-job-gc
  namespace: platform-kernel
  labels:
    app.kubernetes.io/managed-by: gentian-os
    gentianos.io/component: job-gc
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/managed-by: gentian-os
            gentianos.io/component: job-gc
        spec:
          serviceAccountName: gentian-job-gc
          restartPolicy: OnFailure
          containers:
            - name: gc
              image: bitnami/kubectl:1.32.3
              command: ["/bin/bash", "/scripts/gc.sh"]
              resources:
                limits:
                  cpu: 200m
                  memory: 256Mi
                requests:
                  cpu: 50m
                  memory: 128Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
          volumes:
            - name: scripts
              configMap:
                name: gentian-job-gc-script
                defaultMode: 0755
