{{- /*
The DNS provider's credential, materialised into cert-manager from OpenBao.

Replaces cloudflare-api-token-externalsecret.yaml, which was a standalone file
naming one provider in its filename, its object name, its Secret name and its KV
path — four places to change to add a second provider, and a file that had to be
kept in step with an issuer that referenced it from another directory.

The Secret name, the KV path and the fields all come from the same
kernel/platforms.yaml entry the solver does, so the issuer and the credential
cannot disagree about which Secret carries what.

ONE OBJECT, TWO RENDERERS. cert-manager and external-dns share the edge
namespace, and kernel/bootstrap/chart/templates/external-dns.yaml writes an
ExternalSecret of this same name there. When the two rendered different specs,
the last apply won: external-dns's carried only its mapped key, the issuers lost
`api-token`, and a production order hung on "key not found" while cleaning up
its first challenge. Both now render the same spec -- the provider's fields,
plus external-dns's mapped keys merged in -- so the order of applies does not
matter. scripts/tests/test-dns-credential-single-writer.sh holds them equal.
*/ -}}
{{- $_ := include "gentian.dns01.profile" . -}}
{{- $provider := .Values.dnsProvider | default "none" -}}
{{- $profile := index .Values.dnsProviders $provider | default dict -}}
{{- $cred := index $profile "credential" | default dict -}}
{{- $extdns := index $profile "externalDNS" | default dict -}}
{{- if $cred }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $cred.secretName }}
  namespace: {{ .Values.certManagerNamespace | default "cert-manager" }}
  labels:
    gentianos.io/dns-provider: {{ $provider }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: {{ $cred.secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
    {{- if index $extdns "enabled" | default false }}
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        {{- range $chartKey, $field := (index $extdns "secretKeys" | default dict) }}
        {{ $chartKey }}: '{{ "{{" }} index . {{ $field | quote }} }}'
        {{- end }}
    {{- end }}
  data:
    {{- range $field := $cred.fields }}
    - secretKey: {{ $field.key }}
      remoteRef:
        key: {{ $cred.vaultPath }}
        property: {{ $field.key }}
    {{- end }}
{{- end }}
