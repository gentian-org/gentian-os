# ExternalSecret that materializes the Cloudflare API token from OpenBao
# (`secret/gentian-os/kernel/dns/cloudflare`) into the cert-manager namespace
# as `cloudflare-api-token` (key `api-token`). The kernel wildcard
# Certificate's ClusterIssuer (`letsencrypt-dns01-cloudflare`) consumes this
# Secret to solve DNS-01 ACME challenges. See docs/architecture.md §2.5.
#
# Applied by install.sh during step 12b (after seed-openbao writes the token).
# Idempotent: re-applies cleanly on subsequent install.sh runs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
  labels:
    app.kubernetes.io/managed-by: gentian-install
    app.kubernetes.io/part-of: gentian-os
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: gentian-os/kernel/dns/cloudflare
        property: api-token
