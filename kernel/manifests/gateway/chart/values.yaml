namespace: envoy-gateway-system

# The address DNS points at. Empty leaves the cloud controller to allocate one,
# which is what NETWORK_MODE=tunnel wants.
nodeIp: ""

# Cloud whose LoadBalancer annotations the Service needs. The installer detects
# this from the nodes' spec.providerID and passes it in; "" emits no preset.
lbProvider: ""

# Free-form additions, applied on top of whatever the preset contributes, so a
# provider without a preset works without changing this chart.
extraAnnotations: {}

envoy:
  # Two, spread across hosts. externalTrafficPolicy is Local, so a node serves
  # only if a pod runs on it; one replica means one node can serve, and draining
  # it takes every hostname offline.
  replicas: 2
