apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kernel-postgres
  labels:
    gentianos.io/tier: kernel
    gentianos.io/function: data
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  instances: {{ .Values.instances }}
  storage:
    size: {{ .Values.storageSize }}
    {{- if .Values.storageClass }}
    storageClass: {{ .Values.storageClass }}
    {{- end }}
  postgresql:
    parameters:
      max_connections: "200"
  managed:
    roles:
      {{- range .Values.databases }}
      - name: {{ .role }}
        ensure: present
        login: true
        passwordSecret:
          name: kernel-postgres-role-{{ .name }}
      {{- end }}
