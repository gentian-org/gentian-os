instances: 1
storageClass: ""
storageSize: 10Gi

# The kernel's own databases: one role and one database per service, the
# role's password read from the vault by ESO (the path the seed writes) and
# kept equal to the Secret by CNPG. Kernel data lives here and nowhere else;
# tenant and app data live on the system engines.
databases:
  - name: keycloak
    role: keycloak_user
    passwordKey: keycloak_user_password
  - name: openfga
    role: openfga_user
    passwordKey: openfga_user_password
