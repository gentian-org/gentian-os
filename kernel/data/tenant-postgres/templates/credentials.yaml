{{- /*
  The two Secrets the cluster above and the operator need, both from the vault
  path seed-openbao.sh writes (gentian-os/kernel/database/cnpg). One value in
  one place: the superuser password is derived from the master password and
  never typed.
*/}}
---
# CNPG reads this on bootstrap to set the superuser's password.
#
# type MUST be kubernetes.io/basic-auth. With type Opaque, CNPG skips
# superuser provisioning entirely and says nothing; the symptom arrives later
# as every provisioning Job failing to authenticate.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-superuser
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: cnpg-superuser
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "{{ "{{" }} .username }}"
        password: "{{ "{{" }} .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: gentian-os/kernel/database/cnpg
        property: superuser_username
    - secretKey: password
      remoteRef:
        key: gentian-os/kernel/database/cnpg
        property: superuser_password
---
# What the operator's psql provisioning Jobs connect with.
#
# The four keys database_reconciler.go reads by name (postgresAdminSecret =
# "postgres-admin"): host, port, username, password. The host is the cluster's
# read-write Service in this namespace -- stated here because the Job runs in
# the tenant's namespace and cannot resolve a bare name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-admin
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: postgres-admin
    creationPolicy: Owner
    template:
      data:
        host: "postgres-rw.{{ .Release.Namespace }}.svc.cluster.local"
        port: "5432"
        username: "{{ "{{" }} .superuser_username }}"
        password: "{{ "{{" }} .superuser_password }}"
  data:
    - secretKey: superuser_username
      remoteRef:
        key: gentian-os/kernel/database/cnpg
        property: superuser_username
    - secretKey: superuser_password
      remoteRef:
        key: gentian-os/kernel/database/cnpg
        property: superuser_password
