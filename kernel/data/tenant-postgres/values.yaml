instances: 1
storageClass: ""
storageSize: 20Gi

# max_connections is higher than the kernel's. This one cluster serves every
# tenant's every app: each app gets a role and a database, and each app's pods
# hold their own pool. The kernel's serves four services with known shapes.
maxConnections: "400"

# Who may open a connection to the server's pods (templates/networkpolicy.yaml).
# On by default; needs a CNI that enforces NetworkPolicy, and has no effect on
# one that does not. Off removes the policy and leaves the passwords as the
# only check. The data-plane ApplicationSet passes `enabled` and the
# namespaces from the layout; the values here are what a `helm template` run
# by hand gets.
networkPolicy:
  enabled: true
  ports:
    # The port apps are handed (provisioner.PostgresPort), and the one
    # CloudNativePG's instance manager answers its operator on.
    postgresql: 5432
    status: 8000
  namespaces:
    control: kernel-control
    data: kernel-data
    s3: system-s3
