# =============================================================================
# Shared kernel PostgreSQL — Crossplane provider-helm Release
#
# Provisions PostgreSQL with bootstrap databases for Keycloak, Nubus, Nextcloud,
# and related kernel services.
#
# Values merge order (last wins):
#   1. postgresql-base-values ConfigMap — non-secret defaults
#   2. postgresql-dev-values ConfigMap — environment sizing
#   3. postgresql-sensitive-values Secret — passwords (ESO from OpenBao)
#
# Chart repository: charts/infra/packages/ (Helm index on GitHub raw).
# =============================================================================
apiVersion: helm.crossplane.io/v1beta1
kind: Release
metadata:
  name: opendesk-postgresql-dev
  annotations:
    # crossplane.io/external-name must match the Helm release name
    # so provider-helm adopts the existing release rather than creating a new one.
    crossplane.io/external-name: opendesk-postgresql-dev
    argocd.argoproj.io/sync-wave: "9"
spec:
  forProvider:
    chart:
      name: postgresql
      repository: https://raw.githubusercontent.com/gentian-org/gentian-os/develop/charts/infra/packages
      version: "2.1.2"
    namespace: gentian-infra-dev
    wait: true
    waitTimeout: "5m"
    valuesFrom:
      # 1. Base values (non-secret defaults, all environments)
      - configMapKeyRef:
          name: postgresql-base-values
          namespace: gentian-infra-dev
          key: values.yaml
          optional: false
      # 2. Dev-specific plain overrides (sizing, resource limits)
      - configMapKeyRef:
          name: postgresql-dev-values
          namespace: gentian-infra-dev
          key: values.yaml
          optional: false
      # 3. Sensitive values (ESO-synced from OpenBao database/postgresql).
      #    Includes postgres.password and the full job.users[] list with passwords.
      #    Merged LAST so passwords override any placeholder values above.
      - secretKeyRef:
          name: postgresql-sensitive-values
          namespace: gentian-infra-dev
          key: sensitive-values.yaml
          optional: false
  providerConfigRef:
    name: kubernetes
