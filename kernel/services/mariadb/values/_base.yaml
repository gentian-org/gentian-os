# =============================================================================
# MariaDB app-level defaults (all environments)
# =============================================================================
# Layer 2 of the values hierarchy (merged after values/env/{env}.yaml).
# Secrets and env-specific sizes belong in {env}/values.yaml.
# =============================================================================

# Image — chart default (registry-1.docker.io/library/mariadb:11.1.2-jammy).
# No override needed: opencode.de community mirror does not carry mariadb 10.6.21;
# chart 3.0.3 targets 11.1.2-jammy which is publicly available on Docker Hub.

# Container Security Context
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  enabled: true
  privileged: false
  runAsUser: 1001
  runAsGroup: 1001
  seccompProfile:
    type: RuntimeDefault
  readOnlyRootFilesystem: true
  runAsNonRoot: true

# Pod Security Context
podSecurityContext:
  enabled: true
  fsGroup: 1001
  fsGroupChangePolicy: OnRootMismatch

# Provisioning job — database schema (no secrets)
# OX uses root user and manages its own tables; configdb must exist before OX starts.
job:
  enabled: true
  retries: 10
  wait: 30
  databases:
    - name: configdb
      user: ""
    - name: openxchange_dummy
      user: openxchange_user
  # users[].password set in {env}/values.yaml (SOPS); connectionLimit repeated alongside it

# MariaDB server — root password injected via set_sensitive in stubs.tf (OpenBao → gentian/dev/mariadb.root_password)
mariadb:
  rootPassword:
    value: "PLACEHOLDER_OVERRIDDEN_BY_TOFU"

# Cleanup settings for provisioning job
cleanup:
  deletePodsOnSuccess: true
  deletePodsOnSuccessTimeout: 60

# Persistence defaults — size overridden per-env
# storageClass comes from values/env/{env}.yaml
persistence:
  enabled: true

# Global chart settings (storageClass/imagePullSecrets from values/env/{env}.yaml)
global:
  ingress:
    enabled: false
