apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mariadb-credentials
  namespace: gentian-infra-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: mariadb-credentials
    creationPolicy: Owner
  data:
    - secretKey: mariadb-root-password
      remoteRef:
        key: gentian-os/kernel/database/mariadb
        property: root_password
    - secretKey: openxchange-password
      remoteRef:
        key: gentian-os/kernel/database/mariadb
        property: openxchange_password
