---
# ClusterRoleBinding: grant tf-runner full cluster access for Helm releases.
# The runner needs to create/update/delete all resource types that the managed
# Helm charts produce (Deployments, StatefulSets, Services, RBAC, CRDs, etc.).
# TODO: scope to specific namespaces/verbs once chart resource types are audited.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tf-runner-cluster-admin
  labels:
    app.kubernetes.io/managed-by: tofu-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: tf-runner
    namespace: tofu-system
