# =============================================================================
# Tofu Controller workspace manifests — DEV
#
# As of Phase 2B of the Crossplane migration, all Helm releases that used to
# be managed by Tofu (postgresql, mariadb, nextcloud × 3, plus the nubus
# udm-listener-nats-patch and ldap-gentian-acl ConfigMaps) have been
# migrated to:
#   • Crossplane provider-helm Release CRs
#     (kernel/services/<chart>/manifests/<env>/release.yaml)
#   • Declarative install.sh kubectl-applied ConfigMaps
#     (crossplane/apps/nubus/patches/*)
#
# The infra-workspaces-dev Terraform CR has been retired.  The Tofu Controller
# itself stays installed (deployed by AppSet 05-tofu.yaml → globals app) until
# Phase 5, when the per-tenant operator subsumes the remaining tenant-tier
# workspaces (app-workspace, keycloak-config, ox-workspace).
#
# This file intentionally creates no resources — it exists to keep the
# AppSet 05-tofu.yaml path resolvable.
# =============================================================================
