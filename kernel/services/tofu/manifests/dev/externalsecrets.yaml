---
# ExternalSecret: OCI registry credentials for the Helm provider.
# The Tofu Controller uses these to pull charts from registry.opencode.de.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-credentials-tofu
  namespace: tofu-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: registry-credentials-tofu
    creationPolicy: Owner
  data:
    # Key names match the Terraform variable names so varsFrom can map them directly
    - secretKey: registry_username
      remoteRef:
        key: gentian/dev/registry
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: registry_password
      remoteRef:
        key: gentian/dev/registry
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# ExternalSecret: MinIO tofu-state bucket credentials.
# Injected as env vars (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY) into the
# runner pod so the S3 backend can authenticate to MinIO.
# Note: the minio-tofu-state user and bucket are created imperatively
# (see minio-setup note in docs). These credentials must match.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-tofu-state
  namespace: tofu-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: minio-tofu-state
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: gentian/dev/tofu-state
        property: access_key_id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: gentian/dev/tofu-state
        property: secret_access_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
