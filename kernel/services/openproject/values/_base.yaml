# =============================================================================
# OpenProject — app-level defaults (all environments)
# =============================================================================
# Aligned with opendesk/helmfile/apps/openproject/values.yaml.gotmpl.
# Non-sensitive values only — secrets are injected via app-workspace
# set_sensitive blocks (host/port/user/name via vm_db_* valueMapping keys,
# password and other credentials via vm_* keys).
#
# Chart: oci://registry.opencode.de/bmi/opendesk/components/supplier/openproject/charts-mirror
#   openproject v10.1.0
#
# External service requirements (must be provisioned before this chart is deployed):
#   - PostgreSQL: postgres-rw.platform-kernel.svc.cluster.local:5432
#     (provisioned by infra-workspaces/platform-kernel)
#   - Memcached: memcached.<tenant-ns>.svc.cluster.local:11211
#     (deployed as standalone chart in the tenant namespace)
# =============================================================================

# ── Disable bundled subcharts — use external services (opendesk pattern) ──────
# opendesk always deploys postgres and memcached as standalone charts in the
# same namespace. This avoids the bitnami Docker Hub image dependency.
postgresql:
  bundled: false
  # auth.username, auth.database, connection.host, connection.port are injected
  # via set_sensitive from OpenBao (vm_db_* value mapping keys).
  # auth.password is also injected via vm_db_password_key.

memcached:
  bundled: false
  connection:
    host: "memcached"
    port: 11211

# ── OpenProject image — from opendesk registry mirror ─────────────────────────
# Source: opendesk/helmfile/environments/default/images.yaml.gotmpl → openproject
image:
  registry: "registry.opencode.de"
  repository: "bmi/opendesk/components/supplier/openproject/images-mirror/open_desk"
  tag: "16.6.5@sha256:877ea14085ec04311d8d138d37eea43ba80f81228fdf7ed042715b8cf316178f"
  imagePullPolicy: "IfNotPresent"

# ── DB init container image — postgres from opendesk image spec ───────────────
# Source: opendesk/helmfile/environments/default/images.yaml.gotmpl → openprojectDbInit
dbInit:
  image:
    registry: "registry-1.docker.io"
    repository: "library/postgres"
    tag: "16.9-alpine3.20@sha256:e5507c984377515b8c9922b0eb19f55aba2063fdc7bccf268cefd53133f97054"
    imagePullPolicy: "IfNotPresent"

# ── Persistence disabled (opendesk pattern: files go to S3) ───────────────────
persistence:
  enabled: false

# ── LDAP seeder — static configuration (host/binduser/basedn in env-specific) ─
# Aligned with opendesk/helmfile/apps/openproject/values.yaml.gotmpl.
# OPENPROJECT_SEED_LDAP_OPENDESK_BINDPASSWORD is injected as set_sensitive
# via valueMapping.ldap.bindPasswordKey (app-workspace Terraform template).
# HOST, BINDUSER, BASEDN, and GROUPFILTER_OPENDESK_BASE are env-specific.
environment:
  OPENPROJECT_SEED_LDAP_OPENDESK_PORT: "389"
  OPENPROJECT_SEED_LDAP_OPENDESK_SECURITY: "plain_ldap"
  OPENPROJECT_SEED_LDAP_OPENDESK_SYNC__USERS: "true"
  OPENPROJECT_SEED_LDAP_OPENDESK_FILTER: "(&(objectClass=opendeskProjectmanagementUser)(opendeskProjectmanagementEnabled=TRUE))"
  OPENPROJECT_SEED_LDAP_OPENDESK_LOGIN__MAPPING: "uid"
  OPENPROJECT_SEED_LDAP_OPENDESK_FIRSTNAME__MAPPING: "givenName"
  OPENPROJECT_SEED_LDAP_OPENDESK_LASTNAME__MAPPING: "sn"
  OPENPROJECT_SEED_LDAP_OPENDESK_MAIL__MAPPING: "mailPrimaryAddress"
  OPENPROJECT_SEED_LDAP_OPENDESK_ADMIN__MAPPING: "opendeskProjectmanagementAdmin"
  OPENPROJECT_SEED_LDAP_OPENDESK_GROUPFILTER_OPENDESK_FILTER: "(&(objectClass=opendeskProjectmanagementGroup)(opendeskProjectmanagementEnabled=TRUE))"
  OPENPROJECT_SEED_LDAP_OPENDESK_GROUPFILTER_OPENDESK_SYNC__USERS: "true"
  OPENPROJECT_SEED_LDAP_OPENDESK_GROUPFILTER_OPENDESK_GROUP__ATTRIBUTE: "cn"

# ── S3 object storage ─────────────────────────────────────────────────────────
# s3.auth.secretAccessKey injected via vm_s3_secret_key_key.
# Endpoint, bucket, access key are non-sensitive and set in env-specific values.

# ── Resource requests/limits ──────────────────────────────────────────────────
# openprojectAppInit is the wait-for-db init container which runs a full Rails
# process to check DB connectivity—requires more memory than the LimitRange
# default of 512Mi. Aligned with opendesk resources.yaml.gotmpl defaults.
resources:
  openprojectAppInit:
    limits:
      cpu: "2"
      memory: "2Gi"
    requests:
      cpu: "100m"
      memory: "768Mi"
  openprojectDbInit:
    limits:
      cpu: "1"
      memory: "256Mi"
    requests:
      cpu: "100m"
      memory: "256Mi"
  openproject:
    limits:
      cpu: "4"
      memory: "4Gi"
    requests:
      cpu: "500m"
      memory: "2Gi"
