# =============================================================================
# OpenProject — dev environment overrides
# =============================================================================
# Dev-specific configuration: service hostnames, S3 endpoint, sizing.
# All non-sensitive values. Secrets injected by app-workspace via set_sensitive.
# =============================================================================

# ── S3 / MinIO connection (dev cluster) ───────────────────────────────────────
# s3.auth.secretAccessKey injected via valueMapping.s3.secretKeyKey.
s3:
  enabled: true
  endpoint: "http://minio-dev.gentian-infra-dev.svc.cluster.local:9000"
  region: "us-east-1"
  host: "minio-dev.gentian-infra-dev.svc.cluster.local"
  port: 9000
  use_ssl: false
  auth:
    accessKeyId: "openproject_user"
    bucket: "openproject"

# ── LDAP seeder — dev-specific connection details ─────────────────────────────
# Static LDAP env vars (PORT, SECURITY, FILTER, attribute mappings) are in _base.yaml.
# BINDPASSWORD is injected via set_sensitive from OpenBao (valueMapping.ldap.bindPasswordKey).
environment:
  OPENPROJECT_SEED_LDAP_OPENDESK_HOST: "nubus-dev-ldap-server.gentian-dev.svc.cluster.local"
  OPENPROJECT_SEED_LDAP_OPENDESK_BINDUSER: "uid=ldapsearch_openproject,cn=users,dc=swp-ldap,dc=internal"
  OPENPROJECT_SEED_LDAP_OPENDESK_BASEDN: "dc=swp-ldap,dc=internal"
  OPENPROJECT_SEED_LDAP_OPENDESK_GROUPFILTER_OPENDESK_BASE: "dc=swp-ldap,dc=internal"
