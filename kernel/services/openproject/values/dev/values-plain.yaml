# =============================================================================
# OpenProject — dev environment overrides
# =============================================================================
# Dev-specific configuration: service hostnames, S3 endpoint, sizing.
# All non-sensitive values. Secrets injected by app-workspace via set_sensitive.
# =============================================================================

# ── S3 / MinIO connection (dev cluster) ───────────────────────────────────────
# s3.auth.secretAccessKey injected via valueMapping.s3.secretKeyKey.
s3:
  enabled: true
  endpoint: "http://minio-dev.gentian-infra-dev.svc.cluster.local:9000"
  region: "us-east-1"
  host: "minio-dev.gentian-infra-dev.svc.cluster.local"
  port: 9000
  use_ssl: false
  auth:
    accessKeyId: "openproject_user"
    bucket: "openproject"
