# =============================================================================
# gentian-ui shell-prefs — base values (all environments)
#
# Per-user shell preferences (M3 slice: desktop background image).
# Stores files on a PVC; auth via UMC session-info POST.
#
# Chart source: gentian-ui helm/shell-prefs
# Image:        ghcr.io/gentian-org/shell-prefs
# Automated:    .github/workflows/shell-prefs.yaml builds on push to develop/main
#               and auto-patches this file with the new SHA tag.
# =============================================================================

ingress:
  enabled: true
  host: "portal.desk.gentian.org"
  ingressClassName: "nginx"
  path: "/univention/shell-prefs"
  pathType: "Prefix"
  tls:
    enabled: true
    secretName: "wildcard-tls"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "6m"

image:
  registry: "ghcr.io"
  repository: "gentian-org/shell-prefs"
  tag: "b12f19e0"

env:
  listenAddr: ":8081"
  dataDir: "/data/shell-prefs"

persistence:
  enabled: true
  size: 1Gi
