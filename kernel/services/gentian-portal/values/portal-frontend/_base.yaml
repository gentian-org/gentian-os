# =============================================================================
# gentian-ui portal-frontend — base values (all environments)
#
# Replaces nubusPortalFrontend from the nubus umbrella chart.  The portal-
# server and portal-consumer sub-charts remain inside the nubus umbrella.
#
# Key wiring:
#   fullnameOverride    → matches the old nubus sub-chart service name so that
#                         any in-cluster consumers using nubus-dev-portal-frontend
#                         continue to resolve correctly.
#   ingress             → same host, TLS secret, and redirect paths as the
#                         disabled nubusPortalFrontend ingress.
#   extraIngresses      → base-domain-redirect preserved from nubusPortalFrontend.
# =============================================================================

global:
  imageRegistry: "artifacts.software-univention.de"
  imagePullSecrets:
    - registry-credentials
  # globalIngressClass is picked up by common.ingress helpers
  ingressClass: "nginx"

# Keep the service/deployment name identical to the old nubus sub-chart
# so any in-cluster references (e.g. central-navigation, tests) keep working.
fullnameOverride: "nubus-dev-portal-frontend"

portalFrontend:
  environment: "production"
  logLevel: "WARNING"
  objectStorage:
    iconsProxyUrl: "http://minio-dev.gentian-infra-dev.svc.cluster.local:9000/ums/portal-assets/icons/"

ingress:
  enabled: true
  host: "portal.desk.gentian.org"
  ingressClassName: "nginx"
  certManager:
    enabled: false
  tls:
    enabled: true
    secretName: "wildcard-tls"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "128k"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "64k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    nginx.ingress.kubernetes.io/proxy-busy-buffers-size: "128k"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
  items:
    - name: rewrites
      paths:
        - path: /univention/(portal|selfservice)/$
          pathType: ImplementationSpecific
        - path: /univention/(portal|selfservice)/index.html$
          pathType: ImplementationSpecific
        - path: /univention/(portal|selfservice)/(css|fonts|i18n|media|js|oidc|custom)(/.*)$
          pathType: ImplementationSpecific
        - path: /univention/(portal)/(icons)(/.*)$
          pathType: ImplementationSpecific
        - path: /univention/(portal|selfservice)/(sse-worker.js)$
          pathType: ImplementationSpecific
      annotations:
        nginx.ingress.kubernetes.io/rewrite-target: "/$2$3"
        nginx.ingress.kubernetes.io/use-regex: "true"
        nginx.ingress.kubernetes.io/affinity: "none"
    - name: redirects
      paths:
        - pathType: ImplementationSpecific
          path: /univention/portal$
        - pathType: ImplementationSpecific
          path: /univention/selfservice$
      annotations:
        nginx.ingress.kubernetes.io/permanent-redirect: "/univention/portal/"

# Canonical login at /login/ (gentian-login). Root and legacy Nubus login paths
# redirect here; the portal SPA remains at /univention/portal/ after authentication.
extraIngresses:
  - name: entry-to-login
    host: "portal.desk.gentian.org"
    paths:
      - pathType: ImplementationSpecific
        path: /$
      - pathType: ImplementationSpecific
        path: /univention$
      - pathType: ImplementationSpecific
        path: /univention/$
    ingressClassName: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/permanent-redirect: "/login/"
      nginx.ingress.kubernetes.io/use-regex: "true"
    tls:
      enabled: true
      secretName: "wildcard-tls"
  - name: legacy-login-redirect
    host: "portal.desk.gentian.org"
    paths:
      - pathType: Prefix
        path: /univention/login
    ingressClassName: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/permanent-redirect: "/login/"
    tls:
      enabled: true
      secretName: "wildcard-tls"
  - name: base-domain-redirect
    host: "desk.gentian.org"
    paths:
      - pathType: ImplementationSpecific
        path: /
    ingressClassName: "public"
    annotations:
      nginx.ingress.kubernetes.io/permanent-redirect: "https://portal.desk.gentian.org/login/"
      nginx.ingress.kubernetes.io/use-regex: "true"
    tls:
      enabled: true
      secretName: "wildcard-tls"

podAnnotations:
  reloader.stakater.com/auto: "true"

# Custom gentian-ui portal-frontend image built from github.com/gentian-org/gentian-ui.
# Built by: frontend/Dockerfile.cluster (public base images — no Univention internal registry needed)
# Registry:  ghcr.io/gentian-org/portal-frontend
# Automated: .github/workflows/portal-frontend.yaml builds on push to develop/main
#            and auto-patches this file with the new SHA tag.
# Update:    docker build -f frontend/Dockerfile.cluster -t ghcr.io/gentian-org/portal-frontend:<sha> ./frontend
#            docker push ghcr.io/gentian-org/portal-frontend:<sha>
#            then update tag: "3fd3370a"
image:
  registry: "ghcr.io"
  repository: "gentian-org/portal-frontend"
  tag: "d62fbb89"
