# =============================================================================
# gentian-ui base-router — base values (all environments)
#
# The base-router is a lightweight Go HTTP service that detects the visitor's
# device type (pointer coarse + viewport width) and issues a 302 redirect to
# the appropriate Gentian base:
#   /#/u/gentian-desktop  or  /#/u/gentian-mobile
#
# A ?base=<name> query parameter from the login page overrides auto-detection
# (useful for testing mobile layout from a desktop browser).
#
# Chart source: gentian-ui helm/base-router
# Image:        ghcr.io/gentian-org/base-router
# Automated:    .github/workflows/base-router.yaml builds on push to develop/main
#               and auto-patches this file with the new SHA tag.
# =============================================================================

ingress:
  enabled: true
  host: "portal.desk.gentian.org"
  ingressClassName: "nginx"
  path: "/u/base-router"
  pathType: "Prefix"
  tls:
    enabled: true
    secretName: "wildcard-tls"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "4k"

# Custom base-router image built from github.com/gentian-org/gentian-ui.
# Built by: backend/base-router/Dockerfile (distroless, CGO disabled)
# Registry:  ghcr.io/gentian-org/base-router
# Automated: .github/workflows/base-router.yaml builds on push to develop/main
#            and auto-patches this file with the new SHA tag.
# Update:    docker build -t ghcr.io/gentian-org/base-router:<sha> backend/base-router
#            docker push ghcr.io/gentian-org/base-router:<sha>
#            then update tag: "36fbe687"
image:
  registry: "ghcr.io"
  repository: "gentian-org/base-router"
  tag: "36fbe687"
