# =============================================================================
# collabora — ESO ExternalSecret (Pattern B)
#
# Renders the admin password as a single sensitive-values.yaml Helm values
# file consumed by the Release CR via valuesFrom.secretKeyRef.
#
# Sources:
#   gentian-os/kernel/apps/collabora  (admin_password)
#
# The admin password is used only for the Collabora web admin panel —
# end users never see it. It must be seeded in OpenBao before ArgoCD syncs.
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: collabora-sensitive-values
  namespace: gentian-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: collabora-sensitive-values
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        sensitive-values.yaml: |
          collabora:
            password: {{ .admin_password | quote }}
  data:
    - secretKey: admin_password
      remoteRef:
        key: gentian-os/kernel/apps/collabora
        property: admin_password
