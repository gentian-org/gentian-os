# =============================================================================
# collabora — shared Ingress
#
# Single cluster-wide ingress for the Collabora kernel service.
# All tenants with office.enabled=true share this endpoint.
#
# Internal WOPI URL (used by Nextcloud backend):
#   http://collabora.gentian-dev.svc.cluster.local:9980
# Public WOPI URL (advertised to browsers):
#   https://office.desk.gentian.org
#
# The upstream-hash-by annotation ensures that each document editing session
# is consistently routed to the same Collabora pod (sticky sessions by WOPI
# source document URL), which is required for correct collaborative editing.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: collabora
  namespace: gentian-dev
  annotations:
    argocd.argoproj.io/sync-wave: "12"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$arg_WOPISrc"
    nginx.ingress.kubernetes.io/proxy-body-size: "100M"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/server-snippet: |
      location /cool/getMetrics { deny all; return 403; }
      location /cool/adminws/ { deny all; return 403; }
      location /browser/dist/admin/admin.html { deny all; return 403; }
spec:
  ingressClassName: nginx
  rules:
    - host: office.desk.gentian.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: collabora
                port:
                  number: 9980
