apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-credentials
  namespace: {{ .Values.namespace | default "system-s3" }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: minio-credentials
    creationPolicy: Owner
  data:
    - secretKey: root-user
      remoteRef:
        key: gentian-os/kernel/storage/minio
        property: root_user
    - secretKey: root-password
      remoteRef:
        key: gentian-os/kernel/storage/minio
        property: root_password
{{- if .Values.namespace }}
---
# What the operator administers this MinIO with.
#
# storage_reconciler.go reads `minio-admin` from the s3 namespace by three keys
# -- endpoint, accessKey, secretKey -- to create a bucket and a scoped user for
# every app that asks for object storage. On v4 kernel-admin wrote it into
# platform-kernel with a stage-qualified endpoint; the operator addresses the
# engine by function now and looks for it here.
#
# The endpoint is the release's own Service. The release is named `minio` by
# the Cluster composition, stage-less because a cluster has one stage.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-admin
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: minio-admin
    creationPolicy: Owner
    template:
      data:
        endpoint: "http://minio.{{ .Values.namespace }}.svc.cluster.local:9000"
        accessKey: "{{ "{{" }} .root_user }}"
        secretKey: "{{ "{{" }} .root_password }}"
  data:
    - secretKey: root_user
      remoteRef:
        key: gentian-os/kernel/storage/minio
        property: root_user
    - secretKey: root_password
      remoteRef:
        key: gentian-os/kernel/storage/minio
        property: root_password
{{- end }}
