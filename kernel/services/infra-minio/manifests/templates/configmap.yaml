# Shared kernel MinIO — plain values ConfigMaps
#
# Merged by the InfraData Crossplane composition (provider-helm valuesFrom).
# Source of truth: kernel/values/env/{env}.yaml and this template.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: minio-env-values
  namespace: {{ .Values.namespace | default (printf "gentian-infra-%s" .Values.env) }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  values.yaml: |
    replicaCount: 1
    global:
{{- if .Values.storageClass }}
      storageClass: {{ .Values.storageClass }}
{{- end }}
      imagePullSecrets:
        - registry-credentials
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: minio-base-values
  namespace: {{ .Values.namespace | default (printf "gentian-infra-%s" .Values.env) }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  values.yaml: |
    global:
      security:
        allowInsecureImages: true
      ingress:
        enabled: false
    apiIngress:
      enabled: false
    containerSecurityContext:
      enabled: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      privileged: false
      runAsUser: 1001
      runAsGroup: 1001
      runAsNonRoot: true
      readOnlyRootFilesystem: true
      seccompProfile:
        type: RuntimeDefault
    podSecurityContext:
      enabled: true
      fsGroup: 1001
    image:
      registry: docker.io
      repository: bitnamilegacy/minio
      tag: 2025.4.22-debian-12-r1
      pullPolicy: IfNotPresent
    volumePermissions:
      enabled: true
      # Chart default (runAsUser: 0 only) leaves allowPrivilegeEscalation/
      # seccompProfile unset on this init container, which the cluster's
      # Kyverno MAC policies (gentian-disallow-privilege-escalation,
      # gentian-require-seccomp) reject outright — the init container never
      # gets created and the Release times out waiting for the pod.
      containerSecurityContext:
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
      image:
        registry: docker.io
        repository: bitnamilegacy/os-shell
        tag: 12-debian-12-r44
        pullPolicy: IfNotPresent
    ingress:
      enabled: false
    livenessProbe:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 10
    readinessProbe:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 10
    startupProbe:
      enabled: true
      periodSeconds: 10
      timeoutSeconds: 10
    mode: standalone
    metrics:
      serviceMonitor:
        enabled: false
    networkPolicy:
      enabled: false
    persistence:
    statefulset:
      drivesPerNode: 1
    provisioning:
      enabled: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  {{- /* The cluster's own values. On v4 the name carries the stage,
       because one cluster served several; on v5 a cluster has one stage
       and the suffix is dropped (namespace-cleanup.md §2.2), which is
       also what lets the Cluster composition name this ConfigMap in the
       Release's valuesFrom without knowing the stage -- the claim does
       not carry one. */}}
  name: {{ if .Values.namespace }}minio-cluster-values{{ else }}minio-{{ .Values.env }}-values{{ end }}
  namespace: {{ .Values.namespace | default (printf "gentian-infra-%s" .Values.env) }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  values.yaml: |
    auth:
      existingSecret: minio-credentials
      rootPasswordSecretKey: root-password
    persistence:
      size: 10Gi
    provisioning:
      enabled: false
    resources:
      limits:
        cpu: "4"
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 256Mi
    statefulset:
      replicaCount: 1
