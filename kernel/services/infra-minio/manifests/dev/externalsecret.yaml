apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-credentials
  namespace: gentian-infra-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: minio-credentials
    creationPolicy: Owner
  data:
    - secretKey: root-user
      remoteRef:
        key: gentian-os/kernel/storage/minio
        property: root_user
    - secretKey: root-password
      remoteRef:
        key: gentian-os/kernel/storage/minio
        property: root_password
