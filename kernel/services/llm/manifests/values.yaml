# The stage this release belongs to. Nothing in the templates varies by it
# today — dev/ and prod/ were byte-identical copies — but it is accepted so the
# chart matches every other kernel service and a stage-specific value has
# somewhere to go without restructuring.
env: dev

# The mock inference backend, for a cluster with no GPU.
#
# Deployed when GPU acceleration is off, so LiteLLM has something to answer
# with. With GPUs the real vLLM instances come from the cluster's own claim —
# see the note in the ApplicationSet.
mockBackend: true

# The model gateway: LiteLLM, one build named twice -- by its release tag and
# by the digest of what that tag held -- for the proxy and for the init
# container that builds its trust bundle from the same image.
#
# It ran ghcr.io/berriai/litellm:latest. That is whatever upstream published
# last, pulled again on every pod start: two clusters installed a week apart
# ran different gateways, a restarted pod could come back as a different
# release from the replica beside it, and each new release applied its own
# database migrations to the gateway's database with nobody having chosen to
# upgrade. This is the gateway every tenant's model traffic and budget goes
# through, so the release is chosen here and moves when this line does.
#
# The digest is the multi-architecture index (amd64 and arm64), which
# `make lint-image-digests` checks; `make lint-image-pins` refuses a tag
# without a digest here and `latest` anywhere.
#
# To move it: pick a release from https://github.com/BerriAI/litellm/releases
# (not a -dev or -rc one), read its notes for changes to the environment
# variables templates/llm-services.yaml sets and to the /team, /key and /model
# endpoints the operator and scripts/lib/llm-lib.sh call, and take the digest
# the registry reports for the tag:
#   docker buildx imagetools inspect ghcr.io/berriai/litellm:<tag>
gateway:
  image: ghcr.io/berriai/litellm:v1.104.2@sha256:3d88bd757134a00e8c00237b85a021ab1f6d54abb9c1df750f411dbe7256a500

# Whether this cluster's claim lists any spec.llm.providers.
#
# Only gates the ExternalSecret for their API keys. The model registrations
# themselves are reconciled from the claim by scripts/lib/llm-lib.sh against
# LiteLLM's API, because a model list is not something Argo CD can project from
# a claim into Helm values — the same reason the vLLM release is not here.
externalProviders: false

# The namespace LLM serving runs in.
#
# Empty keeps v4's answer, platform-kernel, which is v4's one namespace for
# everything. v5 passes system-llm, which the Cluster claim composes when
# llm.enabled is true — LLM serving is a system-tier function of its own
# (namespace-cleanup.md §2.2).
#
# The operator has to agree: app_reconciler.go reads the LiteLLM master key
# from here and addresses the proxy at litellm-proxy.<this>, and the kernel
# gateway routes llm.<kernelDomain> to the same place. Both take it from
# layout.System("llm"), so this is that name.
servicesNamespace: platform-kernel

# Who may connect to the pods of this namespace
# (templates/networkpolicy.yaml): one NetworkPolicy per server pod set.
#
# enabled is the cluster's one switch for the policies on the system tier's
# servers (kernel/appsets/values.yaml storeNetworkPolicies), which the LLM
# ApplicationSet passes with the namespaces below from the layout. Rendered on
# the v5 layout only, where servicesNamespace is the llm namespace.
networkPolicy:
  enabled: true
  ports:
    # The gateway's port: what an app is handed in its address and what its
    # kernel-access policy opens (modelgateway.Port).
    gateway: 4000
    # The gateway's PostgreSQL, a CloudNativePG cluster: the data port and the
    # instance manager's.
    postgresql: 5432
    status: 8000
    redis: 6379
    # The mock model server.
    mock: 8000
  namespaces:
    # The operator's.
    control: kernel-control
    # CloudNativePG's operator's.
    data: kernel-data
    # The Gateways' Envoy pods'.
    edge: kernel-edge
