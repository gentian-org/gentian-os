apiVersion: v1
kind: ConfigMap
metadata:
  name: mock-vllm-script
  namespace: platform-kernel
data:
  mock_openai.py: |
    import json
    from http.server import BaseHTTPRequestHandler, HTTPServer
    
    class MockOpenAI(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/v1/models" or self.path == "/models":
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                response = {
                    "object": "list",
                    "data": [
                        {
                            "id": "Qwen/Qwen2.5-7B-Instruct",
                            "object": "model",
                            "created": 1700000000,
                            "owned_by": "gentian"
                        }
                    ]
                }
                self.wfile.write(json.dumps(response).encode())
            else:
                self.send_response(404)
                self.end_headers()
    
        def do_POST(self):
            if self.path == "/v1/chat/completions" or self.path == "/chat/completions":
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                response = {
                    "id": "chatcmpl-123",
                    "object": "chat.completion",
                    "created": 1700000000,
                    "model": "Qwen/Qwen2.5-7B-Instruct",
                    "choices": [
                        {
                            "index": 0,
                            "message": {
                                "role": "assistant",
                                "content": "Hello! I am Qwen2.5-7B-Instruct, running inside Gentian OS. How can I assist you today?"
                            },
                            "finish_reason": "stop"
                        }
                    ]
                }
                self.wfile.write(json.dumps(response).encode())
            else:
                self.send_response(404)
                self.end_headers()
    
    def run():
        print("Starting mock OpenAI server on port 8000...")
        server = HTTPServer(("0.0.0.0", 8000), MockOpenAI)
        server.serve_forever()
    
    if __name__ == "__main__":
        run()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-inference
  namespace: platform-kernel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-inference
  template:
    metadata:
      labels:
        app: vllm-inference
    spec:
      containers:
      - name: vllm-server
        image: python:3.11-alpine
        command: ["python", "/app/mock_openai.py"]
        ports:
        - containerPort: 8000
          name: http
        volumeMounts:
        - name: script-volume
          mountPath: /app
      volumes:
      - name: script-volume
        configMap:
          name: mock-vllm-script
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-inference
  namespace: platform-kernel
spec:
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: vllm-inference
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-proxy
  namespace: platform-kernel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: litellm-proxy
  template:
    metadata:
      labels:
        app: litellm-proxy
    spec:
      containers:
      - name: litellm
        image: ghcr.io/berriai/litellm:latest
        ports:
        - containerPort: 4000
          name: http
        env:
        - name: LITELLM_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: llm-sensitive-values
              key: litellm_master_key
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: litellm-db-app
              key: uri
        - name: STORE_MODEL_IN_DB
          value: "True"
        - name: UI_USERNAME
          valueFrom:
            secretKeyRef:
              name: llm-sensitive-values
              key: litellm_ui_username
        - name: UI_PASSWORD
          valueFrom:
            secretKeyRef:
              name: llm-sensitive-values
              key: litellm_ui_password
---
apiVersion: v1
kind: Service
metadata:
  name: litellm-proxy
  namespace: platform-kernel
spec:
  ports:
  - port: 4000
    targetPort: 4000
  selector:
    app: litellm-proxy
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: litellm-db
  namespace: platform-kernel
spec:
  instances: 1
  primaryUpdateStrategy: unsupervised
  storage:
    size: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-llm
  namespace: platform-kernel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-llm
  template:
    metadata:
      labels:
        app: redis-llm
    spec:
      containers:
      - name: redis
        image: redis:alpine
        ports:
        - containerPort: 6379
          name: redis
---
apiVersion: v1
kind: Service
metadata:
  name: redis-llm
  namespace: platform-kernel
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: redis-llm
