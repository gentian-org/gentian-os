apiVersion: v2
name: llm
description: >
  LiteLLM proxy, its Postgres and Redis, and the mock inference backend.

  Delivered by the gentian-infra-llm ApplicationSet rather than applied by the
  installer. It used to be three kubectl applies from the local working tree, so
  what ran reflected whichever checkout last ran install.sh rather than any
  commit, and nothing reconciled it.
type: application
version: 0.1.0
