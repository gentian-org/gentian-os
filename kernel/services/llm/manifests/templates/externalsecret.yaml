apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-sensitive-values
  namespace: platform-kernel
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: llm-sensitive-values
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        vllm_api_key: "{{ "{{" }} .vllm_api_key }}"
        litellm_master_key: "{{ "{{" }} .litellm_master_key }}"
        litellm_db_password: "{{ "{{" }} .litellm_db_password }}"
        litellm_redis_password: "{{ "{{" }} .litellm_redis_password }}"
        litellm_ui_username: "{{ "{{" }} .litellm_ui_username }}"
        litellm_ui_password: "{{ "{{" }} .litellm_ui_password }}"
        litellm_proxy_base_url: "{{ "{{" }} .litellm_proxy_base_url }}"
        litellm_sso_authorization_endpoint: "{{ "{{" }} .litellm_sso_authorization_endpoint }}"
        litellm_sso_token_endpoint: "{{ "{{" }} .litellm_sso_token_endpoint }}"
        litellm_sso_userinfo_endpoint: "{{ "{{" }} .litellm_sso_userinfo_endpoint }}"
        sensitive-values.yaml: |
          vllm:
            apiKey: {{ "{{" }} .vllm_api_key | quote }}
          litellm:
            masterKey: {{ "{{" }} .litellm_master_key | quote }}
            dbPassword: {{ "{{" }} .litellm_db_password | quote }}
            redisPassword: {{ "{{" }} .litellm_redis_password | quote }}
  data:
    - secretKey: vllm_api_key
      remoteRef:
        key: gentian-os/kernel/llm
        property: vllm_api_key
    - secretKey: litellm_master_key
      remoteRef:
        key: gentian-os/kernel/llm
        property: litellm_master_key
    - secretKey: litellm_db_password
      remoteRef:
        key: gentian-os/kernel/llm
        property: litellm_db_password
    - secretKey: litellm_redis_password
      remoteRef:
        key: gentian-os/kernel/llm
        property: litellm_redis_password
    - secretKey: litellm_ui_username
      remoteRef:
        key: gentian-os/kernel/llm
        property: litellm_ui_username
    - secretKey: litellm_ui_password
      remoteRef:
        key: gentian-os/kernel/llm
        property: litellm_ui_password
    - secretKey: litellm_proxy_base_url
      remoteRef:
        key: gentian-os/kernel/llm
        property: litellm_proxy_base_url
    - secretKey: litellm_sso_authorization_endpoint
      remoteRef:
        key: gentian-os/kernel/llm
        property: litellm_sso_authorization_endpoint
    - secretKey: litellm_sso_token_endpoint
      remoteRef:
        key: gentian-os/kernel/llm
        property: litellm_sso_token_endpoint
    - secretKey: litellm_sso_userinfo_endpoint
      remoteRef:
        key: gentian-os/kernel/llm
        property: litellm_sso_userinfo_endpoint
