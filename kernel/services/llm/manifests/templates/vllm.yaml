{{- /*
The models this cluster serves on its own GPUs: one PVC, Deployment and
Service per entry of the Cluster claim's spec.llm.instances, rendered only
when spec.llm.gpuAcceleration is true. The gateway offers the same entries
(gateway-config.yaml) and calls each at the Service named here, so a claim
that lists an instance gets both the model and the server behind it.

Removing an entry removes its Deployment and Service with the next sync. The
PVC is annotated to be kept, so a cached model survives and a re-added
instance picks it back up.

The pod meets the kernel's admission baseline like every other pod of the
system tier: a user that is not root, a seccomp profile, no privilege
escalation, no capabilities. vLLM's image runs as root and caches under
/root by default; HOME and HF_HOME point it at the volume instead, which
fsGroup makes the pod's to write.
*/ -}}
{{- if eq (toString .Values.spec.llm.gpuAcceleration) "true" }}
{{- range $i := .Values.spec.llm.instances }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-{{ $i.name }}-model-cache
  namespace: {{ $.Values.servicesNamespace }}
  annotations:
    # Kept when an instance is removed. A cached model is tens of GB and many
    # minutes to redownload, so re-adding the same instance name picks the
    # cache back up. Delete by hand to reclaim the disk:
    #   kubectl delete pvc -n system-llm -l gentianos.io/vllm-instance=<name>
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Delete=false
  labels:
    app.kubernetes.io/component: vllm-instance
    gentianos.io/vllm-instance: "{{ $i.name }}"
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      # A Hugging Face cache runs 15-40GB per 7-8B model.
      storage: {{ $i.modelCacheSize | default "60Gi" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-{{ $i.name }}-inference
  namespace: {{ $.Values.servicesNamespace }}
  labels:
    app.kubernetes.io/component: vllm-instance
    gentianos.io/vllm-instance: "{{ $i.name }}"
spec:
  replicas: 1
  strategy:
    type: Recreate # one GPU slice per replica; two pods must not race for it mid-rollout
  selector:
    matchLabels:
      app: vllm-{{ $i.name }}-inference
  template:
    metadata:
      labels:
        app: vllm-{{ $i.name }}-inference
        app.kubernetes.io/component: vllm-instance
        gentianos.io/vllm-instance: "{{ $i.name }}"
    spec:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: vllm-server
        image: {{ if $i.imageTag }}vllm/vllm-openai:{{ $i.imageTag }}{{ else }}{{ $.Values.vllm.image }}{{ end }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        command: ["/bin/sh", "-c"]
        args:
          - |
            TOOL_CALL_ARGS=""
            if [ -n "${VLLM_TOOL_CALL_PARSER}" ]; then
              TOOL_CALL_ARGS="--enable-auto-tool-choice --tool-call-parser ${VLLM_TOOL_CALL_PARSER}"
            fi
            exec vllm serve "${VLLM_MODEL_ID}" \
              --host 0.0.0.0 --port 8000 \
              --gpu-memory-utilization "${VLLM_GPU_MEMORY_UTILIZATION}" \
              --max-model-len "${VLLM_MAX_MODEL_LEN}" \
              --enable-prefix-caching \
              ${TOOL_CALL_ARGS}
        env:
        # Every cache vLLM, Hugging Face, Triton and PyTorch write lives under
        # HOME; HF_HOME is named too, because the image sets it to /root.
        - name: HOME
          value: /cache
        - name: HF_HOME
          value: /cache/huggingface
        # The uid has no passwd entry in the image; PyTorch asks for a user
        # name (getpass.getuser) and reads this before the passwd file.
        - name: USER
          value: vllm
        - name: VLLM_MODEL_ID
          value: "{{ $i.modelId }}"
        # Stay well under 1.0, and under what is left after every other
        # workload sharing the card, so this pod does not starve its neighbors.
        - name: VLLM_GPU_MEMORY_UTILIZATION
          value: "{{ $i.gpuMemoryUtilization | default "0.85" }}"
        - name: VLLM_MAX_MODEL_LEN
          value: "{{ $i.maxModelLen | default "8192" }}"
        # Empty disables tool calling, vLLM's own default. The value is
        # model-family-specific: "hermes" for Qwen2/Qwen2.5, "mistral" for
        # Mistral, "llama3_json" for Llama 3.
        - name: VLLM_TOOL_CALL_PARSER
          value: "{{ $i.toolCallParser | default "" }}"
        # Gated models (Llama) need a Hugging Face token: the Secret
        # vllm-hf-token, one for every instance.
        - name: HUGGING_FACE_HUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: vllm-hf-token
              key: token
              optional: true
        ports:
        - containerPort: 8000
          name: http
        resources:
          limits:
            nvidia.com/gpu: "1"
            # Loading the weights is the peak. Without a limit that peak
            # comes out of the node's memory, and the kernel's OOM killer
            # takes the pods that requested none, not this one.
            memory: {{ $i.memoryLimit | default $.Values.vllm.memoryLimit }}
          requests:
            nvidia.com/gpu: "1"
            cpu: "2"
            memory: 8Gi
        volumeMounts:
        - name: model-cache
          mountPath: /cache
        # PyTorch's workers share tensors through /dev/shm, which a
        # container gets at 64Mi unless it is given one.
        - name: shm
          mountPath: /dev/shm
        # Model download and weight load take minutes on the first start.
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 15
          failureThreshold: 80 # ~20 minutes
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 15
          failureThreshold: 3
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: vllm-{{ $i.name }}-model-cache
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-{{ $i.name }}-inference
  namespace: {{ $.Values.servicesNamespace }}
  labels:
    app.kubernetes.io/component: vllm-instance
    gentianos.io/vllm-instance: "{{ $i.name }}"
spec:
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: vllm-{{ $i.name }}-inference
{{- end }}
{{- end }}
