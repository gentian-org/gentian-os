apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-proxy
  namespace: platform-kernel
  labels:
    # D-05's check() selects on this. Without it the Deployment exists, runs,
    # and reports missing — the step's check disagreeing with its own provides:.
    app.kubernetes.io/name: litellm
    app.kubernetes.io/component: llm-gateway
    gentianos.io/component: kernel-llm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: litellm-proxy
  template:
    metadata:
      labels:
        app: litellm-proxy
    spec:
      volumes:
      # The cluster's own serving chain, so the proxy can verify kernel
      # endpoints it calls back-channel. tls.crt only — the private key has no
      # business in this pod.
      #
      # optional: a cluster that has not issued its wildcard yet still starts;
      # the init container below tolerates the file being absent.
      - name: kernel-serving-chain
        secret:
          secretName: wildcard-tls
          optional: true
          items:
          - key: tls.crt
            path: tls.crt
      - name: ca-trust
        emptyDir: {}
      initContainers:
      # Why this exists: the SSO callback failed with
      # "[SSL: CERTIFICATE_VERIFY_FAILED] unable to get local issuer
      # certificate" and surfaced to the browser as a bare 500. The browser half
      # of the login works — Keycloak issues a code and the callback lands — and
      # then the proxy's own back-channel token exchange to
      # https://id.<kernelDomain>/.../token cannot verify the certificate.
      #
      # On a cluster with certificates.acmeEnv: staging the chain is complete
      # but terminates at a Let's Encrypt STAGING anchor, which is in no trust
      # store anywhere. The same applies to issuerMode: private-ca. Browsers let
      # a human click through; httpx does not.
      #
      # Built from the cluster rather than from a vendored PEM: whatever issued
      # the wildcard is by definition what these endpoints present, so this is
      # correct for staging, for a private CA, and a harmless superset for
      # production — no third-party root to carry in git and keep current.
      #
      # Appended to certifi rather than replacing it. SSL_CERT_FILE REPLACES the
      # trust set for httpx (see create_ssl_context in httpx 0.28), so a bundle
      # holding only the cluster CA would make the proxy unable to verify the
      # external providers it routes to — api.infomaniak.com and the rest.
      - name: ca-trust
        image: ghcr.io/berriai/litellm:latest
        command:
        - /bin/sh
        - -ec
        - |
          # certifi's path is asked for rather than hardcoded: it moves with the
          # image's Python version, and a stale literal would silently fall back
          # to a 119-cert system bundle instead of failing.
          base="$(python3 -c 'import certifi; print(certifi.where())' 2>/dev/null || echo /etc/ssl/certs/ca-certificates.crt)"
          cp "${base}" /trust/ca-bundle.pem
          if [ -s /kernel-tls/tls.crt ]; then
            # Every certificate after the first: the leaf is this cluster's
            # server certificate, not an issuer, and a trust store is for
            # anchors. Trusting the intermediate is what lets the chain
            # terminate; the leaf would only ever vouch for itself.
            awk '/BEGIN CERT/{n++} n>1' /kernel-tls/tls.crt >>/trust/ca-bundle.pem
            echo "ca-trust: certifi ($(grep -c 'BEGIN CERT' "${base}") certs) + cluster chain -> $(grep -c 'BEGIN CERT' /trust/ca-bundle.pem) certs"
          else
            echo "ca-trust: no wildcard-tls on this cluster; using certifi unchanged"
          fi
        volumeMounts:
        - name: kernel-serving-chain
          mountPath: /kernel-tls
          readOnly: true
        - name: ca-trust
          mountPath: /trust
      containers:
      - name: litellm
        image: ghcr.io/berriai/litellm:latest
        volumeMounts:
        - name: ca-trust
          mountPath: /trust
          readOnly: true
        ports:
        - containerPort: 4000
          name: http
        env:
        - name: LITELLM_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: llm-sensitive-values
              key: litellm_master_key
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: litellm-db-app
              key: uri
        - name: STORE_MODEL_IN_DB
          value: "True"
        # Without this, a failed `prisma migrate deploy` at startup is a
        # warning and the proxy serves anyway — with whatever fraction of
        # the schema made it in. Seen live: two replicas raced the
        # migration's advisory lock during an install (10s lock timeout,
        # 157 migrations applying slowly against a database on nfs-csi
        # mid-sync-storm), 55 of 157 landed, and the proxy then answered
        # health checks for hours while every DB-backed endpoint 500'd
        # ("column does not exist") — which took the model-sync Job and
        # E-02 down with it. Failing hard turns that into a crashloop the
        # kubelet retries until the migration completes, which it does as
        # soon as the lock is free and the DB quiets down.
        - name: ENFORCE_PRISMA_MIGRATION_CHECK
          value: "true"
        - name: UI_USERNAME
          valueFrom:
            secretKeyRef:
              name: llm-sensitive-values
              key: litellm_ui_username
        - name: UI_PASSWORD
          valueFrom:
            secretKeyRef:
              name: llm-sensitive-values
              key: litellm_ui_password
        # Admin console SSO — platform-admin only (see docs/design/llms.md).
        # Free for <=5 users on LiteLLM OSS (v1.76.0+); the litellm-dashboard
        # Keycloak client only exists in the kernel realm, so tenant users
        # cannot authenticate here.
        - name: PROXY_BASE_URL
          valueFrom:
            secretKeyRef:
              name: llm-sensitive-values
              key: litellm_proxy_base_url
        - name: GENERIC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: litellm-dashboard-sso
              key: client_id
        - name: GENERIC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: litellm-dashboard-sso
              key: client_secret
        - name: GENERIC_AUTHORIZATION_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: llm-sensitive-values
              key: litellm_sso_authorization_endpoint
        - name: GENERIC_TOKEN_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: llm-sensitive-values
              key: litellm_sso_token_endpoint
        - name: GENERIC_USERINFO_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: llm-sensitive-values
              key: litellm_sso_userinfo_endpoint
        - name: GENERIC_SCOPE
          value: "openid profile email"
        - name: GENERIC_USER_ID_ATTRIBUTE
          value: "email"
        - name: GENERIC_USER_EMAIL_ATTRIBUTE
          value: "email"
        - name: GENERIC_USER_ROLE_ATTRIBUTE
          value: "litellm_role"
        # Send /ui straight to SSO instead of rendering a login form.
        #
        # LiteLLM stopped auto-redirecting when SSO is configured, so the
        # console opened on its own username/password page — which tells the
        # operator the credentials are "admin" and the proxy MASTER_KEY, on a
        # cluster where that key is a derived secret in OpenBao and nobody is
        # expected to type it. The portal tile leads here, so it has to behave
        # like every other tile: click, arrive signed in.
        #
        # The cost, stated plainly: with this on, the username/password form is
        # unreachable in a browser. LiteLLM's login page redirects to
        # /sso/key/generate in an effect before the form is usable, and there is
        # no query parameter to skip it. Break-glass is therefore the API, not
        # the UI — the master key from OpenBao still authenticates every
        # endpoint, which is how the installer's own sync Jobs talk to it.
        #
        # That trade is acceptable here because the UI is reached through the
        # portal, and a Keycloak outage takes the portal with it — so the form
        # would not be reachable in that failure anyway. Set this to "false" to
        # get the form back.
        - name: AUTO_REDIRECT_UI_LOGIN_TO_SSO
          value: "true"
        # Both names, because the proxy's HTTP clients are not all the same
        # library: httpx reads SSL_CERT_FILE (create_ssl_context, 0.28), and
        # anything on requests reads REQUESTS_CA_BUNDLE. Setting one and not the
        # other fixes whichever call happens to be on that client and leaves the
        # rest failing identically.
        - name: SSL_CERT_FILE
          value: /trust/ca-bundle.pem
        - name: REQUESTS_CA_BUNDLE
          value: /trust/ca-bundle.pem
---
apiVersion: v1
kind: Service
metadata:
  name: litellm-proxy
  namespace: platform-kernel
spec:
  ports:
  - port: 4000
    targetPort: 4000
  selector:
    app: litellm-proxy
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: litellm-db
  namespace: platform-kernel
spec:
  instances: 1
  primaryUpdateStrategy: unsupervised
  storage:
    size: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-llm
  namespace: platform-kernel
  labels:
    app.kubernetes.io/name: redis-llm
    app.kubernetes.io/component: llm-cache
    gentianos.io/component: kernel-llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-llm
  template:
    metadata:
      labels:
        app: redis-llm
    spec:
      containers:
      - name: redis
        image: redis:alpine
        ports:
        - containerPort: 6379
          name: redis
---
apiVersion: v1
kind: Service
metadata:
  name: redis-llm
  namespace: platform-kernel
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: redis-llm
