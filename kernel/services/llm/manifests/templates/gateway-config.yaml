{{- /*
The models the gateway offers: its configuration file, written from the
Cluster claim's spec.llm and from nothing else.

  An instance (spec.llm.instances, read when gpuAcceleration is true) is
  offered under its model id in lower case with "/" as "-"
  (Qwen/Qwen2.5-7B-Instruct is qwen-qwen2.5-7b-instruct) and called at the
  Service of the vLLM instance of that name in this namespace. vLLM asks for
  no key; the gateway's client refuses to be built without one, so it is
  given a word.

  A provider's model (spec.llm.providers[].models) is offered as
  <provider>/<name>: upstream ids collide across providers, and the list
  should say who serves what. It is called as an OpenAI-compatible endpoint
  whoever serves it.

  A provider reads its own token and no other's. All providers' tokens are
  properties of one credential, and a provider's is <name>_api_key ("-" in
  the name as "_"). A provider whose apiKeyProperty says anything else would
  have the gateway send another provider's token to its address, so no model
  of it is offered. The director refuses to write such a provider; this is
  for a claim edited by hand.

  A provider's token is not in this file. The entry names an environment
  variable of the gateway's container, LLM_PROVIDER_KEY_<apiKeyProperty>,
  which the container sets at its start from the Secret
  llm-provider-credentials (llm-services.yaml). A model whose token has not
  been supplied yet is listed and answers an authentication error until it
  is.

Every model is in access groups, which are what a tenant's team at the
gateway names (internal/modelgateway): an instance's model is in
gentian:every-tenant; a provider's model is in gentian:provider:<provider>,
and in gentian:every-tenant as well when the provider is marked
defaultForTenants. A team names gentian:every-tenant and the groups of the
providers its tenant opted in to, so a provider's model reaches a tenant
only when one of the two says so.

A request may name other models to fall back to. The gateway checks each of
them against the caller's team and key before it is tried
(enforce_fallback_model_access), so a fallback reaches no model the caller
could not ask for. The file configures no fallbacks and no aliases of its
own.

The gateway reads this file when it starts, and reads models from nowhere
else (STORE_MODEL_IN_DB is off): a model removed from the claim is gone with
the pods that knew it, and none can be added at the gateway's console or its
API. The Deployment carries this file's checksum, so a change replaces the
pods.
*/ -}}
{{- define "llm.gatewayConfig" -}}
{{- $llm := .Values.spec.llm -}}
{{- $models := list -}}
{{- if eq (toString $llm.gpuAcceleration) "true" -}}
{{- range $i := $llm.instances -}}
{{- $params := dict
      "model" (printf "openai/%s" $i.modelId)
      "api_base" (printf "http://vllm-%s-inference.%s.svc.cluster.local:8000/v1" $i.name $.Values.servicesNamespace)
      "api_key" "not-needed" -}}
{{- $info := dict "access_groups" (list "gentian:every-tenant") -}}
{{- $models = append $models (dict "model_name" ($i.modelId | lower | replace "/" "-") "litellm_params" $params "model_info" $info) -}}
{{- end -}}
{{- end -}}
{{- range $p := $llm.providers -}}
{{- if eq (toString $p.apiKeyProperty) (printf "%s_api_key" ($p.name | replace "-" "_")) -}}
{{- range $m := $p.models -}}
{{- $params := dict
      "model" (printf "openai/%s" $m.model)
      "api_base" ($p.apiBase | trimSuffix "/")
      "api_key" (printf "os.environ/LLM_PROVIDER_KEY_%s" $p.apiKeyProperty) -}}
{{- $groups := list (printf "gentian:provider:%s" $p.name) -}}
{{- if eq (toString $p.defaultForTenants) "true" }}{{ $groups = prepend $groups "gentian:every-tenant" }}{{ end -}}
{{- $info := dict "mode" ($m.mode | default "chat") "access_groups" $groups -}}
{{- if $m.maxTokens }}{{ $_ := set $info "max_tokens" (int $m.maxTokens) }}{{ end -}}
{{- $models = append $models (dict "model_name" (printf "%s/%s" $p.name $m.name) "litellm_params" $params "model_info" $info) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $config := dict "model_list" $models "general_settings" (dict "enforce_fallback_model_access" true) -}}
{{- /* What one person may spend, when the claim says (person-budget.yaml). */ -}}
{{- if dig "personBudget" dict $llm -}}
{{- $_ := set $config "litellm_settings" (dict "max_end_user_budget_id" "gentian-person") -}}
{{- end -}}
{{- toYaml $config -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: {{ .Values.servicesNamespace }}
  labels:
    gentianos.io/component: kernel-llm
data:
  config.yaml: |
    {{- include "llm.gatewayConfig" . | nindent 4 }}
