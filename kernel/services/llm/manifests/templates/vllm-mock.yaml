{{- /*
The mock inference backend, so LiteLLM has something to answer with on a
cluster without GPUs.

Guarded rather than applied conditionally by a script: the installer used to
kubectl-apply this file only when GPU_ACCELERATION was false, which meant
turning GPUs ON left the mock running until somebody noticed. A value the
release carries is removed by the next sync.
*/ -}}
{{- if .Values.mockBackend }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: mock-vllm-script
  namespace: platform-kernel
data:
  mock_openai.py: |
    import json
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class MockOpenAI(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/v1/models" or self.path == "/models":
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                response = {
                    "object": "list",
                    "data": [
                        {
                            "id": "Qwen/Qwen2.5-7B-Instruct",
                            "object": "model",
                            "created": 1700000000,
                            "owned_by": "gentian"
                        }
                    ]
                }
                self.wfile.write(json.dumps(response).encode())
            else:
                self.send_response(404)
                self.end_headers()

        def do_POST(self):
            if self.path == "/v1/chat/completions" or self.path == "/chat/completions":
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                response = {
                    "id": "chatcmpl-123",
                    "object": "chat.completion",
                    "created": 1700000000,
                    "model": "Qwen/Qwen2.5-7B-Instruct",
                    "choices": [
                        {
                            "index": 0,
                            "message": {
                                "role": "assistant",
                                "content": "Hello! I am Qwen2.5-7B-Instruct, running inside Gentian OS. How can I assist you today?"
                            },
                            "finish_reason": "stop"
                        }
                    ]
                }
                self.wfile.write(json.dumps(response).encode())
            else:
                self.send_response(404)
                self.end_headers()

    def run():
        print("Starting mock OpenAI server on port 8000...")
        server = HTTPServer(("0.0.0.0", 8000), MockOpenAI)
        server.serve_forever()

    if __name__ == "__main__":
        run()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-inference
  namespace: platform-kernel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-inference
  template:
    metadata:
      labels:
        app: vllm-inference
    spec:
      containers:
      - name: vllm-server
        image: python:3.11-alpine
        command: ["python", "/app/mock_openai.py"]
        ports:
        - containerPort: 8000
          name: http
        volumeMounts:
        - name: script-volume
          mountPath: /app
      volumes:
      - name: script-volume
        configMap:
          name: mock-vllm-script
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-inference
  namespace: platform-kernel
spec:
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: vllm-inference
{{- end }}
