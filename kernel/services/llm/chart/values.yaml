# The vLLM instances themselves are the gateway chart's
# (kernel/services/llm/manifests/templates/vllm.yaml), read from the Cluster
# claim's spec.llm.instances.

# Whether this release owns GPU time-slicing for the node.
#
# The ConfigMap below is cluster-wide and shared with every GPU workload on the
# machine, not only this platform's. A cluster that already configures it — its
# own GPU operator install, another chart, an operator team — keeps that
# configuration, and the installer sets this to false rather than fighting for
# ownership of an object it did not create. It also sets it to false when the
# claim's llm.gpuAcceleration is false: the ConfigMap's namespace belongs to the
# GPU Operator, and a CPU-only cluster has neither.
manageTimeSlicing: true

# NVIDIA time-slicing replicas per GPU. 1 disables sharing.
gpuTimeSliceReplicas: 1
