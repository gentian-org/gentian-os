# =============================================================================
# dovecot — provider-helm Release CR (Pattern B migration)
#
# Deploys the opendesk Dovecot IMAP/LMTP server in gentian-dev.
# Dovecot receives mail from Postfix via LMTP (when MAIL_SERVICE_MODE=kernel)
# and serves it via IMAP to OX App Suite and IMAP clients.
#
# Values merge order (last wins):
#   1. dovecot-base-values     ConfigMap — non-secret defaults (_base.yaml)
#   2. dovecot-dev-values      ConfigMap — env overrides (LDAP host, domains)
#   3. dovecot-sensitive-values Secret   — doveadm/LDAP/OIDC passwords
#                                           (ESO-synced from OpenBao)
#
# Deployed in gentian-dev alongside postfix so LMTP transport resolves via
# `dovecot-dev.gentian-dev.svc.cluster.local:24` (Dovecot default LMTP port).
#
# Enabling kernel mail:
#   1. Set MAIL_SERVICE_MODE=kernel in install.env
#   2. Run update.sh — this seeds mail/dovecot in OpenBao (so ESO can sync
#      the sensitive-values Secret) and reconfigures Postfix for local delivery.
# =============================================================================
apiVersion: helm.crossplane.io/v1beta1
kind: Release
metadata:
  name: dovecot-dev
  annotations:
    crossplane.io/external-name: dovecot-dev
    argocd.argoproj.io/sync-wave: "9"
spec:
  forProvider:
    chart:
      name: dovecot
      repository: oci://registry.opencode.de/bmi/opendesk/components/platform-development/charts/opendesk-dovecot
      version: "3.4.1"
      pullSecretRef:
        name: registry-credentials-helm
        namespace: crossplane-system
    namespace: gentian-dev
    wait: true
    waitTimeout: "5m"
    valuesFrom:
      - configMapKeyRef:
          name: dovecot-base-values
          namespace: gentian-dev
          key: values.yaml
          optional: false
      - configMapKeyRef:
          name: dovecot-dev-values
          namespace: gentian-dev
          key: values.yaml
          optional: false
      - secretKeyRef:
          name: dovecot-sensitive-values
          namespace: gentian-dev
          key: sensitive-values.yaml
          optional: false
      - configMapKeyRef:
          name: dovecot-tenant-oidc-values
          namespace: gentian-dev
          key: values.yaml
          optional: true
  providerConfigRef:
    name: kubernetes
