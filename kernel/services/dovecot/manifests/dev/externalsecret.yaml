# =============================================================================
# dovecot — ESO ExternalSecret (Pattern B migration)
#
# Renders 3 sensitive Helm value paths as a single sensitive-values.yaml
# Helm values file, consumed by the Release CR via valuesFrom.secretKeyRef.
#
# Sources:
#   gentian-os/kernel/mail/dovecot     — doveadm_password (doveadm admin pw),
#                                        oidc_client_secret (Keycloak token
#                                        introspection client secret)
#   gentian-os/kernel/identity/nubus   — ldapsearch_dovecot (LDAP bind pw
#                                        for the dovecot service account)
#
# Seeding: install.sh create_crossplane_secrets creates the
# gentian-os-kernel-mail-dovecot K8s Secret in crossplane-system, which the
# Cluster XR's SecretV2 MR uses to seed OpenBao at the mail/dovecot path.
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dovecot-sensitive-values
  namespace: gentian-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: dovecot-sensitive-values
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # provider-helm reads this key as a Helm values file (merged last → wins).
        sensitive-values.yaml: |
          dovecot:
            password:
              value: {{ .doveadm_password | quote }}
            ldap:
              password:
                value: {{ .ldapsearch_dovecot | quote }}
            oidc:
              clientSecret:
                value: {{ .oidc_client_secret | quote }}
  data:
    - secretKey: doveadm_password
      remoteRef:
        key: gentian-os/kernel/mail/dovecot
        property: doveadm_password
    - secretKey: oidc_client_secret
      remoteRef:
        key: gentian-os/kernel/mail/dovecot
        property: oidc_client_secret
    - secretKey: ldapsearch_dovecot
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: ldapsearch_dovecot
