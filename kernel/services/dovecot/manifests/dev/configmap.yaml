# =============================================================================
# dovecot — plain values ConfigMaps (Pattern B migration)
#
# Two ConfigMaps merged by provider-helm before the sensitive-values Secret:
#   1. dovecot-base-values  — non-secret defaults for all environments
#   2. dovecot-dev-values   — env-specific overrides (LDAP host, domains,
#                              submission host, persistence size)
#
# DO NOT put any secret values here.  All passwords come from the
# dovecot-sensitive-values Secret (see externalsecret.yaml).
#
# Values are placed in the gentian-dev namespace (same as postfix and nubus)
# so that Postfix LMTP transport routes resolve correctly via the service DNS
# `dovecot-dev.gentian-dev.svc.cluster.local`.
# =============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dovecot-base-values
  namespace: gentian-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  values.yaml: |
    # Image override — chart defaults to external-registry.souvap-univention.de which is unreachable.
    # Tags from opendesk/helmfile/environments/default/images.yaml.gotmpl (chart 3.4.1).
    image:
      registry: "registry.opencode.de"
      repository: "bmi/opendesk/components/supplier/open-xchange/images/dovecot-public-sector"
      tag: "2.3.21@sha256:c76965a84d1ca527f523404eb027119f6736b199c094e4671037cb345ecad3dc"
      pullPolicy: IfNotPresent

    imageInitDovecot:
      registry: "registry-1.docker.io"
      repository: "alpine/k8s"
      tag: "1.34.0@sha256:b5f6edfeac5279f3e182d938d1ffecb62f7c980756ac4b6b66d7f0d566782f77"
      pullPolicy: IfNotPresent

    # IMAP + LMTP service only (no POP3 NodePort)
    service:
      external:
        enabled: false

    # Container security context — matches opendesk reference (needs linux caps for mail)
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - "ALL"
        add:
          - "CHOWN"
          - "DAC_OVERRIDE"
          - "KILL"
          - "NET_BIND_SERVICE"
          - "SETGID"
          - "SETUID"
          - "SYS_CHROOT"
      enabled: true
      readOnlyRootFilesystem: true
      seccompProfile:
        type: RuntimeDefault

    podSecurityContext:
      enabled: true
      fsGroup: 1000

    # Single replica for dev
    replicaCount: 1

    # Persistence — size overridden per-env
    persistence:
      accessModes:
        - ReadWriteOnce
      enabled: true

    dovecot:
      # Mail domain — overridden per-env
      ldap:
        enabled: true
        port: 389
        # base and dn set per-env (dc=swp-ldap,dc=internal)
      oidc:
        enabled: true
        introspectionScheme: "http"
        introspectionPath: "/realms/opendesk/protocol/openid-connect/token/introspect"
        usernameAttribute: "opendesk_username"
      migration:
        enabled: false
      protocol:
        imap:
          limits:
            maxUserIpConnections: 10
      quotaRules:
        - "*:storage=5000M"
        - "Trash:storage=+500M"
      quotaGrace: "500M"
      sieve:
        notify:
          mailtoEnvelopeFrom: "orig_recipient"
      submission:
        enabled: true
        ssl: "no"
        # host overridden per-env
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dovecot-dev-values
  namespace: gentian-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  values.yaml: |
    dovecot:
      mailDomains:
        - "desk.gentian.org"
      defaultMailDomain: "desk.gentian.org"
      ldap:
        host: "nubus-dev-ldap-server.gentian-dev.svc.cluster.local"
        base: "dc=swp-ldap,dc=internal"
        dn: "uid=ldapsearch_dovecot,cn=users,dc=swp-ldap,dc=internal"
      oidc:
        introspectionHost: "nubus-dev-keycloak.gentian-dev.svc.cluster.local:8080"
        clientID:
          value: "opendesk-dovecot"
      submission:
        host: "postfix-dev.gentian-dev.svc.cluster.local:25"
      loginTrustedNetworks: "10.0.0.0/8"

    persistence:
      size: "10Gi"

    resources:
      limits:
        cpu: "1000m"
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
