# env is supplied by the ApplicationSet (helm.parameters). The default
# only matters for `helm template` run by hand.
env: dev

# The namespace the kernel mail stack runs in. MUST match the operator's
# SERVICES_NAMESPACE (charts/gentian-os/values.yaml servicesNamespace) and the
# same value in kernel/services/postfix — Postfix reaches Dovecot at
# dovecot-<env>.<servicesNamespace>.svc.cluster.local:24 over LMTP, and the
# operator writes dovecot-tenant-oidc-values into that namespace.
servicesNamespace: platform-kernel
# storageClass empty = use the cluster's default StorageClass. Set per
# stage in values-<env>.yaml only where a stage genuinely differs.
storageClass: ""

# Mailbox storage. Every tenant mailbox lives under this one volume as
# /var/mail/<domain>/<user>, so this is the whole cluster's mail, not one
# tenant's. Without a volume at all, Dovecot writes maildirs into the container
# filesystem and every message is lost on restart — including the restart that
# a config change or a node drain causes.
mailStorageSize: 5Gi

# TLS for IMAP.
#
# The certificate is the cluster's existing wildcard — the publicly-trusted one
# the gateway already serves — not a privately-issued one. Two reasons, and the
# first is fatal on its own: the gentian-ca issuer the earlier design called for
# is defined in this repo but applied on NO cluster, because issuerMode defaults
# to acme-dns01. A Certificate naming it never becomes Ready, and since the
# volume below is not optional the Pod waits in ContainerCreating — taking
# inbound LMTP delivery down along with retrieval.
#
# The second is that a private certificate has to be believed by every client
# before it is worth anything. Nextcloud's Mail app talks IMAP over PHP streams,
# which read openssl.cafile and nothing else — not the system store, not
# SSL_CERT_FILE, not Nextcloud's own bundle — and nothing in this platform sets
# it. The trust-anchor Secret apps already mount holds the Mozilla bundle, never
# the cluster's own root. A publicly-trusted certificate is believed by all of
# them with no plumbing at all.
#
# The name must therefore be a public one: clients connect to
# imap.<kernelDomain>, not to dovecot-<env>.<ns>.svc.cluster.local, because the
# certificate is checked against what the client dialled.
#
# Empty disables TLS entirely and keeps plaintext IMAP on 143.
tls:
  secretName: wildcard-tls

# Whether IMAPS (993) is published to the internet.
#
# This is what makes the mailboxes reachable by a mail client at all. Until now
# retrieval existed only on paper: the Service was ClusterIP, the gateway speaks
# HTTP only, and the per-realm oauth2 passdb had never authenticated a client.
# Mail arrived and nothing could read it.
#
# 993 only — implicit TLS, which RFC 8314 prefers over STARTTLS on 143 because
# there is no cleartext phase for an attacker to strip. 143 stays for in-cluster
# clients and refuses plaintext authentication (disable_plaintext_auth).
#
# It provisions a load balancer, which costs money on most providers. Set
# enabled: false on a cluster whose users only read mail through in-cluster apps.
imapIngress:
  enabled: true
  # Pin the address once a DNS record names it, so a rebuild does not hand out a
  # different one and silently break every configured mail client.
  loadBalancerIP: ""
  annotations:
    # Same reason as the MX Service in the Postfix chart: externalTrafficPolicy
    # Local means only the node running the Pod can serve, so without a health
    # monitor the load balancer round-robins across all of them and most
    # connections are dropped.
    loadbalancer.openstack.org/enable-health-monitor: "true"
    loadbalancer.openstack.org/keep-floatingip: "true"
