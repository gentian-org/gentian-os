# UNTESTED — raw Deployment placeholder (no public Dovecot Helm chart).
# Namespace gentian-prod → Service dovecot-prod.gentian-prod.svc.cluster.local
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dovecot-base-values
  namespace: gentian-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  values.yaml: |
    # Reserved for a future Gentian Dovecot Helm chart. Not consumed by deployment.yaml.
    image: dovecot/dovecot:2.3.21
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dovecot-prod-values
  namespace: gentian-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  values.yaml: |
    # Patched by operator mail reconciler (mail-dovecot-domains, mail-dovecot-oidc-values).
    replicaCount: 1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dovecot-sensitive-values
  namespace: gentian-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: dovecot-sensitive-values
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        doveadm_password: "{{ .doveadm_password }}"
        oidc_client_secret: "{{ .oidc_client_secret }}"
  data:
    - secretKey: doveadm_password
      remoteRef:
        key: gentian-os/kernel/mail/dovecot
        property: doveadm_password
    - secretKey: oidc_client_secret
      remoteRef:
        key: gentian-os/kernel/mail/dovecot
        property: oidc_client_secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dovecot-prod
  namespace: gentian-prod
  annotations:
    argocd.argoproj.io/sync-wave: "9"
  labels:
    app.kubernetes.io/name: dovecot
    app.kubernetes.io/instance: dovecot-prod
    gentianos.io/component: kernel-mail
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dovecot
      app.kubernetes.io/instance: dovecot-prod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dovecot
        app.kubernetes.io/instance: dovecot-prod
    spec:
      containers:
        - name: dovecot
          image: dovecot/dovecot:2.3.21
          imagePullPolicy: IfNotPresent
          ports:
            - name: imap
              containerPort: 143
            - name: lmtp
              containerPort: 24
          env:
            - name: USER_PASSWORD
              value: "{CRYPT}*"
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dovecot-prod
  namespace: gentian-prod
  annotations:
    argocd.argoproj.io/sync-wave: "9"
  labels:
    app.kubernetes.io/name: dovecot
    app.kubernetes.io/instance: dovecot-prod
    gentianos.io/component: kernel-mail
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dovecot
    app.kubernetes.io/instance: dovecot-prod
  ports:
    - name: lmtp
      port: 24
      targetPort: lmtp
    - name: imap
      port: 143
      targetPort: imap
