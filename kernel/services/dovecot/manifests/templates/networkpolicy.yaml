{{- /*
  Who may open a connection to Dovecot.

  Dovecot serves four ports, and they are of two kinds. Until this policy
  every one of them took a connection from any pod of any namespace that has
  no egress policy of its own.

  Open to any source, as they were -- a rule with ports and no `from`:

    imaps (993)   published to the internet on its own load balancer
                  (imapIngress), and what an app that declared `mail.imap` is
                  handed, by its public name (mail_reconciler.go). A
                  connection through a load balancer does not arrive from a
                  pod, and whether one from inside the cluster still carries
                  its pod's address depends on the proxy mode of the cluster;
                  so no source can be named. Rendered only when Dovecot
                  serves it (tls.secretName).
    imap (143)    the same service without the load balancer. The operator
                  hands it to nobody, and which pods of the cluster use it by
                  the Service's name cannot be read from this repository; it
                  asks for the same credential as 993 and refuses it outside
                  TLS. Left as it was.

  Restricted to their callers:

    lmtp (24)     delivery. It takes mail for any hosted domain from whoever
                  connects, with no credential: Postfix alone, which is in
                  this namespace (virtual_transport in the Postfix chart).
    sasl (12345)  the authentication service Postfix asks about a submission
                  credential (smtpd_sasl_path): Postfix alone. Anything else
                  that reached it could try passwords without the limits
                  Postfix puts in front of it.

  Postfix's pods are named by the labels the upstream chart gives them --
  the ones the MX Service of the Postfix chart selects on.

  The installer's check of this Deployment (verify_dovecot_installation)
  opens 143 and 24 from a short-lived pod. It runs that pod in this namespace
  and labels it gentianos.io/purpose=verify, and is admitted to 24 as such.

  The kubelet's probes open 24 from the pod's own node, which is not subject
  to a NetworkPolicy. Dovecot's own calls -- a token to Keycloak -- are
  egress, and nothing is said about egress.

  Sync wave -1: before the Deployment (9), so the server is never up without
  it.
*/ -}}
{{- if ne (toString .Values.networkPolicy.enabled) "false" }}
{{- $np := .Values.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dovecot-ingress
  namespace: {{ .Values.servicesNamespace }}
  labels:
    gentianos.io/tier: system
    gentianos.io/function: mail
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dovecot
      app.kubernetes.io/instance: dovecot-{{ .Values.env }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        {{- if .Values.tls.secretName }}
        - protocol: TCP
          port: {{ $np.ports.imaps }}
        {{- end }}
        - protocol: TCP
          port: {{ $np.ports.imap }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mail
              app.kubernetes.io/instance: postfix-{{ .Values.env }}
      ports:
        - protocol: TCP
          port: {{ $np.ports.lmtp }}
        - protocol: TCP
          port: {{ $np.ports.sasl }}
    - from:
        - podSelector:
            matchLabels:
              gentianos.io/purpose: verify
      ports:
        - protocol: TCP
          port: {{ $np.ports.lmtp }}
{{- end }}
