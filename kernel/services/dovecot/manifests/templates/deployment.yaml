# Raw Deployment — there is no public Dovecot Helm chart worth depending on.
# Namespace {{ .Values.servicesNamespace }} → Service dovecot-{{ .Values.env }}.{{ .Values.servicesNamespace }}.svc.cluster.local
#
# Delivery works end to end: Postfix hands a message for a registered tenant
# domain to LMTP on 24, and it is written to the maildir on the PersistentVolume
# below as /var/mail/<domain>/<local-part>.
#
# Retrieval works too, now that the decision this chart used to defer has been
# made: IMAPS on 993 is published on its own load balancer (imapIngress), with
# the cluster's publicly-trusted wildcard certificate, and clients authenticate
# with the per-user app passwords the operator mints. A mail client reaches it at
# imap.<kernelDomain>.
#
# Plaintext IMAP on 143 remains for in-cluster clients and refuses to
# authenticate outside TLS (disable_plaintext_auth), so the only way to present a
# password is inside one.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dovecot-base-values
  namespace: {{ .Values.servicesNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  values.yaml: |
    # Reserved for a future Gentian Dovecot Helm chart. Not consumed by deployment.yaml.
    image: dovecot/dovecot:2.3.21
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dovecot-{{ .Values.env }}-values
  namespace: {{ .Values.servicesNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  values.yaml: |
    # Patched by operator mail reconciler (mail-dovecot-domains, mail-dovecot-oidc-values).
    replicaCount: 1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dovecot-sensitive-values
  namespace: {{ .Values.servicesNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: dovecot-sensitive-values
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        doveadm_password: "{{ "{{" }} .doveadm_password }}"
        oidc_client_secret: "{{ "{{" }} .oidc_client_secret }}"
  data:
    - secretKey: doveadm_password
      remoteRef:
        key: gentian-os/kernel/mail/dovecot
        property: doveadm_password
    - secretKey: oidc_client_secret
      remoteRef:
        key: gentian-os/kernel/mail/dovecot
        property: oidc_client_secret
---
# The running configuration. Self-contained on purpose: dovecot is started with
# `-c` pointing at this file and it does not `!include conf.d/*.conf`, so what
# runs is exactly what is here and not a merge with whatever the upstream image
# ships. Mounted as a directory rather than with subPath — a subPath mount is
# copied once at Pod start and never tracks later ConfigMap updates.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dovecot-{{ .Values.env }}-config
  namespace: {{ .Values.servicesNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "8"
data:
  dovecot.conf: |
    # LMTP on 24 is the reason this file exists. Postfix hands every message for a
    # registered tenant domain to lmtp:[dovecot-<env>...]:24, but the upstream
    # default ships `inet_listener lmtp { port = 0 }` — disabled — so port 24 was
    # declared on both the Service and the Deployment while nothing listened on
    # it, and inbound mail had nowhere to go.
    protocols = imap lmtp
    listen = *

    # stderr, so a delivery failure shows up in `kubectl logs` rather than in a
    # file inside a container nobody will exec into.
    log_path = /dev/stderr
    info_log_path = /dev/stderr

    {{- if .Values.tls.secretName }}
    # IMAP passwords are password-equivalent and must not cross the network in
    # the clear, even a pod network: anything able to observe it — a sidecar, a
    # CNI plugin, a node-level capture — sees a live mail credential.
    #
    # The certificate is issued for the in-cluster DNS name, so it cannot come
    # from Let's Encrypt: nothing public can validate .svc.cluster.local. It is
    # issued by the cluster's own CA instead, which is why the client has to
    # trust that CA — see values.yaml.
    ssl = yes
    ssl_cert = </etc/dovecot/tls/tls.crt
    ssl_key = </etc/dovecot/tls/tls.key
    # Plaintext auth only inside TLS. STARTTLS on 143 and implicit TLS on 993
    # both satisfy this; an unencrypted login is refused rather than downgraded.
    disable_plaintext_auth = yes
    {{- else }}
    # TLS off. Dovecot refuses to start when ssl = yes and the certificate files
    # are absent, so this stays the default until the cluster's CA issuer exists
    # and the mail client trusts it — enabling it before then takes inbound
    # delivery down with it, since the same process serves LMTP.
    ssl = no
    disable_plaintext_auth = no
    {{- end }}

    # xoauth2 is how tenant and cluster-admin users authenticate: the client sends
    # a Keycloak access token, and the per-realm passdb blocks included below
    # validate it against the realm that issued it. plain and login stay listed so
    # a client that cannot do XOAUTH2 gets a clean authentication failure from the
    # passwd-file passdb rather than "no supported mechanism".
    auth_mechanisms = plain login xoauth2

    # Per-domain maildir, matching the catch-all the operator already writes into
    # the Postfix map ("@<domain>  <domain>/"). %d is the domain and %n the local
    # part, so mail for user@tenant.example is filed in
    # /var/mail/tenant.example/user.
    mail_location = maildir:/var/mail/%d/%n

    # Numeric, so this does not depend on the image having a vmail user. A static
    # userdb with numeric ids needs no /etc/passwd entry, and fsGroup on the Pod
    # makes the volume writable by this gid.
    mail_uid = 1000
    mail_gid = 1000
    first_valid_uid = 1000
    first_valid_gid = 1000

    # The special-use mailboxes every mail client expects to exist.
    #
    # Without these a maildir has only INBOX, and a client that needs somewhere
    # to file a sent message has nowhere to put it. Nextcloud Mail does not fall
    # back: SentMailboxHandler sets STATUS_NO_SENT_MAILBOX and returns before the
    # SMTP step, so the send fails with "Could not send message" while SMTP
    # itself is perfectly healthy — the failure names the wrong component, and
    # nothing is logged because it is a status rather than an exception.
    #
    # auto = subscribe creates each on first access and subscribes the client to
    # it, so a new mailbox is usable without anyone provisioning folders.
    namespace inbox {
      inbox = yes
      mailbox Drafts {
        special_use = \Drafts
        auto = subscribe
      }
      mailbox Sent {
        special_use = \Sent
        auto = subscribe
      }
      mailbox Trash {
        special_use = \Trash
        auto = subscribe
      }
      mailbox Junk {
        special_use = \Junk
        auto = subscribe
      }
      mailbox Archive {
        special_use = \Archive
        auto = subscribe
      }
    }

    # Accept any local part inside a domain Postfix already accepted.
    #
    # Postfix owns the domain allow-list — virtual_mailbox_domains, maintained by
    # the operator from the tenant registry — so a message only reaches LMTP if
    # its domain is registered. A static userdb therefore means "any address in a
    # registered domain", which is precisely the catch-all the Postfix map
    # declares. With no userdb at all, LMTP rejects every recipient as unknown.
    #
    # allow_all_users=yes is load-bearing, not decoration. Without it the static
    # userdb still runs a passdb lookup to confirm the user exists, and since the
    # passdb below is deliberately empty that lookup returns NOTFOUND and every
    # delivery is refused with "550 5.1.1 User doesn't exist" — LMTP listening
    # correctly and rejecting all mail regardless.
    userdb {
      driver = static
      args = uid=1000 gid=1000 home=/var/mail/%d/%n allow_all_users=yes
    }

    # Per-app passwords, one passwd-file per client type.
    #
    # Identities live in Keycloak and the OIDC login never yields a password, so
    # a mail client that cannot speak XOAUTH2 has nothing to present. The answer
    # is a credential minted per (user, app) — the pattern Google, Apple and
    # Fastmail all use — rather than one credential that opens every mailbox.
    #
    # Why one FILE per app rather than one passdb with many credentials per user:
    # a passwd-file holds a single line per user, so multiple credentials for one
    # user would normally mean a SQL or LDAP passdb. Splitting by app sidesteps
    # that entirely — each file has one line per user, and the files chain.
    #
    # result_failure = continue, so a user with a Thunderbird password but no
    # webmail password is not rejected by the first file that lacks them. The
    # empty passwd-file at the end is still the final deny.
    #
    # include_try and a glob, exactly like the realm blocks below: the operator
    # writes one <app>.conf per client type, so adding a client type needs no
    # change to this configuration.
    !include_try /etc/dovecot/apppw/*.conf

    # One oauth2 passdb per Keycloak realm, written by the operator's mail
    # reconciler into the dovecot-realm-auth Secret — the kernel realm for the
    # cluster admin, plus one per tenant using selfhosted mail.
    #
    # include_try, not include: the Secret does not exist until the operator has
    # run, and a required include that is missing stops Dovecot from starting, so
    # inbound LMTP delivery would break for want of IMAP configuration.
    #
    # Included BEFORE the passwd-file passdb so a valid token is accepted by its
    # own realm rather than being refused by the catch-all first. Only *.conf is
    # matched: each realm also has a .oauth2.ext holding its introspection
    # settings, which is read through the passdb args and must not be parsed as
    # configuration itself.
    !include_try /etc/dovecot/realms/*.conf

    # The final deny. Reached when no realm accepted the credentials, or when a
    # client offered plain/login instead of XOAUTH2.
    #
    # The file is empty, so this always fails — which is correct: password logins
    # are not a supported path, identities live in Keycloak. With no passdb at all
    # Dovecot rejects the configuration outright, and a static passdb with
    # nopassword=y would accept ANY password on port 143.
    passdb {
      driver = passwd-file
      args = /etc/dovecot/gentian/users
    }

    service lmtp {
      inet_listener lmtp {
        port = 24
      }
    }

    # The SASL server Postfix authenticates submissions against.
    #
    # Postfix and Dovecot are separate Pods here, so the usual pairing — Postfix
    # reading a UNIX socket inside Dovecot's runtime directory — is not available:
    # there is no shared filesystem. Dovecot's auth service also speaks its
    # protocol over TCP, which is what smtpd_sasl_path = inet:... expects, and that
    # is the only reason authenticated submission can work at all in this layout.
    #
    # Why authenticate a sender that is already inside the cluster: trusting a
    # client because of WHERE it connects from is not portable. mynetworks has to
    # name the Pod range, the load balancer proxies inbound mail from an address
    # outside that range on one CSP and inside it on the next, and the difference
    # between "our Keycloak" and "the internet" then depends on the provider's
    # address plan. A credential does not move when the cluster does.
    #
    # Identical userdb/passdb to IMAP, deliberately: the per-app passwd-files below
    # already hold one credential per (user, app), so submission is just another
    # app. No second identity source to keep in step.
    service auth {
      inet_listener {
        port = 12345
      }
    }

    service imap-login {
      inet_listener imap {
        port = 143
      }
      inet_listener imaps {
        {{- if .Values.tls.secretName }}
        port = 993
        ssl = yes
        {{- else }}
        # Not served without a certificate — see the ssl block above.
        port = 0
        {{- end }}
      }
    }

    # doveadm is not exposed over the network, so it needs no password. The
    # doveadm_password in dovecot-sensitive-values stays unconsumed until
    # something actually listens here.
    service doveadm {
      inet_listener {
        port = 0
      }
    }
  # Deliberately empty — see the passdb comment above. Provisioning tenant
  # identities replaces this file with a real credential source.
  users: ""
---
# All tenant mail. Without this, maildirs are written into the container
# filesystem and vanish on the next restart.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dovecot-{{ .Values.env }}-mail
  namespace: {{ .Values.servicesNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.mailStorageSize }}
  {{- if .Values.storageClass }}
  storageClassName: {{ .Values.storageClass }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dovecot-{{ .Values.env }}
  namespace: {{ .Values.servicesNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "9"
    # Restart when the credential files change, because Dovecot only reads which
    # ones exist at startup.
    #
    # The passdb blocks come from !include_try /etc/dovecot/apppw/*.conf, and that
    # glob is expanded ONCE, when the process starts. The kubelet keeps the mounted
    # files current, so an existing passwd-file picks up a changed password with no
    # restart — but a passwd-file that did not exist when Dovecot started is not in
    # the configuration at all, however present it is on disk.
    #
    # The operator writes one pair of files per tenant per app, so every new tenant
    # produces a new .conf. Without this annotation that tenant's users authenticate
    # against a passdb Dovecot has never read: every login fails as a wrong
    # password, with nothing in the log but "auth failed", while the file sits in
    # the mount looking correct. It happened here the first time the files were
    # split per tenant — one tenant's users could not log in until Dovecot was
    # restarted by hand, and the Nextcloud Mail UI showed it as an endless spinner.
    #
    # Cheap in practice: the operator rewrites this Secret only when a credential
    # actually changes (the hashes are verified before they are rewritten), so this
    # is not a restart per reconcile. A restart drops IMAP connections, which
    # clients reopen, and interrupts LMTP, which Postfix retries — no mail is lost
    # either way.
    secret.reloader.stakater.com/reload: dovecot-app-passwords
  labels:
    app.kubernetes.io/name: dovecot
    app.kubernetes.io/instance: dovecot-{{ .Values.env }}
    gentianos.io/component: kernel-mail
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the mail volume is ReadWriteOnce, so a rolling
  # update would leave the new Pod Pending on a volume the old one still holds
  # until a timeout, with mail undeliverable in the meantime.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dovecot
      app.kubernetes.io/instance: dovecot-{{ .Values.env }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dovecot
        app.kubernetes.io/instance: dovecot-{{ .Values.env }}
    spec:
      # Mail processes run as 1000 (mail_uid/mail_gid in dovecot.conf); fsGroup
      # makes the volume group-writable by them. Without it the first delivery
      # fails on a root-owned mount point.
      securityContext:
        fsGroup: 1000
      volumes:
        - name: config
          configMap:
            name: dovecot-{{ .Values.env }}-config
        - name: mail
          persistentVolumeClaim:
            claimName: dovecot-{{ .Values.env }}-mail
        # Written by the operator, one pair of files per Keycloak realm. optional
        # because it does not exist until the operator has reconciled something —
        # a required Secret volume that is absent holds the Pod in
        # ContainerCreating, which would make inbound mail wait on IMAP config.
        - name: realm-auth
          secret:
            secretName: dovecot-realm-auth
            optional: true
            # 0444, not 0400. fsGroup 1000 gives every mounted file group vmail,
            # but the auth process runs as dovecot (uid 101, gid 102) and is not
            # in that group — so 0400 is unreadable by the one process that needs
            # it, and the passdb fails with "Permission denied ... we're not in
            # group 1000(vmail)" rather than with a wrong-password error.
            #
            # World-readable is bounded here: this container runs Dovecot and
            # nothing else, so "other" is Dovecot's own processes. The passdb
            # holds ARGON2ID hashes rather than passwords in any case.
            defaultMode: 0444
        # One passwd-file plus one .conf per client type, written by the
        # operator. optional so a cluster with no mail clients yet still starts
        # and serves LMTP — inbound delivery does not depend on this, only
        # retrieval does.
        - name: app-passwords
          secret:
            secretName: dovecot-app-passwords
            optional: true
            # 0444, not 0400. fsGroup 1000 gives every mounted file group vmail,
            # but the auth process runs as dovecot (uid 101, gid 102) and is not
            # in that group — so 0400 is unreadable by the one process that needs
            # it, and the passdb fails with "Permission denied ... we're not in
            # group 1000(vmail)" rather than with a wrong-password error.
            #
            # World-readable is bounded here: this container runs Dovecot and
            # nothing else, so "other" is Dovecot's own processes. The passdb
            # holds ARGON2ID hashes rather than passwords in any case.
            defaultMode: 0444
        {{- if .Values.tls.secretName }}
        # NOT optional: ssl = yes is already rendered above, and Dovecot exits
        # rather than start without the files. Holding the Pod in
        # ContainerCreating is the better failure — it is visible, and it does not
        # crashloop LMTP alongside IMAP. The Secret is the cluster wildcard, which
        # exists in this namespace before this chart syncs; set tls.secretName
        # empty on a cluster that has no such certificate.
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName }}
            defaultMode: 0400
        {{- end }}
      containers:
        - name: dovecot
          image: dovecot/dovecot:2.3.21
          imagePullPolicy: IfNotPresent
          # The image entrypoint builds configuration from its own environment
          # into conf.d. Running the binary directly with -c bypasses that
          # entirely, so the only configuration in play is the mounted file —
          # otherwise what runs depends on which image tag was pulled.
          command: ["dovecot"]
          args: ["-F", "-c", "/etc/dovecot/gentian/dovecot.conf"]
          volumeMounts:
            - name: config
              mountPath: /etc/dovecot/gentian
              readOnly: true
            # Must match dovecotRealmAuthMountPath in the mail reconciler, which
            # writes this path into the generated passdb args.
            - name: realm-auth
              mountPath: /etc/dovecot/realms
              readOnly: true
            - name: app-passwords
              mountPath: /etc/dovecot/apppw
              readOnly: true
            {{- if .Values.tls.secretName }}
            - name: tls
              mountPath: /etc/dovecot/tls
              readOnly: true
            {{- end }}
            - name: mail
              mountPath: /var/mail
          # Kept deliberately, not required. platform-kernel IS in the exclusion
          # list of the Kyverno baseline policies, so nothing here is enforced
          # against this Pod — these are set anyway so the workload stays
          # deployable if that exclusion is ever tightened.
          #
          # runAsNonRoot and a capability drop are deliberately NOT set: Dovecot
          # binds 143/993/24, all privileged ports. Kyverno's non-root and
          # capabilities rules use "=(securityContext)" conditionals, so they only
          # engage on keys that are present — omitting them keeps the workload
          # compliant without a MAC waiver.
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: imap
              containerPort: 143
            {{- if .Values.tls.secretName }}
            - name: imaps
              containerPort: 993
            {{- end }}
            - name: lmtp
              containerPort: 24
            - name: sasl
              containerPort: 12345
          # Both probe LMTP, not IMAP: LMTP is the port that has to work for mail
          # to be delivered at all, and it is the one Postfix depends on. Without
          # a probe the Pod reports Ready the moment the container starts, so
          # `kubectl wait --for=condition=Available` in verify_dovecot_installation
          # passed against a Dovecot that had failed to parse its config.
          readinessProbe:
            tcpSocket:
              port: lmtp
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: lmtp
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dovecot-{{ .Values.env }}
  namespace: {{ .Values.servicesNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "9"
  labels:
    app.kubernetes.io/name: dovecot
    app.kubernetes.io/instance: dovecot-{{ .Values.env }}
    gentianos.io/component: kernel-mail
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dovecot
    app.kubernetes.io/instance: dovecot-{{ .Values.env }}
  ports:
    - name: lmtp
      port: 24
      targetPort: lmtp
    - name: imap
      port: 143
      targetPort: imap
    # Reachable only inside the cluster, like every other port here: the Service
    # is ClusterIP and nothing in the Gateway forwards to it.
    - name: sasl
      port: 12345
      targetPort: sasl
    {{- if .Values.tls.secretName }}
    - name: imaps
      port: 993
      targetPort: imaps
    {{- end }}
{{- if and .Values.tls.secretName .Values.imapIngress.enabled }}
---
# The public IMAPS endpoint.
#
# Separate from the ClusterIP Service above rather than a second port on it,
# because a LoadBalancer Service publishes EVERY port it declares: adding 993 to
# that one would have put LMTP on 24 and the SASL socket on 12345 on the
# internet as well. LMTP accepts mail for any hosted domain without
# authenticating — it is the delivery path, and Postfix is supposed to be the
# only thing that can reach it.
apiVersion: v1
kind: Service
metadata:
  name: dovecot-{{ .Values.env }}-imaps
  namespace: {{ .Values.servicesNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "9"
    {{- with .Values.imapIngress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  labels:
    app.kubernetes.io/name: dovecot
    app.kubernetes.io/instance: dovecot-{{ .Values.env }}
    gentianos.io/component: kernel-mail
spec:
  type: LoadBalancer
  # Preserves the client address, which is what Dovecot logs on a failed login
  # and therefore the only way to tell a locked-out user from a password spray.
  externalTrafficPolicy: Local
  {{- with .Values.imapIngress.loadBalancerIP }}
  loadBalancerIP: {{ . | quote }}
  {{- end }}
  selector:
    app.kubernetes.io/name: dovecot
    app.kubernetes.io/instance: dovecot-{{ .Values.env }}
  ports:
    - name: imaps
      port: 993
      targetPort: imaps
      protocol: TCP
{{- end }}
