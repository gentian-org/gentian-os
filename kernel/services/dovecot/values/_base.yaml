# =============================================================================
# Dovecot app-level defaults (all environments)
# =============================================================================
# Layer 2 of the values hierarchy (merged after values/env/{env}.yaml).
# Secrets and env-specific sizes belong in {env}/values-sensitive.yaml.tftpl.
# =============================================================================

# Image override — chart defaults to external-registry.souvap-univention.de which is unreachable.
# Tags from opendesk/helmfile/environments/default/images.yaml.gotmpl (chart 3.4.1).
image:
  registry: "registry.opencode.de"
  repository: "bmi/opendesk/components/supplier/open-xchange/images/dovecot-public-sector"
  tag: "2.3.21@sha256:c76965a84d1ca527f523404eb027119f6736b199c094e4671037cb345ecad3dc"
  pullPolicy: IfNotPresent

imageInitDovecot:
  registry: "registry-1.docker.io"
  repository: "alpine/k8s"
  tag: "1.34.0@sha256:b5f6edfeac5279f3e182d938d1ffecb62f7c980756ac4b6b66d7f0d566782f77"
  pullPolicy: IfNotPresent

# IMAP + LMTP service only (no POP3 NodePort)
service:
  external:
    enabled: false

# Container security context — matches opendesk reference (needs linux caps for mail)
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - "ALL"
    add:
      - "CHOWN"
      - "DAC_OVERRIDE"
      - "KILL"
      - "NET_BIND_SERVICE"
      - "SETGID"
      - "SETUID"
      - "SYS_CHROOT"
  enabled: true
  readOnlyRootFilesystem: true
  seccompProfile:
    type: RuntimeDefault

podSecurityContext:
  enabled: true
  fsGroup: 1000

# Single replica for dev
replicaCount: 1

# Persistence — size overridden per-env
persistence:
  accessModes:
    - ReadWriteOnce
  enabled: true

dovecot:
  # Mail domain — overridden per-env
  ldap:
    enabled: true
    port: 389
    # base and dn set per-env (dc=swp-ldap,dc=internal)
  oidc:
    enabled: true
    introspectionScheme: "http"
    introspectionPath: "/realms/kernel/protocol/openid-connect/token/introspect"
    usernameAttribute: "gentian_username"
  migration:
    enabled: false
  protocol:
    imap:
      limits:
        maxUserIpConnections: 10
  quotaRules:
    - "*:storage=5000M"
    - "Trash:storage=+500M"
  quotaGrace: "500M"
  sieve:
    notify:
      mailtoEnvelopeFrom: "orig_recipient"
  submission:
    enabled: true
    ssl: "no"
    # host overridden per-env
