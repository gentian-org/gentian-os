# =============================================================================
# Shared kernel MariaDB — ESO ExternalSecret
#
# Renders the 2 sensitive Helm value paths (root password + openxchange user
# password) as a single sensitive-values.yaml Helm values file, consumed by
# the Release CR via valuesFrom.secretKeyRef.
#
# The full job.users list (username + connectionLimit + password) is rendered
# here because Helm list-merge replaces the entire array.
#
# Source: gentian-os/kernel/database/mariadb
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mariadb-sensitive-values
  namespace: gentian-infra-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: mariadb-sensitive-values
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # provider-helm reads this key as a Helm values file (merged last → wins).
        sensitive-values.yaml: |
          mariadb:
            rootPassword:
              value: {{ .root_password | quote }}
          job:
            users:
              - username: openxchange_user
                connectionLimit: 100
                password: {{ .openxchange_password | quote }}
  data:
    - secretKey: root_password
      remoteRef:
        key: gentian-os/kernel/database/mariadb
        property: root_password
    - secretKey: openxchange_password
      remoteRef:
        key: gentian-os/kernel/database/mariadb
        property: openxchange_password
