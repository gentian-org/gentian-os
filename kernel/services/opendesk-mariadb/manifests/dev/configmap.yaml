# =============================================================================
# Shared kernel MariaDB — plain values ConfigMaps
#
# Two ConfigMaps merged by provider-helm before the sensitive-values Secret:
#   1. mariadb-base-values  — non-secret defaults for all environments
#   2. mariadb-dev-values   — env-specific sizing and non-secret overrides
#
# DO NOT put any secret values here.  All passwords come from the
# mariadb-sensitive-values Secret (see externalsecret.yaml).
#
# job.users is intentionally omitted (only username + connectionLimit, no
# password): the sensitive-values.yaml template renders the complete list.
# mariadb.rootPassword.value placeholder is overridden by sensitive-values.
# =============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mariadb-base-values
  namespace: gentian-infra-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  values.yaml: |
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      enabled: true
      privileged: false
      runAsUser: 1001
      runAsGroup: 1001
      seccompProfile:
        type: RuntimeDefault
      readOnlyRootFilesystem: true
      runAsNonRoot: true

    podSecurityContext:
      enabled: true
      fsGroup: 1001
      fsGroupChangePolicy: OnRootMismatch

    job:
      enabled: true
      retries: 10
      wait: 30
      databases:
        - name: configdb
          user: ""
        - name: openxchange_dummy
          user: openxchange_user

    cleanup:
      deletePodsOnSuccess: true
      deletePodsOnSuccessTimeout: 60

    persistence:
      enabled: true

    global:
      ingress:
        enabled: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mariadb-dev-values
  namespace: gentian-infra-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  values.yaml: |
    persistence:
      size: 1Gi

    resources:
      limits:
        cpu: "4"
        memory: 2Gi
      requests:
        cpu: 100m
        memory: 384Mi
