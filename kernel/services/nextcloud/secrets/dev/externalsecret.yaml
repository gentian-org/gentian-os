apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-redis-cache
  namespace: gentian-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: nextcloud-redis-cache
    creationPolicy: Owner
  data:
    - secretKey: redis-password
      remoteRef:
        key: gentian-os/kernel/cache/redis
        property: auth_password
