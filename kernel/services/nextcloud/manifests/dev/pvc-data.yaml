# =============================================================================
# Nextcloud data PVC — persistent storage for Nextcloud user home directories.
#
# The opendesk-nextcloud chart hard-codes the nextcloud-data volume as emptyDir,
# which means user home directories (under /var/nextcloud/data/nextcloud_data/)
# are wiped on every pod restart.  This PVC is mounted over that subdirectory
# via aio.extraVolumes / aio.extraVolumeMounts in the nextcloud-base-values
# ConfigMap, making user home directories persist across pod restarts.
#
# Actual file content lives in MinIO (S3 primary objectstore); the local data
# dir only holds user metadata (app data, thumbnails, skeleton directories).
# 10 Gi is sufficient for this purpose in the dev environment.
#
# Storage class: microk8s-hostpath (local node filesystem)
# nfs-csi cannot be used: the NFS server (Synology) has root squash enabled,
# which prevents the kubelet from applying fsGroup=65532 ownership before the
# container starts.  With microk8s-hostpath the kubelet (root) chowns the
# directory on the local filesystem before the container starts — the container
# (nginx / UID 101, GID 65532) can then read and write its data directory
# without needing any in-container chmod/chown operations.
# =============================================================================
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-data-pvc
  namespace: gentian-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: microk8s-hostpath
  resources:
    requests:
      storage: 10Gi
