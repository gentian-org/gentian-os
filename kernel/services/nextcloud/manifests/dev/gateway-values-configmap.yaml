# ROUTING_MODE=gateway overlay for nextcloud AIO (merged last via optional valuesFrom).
apiVersion: v1
kind: ConfigMap
metadata:
  name: nextcloud-gateway-values
  namespace: gentian-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  values.yaml: |
    aio:
      ingress:
        enabled: false
