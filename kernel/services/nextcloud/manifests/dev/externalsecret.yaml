# =============================================================================
# nextcloud (AIO) — ESO ExternalSecret (Pattern B)
# Replaces helm_release.nextcloud set_sensitive blocks from nextcloud.tf.
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-sensitive-values
  namespace: gentian-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: nextcloud-sensitive-values
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        sensitive-values.yaml: |
          aio:
            configuration:
              database:
                auth:
                  password:
                    value: {{ .pg_nextcloud_user_password | quote }}
              statusPhp:
                password:
                  enabled: true
                  value: {{ .nc_status_password | quote }}
          exporter:
            configuration:
              token:
                value: {{ .nc_metrics_token | quote }}
  data:
    - secretKey: pg_nextcloud_user_password
      remoteRef:
        key: gentian-os/kernel/apps/nextcloud
        property: db_password
    - secretKey: nc_status_password
      remoteRef:
        key: gentian-os/kernel/apps/nextcloud
        property: status_password
    - secretKey: nc_metrics_token
      remoteRef:
        key: gentian-os/kernel/apps/nextcloud
        property: metrics_token
