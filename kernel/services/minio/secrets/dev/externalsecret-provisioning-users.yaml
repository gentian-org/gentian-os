apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-provisioning-users
  namespace: gentian-infra-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: minio-provisioning-users
    creationPolicy: Owner
    # The MinIO provisioning job consumes usersExistingSecrets as files.
    # Each key is treated as a filename whose value is an ini-format block:
    #   username=<user>
    #   password=<pass>
    #   disabled=false
    #   policies=<policy>
    #   setPolicies=true
    template:
      type: Opaque
      data:
        migration_user: |
          username=migration_user
          password={{ .migrations_password }}
          disabled=false
          policies=migrations-bucket-policy
          setPolicies=true
        nextcloud_user: |
          username=nextcloud_user
          password={{ .nextcloud_minio_password }}
          disabled=false
          policies=nextcloud-bucket-policy
          setPolicies=true
        openxchange_user: |
          username=openxchange_user
          password={{ .openxchange_minio_password }}
          disabled=false
          policies=openxchange-bucket-policy
          setPolicies=true
        ums_user: |
          username=ums_user
          password={{ .ums_password }}
          disabled=false
          policies=ums-bucket-policy
          setPolicies=true
  data:
    - secretKey: migrations_password
      remoteRef:
        key: gentian-os/kernel/storage/minio
        property: migrations_password
    - secretKey: nextcloud_minio_password
      remoteRef:
        key: gentian-os/kernel/apps/nextcloud
        property: minio_password
    - secretKey: openxchange_minio_password
      remoteRef:
        key: gentian-os/kernel/apps/ox
        property: minio_password
    - secretKey: ums_password
      remoteRef:
        key: gentian-os/kernel/storage/minio
        property: ums_password
