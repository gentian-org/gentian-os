# =============================================================================
# MinIO app-level defaults (all environments)
# =============================================================================
# Layer 2 of the values hierarchy. {env}/values.yaml provides:
#   auth.rootPassword, provisioning.users[].password, provisioning.resources,
#   persistence.size, resources, statefulset.replicaCount
# =============================================================================

# storageClass/imagePullSecrets come from values/env/{env}.yaml
global:
  security:
    # Required when using docker.io/bitnamilegacy/* images with the Bitnami chart.
    allowInsecureImages: true
  ingress:
    enabled: false

# API Ingress (disabled — internal ClusterIP access)
apiIngress:
  enabled: false

# Container Security Context
containerSecurityContext:
  enabled: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  privileged: false
  runAsUser: 1001
  runAsGroup: 1001
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  seccompProfile:
    type: RuntimeDefault

# Pod Security Context
podSecurityContext:
  enabled: true
  fsGroup: 1001

# Image — Bitnami MinIO on Debian 12 (docker.io/bitnamilegacy/minio)
image:
  registry: docker.io
  repository: bitnamilegacy/minio
  tag: 2025.4.22-debian-12-r1
  pullPolicy: IfNotPresent

# Volume permissions init container
volumePermissions:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/os-shell
    tag: 12-debian-12-r44
    pullPolicy: IfNotPresent

# Console ingress (disabled)
ingress:
  enabled: false

# Readiness/liveness probes
livenessProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 10
readinessProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 10
startupProbe:
  enabled: true
  periodSeconds: 10
  timeoutSeconds: 10

# Mode — standalone (1 node); production can use distributed
mode: standalone

# Metrics (no Prometheus in this deployment)
metrics:
  serviceMonitor:
    enabled: false

# Network policy (managed at cluster level)
networkPolicy:
  enabled: false

# Persistence — size overridden per-env; storageClass from values/env/{env}.yaml
persistence:

# StatefulSet — drivesPerNode fixed; replicaCount overridden per-env
statefulset:
  drivesPerNode: 1

# Provisioning disabled — tenant apps create buckets via the storage reconciler.
provisioning:
  enabled: false
