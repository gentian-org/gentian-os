# =============================================================================
# ox-connector-provisioning-api — ExternalSecret (ESO)
# =============================================================================
# Creates the Kubernetes Secret "ox-connector-provisioning-api" in gentian-dev.
# Nubus reads this Secret (key: "registration") when apps.oxAppSuite.enabled=true
# to register the ox-connector as a Nubus provisioning consumer.
#
# The "registration" key contains a JSON subscription payload specifying:
#   - consumer name "ox-connector"
#   - UDM topics: users/user and groups/group
#   - request_prefill: true (sync all existing LDAP objects on startup)
#   - the same password used to authenticate to the provisioning API
#
# The "password" key is read separately by the ox-connector chart to authenticate.
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ox-connector-provisioning-api
  namespace: gentian-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: ox-connector-provisioning-api
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Bare password — read directly by ox-connector chart (provisioningApi.auth.password)
        password: "{{ .provisioning_password }}"
        # Registration JSON — consumed by nubus registerConsumers job
        registration: |
          {
            "name": "ox-connector",
            "realms_topics": [
              {"realm": "udm", "topic": "users/user"},
              {"realm": "udm", "topic": "groups/group"}
            ],
            "request_prefill": true,
            "password": "{{ .provisioning_password }}"
          }
  data:
    - secretKey: provisioning_password
      remoteRef:
        key: gentian-os/kernel/apps/ox
        property: connector_provisioning_api_password
