# =============================================================================
# ox-appsuite — ESO ExternalSecret (standalone credentials)
#
# Creates ox-appsuite-credentials K8s Secret in gentian-dev.
# Deployed by the external-secrets ApplicationSet (02-external-secrets.yaml)
# which watches kernel/services/ox-appsuite/secrets/{env}/.
#
# These individual keys are available for Pattern A consumers (portal links,
# admin tooling, integration bindings) that need to reference OX credentials
# directly without going through the provider-helm valuesFrom mechanism.
#
# The main sensitive-values.yaml file for the provider-helm Release CRs lives
# in kernel/services/ox-appsuite/manifests/dev/externalsecret.yaml.
#
# Sources:
#   gentian-os/kernel/apps/ox      — app-internal secrets
#   gentian-os/kernel/database/mariadb — MariaDB OX user password
#   gentian-os/kernel/apps/ox          — LDAP bind password (plus app-internal secrets)
#   gentian-os/kernel/identity/nubus   — SMTP password
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ox-appsuite-credentials
  namespace: gentian-dev
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: ox-appsuite-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: admin-password
      remoteRef:
        key: gentian-os/kernel/apps/ox
        property: admin_password
    - secretKey: cookie-hash-salt
      remoteRef:
        key: gentian-os/kernel/apps/ox
        property: cookie_hash_salt
    - secretKey: share-crypt-key
      remoteRef:
        key: gentian-os/kernel/apps/ox
        property: share_crypt_key
    - secretKey: sessiond-encryption-key
      remoteRef:
        key: gentian-os/kernel/apps/ox
        property: sessiond_encryption_key
    - secretKey: oidc-client-secret
      remoteRef:
        key: gentian-os/kernel/apps/ox
        property: oidc_client_secret
    - secretKey: connector-provisioning-api-password
      remoteRef:
        key: gentian-os/kernel/apps/ox
        property: connector_provisioning_api_password
    - secretKey: mariadb-password
      remoteRef:
        key: gentian-os/kernel/database/mariadb
        property: openxchange_password
    - secretKey: ldap-bind-password
      remoteRef:
        key: gentian-os/kernel/apps/ox
        property: ldap_search_password
    - secretKey: smtp-password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: smtp_password
