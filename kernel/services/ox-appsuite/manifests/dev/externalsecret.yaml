# =============================================================================
# ox-appsuite — ESO ExternalSecret (Pattern B sensitive values)
#
# Renders a sensitive-values.yaml Helm values file consumed by all three
# provider-helm Release CRs via valuesFrom.secretKeyRef:
#   - ox-appsuite-dev       (appsuite-public-sector)
#   - ox-bootstrap-dev      (opendesk-open-xchange-bootstrap)
#   - ox-connector-dev      (ox-connector)
#
# Each chart reads only its own top-level keys from the merged values;
# unknown keys are silently ignored by Helm during template rendering.
#
# Sources:
#   gentian-os/kernel/apps/ox           — app-internal secrets
#   gentian-os/kernel/database/mariadb  — MariaDB OX user + root passwords
#   gentian-os/kernel/storage/minio     — MinIO OX S3 secret key
#   gentian-os/kernel/identity/nubus    — LDAP bind password, SMTP password
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ox-appsuite-sensitive-values
  namespace: gentian-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: ox-appsuite-sensitive-values
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # provider-helm reads this key as a Helm values file (merged last → wins).
        sensitive-values.yaml: |
          # ── appsuite-public-sector ──────────────────────────────────────────
          global:
            appsuite:
              cookieHashSalt: {{ .cookie_hash_salt | quote }}
              shareCryptKey: {{ .share_crypt_key | quote }}
              sessiondEncryptionKey: {{ .sessiond_encryption_key | quote }}
            mysql:
              auth:
                password: {{ .openxchange_password | quote }}
                rootPassword: {{ .mariadb_root_password | quote }}
                readPassword: {{ .openxchange_password | quote }}
          appsuite:
            core-mw:
              masterPassword: {{ .ox_admin_password | quote }}
              redis:
                auth:
                  password: {{ .redis_auth_password | quote }}
              properties:
                com.openexchange.oidc.clientSecret: {{ .oidc_client_secret | quote }}
              propertiesFiles:
                /opt/open-xchange/etc/filestore-s3.properties:
                  com.openexchange.filestore.s3.ox-filestore-s3.secretKey: {{ .minio_openxchange_password | quote }}
                /opt/open-xchange/etc/ldapauth.properties:
                  bindDNPassword: {{ .ldapsearch_ox | quote }}
          # ── ox-connector ───────────────────────────────────────────────────
          openXchange:
            auth:
              password: {{ .ox_admin_password | quote }}
          provisioningApi:
            auth:
              password: {{ .connector_provisioning_api_password | quote }}
  data:
    # OX app-internal secrets
    - secretKey: cookie_hash_salt
      remoteRef:
        key: gentian-os/kernel/apps/ox
        property: cookie_hash_salt
    - secretKey: share_crypt_key
      remoteRef:
        key: gentian-os/kernel/apps/ox
        property: share_crypt_key
    - secretKey: sessiond_encryption_key
      remoteRef:
        key: gentian-os/kernel/apps/ox
        property: sessiond_encryption_key
    - secretKey: oidc_client_secret
      remoteRef:
        key: gentian-os/kernel/apps/ox
        property: oidc_client_secret
    - secretKey: ox_admin_password
      remoteRef:
        key: gentian-os/kernel/apps/ox
        property: admin_password
    - secretKey: connector_provisioning_api_password
      remoteRef:
        key: gentian-os/kernel/apps/ox
        property: connector_provisioning_api_password
    # MariaDB credentials
    - secretKey: openxchange_password
      remoteRef:
        key: gentian-os/kernel/database/mariadb
        property: openxchange_password
    - secretKey: mariadb_root_password
      remoteRef:
        key: gentian-os/kernel/database/mariadb
        property: root_password
    # MinIO S3 credentials
    - secretKey: minio_openxchange_password
      remoteRef:
        key: gentian-os/kernel/storage/minio
        property: openxchange_password
    # LDAP bind password (Nubus)
    - secretKey: ldapsearch_ox
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: ldapsearch_ox
    # Redis cache password
    - secretKey: redis_auth_password
      remoteRef:
        key: gentian-os/kernel/cache/redis
        property: auth_password
