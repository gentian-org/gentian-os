---
# Job 1: Fix the ox-connector PVC ModuleAccessDefinitions.properties.
# Root cause: opendesk_standard has globalAddressBookDisabled=TRUE but the user
# marco-testo was created in OX without infostore. OX refuses changeByModuleAccess
# when setting globalAddressBookDisabled=True for a non-PIM (no infostore) user,
# even if infostore=True is also being set in the same call (OX validates current
# state, not desired state).
# Fix: remove globalAddressBookDisabled from opendesk_standard profile.
# Standard users in a single-org deployment should be able to see the GAB.
# infostore=True (set via Job 2/LDAP fix) is kept so users have full PIM.
apiVersion: batch/v1
kind: Job
metadata:
  name: ox-connector-pvc-patch-infostore
  namespace: gentian-dev
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 120
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      volumes:
        - name: appcenter
          persistentVolumeClaim:
            claimName: ox-connector-dev-appcenter-ox-connector-dev-0
      containers:
        - name: patch
          image: docker.io/alpine:3.19
          command:
            - /bin/sh
            - -c
            - |
              FILE=/appcenter/data/ModuleAccessDefinitions.properties
              if [ ! -f "$FILE" ]; then
                echo "ERROR: $FILE not found"
                exit 1
              fi
              echo "Current content:"
              cat "$FILE"
              echo ""
              # Write the correct profile: all original modules + infostore,
              # WITHOUT globaladdressbookdisabled (which causes OX crash).
              CORRECT="opendesk_standard=activesync,calendar,collectemailaddresses,contacts,delegatetask,deniedportal,editpublicfolders,ical,infostore,multiplemailaccounts,readcreatesharedfolders,subscription,syncml,tasks,usm,vcard,webdav,webmail"
              CURRENT=$(grep "^opendesk_standard=" "$FILE" || true)
              if [ "$CURRENT" = "$CORRECT" ]; then
                echo "Profile already correct — no change needed"
              else
                sed -i "s|^opendesk_standard=.*|${CORRECT}|" "$FILE"
                echo "Patched: removed globaladdressbookdisabled from opendesk_standard"
                echo "New content:"
                cat "$FILE"
              fi
          volumeMounts:
            - name: appcenter
              mountPath: /appcenter
---
# Job 2: Fix the opendesk_standard LDAP access profile.
# Sets oxRightGlobaladdressbookdisabled: FALSE (removes the GAB restriction that
# triggers the OX crash) and keeps oxRightInfostore: TRUE (already set).
# This is the root-cause fix for fresh installs: when ox-connector prefills from
# LDAP, the generated profile will not include globaladdressbookdisabled.
apiVersion: batch/v1
kind: Job
metadata:
  name: ox-connector-ldap-infostore
  namespace: gentian-dev
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 120
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: ldapmodify
          image: docker.io/alpine:3.19
          command:
            - /bin/sh
            - -c
            - |
              apk add --no-cache openldap-clients 2>/dev/null
              until ldapsearch -x -H ldap://nubus-dev-ldap-server:389 \
                -D "cn=admin,dc=swp-ldap,dc=internal" \
                -w "${LDAP_ADMIN_PW}" \
                -b "dc=swp-ldap,dc=internal" "(cn=opendesk_standard)" cn >/dev/null 2>&1; do
                echo "Waiting for LDAP..."
                sleep 5
              done

              CURRENT=$(ldapsearch -x -H ldap://nubus-dev-ldap-server:389 \
                -D "cn=admin,dc=swp-ldap,dc=internal" \
                -w "${LDAP_ADMIN_PW}" \
                -b "cn=opendesk_standard,cn=accessprofiles,cn=open-xchange,dc=swp-ldap,dc=internal" \
                "(cn=opendesk_standard)" oxRightGlobaladdressbookdisabled 2>/dev/null)

              if echo "$CURRENT" | grep -q "oxRightGlobaladdressbookdisabled: FALSE"; then
                echo "oxRightGlobaladdressbookdisabled already FALSE — no change needed"
                exit 0
              fi

              echo "Setting oxRightGlobaladdressbookdisabled: FALSE on opendesk_standard..."
              printf '%s\n' \
                "dn: cn=opendesk_standard,cn=accessprofiles,cn=open-xchange,dc=swp-ldap,dc=internal" \
                "changetype: modify" \
                "replace: oxRightGlobaladdressbookdisabled" \
                "oxRightGlobaladdressbookdisabled: FALSE" \
                | ldapmodify -x -H ldap://nubus-dev-ldap-server:389 \
                  -D "cn=admin,dc=swp-ldap,dc=internal" \
                  -w "${LDAP_ADMIN_PW}"
              echo "Done: oxRightGlobaladdressbookdisabled: FALSE set on opendesk_standard"
          env:
            - name: LDAP_ADMIN_PW
              valueFrom:
                secretKeyRef:
                  name: nubus-dev-ldap-server-admin
                  key: password
---
# Job 3: Activate the four groupware portal tiles in LDAP.
# Root cause: nubusStackDataUms.templateContext.apps.oxAppSuite.enabled must stay
# false (true triggers a UDM 422 that aborts the stack-data-ums job before the
# portal config step). This means stack-data-ums always seeds swp.groupware_*
# portal entries with univentionNewPortalEntryActivate: FALSE. Since OX IS
# deployed on this cluster, activate the tiles explicitly via LDAP instead.
# This job is idempotent and re-runs on every ArgoCD sync to keep them active.
apiVersion: batch/v1
kind: Job
metadata:
  name: ox-activate-portal-tiles
  namespace: gentian-dev
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 120
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: ldapmodify
          image: docker.io/alpine:3.19
          command:
            - /bin/sh
            - -c
            - |
              apk add --no-cache openldap-clients 2>/dev/null
              BASE="cn=entry,cn=portals,cn=univention,dc=swp-ldap,dc=internal"
              LDAP_URL="ldap://nubus-dev-ldap-server:389"
              BIND_DN="cn=admin,dc=swp-ldap,dc=internal"
              for TILE in swp.groupware_mail swp.groupware_calendar swp.groupware_contacts swp.groupware_tasks; do
                CURRENT=$(ldapsearch -x -H "$LDAP_URL" -D "$BIND_DN" -w "${LDAP_ADMIN_PW}" \
                  -b "cn=${TILE},${BASE}" "(cn=${TILE})" univentionNewPortalEntryActivate 2>/dev/null \
                  | grep "^univentionNewPortalEntryActivate:" | awk '{print $2}')
                if [ "$CURRENT" = "TRUE" ]; then
                  echo "${TILE}: already TRUE — skipping"
                else
                  printf '%s\n' \
                    "dn: cn=${TILE},${BASE}" \
                    "changetype: modify" \
                    "replace: univentionNewPortalEntryActivate" \
                    "univentionNewPortalEntryActivate: TRUE" \
                    | ldapmodify -x -H "$LDAP_URL" -D "$BIND_DN" -w "${LDAP_ADMIN_PW}"
                  echo "${TILE}: activated"
                fi
              done
          env:
            - name: LDAP_ADMIN_PW
              valueFrom:
                secretKeyRef:
                  name: nubus-dev-ldap-server-admin
                  key: password
