# =============================================================================
# ox-appsuite: register ox-connector subscription in nubus provisioning API
# (ArgoCD PostSync hook)
#
# The ox-connector chart creates the ox-connector-dev-provisioning-api Secret
# with a stable password (from OpenBao via ExternalSecret), but does NOT
# automatically register the subscription with the nubus provisioning API.
#
# This PostSync Job uses the registration JSON already embedded in that Secret
# to idempotently register/confirm the subscription on every sync. This ensures
# the subscription survives a full reinstall of nubus (where its NATS/DB state
# would be wiped).
#
# API response codes:
#   201 — subscription created (first install or after nubus wipe)
#   200 — already registered with same parameters (normal upgrades)
# =============================================================================
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ox-connector-provisioning-subscription
  namespace: gentian-dev
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 120
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: register
          image: docker.io/curlimages/curl:8.5.0
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Registering ox-connector subscription with provisioning API..."
              RESPONSE=$(curl -s \
                -o /tmp/response.txt \
                -w "%{http_code}" \
                -u "${ADMIN_USERNAME}:${ADMIN_PASSWORD}" \
                -H "Content-Type: application/json" \
                -d "@/registration/registration" \
                "${PROVISIONING_API_URL}")
              echo "HTTP status: ${RESPONSE}"
              cat /tmp/response.txt
              echo ""
              if [ "${RESPONSE}" = "201" ]; then
                echo "Subscription created successfully."
              elif [ "${RESPONSE}" = "200" ]; then
                echo "Subscription already registered with same parameters."
              else
                echo "ERROR: Failed to register subscription (HTTP ${RESPONSE})"
                exit 1
              fi
          env:
            - name: ADMIN_USERNAME
              value: "admin"
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nubus-dev-provisioning-api-admin
                  key: password
            - name: PROVISIONING_API_URL
              value: "http://nubus-dev-provisioning-api/v1/subscriptions"
          volumeMounts:
            - name: registration
              mountPath: /registration
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
            runAsNonRoot: true
            runAsUser: 100
      volumes:
        - name: registration
          secret:
            secretName: ox-connector-dev-provisioning-api
      securityContext:
        seccompProfile:
          type: RuntimeDefault
