apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  # The Cluster Composition owns this object (cluster-default.yaml, where the
  # reasons are); this copy is what the installer applies when the object is
  # not there yet, and says the same: the kernel's store is usable from the
  # kernel and system namespaces, and from no tenant's.
  conditions:
    - namespaceSelector:
        matchExpressions:
          - key: gentianos.io/tier
            operator: In
            values:
              - kernel
              - system
  provider:
    vault:
      # In-cluster DNS — works from any namespace.
      server: https://openbao.kernel-secrets.svc.cluster.local:8200
      path: secret
      version: v2
      caProvider:
        type: Secret
        name: openbao-tls
        namespace: kernel-secrets
        key: tls.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso
          serviceAccountRef:
            name: external-secrets
            namespace: kernel-secrets
