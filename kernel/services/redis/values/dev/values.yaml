# Redis dev — secrets + env-specific sizes (app defaults in _base.yaml)
# auth.password removed — redis reads from the redis-credentials Secret
# provisioned by ExternalSecret (ESO → OpenBao → gentian/dev/redis.auth_password).
auth:
    existingSecret: redis-credentials
    existingSecretPasswordKey: redis-password
master:
    persistence:
        size: 1Gi
    resources:
        limits:
            cpu: "4"
            memory: 256Mi
        requests:
            cpu: 100m
            memory: 32Mi
