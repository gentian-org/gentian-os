# The shared kernel cache — plain values ConfigMaps
#
# Merged by the InfraData Crossplane composition (provider-helm valuesFrom).
# Source of truth: kernel/values/env/{env}.yaml and this template.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cache-env-values
  namespace: {{ .Values.namespace | default "system-cache" }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  values.yaml: |
    replicaCount: 1
    global:
{{- if .Values.storageClass }}
      storageClass: {{ .Values.storageClass }}
{{- end }}
{{- /* A private-registry pull secret only when this cluster names one. The
     images here are public, and naming a Secret nobody created made every
     pod report FailedToRetrieveImagePullSecret while pulling fine. */}}
{{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{- range . }}
        - {{ . }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cache-base-values
  namespace: {{ .Values.namespace | default "system-cache" }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  values.yaml: |
    podAnnotations:
      reloader.stakater.com/auto: "true"
    containerSecurityContext:
      privileged: false
      readOnlyRootFilesystem: true
      runAsUser: 1001
      runAsGroup: 1001
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
          - ALL
---
apiVersion: v1
kind: ConfigMap
metadata:
  {{- /* The cluster's own values, stage-less: a cluster has one stage
       (kernel.md §6.2), and the Cluster composition names this ConfigMap
       in the Release's valuesFrom without knowing it. */}}
  name: cache-cluster-values
  namespace: {{ .Values.namespace | default "system-cache" }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  values.yaml: |
    auth:
      existingSecret: cache-credentials
      existingSecretPasswordKey: password
    persistence:
      size: 1Gi
    resources:
      limits:
        cpu: "4"
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 32Mi
