apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cache-credentials
  namespace: {{ .Values.namespace | default "system-cache" }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: cache-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        # The vault's name for the cache's password: renaming it would move
        # a value every live cluster holds.
        key: gentian-os/kernel/cache/redis
        property: auth_password
---
# What the operator administers the cache with.
#
# cache_reconciler.go reads `cache-admin` from the cache namespace by those
# exact three keys -- host, port, password -- to create a per-tenant ACL user
# for every app that asks for a cache. The operator addresses the engine by
# function (layout.System) and looks for it here.
#
# The host is the chart's Service, named after its release. The release is
# named `cache` by the Cluster composition -- stage-less, because a cluster
# has one stage -- so a rename there has to be made here too, and the failure
# would be a Job that cannot resolve the name rather than anything nearer.
# The operator writes this host into every app's cache record, and the apps
# follow it there.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cache-admin
  namespace: {{ .Values.namespace | default "system-cache" }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: cache-admin
    creationPolicy: Owner
    template:
      data:
        host: "cache.{{ .Values.namespace | default "system-cache" }}.svc.cluster.local"
        port: "6379"
        password: "{{ "{{" }} .auth_password }}"
  data:
    - secretKey: auth_password
      remoteRef:
        key: gentian-os/kernel/cache/redis
        property: auth_password
