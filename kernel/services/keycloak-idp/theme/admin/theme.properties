# Gentian administration console theme.
#
# Extends keycloak.v2, which is the console Keycloak actually ships: a compiled
# React application on PatternFly rendered from one template. A theme can
# change how it looks and not how it is laid out, and overriding the template
# means reworking it on every Keycloak release — which is a surface we do not
# want to own for a screen we embed rather than write.
#
# So this is a stylesheet and nothing else. It remaps PatternFly's own custom
# properties to the design system's tokens, which is the supported seam.
parent=keycloak.v2
import=common/keycloak

styles=css/gentian-admin.css
