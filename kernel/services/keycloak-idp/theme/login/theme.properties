# Gentian login theme.
#
# Extends keycloak.v2 so every screen we do not override — consent, OTP, account
# linking, error pages — keeps working and keeps up with Keycloak releases. Only
# the two screens the portal used to render itself are overridden.
parent=keycloak.v2
import=common/keycloak

styles=css/gentian-login.css
# login-hint fills the username from the concierge's hint; brand sets
# the card's name and logo from the cluster's brand. See the files.
# pow-captcha solves the registration page's proof-of-work check; it finds
# nothing to do on every other page.
scripts=js/login-hint.js js/brand.js js/pow-captcha.js

# keycloak.v2's template.ftl renders <body class="${properties.kcBodyClass!}">,
# which is what the stylesheet centres the card against.
kcBodyClass=gentian-login

# The portal's own form had no social/identity-provider buttons, so neither
# has this. The registration link is Keycloak's to show: it renders one only
# for a realm that takes sign-ups (spec.signUp.enabled on the tenant).
kcFormSocialAccountListClass=gentian-hidden
