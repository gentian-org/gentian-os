# env is supplied by the ApplicationSet (helm.parameters). The default
# only matters for `helm template` run by hand.
env: dev
# storageClass empty = use the cluster's default StorageClass. Set per
# stage in values-<env>.yaml only where a stage genuinely differs.
storageClass: ""

# Realm SMTP. Supplied by the ApplicationSet from the Cluster claim, the same
# way Postfix receives them — see externalsecret-smtp.yaml for what is built
# from them and why the credential itself is not here.
mailServiceMode: external
relayHost: ""
relayPort: "587"
relaySsl: "false"
relayStarttls: "true"
kernelDomain: ""
# The realm the cluster's own users live in. Tenants have their own realms and
# are configured by the operator, not from here.
kernelRealm: kernel
# The database host. v4: the InfraData Postgres; v5: kernel-postgres in kernel-data.
dbHost: ""   # empty: gentian-postgresql-<env>.gentian-infra-<env> (v4); v5 sets kernel-postgres-rw.kernel-data

# The event listener that keeps OpenFGA's memberships equal to Keycloak's.
#
# Keycloak is the only place a membership changes; the director holds a
# projection of it and never edits that in place. Without this provider the
# projection is empty, so nobody holds a group, and every permission that
# follows from group membership is refused to everyone.
eventListener:
  image: ghcr.io/gentian-org/keycloak-event-listener:test-cb
  # The director's endpoint on the cluster network. Supplied by the
  # ApplicationSet, which knows where the control namespace is.
  directorURL: ""
  # The id the director lists this key under.
  keyID: gentian-listener
