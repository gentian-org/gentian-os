# env is supplied by the ApplicationSet (helm.parameters). The default
# only matters for `helm template` run by hand.
env: dev
# storageClass empty = use the cluster's default StorageClass. Set per
# stage in values-<env>.yaml only where a stage genuinely differs.
storageClass: ""

# Realm SMTP. Supplied by the ApplicationSet from the Cluster claim, the same
# way Postfix receives them — see externalsecret-smtp.yaml for what is built
# from them and why the credential itself is not here.
mailServiceMode: external
relayHost: ""
relayPort: "587"
relaySsl: "false"
relayStarttls: "true"
kernelDomain: ""
# The realm the cluster's own users live in. Tenants have their own realms and
# are configured by the operator, not from here.
kernelRealm: kernel
# The database host. v4: the InfraData Postgres; v5: kernel-postgres in kernel-data.
dbHost: ""   # empty: gentian-postgresql-<env>.gentian-infra-<env> (v4); v5 sets kernel-postgres-rw.kernel-data

# The event listener that keeps OpenFGA's memberships equal to Keycloak's.
#
# Keycloak is the only place a membership changes; the director holds a
# projection of it and never edits that in place. Without this provider the
# projection is empty, so nobody holds a group, and every permission that
# follows from group membership is refused to everyone.
eventListener:
  # Overridden by the ApplicationSet with the ref the manifests come from.
  # The default only matters for a `helm template` run by hand.
  image: ghcr.io/gentian-org/keycloak-event-listener:develop
  # The operator's membership endpoint on the cluster network. Supplied by
  # the ApplicationSet, which knows where the control namespace is. Still
  # called directorURL because that is the name the listener jar reads.
  directorURL: ""
  # The id the director lists this key under.
  keyID: gentian-listener

# The sign-in router at id.<kernel>/sign-in/, where the kernel domain's apex
# sends people on a multi-tenant cluster: an e-mail address in, its
# workspace's console out (gentian-ui apps/sign-in). Served beside Keycloak
# because the address it hands on travels in a cookie only Keycloak's realm
# pages may receive.
signIn:
  enabled: true
  # An immutable tag: the branch and commit it was built from.
  image: ghcr.io/gentian-org/sign-in-web:develop-5c98f8a
  # config.json; see apps/sign-in/README.md. The name and logo on the card
  # are the cluster's brand (the Branding), not configured here.
  config:
    # Where the page looks up an address on a custom domain: the directory
    # the operator fills from the tenants' TenantDomains (sign-in-lookup),
    # one file per domain named by its SHA-256.
    lookup: /sign-in/lookup/
