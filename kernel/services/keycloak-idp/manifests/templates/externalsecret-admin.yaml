# The admin credential the operator's identity reconcilers use, in the shape
# they read it: a url, a username and a password.
#
# The same password as keycloak-idp-credentials, which Keycloak's own pod
# reads, with the address and the username beside it.
# This is Keycloak's admin account, so it belongs beside Keycloak rather than
# in a separate bundle of kernel credentials pinned to one namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-admin
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: keycloak-admin
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # The in-cluster address, so a reconciler never depends on the edge
        # being up to configure a realm.
        url: "http://{{ .Values.keycloakRelease | default "gentian-idp-keycloak" }}-keycloakx-http.{{ .Release.Namespace }}.svc.cluster.local:8080/auth"
        username: "admin"
        password: "{{ "{{" }} .admin_password }}"
  data:
    - secretKey: admin_password
      remoteRef:
        key: gentian-os/kernel/identity/keycloak-bootstrap
        property: admin_password
