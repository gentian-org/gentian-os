# The credential of the Jobs that configure realms, clients and groups, in the
# shape keycloak-admin has: a url, a client id and a client secret.
#
# keycloak-provisioner is a master-realm service account of its own, made by
# the installer beside the operator's; the Jobs run as the Kubernetes service
# account of the same name (serviceaccount-provisioner.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-provisioner
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: keycloak-provisioner
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        url: "http://{{ .Values.keycloakRelease | default "gentian-idp-keycloak" }}-keycloakx-http.{{ .Release.Namespace }}.svc.cluster.local:8080/auth"
        client_id: keycloak-provisioner
        client_secret: "{{ "{{" }} .provisioner_client_secret }}"
  data:
    - secretKey: provisioner_client_secret
      remoteRef:
        key: gentian-os/kernel/identity/keycloak-bootstrap
        property: provisioner_client_secret
