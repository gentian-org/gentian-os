# Keycloak's two credentials, as keys the chart reads by name: the database
# password through database.existingSecret, the admin password through the
# KEYCLOAK_ADMIN_PASSWORD env in values.yaml. Plain keys, not a Helm-values
# blob -- Argo CD renders the chart from git and reads no Secret, so a
# credential reaches a pod only by secretKeyRef.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-idp-credentials
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: keycloak-idp-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: db-password
      remoteRef:
        key: gentian-os/kernel/database/postgresql
        property: keycloak_user_password
    - secretKey: admin-password
      remoteRef:
        key: gentian-os/kernel/identity/keycloak-bootstrap
        property: admin_password
    - secretKey: operator-client-secret
      remoteRef:
        key: gentian-os/kernel/identity/keycloak-bootstrap
        property: operator_client_secret
    # The other two automated callers' service accounts. Keycloak does not
    # read them; the installer creates the clients with them (D-03).
    - secretKey: provisioner-client-secret
      remoteRef:
        key: gentian-os/kernel/identity/keycloak-bootstrap
        property: provisioner_client_secret
    - secretKey: provider-client-secret
      remoteRef:
        key: gentian-os/kernel/identity/keycloak-bootstrap
        property: provider_client_secret
