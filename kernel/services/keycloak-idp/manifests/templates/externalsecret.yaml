# Standalone Keycloak admin + DB password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-idp-sensitive-values
  namespace: platform-kernel
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: keycloak-idp-sensitive-values
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # Only database.password lives in the Helm-values blob — it's a
        # nested map key, so Helm's values-merge deep-merges it safely.
        # admin-password is exposed as its own plain Secret key instead of
        # a second top-level extraEnv (see configmap.yaml's comment: two
        # extraEnv string scalars across merged values files don't merge —
        # the later one silently replaces the earlier one outright) and
        # consumed via extraEnv's valueFrom.secretKeyRef in
        # keycloak-idp-base-values. Not YAML-quoted: this key's raw value
        # is read directly via secretKeyRef, not re-parsed as YAML.
        sensitive-values.yaml: |
          database:
            password: {{ "{{" }} .keycloak_user_password | quote }}
        admin-password: "{{ "{{" }} .admin_password }}"
  data:
    - secretKey: keycloak_user_password
      remoteRef:
        key: gentian-os/kernel/database/postgresql
        property: keycloak_user_password
    - secretKey: admin_password
      remoteRef:
        key: gentian-os/kernel/identity/keycloak-bootstrap
        property: admin_password
