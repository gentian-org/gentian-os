# keycloak-smtp-credentials — what Keycloak sends mail with.
#
# Read by two things: the Job that configures the kernel realm, and the tenant
# operator, which copies these settings into each tenant realm and refuses to
# build its Job without them. A realm with no smtpServer cannot send an
# invitation, and the portal answers that with a 503 naming this Secret.
#
# It used to be written by _apply_keycloak_smtp_secret in D-05, from
# SMTP_RELAY_USERNAME and SMTP_RELAY_PASSWORD in the installer's shell. That
# made the one credential the catalogue declares `phase: runtime` reachable only
# from an install-time environment: smtp-relay is supplied AFTER the cluster is
# up, through the credential manager, which writes OpenBao and nothing else.
# Nothing carried it onward, so supplying it correctly left realm SMTP
# unconfigured and no step said so — the credential was in OpenBao and Keycloak
# never saw it.
#
# This is the same bridge Postfix already has (kernel/services/postfix/
# manifests/templates/externalsecret.yaml), against the same OpenBao path, so
# one act of supplying the relay now reaches both senders. ESO re-reads on its
# refresh interval, which is what makes a day-2 credential work without an
# installer run at all.
#
# external mode only. In kernel mode the submission password is derived rather
# than stored — there is no OpenBao path to extract it from — so those clusters
# keep the D-05 path, and rendering this here as well would put two writers on
# one Secret.
{{- if eq .Values.mailServiceMode "external" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-smtp-credentials
  namespace: platform-kernel
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: keycloak-smtp-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      # An API default, and drift when omitted — see the note in Postfix's copy.
      mergePolicy: Replace
      data:
        mail_service_mode: {{ .Values.mailServiceMode | quote }}
        smtp_host: {{ .Values.relayHost | quote }}
        smtp_port: {{ .Values.relayPort | default "587" | quote }}
        smtp_from: {{ printf "noreply@%s" .Values.kernelDomain | quote }}
        kernel_realm: {{ .Values.kernelRealm | quote }}
        # Submission over STARTTLS on 587, which is what every relay this mode
        # targets expects; implicit TLS on 465 is not offered here because the
        # claim has no field to ask for it.
        smtp_ssl: "false"
        smtp_starttls: "true"
        # The credential itself, absent until somebody supplies it.
        smtp_user: '{{ "{{" }} .relay_username | default "" }}'
        smtp_password: '{{ "{{" }} .relay_password | default "" }}'
        # The consumers' gate, and the reason this is computed rather than
        # hardcoded true: an unauthenticated relay is not a working one. Postfix
        # records what that costs — Gmail answers 530 5.7.0 Authentication
        # Required, Keycloak has already reported success, and the invitation
        # says "sent" while it bounces. false keeps the realm unconfigured and
        # the failure at the point of use, where it names this Secret.
        #
        # Backticks rather than the {{ "{{" }} form used above: escaping every
        # brace of a four-action conditional obscures which template it belongs
        # to. Everything inside is ESO's, evaluated against the extracted data.
        smtp_configure: |-
          {{ `{{ if and .relay_username .relay_password }}true{{ else }}false{{ end }}` }}
  # extract, not per-key data: the keys do not exist until the credential is
  # supplied, and naming them explicitly would make this ExternalSecret fail to
  # sync until then — taking the non-secret settings above down with it. Same
  # reasoning as Postfix's copy, which records why seeding them as empty
  # strings to avoid that is worse: the satisfaction probe then reports Ready
  # over a credential nobody has set.
  dataFrom:
    - extract:
        key: gentian-os/kernel/mail/postfix
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}
