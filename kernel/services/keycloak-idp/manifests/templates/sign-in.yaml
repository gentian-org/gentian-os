{{- if .Values.signIn.enabled }}
{{- /*
  The sign-in router: static files and nothing else. It holds no credential,
  talks to no service, and serves only GETs, so it gets no service account
  token and no write access to anything, its own filesystem included.
*/}}
{{- $cfg := dict }}
{{- range $k, $v := .Values.signIn.config }}
{{- if $v }}{{- $_ := set $cfg $k $v }}{{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sign-in-config
  namespace: {{ .Release.Namespace }}
data:
  config.json: {{ $cfg | toJson | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sign-in
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sign-in
    app.kubernetes.io/part-of: gentian-os
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sign-in
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sign-in
        app.kubernetes.io/part-of: gentian-os
      annotations:
        # A changed config.json is a new pod: the file is mounted by subPath,
        # which a running pod never sees updated.
        checksum/config: {{ $cfg | toJson | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: {{ .Values.signIn.image | quote }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /sign-in/
              port: http
          livenessProbe:
            httpGet:
              path: /sign-in/
              port: http
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /app/site/sign-in/config.json
              subPath: config.json
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: sign-in-config
---
apiVersion: v1
kind: Service
metadata:
  name: sign-in
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sign-in
    app.kubernetes.io/part-of: gentian-os
spec:
  selector:
    app.kubernetes.io/name: sign-in
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
