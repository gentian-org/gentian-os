# Standalone Keycloak (Stage 1) — plain Helm values for keycloakx chart.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-idp-base-values
  namespace: platform-kernel
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  values.yaml: |
    replicas: 1
    command:
      - "/opt/keycloak/bin/kc.sh"
    args:
      - "start"
      - "--http-enabled=true"
      - "--hostname=https://id.$(KERNEL_DOMAIN)/auth"
      - "--hostname-backchannel-dynamic=true"
      - "--hostname-strict=false"
      - "--proxy-headers=xforwarded"
      - "--cache=local"
      # Theme assets are served from /auth/resources/<hash>/, and Keycloak stamps
      # them Cache-Control: max-age=2592000 because that path is meant to be
      # content-addressed. It is not: the hash comes from the Keycloak build, so
      # a theme change leaves the URL identical while the bytes change, and every
      # cache in front — Cloudflare included — keeps serving the old file for
      # thirty days. Observed exactly that: the pod had the new stylesheet while
      # the edge returned the previous one on a cf-cache-status HIT.
      #
      # -1 stops Keycloak emitting max-age at all. The cost is refetching ~19 KB
      # on a login page; the alternative is a theme edit that silently does not
      # take effect. Server-side theme caching stays on: Reloader rolls the pod
      # when the ConfigMap changes, so templates are re-read anyway.
      - "--spi-theme-static-max-age=-1"
    proxy:
      mode: xforwarded
    service:
      type: ClusterIP
      httpPort: 8080
    ingress:
      enabled: false
    metrics:
      enabled: false
    database:
      vendor: postgres
      hostname: gentian-postgresql-{{ .Values.env }}.gentian-infra-{{ .Values.env }}.svc.cluster.local
      port: 5432
      database: keycloak
      username: keycloak_user
    # Single source of truth for extraEnv: Helm's values-merge REPLACES
    # (doesn't deep-merge) same-named string scalars, so if
    # externalsecret.yaml's sensitive-values.yaml also declared its own
    # top-level extraEnv, it would silently wipe out everything below
    # (that's exactly what broke KERNEL_DOMAIN/KC_HOSTNAME here before —
    # sensitive-values.yaml is merged last, so its extraEnv always won).
    # KEYCLOAK_ADMIN_PASSWORD is pulled in via secretKeyRef instead.
    #
    # Do NOT add KC_CACHE or KC_HEALTH_ENABLED here — the keycloakx chart
    # already emits both natively (KC_CACHE from the --cache=local arg
    # above; KC_HEALTH_ENABLED from the chart's own default health-check
    # behavior), and a duplicate `name:` in the same env list breaks the
    # strategic-merge-patch Helm computes on upgrade ("The order in patch
    # list ... doesn't match $setElementOrder list") — silently succeeds
    # on the very first install (no prior state to patch against) but
    # fails every upgrade after, so the failure mode is easy to miss.
    # Gentian login theme — sources in kernel/services/keycloak-idp/theme/,
    # rendered to a ConfigMap by scripts/gen/gen-keycloak-theme-configmap.py.
    #
    # A ConfigMap key cannot contain "/", so the theme's directory tree is encoded
    # as "__" and expanded here at startup. Mounting the ConfigMap directly does
    # not work: login/resources/css would have to mount inside the read-only
    # login volume, which has no such directory to mount onto. Per-file subPath
    # mounts would work but put a copy of the file list in these values, so every
    # new template would need editing in two places.
    #
    # The init container reuses the chart's own image so the Keycloak version is
    # not pinned a second time here; extraInitContainers is tpl'd by the chart.
    extraInitContainers: |
      - name: expand-theme
        image: "{{ "{{" }} .Values.image.repository }}:{{ "{{" }} .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ "{{" }} .Values.image.pullPolicy | default "IfNotPresent" }}
        command:
          - /bin/sh
          - -c
          - |
            set -eu
            rm -rf /theme/gentian
            for src in /theme-src/*; do
              [ -f "$src" ] || continue
              rel=$(basename "$src" | sed 's|__|/|g')
              mkdir -p "/theme/gentian/$(dirname "$rel")"
              cp "$src" "/theme/gentian/$rel"
            done
            echo "expanded $(find /theme/gentian -type f | wc -l) theme file(s)"
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
          - name: theme-src
            mountPath: /theme-src
            readOnly: true
          - name: theme
            mountPath: /theme
    extraVolumes: |
      - name: theme-src
        configMap:
          name: keycloak-idp-theme
      - name: theme
        emptyDir: {}
    extraVolumeMounts: |
      - name: theme
        mountPath: /opt/keycloak/themes
        readOnly: true
    # Keycloak caches themes, so a change has to roll the pod rather than rely on
    # the kubelet refreshing a mounted file in place.
    podAnnotations:
      secret.reloader.stakater.com/reload: keycloak-idp-sensitive-values
      configmap.reloader.stakater.com/reload: keycloak-idp-theme
    extraEnv: |
      - name: KERNEL_DOMAIN
        valueFrom:
          configMapKeyRef:
            name: gentian-kernel-services
            key: KERNEL_DOMAIN
      - name: KEYCLOAK_ADMIN
        value: admin
      - name: KEYCLOAK_ADMIN_PASSWORD
        valueFrom:
          secretKeyRef:
            name: keycloak-idp-sensitive-values
            key: admin-password
      - name: KC_METRICS_ENABLED
        value: "false"
      - name: KC_HOSTNAME
        value: "https://id.$(KERNEL_DOMAIN)/auth"
      - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
        value: "true"
      - name: KC_HOSTNAME_STRICT
        value: "false"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-idp-{{ .Values.env }}-values
  namespace: platform-kernel
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  values.yaml: |
    resources:
      requests:
        cpu: 200m
        memory: 768Mi
      limits:
        cpu: "2"
        memory: 1.5Gi
