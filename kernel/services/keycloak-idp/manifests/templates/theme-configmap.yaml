# GENERATED by scripts/gen-keycloak-theme-configmap.py — do not edit.
#
# Source of truth: kernel/services/keycloak-idp/theme/
# Regenerate with: make gen-theme     (verified by: make verify-gen)
#
# The Gentian login theme. Keys are theme-relative paths with "/" replaced by
# "__", because a ConfigMap key may not contain a slash; the init container in
# the keycloakx values expands them back into /opt/keycloak/themes/gentian.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-idp-theme
  namespace: platform-kernel
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  login__login-reset-password.ftl: |-
    <#import "template.ftl" as layout>
    <@layout.registrationLayout displayMessage=false; section>
    <#-- The portal's "Forgot password?" panel, as a Keycloak screen. Keycloak sends
         a tokenised reset link by email, which the portal's own implementation did
         not do. -->
    <#if section = "form">
      <div class="gentian-login__card">
        <div class="gentian-login__logo" role="img" aria-label="Gentian"></div>
        <h1 class="gentian-login__title">gentian</h1>
        <p class="gentian-login__subtitle">
          Enter your email and we will send you a link to reset your password.
        </p>

        <#if message?has_content>
          <p class="gentian-login__${(message.type = 'error')?then('error','info')}">
            ${kcSanitize(message.summary)?no_esc}
          </p>
        </#if>

        <form id="kc-reset-password-form" class="gentian-login__form"
              action="${url.loginAction}" method="post">
          <div>
            <label class="gentian-login__label" for="username">
              <#if !realm.loginWithEmailAllowed>${msg("username")}
              <#elseif !realm.registrationEmailAsUsername>${msg("usernameOrEmail")}
              <#else>${msg("email")}</#if>
            </label>
            <input id="username" name="username" class="gentian-login__input"
                   type="text" autofocus autocomplete="username"
                   value="${(auth.attemptedUsername!'')}"
                   placeholder="you@example.org"/>
          </div>

          <button class="gentian-login__btn" type="submit">${msg("doSubmit")}</button>
        </form>

        <a class="gentian-login__link" href="${url.loginUrl}">${msg("backToLogin")?no_esc}</a>
      </div>
    </#if>
    </@layout.registrationLayout>
  login__login.ftl: |-
    <#import "template.ftl" as layout>
    <@layout.registrationLayout displayMessage=false; section>
    <#-- Reproduces gentian-ui's LoginPage card. displayMessage=false because the
         card renders messages itself, in the portal's own error/info styling,
         rather than in Keycloak's default alert block. -->
    <#if section = "form">
      <div class="gentian-login__card">
        <div class="gentian-login__logo" role="img" aria-label="Gentian"></div>
        <h1 class="gentian-login__title">gentian</h1>
        <p class="gentian-login__subtitle">Sign in to your workspace</p>

        <#if message?has_content>
          <p class="gentian-login__${(message.type = 'error')?then('error','info')}">
            ${kcSanitize(message.summary)?no_esc}
          </p>
        </#if>

        <#if realm.password>
          <form id="kc-form-login" class="gentian-login__form"
                action="${url.loginAction}" method="post">
            <div>
              <label class="gentian-login__label" for="username">
                <#if !realm.loginWithEmailAllowed>${msg("username")}
                <#elseif !realm.registrationEmailAsUsername>${msg("usernameOrEmail")}
                <#else>${msg("email")}</#if>
              </label>
              <input id="username" name="username" class="gentian-login__input"
                     type="text" autofocus autocomplete="username"
                     value="${(login.username!'')}"
                     placeholder="you@example.org"
                     aria-invalid="<#if messagesPerField.existsError('username','password')>true</#if>"/>
            </div>

            <div>
              <label class="gentian-login__label" for="password">${msg("password")}</label>
              <input id="password" name="password" class="gentian-login__input"
                     type="password" autocomplete="current-password"
                     aria-invalid="<#if messagesPerField.existsError('username','password')>true</#if>"/>
            </div>

            <#-- Carries the auth session through; without it the POST is rejected. -->
            <input type="hidden" id="id-hidden-input" name="credentialId"
                   <#if auth.selectedCredential?has_content>value="${auth.selectedCredential}"</#if>/>

            <button class="gentian-login__btn" name="login" id="kc-login" type="submit"
                    <#if usernameHidden??>disabled</#if>>${msg("doLogIn")}</button>
          </form>

          <#if realm.resetPasswordAllowed>
            <a class="gentian-login__link" href="${url.loginResetCredentialsUrl}">
              ${msg("doForgotPassword")}
            </a>
          </#if>
        </#if>
      </div>
    </#if>
    </@layout.registrationLayout>
  login__resources__css__gentian-login.css: |-
    /* Gentian login theme.
     *
     * Reproduces gentian-ui's own login card so that moving sign-in onto Keycloak is
     * invisible to users. Ported from gentian-ui frontend/src/styles/shell.css
     * (.gentian-login__*) with the design tokens resolved to literals, because the
     * IdP does not load the portal's stylesheet.
     *
     * Two deliberate differences from the portal:
     *   - The logo is the 96px favicon inlined as a data URI. The portal's
     *     branding/logo.png is 1.4 MB, which does not belong in a ConfigMap.
     *   - "Hanken Grotesk" is declared but not shipped, so it falls back to the
     *     system sans stack. Embedding the 129 KB variable font would roughly double
     *     this file; if exact type matters more than delivery simplicity, bake the
     *     theme into a derived Keycloak image where binary assets belong.
     */

    :root {
      --gtn-paper-0: #F4F1EA;
      --gtn-paper-3: #FFFFFF;
      --gtn-border: rgba(20, 21, 46, 0.10);
      --gtn-ink-1: #14152E;
      --gtn-ink-2: #232547;
      --gtn-400: #4A4AB3;
      --gtn-500: #262696;
      --gtn-600: #1B1A82;
      --gtn-700: #131370;
      --gtn-50: #ECECF7;
      --gtn-r1: 6px;
      --gtn-r2: 10px;
      --gtn-shadow-3: 0 12px 28px -8px rgba(20, 21, 46, 0.14);
      --gtn-focus-ring: 0 0 0 3px rgba(74, 74, 179, 0.30);
      --gtn-font-sans: "Hanken Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --gtn-dur-2: 200ms;
      --gtn-ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --gtn-madder: #9B2D2D;
      --gtn-madder-bg: #F2D9D9;
    }

    html, body { height: 100%; margin: 0; }

    body.gentian-login {
      background: var(--gtn-paper-0);
      font-family: var(--gtn-font-sans);
      /* Set a readable default. Only login and login-reset-password are overridden
       * here; every other screen — "already authenticated as a different user",
       * consent, OTP, account linking, error pages — is rendered by keycloak.v2 but
       * still receives kcBodyClass=gentian-login and this stylesheet. Those screens
       * inherited PatternFly's colour, which assumes PatternFly's own dark chrome,
       * so their text came out near-white on this light paper background and was
       * effectively invisible. */
      color: var(--gtn-ink-1);
    }

    /* Readable text on the screens this theme does not template.
     *
     * Covers PatternFly 4 (pf-c-) and 5 (pf-v5-c-) because the prefix changes with
     * the Keycloak release and the parent theme is deliberately tracked rather than
     * pinned. Selectors are scoped to body.gentian-login so nothing here can leak
     * into a realm using a different theme. */
    body.gentian-login #kc-content,
    body.gentian-login #kc-content-wrapper,
    body.gentian-login #kc-info,
    body.gentian-login #kc-info-wrapper,
    body.gentian-login .instruction,
    body.gentian-login .pf-c-alert__title,
    body.gentian-login .pf-v5-c-alert__title,
    body.gentian-login .pf-c-alert__description,
    body.gentian-login .pf-v5-c-alert__description,
    body.gentian-login .kc-feedback-text,
    body.gentian-login #kc-page-title,
    body.gentian-login h1,
    body.gentian-login h2,
    body.gentian-login p,
    body.gentian-login li,
    body.gentian-login label {
      color: var(--gtn-ink-1);
    }

    /* Form controls on the screens this theme does not template.
     *
     * Ported from the portal's .gentian-login__input (gentian-ui
     * frontend/src/styles/shell.css) so an OTP prompt or a password-update screen
     * looks like the login card rather than like PatternFly. Without this they keep
     * keycloak.v2's own control styling, which is built for its dark chrome: on this
     * light paper background the fields read as heavy dark blocks.
     *
     * Both PatternFly prefixes are matched, plus bare element selectors, because the
     * templates this theme inherits are not fixed — keycloak.v2 tracks the Keycloak
     * release, and a screen may use a plain <input> or a pf-styled one.
     */
    /* :not() excludes the login card's own controls. These selectors are more
     * specific than .gentian-login__input, so without it they would take over the
     * templated screens too — invisibly today, because the values are ported from
     * that rule, but any later change to the card would stop having an effect. */
    body.gentian-login input[type="text"]:not([class*="gentian-login__"]),
    body.gentian-login input[type="email"]:not([class*="gentian-login__"]),
    body.gentian-login input[type="password"]:not([class*="gentian-login__"]),
    body.gentian-login input[type="number"]:not([class*="gentian-login__"]),
    body.gentian-login input[type="tel"]:not([class*="gentian-login__"]),
    body.gentian-login input[type="url"]:not([class*="gentian-login__"]),
    body.gentian-login select:not([class*="gentian-login__"]),
    body.gentian-login textarea:not([class*="gentian-login__"]),
    body.gentian-login .pf-c-form-control,
    body.gentian-login .pf-v5-c-form-control,
    body.gentian-login .pf-v5-c-form-control > input,
    body.gentian-login .pf-v5-c-form-control > select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--gtn-border);
      border-radius: var(--gtn-r1);
      font: inherit;
      font-size: 15px;
      color: var(--gtn-ink-1);
      background: var(--gtn-paper-3);
      box-sizing: border-box;
      /* PatternFly draws its field affordance as a bottom border and its own
       * background image; both fight the flat card look. */
      background-image: none;
      box-shadow: none;
    }

    body.gentian-login input:not([class*="gentian-login__"]):focus,
    body.gentian-login select:not([class*="gentian-login__"]):focus,
    body.gentian-login textarea:not([class*="gentian-login__"]):focus,
    body.gentian-login .pf-c-form-control:focus,
    body.gentian-login .pf-v5-c-form-control:focus-within {
      outline: none;
      box-shadow: var(--gtn-focus-ring);
      border-color: var(--gtn-400);
    }

    body.gentian-login input::placeholder,
    body.gentian-login textarea::placeholder {
      color: var(--gtn-ink-2);
      opacity: 0.55;
    }

    /* Buttons, matching .gentian-login__btn. PatternFly's primary is its own blue,
     * which is the one colour on these screens that is unmistakably not Gentian. */
    body.gentian-login .pf-c-button.pf-m-primary,
    body.gentian-login .pf-v5-c-button.pf-m-primary,
    body.gentian-login input[type="submit"]:not([class*="gentian-login__"]),
    body.gentian-login button[type="submit"]:not([class*="gentian-login__"]) {
      padding: 10px 24px;
      background: var(--gtn-500);
      color: #fff;
      border: none;
      border-radius: var(--gtn-r1);
      font-family: var(--gtn-font-sans);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    body.gentian-login .pf-c-button.pf-m-primary:hover,
    body.gentian-login .pf-v5-c-button.pf-m-primary:hover,
    body.gentian-login input[type="submit"]:not([class*="gentian-login__"]):hover,
    body.gentian-login button[type="submit"]:not([class*="gentian-login__"]):hover {
      background: var(--gtn-600);
    }

    /* Secondary / link buttons keep the brand colour rather than PatternFly blue. */
    body.gentian-login .pf-c-button.pf-m-secondary,
    body.gentian-login .pf-v5-c-button.pf-m-secondary,
    body.gentian-login .pf-c-button.pf-m-link,
    body.gentian-login .pf-v5-c-button.pf-m-link {
      color: var(--gtn-500);
      background: transparent;
      border: 1px solid var(--gtn-border);
      border-radius: var(--gtn-r1);
      font-family: var(--gtn-font-sans);
    }

    /* Links need to stay distinguishable from body text, and "sign out first"
     * screens are mostly a message plus a link. */
    body.gentian-login a {
      color: var(--gtn-500);
    }
    body.gentian-login a:hover {
      color: var(--gtn-600);
    }

    /* Keycloak's own alert blocks on non-overridden screens. Given a background so
     * the message reads as a message rather than loose text, matching the
     * .gentian-login__error / __info treatment used on the login card. */
    body.gentian-login .alert-error,
    body.gentian-login .pf-m-danger .pf-c-alert__title,
    body.gentian-login .pf-m-danger .pf-v5-c-alert__title {
      color: var(--gtn-madder);
    }
    body.gentian-login .alert-warning,
    body.gentian-login .alert-info,
    body.gentian-login .alert-success {
      color: var(--gtn-ink-2);
    }

    /* Neutralise PatternFly's own login chrome.
     *
     * keycloak.v2 renders a grid: a header band carrying the realm name, then a
     * white "main" card with its own shadow, and the Gentian card goes inside that.
     * Left alone it is two stacked white cards with two shadows, and the inner one
     * is not centred against the outer because the grid, not the card, owns the
     * width. The portal has none of this — one card on the paper background — so the
     * wrappers collapse to a single centring flex context and main loses its card
     * styling entirely.
     */
    .pf-v5-c-login {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      background: transparent;
      box-sizing: border-box;
    }

    .pf-v5-c-login__container {
      display: block;
      width: auto;
      max-width: none;
      margin: 0;
      padding: 0;
      grid-template-columns: none;
    }

    .pf-v5-c-login__main,
    .pf-v5-c-login__main-body {
      background: transparent;
      box-shadow: none;
      border: none;
      border-radius: 0;
      padding: 0;
    }

    /* The realm-name band and the (empty) page title: the card carries its own
       logo, wordmark and subtitle, exactly as the portal's does. */
    .pf-v5-c-login__header,
    .pf-v5-c-login__main-header,
    .pf-v5-c-login__main-footer { display: none; }

    .gentian-login__card {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 360px;
      max-width: 90vw;
      padding: 48px 44px 44px;
      background: var(--gtn-paper-3);
      border: 1px solid var(--gtn-border);
      border-radius: var(--gtn-r2);
      box-shadow: var(--gtn-shadow-3);
      box-sizing: border-box;
    }

    .gentian-login__logo {
      width: 64px;
      height: 64px;
      margin-bottom: 20px;
      background-image: url("data:image/png;base64,");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }

    .gentian-login__title {
      margin: 0 0 6px;
      color: var(--gtn-ink-1);
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.022em;
      line-height: 1.05;
    }

    .gentian-login__subtitle {
      margin: 0 0 28px;
      color: var(--gtn-400);
      font-size: 15px;
      font-style: italic;
      font-weight: 500;
      text-align: center;
      line-height: 1.55;
    }

    .gentian-login__form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .gentian-login__label {
      font-size: 13px;
      font-weight: 600;
      color: var(--gtn-ink-1);
      display: block;
      margin-bottom: 4px;
    }

    .gentian-login__input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--gtn-border);
      border-radius: var(--gtn-r1);
      font: inherit;
      font-size: 15px;
      color: var(--gtn-ink-1);
      background: var(--gtn-paper-3);
      box-sizing: border-box;
    }

    .gentian-login__input:focus {
      outline: none;
      box-shadow: var(--gtn-focus-ring);
      border-color: var(--gtn-400);
    }

    .gentian-login__btn {
      width: 100%;
      padding: 10px 24px;
      background: var(--gtn-500);
      color: #fff;
      border: none;
      border-radius: var(--gtn-r1);
      font-family: var(--gtn-font-sans);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background var(--gtn-dur-2) var(--gtn-ease-out);
    }

    .gentian-login__btn:hover:not(:disabled) { background: var(--gtn-600); }
    .gentian-login__btn:active:not(:disabled) { background: var(--gtn-700); }
    .gentian-login__btn:focus-visible { outline: none; box-shadow: var(--gtn-focus-ring); }
    .gentian-login__btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .gentian-login__link {
      margin-top: 14px;
      background: none;
      border: none;
      padding: 0;
      color: var(--gtn-400);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
    }
    .gentian-login__link:hover { color: var(--gtn-600); text-decoration: underline; }

    .gentian-login__error {
      margin: 12px 0 0;
      width: 100%;
      padding: 8px 12px;
      color: var(--gtn-madder);
      background: var(--gtn-madder-bg);
      border: 1px solid rgba(155, 45, 45, 0.22);
      border-radius: var(--gtn-r1);
      font-size: 13px;
      text-align: center;
      line-height: 1.45;
      box-sizing: border-box;
    }

    .gentian-login__info {
      margin: 12px 0 0;
      width: 100%;
      padding: 8px 12px;
      color: var(--gtn-ink-2);
      background: var(--gtn-50);
      border: 1px solid var(--gtn-border);
      border-radius: var(--gtn-r1);
      font-size: 13px;
      text-align: center;
      line-height: 1.45;
      box-sizing: border-box;
    }

    /* Keycloak renders identity-provider buttons and a registration link on the
       login page; the portal's form had neither. */
    .gentian-hidden, #kc-registration, #kc-registration-container,
    #kc-social-providers, #kc-info { display: none !important; }
  login__theme.properties: |-
    # Gentian login theme.
    #
    # Extends keycloak.v2 so every screen we do not override — consent, OTP, account
    # linking, error pages — keeps working and keeps up with Keycloak releases. Only
    # the two screens the portal used to render itself are overridden.
    parent=keycloak.v2
    import=common/keycloak

    styles=css/gentian-login.css

    # keycloak.v2's template.ftl renders <body class="${properties.kcBodyClass!}">,
    # which is what the stylesheet centres the card against.
    kcBodyClass=gentian-login

    # The portal's own form had no social/identity-provider buttons and no
    # registration link, so neither should this.
    kcFormSocialAccountListClass=gentian-hidden
binaryData:
  login__resources__img__favicon.ico: 
