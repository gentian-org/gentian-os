# Standalone Keycloak (Stage 1) — plain Helm values for keycloakx chart.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-idp-base-values
  namespace: platform-kernel
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  values.yaml: |
    replicas: 1
    command:
      - "/opt/keycloak/bin/kc.sh"
    args:
      - "start"
      - "--http-enabled=true"
      - "--hostname-strict=false"
      - "--proxy-headers=xforwarded"
    service:
      type: ClusterIP
      httpPort: 8080
    ingress:
      enabled: false
    metrics:
      enabled: false
    database:
      vendor: postgres
      hostname: opendesk-postgresql-dev.gentian-infra-dev.svc.cluster.local
      port: 5432
      database: keycloak
      username: keycloak_user
    extraEnv: |
      - name: KC_HEALTH_ENABLED
        value: "true"
      - name: KC_METRICS_ENABLED
        value: "false"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-idp-dev-values
  namespace: platform-kernel
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  values.yaml: |
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 1Gi
