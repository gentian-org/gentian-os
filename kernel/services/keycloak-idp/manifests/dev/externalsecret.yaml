# Standalone Keycloak admin + DB password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-idp-sensitive-values
  namespace: platform-kernel
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: keycloak-idp-sensitive-values
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        sensitive-values.yaml: |
          database:
            password: {{ .keycloak_user_password | quote }}
          extraEnv: |
            - name: KEYCLOAK_ADMIN
              value: admin
            - name: KEYCLOAK_ADMIN_PASSWORD
              value: {{ .admin_password | quote }}
  data:
    - secretKey: keycloak_user_password
      remoteRef:
        key: gentian-os/kernel/database/postgresql
        property: keycloak_user_password
    - secretKey: admin_password
      remoteRef:
        key: gentian-os/kernel/identity/keycloak-bootstrap
        property: admin_password
