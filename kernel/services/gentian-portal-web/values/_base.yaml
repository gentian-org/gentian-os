# Gentian shell (React + FastAPI) — portal values for ArgoCD.
# Chart source: gentian-ui/chart
#
# Shared across every stage — not gentian-ui's own chart default (that
# lives in the gentian-ui repo), but gentian-os's opinionated override
# values, the same across dev/staging/prod. Genuine stage deltas (if any
# emerge) belong in the cluster's own values.yaml instead.
#
# kernelDomain and api.env.BACKEND_CORS_ORIGINS are cluster-specific and
# come from clusters/<cluster>/kernel/values.yaml in gentian-deployments,
# layered on top of this file (see gentian-portal.yaml's valueFiles).
#
# api.image.tag/web.image.tag below are just the bootstrap seed — ArgoCD
# Image Updater (see gentian-portal.yaml's annotations) overwrites them
# in-cluster immediately. api.env.ENVIRONMENT is the one field that's
# arguably stage-specific (development vs production) and isn't yet split
# out — low-stakes, revisit if it ever needs to actually differ.

kernelRealm: kernel

auth:
  disabled: false

api:
  image:
    repository: ghcr.io/gentian-org/gentian-portal-api
    tag: develop
    pullPolicy: Always
  env:
    ENVIRONMENT: development
    TENANCY_MODE: multi
    # The two gentian-os APIs the console proxies to. Both serve plain HTTP on
    # the cluster network and neither sends CORS headers, which is why the
    # browser never calls them directly: the portal API forwards the caller's
    # own bearer token and adds no authority of its own.
    #
    # Unset, each tab fails closed rather than rendering an empty catalogue —
    # Credentials answers 503 "not configured for this cluster", Resources
    # reports itself unavailable. Correct as a failure mode, but every cluster
    # has both services, because the operator chart always installs them.
    #
    # It also blocks handover outright. E-04 waits for a human to prove the
    # write path opens, and the only thing that can record that proof is a
    # token exchange reaching the credential manager. With no URL here the
    # Credentials tab cannot issue one, so the installer waits out its full
    # thirty minutes for a sign-in that already happened and had nowhere to be
    # recorded.
    CREDENTIAL_MANAGER_URL: http://gentian-os-credentials.gentian-system.svc.cluster.local:9444
    APP_LIFECYCLE_URL: http://gentian-os-lifecycle.gentian-system.svc.cluster.local:8082

web:
  image:
    repository: ghcr.io/gentian-org/gentian-portal-web
    tag: develop
    pullPolicy: Always

# The operator owns the portal's routing, so the chart must not also render it.
#
# Both produced an HTTPRoute for portal.<kernel-domain> on kernel-public-gateway
# with identical rules and backends -- gentian-portal-gentian-portal from here
# and kernel-gentian-portal from GatewayPlatformReconciler. Two writers of one
# route, agreeing only because nothing had changed yet.
#
# The operator is the right owner because the kernel route is not the whole job.
# It also serves the portal on every tenant's own host (tenant-<name>-portal),
# built from the same kernelGentianPortalHTTPRouteRules, so a tenant's login
# hint survives instead of being dropped by a redirect. Those routes appear and
# disappear with their tenants, which a static chart value cannot express -- and
# they must stay identical to the kernel one, which is exactly what sharing a
# single rule builder guarantees.
#
# Not a fallback for routingMode: ingress either. This block renders an
# HTTPRoute against kernel-public-gateway, which only exists in gateway mode.
gateway:
  enabled: false
  parentGatewayName: kernel-public-gateway
  parentGatewayNamespace: platform-kernel
  host: portal

existingSecret:
  name: gentian-portal-secrets

openfga:
  apiUrl: http://gentian-openfga.platform-kernel.svc.cluster.local:8080
  storeId: ""
  authzenEnabled: true

networkPolicy:
  create: false
