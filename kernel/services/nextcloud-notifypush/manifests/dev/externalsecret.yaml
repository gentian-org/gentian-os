# =============================================================================
# nextcloud-notifypush — ESO ExternalSecret (Pattern B)
# Replaces helm_release.nextcloud_notifypush set_sensitive blocks from nextcloud.tf.
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-notifypush-sensitive-values
  namespace: gentian-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: nextcloud-notifypush-sensitive-values
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        sensitive-values.yaml: |
          configuration:
            database:
              auth:
                password:
                  value: {{ .pg_nextcloud_user_password | quote }}
            cache:
              auth:
                password:
                  value: {{ .redis_auth_password | quote }}
  data:
    - secretKey: pg_nextcloud_user_password
      remoteRef:
        key: gentian-os/kernel/apps/nextcloud
        property: db_password
    - secretKey: redis_auth_password
      remoteRef:
        key: gentian-os/kernel/cache/redis
        property: auth_password
