---
# ExternalSecret: UDM REST API Basic-auth credentials for provider-http.
#
# provider-http's {{ secret:namespace:key }} interpolation injects secret values
# into Request headers at reconcile time.  This ExternalSecret creates a secret
# in crossplane-system so the provider-http controller can read it without
# needing cross-namespace RBAC to application namespaces.
#
# The ESO template computes the base64-encoded Basic auth credential:
#   base64("Administrator:" + admin_password)
# so the Request's Authorization header can be:
#   "Basic {{ udm-admin-creds:crossplane-system:basic_auth }}"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: udm-admin-creds
  namespace: crossplane-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: udm-admin-creds
    creationPolicy: Owner
    template:
      data:
        # base64("Administrator:<admin_password>") — ready for an HTTP Basic auth header.
        basic_auth: '{{ printf "Administrator:%s" .admin_password | b64enc }}'
  data:
    - secretKey: admin_password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: admin_password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
