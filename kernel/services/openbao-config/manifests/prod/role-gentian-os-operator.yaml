---
# provider-vault AuthBackendRole MR: gentian-os-operator
#
# Binds the gentian-os ServiceAccount in gentian-system to the operator-write
# policy via the Kubernetes auth backend.  Used by the gentian-os orchestrator
# to read and write kernel secrets at reconcile time.
#
# Managed by Crossplane provider-vault (kubernetes.vault.upbound.io/v1alpha1).
# Wave 3: applied after the operator-write Policy MR (wave 2) so the policy
#         exists before the role references it.
apiVersion: kubernetes.vault.upbound.io/v1alpha1
kind: AuthBackendRole
metadata:
  name: openbao-role-gentian-os-operator
  namespace: crossplane-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  providerConfigRef:
    name: openbao
  forProvider:
    backend: kubernetes
    roleName: gentian-os-operator
    boundServiceAccountNames:
      - gentian-os
    boundServiceAccountNamespaces:
      - gentian-system
    tokenPolicies:
      - operator-write
    tokenTtl: 3600
