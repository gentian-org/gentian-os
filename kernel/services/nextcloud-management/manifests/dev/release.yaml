# =============================================================================
# nextcloud-management — provider-helm Release CR (Pattern B migration)
#
# Replaces helm_release.nextcloud_management from
# kernel/tofu/tenant/infra-workspaces/nextcloud.tf.
#
# Values merge order (last wins):
#   1. nextcloud-management-base-values  ConfigMap  — defaults
#   2. nextcloud-management-dev-values   ConfigMap  — env overrides
#   3. nextcloud-management-sensitive-values Secret — passwords from OpenBao
#
# Install order (provisioning the Nextcloud instance via init Job):
#   nextcloud-management → nextcloud (AIO) → nextcloud-notifypush
# wait=true so the AIO Release does not start before the management init
# Job has finished installing the Nextcloud schema and apps.
# =============================================================================
apiVersion: helm.crossplane.io/v1beta1
kind: Release
metadata:
  name: nextcloud-management-dev
  annotations:
    crossplane.io/external-name: nextcloud-management-dev
    argocd.argoproj.io/sync-wave: "9"
spec:
  forProvider:
    chart:
      name: opendesk-nextcloud-management
      repository: oci://registry.opencode.de/bmi/opendesk/components/platform-development/charts/opendesk-nextcloud
      version: "4.7.2"
      pullSecretRef:
        name: registry-credentials-helm
        namespace: crossplane-system
    namespace: gentian-dev
    wait: true
    waitTimeout: "15m"
    valuesFrom:
      - configMapKeyRef:
          name: nextcloud-management-base-values
          namespace: gentian-dev
          key: values.yaml
          optional: false
      - configMapKeyRef:
          name: nextcloud-management-dev-values
          namespace: gentian-dev
          key: values.yaml
          optional: false
      - secretKeyRef:
          name: nextcloud-management-sensitive-values
          namespace: gentian-dev
          key: sensitive-values.yaml
          optional: false
  providerConfigRef:
    name: kubernetes
