# =============================================================================
# nextcloud-management — ESO ExternalSecret (Pattern B)
#
# Renders all sensitive Helm value paths as a single sensitive-values.yaml
# Helm values file consumed by the Release CR via valuesFrom.secretKeyRef.
#
# Sources:
#   gentian-os/kernel/apps/nextcloud         (admin_password, oidc_client_secret, metrics_token)
#   gentian-os/kernel/database/postgresql    (nextcloud_user_password)
#   gentian-os/kernel/cache/redis            (auth_password)
#   gentian-os/kernel/storage/minio          (nextcloud_password)
#   gentian-os/kernel/identity/nubus         (ldapsearch_nextcloud, smtp_password,
#                                              portal_shared_secret)
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-management-sensitive-values
  namespace: gentian-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: nextcloud-management-sensitive-values
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        sensitive-values.yaml: |
          configuration:
            administrator:
              password:
                value: {{ .nc_admin_password | quote }}
            database:
              auth:
                password:
                  value: {{ .pg_nextcloud_user_password | quote }}
            cache:
              auth:
                password:
                  value: {{ .redis_auth_password | quote }}
            ldap:
              password:
                value: {{ .nubus_ldapsearch_nextcloud | quote }}
            objectstore:
              auth:
                secretKey:
                  value: {{ .minio_nextcloud_password | quote }}
            oidc:
              password:
                value: {{ .nc_oidc_client_secret | quote }}
            opendeskIntegration:
              centralNavigation:
                password:
                  value: {{ .nubus_portal_shared_secret | quote }}
            serverinfo:
              token:
                value: {{ .nc_metrics_token | quote }}
            smtp:
              auth:
                password:
                  value: {{ .nubus_smtp_password | quote }}
          # Workaround: chart v4.7.2 — ldapAgentPassword is expected inside the
          # FS_ENV_LDAP JSON but the ldap-config.json.gotmpl template omits it.
          # Override FS_ENV_LDAP entirely (appended after the chart-baked entry,
          # last definition wins) with a complete base64-jsonencoded LDAP config.
          extraEnvVars:
            - name: FS_ENV_IGNORE_STATE_CONSISTENCY
              value: "1"
            - name: FS_ENV_LDAP
              value: {{ printf "{\"ldapAgentPassword\":\"%s\",\"ldapAgentName\":\"uid=ldapsearch_nextcloud,cn=users,dc=swp-ldap,dc=internal\",\"ldapBase\":\"dc=swp-ldap,dc=internal\",\"ldapBaseGroups\":\"dc=swp-ldap,dc=internal\",\"ldapBaseUsers\":\"dc=swp-ldap,dc=internal\",\"ldapHost\":\"ldap://nubus-dev-ldap-server-primary.gentian-dev.svc.cluster.local\",\"ldapPort\":\"389\",\"ldapAdminGroup\":\"managed-by-attribute-FileshareAdmin\",\"ldapGroupDisplayName\":\"cn\",\"ldapGroupFilter\":\"'(&(objectClass=opendeskFileshareGroup)(opendeskFileshareEnabled=TRUE))'\",\"ldapGroupFilterObjectclass\":\"opendeskFileshareGroup\",\"ldapLoginFilter\":\"'(&(opendeskFileshareEnabled=TRUE)(entryUUID=%%uid))'\",\"ldapUserFilter\":\"'(opendeskFileshareEnabled=TRUE)'\",\"ldapUserFilterObjectclass\":\"opendeskFileshareUser\"}" .nubus_ldapsearch_nextcloud | b64enc | quote }}
  data:
    - secretKey: nc_admin_password
      remoteRef:
        key: gentian-os/kernel/apps/nextcloud
        property: admin_password
    - secretKey: nc_oidc_client_secret
      remoteRef:
        key: gentian-os/kernel/apps/nextcloud
        property: oidc_client_secret
    - secretKey: nc_metrics_token
      remoteRef:
        key: gentian-os/kernel/apps/nextcloud
        property: metrics_token
    - secretKey: pg_nextcloud_user_password
      remoteRef:
        key: gentian-os/kernel/database/postgresql
        property: nextcloud_user_password
    - secretKey: redis_auth_password
      remoteRef:
        key: gentian-os/kernel/cache/redis
        property: auth_password
    - secretKey: minio_nextcloud_password
      remoteRef:
        key: gentian-os/kernel/storage/minio
        property: nextcloud_password
    - secretKey: nubus_ldapsearch_nextcloud
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: ldapsearch_nextcloud
    - secretKey: nubus_smtp_password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: smtp_password
    - secretKey: nubus_portal_shared_secret
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: portal_shared_secret
---
# =============================================================================
# Operator provisioner Secret (platform-kernel/nextcloud-admin)
# The gentian-os operator creates per-tenant Nextcloud groups via the OCS API;
# its Jobs read these connection details.
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-admin
  namespace: platform-kernel
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: nextcloud-admin
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        url: "http://nextcloud-dev-aio.gentian-dev.svc.cluster.local"
        username: "nextcloud"
        password: "{{ .admin_password }}"
        dbhost: "opendesk-postgresql-dev.gentian-infra-dev.svc.cluster.local"
        dbname: "nextcloud"
        dbuser: "nextcloud_user"
        dbpassword: "{{ .pg_nextcloud_user_password }}"
  data:
    - secretKey: admin_password
      remoteRef:
        key: gentian-os/kernel/apps/nextcloud
        property: admin_password
    - secretKey: pg_nextcloud_user_password
      remoteRef:
        key: gentian-os/kernel/database/postgresql
        property: nextcloud_user_password
