apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nubus-credentials
  namespace: gentian-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: nubus-credentials
    creationPolicy: Owner
  data:
    - secretKey: masterPassword
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: master_password
    - secretKey: admin-password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: admin_password
    - secretKey: ldap-admin-password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: ldap_admin_password
    - secretKey: keycloak-admin-password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: keycloak_admin_password
    - secretKey: ox-system-user-password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: ox_system_user_password
    - secretKey: smtp-password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: smtp_password
    - secretKey: nats-api-password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: nats_api_password
    - secretKey: nats-dispatcher-password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: nats_dispatcher_password
    - secretKey: nats-prefill-password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: nats_prefill_password
    - secretKey: nats-udm-listener-password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: nats_udm_listener_password
    - secretKey: nats-udm-transformer-password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: nats_udm_transformer_password
    - secretKey: minio-ums-secret-access-key
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: minio_ums_secret_access_key
    - secretKey: pg-selfservice-password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: pg_selfservice_password
    - secretKey: pg-authsession-password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: pg_authsession_password
    - secretKey: pg-keycloak-password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: pg_keycloak_password
    - secretKey: pg-keycloak-extensions-password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: pg_keycloak_extensions_password
    - secretKey: pg-guardian-password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: pg_guardian_password
    - secretKey: pg-notifications-password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: pg_notifications_password
    - secretKey: ldapsearch-keycloak
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: ldapsearch_keycloak
    - secretKey: ldapsearch-nextcloud
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: ldapsearch_nextcloud
    - secretKey: ldapsearch-dovecot
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: ldapsearch_dovecot
    - secretKey: ldapsearch-element
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: ldapsearch_element
    - secretKey: ldapsearch-ox
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: ldapsearch_ox
    - secretKey: ldapsearch-postfix
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: ldapsearch_postfix
    - secretKey: ldapsearch-openproject
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: ldapsearch_openproject
    - secretKey: ldapsearch-xwiki
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: ldapsearch_xwiki
    - secretKey: portal-shared-secret
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: portal_shared_secret
