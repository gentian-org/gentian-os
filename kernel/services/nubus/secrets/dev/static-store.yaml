# SecretStore: nubus-static
#
# Provides static, non-sensitive configuration values via ESO's fake provider.
# Used for values that are not secret but must be delivered via a K8s Secret
# (e.g., MinIO access key IDs that charts bundle with their secret access key).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
    name: nubus-static
    namespace: gentian-dev
spec:
    provider:
        fake:
            data:
                - key: portal/object-storage/access_key_id
                  value: "ums_user"
