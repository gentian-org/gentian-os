# ExternalSecret: ums-keycloak-bootstrap-ldap-credentials
#
# Replaces the SOPS-encrypted extraSecrets entry in values/dev/values.yaml.
# Referenced by:
#   nubusKeycloakBootstrap.ldap.auth.existingSecret.name: ums-keycloak-bootstrap-ldap-credentials
# The chart expects key "password" in this secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
    name: keycloak-bootstrap-ldap-credentials
    namespace: gentian-dev
spec:
    refreshInterval: 1h
    secretStoreRef:
        name: openbao
        kind: ClusterSecretStore
    target:
        name: ums-keycloak-bootstrap-ldap-credentials
        creationPolicy: Owner
    data:
        - secretKey: password
          remoteRef:
              key: gentian-os/kernel/identity/nubus
              property: ldapsearch_keycloak
