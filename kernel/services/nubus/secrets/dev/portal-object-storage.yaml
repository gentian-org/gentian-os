# ExternalSecret: portal-object-storage-credentials
#
# Combines static MinIO username (non-sensitive, from nubus-static fake store)
# with the secret access key from OpenBao. Shared by both portal-server and
# portal-consumer which use identical credentials.
#
# Referenced by nubus values:
#   nubusPortalServer.objectStorage.auth.existingSecret.name
#   nubusPortalConsumer.objectStorage.auth.existingSecret.name
#
# Chart templates expect keys: access_key_id, secret_access_key
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: portal-object-storage-credentials
  namespace: gentian-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: portal-object-storage-credentials
    creationPolicy: Owner
  data:
    - secretKey: access_key_id
      sourceRef:
        storeRef:
          name: nubus-static
          kind: SecretStore
      remoteRef:
        key: portal/object-storage/access_key_id
    - secretKey: secret_access_key
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: minio_ums_secret_access_key
