# =============================================================================
# Nubus dev — non-secret overrides
# =============================================================================
# All secret fields (masterPassword, smtp passwords, keycloak.auth.password,
# NATS passwords, templateContext passwords, ldap admin password) are injected
# via set_sensitive in tofu/tenant/infra-workspaces/nubus.tf.
# =============================================================================

nubusUmcServer:
  smtp:
    connection:
      host: postfix-dev.gentian-dev.svc.cluster.local
      port: 25
      ssl: false
      starttls: false
    auth:
      enabled: true
  postgresql:
    selfservice:
      connection:
        host: opendesk-postgresql-dev.gentian-infra-dev.svc.cluster.local
        port: "5432"
      auth:
        existingSecret:
          name: nubus-credentials
          keyMapping:
            password: pg-selfservice-password
    authSession:
      connection:
        host: opendesk-postgresql-dev.gentian-infra-dev.svc.cluster.local
        port: "5432"
      auth:
        existingSecret:
          name: nubus-credentials
          keyMapping:
            password: pg-authsession-password

keycloak:
  postgresql:
    connection:
      host: opendesk-postgresql-dev.gentian-infra-dev.svc.cluster.local
      port: "5432"
    auth:
      existingSecret:
        name: nubus-credentials
        keyMapping:
          password: pg-keycloak-password
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  # Wait for the LDAP server to be reachable before Keycloak starts.
  # Without this, Keycloak's LDAP user import (triggered during startup) can fail
  # with "Connection refused" when LDAP wins the pod-startup race, causing
  # the UniventionUserAccountControlStorageMapper to mark cached users as disabled.
  extraInitContainers:
    - name: wait-for-ldap
      image: artifacts.software-univention.de/nubus/images/keycloak:0.5.0
      imagePullPolicy: IfNotPresent
      command:
        - /bin/bash
        - -ec
        - |
          echo "Waiting for LDAP server nubus-dev-ldap-server:389 to be ready..."
          until bash -c "echo > /dev/tcp/nubus-dev-ldap-server/389" 2>/dev/null; do
            echo "LDAP not yet available, retrying in 5 s..."
            sleep 5
          done
          echo "LDAP server is ready."
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
            - ALL

nubusGuardian:
  postgresql:
    connection:
      host: opendesk-postgresql-dev.gentian-infra-dev.svc.cluster.local
      port: "5432"
    auth:
      existingSecret:
        name: nubus-credentials
        keyMapping:
          password: pg-guardian-password

nubusNotificationsApi:
  postgresql:
    connection:
      host: opendesk-postgresql-dev.gentian-infra-dev.svc.cluster.local
      port: "5432"
    auth:
      existingSecret:
        name: nubus-credentials
        keyMapping:
          password: pg-notifications-password
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

nubusKeycloakExtensions:
  postgresql:
    connection:
      host: opendesk-postgresql-dev.gentian-infra-dev.svc.cluster.local
      port: "5432"
    auth:
      existingSecret:
        name: nubus-credentials
        keyMapping:
          password: pg-keycloak-extensions-password
  smtp:
    auth:
      enabled: true

nubusStackDataUms:
  postgresql:
    connection:
      host: opendesk-postgresql-dev.gentian-infra-dev.svc.cluster.local
      port: "5432"
    auth:
      existingSecret:
        name: nubus-credentials
        keyMapping:
          password: pg-keycloak-password
  nubusUmcServer:
    postgresql:
      connection:
        host: opendesk-postgresql-dev.gentian-infra-dev.svc.cluster.local
  nubusPortalConsumer:
    objectStorage:
      endpoint: http://minio-dev.gentian-infra-dev.svc.cluster.local:9000
  nubusPortalServer:
    objectStorage:
      endpoint: http://minio-dev.gentian-infra-dev.svc.cluster.local:9000
  stackDataContext:
    smtpHost: postfix-dev.gentian-dev.svc.cluster.local
    smtpPort: 25
  templateContext:
    # Passwords for ldapSearchUsers and initialPasswordAdministrator / oxSystemUserPassword
    # are injected via set_sensitive. Usernames and lastnames go here.
    ldapSearchUsers:
      - username: ldapsearch_keycloak
        lastname: LDAP-Search-User
      - username: ldapsearch_nextcloud
        lastname: LDAP-Search-User
      - username: ldapsearch_dovecot
        lastname: LDAP-Search-User
      - username: ldapsearch_element
        lastname: LDAP-Search-User
      - username: ldapsearch_ox
        lastname: LDAP-Search-User
      - username: ldapsearch_postfix
        lastname: LDAP-Search-User
      - username: ldapsearch_openproject
        lastname: LDAP-Search-User
      - username: ldapsearch_xwiki
        lastname: LDAP-Search-User

nubusUdmListener:
  nats:
    auth:
      enabled: true

nubusProvisioning:
  api:
    nats:
      auth:
        enabled: true
  dispatcher:
    nats:
      auth:
        enabled: true
  udmTransformer:
    nats:
      auth:
        enabled: true
  prefill:
    nats:
      auth:
        enabled: true

nubusPortalServer:
  objectStorage:
    endpoint: http://minio-dev.gentian-infra-dev.svc.cluster.local:9000

nubusPortalConsumer:
  objectStorage:
    endpoint: http://minio-dev.gentian-infra-dev.svc.cluster.local:9000

nubusLdapServer:
  ldapServer:
    auth:
      # password injected via set_sensitive
      enabled: true
  persistence:
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
