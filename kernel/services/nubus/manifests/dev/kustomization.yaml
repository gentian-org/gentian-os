apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - service-aliases.yaml
  - release.yaml
  - setup-iam-templates-job.yaml
  - stack-data-ums-cleanup-postsync-job.yaml
  - umc-gateway-upstream-postsync-job.yaml

configMapGenerator:
  - name: nubus-base-values
    namespace: gentian-dev
    files:
      - values.yaml=values/_base.yaml
  - name: nubus-dev-values
    namespace: gentian-dev
    files:
      - values.yaml=values/dev.yaml
  - name: nubus-dev-udm-listener-nats-patch
    namespace: gentian-dev
    files:
      - mq_adapter_nats.py=patches/mq_adapter_nats.py
  - name: nubus-dev-ldap-gentian-acl
    namespace: gentian-dev
    files:
      - 92-gentian-tenant-acl.sh=patches/92-gentian-tenant-acl.sh
  - name: nubus-dev-umc-template-default
    namespace: gentian-dev
    files:
      - 93-gentian-umc-template-default.sh=patches/93-gentian-umc-template-default.sh
      - 94-gentian-umc-template-picker.sh=patches/94-gentian-umc-template-picker.sh
  - name: nubus-dev-umc-gateway-upstream
    namespace: gentian-dev
    files:
      - 95-gentian-umc-gateway-upstream.sh=patches/95-gentian-umc-gateway-upstream.sh
  - name: nubus-dev-umc-gateway-upstream-patcher
    namespace: gentian-dev
    files:
      - patch-umc-gateway-upstream.sh=patches/patch-umc-gateway-upstream.sh

generatorOptions:
  disableNameSuffixHash: true
