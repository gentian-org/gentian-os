# ROUTING_MODE=gateway overlay — disable nginx Ingress sub-charts.
# Edge routing for kernel hosts is via kernel-public-gateway HTTPRoutes (operator).

nubusKeycloakExtensions:
  proxy:
    ingress:
      enabled: false

nubusPortalServer:
  ingress:
    enabled: false

nubusUmcGateway:
  ingress:
    enabled: false

nubusUmcServer:
  ingress:
    enabled: false

nubusUdmRestApi:
  ingress:
    enabled: false

nubusTwofaHelpdesk:
  ingress:
    enabled: false
