# PostSync hook: the upstream nubusStackDataUms chart leaves failed retry pods
# (Error) visible after the data-loader Job eventually succeeds.  Patch TTL on the
# Job and delete failed pods so install verification stays clean.
apiVersion: batch/v1
kind: Job
metadata:
  name: nubus-dev-stack-data-ums-cleanup
  namespace: gentian-dev
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "6"
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: stack-data-ums-cleanup
      containers:
        - name: cleanup
          image: bitnami/kubectl:1.32.3
          command:
            - sh
            - -c
            - |
              set -euo pipefail
              NS=gentian-dev
              PREFIX=nubus-dev-stack-data-ums-
              TTL=600
              JOB=$(kubectl get jobs -n "$NS" --no-headers \
                -o custom-columns=NAME:.metadata.name 2>/dev/null \
                | grep "^${PREFIX}" | tail -1 || true)
              if [[ -z "$JOB" ]]; then
                echo "No stack-data-ums job found; nothing to clean up."
                exit 0
              fi
              if ! kubectl wait "job/$JOB" -n "$NS" \
                  --for=condition=Complete --timeout=600s 2>/dev/null; then
                echo "stack-data-ums job not complete yet; skipping cleanup."
                exit 0
              fi
              kubectl patch job "$JOB" -n "$NS" --type=merge \
                -p "{\"spec\":{\"ttlSecondsAfterFinished\":${TTL}}}"
              kubectl delete pods -n "$NS" -l "job-name=$JOB" \
                --field-selector=status.phase=Failed \
                --ignore-not-found=true
              echo "stack-data-ums cleanup complete for job $JOB"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stack-data-ums-cleanup
  namespace: gentian-dev
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "5"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: stack-data-ums-cleanup
  namespace: gentian-dev
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "5"
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stack-data-ums-cleanup
  namespace: gentian-dev
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "5"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: stack-data-ums-cleanup
subjects:
  - kind: ServiceAccount
    name: stack-data-ums-cleanup
    namespace: gentian-dev
