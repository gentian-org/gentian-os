# Periodic reconciler: Crossplane/Helm upgrades reset the umc-gateway prepare-config
# init command, so Apache proxies /univention/oidc to 0.0.0.0:8090 (503). The
# PostSync hook races with late Helm rollouts; this CronJob re-applies the patch
# until the deployment and live Apache config match the desired upstream.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: umc-gateway-upstream-patcher
  namespace: gentian-dev
  labels:
    app.kubernetes.io/managed-by: gentian-os
    gentianos.io/component: umc-gateway-upstream
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: umc-gateway-upstream-patcher
  namespace: gentian-dev
  labels:
    app.kubernetes.io/managed-by: gentian-os
    gentianos.io/component: umc-gateway-upstream
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["nubus-dev-umc-gateway"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: umc-gateway-upstream-patcher
  namespace: gentian-dev
  labels:
    app.kubernetes.io/managed-by: gentian-os
    gentianos.io/component: umc-gateway-upstream
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: umc-gateway-upstream-patcher
subjects:
  - kind: ServiceAccount
    name: umc-gateway-upstream-patcher
    namespace: gentian-dev
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: umc-gateway-upstream-reconciler
  namespace: gentian-dev
  labels:
    app.kubernetes.io/managed-by: gentian-os
    gentianos.io/component: umc-gateway-upstream
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/managed-by: gentian-os
            gentianos.io/component: umc-gateway-upstream
        spec:
          serviceAccountName: umc-gateway-upstream-patcher
          restartPolicy: OnFailure
          containers:
            - name: reconcile
              image: alpine/k8s:1.32.3
              command:
                - /bin/bash
                - /scripts/patch-umc-gateway-upstream.sh
              env:
                - name: GENTIAN_UMC_GATEWAY_RECONCILE
                  value: "1"
              resources:
                limits:
                  cpu: 200m
                  memory: 256Mi
                requests:
                  cpu: 50m
                  memory: 128Mi
              volumeMounts:
                - name: patch-script
                  mountPath: /scripts
          volumes:
            - name: patch-script
              configMap:
                name: nubus-dev-umc-gateway-upstream-patcher
                defaultMode: 0755
