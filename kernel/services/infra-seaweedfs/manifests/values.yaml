# env is supplied by the ApplicationSet (helm.parameters). The default
# only matters for `helm template` run by hand.
env: dev
# storageClass empty = use the cluster's default StorageClass. Set per
# stage in values-<env>.yaml only where a stage genuinely differs.
storageClass: ""

# Where these objects go.
#
# Empty means system-s3, the layout's name for it (kernel/namespaces.yaml).
# The ApplicationSet passes the system-tier namespace the
# Cluster claim composed -- one namespace per engine, so a quota, a backup
# policy and a network policy can differ per engine without separating a
# stateful service after the fact (kernel.md §6.2).
namespace: ""
# Pull secrets for a private registry, by name; none for the public image.
imagePullSecrets: []

# Who may open a connection to the server's pod (templates/networkpolicy.yaml).
# On by default; needs a CNI that enforces NetworkPolicy, and has no effect on
# one that does not. Off removes the policy and leaves the key pairs as the
# only check on the S3 port, and nothing at all on the master's and the
# filer's. The data-plane ApplicationSet passes `enabled` and the namespaces
# from the layout; the values here are what a `helm template` run by hand
# gets.
networkPolicy:
  enabled: true
  ports:
    # The port apps are handed (provisioner.ObjectStoragePort): the S3
    # gateway listens on it, and the Service s3 serves it.
    api: 9000
    # The master's and the filer's gRPC ports, the only ones `weed shell`
    # uses: what the platform's bucket, destroy and restore Jobs administer
    # the store through.
    masterGrpc: 19333
    filerGrpc: 18888
  namespaces:
    control: kernel-control
    # Where the units of an export and a restore run that are not beside the
    # object store: beside each database, and in the identity namespace.
    postgresql: system-postgresql
    mariadb: system-mariadb
    authentication: kernel-authentication
    # The unit that copies a tenant's mailboxes runs beside the mail server's
    # volume, and the unit of a desktop database that is on the kernel's
    # PostgreSQL beside that server.
    mail: system-mail
    data: kernel-data
