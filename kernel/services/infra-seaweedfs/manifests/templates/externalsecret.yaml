{{- /*
  The object store's administrator, from the vault.

  One credential at gentian-os/kernel/storage/s3 (seeded by the installer,
  scripts/bootstrap/seed-openbao.sh and scripts/lib/bootstrap.sh), rendered
  twice, both in this namespace and nowhere else:

    seaweedfs-s3-config  what the server reads its administrator from: the
                         S3 identity file the chart mounts
                         (allInOne.s3.existingConfigSecret). It names no
                         other identity; one per app bucket is made by the
                         platform's bucket Jobs and kept by the filer.
    s3-admin             what the operator and its Jobs reach the store with:
                         the endpoint, the access key and the secret key.
                         Copied for a run, by the operator, to the namespaces
                         a capture or a restore runs in
                         (tenantexport_placement.go); and the master's
                         address, for the Jobs that make and destroy buckets
                         and identities with weed shell.

  The identity's name is not a bucket's: a bucket name cannot hold an
  underscore, and every app's identity is named after its bucket.
*/ -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seaweedfs-s3-config
  namespace: {{ .Values.namespace | default "system-s3" }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: seaweedfs-s3-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        seaweedfs_s3_config: >-
          {"identities":[{"name":"storage_admin","credentials":[{"accessKey":{{ "{{" }} .root_user | toJson }},"secretKey":{{ "{{" }} .root_password | toJson }}}],"actions":["Admin","Read","Write","List","Tagging"]}]}
  data:
    - secretKey: root_user
      remoteRef:
        key: gentian-os/kernel/storage/s3
        property: root_user
    - secretKey: root_password
      remoteRef:
        key: gentian-os/kernel/storage/s3
        property: root_password
{{- if .Values.namespace }}
---
# The endpoint is the Service s3 beside this file; the master's address is
# the chart's all-in-one Service, the release being named `seaweedfs` by the
# Cluster composition.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: s3-admin
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: s3-admin
    creationPolicy: Owner
    template:
      data:
        endpoint: "http://s3.{{ .Values.namespace }}.svc.cluster.local:{{ .Values.networkPolicy.ports.api }}"
        master: "seaweedfs-all-in-one.{{ .Values.namespace }}.svc.cluster.local:9333"
        accessKey: "{{ "{{" }} .root_user }}"
        secretKey: "{{ "{{" }} .root_password }}"
  data:
    - secretKey: root_user
      remoteRef:
        key: gentian-os/kernel/storage/s3
        property: root_user
    - secretKey: root_password
      remoteRef:
        key: gentian-os/kernel/storage/s3
        property: root_password
{{- end }}
---
{{- /*
  The keys the store signs its tokens with, from the vault
  (gentian-os/kernel/storage/s3/jwt, seeded once by the installer at random,
  scripts/lib/bootstrap.sh seed_object_store_signing_keys), into this
  namespace and nowhere else. The server reads them from its environment
  (WEED_JWT_*, secretKeyRef, the base values): never from a ConfigMap, which
  is where the chart would put keys of its own.

    signing_key             the master signs, and the volume server requires,
                            a token for every write to a volume
    signing_read_key        the same, for every read from a volume
    filer_signing_key       the filer requires a token for every write over
                            its HTTP port and on its identity API; the Jobs
                            that make identities with weed shell mint one
                            from it (backup.ObjectStoreSigningSecret)
    filer_signing_read_key  the same, for every read over the filer's HTTP port
*/ -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seaweedfs-jwt
  namespace: {{ .Values.namespace | default "system-s3" }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: seaweedfs-jwt
    creationPolicy: Owner
  data:
    {{- range $key := list "signing_key" "signing_read_key" "filer_signing_key" "filer_signing_read_key" }}
    - secretKey: {{ $key }}
      remoteRef:
        key: gentian-os/kernel/storage/s3/jwt
        property: {{ $key }}
    {{- end }}
