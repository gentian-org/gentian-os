apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-bootstrap-credentials
  namespace: gentian-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: keycloak-bootstrap-credentials
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef:
        key: gentian-os/kernel/identity/keycloak-bootstrap
        property: admin_password
    - secretKey: intercom-client-secret
      remoteRef:
        key: gentian-os/kernel/identity/keycloak-bootstrap
        property: intercom_client_secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-bootstrap-admin-yaml
  namespace: gentian-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: keycloak-bootstrap-admin-yaml
    creationPolicy: Owner
    # The keycloak-bootstrap chart reads admin credentials from a YAML file
    # mounted at admin.yaml inside the Secret. Format required by chart:
    #   admin.yaml: |
    #     username: <user>
    #     password: <password>
    template:
      type: Opaque
      data:
        admin.yaml: |
          username: kcadmin
          password: {{ .admin_password }}
  data:
    - secretKey: admin_password
      remoteRef:
        key: gentian-os/kernel/identity/keycloak-bootstrap
        property: admin_password
