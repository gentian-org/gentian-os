# =============================================================================
# Keycloak Bootstrap app-level defaults (all environments)
# =============================================================================
# Layer 2. {env}/values.yaml provides:
#   config.keycloak.admin.values.password (SOPS-encrypted),
#   config.keycloak.intraCluster.internalBaseUrl (env-specific DNS),
#   config.opendesk.clients (full list — contains client secrets),
#   resources
# NOTE: config.opendesk.clients is a list — Helm replaces lists entirely,
# so each env must repeat the complete client definition alongside the secret.
# =============================================================================

# Global settings (domain & hosts shared across envs — override in prod if needed)
global:
  domain: desk.gentian.org
  hosts:
    keycloak: id
    intercomService: ics
    synapse: matrix
    matrixNeoDateFixBot: matrix-neodatefix-bot
    openxchange: webmail
    xwiki: wiki
    nextcloud: files
    nubus: portal
    element: chat
    jitsi: meet
    openproject: projects
    notes: notes
  # imagePullSecrets from values/env/{env}.yaml via global.imagePullSecrets

# Container image (registry not covered by global.imageRegistry for this chart — kept explicit)
image:
  registry: registry.opencode.de
  repository: bmi/opendesk/components/platform-development/images/opendesk-keycloak-bootstrap
  tag: 1.3.0@sha256:f0c18be261666b7dbb1794f61aaac2321608d396060b007d18b429d0e4d703a7
  imagePullPolicy: IfNotPresent

# Cleanup settings for the bootstrap Job
cleanup:
  deletePodsOnSuccess: true
  deletePodsOnSuccessTimeout: 60
  keepPVCOnDelete: false

# Bootstrap configuration
config:
  # No client access restrictions (only intercom deployed)
  clientAccessRestrictions: {}
  # No custom scopes/clients beyond the ones below
  custom:
    clientScopes: null
    clients: null
  # Resources that keycloak-bootstrap should NOT delete
  managed:
    clientScopes:
      - acr
      - web-origins
      - email
      - profile
      - microprofile-jwt
      - role_list
      - offline_access
      - roles
      - address
      - phone
    clients:
      - guardian-management-api
      - guardian-scripts
      - guardian-ui
      - UMC OIDC
      - ${client_account}
      - ${client_account-console}
      - ${client_admin-cli}
      - ${client_broker}
      - ${client_realm-management}
      - ${client_security-admin-console}
  # Keycloak admin — password delivered via existingSecret (ESO → OpenBao)
  # Secret format: admin.yaml key containing "username: kcadmin\npassword: <pw>"
  keycloak:
    admin:
      secret:
        name: keycloak-bootstrap-admin-yaml
    realm: opendesk
    intraCluster:
      enabled: true
      # internalBaseUrl: in {env}/values.yaml (env-specific DNS)
  # Realm-level session/token settings (identical in all envs)
  # functional.yaml: authentication.realmSettings
  realmSettings:
    accessTokenLifespan: 300
    revokeRefreshToken: false
    ssoSessionIdleTimeout: 14400
    ssoSessionMaxLifespan: 57600
    accessCodeLifespanUserAction: 300
    accessCodeLifespanLogin: 1800
    offlineSessionIdleTimeout: 2592000
    offlineSessionMaxLifespanEnabled: false
    offlineSessionMaxLifespan: 5184000
    clientSessionIdleTimeout: 0
    clientSessionMaxLifespan: 0
    clientOfflineSessionIdleTimeout: 0
    clientOfflineSessionMaxLifespan: 0
  # SSO Federation (disabled)
  # functional.yaml: authentication.ssoFederation
  ssoFederation:
    enabled: false
    enforceFederatedLogin: false
    name: My upstream IdP
    idpDetails: {}
  # Two-factor settings
  # functional.yaml: authentication.twoFactor.groups
  twoFactorSettings:
    additionalGroups:
      - Domain Admins
  # Groups to pre-create in Keycloak
  precreateGroups:
    - Domain Admins
    - Domain Users
    - IAM API - Full Access
  # openDesk OIDC — clientScopes empty (only intercom deployed)
  opendesk:
    clientScopes: []
    # clients: in {env}/values.yaml — full list required (Helm list replace)

# Container Security Context
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  enabled: true
  privileged: false
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
  readOnlyRootFilesystem: true
  runAsNonRoot: true

# ArgoCD sync hook — run on every sync and clean up before re-running
additionalAnnotations:
  argocd.argoproj.io/hook: Sync
  argocd.argoproj.io/hook-delete-policy: BeforeHookCreation

# Pod annotations
podAnnotations: {}

# Pod Security Context
podSecurityContext:
  enabled: true
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
