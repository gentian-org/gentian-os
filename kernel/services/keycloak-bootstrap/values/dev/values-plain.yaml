# =============================================================================
# Keycloak-bootstrap dev — non-secret overrides
# =============================================================================
# config.keycloak.opendesk.clients[0].secret is injected via set_sensitive
# in tofu/tenant/infra-workspaces/keycloak-bootstrap.tf.
# =============================================================================

config:
  keycloak:
    intraCluster:
      internalBaseUrl: http://nubus-dev-keycloak.gentian-dev.svc.cluster.local:8080
    opendesk:
      clients:
        - name: opendesk-intercom
          clientId: opendesk-intercom
          protocol: openid-connect
          clientAuthenticatorType: client-secret
          # secret injected via set_sensitive in Tofu
          redirectUris:
            - https://ics.desk.gentian.org/callback
          consentRequired: false
          frontchannelLogout: false
          publicClient: false
          authorizationServicesEnabled: false
          attributes:
            use.refresh.tokens: true
            backchannel.logout.session.required: true
            standard.token.exchange.enabled: true
            standard.token.exchange.enableRefreshRequestedTokenType: SAME_SESSION
            backchannel.logout.revoke.offline.tokens: true
            backchannel.logout.url: https://ics.desk.gentian.org/backchannel-logout
          protocolMappers:
            - name: intercom-audience
              protocol: openid-connect
              protocolMapper: oidc-audience-mapper
              consentRequired: false
              config:
                included.client.audience: opendesk-intercom
                id.token.claim: false
                access.token.claim: true
            - name: opendesk_username
              protocol: openid-connect
              protocolMapper: oidc-usermodel-attribute-mapper
              consentRequired: false
              config:
                userinfo.token.claim: true
                user.attribute: uid
                id.token.claim: true
                access.token.claim: true
                claim.name: opendesk_username
                jsonType.label: String
            - name: opendesk_useruuid
              protocol: openid-connect
              protocolMapper: oidc-usermodel-attribute-mapper
              consentRequired: false
              config:
                userinfo.token.claim: true
                user.attribute: entryUUID
                id.token.claim: true
                access.token.claim: true
                claim.name: opendesk_useruuid
                jsonType.label: String
          defaultClientScopes:
            - offline_access

resources:
  limits:
    cpu: 1
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi
