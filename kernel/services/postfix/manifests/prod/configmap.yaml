# UNTESTED — public bokysan/mail chart placeholder (Pattern B).
# Namespace gentian-prod → Service postfix-prod.gentian-prod.svc.cluster.local:587
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postfix-base-values
  namespace: gentian-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  values.yaml: |
    # Helm chart: bokysan/mail — https://bokysan.github.io/docker-postfix/
    # Required by the Kyverno baseline (gentian-disallow-privilege-escalation,
    # gentian-require-seccomp). gentian-<env> is not in those policies' exclusion
    # list — unlike platform-kernel and the other infra namespaces — so without
    # this the StatefulSet cannot create its Pod at all.
    #
    # runAsNonRoot and a capability drop are deliberately omitted: Postfix binds
    # 25/587. Kyverno's non-root and capabilities rules are "=(securityContext)"
    # conditionals that only engage on keys that are present, so leaving them out
    # keeps this compliant without needing a MAC waiver.
    container:
      postfix:
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
    fullnameOverride: postfix-prod
    image:
      repository: boky/postfix
      pullPolicy: IfNotPresent
    persistence:
      enabled: false
    service:
      type: ClusterIP
      port: 587
    config:
      general:
        TZ: "UTC"
        # Placeholder — patched from KERNEL_DOMAIN by scripts/mail-lib.sh on install/update.
        ALLOWED_SENDER_DOMAINS: "example.domain"
      postfix:
        myhostname: postfix-prod
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postfix-prod-values
  namespace: gentian-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  values.yaml: |
    # Env overrides — patched by scripts/mail-lib.sh when MAIL_SERVICE_MODE=kernel.
    # Schema is bokysan/mail (not the old proprietary chart).
    replicaCount: 1
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 64Mi
