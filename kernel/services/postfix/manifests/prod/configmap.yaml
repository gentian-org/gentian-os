# UNTESTED — public bokysan/mail chart placeholder (Pattern B).
# Namespace gentian-prod → Service postfix-prod.gentian-prod.svc.cluster.local:587
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postfix-base-values
  namespace: gentian-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  values.yaml: |
    # Helm chart: bokysan/mail — https://bokysan.github.io/docker-postfix/
    fullnameOverride: postfix-prod
    image:
      repository: boky/postfix
      pullPolicy: IfNotPresent
    persistence:
      enabled: false
    service:
      type: ClusterIP
      port: 587
    config:
      general:
        TZ: "UTC"
        # Placeholder — patched from KERNEL_DOMAIN by scripts/mail-lib.sh on install/update.
        ALLOWED_SENDER_DOMAINS: "example.domain"
      postfix:
        myhostname: postfix-prod
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postfix-prod-values
  namespace: gentian-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  values.yaml: |
    # Env overrides — patched by scripts/mail-lib.sh when MAIL_SERVICE_MODE=kernel.
    # Schema is bokysan/mail (not the old proprietary chart).
    replicaCount: 1
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 64Mi
