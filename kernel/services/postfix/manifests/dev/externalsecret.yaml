# =============================================================================
# postfix — ESO ExternalSecret (Pattern B migration)
#
# Renders the 4 sensitive Helm value paths as a single sensitive-values.yaml
# Helm values file, consumed by the Release CR via valuesFrom.secretKeyRef.
#
# Sources:
#   gentian-os/kernel/mail/postfix       — relay_username, relay_password
#                                          (Gmail App Password by default)
#   gentian-os/kernel/identity/nubus     — smtp_password (opendesk-system),
#                                          ldapsearch_postfix (LDAP bind pw)
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postfix-sensitive-values
  namespace: gentian-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: postfix-sensitive-values
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # provider-helm reads this key as a Helm values file (merged last → wins).
        sensitive-values.yaml: |
          postfix:
            relayHost:
              authentication:
                username:
                  value: {{ .relay_username | quote }}
                password:
                  value: {{ .relay_password | quote }}
            staticAuthDB:
              password:
                value: {{ .smtp_password | quote }}
            ldap:
              password:
                value: {{ .ldapsearch_postfix | quote }}
  data:
    - secretKey: relay_username
      remoteRef:
        key: gentian-os/kernel/mail/postfix
        property: relay_username
    - secretKey: relay_password
      remoteRef:
        key: gentian-os/kernel/mail/postfix
        property: relay_password
    - secretKey: smtp_password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: smtp_password
    - secretKey: ldapsearch_postfix
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: ldapsearch_postfix
