# UNTESTED — relay credentials from OpenBao (gentian-os/kernel/mail/postfix).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postfix-sensitive-values
  namespace: gentian-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: postfix-sensitive-values
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        sensitive-values.yaml: |
          config:
            general:
              RELAYHOST: "[smtp.gmail.com]:587"
              RELAYHOST_USERNAME: {{ .relay_username | quote }}
              RELAYHOST_PASSWORD: {{ .relay_password | quote }}
  data:
    - secretKey: relay_username
      remoteRef:
        key: gentian-os/kernel/mail/postfix
        property: relay_username
    - secretKey: relay_password
      remoteRef:
        key: gentian-os/kernel/mail/postfix
        property: relay_password
