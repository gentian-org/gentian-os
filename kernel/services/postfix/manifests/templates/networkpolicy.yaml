{{- /*
  Who may open a connection to Postfix.

  Postfix listens on two ports, and both face the internet:

    smtp (25)          inbound mail, through the MX load balancer
                       (service-smtp.yaml). Rendered only when that Service
                       is (smtpIngress.enabled): without it no Service
                       reaches this port and nothing dials it.
    submission (587)   what an app that declared `mail.smtp` and every
                       Keycloak realm are handed, by the public name
                       (mail_reconciler.go, keycloak_tenant_smtp.go), and
                       what the same load balancer publishes for mail clients
                       outside (submissionIngress).

  Both are open to any source, as they were -- a rule with ports and no
  `from`. A connection through the load balancer does not arrive from a pod,
  and whether one from inside the cluster to the public name still carries
  its pod's address depends on the proxy mode of the cluster, so a rule
  naming tenant namespaces could refuse the very apps it is written for.
  Who may relay is Postfix's own decision, by credential.

  What the policy does is close everything else on these pods: a NetworkPolicy
  that selects a pod denies what it does not list. The DKIM signer runs
  inside the same container and Postfix reaches it there; nothing outside
  the pod has business with it. Postfix's own calls -- LMTP and the
  authentication service of Dovecot, the mail it sends -- are egress, and
  nothing is said about egress. Its probes run inside the container.

  The pods are built by the upstream chart the Release below installs, which
  labels them with its own name and the release's; the MX Service selects on
  the same two.

  Sync wave -1: before the Release (9), so the server is never up without it.
*/ -}}
{{- if ne (toString .Values.networkPolicy.enabled) "false" }}
{{- $np := .Values.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postfix-ingress
  namespace: {{ .Values.servicesNamespace }}
  labels:
    gentianos.io/tier: system
    gentianos.io/function: mail
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mail
      app.kubernetes.io/instance: postfix-{{ .Values.env }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        {{- if .Values.smtpIngress.enabled }}
        - protocol: TCP
          port: {{ $np.ports.smtp }}
        {{- end }}
        - protocol: TCP
          port: {{ $np.ports.submission }}
{{- end }}
