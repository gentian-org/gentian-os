# provider-helm Release for the public bokysan/mail chart (image
# docker.io/boky/postfix), at the version and from the repository versions.yaml
# pins (versions.postfix), which the mail ApplicationSet passes in.
apiVersion: helm.crossplane.io/v1beta1
kind: Release
metadata:
  name: postfix-{{ .Values.env }}
  annotations:
    crossplane.io/external-name: postfix-{{ .Values.env }}
    argocd.argoproj.io/sync-wave: "9"
spec:
  forProvider:
    chart:
      name: mail
      repository: {{ .Values.versions.postfix.repo }}
      version: {{ .Values.versions.postfix.chart | quote }}
    namespace: {{ .Values.servicesNamespace }}
    wait: true
    waitTimeout: "5m"
    valuesFrom:
      - configMapKeyRef:
          name: postfix-base-values
          namespace: {{ .Values.servicesNamespace }}
          key: values.yaml
          optional: false
      - configMapKeyRef:
          name: postfix-{{ .Values.env }}-values
          namespace: {{ .Values.servicesNamespace }}
          key: values.yaml
          optional: false
      - secretKeyRef:
          name: postfix-sensitive-values
          namespace: {{ .Values.servicesNamespace }}
          key: sensitive-values.yaml
          optional: true
  providerConfigRef:
    name: kubernetes
