# Relay credentials from OpenBao (gentian-os/kernel/mail/postfix).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postfix-sensitive-values
  namespace: {{ .Values.servicesNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: postfix-sensitive-values
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        sensitive-values.yaml: |
          config:
            general:
              # RELAYHOST is empty unless a relay is configured.
              #
              # It used to be the literal "[smtp.gmail.com]:587" regardless of
              # MAIL_SERVICE_MODE. In kernel mode there are no relay credentials —
              # relay_username and relay_password are empty — so Postfix handed every
              # outbound message to Gmail unauthenticated and Gmail refused it:
              #
              #   to=<user@example.com>, relay=smtp.gmail.com[...]:587,
              #   dsn=5.7.0, status=bounced (530-5.7.0 Authentication Required)
              #
              # Keycloak had already reported success, so invites said "Invite sent"
              # and silently bounced. Empty means direct delivery, which is the whole
              # point of kernel mode.
              {{- if .Values.relayHost }}
              RELAYHOST: {{ printf "[%s]:%s" .Values.relayHost (.Values.relayPort | default "587" | toString) | quote }}
              {{- else }}
              RELAYHOST: ""
              {{- end }}
              RELAYHOST_USERNAME: {{ "{{" }} .relay_username | default "" | quote }}
              RELAYHOST_PASSWORD: {{ "{{" }} .relay_password | default "" | quote }}
  # dataFrom rather than a per-key data block, because the keys are absent until
  # somebody supplies them.
  #
  # They used to be seeded as empty strings so this could name them explicitly.
  # That made the path always complete, so the satisfaction probe for smtp-relay
  # reported Ready over a credential nobody had set and check-credentials counted
  # it among the satisfied — while Postfix relayed unauthenticated and Gmail
  # bounced every message. That is the failure recorded above, reached by a route
  # that reported success the whole way.
  #
  # Absent now means absent: the probe cannot find the property and says so, and
  # this extract leaves the template defaults in place, so a kernel-mode or
  # not-yet-configured cluster still renders.
  dataFrom:
    - extract:
        key: gentian-os/kernel/mail/postfix
