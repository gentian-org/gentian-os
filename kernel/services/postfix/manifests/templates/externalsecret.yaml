# Relay credentials from OpenBao (gentian-os/kernel/mail/postfix).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postfix-sensitive-values
  namespace: {{ .Values.servicesNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: postfix-sensitive-values
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      # Also an API default, and also drift when omitted.
      mergePolicy: Replace
      data:
        sensitive-values.yaml: |
          config:
            general:
              # RELAYHOST is empty unless a relay is configured.
              #
              # It used to be the literal "[smtp.gmail.com]:587" regardless of
              # MAIL_SERVICE_MODE. In kernel mode there are no relay credentials —
              # relay_username and relay_password are empty — so Postfix handed every
              # outbound message to Gmail unauthenticated and Gmail refused it:
              #
              #   to=<user@example.com>, relay=smtp.gmail.com[...]:587,
              #   dsn=5.7.0, status=bounced (530-5.7.0 Authentication Required)
              #
              # Keycloak had already reported success, so invites said "Invite sent"
              # and silently bounced. Empty means direct delivery, which is the whole
              # point of kernel mode.
              {{- if .Values.relayHost }}
              RELAYHOST: {{ printf "[%s]:%s" .Values.relayHost (.Values.relayPort | default "587" | toString) | quote }}
              {{- else }}
              RELAYHOST: ""
              {{- end }}
              # index, not .relay_username. ESO renders with missingkey=error,
              # so a bare field lookup on an absent key aborts the whole
              # template before `default` is ever reached:
              #
              #   unable to execute template at key sensitive-values.yaml:
              #   map has no entry for key "relay_username"
              #
              # which is the one case the comment above says must still render.
              # index returns the element's zero value for a missing key and
              # leaves missingkey out of it, so `default` does what it says.
              #
              # The consequence was total. This ExternalSecret is sync-wave -1,
              # so its failure held back the Release, the Service and the PVC:
              # no Postfix at all. Keycloak then failed to connect to
              # postfix-prod:587, and inviting a user answered
              #   502: Invitation email could not be sent
              # on a cluster in kernel mail mode, which by definition has no
              # relay credential to supply.
              RELAYHOST_USERNAME: {{ "{{" }} index . "relay_username" | default "" | quote }}
              RELAYHOST_PASSWORD: {{ "{{" }} index . "relay_password" | default "" | quote }}
  # dataFrom rather than a per-key data block, because the keys are absent until
  # somebody supplies them.
  #
  # They used to be seeded as empty strings so this could name them explicitly.
  # That made the path always complete, so the satisfaction probe for smtp-relay
  # reported Ready over a credential nobody had set and check-credentials counted
  # it among the satisfied — while Postfix relayed unauthenticated and Gmail
  # bounced every message. That is the failure recorded above, reached by a route
  # that reported success the whole way.
  #
  # Absent now means absent: the probe cannot find the property and says so, and
  # this extract leaves the template defaults in place, so a kernel-mode or
  # not-yet-configured cluster still renders.
  #
  # The four strategy fields below are ESO's own defaults, written out rather
  # than left off. The API server fills them in either way, so a manifest that
  # omits them never matches the object it creates — and Argo CD reported this
  # Application OutOfSync permanently, on a resource that was Ready and
  # SecretSynced the whole time. A permanent false positive is worse than none:
  # it is the noise a real drift then hides in.
  dataFrom:
    - extract:
        key: gentian-os/kernel/mail/postfix
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
