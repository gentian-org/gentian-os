# Helm values for the public bokysan/mail chart (Pattern B).
# Namespace {{ .Values.servicesNamespace }} → Service postfix-{{ .Values.env }}.{{ .Values.servicesNamespace }}.svc.cluster.local:587
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postfix-base-values
  namespace: {{ .Values.servicesNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  values.yaml: |
    # Helm chart: bokysan/mail — https://bokysan.github.io/docker-postfix/
    # Kept deliberately, not required. platform-kernel IS in the exclusion list
    # of the Kyverno baseline policies (gentian-disallow-privilege-escalation,
    # gentian-require-seccomp), so nothing here is enforced against this Pod —
    # these are set anyway because a relay that can escalate is worth avoiding on
    # its own merits, and because the exclusion list is a policy decision that
    # could be tightened later without wanting mail to break.
    #
    # runAsNonRoot and a capability drop are deliberately omitted: Postfix binds
    # 25/587. Kyverno's non-root and capabilities rules are "=(securityContext)"
    # conditionals that only engage on keys that are present, so leaving them out
    # stays compliant without needing a MAC waiver if the exclusion is ever removed.
    container:
      postfix:
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
    fullnameOverride: postfix-{{ .Values.env }}
    image:
      repository: boky/postfix
      pullPolicy: IfNotPresent
    persistence:
      enabled: false
    service:
      type: ClusterIP
      port: 587
    config:
      general:
        TZ: "UTC"
        # Rendered from the cluster's kernel domain, NOT patched in afterwards.
        #
        # This used to ship the literal "example.domain" for scripts/lib/mail-lib.sh
        # to kubectl-patch on install. That ConfigMap is Argo CD-managed with
        # selfHeal, so the patch was reverted to the placeholder on the next
        # sync. The failure is severe and silent: the bokysan chart builds
        # smtpd_recipient_restrictions ending in a bare `reject`, permitting only
        # senders listed in /etc/postfix/allowed_senders, so with the placeholder
        # in place Postfix answered EVERY recipient with
        #   554 5.7.1 <user@domain>: Recipient address rejected: Access denied
        # and no invite or password-reset mail could leave the cluster.
        ALLOWED_SENDER_DOMAINS: "{{ .Values.kernelDomain | default "example.domain" }}"
        # Sign outbound mail with DKIM.
        #
        # Without this the image generates no keys and leaves smtpd_milters empty,
        # so opendkim runs but never sees a message and everything leaves
        # unsigned. Receiving providers weight an unsigned message from a new IP
        # heavily towards spam, which is indistinguishable from mail being lost.
        #
        # The image generates one key per domain in ALLOWED_SENDER_DOMAINS on
        # first start, writing /etc/opendkim/keys/<domain>.txt for publication as
        # a TXT record. Keys therefore only cover the domains named above — a
        # placeholder there yields a key nobody can verify.
        DKIM_AUTOGENERATE: "1"
      postfix:
        # The name Postfix greets a remote server with, and it must be a FQDN that
        # resolves back to the sending address. It defaulted to the Service name —
        # Gmail recorded "Received: from postfix-prod ([37.x.x.x])" — which is not a
        # FQDN, resolves to nothing, and is one of the strongest spam signals a new
        # sender can emit, alongside a missing PTR.
        #
        # smtpHelo must name the OUTBOUND address, which is not necessarily the
        # inbound MX address: mail leaves via the node egress IP while it arrives on
        # the load balancer. Receivers check forward-confirmed reverse DNS — the PTR
        # of the sending IP names a host, and that host resolves back to the same IP
        # — so this name, its A record and the PTR must all agree.
        myhostname: {{ .Values.smtpHelo | default (printf "mail.%s" .Values.kernelDomain) }}
        # Inbound tenant mail: hand every message for a registered tenant domain
        # to Dovecot over LMTP, which files it into /var/mail/<domain>/<user>.
        virtual_transport: "lmtp:[dovecot-{{ .Values.env }}.{{ .Values.servicesNamespace }}.svc.cluster.local]:24"
        # Both maps are texthash: files, not lmdb:.
        #
        # The files come from a ConfigMap mount, so they are read-only and can
        # never be compiled — lmdb: makes Postfix look for
        # /etc/postfix/kernel-maps/virtual_mailbox_maps.lmdb, log
        #   error: open database ...lmdb: No such file
        # and then reject every recipient in a virtual domain with
        #   554 5.7.1 <user@domain>: Recipient address rejected: Access denied
        # since a virtual_mailbox_domain whose map cannot be read has no valid
        # addresses. texthash: reads the file at lookup time and needs no
        # postmap run, which is also what makes tenant churn restart-free: the
        # operator rewrites the ConfigMap, kubelet swaps the mounted files, and
        # the next lookup sees the new domain.
        virtual_mailbox_domains: "texthash:/etc/postfix/kernel-maps/virtual_mailbox_domains"
        virtual_mailbox_maps: "texthash:/etc/postfix/kernel-maps/virtual_mailbox_maps"
        # Who may SEND, from the same operator-maintained file that decides who
        # may receive.
        #
        # The image builds /etc/postfix/allowed_senders from
        # ALLOWED_SENDER_DOMAINS once, at start, and that variable carries the
        # kernel domain only — so a tenant user could receive mail but every
        # message they sent was refused with
        #   554 5.7.1 <user@tenant>: Sender address rejected: Access denied
        # and adding a tenant would have needed a Postfix restart to fix.
        #
        # texthash: for the same reason as the two maps above — read at lookup
        # time, so a new tenant can send as soon as the operator rewrites the
        # ConfigMap, with no restart and no postmap.
        # Order matters, and getting it wrong breaks a whole direction of mail.
        #
        # check_recipient_access comes FIRST and permits anything addressed to a
        # domain this cluster hosts, whoever sent it. Without that, the sender rule
        # below also governs INBOUND mail: a stranger writing to a tenant is not in
        # sender_access, falls through to reject, and Gmail bounces with
        #   554 5.7.1 <user@tenant>: Recipient address rejected: Access denied
        # which reads as a recipient problem and is nothing of the sort.
        #
        # check_sender_access then applies only to what is left — mail for domains
        # we do NOT host, i.e. relaying — so it still stops this being an open relay
        # while letting the world deliver to our tenants.
        smtpd_recipient_restrictions: "reject_non_fqdn_recipient, reject_unknown_recipient_domain, check_recipient_access texthash:/etc/postfix/kernel-maps/virtual_mailbox_domains, check_sender_access texthash:/etc/postfix/kernel-maps/sender_access, reject"
    # postfix-kernel-virtual-mailbox-maps is written by the operator from the
    # tenant domain registry, and is therefore NOT part of this chart — a chart
    # copy would be reverted onto the operator's content by Argo CD self-heal on
    # every sync.
    #
    # optional: true because the ConfigMap only exists once the cluster has run
    # the mail step. A required mount that is absent holds the Pod in
    # ContainerCreating indefinitely:
    #   FailedMount (x901 over 30h): configmap
    #   "postfix-kernel-virtual-mailbox-maps" not found
    # Optional means Postfix starts with the maps empty — accepting mail for no
    # tenant domain, which is the truth at that point — and kubelet populates
    # the mount when the ConfigMap appears.
    #
    # Mounted as a directory, without subPath: a subPath mount is copied once at
    # Pod start and never tracks later ConfigMap updates, so every new tenant
    # would need a Postfix restart to receive mail.
    extraVolumes:
      - name: kernel-maps
        configMap:
          name: postfix-kernel-virtual-mailbox-maps
          optional: true
      # Per-tenant DKIM: the two OpenDKIM tables plus the private keys they
      # name, written by the operator from the tenant registry.
      #
      # NOT optional, deliberately. The tables are mounted over the image's own
      # with subPath, and a subPath naming a key that does not exist stops the
      # container starting — which would take all mail down, not just signing.
      - name: dkim-tenants
        secret:
          secretName: postfix-dkim-tenants
          defaultMode: 0400
    extraVolumeMounts:
      # Postfix warns about this mount on every start:
      #
      #   warning: group or other writable:
      #     /etc/postfix/./kernel-maps/virtual_mailbox_domains
      #
      # Expected, and not worth restructuring for. The files are 0644 and the
      # payload directory 0755; it is the volume ROOT that is 0777, because
      # that is how kubelet creates a ConfigMap mount and defaultMode does not
      # reach it. postfix-script walks the path, sees a world-writable parent,
      # and says so. The maps still load — `postmap -q <domain>
      # texthash:/etc/postfix/kernel-maps/virtual_mailbox_domains` answers OK.
      - name: kernel-maps
        mountPath: /etc/postfix/kernel-maps
        readOnly: true
      # The keys as a directory, so a tenant added later appears without a
      # restart. KeyTable references /etc/opendkim/tenant-keys/<domain>.private.
      - name: dkim-tenants
        mountPath: /etc/opendkim/tenant-keys
        readOnly: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postfix-{{ .Values.env }}-values
  namespace: {{ .Values.servicesNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  values.yaml: |
    # Env overrides. Nothing rewrites this at install time any more: the relay for
    # MAIL_SERVICE_MODE=external arrives as relayHost/relayPort from the
    # ApplicationSet and is rendered into postfix-sensitive-values, because this
    # object is Argo CD-managed and an imperative rewrite was reverted on the next
    # sync. Schema is bokysan/mail, which has no top-level `postfix:` key — values
    # written under one were silently discarded.
    replicaCount: 1
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 64Mi
