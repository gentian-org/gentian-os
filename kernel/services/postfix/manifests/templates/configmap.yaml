# Helm values for the public bokysan/mail chart (Pattern B).
# Namespace {{ .Values.servicesNamespace }} → Service postfix-{{ .Values.env }}.{{ .Values.servicesNamespace }}.svc.cluster.local:587
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postfix-base-values
  namespace: {{ .Values.servicesNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  values.yaml: |
    # Helm chart: bokysan/mail — https://bokysan.github.io/docker-postfix/
    # Kept deliberately, not required. platform-kernel IS in the exclusion list
    # of the Kyverno baseline policies (gentian-disallow-privilege-escalation,
    # gentian-require-seccomp), so nothing here is enforced against this Pod —
    # these are set anyway because a relay that can escalate is worth avoiding on
    # its own merits, and because the exclusion list is a policy decision that
    # could be tightened later without wanting mail to break.
    #
    # runAsNonRoot and a capability drop are deliberately omitted: Postfix binds
    # 25/587. Kyverno's non-root and capabilities rules are "=(securityContext)"
    # conditionals that only engage on keys that are present, so leaving them out
    # stays compliant without needing a MAC waiver if the exclusion is ever removed.
    container:
      postfix:
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
    fullnameOverride: postfix-{{ .Values.env }}
    image:
      repository: boky/postfix
      pullPolicy: IfNotPresent
    # Pin Postfix to the node that carries the egress floating IP.
    #
    # Outbound mail leaves by whatever address its node egresses from. With no
    # floating IP that is the router's shared SNAT address, whose reverse DNS
    # nobody owns; with one attached to a node, that node sends as the floating
    # IP and its PTR can be set. Either way the sending address follows the
    # scheduler unless it is pinned — and a reschedule that silently changes the
    # sending address breaks SPF and PTR at once, with no signal beyond mail
    # starting to land in spam.
    #
    # Empty leaves scheduling free, which is correct for a cluster relaying
    # through a smarthost: there the last hop is the relay's address and the
    # node's does not matter.
    # Pinned to the node holding the egress floating IP whenever an egress host
    # is declared. One value drives both, because they are one decision: a
    # cluster that sends from an address it owns must keep sending from it, and
    # a reschedule to a node without that floating IP reverts to the shared SNAT
    # address — breaking the PTR and the SPF record together, with no signal
    # beyond mail starting to land in spam.
    #
    # Unset means relaying through a smarthost or accepting the shared address;
    # in both cases the node does not matter and scheduling stays free.
    nodeSelector:
    {{- if .Values.egressHost }}
      {{ .Values.egressNodeLabel }}: "true"
    {{- end }}
    persistence:
      enabled: false
    # The chart mounts this Secret at /var/run/certs and runs its own
    # _enable_tls.sh, which points smtpd_tls_cert_file and smtpd_tls_key_file at
    # the tls.crt and tls.key inside it — exactly the layout cert-manager writes,
    # so the Certificate needs no conversion step.
    {{- if .Values.tls.secretName }}
    certs:
      existingSecret: {{ .Values.tls.secretName }}
    {{- end }}
    service:
      type: ClusterIP
      port: 587
    config:
      general:
        TZ: "UTC"
        # Rendered from the cluster's kernel domain, NOT patched in afterwards.
        #
        # This used to ship the literal "example.domain" for scripts/lib/mail-lib.sh
        # to kubectl-patch on install. That ConfigMap is Argo CD-managed with
        # selfHeal, so the patch was reverted to the placeholder on the next
        # sync. The failure is severe and silent: the bokysan chart builds
        # smtpd_recipient_restrictions ending in a bare `reject`, permitting only
        # senders listed in /etc/postfix/allowed_senders, so with the placeholder
        # in place Postfix answered EVERY recipient with
        #   554 5.7.1 <user@domain>: Recipient address rejected: Access denied
        # and no invite or password-reset mail could leave the cluster.
        # The kernel domain alone. This is the fallback, not the whole answer:
        # extraEnv below overrides it with the operator's full domain list once
        # that exists, and an explicit env entry wins over this envFrom value.
        ALLOWED_SENDER_DOMAINS: "{{ .Values.kernelDomain | default "example.domain" }}"
        # Sign outbound mail with DKIM.
        #
        # Without this the image generates no keys and leaves smtpd_milters empty,
        # so opendkim runs but never sees a message and everything leaves
        # unsigned. Receiving providers weight an unsigned message from a new IP
        # heavily towards spam, which is indistinguishable from mail being lost.
        #
        # The image generates one key per domain in ALLOWED_SENDER_DOMAINS on
        # first start, writing /etc/opendkim/keys/<domain>.txt for publication as
        # a TXT record. Keys therefore only cover the domains named above — a
        # placeholder there yields a key nobody can verify.
        #
        # kernel mode only. Relaying through a smarthost means the smarthost
        # signs — Gmail signs as gmail.com — and a second signature from a key
        # whose TXT record nobody published verifies for no one. Generating it
        # anyway cost an hour of crash-looping when the tables it writes were
        # mounted read-only, for a signature that was never going to be checked.
        #
        # Omitted entirely outside kernel mode, rather than set to "0". The image asks
        # [[ -n "${DKIM_AUTOGENERATE}" ]] — whether the variable is NON-EMPTY, not
        # whether it says yes — so "0" enabled it exactly as "1" does. The switch read
        # as off while signing ran, and the only reason that was harmless here is that
        # this cluster wants it on.
        #
        # An unset variable is the only value that reads as absent to a -n test, so the
        # key has to disappear rather than say no.
        {{- if eq (.Values.mailServiceMode | default "external") "kernel" }}
        DKIM_AUTOGENERATE: "1"
        {{- end }}
      postfix:
        # The name Postfix greets a remote server with, and it must be a FQDN that
        # resolves back to the sending address. It defaulted to the Service name —
        # Gmail recorded "Received: from postfix-prod ([37.x.x.x])" — which is not a
        # FQDN, resolves to nothing, and is one of the strongest spam signals a new
        # sender can emit, alongside a missing PTR.
        #
        # smtpHelo must name the OUTBOUND address, which is not necessarily the
        # inbound MX address: mail leaves via the node egress IP while it arrives on
        # the load balancer. Receivers check forward-confirmed reverse DNS — the PTR
        # of the sending IP names a host, and that host resolves back to the same IP
        # — so this name, its A record and the PTR must all agree.
        myhostname: {{ .Values.egressHost | default (printf "mail.%s" .Values.kernelDomain) }}
        # An MX must accept connections from strangers. The image does not, because
        # it ships as an outbound relay:
        #   smtpd_client_restrictions = permit_mynetworks,permit_sasl_authenticated,reject
        #   smtpd_sender_restrictions = permit_mynetworks,reject
        # Every client outside mynetworks is refused at the CLIENT stage, before any
        # recipient is examined, with
        #   554 5.7.1 <unknown[a.b.c.d]>: Client host rejected: Access denied
        #
        # That was invisible while mynetworks still contained 172.16.0.0/12, because
        # the load balancer proxies inbound mail from the node network and so every
        # sender on the internet arrived pre-trusted. The same wrong entry that made
        # this an open relay is what made it able to receive at all, so scoping
        # mynetworks to the pod range closed the relay and stopped inbound mail in
        # one move: Spamhaus's own delisting confirmation was rejected with the
        # message above, and a 554 is permanent, so it was not retried.
        #
        # Opening these two stages does NOT reopen the relay. What a stranger may do
        # is decided by smtpd_relay_restrictions (reject_unauth_destination, so only
        # domains this cluster hosts) and by smtpd_recipient_restrictions below —
        # relay restrictions are evaluated BEFORE recipient restrictions, so a forged
        # sender in our own domain cannot buy relay access through check_sender_access.
        #
        # reject_non_fqdn_sender and reject_unknown_sender_domain stay because they
        # cost a legitimate sender nothing and refuse mail whose envelope sender
        # cannot exist. The trailing permit is explicit: this list is hygiene, not
        # authorisation.
        # Authenticated submission, and why it is the primary grant rather than a
        # second one alongside mynetworks.
        #
        # Relaying used to be granted by IP alone. That is not portable and it is
        # not safe: mynetworks has to name the Pod range exactly, while the load
        # balancer proxies inbound mail from an address that falls OUTSIDE that
        # range on this CSP and INSIDE it on the next one. Get it wrong by one
        # prefix and every client on the internet is trusted — which is exactly
        # what happened here, DKIM-signed as the kernel domain, ending on the
        # Spamhaus SBL. A credential carries the same meaning on every cluster.
        #
        # Dovecot is the SASL server: it already holds one credential per
        # (user, app) for IMAP, so submission is another app rather than a second
        # identity store. inet: because the two run in separate Pods and share no
        # socket — see the auth service in the Dovecot manifests.
        smtpd_sasl_auth_enable: "yes"
        smtpd_sasl_type: "dovecot"
        smtpd_sasl_path: "inet:dovecot-{{ .Values.env }}.{{ .Values.servicesNamespace }}.svc.cluster.local:12345"
        # noanonymous, because an anonymous mechanism would make
        # permit_sasl_authenticated grant relaying to anyone who asks for it.
        smtpd_sasl_security_options: "noanonymous"
        # The submission port announces AUTH; port 25 does not need to, but Postfix
        # applies this process-wide and a receiving MX advertising AUTH is normal.
        # What matters is that offering it is not accepting it: the restrictions
        # below decide, not the announcement.
        broken_sasl_auth_clients: "yes"
        smtpd_client_restrictions: "permit_sasl_authenticated, permit_mynetworks, permit"
        smtpd_sender_restrictions: "permit_sasl_authenticated, permit_mynetworks, reject_non_fqdn_sender, reject_unknown_sender_domain, permit"
        # Never offer AUTH before TLS.
        #
        # Submission is published on the internet, so without this a password
        # crosses in clear to anyone who asks for it — and the client cannot tell,
        # because Postfix would advertise AUTH on a plaintext connection exactly
        # as it does on an encrypted one. With it, AUTH does not appear in the
        # EHLO response until STARTTLS has succeeded, so a client that cannot do
        # TLS fails to authenticate instead of succeeding insecurely.
        #
        # Inbound mail on 25 is untouched: remote MTAs do not authenticate, and
        # smtpd_tls_security_level stays "may" so a sender without TLS still
        # delivers. This governs credentials, not mail.
        smtpd_tls_auth_only: "yes"
        # What a published submission port needs that an internal one does not.
        #
        # Failed logins get slower and connections are capped per client, so a
        # credential-stuffing run costs the attacker time instead of costing us a
        # reputation. anvil keeps the counters; the limits are per client address
        # per anvil_rate_time_unit (60s by default), and are generous enough that
        # a real mail client never meets them.
        smtpd_client_auth_rate_limit: "10"
        smtpd_client_connection_rate_limit: "30"
        smtpd_error_sleep_time: "5s"
        smtpd_soft_error_limit: "3"
        smtpd_hard_error_limit: "10"
        # Cap the number of forked processes. The default is 100, and a queue that
        # deep forks 100 smtp clients at once on start — which is what exceeded the
        # memory limit and crash-looped the container. This cluster sends
        # notification mail, not campaigns; 20 concurrent deliveries is ample and
        # makes the worst-case memory a property of the config rather than of
        # however much mail happens to be queued.
        default_process_limit: "20"
        # Who may relay, and who is merely allowed to deliver to our own tenants.
        #
        # Rendered from .Values.trustedNetworks, which documents why the image's
        # default is unusable once port 25 is published: the load balancer proxies
        # inbound connections from the node network, which the default trusts, so
        # every internet client could relay. This is the ONLY thing separating a
        # tenant realm sending an invite from a spammer sending a campaign, because
        # both arrive without credentials.
        mynetworks: "{{ .Values.trustedNetworks }}"
        # Stated explicitly rather than left to the default
        #   permit_mynetworks permit_sasl_authenticated defer_unauth_destination
        # for the last term. defer_unauth_destination answers an unauthorised relay
        # attempt with 450 (try again later), which is correct for a temporary
        # problem and wrong here: nothing about "you may not relay through me" is
        # temporary, and a rejected spam run that is merely deferred comes back.
        # reject_unauth_destination answers 554 and ends it.
        #
        # permit_sasl_authenticated comes FIRST, because it is the grant meant to
        # outlive the others: it says the sender proved who it is, which is true
        # on every cluster. permit_mynetworks behind it is the migration path for
        # senders that do not authenticate yet, and the line this platform should
        # eventually be able to delete.
        #
        # Whether relaying still accepts an unauthenticated in-cluster client.
        #
        # requireAuthentication: true removes permit_mynetworks, so the only way to
        # relay to a domain this cluster does not host is to authenticate — and,
        # with smtpd_tls_auth_only, to do so inside TLS. Trust then no longer
        # depends on an address plan at all, which is the property that makes this
        # portable: the open relay this stack started with came from exactly that
        # dependency. Mail TO hosted domains is unaffected either way, because
        # reject_unauth_destination permits authorised destinations.
        #
        # false keeps permit_mynetworks for senders that do not authenticate yet,
        # and puts warn_if_reject in front of it. warn_if_reject turns the next
        # restriction into a log line instead of a rejection, so every relay that
        # WOULD be refused once this is true is logged as
        #   reject_warning: RCPT from <client>: 554 5.7.1 ...: Relay access denied
        # while still being delivered. That log is the migration list: when no
        # in-cluster client appears in it, this can be switched on. Lines from the
        # load balancer's address are internet clients being refused a relay, which
        # happens regardless and can be ignored.
        {{- if .Values.submission.requireAuthentication }}
        smtpd_relay_restrictions: "permit_sasl_authenticated, reject_unauth_destination"
        {{- else }}
        smtpd_relay_restrictions: "permit_sasl_authenticated, warn_if_reject reject_unauth_destination, permit_mynetworks, reject_unauth_destination"
        {{- end }}
        # Inbound tenant mail: hand every message for a registered tenant domain
        # to Dovecot over LMTP, which files it into /var/mail/<domain>/<user>.
        virtual_transport: "lmtp:[dovecot-{{ .Values.env }}.{{ .Values.servicesNamespace }}.svc.cluster.local]:24"
        # Both maps are texthash: files, not lmdb:.
        #
        # The files come from a ConfigMap mount, so they are read-only and can
        # never be compiled — lmdb: makes Postfix look for
        # /etc/postfix/kernel-maps/virtual_mailbox_maps.lmdb, log
        #   error: open database ...lmdb: No such file
        # and then reject every recipient in a virtual domain with
        #   554 5.7.1 <user@domain>: Recipient address rejected: Access denied
        # since a virtual_mailbox_domain whose map cannot be read has no valid
        # addresses. texthash: reads the file at lookup time and needs no
        # postmap run, which is also what makes tenant churn restart-free: the
        # operator rewrites the ConfigMap, kubelet swaps the mounted files, and
        # the next lookup sees the new domain.
        virtual_mailbox_domains: "texthash:/etc/postfix/kernel-maps/virtual_mailbox_domains"
        virtual_mailbox_maps: "texthash:/etc/postfix/kernel-maps/virtual_mailbox_maps"
        # Who may SEND, from the same operator-maintained file that decides who
        # may receive.
        #
        # The image builds /etc/postfix/allowed_senders from
        # ALLOWED_SENDER_DOMAINS once, at start, and that variable carries the
        # kernel domain only — so a tenant user could receive mail but every
        # message they sent was refused with
        #   554 5.7.1 <user@tenant>: Sender address rejected: Access denied
        # and adding a tenant would have needed a Postfix restart to fix.
        #
        # texthash: for the same reason as the two maps above — read at lookup
        # time, so a new tenant can send as soon as the operator rewrites the
        # ConfigMap, with no restart and no postmap.
        # Order matters, and getting it wrong breaks a whole direction of mail.
        #
        # check_recipient_access comes FIRST and permits anything addressed to a
        # domain this cluster hosts, whoever sent it. Without that, the sender rule
        # below also governs INBOUND mail: a stranger writing to a tenant is not in
        # sender_access, falls through to reject, and Gmail bounces with
        #   554 5.7.1 <user@tenant>: Recipient address rejected: Access denied
        # which reads as a recipient problem and is nothing of the sort.
        #
        # check_sender_access then applies only to what is left — mail for domains
        # we do NOT host, i.e. relaying — so it still stops this being an open relay
        # while letting the world deliver to our tenants.
        smtpd_recipient_restrictions: "reject_non_fqdn_recipient, reject_unknown_recipient_domain, check_recipient_access texthash:/etc/postfix/kernel-maps/virtual_mailbox_domains, check_sender_access texthash:/etc/postfix/kernel-maps/sender_access, reject"
    # postfix-kernel-virtual-mailbox-maps is written by the operator from the
    # tenant domain registry, and is therefore NOT part of this chart — a chart
    # copy would be reverted onto the operator's content by Argo CD self-heal on
    # every sync.
    #
    # optional: true because the ConfigMap only exists once the cluster has run
    # the mail step. A required mount that is absent holds the Pod in
    # ContainerCreating indefinitely:
    #   FailedMount (x901 over 30h): configmap
    #   "postfix-kernel-virtual-mailbox-maps" not found
    # Optional means Postfix starts with the maps empty — accepting mail for no
    # tenant domain, which is the truth at that point — and kubelet populates
    # the mount when the ConfigMap appears.
    #
    # Mounted as a directory, without subPath: a subPath mount is copied once at
    # Pod start and never tracks later ConfigMap updates, so every new tenant
    # would need a Postfix restart to receive mail.
    # Seed the operator's per-tenant DKIM keys before the image looks.
    #
    # Two things generate DKIM keys and only one may win. The operator creates a
    # key per tenant and publishes its public half on tenant status, which is
    # what reaches DNS; the image generates a key per domain in
    # ALLOWED_SENDER_DOMAINS. If both ran, Postfix would sign with the image's
    # key while DNS advertised the operator's, and every signature would fail
    # verification against a record that looks correct — worse than not signing.
    #
    # The image skips generation when a key is already present, so copying the
    # operator's keys in first makes it adopt them and build KeyTable entries
    # pointing at them. Operator owns the keys, image owns the tables, and
    # neither has to know about the other.
    #
    # The operator's copy wins when the two differ, because the operator is what
    # publishes the DNS record — so its key is by definition the one verifiers
    # check against. Leaving a stale image-generated key here would keep Postfix
    # signing with a key DNS no longer advertises.
    #
    # Keys the operator does not supply are left untouched: those are the image's
    # own, and replacing one is what invalidates an already-published record.
    # Every domain this cluster signs for, from the operator.
    #
    # OpenDKIM builds a KeyTable entry only for domains named here, so a tenant
    # missing from this list sends unsigned however correct its key and its
    # published DNS record are. The value above carries the kernel domain only,
    # which is why tenant mail left unsigned while everything looked configured.
    #
    # optional, and deliberately so. A missing key leaves this entry unset and the
    # envFrom value above still applies, so a cluster whose operator has not
    # written the list yet keeps signing for the kernel domain rather than starting
    # with no sender domains at all — which Postfix refuses to do, taking all mail
    # with it. Verified rather than assumed: an env entry whose optional source is
    # absent does not suppress the envFrom value.
    #
    # Read once at start, unlike the texthash maps beside it, so a new tenant signs
    # only after Postfix restarts.
    extraEnv:
      # The derived Pod CIDRs win over the value rendered above.
      #
      # An explicit env entry beats the envFrom ConfigMap the chart builds from
      # config.postfix, so this overrides mynetworks whenever the operator has
      # written it — and the operator derives it from the cluster's own Nodes,
      # which is correct on a provider whose address plan nobody here has seen.
      #
      # optional: true is what makes the configured value a fallback rather than
      # dead weight. A cluster whose CNI leaves spec.podCIDR unset (Calico with
      # its own IPAM is the usual case) has no key to read, the variable stays
      # unset, and trustedNetworks from values.yaml applies unchanged. Verified
      # rather than assumed: an env entry whose optional source is absent does
      # not suppress the envFrom value.
      - name: POSTFIX_mynetworks
        valueFrom:
          configMapKeyRef:
            name: postfix-kernel-virtual-mailbox-maps
            key: mynetworks
            optional: true
      - name: ALLOWED_SENDER_DOMAINS
        valueFrom:
          configMapKeyRef:
            name: postfix-kernel-virtual-mailbox-maps
            key: allowed_sender_domains
            optional: true
    # A string, not a list: the chart passes this value through tpl, which takes
    # a template to render and fails type-checking on a list — "wrong type for
    # value" from the release, with the previous StatefulSet left running.
    extraInitContainers: |
      - name: seed-dkim-keys
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            set -eu
            [ -d /tenant-keys ] || exit 0
            for k in /tenant-keys/*.private; do
              [ -e "$k" ] || continue
              name=$(basename "$k")
              if cmp -s "$k" "/keys/$name"; then
                echo "unchanged $name"
              else
                cp "$k" "/keys/$name"
                chmod 600 "/keys/$name"
                echo "seeded $name"
              fi
            done
        volumeMounts:
          - name: dkim-keys
            mountPath: /keys
          - name: dkim-tenants
            mountPath: /tenant-keys
            readOnly: true
    extraVolumes:
      # The DKIM signing keys.
      #
      # The image generates a key per domain at start and writes it under
      # /etc/opendkim/keys, which is the container filesystem — so every restart
      # produced a NEW key and silently invalidated the DNS record published for
      # the old one. Signatures then fail verification against a record that looks
      # correct, which is worse than not signing at all.
      #
      # The image skips generation when a key is already present ("Will not
      # overwrite"), so persisting the directory is enough to make a published
      # record stay valid. The chart's own persistence covers only the mail queue.
      - name: dkim-keys
        persistentVolumeClaim:
          claimName: postfix-{{ .Values.env }}-dkim-keys
      - name: kernel-maps
        configMap:
          name: postfix-kernel-virtual-mailbox-maps
          optional: true
      # Per-tenant DKIM: the two OpenDKIM tables plus the private keys they
      # name, written by the operator from the tenant registry.
      #
      # NOT optional, deliberately. The tables are mounted over the image's own
      # with subPath, and a subPath naming a key that does not exist stops the
      # container starting — which would take all mail down, not just signing.
      - name: dkim-tenants
        secret:
          secretName: postfix-dkim-tenants
          defaultMode: 0400
    extraVolumeMounts:
      - name: dkim-keys
        mountPath: /etc/opendkim/keys
      # Postfix warns about this mount on every start:
      #
      #   warning: group or other writable:
      #     /etc/postfix/./kernel-maps/virtual_mailbox_domains
      #
      # Expected, and not worth restructuring for. The files are 0644 and the
      # payload directory 0755; it is the volume ROOT that is 0777, because
      # that is how kubelet creates a ConfigMap mount and defaultMode does not
      # reach it. postfix-script walks the path, sees a world-writable parent,
      # and says so. The maps still load — `postmap -q <domain>
      # texthash:/etc/postfix/kernel-maps/virtual_mailbox_domains` answers OK.
      - name: kernel-maps
        mountPath: /etc/postfix/kernel-maps
        readOnly: true
      # The keys as a directory, so a tenant added later appears without a
      # restart. KeyTable references /etc/opendkim/tenant-keys/<domain>.private.
      - name: dkim-tenants
        mountPath: /etc/opendkim/tenant-keys
        readOnly: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postfix-{{ .Values.env }}-values
  namespace: {{ .Values.servicesNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  values.yaml: |
    # Env overrides. Nothing rewrites this at install time any more: the relay for
    # MAIL_SERVICE_MODE=external arrives as relayHost/relayPort from the
    # ApplicationSet and is rendered into postfix-sensitive-values, because this
    # object is Argo CD-managed and an imperative rewrite was reverted on the next
    # sync. Schema is bokysan/mail, which has no top-level `postfix:` key — values
    # written under one were silently discarded.
    replicaCount: 1
    resources:
      limits:
        cpu: 500m
        # 256Mi was not enough to survive a full queue. Postfix forks one smtp
        # process per concurrent delivery, so the memory a restart needs is set by
        # how much mail is queued, not by how much it normally sends: a queue of
        # ~100 messages OOM-killed the container ~17s into every start, which
        # crash-looped it and took Keycloak invites down with it
        # ("No route to host" to postfix:587, because no Pod was ever ready).
        # Raised together with default_process_limit below, which is what actually
        # bounds the fork count.
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 64Mi
