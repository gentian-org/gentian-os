# UNTESTED — placeholder values reference (not synced by 09-infra-helm; manifests hold live values).
# Chart: bokysan/mail — https://artifacthub.io/packages/helm/docker-postfix/mail
fullnameOverride: postfix-dev
image:
  repository: boky/postfix
  pullPolicy: IfNotPresent
persistence:
  enabled: false
service:
  type: ClusterIP
  port: 587
config:
  general:
    TZ: "UTC"
    # Placeholder — patched from KERNEL_DOMAIN by scripts/lib/mail-lib.sh on install/update.
    ALLOWED_SENDER_DOMAINS: "example.domain"
  postfix:
    myhostname: postfix-dev
