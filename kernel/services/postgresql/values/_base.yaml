# =============================================================================
# PostgreSQL app-level defaults (all environments)
# =============================================================================
# Layer 2 of the values hierarchy (merged after values/env/{env}.yaml).
# Only put settings here that are identical across dev, staging, and prod.
# Secrets and env-specific sizes belong in {env}/values.yaml.
# =============================================================================

# Superuser username is constant; password overridden per-env
postgres:
  user: postgres

# Image — pinned to OpenDesk-tested version
image:
  registry: registry-1.docker.io
  repository: library/postgres
  tag: 15.13-alpine3.20
  imagePullPolicy: IfNotPresent

# Container Security Context
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  enabled: true
  privileged: false
  runAsUser: 1001
  runAsGroup: 1001
  seccompProfile:
    type: RuntimeDefault
  readOnlyRootFilesystem: true
  runAsNonRoot: true

# Pod Security Context
podSecurityContext:
  enabled: true
  fsGroup: 1001
  fsGroupChangePolicy: OnRootMismatch

# Provisioning job — database schema (no secrets)
# All databases and users that nubus components need.
# Passwords for each user are set in {env}/values.yaml.
job:
  databases:
    - name: keycloak
      user: keycloak_user
    - name: keycloak_extensions
      user: keycloak_extensions_user
    - name: selfservice
      user: selfservice_user
    - name: nubus_authsession
      user: authsession_user
    - name: guardianmanagementapi
      user: guardianmanagementapi_user
    - name: notificationsapi
      user: notificationsapi_user
    - name: nextcloud
      user: nextcloud_user
    # Expand when Phase 4B apps are deployed:
    # - name: notes
    #   user: notes_user
    # - name: openproject
    #   user: openproject_user
    # - name: matrix
    #   user: matrix_user
    #   additionalParams: "ENCODING 'UTF8' LC_COLLATE='C' LC_CTYPE='C' template=template0"
    # - name: nextcloud
    #   user: nextcloud_user
    # - name: xwiki
    #   user: xwiki_user
    #   additionalParams: "ENCODING 'UNICODE' template=template0"

# Cleanup settings for provisioning job
cleanup:
  deletePodsOnSuccess: true
  deletePodsOnSuccessTimeout: 60

# Persistence defaults — size overridden per-env; storageClass from values/env/{env}.yaml
persistence:
  enabled: true

# Global chart settings (storageClass/imagePullSecrets from values/env/{env}.yaml)
global:
  ingress:
    enabled: false
