---
# ExternalSecret: cnpg-superuser
# Provides the PostgreSQL superuser credentials for the shared CNPG Cluster.
# CNPG reads username + password from this secret on cluster bootstrap.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-superuser
  namespace: platform-kernel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: cnpg-superuser
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: gentian-os/kernel/database/cnpg
        property: superuser_username
    - secretKey: password
      remoteRef:
        key: gentian-os/kernel/database/cnpg
        property: superuser_password
---
# ExternalSecret: postgres-admin
# Admin connection credentials used by the gentian-os operator's psql provisioner
# Jobs (database_reconciler.go — psqlContainer, postgresAdminSecret="postgres-admin").
# Keys: host, port, username, password
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-admin
  namespace: platform-kernel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: postgres-admin
    creationPolicy: Owner
    template:
      data:
        host: "postgres-rw.platform-kernel.svc.cluster.local"
        port: "5432"
        username: "{{ .superuser_username }}"
        password: "{{ .superuser_password }}"
  data:
    - secretKey: superuser_username
      remoteRef:
        key: gentian-os/kernel/database/cnpg
        property: superuser_username
    - secretKey: superuser_password
      remoteRef:
        key: gentian-os/kernel/database/cnpg
        property: superuser_password
---
# ExternalSecret: keycloak-admin
# Admin credentials for the shared Keycloak (Nubus) instance.
# Used by the gentian-os operator's identity_reconciler.go keycloak Jobs.
# Keys: url, password
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-admin
  namespace: platform-kernel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: keycloak-admin
    creationPolicy: Owner
    template:
      data:
        url: "http://nubus-dev-keycloak.gentian-dev.svc.cluster.local:8080"
        username: "kcadmin"
        password: "{{ .keycloak_admin_password }}"
  data:
    - secretKey: keycloak_admin_password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: keycloak_admin_password
---
# ExternalSecret: udm-admin
# Admin credentials for the Univention Directory Manager (UDM) REST API.
# Used by the gentian-os operator's ldap_reconciler.go OU provisioning Jobs and
# mail_reconciler.go for Dovecot LDAP authentication configuration.
# Keys: url, password, ldapBase, ldapHost, ldapsearchDovecot
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: udm-admin
  namespace: platform-kernel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: udm-admin
    creationPolicy: Owner
    template:
      data:
        url: "http://nubus-dev-udm-rest-api.gentian-dev.svc.cluster.local:9979"
        ldapBase: "dc=swp-ldap,dc=internal"
        ldapHost: "nubus-dev-ldap-server.gentian-dev.svc.cluster.local"
        password: "{{ .admin_password }}"
        ldapsearchDovecot: "{{ .ldapsearch_dovecot }}"
  data:
    - secretKey: admin_password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: admin_password
    - secretKey: ldapsearch_dovecot
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: ldapsearch_dovecot
---
# ExternalSecret: dovecot-admin
# Dovecot OIDC and doveadm credentials.
# Used by the gentian-os operator's mail_reconciler.go for the opendesk-dovecot chart.
# Keys: doveadm_password, oidc_client_secret
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dovecot-admin
  namespace: platform-kernel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: dovecot-admin
    creationPolicy: Owner
  data:
    - secretKey: doveadm_password
      remoteRef:
        key: gentian-os/kernel/mail/dovecot
        property: doveadm_password
    - secretKey: oidc_client_secret
      remoteRef:
        key: gentian-os/kernel/mail/dovecot
        property: oidc_client_secret
---
# ExternalSecret: mariadb-admin
# Admin credentials for the shared MariaDB instance.
# Used by the gentian-os operator's mariadb_reconciler.go provisioning Jobs.
# Keys: host, port, username, password
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mariadb-admin
  namespace: platform-kernel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: mariadb-admin
    creationPolicy: Owner
    template:
      data:
        host: "opendesk-mariadb-dev.gentian-infra-dev.svc.cluster.local"
        port: "3306"
        username: "root"
        password: "{{ .root_password }}"
  data:
    - secretKey: root_password
      remoteRef:
        key: gentian-os/kernel/database/mariadb
        property: root_password
---
# ExternalSecret: redis-admin
# Admin credentials for the shared Redis instance.
# Used by the gentian-os operator's cache_reconciler.go ACL provisioning Jobs.
# Keys: host, port, password
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-admin
  namespace: platform-kernel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: redis-admin
    creationPolicy: Owner
    template:
      data:
        host: "redis-dev-master.gentian-infra-dev.svc.cluster.local"
        port: "6379"
        password: "{{ .auth_password }}"
  data:
    - secretKey: auth_password
      remoteRef:
        key: gentian-os/kernel/cache/redis
        property: auth_password
---
# ExternalSecret: minio-admin
# Admin credentials for the shared MinIO instance.
# Used by the gentian-os operator's storage_reconciler.go bucket provisioning Jobs.
# Keys: endpoint, accessKey, secretKey
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-admin
  namespace: platform-kernel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: minio-admin
    creationPolicy: Owner
    template:
      data:
        endpoint: "http://minio-dev.gentian-infra-dev.svc.cluster.local:9000"
        accessKey: "{{ .root_user }}"
        secretKey: "{{ .root_password }}"
  data:
    - secretKey: root_user
      remoteRef:
        key: gentian-os/kernel/storage/minio
        property: root_user
    - secretKey: root_password
      remoteRef:
        key: gentian-os/kernel/storage/minio
        property: root_password
