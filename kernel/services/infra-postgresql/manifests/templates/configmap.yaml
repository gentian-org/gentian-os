# =============================================================================
# Shared kernel PostgreSQL — plain values ConfigMaps
#
# Two ConfigMaps merged by the InfraData Crossplane composition (provider-helm
# valuesFrom) before the sensitive-values Secret:
#   1. postgresql-base-values  — non-secret defaults for all environments
#   2. postgresql-{{ .Values.env }}-values   — env-specific sizing and non-secret overrides
#
# DO NOT put any secret values here.  All passwords come from the
# postgresql-sensitive-values Secret (see externalsecret.yaml).
#
# job.users is intentionally omitted: the sensitive-values.yaml template
# renders the complete list (username + connectionLimit + password) so Helm
# list-merge produces a single consistent array.
# =============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-base-values
  namespace: gentian-infra-{{ .Values.env }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  values.yaml: |
    # Superuser username is constant; password overridden by sensitive-values.
    postgres:
      user: postgres

    # initdb's own fsync pass over the fresh data directory ("syncing data
    # to disk...") does one fsync() per file rather than one bulk write —
    # confirmed on this cluster's nfs-csi: a single 50MB sequential
    # write+fsync takes well under a second (104MB/s), but initdb still
    # ran past a 10-minute startup probe stuck on that exact line, never
    # reaching "syncing data to disk ... ok". That is NFS's known weak
    # spot (many small synchronous round-trips, not bulk throughput), and
    # no probe timeout fixes a per-call latency problem — it only waits
    # longer for the same slow thing. --no-sync skips that pass; the data
    # this cluster holds is disposable dev/test data recreated on every
    # purge, so the durability that buys is not worth losing installs to.
    # Without POSTGRES_HOST_AUTH_METHOD set, the official image's entrypoint
    # never appends a "host all all all <method>" line to pg_hba.conf at
    # all — initdb's own bare default only allows the Unix socket and
    # 127.0.0.1/::1 (as `trust`, no password needed). Confirmed directly
    # on a live pod: nothing in pg_hba.conf matched any pod-network address,
    # so anything connecting from a different pod — Keycloak, and the
    # job.users bootstrap Job that creates keycloak_user in the first
    # place — was rejected before password auth was ever checked. This
    # was never a startup race: a Job that can never connect doesn't
    # recover with a longer timeout, it just fails slower, and every
    # previous credential-looking symptom (missing role, stale password,
    # missing pg_hba entry) was this one gap surfacing at whatever point
    # startup happened to reach before something else killed it.
    extraEnvVars:
      - name: POSTGRES_INITDB_ARGS
        value: "--no-sync"
      - name: POSTGRES_HOST_AUTH_METHOD
        value: "scram-sha-256"

    # Runtime image — official Postgres 15 on Alpine
    image:
      registry: registry-1.docker.io
      repository: library/postgres
      tag: 15.13-alpine3.20
      imagePullPolicy: IfNotPresent

    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      enabled: true
      privileged: false
      runAsUser: 1001
      runAsGroup: 1001
      seccompProfile:
        type: RuntimeDefault
      readOnlyRootFilesystem: true
      runAsNonRoot: true

    podSecurityContext:
      enabled: true
      fsGroup: 1001
      fsGroupChangePolicy: OnRootMismatch

    # Chart default is 15s delay + 15 * 10s = 165s before the startup probe
    # gives up and the kubelet kills the container. initdb only needs a few
    # seconds against local storage, but nfs-csi write latency is not
    # bounded the same way — and a kill mid-initdb leaves a data directory
    # Postgres can never repair on its own: initdb does not resume, so a
    # replay against a half-written PGDATA fails the same way forever
    # ("could not open file global/pg_filenode.map"), on every restart,
    # until the PVC is wiped by hand. Wider headroom does not change
    # anything on the common path — initdb still finishes in seconds — it
    # only changes what happens the one time it does not.
    #
    # livenessProbe and readinessProbe need the same widening, not just
    # startupProbe. Kubernetes only evaluates liveness/readiness after
    # startupProbe has succeeded once — and the official postgres image
    # runs a temporary internal server during first-time init to execute
    # init scripts, satisfying pg_isready and activating liveness early,
    # then stops that server and restarts into the real one. Liveness's
    # chart-default 15s + 6*10s = 75s budget can then kill the container
    # during that restart/setup window, before pg_hba.conf's network rule
    # and the job.users bootstrap job it depends on are ever written — a
    # kill that looked like three unrelated failures (missing catalog
    # file, stale password, missing pg_hba entry) depending on exactly
    # where in that window it landed, when it was really the same
    # interruption each time. Widening only startupProbe left this gap
    # open.
    startupProbe:
      failureThreshold: 60
    livenessProbe:
      failureThreshold: 60
    readinessProbe:
      failureThreshold: 60

    job:
      databases:
        - name: keycloak
          user: keycloak_user
        - name: keycloak_extensions
          user: keycloak_extensions_user
        - name: openfga
          user: openfga_user

    cleanup:
      deletePodsOnSuccess: true
      deletePodsOnSuccessTimeout: 60

    persistence:
      enabled: true

    global:
      ingress:
        enabled: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-{{ .Values.env }}-values
  namespace: gentian-infra-{{ .Values.env }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  values.yaml: |
    persistence:
      size: 1Gi

    resources:
      limits:
        cpu: "4"
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 256Mi
