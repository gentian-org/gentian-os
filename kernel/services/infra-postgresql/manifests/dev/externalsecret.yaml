# =============================================================================
# Shared kernel PostgreSQL — ESO ExternalSecret
#
# Renders all 8 sensitive Helm value paths (postgres superuser password +
# 7 job user passwords) as a single sensitive-values.yaml Helm values file,
# consumed by the InfraData composition Release MR via valuesFrom.secretKeyRef.
#
# The full job.users list (username + connectionLimit + password) is rendered
# here because Helm list-merge replaces the entire array — the plain-values
# ConfigMap must NOT also set job.users.
#
# Source: gentian-os/kernel/database/postgresql
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgresql-sensitive-values
  namespace: gentian-infra-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: postgresql-sensitive-values
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # provider-helm reads this key as a Helm values file (merged last → wins).
        sensitive-values.yaml: |
          postgres:
            password: {{ .postgres_password | quote }}
          job:
            users:
              - username: keycloak_user
                connectionLimit: 100
                password: {{ .keycloak_user_password | quote }}
              - username: keycloak_extensions_user
                connectionLimit: 100
                password: {{ .keycloak_extensions_user_password | quote }}
              - username: selfservice_user
                connectionLimit: 10
                password: {{ .selfservice_user_password | quote }}
              - username: authsession_user
                connectionLimit: 10
                password: {{ .authsession_user_password | quote }}
              - username: guardianmanagementapi_user
                connectionLimit: 100
                password: {{ .guardianmanagementapi_user_password | quote }}
              - username: notificationsapi_user
                connectionLimit: 100
                password: {{ .notificationsapi_user_password | quote }}
              - username: nextcloud_user
                connectionLimit: 100
                password: {{ .nextcloud_user_password | quote }}
              - username: openfga_user
                connectionLimit: 50
                password: {{ .openfga_user_password | quote }}
  data:
    - secretKey: postgres_password
      remoteRef:
        key: gentian-os/kernel/database/postgresql
        property: postgres_password
    - secretKey: keycloak_user_password
      remoteRef:
        key: gentian-os/kernel/database/postgresql
        property: keycloak_user_password
    - secretKey: keycloak_extensions_user_password
      remoteRef:
        key: gentian-os/kernel/database/postgresql
        property: keycloak_extensions_user_password
    - secretKey: selfservice_user_password
      remoteRef:
        key: gentian-os/kernel/database/postgresql
        property: selfservice_user_password
    - secretKey: authsession_user_password
      remoteRef:
        key: gentian-os/kernel/database/postgresql
        property: authsession_user_password
    - secretKey: guardianmanagementapi_user_password
      remoteRef:
        key: gentian-os/kernel/database/postgresql
        property: guardianmanagementapi_user_password
    - secretKey: notificationsapi_user_password
      remoteRef:
        key: gentian-os/kernel/database/postgresql
        property: notificationsapi_user_password
    - secretKey: nextcloud_user_password
      remoteRef:
        key: gentian-os/kernel/apps/nextcloud
        property: db_password
    - secretKey: openfga_user_password
      remoteRef:
        key: gentian-os/kernel/database/postgresql
        property: openfga_user_password
