# Shared kernel Redis — plain values ConfigMaps
#
# Merged by the InfraData Crossplane composition (provider-helm valuesFrom).
# Source of truth: kernel/values/env/{env}.yaml and this template.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-env-values
  namespace: {{ .Values.namespace | default (printf "gentian-infra-%s" .Values.env) }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  values.yaml: |
    replicaCount: 1
    global:
{{- if .Values.storageClass }}
      storageClass: {{ .Values.storageClass }}
{{- end }}
      imagePullSecrets:
        - registry-credentials
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-base-values
  namespace: {{ .Values.namespace | default (printf "gentian-infra-%s" .Values.env) }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  values.yaml: |
    architecture: standalone
    image:
      registry: docker.io
      repository: bitnamilegacy/redis
      tag: 7.4.3-debian-12-r0
      pullPolicy: IfNotPresent
    master:
      podAnnotations:
        reloader.stakater.com/auto: "true"
      containerSecurityContext:
        privileged: false
        readOnlyRootFilesystem: true
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
            - ALL
      count: 1
      persistence:
        enabled: true
    metrics:
      enabled: false
    replica:
      replicaCount: 0
    sentinel:
      enabled: false
    global:
      ingress:
        enabled: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  {{- /* The cluster's own values. On v4 the name carries the stage,
       because one cluster served several; on v5 a cluster has one stage
       and the suffix is dropped (namespace-cleanup.md §2.2), which is
       also what lets the Cluster composition name this ConfigMap in the
       Release's valuesFrom without knowing the stage -- the claim does
       not carry one. */}}
  name: {{ if .Values.namespace }}redis-cluster-values{{ else }}redis-{{ .Values.env }}-values{{ end }}
  namespace: {{ .Values.namespace | default (printf "gentian-infra-%s" .Values.env) }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  values.yaml: |
    auth:
      existingSecret: redis-credentials
      existingSecretPasswordKey: redis-password
    master:
      persistence:
        size: 1Gi
      resources:
        limits:
          cpu: "4"
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 32Mi
