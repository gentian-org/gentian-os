apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-credentials
  namespace: {{ .Values.namespace | default "system-cache" }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: redis-credentials
    creationPolicy: Owner
  data:
    - secretKey: redis-password
      remoteRef:
        key: gentian-os/kernel/cache/redis
        property: auth_password
{{- if .Values.namespace }}
---
# What the operator administers this Redis with.
#
# cache_reconciler.go reads `redis-admin` from the cache namespace by those
# exact three keys -- host, port, password -- to create a per-tenant ACL user
# for every app that asks for a cache. On v4 this Secret was written by
# kernel/services/kernel-admin into platform-kernel, with a stage-qualified
# host; the operator addresses the engine by function now (layout.System) and
# looks for it here, so this is where it has to be.
#
# Rendered only when the namespace is stated, which is v5's signal: on v4 it
# would land in gentian-infra-<env>, where nothing reads it.
#
# The host is the Bitnami chart's master Service: <release>-master. The release
# is named `redis` by the Cluster composition -- stage-less, because a cluster
# has one stage -- so a rename there has to be made here too, and the failure
# would be a Job that cannot resolve the name rather than anything nearer.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-admin
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: redis-admin
    creationPolicy: Owner
    template:
      data:
        host: "redis-master.{{ .Values.namespace }}.svc.cluster.local"
        port: "6379"
        password: "{{ "{{" }} .auth_password }}"
  data:
    - secretKey: auth_password
      remoteRef:
        key: gentian-os/kernel/cache/redis
        property: auth_password
{{- end }}
