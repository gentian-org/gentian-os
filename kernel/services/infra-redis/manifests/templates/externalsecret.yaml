apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-credentials
  namespace: {{ .Values.namespace | default "system-cache" }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: redis-credentials
    creationPolicy: Owner
  data:
    - secretKey: redis-password
      remoteRef:
        key: gentian-os/kernel/cache/redis
        property: auth_password
---
# What the operator administers this Redis with.
#
# cache_reconciler.go reads `redis-admin` from the cache namespace by those
# exact three keys -- host, port, password -- to create a per-tenant ACL user
# for every app that asks for a cache. The operator addresses the engine by
# function (layout.System) and looks for it here.
#
# The host is the chart's master Service: <release>-master. The release
# is named `redis` by the Cluster composition -- stage-less, because a cluster
# has one stage -- so a rename there has to be made here too, and the failure
# would be a Job that cannot resolve the name rather than anything nearer.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-admin
  namespace: {{ .Values.namespace | default "system-cache" }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: redis-admin
    creationPolicy: Owner
    template:
      data:
        host: "redis-master.{{ .Values.namespace | default "system-cache" }}.svc.cluster.local"
        port: "6379"
        password: "{{ "{{" }} .auth_password }}"
  data:
    - secretKey: auth_password
      remoteRef:
        key: gentian-os/kernel/cache/redis
        property: auth_password
