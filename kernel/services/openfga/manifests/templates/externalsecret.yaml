# OpenFGA's credentials, as the keys the chart reads by name: the datastore
# URI under `uri` (datastore.uriSecret) and the preshared API key under
# `keys` (authn.preshared.keysSecret). Plain keys, not a Helm-values blob --
# Argo CD renders the chart from git and reads no Secret, so a credential
# reaches the pod only by secretKeyRef.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openfga-credentials
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: openfga-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        uri: '{{ "{{" }} printf "postgres://openfga_user:%s@{{ .Values.dbHost | default "kernel-postgres-rw.kernel-data.svc.cluster.local" }}:5432/openfga?sslmode=require" .openfga_user_password }}'
        # One key per service, so one can be replaced without the others.
        # OpenFGA cannot tell them apart: each still reads and writes.
        keys: '{{ "{{" }} .preshared_key }},{{ "{{" }} .director_key }},{{ "{{" }} .bouncer_key }},{{ "{{" }} .usher_key }},{{ "{{" }} .registrar_key }},{{ "{{" }} .custodian_key }}'
  data:
    - secretKey: openfga_user_password
      remoteRef:
        key: gentian-os/kernel/database/postgresql
        property: openfga_user_password
    - secretKey: preshared_key
      remoteRef:
        key: gentian-os/kernel/authz/openfga
        property: preshared_key
    - secretKey: director_key
      remoteRef:
        key: gentian-os/kernel/authz/openfga
        property: director_key
    - secretKey: bouncer_key
      remoteRef:
        key: gentian-os/kernel/authz/openfga
        property: bouncer_key
    - secretKey: usher_key
      remoteRef:
        key: gentian-os/kernel/authz/openfga
        property: usher_key
    - secretKey: registrar_key
      remoteRef:
        key: gentian-os/kernel/authz/openfga
        property: registrar_key
    - secretKey: custodian_key
      remoteRef:
        key: gentian-os/kernel/authz/openfga
        property: custodian_key
