# env is supplied by the ApplicationSet (helm.parameters). The default
# only matters for `helm template` run by hand.
env: dev
# The database host: kernel-postgres in kernel-data. Goes into the datastore
# URI the ExternalSecret builds.
dbHost: ""   # empty: kernel-postgres-rw.kernel-data.svc.cluster.local

# The openfga chart's values (charts/openfga-0.3.10.tgz). What used to be
# the openfga-base-values ConfigMap a Crossplane Release merged.
openfga:
  # OpenFGA reads its preshared keys once, at start. A release that adds a key
  # for a service restarts it, or that service gets 401 from a key the Secret
  # already holds.
  annotations:
    secret.reloader.stakater.com/reload: openfga-credentials
  replicaCount: 1
  postgresql:
    enabled: false
  mysql:
    enabled: false
  datastore:
    engine: postgres
    # The URI, credential included, under the key `uri` of this Secret
    # (templates/externalsecret.yaml); the chart reads it into
    # OPENFGA_DATASTORE_URI by secretKeyRef.
    uriSecret: openfga-credentials
    # The pool stays warm: a desktop's tiles are one batch of checks that
    # fans out into hundreds of queries, and opening a connection per query
    # after an idle spell costs more than the query.
    maxOpenConns: 30
    maxIdleConns: 30
    connMaxIdleTime: 5m
    connMaxLifetime: 30m
    applyMigrations: true
    # initContainer runs `openfga migrate` before the server starts. waitForMigrations
    # must stay true — the chart only renders initContainers when it is true (job
    # waiter is gated separately on migrationType=job).
    migrationType: initContainer
    waitForMigrations: true
  # A batch of checks answered within this, OpenFGA's default 3s being too
  # short for a desktop's tiles on a slow datastore. The callers' own clients
  # wait longer than this (internal/director/authz/authz.go).
  requestTimeout: 10s
  grpc:
    enabled: true
  telemetry:
    trace:
      enabled: false
    metrics:
      enabled: false
  authn:
    method: preshared
    preshared:
      # The key under `keys` of this Secret, read into
      # OPENFGA_AUTHN_PRESHARED_KEYS by secretKeyRef.
      keysSecret: openfga-credentials
  # Chart 0.3.x enables playground by default; v1.18+ panics if authn != none.
  playground:
    enabled: false
  ingress:
    enabled: false
  # AuthZEN evaluation API (experimental) — required when portal BFF uses OPENFGA_AUTHZEN_ENABLED.
  # Helm chart values.schema.json does not yet allow experimentals: [authzen]; use env instead.
  extraEnvVars:
    - name: OPENFGA_EXPERIMENTALS
      value: authzen
    # The cache of raw entries a check reads, beside the cache of answers
    # (checkQueryCache). Both serve only a request that asks for the fastest
    # answer (consistency MINIMIZE_LATENCY): the desktop's tiles and the
    # access pages. Every other check asks HIGHER_CONSISTENCY and reads the
    # store as it is (internal/openfga, WithFastAnswer). The cache controller
    # drops cached entries once the store changed.
    - name: OPENFGA_CHECK_ITERATOR_CACHE_ENABLED
      value: "true"
    - name: OPENFGA_CHECK_ITERATOR_CACHE_TTL
      value: 10s
    - name: OPENFGA_CACHE_CONTROLLER_ENABLED
      value: "true"
  checkQueryCache:
    enabled: true
    ttl: 10s
  # A desktop's tiles are one batch of checks that fans out into hundreds of
  # dispatches at once; one CPU throttled it to seconds.
  resources:
    requests:
      cpu: 250m
      memory: 128Mi
    limits:
      cpu: "4"
      memory: 512Mi
