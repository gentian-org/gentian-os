# OpenFGA sensitive Helm values — Postgres URI + preshared API token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openfga-sensitive-values
  namespace: platform-kernel
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: openfga-sensitive-values
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        sensitive-values.yaml: |
          datastore:
            uri: {{ printf "postgres://openfga_user:%s@gentian-postgresql-dev.gentian-infra-dev.svc.cluster.local:5432/openfga?sslmode=disable" .openfga_user_password }}
          authn:
            preshared:
              keys:
                - {{ .preshared_key | quote }}
  data:
    - secretKey: openfga_user_password
      remoteRef:
        key: gentian-os/kernel/database/postgresql
        property: openfga_user_password
    - secretKey: preshared_key
      remoteRef:
        key: gentian-os/kernel/authz/openfga
        property: preshared_key
