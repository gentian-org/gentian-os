# Gateway mode disables chart Ingress (Envoy HTTPRoute is reconciled by gentian-os).
# The intercom chart sets BASE_URL from ingress.host when ingress.enabled=true; when
# false it falls back to http://intercom-service-<env>:8008. Browser OIDC silent login
# (Nordeck Element banner, Jitsi portal session refresh) needs the public ICS origin.
#
# extraEnvVars below override the chart-generated intercom-service-* Secret (envFrom)
# so ICS silent login and navigation.json use https://ics.<kernel>. Keep host in sync
# with global.domain in _base.yaml / KERNEL_DOMAIN.
ingress:
  enabled: false

extraEnvVars:
  - name: REDIS_USER
    value: default
  - name: NODE_EXTRA_CA_CERTS
    value: /opt/staging-ca/node-extra-ca.crt
  # BASE_URL / INTERCOM_URL come from intercom-gateway-values ConfigMap (valuesFrom,
  # merged last in kernel/appsets/20-iam.yaml). install.sh/update.sh render that
  # ConfigMap from KERNEL_DOMAIN and run verify_intercom_ics — do not hardcode the
  # kernel domain here or other clusters regress to in-cluster BASE_URL flicker.
