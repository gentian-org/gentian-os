# intercom-service dev — secrets + env-specific values (app defaults in _base.yaml)
# All credentials removed — intercom-service reads from the intercom-credentials Secret
# provisioned by ExternalSecret (ESO → OpenBao → gentian/dev/intercom.*).

# Provisioning keycloak connection (env-specific; provisioning.enabled: false but chart requires these)
provisioning:
  config:
    keycloak:
      connection:
        host: nubus-dev-keycloak
      auth:
        existingSecret:
          name: nubus-dev-keycloak-credentials
          keyMapping:
            password: adminPassword

# ACME staging: id.<kernel> uses LE staging certs; Node OIDC discovery needs the
# gentian-staging-ca-tls bundle (see docs/design/security.md §9.1).
extraVolumes:
  - name: gentian-staging-ca
    secret:
      secretName: gentian-staging-ca-tls
      defaultMode: 0444
extraVolumeMounts:
  - name: gentian-staging-ca
    mountPath: /opt/staging-ca
    readOnly: true

ics:
  logLevel: DEBUG
  session:
    existingSecret:
      name: intercom-credentials
      keyMapping:
        secret: session-secret
  oidc:
    existingSecret:
      name: intercom-credentials
      keyMapping:
        clientSecret: oidc-client-secret
  matrix:
    auth:
      existingSecret:
        name: intercom-credentials
        keyMapping:
          password: matrix-as-token
  portal:
    auth:
      existingSecret:
        name: intercom-credentials
        keyMapping:
          sharedSecret: portal-shared-secret
  redis:
    # Use the master Service (stable ClusterIP DNS), not headless — intercom fails
    # silently when Redis DNS is not yet resolvable at pod start (Element Nordeck loop).
    host: redis-dev-master.gentian-infra-dev.svc.cluster.local
    auth:
      existingSecret:
        name: intercom-credentials
        keyMapping:
          password: redis-auth-password
resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi
