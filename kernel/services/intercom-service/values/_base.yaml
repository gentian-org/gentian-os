# =============================================================================
# Intercom Service app-level defaults (all environments)
# =============================================================================
# Layer 2. {env}/values.yaml provides:
#   ics.session.secret, ics.oidc.clientSecret,
#   ics.matrix.auth.applicationServiceSecret, ics.portal.auth.sharedSecret,
#   ics.redis.host (env-specific hostname), ics.redis.auth.password,
#   provisioning.config.keycloak.intraCluster.internalBaseUrl (env-specific),
#   resources
# =============================================================================

# NOTE: Provisioning of the intercom OIDC client is disabled here because
# opendesk-keycloak-bootstrap creates it with proper claims configuration.

# Container Security Context
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  enabled: true
  privileged: false
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
  readOnlyRootFilesystem: true
  runAsNonRoot: true

# Extra environment variables
extraEnvVars:
  - name: REDIS_USER
    value: default

# Global settings
global:
  domain: desk.gentian.org
  hosts:
    keycloak: id
    intercomService: ics
    synapse: matrix
    matrixNeoDateFixBot: matrix-neodatefix-bot
    openxchange: webmail
    xwiki: wiki
    nextcloud: files
    nubus: portal
  # imagePullSecrets from values/env/{env}.yaml via global.imagePullSecrets

# ICS core configuration (secrets overridden in {env}/values.yaml)
ics:
  issuerBaseUrl: https://id.desk.gentian.org/realms/kernel
  originRegex: desk.gentian.org
  enableSessionCookie: true
  userUniqueMapper: opendesk_username
  usernameClaim: opendesk_username
  logLevel: INFO
  keycloak:
    realm: kernel
  default:
    domain: desk.gentian.org
  oidc:
    id: opendesk-intercom
    # clientSecret overridden in {env}/values.yaml
  matrix:
    subdomain: matrix
    serverName: matrix.desk.gentian.org
    # auth.applicationServiceSecret overridden in {env}/values.yaml
  nordeck:
    subdomain: matrix-neodatefix-bot
  portal:
    # auth.sharedSecret overridden in {env}/values.yaml
  redis:
    port: 6379
    # host (env DNS) and auth.password overridden in {env}/values.yaml
  openxchange:
    oci: true
    url: https://webmail.desk.gentian.org
    audience: opendesk-oxappsuite
  xwiki:
    subdomain: wiki
    audience: opendesk-xwiki
  nextcloud:
    origin: files
    subdomain: files
    audience: opendesk-nextcloud

# Container image
image:
  imagePullPolicy: IfNotPresent
  registry: registry.opencode.de
  repository: bmi/opendesk/components/supplier/univention/images-mirror/intercom-service
  tag: 2.19.5

# Ingress
ingress:
  enabled: true
  ingressClassName: public
  host: ics.desk.gentian.org
  tls:
    enabled: true
    secretName: "wildcard-tls"
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"

# Pod annotations
podAnnotations: {}

# Pod Security Context
podSecurityContext:
  enabled: true
  fsGroup: 1000
  fsGroupChangePolicy: Always

# Provisioning disabled — keycloak-bootstrap handles intercom client creation.
# NOTE: the chart template unconditionally calls `required` on keycloak.auth,
# so we point provisioning at the existing admin secret even when disabled.
# connection.host and auth.existingSecret.name are env-specific (nubus-{env}-keycloak);
# see values/{env}/values.yaml.
provisioning:
  enabled: false
  config:
    clientBaseUrl: https://ics.desk.gentian.org
    keycloak:
      realm: kernel
      connection:
        protocol: http
        # host: env-specific (nubus-{env}-keycloak), defined in values/{env}/values.yaml
        port: 8080
      auth:
        username: admin
        # existingSecret.name: env-specific, defined in values/{env}/values.yaml
        key: adminPassword

# Replicas
replicaCount: 1
