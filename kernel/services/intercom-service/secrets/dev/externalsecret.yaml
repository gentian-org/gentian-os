apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: intercom-credentials
  namespace: gentian-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: intercom-credentials
    creationPolicy: Owner
  data:
    - secretKey: session-secret
      remoteRef:
        key: gentian-os/kernel/identity/intercom
        property: session_secret
    - secretKey: oidc-client-secret
      remoteRef:
        key: gentian-os/kernel/identity/intercom
        property: oidc_client_secret
    - secretKey: matrix-as-token
      remoteRef:
        key: gentian-os/kernel/identity/intercom
        property: matrix_as_token
    - secretKey: portal-shared-secret
      remoteRef:
        key: gentian-os/kernel/identity/intercom
        property: portal_shared_secret
    - secretKey: redis-auth-password
      remoteRef:
        key: gentian-os/kernel/identity/intercom
        property: redis_auth_password
