# =============================================================================
# MariaDB: grant openxchange_user global privileges (ArgoCD PostSync hook)
#
# OX App Suite creates per-context databases named PRIMARYDB_N dynamically
# at runtime. The MariaDB chart's job.databases only grants per-named-database
# privileges — it cannot grant CREATE DATABASE globally.
#
# This PostSync Job runs after every successful sync and grants
# ALL PRIVILEGES ON *.* to openxchange_user, making it idempotent and
# resilient to MariaDB reinstalls.
# =============================================================================
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mariadb-grant-openxchange
  namespace: gentian-infra-dev
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 120
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: grant
          image: docker.io/mariadb:11.1.2-jammy
          command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "Waiting for MariaDB to be ready..."
              until mariadb \
                --host=opendesk-mariadb-dev \
                --user=root \
                --password="${ROOT_PASSWORD}" \
                --connect-timeout=3 \
                -e "SELECT 1" >/dev/null 2>&1; do
                echo "MariaDB not ready yet, retrying in 5s..."
                sleep 5
              done
              echo "MariaDB is ready. Applying global grant..."
              mariadb \
                --host=opendesk-mariadb-dev \
                --user=root \
                --password="${ROOT_PASSWORD}" \
                -e "GRANT ALL PRIVILEGES ON *.* TO 'openxchange_user'@'%' WITH GRANT OPTION; FLUSH PRIVILEGES;"
              echo "Grant applied successfully."
          env:
            - name: ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opendesk-mariadb-dev
                  key: rootPassword
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
            runAsNonRoot: false   # mariadb client binary requires uid 0 in some images
      securityContext:
        seccompProfile:
          type: RuntimeDefault
