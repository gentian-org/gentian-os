# =============================================================================
# Shared kernel MariaDB — plain values ConfigMaps
#
# Two ConfigMaps merged by the InfraData Crossplane composition (provider-helm
# valuesFrom) before the sensitive-values Secret:
#   1. mariadb-base-values  — non-secret defaults for all environments
#   2. mariadb-{{ .Values.env }}-values   — env-specific sizing and non-secret overrides
#
# DO NOT put any secret values here.  All passwords come from the
# mariadb-sensitive-values Secret (see externalsecret.yaml).
#
# job.users is intentionally omitted (only username + connectionLimit, no
# password): the sensitive-values.yaml template renders the complete list.
# mariadb.rootPassword.value placeholder is overridden by sensitive-values.
# =============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mariadb-base-values
  namespace: {{ .Values.namespace | default "system-mariadb" }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  values.yaml: |
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      enabled: true
      privileged: false
      runAsUser: 1001
      runAsGroup: 1001
      seccompProfile:
        type: RuntimeDefault
      readOnlyRootFilesystem: true
      runAsNonRoot: true

    podSecurityContext:
      enabled: true
      fsGroup: 1001
      fsGroupChangePolicy: OnRootMismatch

    # TLS is offered and not required: an app's client that does not ask for
    # it still connects.
    mariadb:
      configuration: |
        [mysqld]
        ssl_cert=/etc/mysql/tls/tls.crt
        ssl_key=/etc/mysql/tls/tls.key
        ssl_ca=/etc/mysql/tls/ca.crt

    extraVolumes:
      - name: tls
        secret:
          secretName: mariadb-tls
          defaultMode: 0440

    extraVolumeMounts:
      - name: tls
        mountPath: /etc/mysql/tls
        readOnly: true

    job:
      enabled: false

    cleanup:
      deletePodsOnSuccess: true
      deletePodsOnSuccessTimeout: 60

    persistence:
      enabled: true

    global:
      ingress:
        enabled: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  {{- /* The cluster's own values. On v4 the name carries the stage,
       because one cluster served several; on v5 a cluster has one stage
       and the suffix is dropped (namespace-cleanup.md §2.2), which is
       also what lets the Cluster composition name this ConfigMap in the
       Release's valuesFrom without knowing the stage -- the claim does
       not carry one. */}}
  name: {{ if .Values.namespace }}mariadb-cluster-values{{ else }}mariadb-{{ .Values.env }}-values{{ end }}
  namespace: {{ .Values.namespace | default "system-mariadb" }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  values.yaml: |
    persistence:
      size: 1Gi

    resources:
      limits:
        cpu: "4"
        memory: 2Gi
      requests:
        cpu: 100m
        memory: 384Mi
