# =============================================================================
# Shared kernel MariaDB — ESO ExternalSecret
#
# Renders the root password as sensitive-values.yaml for the InfraData
# composition Release MR via valuesFrom.secretKeyRef.
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mariadb-sensitive-values
  namespace: {{ .Values.namespace | default "system-mariadb" }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: mariadb-sensitive-values
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        sensitive-values.yaml: |
          mariadb:
            rootPassword:
              value: {{ "{{" }} .root_password | quote }}
  data:
    - secretKey: root_password
      remoteRef:
        key: gentian-os/kernel/database/mariadb
        property: root_password
{{- if .Values.namespace }}
---
# What the operator administers this MariaDB with.
#
# mariadb_reconciler.go reads `mariadb-admin` from the mariadb namespace by
# four keys -- host, port, username, password -- to create a database and a
# user for every app that asks for one. On v4 kernel-admin wrote it into
# platform-kernel with a stage-qualified host; the operator addresses the
# engine by function now and looks for it here.
#
# The host must equal what tenant_data_plane_manifests.go builds when it seeds
# an app's credentials: "mariadb.<mariadb namespace>". Two spellings of the
# same address is how an app gets a credential for a host its Job never
# reached.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mariadb-admin
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: mariadb-admin
    creationPolicy: Owner
    template:
      data:
        host: "mariadb.{{ .Values.namespace }}.svc.cluster.local"
        port: "3306"
        username: "root"
        password: "{{ "{{" }} .root_password }}"
  data:
    - secretKey: root_password
      remoteRef:
        key: gentian-os/kernel/database/mariadb
        property: root_password
{{- end }}
