{{- /*
  The shared MariaDB's server certificate, issued by the cluster's internal CA
  (the ClusterIssuer gentian-ca). The server reads it at start.
*/ -}}
{{- $ns := .Values.namespace | default "system-mariadb" }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mariadb
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: mariadb-tls
  commonName: mariadb.{{ $ns }}.svc.cluster.local
  dnsNames:
    - mariadb.{{ $ns }}.svc
    - mariadb.{{ $ns }}.svc.cluster.local
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - digital signature
    - server auth
  issuerRef:
    name: gentian-ca
    kind: ClusterIssuer
