{{- /*
  Who may open a connection to MariaDB.

  The server took a connection from any pod of any namespace without an
  egress policy of its own, and a password was the only thing in the way.
  Now its one port is admitted from:

    tenant namespaces   every namespace labelled gentianos.io/tier=tenant.
                        The server cannot tell one tenant's app from another's
                        pod; the tenant's side narrows it, where egress is
                        denied by default (tenant-isolation) and
                        kernel-access-<app> opens this port for an app that
                        declared MariaDB alone. This rule keeps out everything
                        that is not a tenant namespace or a client named here;
                        that one keeps out the apps that asked for no MariaDB.
    this namespace      the operator's setup and destroy Jobs run beside the
                        server (mariadb_reconciler.go, backup/teardown.go) and
                        carry no pod label to select on; so do mariadb-dump
                        and the load of an export and a restore, which run
                        here because the administrator's Secret is here
                        (tenantexport_placement.go). A pod here can mount
                        the root Secret, so naming pods would keep nobody out.

  The pod declares no other port. The kubelet's probes are exec probes.

  Rendered on the v5 layout only (a namespace is stated), with the admin
  Secret beside it. Sync wave -1, with the values the release is installed
  from: the release cannot start a pod before this object exists.
*/ -}}
{{- if and .Values.namespace (ne (toString .Values.networkPolicy.enabled) "false") }}
{{- $np := .Values.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: store-ingress
  namespace: {{ .Values.namespace }}
  labels:
    gentianos.io/tier: system
    gentianos.io/function: mariadb
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mariadb
      app.kubernetes.io/instance: mariadb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              gentianos.io/tier: tenant
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ $np.ports.mariadb }}
{{- end }}
