# env is supplied by the ApplicationSet (helm.parameters). The default
# only matters for `helm template` run by hand.
env: dev
# storageClass empty = use the cluster's default StorageClass. Set per
# stage in values-<env>.yaml only where a stage genuinely differs.
storageClass: ""

# Where these objects go.
#
# Empty keeps the v4 answer, gentian-infra-<env>, which is the namespace that
# layout's ApplicationSet targets. v5 passes the system-tier namespace the
# Cluster claim composed -- one namespace per engine, so a quota, a backup
# policy and a network policy can differ per engine without separating a
# stateful service after the fact (namespace-cleanup.md §2.2).
namespace: ""

# Who may open a connection to the server's pods (templates/networkpolicy.yaml).
# On by default; needs a CNI that enforces NetworkPolicy, and has no effect on
# one that does not. Off removes the policy and leaves the passwords as the
# only check. The data-plane ApplicationSet passes `enabled` and the
# namespaces from the layout; the values here are what a `helm template` run
# by hand gets.
networkPolicy:
  enabled: true
  ports:
    # The port apps are handed (provisioner.MariaDBPort).
    mariadb: 3306
  namespaces:
    s3: system-s3
