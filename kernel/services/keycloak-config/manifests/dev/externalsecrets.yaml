---
# ExternalSecret: Keycloak admin credentials for provider-keycloak ProviderConfig.
#
# Creates keycloak-provider-creds in crossplane-system, consumed by the
# ProviderConfig in providerconfig.yaml.  The admin password is fetched from
# OpenBao and embedded in a JSON blob parsed by the mrparkers/keycloak TF
# provider bridge at reconcile time.
#
# Wave 0: applied before ProviderConfig (wave 1) and all managed resources.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-provider-creds
  namespace: crossplane-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: keycloak-provider-creds
    creationPolicy: Owner
    template:
      data:
        # JSON credentials blob consumed by provider-keycloak (mrparkers format).
        # No base_path: Keycloak 17+ (Quarkus) uses "" as default base path.
        credentials: '{{ printf "{\"client_id\":\"admin-cli\",\"username\":\"kcadmin\",\"password\":\"%s\",\"url\":\"http://nubus-dev-keycloak.gentian-dev.svc.cluster.local:8080\",\"realm\":\"master\"}" .admin_password }}'
  data:
    - secretKey: admin_password
      remoteRef:
        key: gentian-os/kernel/identity/keycloak-bootstrap
        property: admin_password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# ExternalSecret: OIDC client secrets for the four opendesk Keycloak clients.
#
# Each app stores its OIDC client secret at its own OpenBao path, seeded by
# seed-openbao.sh during cluster bootstrap.  This ExternalSecret aggregates
# all four secrets into a single K8s Secret (keycloak-client-secrets) that
# each Client CR references via clientSecretSecretRef.
#
# Wave 0: applied before Client managed resources.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-client-secrets
  namespace: crossplane-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: keycloak-client-secrets
    creationPolicy: Owner
  data:
    - secretKey: intercom_client_secret
      remoteRef:
        key: gentian-os/kernel/identity/intercom
        property: oidc_client_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: nextcloud_client_secret
      remoteRef:
        key: gentian-os/kernel/apps/nextcloud
        property: oidc_client_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: ox_client_secret
      remoteRef:
        key: gentian-os/kernel/apps/ox
        property: oidc_client_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: dovecot_client_secret
      remoteRef:
        key: gentian-os/kernel/mail/dovecot
        property: oidc_client_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
