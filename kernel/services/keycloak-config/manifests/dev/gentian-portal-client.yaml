---
# Gentian shell OIDC client (kernel realm, Stage 1 Suze path).
# Public client + PKCE — no client secret; the SPA exchanges the auth code directly.
#
# Redirect URIs use desk.gentian.org as the default dev kernel domain. On other
# clusters, install.sh Step 16 also ensures the client via Keycloak Admin API with
# the live KERNEL_DOMAIN.
apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
kind: Client
metadata:
  name: gentian-portal
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  deletionPolicy: Orphan
  forProvider:
    clientId: gentian-portal
    name: Gentian Portal
    realmId: kernel
    accessType: PUBLIC
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    validRedirectUris:
      - "https://portal.desk.gentian.org/login"
      - "https://portal.desk.gentian.org/login/*"
      - "https://portal.desk.gentian.org/*"
    webOrigins:
      - "https://portal.desk.gentian.org"
      - "+"
    validPostLogoutRedirectUris:
      - "https://portal.desk.gentian.org/login"
      - "https://portal.desk.gentian.org/*"
  providerConfigRef:
    name: keycloak
