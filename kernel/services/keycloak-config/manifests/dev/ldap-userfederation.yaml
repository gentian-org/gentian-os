---
# =============================================================================
# ldap-userfederation.yaml — Kernel realm LDAP user federation (Crossplane import)
# =============================================================================
#
# Imports the existing ldap-provider component from the kernel realm using
# crossplane.io/external-name so Crossplane manages the resource instead of
# creating a duplicate.
#
# Key changes from the nubus-bootstrap default:
#   - usersDn:                dc=swp-ldap,dc=internal   (was cn=users,...)
#   - searchScope:            "2" SUBTREE                (was "1" ONE_LEVEL)
#   - usernameLdapAttribute:  mailPrimaryAddress         (was uid)
#   - customUserSearchFilter: (mailPrimaryAddress=*)     (was (uid=*))
#
# Effect: Keycloak kernel realm now discovers users in every tenant OU
# (ou=users,ou={tenant},dc=swp-ldap,dc=internal) in addition to the kernel
# cn=users tree.  Service accounts that lack mailPrimaryAddress are excluded by
# the filter.  Tenant users authenticate at the shared portal
# (portal.desk.gentian.org) using their email address as username; the
# per-tenant UMC continues to use the tenant realm unchanged.
# =============================================================================

apiVersion: ldap.keycloak.crossplane.io/v1alpha1
kind: UserFederation
metadata:
  name: kernel-ldap-provider
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    # Import the pre-existing Keycloak component; Crossplane will manage it
    # without recreating it.  ID is stable for the lifetime of this cluster.
    crossplane.io/external-name: "kernel/4yXN52HhS76zcV4zCbaquA"
spec:
  deletionPolicy: Orphan
  # deleteDefaultMappers is ForceNew in the TF provider.  Setting it here in
  # initProvider means it is only applied at resource creation time and won't
  # cause a ForceNew diff when Crossplane imports the pre-existing federation.
  initProvider:
    deleteDefaultMappers: false
  forProvider:
    realmId: kernel
    name: ldap-provider
    connectionUrl: "ldap://nubus-dev-ldap-server:389"
    bindDn: "uid=ldapsearch_keycloak,cn=users,dc=swp-ldap,dc=internal"
    bindCredentialSecretRef:
      name: keycloak-ldap-bind-credentials
      namespace: crossplane-system
      key: password

    # ── Search scope ─────────────────────────────────────────────────────────
    # SUBTREE (2) so tenant OUs under dc=swp-ldap,dc=internal are included.
    usersDn: "dc=swp-ldap,dc=internal"
    searchScope: "2"

    # ── Username attribute ────────────────────────────────────────────────────
    # mailPrimaryAddress is unique across all tenants and is present on every
    # real user.  Service accounts lack it → excluded by customUserSearchFilter.
    usernameLdapAttribute: mailPrimaryAddress
    rdnLdapAttribute: uid
    uuidLdapAttribute: entryUUID
    userObjectClasses:
      - person
    customUserSearchFilter: "(mailPrimaryAddress=*)"

    # ── Write mode ────────────────────────────────────────────────────────────
    editMode: READ_ONLY
    vendor: other
    syncRegistrations: false

    # ── Connection / sync settings (preserve bootstrap defaults) ─────────────
    enabled: true
    importEnabled: true
    pagination: true
    connectionPooling: true
    batchSizeForSync: 1000
    fullSyncPeriod: -1
    changedSyncPeriod: -1
    priority: 0
    trustEmail: false
    startTls: false
    usePasswordModifyExtendedOp: true
    useTruststoreSpi: never
    validatePasswordPolicy: false
    debug: "false"

    # ── Cache ─────────────────────────────────────────────────────────────────
    cache:
      - policy: MAX_LIFESPAN

  providerConfigRef:
    name: keycloak
