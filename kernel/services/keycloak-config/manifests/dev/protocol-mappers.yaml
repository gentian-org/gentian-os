# ── Intercom — audience (self-trust for token exchange) ──────────────────────
# Adds opendesk-intercom as an audience in intercom's own access tokens.
# Required so the ICS backend can validate tokens issued for this client.
apiVersion: client.keycloak.crossplane.io/v1alpha1
kind: ProtocolMapper
metadata:
  name: intercom-audience
  annotations:
    crossplane.io/external-name: "opendesk/client/1f210642-7d2e-41b6-95a2-fbb59a0434c3/b186a9a2-3cce-4a59-b20d-634f37d307bd"
    argocd.argoproj.io/sync-wave: "11"
spec:
  deletionPolicy: Orphan
  forProvider:
    realmId: opendesk
    clientId: 1f210642-7d2e-41b6-95a2-fbb59a0434c3
    name: opendesk-intercom-audience
    protocol: openid-connect
    protocolMapper: oidc-audience-mapper
    config:
      included.client.audience: opendesk-intercom
      id.token.claim: "false"
      access.token.claim: "true"
  providerConfigRef:
    name: keycloak
---
