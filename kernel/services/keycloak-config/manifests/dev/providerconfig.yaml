---
# ProviderConfig for provider-keycloak (dev environment).
#
# This is env-scoped because the Keycloak URL includes the environment name.
# Credentials come from the keycloak-provider-creds Secret created by the
# ExternalSecret in externalsecrets.yaml.
#
# The JSON credentials blob is parsed by the Upjet/mrparkers bridge:
#   client_id, username, password, url, realm
# No base_path: Keycloak 17+ (Quarkus distribution) has "" as default.
#
# Wave 1: applied after the ESO ExternalSecret (wave 0) so the Secret exists
#         before any provider-keycloak managed resource reconciles.
apiVersion: keycloak.crossplane.io/v1beta1
kind: ProviderConfig
metadata:
  name: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: keycloak-provider-creds
      key: credentials
