# ExternalSecret: Keycloak admin credentials for provider-keycloak ProviderConfig.
#
# Wave 0: applied before ProviderConfig (wave 1) and tenant app Client MRs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-provider-creds
  namespace: crossplane-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: keycloak-provider-creds
    creationPolicy: Owner
    template:
      data:
        credentials: |-
          {{- dict "client_id" "admin-cli" "username" "admin"
              "password" .admin_password "realm" "master"
              "url" "http://gentian-idp-keycloak-keycloakx-http.platform-kernel.svc.cluster.local:8080/auth"
            | toJson -}}
  data:
    - secretKey: admin_password
      remoteRef:
        key: gentian-os/kernel/identity/keycloak-bootstrap
        property: admin_password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
