# ExternalSecret: Keycloak admin credentials for provider-keycloak ProviderConfig.
#
# Wave 0: applied before ProviderConfig (wave 1) and tenant app Client MRs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-provider-creds
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: keycloak-provider-creds
    creationPolicy: Owner
    template:
      data:
        credentials: |-
          {{ "{{" }}- dict "client_id" "gentian-operator" "client_secret" .operator_client_secret
              "realm" "master"
              "url" {{ .Values.keycloakUrl | quote }}
            | toJson -}}
  data:
    - secretKey: operator_client_secret
      remoteRef:
        key: gentian-os/kernel/identity/keycloak-bootstrap
        property: operator_client_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
