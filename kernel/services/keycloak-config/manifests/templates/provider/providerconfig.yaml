---
# ProviderConfig for provider-keycloak (dev environment).
#
# Credentials come from keycloak-provider-creds (ExternalSecret in this directory).
# Tenant app Client MRs (app-default composition) reference this ProviderConfig.
apiVersion: keycloak.crossplane.io/v1beta1
kind: ProviderConfig
metadata:
  name: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: keycloak-provider-creds
      key: credentials
