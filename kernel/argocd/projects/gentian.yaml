---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: gentian
  namespace: argocd
spec:
  description: Gentian OpenDesk deployment across all environments

  # Source repositories
  sourceRepos:
  - 'https://github.com/gentian-org/gentian-os'                                                         # OS/infrastructure Git repository
  - 'https://github.com/gentian-org/gentian-apps'                                                       # App store catalogue (AppProfiles)
  - 'https://github.com/gentian-org/gentian-deployments'                                                # Deployment configuration repository
  - 'registry.opencode.de/*'                                                                            # ZenDiS OCI registry (without protocol)
  - 'registry.opencode.de/bmi/opendesk/components/platform-development/charts/opendesk-postgresql'     # PostgreSQL chart
  - 'registry.opencode.de/bmi/opendesk/components/platform-development/charts/opendesk-mariadb'        # MariaDB chart
  - 'registry.opencode.de/bmi/opendesk/components/supplier/univention/charts-mirror'                   # Univention charts (Nubus, Intercom)
  - 'registry.opencode.de/bmi/opendesk/components/platform-development/charts/opendesk-keycloak-bootstrap'  # Keycloak Bootstrap
  - 'registry.opencode.de/bmi/opendesk/components/external/charts/bitnami-charts'                      # Bitnami charts (MinIO, Redis)
  - 'oci://registry.opencode.de/*'                                                                      # ZenDiS OCI registry (with protocol)
  - 'oci://registry.opencode.de/bmi/opendesk/*'                                                         # All OpenDesk paths with OCI
  - 'oci://registry.opencode.de/bmi/opendesk/components/platform-development/*'                        # OpenDesk platform-development path
  - 'oci://registry.opencode.de/bmi/opendesk/components/supplier/univention/*'                         # Univention path
  - 'oci://registry.opencode.de/bmi/opendesk/components/supplier/univention/charts-mirror'             # Univention charts-mirror specifically
  - 'oci://registry-1.docker.io/*'                                                                      # Docker Hub OCI registry
  - 'oci://registry-1.docker.io/bitnamicharts/*'                                                        # Bitnami charts specifically
  - 'registry-1.docker.io/bitnamicharts'                                                                # Bitnami charts (without protocol)
  - 'https://openbao.github.io/openbao-helm'                                                            # OpenBao Helm chart repo
  - 'ghcr.io/flux-iac/charts'  # flux-iac OCI charts registry (Tofu Controller Helm chart)
  - 'ghcr.io/stakater/charts'                                                                           # Stakater OCI charts registry (Reloader)
  - 'ghcr.io/cloudnative-pg/charts'                                                                     # CloudNativePG OCI charts registry

  # Destination clusters and namespaces
  destinations:
  - namespace: 'gentian-*'                   # All gentian namespaces
    server: https://kubernetes.default.svc
  - namespace: 'argocd'                      # ArgoCD namespace for ApplicationSets
    server: https://kubernetes.default.svc
  - namespace: 'openbao'                     # OpenBao secret backend
    server: https://kubernetes.default.svc
  - namespace: 'tofu-system'                 # Tofu Controller workspaces
    server: https://kubernetes.default.svc
  - namespace: 'flux-system'                 # flux-system: Tofu Controller creates runner SA here
    server: https://kubernetes.default.svc
  - namespace: 'stakater-system'             # Stakater Reloader (cluster-wide controller)
    server: https://kubernetes.default.svc
  - namespace: 'gentian-system'              # Gentian OS orchestrator (CRD controllers)
    server: https://kubernetes.default.svc
  - namespace: 'cnpg-system'                 # CloudNativePG operator
    server: https://kubernetes.default.svc
  - namespace: 'platform-kernel'             # Shared CNPG Cluster + psql provisioner Jobs
    server: https://kubernetes.default.svc
  - namespace: 'crossplane-system'           # Crossplane managed resources (provider-http Requests, ESO)
    server: https://kubernetes.default.svc

  # Cluster-scoped resources (allowed at cluster level)
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  - group: 'rbac.authorization.k8s.io'
    kind: ClusterRole
  - group: 'rbac.authorization.k8s.io'
    kind: ClusterRoleBinding
  - group: 'storage.k8s.io'
    kind: StorageClass
  - group: 'apiextensions.k8s.io'
    kind: CustomResourceDefinition
  - group: 'external-secrets.io'
    kind: ClusterSecretStore
  - group: 'gentianos.io'
    kind: Tenant
  - group: 'gentianos.io'
    kind: AppProfile
  - group: 'gentianos.io'
    kind: IntegrationBinding
  - group: 'postgresql.cnpg.io'
    kind: '*'
  - group: 'admissionregistration.k8s.io'
    kind: ValidatingWebhookConfiguration
  - group: 'admissionregistration.k8s.io'
    kind: MutatingWebhookConfiguration

  # Namespace-scoped resources (allow all)
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'

  # Orphaned resources handling
  # warn: false — the cluster uses a dual GitOps+Tofu approach; many resources are
  # intentionally managed by Tofu outside ArgoCD. Warnings would be permanently
  # noisy and mask real health issues (e.g. the openbao ClusterSecretStore going
  # Degraded after a reboot is hidden behind 444 orphan warnings).
  orphanedResources:
    warn: false
    ignore:
    # Nubus runtime-generated resources (created by init jobs/hooks, no Helm tracking labels)
    - kind: ConfigMap
      name: nubus-dev-ldap-server-status
    - kind: Secret
      name: nubus-dev-ecdsa-ca-secret
    - kind: Secret
      name: nubus-dev-guardian-management-api-postgresql-credentials
    - kind: Secret
      name: nubus-dev-portal-consumer-object-storage
    - kind: Secret
      name: nubus-dev-saml-tls
    - kind: Service
      name: ums-keycloak
