---
# Argo CD credentials for the private gentian-corp repository.
#
# Without this secret Argo CD cannot read the repository, so it cannot compare
# desired against live state. It reports
#   ComparisonError: Failed to load target state: ... desc = authentication required
# and the Application sits at sync=Unknown.
#
# Note health can still read Healthy: pods deployed earlier keep running. What is
# lost is reconciliation — drift goes undetected and no change is ever rolled out.
# Nothing is wrong with the manifests.
#
# No credential is committed here, and none should be. Apply it with a PAT that
# has read access to gentian-org/gentian-corp:
#
#   kubectl create secret generic repo-gentian-corp -n argocd \
#     --from-literal=type=git \
#     --from-literal=url=https://github.com/gentian-org/gentian-corp \
#     --from-literal=username=git \
#     --from-literal=password="${GENTIAN_CORP_GIT_TOKEN}" \
#     --dry-run=client -o yaml | \
#     kubectl label --local -f - argocd.argoproj.io/secret-type=repository -o yaml | \
#     kubectl apply -f -
#
# The repository is already an allowed source on the `gentian` AppProject
# (kernel/argocd/projects/gentian.yaml), so no project change is needed.
#
# If gentian-corp is not meant to run on this cluster, the alternative fix is to
# delete the Application rather than grant it a credential — it is applied by
# hand, not by any repo, so nothing will recreate it.
