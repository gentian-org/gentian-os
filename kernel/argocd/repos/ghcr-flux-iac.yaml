---
# ArgoCD Repository registration for ghcr.io/flux-iac OCI Helm charts.
# This is a PUBLIC registry — no credentials required.
# Required for: argocd/bootstrap/tofu-controller-application.yaml
#
# To apply manually (bootstrap step):
#   kubectl apply -f argocd/repos/ghcr-flux-iac.yaml
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-flux-iac
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  enableOCI: "true"
  type: helm
  url: ghcr.io/flux-iac/charts
  name: ghcr-flux-iac
