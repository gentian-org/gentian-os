# Helm values for the Tofu Controller (flux-iac/tofu-controller v0.16.1)
# Only non-default values are listed.
awsPackage:
  install: false   # Not using AWS Terraform modules

# Chart defaults reference Flux's notification controller in the flux-system
# namespace. We don't run Flux, so:
#   - Point eventsAddress at the controller's own service (no-op; events
#     POSTed there are dropped — non-fatal).
#   - Override runner.serviceAccount.allowedNamespaces to an empty list.
#     The chart helper appends .Release.Namespace (tofu-system) automatically,
#     so the runner SA is still created where it's needed; we just stop
#     emitting ServiceAccount/Secret/RoleBinding objects in flux-system.
eventsAddress: http://tofu-controller.tofu-system.svc.cluster.local./
runner:
  serviceAccount:
    allowedNamespaces: []
