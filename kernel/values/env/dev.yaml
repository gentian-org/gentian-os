# =============================================================================
# Cluster-environment defaults for 'dev'
# =============================================================================
#
# Applied as the FIRST Helm values layer for all ApplicationSets targeting
# this environment. Merge order (later wins):
#
#   1. values/env/{env}.yaml          ← this file: cluster-env-wide defaults
#   2. apps/{app}/values/_base.yaml   ← app-level defaults (same across all envs)
#   3. apps/{app}/values/{env}/values.yaml  ← env-specific overrides and secrets
#
# Only place settings here that are:
#   - Uniform across ALL apps in this cluster (not app-specific)
#   - Different between environments (otherwise put in _base.yaml)
#
# When adding 'prod', create values/env/prod.yaml with overrides like:
#   replicaCount: 3
#   storageClass: longhorn
# =============================================================================

# Default replica count for dev (single-replica, no HA)
# Override per-app in _base.yaml if the chart uses a different key
replicaCount: 1

global:
  # storageClass is intentionally unset, for the reason prod.yaml gives at
  # length: this file is read from Git by the ApplicationSets and shared by
  # every cluster on this stage, so naming a class here asserts it exists on
  # all of them. It said nfs-csi, which exists on one developer's cluster and
  # nowhere else -- on a cluster with Cinder, EBS or anything else the PVCs
  # simply sit Pending with `storageclass "nfs-csi" not found`.
  #
  # Unset means "use the cluster's default StorageClass". A cluster that needs
  # a specific non-default class sets storageClass on its own claim, which
  # reaches every chart through resolve_storage_class() in common.sh -- the
  # cluster is what knows which classes it has.
  # Optional private-registry pull secret, replicated into tenant namespaces
  # by the operator's ensureRegistryCredentials if a `registry-credentials`
  # Secret exists in the kernel services namespace (see internal/controller/
  # tenant_controller.go). No such Secret ships by default in gentian-os —
  # a downstream deployment can add one (e.g. via an ExternalSecret dropped
  # into kernel/services/_globals/secrets/{env}/).
  # Bitnami (and most Helm) charts merge global.imagePullSecrets into every pod spec.
  imagePullSecrets:
    - registry-credentials
