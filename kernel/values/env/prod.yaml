# =============================================================================
# Cluster-environment defaults for 'prod'
# =============================================================================
# Mirror of values/env/dev.yaml with production overrides.
# Applied as the FIRST Helm values layer for all ApplicationSets targeting
# this environment. Merge order (later wins):
#
#   1. values/env/{env}.yaml           ← this file
#   2. apps/{app}/values/_base.yaml    ← app-level defaults (same across envs)
#   3. apps/{app}/values/{env}/values.yaml  ← env-specific sizing + existingSecret refs
#
# Production differences from dev:
#   - HA replication counts (replicaCount: 3 where supported)
#   - Larger storage PVC sizes (in per-app values/prod/)
#   - Consider: separate registry-credentials secret per env
# =============================================================================

# Default replica count for prod (HA — override per-app as needed)
replicaCount: 2

global:
  # storageClass is intentionally unset.
  #
  # This file is read from Git by the ApplicationSets, so it is shared by every
  # prod cluster — naming one class here (it used to say "longhorn") asserts
  # that the class exists everywhere, and on a cluster that has Cinder, EBS or
  # anything else the PVCs simply sit Pending with
  # `storageclass "longhorn" not found`.
  #
  # Unset means "use the cluster's default StorageClass", which is what Bitnami
  # charts do with an empty global.storageClass. A cluster that needs a specific
  # non-default class sets STORAGE_CLASS in its cluster-settings.env; see
  # resolve_storage_class() in scripts/lib/common.sh.
  imagePullSecrets:
    - registry-credentials
