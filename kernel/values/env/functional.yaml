# =============================================================================
# Functional Settings Baseline — Gentian Deployment
# =============================================================================
# Single source of truth for behavioral settings. Values here define what we
# intend. They are manually projected into chart-specific _base.yaml files
# (marked with "# functional.yaml: <key>") because ArgoCD/Helm has no template
# layer equivalent to helmfile gotmpl transforms.
#
# DEVIATIONS FROM DEFAULTS (intentional):
#   admin.portal.deploymentTimestamp.enabled  false
#     GitOps mode — avoids a spurious ArgoCD diff on every deploy.
#   portal.linkLegalNotice                    ~
#   portal.linkPrivacyStatement               ~
#   portal.linkDocumentation                  ~
#   portal.linkFeedback                       ~
#     No external links set for this deployment; enable when public-facing.
# =============================================================================
---

# ─────────────────────────────────────────────────────────────────────────────
# Admin
# ─────────────────────────────────────────────────────────────────────────────
admin:
  portal:
    deploymentTimestamp:
      # DEVIATION: false (upstream default: true)
      # GitOps deployments always trigger a new sync when the timestamp changes.
      # Setting to false avoids ArgoCD marking the app OutOfSync on every cycle.
      enabled: false

# ─────────────────────────────────────────────────────────────────────────────
# Authentication / Keycloak
# Wired into: apps/keycloak-bootstrap/values/_base.yaml → config.realmSettings,
#             config.ssoFederation, config.twoFactorSettings
# ─────────────────────────────────────────────────────────────────────────────
authentication:
  newDeviceLoginNotification:
    # Send an email on first login from a new device/browser fingerprint.
    enabled: true

  twoFactor:
    # Groups for which 2FA is enforced. Removing a group here does NOT disable
    # 2FA for existing members — must be unconfigured in Keycloak UI.
    groups:
      - "Domain Admins"

  oidc:
    # Additional OIDC clients beyond the defaults (intercom-service etc.)
    clients: ~
    # Additional client scopes beyond the defaults
    clientScopes: ~

  # Keycloak 'kernel' realm settings.
  # All numeric "Lifespan" values are in seconds.
  # Ref.: https://www.keycloak.org/docs/latest/server_admin
  realmSettings:
    accessTokenLifespan: 300                 # 5 minutes
    revokeRefreshToken: false
    ssoSessionIdleTimeout: 14400             # 4 hours
    ssoSessionMaxLifespan: 57600             # 16 hours
    accessCodeLifespanUserAction: 300
    accessCodeLifespanLogin: 1800            # 30 minutes
    offlineSessionIdleTimeout: 2592000       # 30 days
    offlineSessionMaxLifespanEnabled: false
    offlineSessionMaxLifespan: 5184000       # 60 days (only if above is true)
    clientSessionIdleTimeout: 0              # 0 = use ssoSession* settings
    clientSessionMaxLifespan: 0
    clientOfflineSessionIdleTimeout: 0
    clientOfflineSessionMaxLifespan: 0

  ssoFederation:
    # External OIDC IdP for federated login. Disabled for this deployment.
    enabled: false
    enforceFederatedLogin: false
    name: "My upstream IdP"
    idpDetails: {}

# ─────────────────────────────────────────────────────────────────────────────
# Chat (Element / Synapse)
# ─────────────────────────────────────────────────────────────────────────────
chat:
  matrix:
    profile:
      # Allow users to change their own Matrix display name.
      allowUsersToUpdateDisplayname: true
      # Use immutable identifiers for the Matrix ID localpart when enabled.
      useImmutableIdentifierForLocalpart: false

# ─────────────────────────────────────────────────────────────────────────────
# Data Protection
# ─────────────────────────────────────────────────────────────────────────────
dataProtection:
  matrixPresence:
    # Share user presence status (online/offline) with contacts.
    enabled: false
  jitsiRoomHistory:
    # Store room history in browser local storage.
    enabled: true

# ─────────────────────────────────────────────────────────────────────────────
# External Services
# ─────────────────────────────────────────────────────────────────────────────
externalServices:
  matrix:
    federation:
      # Enable Matrix federation with other homeservers.
      enabled: true
      # Allow-list: empty = federate with all homeservers.
      domainAllowList: []

# ─────────────────────────────────────────────────────────────────────────────
# File store naming (catalogue apps with WebDAV)
# ─────────────────────────────────────────────────────────────────────────────
filestore:
  naming:
    # Characters forbidden in file/directory names. Prevents sync issues on
    # Windows/macOS clients that do not support these characters.
    forbiddenChars:
      - '*'
      - '"'
      - '|'
      - '?'
      - ';'
      - ':'
      - '\'
      - '/'
      - '~'
      - '<'
      - '>'
  quota:
    # Default storage quota per user, in gigabytes.
    default: 1
  sharing:
    external:
      # Allow sharing files with external (unauthenticated) participants.
      enabled: false
      enforcePasswords: false
      sendPasswordMail: true
      expiry:
        activeByDefault: true
        enforced: false
        defaultDays: 30
    internal:
      expiry:
        activeByDefault: false
        enforced: false
        defaultDays: 90
  nextcloud:
    clients:
      # Enable Nextcloud mobile/desktop client detection via Basic Auth on /status.php.
      enabled: true
    retentionObligation:
      trashbin: "auto"
      versions: "auto"

# ─────────────────────────────────────────────────────────────────────────────
# Groupware (OX App Suite)
# ─────────────────────────────────────────────────────────────────────────────
groupware:
  davSupport:
    # Enable CalDAV/CardDAV endpoints.
    enabled: true
  externalClients:
    # Show onboarding dialog for external IMAP/SMTP clients (Thunderbird etc.)
    enabledOnboardingInfo: false
    # FQDN overrides for IMAP/SMTP; null = use global.domain
    fqdnImap: ~
    fqdnSmtp: ~
  externalSharing:
    shareLinks:
      enabled: false
    inviteGuests:
      enabled: false
  mail:
    categories:
      enabled: true
    inbound:
      notify:
        enabled: true
      forward:
        enabled: false
    encryption:
      # OX Guard email encryption.
      enabled: true
    maxSize: 25  # megabytes
  quota:
    # Default mail storage quota per user, in gigabytes.
    default: 1
  userProfile:
    # Prevent users from manually changing their display name in OX
    # (it is managed by platform identity).
    editRealName: false

# ─────────────────────────────────────────────────────────────────────────────
# Internationalization
# Wired into: apps/ox-appsuite/values/_base.yaml → templateContext.oxDefaultLanguage
# ─────────────────────────────────────────────────────────────────────────────
internationalization:
  # Default language for OX App Suite (first login) and XWiki content detection.
  # Supported: de_DE (tested), en_GB (tested).
  defaultLanguage: "de_DE"

# ─────────────────────────────────────────────────────────────────────────────
# Migration (OX App Suite Enterprise only)
# ─────────────────────────────────────────────────────────────────────────────
migration:
  oxAppSuite:
    # Enable Master Password auth in Dovecot + migration Pod in OX.
    # Only enable temporarily during data migration.
    enabled: false

# ─────────────────────────────────────────────────────────────────────────────
# Portal
# Wired into: apps/gentian-portal/values/_base.yaml → stackDataContext/templateContext
# ─────────────────────────────────────────────────────────────────────────────
portal:
  # Redirect to login when portal is opened (vs showing tiles and prompting later).
  enforceLogin: true
  # External links shown in the portal menu and footer.
  # DEVIATION: all set to ~ (no external footer links configured)
  linkLegalNotice: ~
  linkPrivacyStatement: ~
  linkDocumentation: ~
  linkSupport: ~
  linkFeedback: ~
  newsfeed:
    # Show newsfeed tile (sourced from XWiki when deployed).
    enabled: true
  welcomeMessage:
    # Show the welcome message tile on first login.
    enabled: true
