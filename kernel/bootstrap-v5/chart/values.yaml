# The bootstrap Applications are parameterised on these values. Namespaces are
# not among them: every destination is resolved from kernel/namespaces.yaml,
# which the installer copies in as `namespaces` (see B-01), so an Application
# cannot name a namespace the layout does not have.
gentianOsBranch: develop
osRepo: https://github.com/gentian-org/gentian-os
storageClass: ""

# Who hosts the zone, for external-dns; an entry in kernel/platforms.yaml.
# "none" emits no external-dns Application.
dnsProvider: none
dnsProviders: {}
kernelDomain: ""
# The cluster's id in gentian-deployments: what external-dns owns records as,
# so two clusters never fight over one zone.
cluster: ""
# How traffic reaches this cluster (the Cluster claim's networkMode):
# tunnel (the claim's default), or static-ip.
networkMode: tunnel

# Filled by the installer from kernel/namespaces.yaml. Never set by hand.
namespaces: {}

# Pins the installer copies in from versions.yaml (B-01). Never set by hand.
versions:
  headlamp:
    chart: ""
    repo: ""

# The realm the kernel signs people in against. Tenants have their own.
kernelRealm: kernel

headlamp:
  oidc:
    # On once the kernel realm carries the headlamp client and its secret;
    # a fresh cluster starts with token login, which is enough to look at a
    # cluster that has no realm yet. The portal login step turns it on.
    enabled: false
    proxy:
      # The maintained fork of jetstack's kube-oidc-proxy, which the archived
      # original names as its successor.
      image: docker.io/tremolosecurity/kube-oidc-proxy:1.0.13
      # Where the image keeps the public roots that verify the issuer.
      caFile: /etc/ssl/certs/ca-certificates.crt

edge:
  # The perimeter Gateway the operator reconciles in the edge namespace: the
  # ACME HTTP-01 solver's routes attach to its :80 listener.
  gatewayName: perimeter

# The stage and the deployments repository, for the ApplicationSets.
stage: dev
deployments:
  repo: ""
  revision: main
  cluster: ""
# The app of apps is applied by C-02, once its children's prerequisites exist.
appsets:
  enabled: false

# What the kernel-services ConfigMap says beyond the layout.
tenancyMode: multi
acmeStaging: "true"
smtpHost: ""

# Whether this cluster serves LLM, from the Cluster claim's llm.enabled. The
# portal turns it into a capability, and a tile appears only for a capability
# the cluster actually has.
llmEnabled: "false"

# The desktop -- a component every tenant gets from the profile the operator
# chart ships (ui-restructure.md §1). What the bootstrap decides is which
# branch's chart that profile names: a prerelease per branch on a dev cluster,
# and only some branches publish.
desktop:
  chartBranch: develop

# The operator (and, with it, the director) — applied by D-01, once the
# identity services its reconcilers address exist.
operator:
  enabled: false
  image: ghcr.io/gentian-org/gentian-os
  # An exact published tag. Empty means the branch tag, which is right when
  # the manifests come from a branch CI publishes images from. Naming one is
  # for the case where they do not — a feature branch under test — and it also
  # takes the image updater off the Application, so the pin holds.
  tag: ""
