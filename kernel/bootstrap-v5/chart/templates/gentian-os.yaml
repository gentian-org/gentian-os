---
# The operator, in the control namespace. It takes the namespace layout as
# values, so it addresses kernel namespaces by function rather than by the one
# name v4 had for all of them.
{{- if .Values.operator.enabled }}
{{- /*
  The manifests come from a git ref; the image comes from a published tag, and
  the installer resolves that to the image built from THIS CHECKOUT'S COMMIT
  (resolve_gentian_os_image_tag). So the manifests and the binary are one
  thing: what Argo CD syncs and what the kubelet pulls were built together.

  No image-updater annotations. They were here, gated on nobody having named a
  tag — which the installer always does, so they never rendered once; and the
  updater deployed on a v5 cluster is v1.x, which acts on `ImageUpdater` CRs
  and reads an Application's annotations only when a CR points it at them. Two
  reasons for the same conclusion: nothing read them. A cluster that wants an
  image to roll on its own gets an `ImageUpdater` CR, which is a thing someone
  writes on purpose rather than an annotation that quietly does nothing.
*/}}
{{- $imageTag := .Values.operator.tag | default .Values.gentianOsBranch }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gentian-os
  namespace: {{ include "ns" (list . "gitops") }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: gentian
  ignoreDifferences:
  - group: admissionregistration.k8s.io
    kind: ValidatingWebhookConfiguration
    name: gentian-os-tenant-validator
    jsonPointers:
    - /webhooks/0/clientConfig/caBundle
  - group: apps
    kind: Deployment
    jqPathExpressions:
    - .spec.template.spec.hostUsers
  # The External Secrets Operator writes its own defaults onto every
  # ExternalSecret it adopts. They are its state, not desired configuration.
  - group: external-secrets.io
    kind: ExternalSecret
    jqPathExpressions:
    - .spec.data[].remoteRef.conversionStrategy
    - .spec.data[].remoteRef.decodingStrategy
    - .spec.data[].remoteRef.metadataPolicy
    - .spec.data[].remoteRef.nullBytePolicy
    - .spec.target.deletionPolicy
    - .metadata.finalizers
  sources:
  - repoURL: {{ .Values.osRepo | default "https://github.com/gentian-org/gentian-os" }}
    targetRevision: {{ .Values.gentianOsBranch }}
    path: charts/gentian-os
    helm:
      valueFiles:
      - $deploy/profiles/_base.yaml
      - $deploy/profiles/{{ .Values.stage }}.yaml
      - $deploy/clusters/{{ .Values.deployments.cluster }}/kernel/values.yaml
      valuesObject:
        image:
          repository: {{ .Values.operator.image }}
          # An immutable <branch>-<sha>, resolved by the installer from the
          # commit these manifests came from. A moving branch tag here is what
          # let a pod restart onto a build nobody chose.
          tag: {{ $imageTag | quote }}
        # Where each kernel function runs. The operator reads these as
        # GENTIAN_NS_<FUNCTION>; without them it runs the v4 layout.
        layout:
          {{- range .Values.namespaces.kernel }}
          {{ .function }}: {{ .name }}
          {{- end }}
        # The Gateway, its routes and its reference grants live at the edge.
        servicesNamespace: {{ include "ns" (list . "edge") }}
        infraNamespace: {{ include "ns" (list . "authentication") }}
        authzBridge:
          # Retired with the split: the director projects membership from
          # Keycloak's events instead. Its URL stays because it is where
          # OpenFGA answers, which the director reads too.
          enabled: false
          openfgaURL: {{ printf "http://gentian-openfga.%s.svc.cluster.local:8080" (include "ns" (list . "authorization")) | quote }}
        # The edge's enforcement point, beside the Gateways (networking.md §2).
        edgeAuthz:
          enabled: true
        # The desktop every tenant gets, from the branch this cluster follows.
        desktop:
          enabled: true
          chart:
            version: {{ .Values.desktop.chartVersion | default (printf "0.1.0-%s" (.Values.desktop.chartBranch | default "develop")) | quote }}
        # The administration console every tenant gets, from the branch of
        # gentian-apps this cluster follows. Like the desktop, it is published
        # as a moving prerelease per branch and an immutable one per commit,
        # and what is pinned here is the immutable one -- a Helm release under
        # an unchanged version string is never upgraded, so following the
        # moving version would install the first build and then never move.
        adminConsole:
          enabled: true
          chart:
            version: {{ .Values.adminConsole.chartVersion | default (printf "0.1.1-%s" (.Values.adminConsole.chartBranch | default "main")) | quote }}
        # The public half of the key Keycloak's event listener signs with.
        # Without it nothing accepts a membership statement, so OpenFGA never
        # learns who is in which group and every permission that follows from
        # membership is refused to everyone. The portal login step derives the
        # pair and writes both halves.
        #
        # It belongs to the OPERATOR now. Membership is cluster state, so the
        # thing that turns declared state into cluster state projects it, and
        # the director is left reading the graph and writing git with a token
        # that cannot write a tuple at all. The Secret's name is unchanged, so
        # an existing cluster needs nothing reissued.
        membershipListener:
          keysSecretRef:
            name: director-listener-keys
            key: keys
        director:
          enabled: true
          entitlements: "off"
        # The waiver allowlist is the director's to write, into the claims,
        # where the console's changes to it are commits. The chart would
        # otherwise create a second copy of the same object from its own
        # values, and two writers of one object is a sync conflict waiting
        # for whoever edits the wrong one.
        platformSecurityPolicy:
          create: false
        # The vault's namespace, for the Role that lets the operator exec into
        # its pod during bootstrap.
        openbaoNamespace: {{ include "ns" (list . "secrets") }}
        openbao:
          address: {{ printf "https://openbao.%s.svc.cluster.local:8200" (include "ns" (list . "secrets")) | quote }}
  - repoURL: {{ .Values.deployments.repo }}
    targetRevision: {{ .Values.deployments.revision }}
    ref: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ include "ns" (list . "control") }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
{{- end }}
