---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: {{ include "ns" (list . "gitops") }}
  finalizers: []
spec:
  project: gentian
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.3.7
    helm:
      values: |
        # The kernel is exempt from the baseline policies by its tier label,
        # never by naming namespaces.
        config:
          webhooks:
            namespaceSelector:
              matchExpressions:
              - key: gentianos.io/tier
                operator: NotIn
                values: [kernel]
        admissionController:
          replicas: 1
          container:
            extraArgs:
              # PolicyExceptions honoured from one namespace only (MetalLB's).
              enablePolicyException: "true"
              exceptionNamespace: "metallb-system"
        backgroundController:
          replicas: 1
        cleanupController:
          replicas: 1
          # The default 128Mi is OOM-killed on a Crossplane-heavy cluster: the
          # TTL manager starts an informer per GVR.
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
        reportsController:
          replicas: 1
        # The chart's cleanup jobs default to bitnami/kubectl, which no longer
        # pulls; alpine/k8s carries bash and kubectl.
        webhooksCleanup:
          image:
            repository: alpine/k8s
            tag: "1.32.3"
        policyReportsCleanup:
          image:
            repository: alpine/k8s
            tag: "1.32.3"
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ include "ns" (list . "admission") }}
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
