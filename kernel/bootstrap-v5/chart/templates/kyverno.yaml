---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: {{ include "ns" (list . "gitops") }}
  finalizers: []
spec:
  project: gentian
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.3.7
    helm:
      values: |
        # The kernel is exempt from the baseline policies by its tier label,
        # never by naming namespaces.
        config:
          webhooks:
            namespaceSelector:
              matchExpressions:
              - key: gentianos.io/tier
                operator: NotIn
                values: [kernel]
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ include "ns" (list . "admission") }}
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
