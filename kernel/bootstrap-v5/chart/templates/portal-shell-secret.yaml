---
# The portal's connection to its own store, in the namespace the portal runs in.
#
# The name carries the kernel domain on purpose. The console resolves a
# person's storage by their tenant, and a platform administrator signed in to
# the kernel realm has no tenant -- so it falls back to the kernel domain as
# the key and reads portal-shell-<kernelDomain>. Without this Secret every
# kernel sign-in fails on the first preferences read, which surfaces as a 500
# on a freshly loaded desktop.
#
# The password is the one the kernel Postgres chart gives the role, read from
# the same vault path, so there is one value in one place.
{{- if .Values.portal.enabled }}
{{- $dbHost := printf "kernel-postgres-rw.%s.svc.cluster.local" (include "ns" (list . "data")) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: portal-shell-{{ .Values.kernelDomain }}
  namespace: {{ include "ns" (list . "edge") }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: portal-shell-{{ .Values.kernelDomain }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        host: {{ $dbHost | quote }}
        port: "5432"
        database: portal_shell
        username: portal_shell_user
        password: "{{ "{{" }} .password }}"
        # The driver scheme the portal's SQLAlchemy engine expects. A bare
        # postgresql:// URL picks a driver that is not installed in the image.
        DATABASE_URL: "postgresql+psycopg://portal_shell_user:{{ "{{" }} .password }}@{{ $dbHost }}:5432/portal_shell"
  data:
    - secretKey: password
      remoteRef:
        key: gentian-os/kernel/database/postgresql
        property: portal_shell_user_password
{{- end }}
