# AppProfile — Element (Matrix / Synapse)
#
# Source chart: oci://registry.opencode.de/bmi/opendesk/components/platform-development/charts/opendesk-element
#   opendesk-element v6.1.9  (frontend)
#   opendesk-synapse v6.1.9  (Matrix homeserver — same OCI repo, deployed alongside)
#   opendesk-well-known v6.1.9
# Value paths verified against:
#   opendesk/helmfile/apps/element/values-element.yaml.gotmpl
#   opendesk/helmfile/apps/element/values-synapse.yaml.gotmpl
# Chart versions from: opendesk/helmfile/environments/default/charts.yaml.gotmpl
#
# Secret inventory:
#   Kernel-provided (3):
#     oidc_client_secret  → configuration.homeserver.oidc.clientSecret
#     synapse_db_password → configuration.database.password.value
#     smtp_password       → configuration.homeserver.smtp.password
#   App-internal (3) → appSecrets:
#     registration_shared_secret → configuration.homeserver.registrationSharedSecret
#     intercom_as_token          → configuration.homeserver.appServiceConfigs[0].as_token
#     ox_appsuite_as_token       → configuration.homeserver.appServiceConfigs[1].as_token
#
# Design notes:
#   The TURN shared secret (configuration.homeserver.turn.sharedSecret / .Values.turn.credentials)
#   is a cluster-level infrastructure credential shared between Element and Jitsi. It is
#   provisioned at the kernel infrastructure level (not per-tenant), so it is NOT listed
#   as an appSecret here. The orchestrator resolves it from the kernel OpenBao path
#   gentianos/kernel/turn/credentials at deploy time.
#
#   App-service bridge tokens (Intercom, OX) are seeded via appSecrets below.
#   Full Synapse appServiceConfigs wiring is planned — until then the chart may
#   run with appServiceConfigs: [] and bridges are not end-to-end active.
#
#   The chart uses direct Helm value injection (.Values.secrets.*) → Pattern B.
apiVersion: gentianos.io/v1alpha1
kind: AppProfile
metadata:
  name: element
  labels:
    gentianos.io/profile-name: element
spec:
  displayName: "Element (Matrix)"
  description: "Federated team chat and collaboration based on the Matrix protocol, with Synapse homeserver."
  logo: "data:image/svg+xml;base64,"

  portalTiles:
    - name: element
      displayName:
        de_DE: "Chat"
        en_US: "Chat"
      # embedded opens inside gentian-ui; newwindow still uses the portal shell.
      # Either way the operator must allow frame-ancestors from portal.<kernel>.
      linkTarget: newwindow
      # Match Jitsi: portal tile visible to all App Users. Synapse OIDC still
      # requires managed-by-attribute-Livecollaboration (via opendeskLivecollaborationEnabled
      # on the App User template and the ldap-app-user-capabilities backfill job).
      allowedGroup: "App Users"

  kernelRequirements:
    identity:
      oidc:
        # Synapse (Matrix homeserver) uses a CONFIDENTIAL client for OIDC.
        # The composition creates this client in the tenant's realm and writes
        # the generated secret to crossplane-system for external consumption.
        clientId: "opendesk-synapse"
        name: "Element (Synapse)"
        accessType: CONFIDENTIAL
        redirectUris:
          # Synapse OIDC callback is served by synapse-web on matrix.<tenant>, not the Element UI host.
          - "https://matrix.${TENANT_DOMAIN}/_synapse/client/oidc/callback"
        postLogoutRedirectUris:
          - "https://chat.${TENANT_DOMAIN}/*"
          - "https://portal.${KERNEL_DOMAIN}/*"
      ldap:
        # Per-tenant LDAP search account provisioned by the LDAP init Job on
        # first app install. Credentials are written to OpenBao by the init Job
        # and injected via valueMapping.ldap.
        search: true
    database:
      engine: postgresql
      databasePerTenant: true
    mail:
      smtp:
        auth: plain
        port: 587

  provides:
    - name: chat
      protocol: matrix

  optionalIntegrations:
    - contract: central-navigation
      provider: portal
      capabilities:
        - navigation:register
    - contract: file-store
      provider: nextcloud
      capabilities:
        - webdav:read
        - webdav:write
    - contract: videoconference
      provider: jitsi
      capabilities:
        - jitsi:widget

  chart:
    repository: "oci://registry.opencode.de/bmi/opendesk/components/platform-development/charts/opendesk-element"
    name: opendesk-element
    version: "6.1.9"

  valueMapping:
    oidc:
      issuerKey: "configuration.homeserver.oidc.issuer"
      clientIdKey: "configuration.homeserver.oidc.clientId"
      clientSecretKey: "configuration.homeserver.oidc.clientSecret"
    database:
      # All four non-password fields are seeded into OpenBao by the database
      # reconciler alongside the password; fetch them all so the Synapse chart
      # gets a fully-resolved database config without hardcoded hostnames.
      hostKey: "configuration.database.host"
      portKey: "configuration.database.port"
      nameKey: "configuration.database.name"
      userKey: "configuration.database.user"
      passwordKey: "configuration.database.password.value"
    smtp:
      passwordKey: "configuration.homeserver.smtp.password"

  appSecrets:
    # Synapse registration shared secret — controls who can register accounts.
    - name: registration_shared_secret
      valuePath: "configuration.homeserver.registrationSharedSecret"
    # Application service token for the Intercom kernel notification gateway.
    - name: intercom_as_token
      valuePath: "configuration.homeserver.appServiceConfigs[0].as_token"
    # Application service token for OX App Suite OIDC actor in Matrix.
    - name: ox_appsuite_as_token
      valuePath: "configuration.homeserver.appServiceConfigs[1].as_token"
    # Matrix User Verification Service password — seeded for the UVS bootstrap Job
    # (app-element composition); not injected into element/synapse Helm values.
    - name: matrix_uvs_password
      valuePath: "bootstrap.configuration.password"

  # Default values aligned with opendesk/helmfile/apps/element/values-element.yaml.gotmpl
  # (frontend) and values-synapse.yaml.gotmpl (homeserver). Environment-specific
  # overrides (domain, image registry, replicas) are injected by the orchestrator's
  # Tofu module at deploy time. ${TENANT_DOMAIN} is substituted by the operator with
  # the tenant's domain.
  extraValues:
    global:
      # Kernel/platform domain so global.hosts.keycloak resolves to id.<kernel>
      # (e.g. id.desk.gentian.org), not id.<tenant> (404). Tenant-scoped app
      # hostnames use ${TENANT_ID} prefix — see commit b1203d0 / app-profile-guide.
      domain: "${KERNEL_DOMAIN}"
      hosts:
        element: "chat.${TENANT_ID}"
        synapse: "matrix.${TENANT_ID}"
        jitsi: "meet.${TENANT_ID}"
        keycloak: "id"
        nubus: "portal"
        intercomService: "ics"
        matrixNeoBoardWidget: "matrix-neoboard-widget.${TENANT_ID}"
        matrixNeoChoiceWidget: "matrix-neochoice-widget.${TENANT_ID}"
        matrixNeoDateFixWidget: "matrix-neodatefix-widget.${TENANT_ID}"

    fullnameOverride: "element"

    replicaCount: 1

    configuration:
      endToEndEncryption: true
      # Matrix homeserver federation, OIDC issuer, SMTP host and TURN servers are
      # injected by the orchestrator's Tofu module — they require live values from
      # the tenant's Keycloak realm and the kernel mail / TURN infrastructure.
      homeserver:
        serverName: "${TENANT_DOMAIN}"
        # opendesk-synapse v6.1.9 bundles Synapse 1.116.0, which only supports room
        # versions up to 11. Room version 12 was introduced in Synapse 1.127+.
        defaultRoomVersion: 11
        presence:
          enabled: true
        profile:
          allowUsersToUpdateDisplayname: true
        # App service bridges (Intercom, OX App Suite) require a full app service
        # config (id, hs_token, url, namespaces) beyond the as_token injected by
        # appSecrets. Set to empty list until the bridge orchestration is
        # implemented end-to-end. The as_token appSecrets continue to be seeded in
        # OpenBao for future use.
        appServiceConfigs: []
        # smtp.host: postfix is a kernel service accessible cluster-wide at
        # postfix-dev.gentian-dev.svc.cluster.local on port 25.
        # smtp.username and smtp.password are injected by the operator / ExternalSecret.
        smtp:
          host: "${SMTP_HOST}"
          port: 25
          tls: false
          starttls: false
          senderAddress: "matrix@${TENANT_DOMAIN}"
        turn:
          sharedSecret: "${TURN_CREDENTIALS}"
          servers:
            - server: "${TURN_TLS_HOST}"
              port: 5349
              transport: "${TURN_TRANSPORT}"
            - server: "${TURN_HOST}"
              port: 3478
              transport: "${TURN_TRANSPORT}"
        oidc:
          # issuer and clientId are injected by ExternalSecret from OpenBao
          # (seeded by the identity-reconciler). Only the static claims remain here.
          # Use LDAP uid (opendesk_username), not preferred_username — broker tokens
          # may carry the kernel mailPrimaryAddress as preferred_username.
          matrixIdLocalpart: "opendesk_username"
          scopes:
            - "openid"
            - "opendesk-matrix-scope"
      # Tighter rate limits for non-chat Matrix apps and widgets (NeoBoard etc).
      additionalConfiguration:
        # Chain Element logout into the tenant Keycloak session (openDesk default).
        logout_redirect_url: "https://id.${KERNEL_DOMAIN}/realms/${TENANT_ID}/protocol/openid-connect/logout?client_id=opendesk-synapse&post_logout_redirect_uri=https%3A%2F%2Fportal.${KERNEL_DOMAIN}"
        # Required by opendesk-element-web (Nordeck OpenDesk module). Without this
        # block Element throws "value is required" at startup and stays on loading.
        "net.nordeck.element_web.module.opendesk":
          config:
            banner:
              ics_navigation_json_url: "https://ics.${KERNEL_DOMAIN}/navigation.json"
              ics_silent_url: "https://ics.${KERNEL_DOMAIN}/silent"
              portal_logo_svg_url: "https://portal.${KERNEL_DOMAIN}/univention/portal/icons/logos/domain.svg"
              portal_url: "https://portal.${KERNEL_DOMAIN}/"
            custom_css_variables:
              --cpd-color-bg-action-primary-rest: "#3B8C72"
              --cpd-color-text-action-accent: "#3B8C72"
        # Keep Synapse local password auth enabled (openDesk default) so the
        # opendesk-synapse-create-account UVS bootstrap Job can log in as @uvs
        # after register_new_matrix_user. Human users still go through OIDC:
        # app-element injects sso_redirect_options.immediate on the Element web
        # config only (not into homeserver.yaml).
        "net.nordeck.element_web.module.widget_lifecycle":
          widget_permissions:
            "https://chat.${TENANT_DOMAIN}/jitsi.html":
              identity_approved: true
        rc_login:
          account:
            per_second: 2
            burst_count: 8
          address:
            per_second: 2
            burst_count: 12
        rc_message:
          per_second: 5
          burst_count: 25
        rc_media_create:
          per_second: 20
          burst_count: 100
        room_prejoin_state:
          additional_event_types:
            - "m.space.parent"
            - "net.nordeck.meetings.metadata"
            - "m.room.power_levels"
        user_directory:
          enabled: true
          search_all_users: true

    # Chart-level ingress disabled — the operator's ensureIngress (spec.ingress)
    # creates the Kubernetes Ingress resource with the tenant domain.
    ingress:
      enabled: false

    # Use opendesk's purpose-built element-web image. It is hardened for the
    # security context defined below (uid 101, readOnlyRootFilesystem,
    # capabilities drop ALL) and listens on port 8080 — matching the chart's
    # default service / probe configuration. The upstream
    # docker.io/vectorim/element-web image is NOT compatible with these
    # defaults (nginx wants /var/cache/nginx writable and binds to port 80).
    image:
      registry: "registry.opencode.de"
      repository: "bmi/opendesk/components/supplier/element/images/opendesk-element-web"
      tag: "v1.12.6@sha256:ab2c5b5bc359d2b2e73a33fd3f3efdc3439d4a761bdf9624419b8ef53df7ae14"

    # Pull the opendesk image from registry.opencode.de.
    imagePullSecrets:
      - name: registry-credentials

    podSecurityContext:
      enabled: true
      fsGroup: 101

    containerSecurityContext:
      enabled: true
      allowPrivilegeEscalation: false
      privileged: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 101
      runAsGroup: 101
      seccompProfile:
        type: "RuntimeDefault"
      capabilities:
        drop: ["ALL"]

    resources:
      limits:
        cpu: "1"
        memory: "256Mi"
      requests:
        cpu: "100m"
        memory: "32Mi"

    serviceAccount:
      create: true

  # Pattern B — opendesk-element/synapse chart injects secrets as direct Helm values.
  deploymentMethod: crossplane

  # Use the dedicated app-element Composition which deploys five Helm Releases:
  # opendesk-element (frontend), opendesk-synapse (homeserver),
  # opendesk-synapse-create-account + opendesk-matrix-user-verification-service
  # (Jitsi hybrid_matrix_token auth), and opendesk-synapse-web (matrix ingress).
  compositionRef: app-element

  # Ingress managed by the operator's ensureIngress reconciler.
  # Creates Ingress "chat.<tenant-domain>" → Service element:8080 (frontend).
  # Port 8080 matches the chart default and the opendesk-element-web image.
  ingress:
    subDomain: "chat"
    serviceName: "element"
    servicePort: 8080
    ingressClassName: "nginx"
    tlsEnabled: true
    # TLS: operator uses per-tenant DNS-01 wildcard (clusterIssuer field unused)
    # Portal iframe CSP (frame-ancestors) is injected by the gentian-os operator —
    # do not add X-Frame-Options or Content-Security-Policy here (see app-profile-guide §6).
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "100M"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "60"

  # BrowserProxy routes expose the Matrix Client-Server API to the shell via a CORS-safe
  # server-side proxy. The shell forwards the user's bearer token to Synapse.
  browserProxy:
    - path: matrix
      # Forwards /api/apps/element/matrix/** → http://synapse.{namespace}.svc/_matrix/
      target: "http://synapse.{namespace}.svc/_matrix/"
      authMode: forward-bearer
      stripPrefix: true

