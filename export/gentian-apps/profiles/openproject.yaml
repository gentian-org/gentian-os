# AppProfile — OpenProject (project management)
#
# Source chart: oci://registry.opencode.de/bmi/opendesk/components/supplier/openproject/charts-mirror
#   openproject v10.1.0
# Value paths verified against:
#   opendesk/helmfile/apps/openproject/values.yaml.gotmpl
# Chart versions from: opendesk/helmfile/environments/default/charts.yaml.gotmpl
# Images from:         opendesk/helmfile/environments/default/images.yaml.gotmpl
#
# Note: The opendesk-openproject-bootstrap chart (v2.3.0) seeds opendesk-specific LDAP
# schemas and portal configurations at the cluster level. In gentian-os it is deployed
# once at the kernel level if opendesk LDAP schemas are in use; it is NOT a per-tenant
# AppProfile dependency and not referenced here.
#
# Secret inventory:
#   Kernel-provided (5):
#     oidc_client_secret  → openproject.oidc.secret
#     pg_password         → postgresql.auth.password
#     s3_secret_key       → s3.auth.secretAccessKey
#     smtp_password       → environment.OPENPROJECT_SMTP__PASSWORD
#     ldap_bind_password  → environment.OPENPROJECT_SEED_LDAP_OPENDESK_BINDPASSWORD
#   App-internal (2) → appSecrets:
#     admin_password      → openproject.admin_user.password
#     api_admin_password  → environment.OPENPROJECT_AUTHENTICATION_GLOBAL__BASIC__AUTH_PASSWORD
#
# Design notes:
#   OpenProject uses a CONFIDENTIAL OIDC client (server-side authorization code flow)
#   in the tenant's own Keycloak realm (${TENANT_ID}). The realm scope
#   "opendesk-openproject-scope" must exist in the realm; it carries the three protocol
#   mappers opendesk_useruuid, opendesk_username, opendeskProjectmanagementAdmin.
#   This scope is a realm-wide template provisioned at kernel level, not per-tenant.
#
#   Backend OIDC endpoints (tokenEndpoint, userinfoEndpoint, jwksUri) use external
#   Keycloak URLs by default so the AppProfile is cluster-agnostic. On clusters where
#   pods cannot reach external addresses (hairpin NAT), override these via
#   App.spec.config.extraValues to point to the internal Keycloak service URL
#   (e.g. http://nubus-dev-keycloak.gentian-dev.svc.cluster.local:8080/...).
#
#   S3 storage uses external MinIO with path-style access. The bucket name and MinIO
#   username follow the pattern openproject-${TENANT_ID}. The MinIO secret key is
#   seeded into OpenBao by the storage reconciler (Inc 7) and injected via
#   valueMapping.s3.secretKeyKey. Bucket and access key are non-secret derived values
#   set in extraValues.
#
#   LDAP user sync connects to the UCS LDAP directory via the per-tenant bind account
#   (uid=ldapsearch_openproject,cn=users,...) provisioned by the LDAP reconciler (Inc 4).
#   The bind password is seeded into OpenBao and injected via valueMapping.ldap.
#   Non-secret LDAP parameters (host, base DN, bind DN) are injected from operator-
#   substituted placeholders (${LDAP_HOST}, ${LDAP_BASE_DN}, ${LDAP_BIND_DN}).
#
#   The central-navigation API key (OPENPROJECT_SOUVAP__NAVIGATION__SECRET) is a
#   cluster-wide portal credential shared across all apps. It is wired via the
#   central-navigation IntegrationBinding when that integration is active — NOT listed
#   as an appSecret here.
#
#   The chart uses direct Helm value injection (.Values.secrets.*) → Pattern B.
apiVersion: gentianos.io/v1alpha1
kind: AppProfile
metadata:
  name: openproject
  labels:
    gentianos.io/profile-name: openproject
spec:
  displayName: "OpenProject"
  description: "Open-source project management with Gantt charts, Kanban boards, time tracking, and LDAP-synced users."
  logo: "data:image/svg+xml;base64,PHN2ZyBmaWxsPSIjMUE2N0EzIiByb2xlPSJpbWciIHZpZXdCb3g9IjAgMCAyNCAyNCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48dGl0bGU+T3BlblByb2plY3Q8L3RpdGxlPjxwYXRoIGQ9Ik0zIDNoMTh2MThIM1Yzem0yIDJ2MTRoMTRWNUg1em0yIDNoMTB2Mkg3Vjh6bTAgM2g4djJIN3YtMnptMCAzaDZ2Mkg3di0yeiIvPjwvc3ZnPg=="

  kernelRequirements:
    identity:
      oidc:
        # OpenProject uses a CONFIDENTIAL client (server-side OAuth2 authorization
        # code flow with client secret). The composition creates this client in the
        # tenant's realm and writes the generated secret to OpenBao.
        clientId: "opendesk-openproject"
        name: "OpenProject"
        accessType: CONFIDENTIAL
        redirectUris:
          - "https://projects.${TENANT_DOMAIN}/auth/keycloak/callback"
        postLogoutRedirectUris:
          - "https://projects.${TENANT_DOMAIN}/"
        backchannelLogoutUrl: "https://projects.${TENANT_DOMAIN}/auth/keycloak/backchannel-logout"
      ldap:
        # Per-tenant LDAP search account provisioned by the LDAP init Job on
        # first app install; sync account provisioned by the LDAP reconciler.
        # Credentials are seeded into OpenBao and injected via valueMapping.ldap.
        search: true
        sync: true
        interval: "1h"
    database:
      engine: postgresql
      databasePerTenant: true
    storage:
      s3:
        bucketPerTenant: true
    cache:
      engine: memcached
    mail:
      smtp:
        # OpenProject requires CRAM-MD5 SMTP authentication (postfix kernel service).
        auth: cram-md5
        port: 587

  provides:
    - name: project-management
      protocol: http-json

  optionalIntegrations:
    - contract: central-navigation
      provider: portal
      capabilities:
        - navigation:register
    - contract: file-store
      provider: nextcloud
      capabilities:
        - webdav:read
        - webdav:write

  portalTiles:
    - name: openproject
      displayName:
        de_DE: "Projekte"
        en_US: "Projects"
      linkTarget: newwindow
      allowedGroup: "App Users"

  chart:
    repository: "oci://registry.opencode.de/bmi/opendesk/components/supplier/openproject/charts-mirror"
    name: openproject
    version: "10.1.0"

  deploymentMethod: crossplane

  valueMapping:
    oidc:
      # OIDC client secret injected from OpenBao (seeded by the identity reconciler).
      clientSecretKey: "openproject.oidc.secret"
    database:
      # All five database connection fields are injected via set_sensitive from
      # OpenBao. The chart receives postgresql.bundled=false via extraValues so
      # these configure the external CloudNativePG connection.
      hostKey: "postgresql.connection.host"
      portKey: "postgresql.connection.port"
      nameKey: "postgresql.auth.database"
      userKey: "postgresql.auth.username"
      passwordKey: "postgresql.auth.password"
    s3:
      # MinIO secret key injected from OpenBao (seeded by the storage reconciler).
      # accessKeyId and bucketName are derived from TENANT_ID in extraValues.
      secretKeyKey: "s3.auth.secretAccessKey"
    smtp:
      # SMTP password injected from OpenBao (seeded by the mail reconciler).
      # Host, port, and auth method are set in extraValues below.
      passwordKey: "environment.OPENPROJECT_SMTP__PASSWORD"
    ldap:
      # LDAP bind password injected from OpenBao (seeded by the LDAP reconciler).
      # Host, base DN, and bind DN are non-secret and use ${...} placeholders
      # in extraValues (substituted by the operator from kernel metadata).
      bindPasswordKey: "environment.OPENPROJECT_SEED_LDAP_OPENDESK_BINDPASSWORD"

  appSecrets:
    # Initial admin user password — seeded once on first install. OpenProject
    # locks this account after SSO is configured to prevent direct password logins.
    - name: admin_password
      valuePath: "openproject.admin_user.password"
    # HTTP Basic Auth password for the OpenProject internal API admin user.
    # Used by scripts and automated tooling that call the OpenProject REST API.
    - name: api_admin_password
      valuePath: "environment.OPENPROJECT_AUTHENTICATION_GLOBAL__BASIC__AUTH_PASSWORD"

  # Operator ingress — the operator's ensureIngress creates the Kubernetes Ingress
  # resource at projects.<tenant-domain>. Chart-managed ingress is disabled below
  # (ingress.enabled: false) to avoid resource conflicts.
  ingress:
    subDomain: "projects"
    serviceName: "openproject"
    servicePort: 8080
    ingressClassName: "nginx"
    tlsEnabled: true
    # TLS: operator uses per-tenant DNS-01 wildcard (clusterIssuer field unused)
    # Portal iframe CSP (frame-ancestors) is injected by the gentian-os operator —
    # do not add X-Frame-Options or Content-Security-Policy here (see app-profile-guide §6).
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "512M"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "120"

  # BrowserProxy routes expose OpenProject's REST API to the shell via a CORS-safe
  # server-side proxy. The shell forwards the user's bearer token to the upstream,
  # so no separate API credentials are needed in the browser.
  browserProxy:
    - path: api
      # Forwards /api/apps/openproject/api/** → http://openproject.{namespace}.svc/api/v3/
      target: "http://openproject.{namespace}.svc/api/v3/"
      authMode: forward-bearer
      stripPrefix: true

  # Default values aligned with opendesk/helmfile/apps/openproject/values.yaml.gotmpl.
  # ${TENANT_DOMAIN}, ${TENANT_ID} are substituted by the operator at deploy time.
  # ${LDAP_HOST}, ${LDAP_BASE_DN}, ${LDAP_BIND_DN} are substituted from kernel metadata.
  # ${SMTP_HOST} is substituted from the kernel mail service address.
  # ${S3_ENDPOINT} is substituted from the kernel MinIO API endpoint.
  # Secret values are injected via set_sensitive (valueMapping) — not here.
  extraValues:
    global:
      # Kernel domain so global.hosts.keycloak → id.<kernel> (central IdP).
      # App hostname is set explicitly in openproject.host below.
      domain: "${KERNEL_DOMAIN}"
      hosts:
        openproject: "projects.${TENANT_ID}"
        keycloak: "id"
        nubus: "portal"
      imagePullSecrets:
        - name: registry-credentials

    # fullnameOverride ensures a predictable Kubernetes Service name ("openproject")
    # regardless of the Helm release name generated by the Crossplane composition.
    # The operator's spec.ingress.serviceName references this name directly.
    fullnameOverride: "openproject"

    # Use opendesk-mirrored OpenProject image.
    image:
      registry: "registry.opencode.de"
      repository: "bmi/opendesk/components/supplier/openproject/images-mirror/open_desk"
      tag: "16.6.5@sha256:877ea14085ec04311d8d138d37eea43ba80f81228fdf7ed042715b8cf316178f"
      imagePullPolicy: "IfNotPresent"

    # dbInit uses the postgres image to run DB migration checks before startup.
    dbInit:
      image:
        registry: "registry-1.docker.io"
        repository: "library/postgres"
        tag: "16.9-alpine3.20@sha256:e5507c984377515b8c9922b0eb19f55aba2063fdc7bccf268cefd53133f97054"

    # External PostgreSQL — bundled PostgreSQL disabled. Connection details
    # (host, port, name, user, password) all come from valueMapping (OpenBao).
    postgresql:
      bundled: false

    # External Memcached — bundled Memcached disabled. The cache reconciler (Inc 8)
    # deploys a per-tenant Memcached instance in the tenant namespace.
    memcached:
      bundled: false
      connection:
        host: "memcached"
        port: 11211

    # S3 file storage — external MinIO with path-style access.
    # secretAccessKey injected via valueMapping.s3.secretKeyKey (from OpenBao).
    # accessKeyId and bucketName are derived from TENANT_ID (not secret material).
    s3:
      enabled: true
      pathStyle: true
      region: "us-east-1"
      directUploads: false
      enableSignatureV4Streaming: false
      endpoint: "${S3_ENDPOINT}"
      host: "${S3_ENDPOINT}"
      bucketName: "openproject-${TENANT_ID}"
      auth:
        accessKeyId: "openproject_${TENANT_ID}"

    # Persist=false: all user-uploaded files go to S3 (aligned with opendesk).
    persistence:
      enabled: false

    # Probe settings from opendesk: OpenProject's Rails boot takes 2-3 minutes.
    probes:
      liveness:
        initialDelaySeconds: 300
        failureThreshold: 30
      readiness:
        initialDelaySeconds: 150
        failureThreshold: 30

    # appInit: the wait-for-db init container runs a full Rails process.
    # Requires more memory than the namespace LimitRange default (512 Mi causes
    # OOMKill / exit code 137).
    appInit:
      resources:
        limits:
          cpu: "2"
          memory: "2Gi"
        requests:
          cpu: "100m"
          memory: "768Mi"

    replicaCount: 1
    backgroundReplicaCount: 1

    resources:
      limits:
        cpu: "4"
        memory: "4Gi"
      requests:
        cpu: "500m"
        memory: "2Gi"

    # Security context aligned with opendesk values.yaml.gotmpl.
    containerSecurityContext:
      enabled: true
      privileged: false
      runAsUser: 1000
      runAsGroup: 1000
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - "ALL"
      seccompProfile:
        type: "RuntimeDefault"
      readOnlyRootFilesystem: true
      runAsNonRoot: true

    podAnnotations:
      # Stakater Reloader restarts the pod when the ExternalSecret updates (e.g.
      # after credential rotation), ensuring the new secret values are picked up.
      reloader.stakater.com/auto: "true"

    serviceAccount:
      create: true

    openproject:
      seed_locale: "de"
      host: "projects.${TENANT_DOMAIN}"
      admin_user:
        name: "OpenProject Internal Admin"
        mail: "openproject-admin@${TENANT_DOMAIN}"
        password_reset: "false"
        # Lock admin account after first deploy so only OIDC logins are accepted.
        # Set to false during initial bootstrapping if direct admin access is needed.
        locked: false
      oidc:
        enabled: true
        # authorizationEndpoint is relative — resolved against openproject.host
        # by OpenProject's OmniAuth Keycloak strategy.
        authorizationEndpoint: "/realms/${TENANT_ID}/protocol/openid-connect/auth"
        # endSessionEndpoint is browser-facing: requires the full external URL.
        endSessionEndpoint: "https://id.${KERNEL_DOMAIN}/realms/${TENANT_ID}/protocol/openid-connect/logout"
        host: "id.${KERNEL_DOMAIN}"
        identifier: "opendesk-openproject"
        provider: "keycloak"
        scope: "[openid,opendesk-openproject-scope]"
        # Backend endpoints: OpenProject fetches these server-side (token exchange
        # and user info). External URLs work on clusters without hairpin NAT issues.
        # Override via App.spec.config.extraValues if internal routing is required.
        tokenEndpoint: "https://id.${KERNEL_DOMAIN}/realms/${TENANT_ID}/protocol/openid-connect/token"
        userinfoEndpoint: "https://id.${KERNEL_DOMAIN}/realms/${TENANT_ID}/protocol/openid-connect/userinfo"
        attribute_map:
          login: "opendesk_username"
          admin: "openproject_admin"
      # tmpVolumes provide writable paths under readOnlyRootFilesystem.
      useTmpVolumes: true

    # Chart-managed ingress disabled — the operator's spec.ingress above handles
    # the Kubernetes Ingress resource.
    ingress:
      enabled: false

    environment:
      # ── Authentication / OmniAuth ─────────────────────────────────────────
      OPENPROJECT_LOGIN__REQUIRED: "true"
      OPENPROJECT_OMNIAUTH__DIRECT__LOGIN__PROVIDER: "keycloak"
      OPENPROJECT_OAUTH__ALLOW__REMAPPING__OF__EXISTING__USERS: "true"
      OPENPROJECT_EMAIL__DELIVERY__METHOD: "smtp"

      # ── OIDC env overrides ────────────────────────────────────────────────
      # OpenProject reads these in addition to the structured openproject.oidc.*
      # block above. The issuer env var sets the OmniAuth provider config.
      OPENPROJECT_OPENID__CONNECT_KEYCLOAK_ISSUER: "https://id.${KERNEL_DOMAIN}/realms/${TENANT_ID}"
      OPENPROJECT_OPENID__CONNECT_KEYCLOAK_POST__LOGOUT__REDIRECT__URI: "https://projects.${TENANT_DOMAIN}/"
      OPENPROJECT_OPENID__CONNECT_KEYCLOAK_JWKS__URI: "https://id.${KERNEL_DOMAIN}/realms/${TENANT_ID}/protocol/openid-connect/certs"

      # ── SMTP (password injected via valueMapping.smtp.passwordKey) ────────
      # ${SMTP_HOST} is substituted from the kernel Postfix service address.
      OPENPROJECT_SMTP__ADDRESS: "${SMTP_HOST}"
      OPENPROJECT_SMTP__PORT: "587"
      OPENPROJECT_SMTP__SSL: "false"
      OPENPROJECT_SMTP__AUTHENTICATION: "cram_md5"
      OPENPROJECT_SMTP__ENABLE__STARTTLS__AUTO: "true"
      OPENPROJECT_SMTP__OPENSSL__VERIFY__MODE: "none"
      OPENPROJECT_SMTP__DOMAIN: "${TENANT_DOMAIN}"
      OPENPROJECT_SMTP__USER__NAME: "opendesk-system@${TENANT_DOMAIN}"
      OPENPROJECT_MAIL__FROM: "noreply@${TENANT_DOMAIN}"

      # ── Portal navigation ─────────────────────────────────────────────────
      OPENPROJECT_HOME__URL: "https://portal.${KERNEL_DOMAIN}/"
      OPENPROJECT_SOUVAP__NAVIGATION__URL: "https://portal.${KERNEL_DOMAIN}/univention/portal/navigation.json?base=https%3A//portal.${KERNEL_DOMAIN}"
      # OPENPROJECT_SOUVAP__NAVIGATION__SECRET: wired by central-navigation IntegrationBinding.

      # ── LDAP seeder (static fields — per-cluster params via placeholders) ──
      # ${LDAP_HOST}, ${LDAP_BASE_DN}, ${LDAP_BIND_DN} are substituted by the
      # operator from kernel LDAP metadata. BINDPASSWORD comes from valueMapping.
      OPENPROJECT_SEED_LDAP_OPENDESK_HOST: "${LDAP_HOST}"
      OPENPROJECT_SEED_LDAP_OPENDESK_PORT: "389"
      OPENPROJECT_SEED_LDAP_OPENDESK_SECURITY: "plain_ldap"
      OPENPROJECT_SEED_LDAP_OPENDESK_BINDUSER: "${LDAP_BIND_DN}"
      OPENPROJECT_SEED_LDAP_OPENDESK_BASEDN: "${LDAP_BASE_DN}"
      OPENPROJECT_SEED_LDAP_OPENDESK_SYNC__USERS: "true"
      OPENPROJECT_SEED_LDAP_OPENDESK_FILTER: "(&(objectClass=opendeskProjectmanagementUser)(opendeskProjectmanagementEnabled=TRUE))"
      OPENPROJECT_SEED_LDAP_OPENDESK_LOGIN__MAPPING: "uid"
      OPENPROJECT_SEED_LDAP_OPENDESK_FIRSTNAME__MAPPING: "givenName"
      OPENPROJECT_SEED_LDAP_OPENDESK_LASTNAME__MAPPING: "sn"
      OPENPROJECT_SEED_LDAP_OPENDESK_MAIL__MAPPING: "mailPrimaryAddress"
      OPENPROJECT_SEED_LDAP_OPENDESK_ADMIN__MAPPING: "opendeskProjectmanagementAdmin"
      OPENPROJECT_SEED_LDAP_OPENDESK_GROUPFILTER_OPENDESK_BASE: "${LDAP_BASE_DN}"
      OPENPROJECT_SEED_LDAP_OPENDESK_GROUPFILTER_OPENDESK_FILTER: "(&(objectClass=opendeskProjectmanagementGroup)(opendeskProjectmanagementEnabled=TRUE))"
      OPENPROJECT_SEED_LDAP_OPENDESK_GROUPFILTER_OPENDESK_SYNC__USERS: "true"
      OPENPROJECT_SEED_LDAP_OPENDESK_GROUPFILTER_OPENDESK_GROUP__ATTRIBUTE: "cn"

      # ── API authentication ────────────────────────────────────────────────
      # OPENPROJECT_AUTHENTICATION_GLOBAL__BASIC__AUTH_PASSWORD injected via appSecrets.
      OPENPROJECT_AUTHENTICATION_GLOBAL__BASIC__AUTH_USER: "api_admin"

      # ── Misc settings aligned with opendesk ───────────────────────────────
      OPENPROJECT_LOG__LEVEL: "info"
      OPENPROJECT_APP__TITLE: "Projekte"
      OPENPROJECT_USER__DEFAULT__TIMEZONE: "Europe/Berlin"
      OPENPROJECT_DEFAULT__COMMENT__SORT__ORDER: "desc"
      OPENPROJECT_PLUGIN__OPENPROJECT__AVATARS: '{enable_gravatars: false, enable_local_avatars: true}'
