# AppProfile — Jitsi Meet (video conferencing)
#
# Source chart: oci://registry.opencode.de/bmi/opendesk/components/platform-development/charts/opendesk-jitsi
#   opendesk-jitsi v3.5.1
# Value paths verified against:
#   opendesk/helmfile/apps/jitsi/values-jitsi.yaml.gotmpl
# Chart version from: opendesk/helmfile/environments/default/charts.yaml.gotmpl
#
# Secret inventory:
#   Kernel-provided:
#     oidc_client_secret  — Keycloak client secret for the "opendesk-jitsi" realm client
#                           (used by the Keycloak adapter init job)
#     turn_credentials    — TURN shared secret; provisioned at kernel level, shared
#                           between Jitsi and Element (Matrix TURN). Resolved from
#                           gentianos/kernel/turn/credentials — NOT listed as an appSecret.
#   App-internal (4) → appSecrets:
#     jwt_app_secret          → settings.jwtAppSecret.value
#     jicofo_auth_password    → jitsi.jicofo.xmpp.password
#     jicofo_component_secret → jitsi.jicofo.xmpp.componentSecret
#     jvb_auth_password       → jitsi.jvb.xmpp.password
#
# Design notes:
#   Authentication uses the hybrid-matrix-token scheme (AUTH_TYPE=hybrid_matrix_token).
#   Prosody validates JWT tokens signed with jwt_app_secret; the Keycloak adapter
#   performs the OAuth2 exchange. The TURN credentials are cluster-wide infrastructure
#   shared with Element — the orchestrator injects them from the kernel OpenBao path
#   at deploy time, NOT as a per-tenant appSecret.
#
#   Jitsi does NOT require a database or SMTP kernel service. The only kernel
#   requirement is OIDC (for the Keycloak adapter that issues JWT tokens).
#
#   JVB (video bridge) uses NodePort for UDP media traffic. The service type is
#   set to NodePort and patchJVB is disabled (the chart's post-install job hardcodes
#   service name "jitsi-jvb" which only works when the Helm release is named "jitsi";
#   our operator uses a generated release name). The node IP is set directly in
#   jvb.publicIPs; for other environments override via App.spec.config.extraValues.
#
#   Ingress is at meet.<tenant_domain> (e.g. meet.desk.gentian.org). The operator
#   creates the ingress (spec.ingress.serviceName: jitsi-web) backed by the stable
#   service alias emitted by the composition. The chart's built-in ingress is
#   disabled (jitsi.web.ingress.enabled: false) to avoid conflicting resources.
#
#   Element integration: install Element in the same tenant. The app-element
#   composition deploys Matrix User Verification Service (UVS); Prosody uses
#   hybrid_matrix_token auth and MATRIX_UVS_URL pointing at that service.
#   Element's jitsi.html widget and Synapse TURN config use ${TURN_*} from the
#   gentian-kernel-services ConfigMap (shared with this profile).
#
#   Deployment uses Pattern B (crossplane): an App claim drives the Composition
#   which collects all four appSecrets via ExternalSecret and renders the Helm Release.
apiVersion: gentianos.io/v1alpha1
kind: AppProfile
metadata:
  name: jitsi
  labels:
    gentianos.io/profile-name: jitsi
spec:
  displayName: "Jitsi Meet"
  description: "Open-source video conferencing with end-to-end encryption, JWT authentication, and Element (Matrix) integration."
  logo: "data:image/svg+xml;base64,"

  kernelRequirements:
    identity:
      oidc:
        # Jitsi's keycloak-adapter uses the authorization code + PKCE flow
        # (no client secret needed in the adapter pod).
        clientId: "opendesk-jitsi"
        name: "Jitsi Meet"
        accessType: PUBLIC
        redirectUris:
          - "https://meet.${TENANT_DOMAIN}/*"

  provides:
    - name: videoconference
      protocol: webrtc

  optionalIntegrations:
    - contract: central-navigation
      provider: portal
      capabilities:
        - navigation:register

  # Portal tile for standalone meetings (OpenDesk parity). Element room widgets
  # use the same meet.<tenant> URL via global.hosts.jitsi in the Element profile.
  portalTiles:
    - name: jitsi
      displayName:
        de_DE: "Videokonferenz"
        en_US: "Video Conference"
      linkTarget: newwindow
      allowedGroup: "App Users"

  chart:
    repository: "oci://registry.opencode.de/bmi/opendesk/components/platform-development/charts/opendesk-jitsi"
    name: opendesk-jitsi
    version: "3.5.1"

  deploymentMethod: crossplane

  # PUBLIC OIDC client — no valueMapping needed (no kernel-injected secrets).

  appSecrets:
    # JWT token signing secret — shared between Prosody XMPP and the Keycloak adapter.
    - name: jwt_app_secret
      valuePath: "settings.jwtAppSecret.value"
    # Jicofo XMPP authentication password.
    - name: jicofo_auth_password
      valuePath: "jitsi.jicofo.xmpp.password"
    # Jicofo external component secret.
    - name: jicofo_component_secret
      valuePath: "jitsi.jicofo.xmpp.componentSecret"
    # JVB (video bridge) XMPP authentication password.
    - name: jvb_auth_password
      valuePath: "jitsi.jvb.xmpp.password"

  ingress:
    subDomain: meet
    serviceName: jitsi-web
    servicePort: 80
    ingressClassName: "nginx"
    tlsEnabled: true
    # TLS: operator uses per-tenant DNS-01 wildcard (clusterIssuer field unused)
    # Portal iframe CSP (frame-ancestors) is injected by the gentian-os operator on
    # every app Ingress — see internal/controller/ingress_helpers.go.
  # BrowserProxy: Jitsi does not expose a REST API consumed by the shell.
  # Real-time signalling uses WebRTC/WebSocket directly from the browser
  # to the XMPP/Prosody service on the same tenant domain — no proxy needed.
  # Default values aligned with opendesk/helmfile/apps/jitsi/values-jitsi.yaml.gotmpl.
  # Environment-specific overrides (domain, public IP, image registry) are injected
  # by the orchestrator's Tofu module at deploy time. ${TENANT_DOMAIN} is substituted
  # by the operator with the tenant effective domain; ${KERNEL_DOMAIN} with the
  # cluster kernel domain (central IdP at id.${KERNEL_DOMAIN}).
  extraValues:
    global:
      # Kernel/platform domain so global.hosts.keycloak resolves to id.<kernel>
      # (e.g. id.desk.gentian.org), not id.<tenant> (404). Tenant app URLs stay
      # at meet.<tenant_id>.<kernel> via ${TENANT_ID}-prefixed host labels.
      domain: "${KERNEL_DOMAIN}"
      hosts:
        element: "chat.${TENANT_ID}"
        synapse: "matrix.${TENANT_ID}"
        jitsi: "meet.${TENANT_ID}"
        keycloak: "id"
        nubus: "portal"
        intercomService: "ics"

    containerSecurityContext:
      allowPrivilegeEscalation: false
      enabled: true
      readOnlyRootFilesystem: true
      privileged: false
      capabilities:
        drop:
          - "ALL"
      seccompProfile:
        type: "RuntimeDefault"
      runAsUser: 1993
      runAsGroup: 1993
      runAsNonRoot: true

    settings:
      keycloakClientId: "opendesk-jitsi"
      keycloakRealm: "${TENANT_ID}"

    jitsi:
      publicURL: "https://meet.${TENANT_DOMAIN}"
      web:
        replicaCount: 1
        podAnnotations:
          reloader.stakater.com/auto: "true"
        ingress:
          enabled: false
        extraConfig:
          doNotStoreRoom: true
          disableThirdPartyRequests: true
          # JWT from OIDC must drive moderator/lobby_bypass claims in Prosody.
          enableUserRolesBasedOnToken: true
        extraEnvs:
          TURN_ENABLE: "1"
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "1"
            memory: "256Mi"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {}
          privileged: false
          readOnlyRootFilesystem: false
          runAsGroup: 0
          runAsNonRoot: false
          runAsUser: 0
          seccompProfile:
            type: "RuntimeDefault"

      prosody:
        extraEnvs:
          - name: "AUTH_TYPE"
            value: "hybrid_matrix_token"
          - name: "JWT_APP_ID"
            value: "meet.${TENANT_DOMAIN}"
          # Value injected by app-default composition from internal-jwt_app_secret
          # (Helm set jitsi.prosody.extraEnvs[2].value) — must match keycloak adapter.
          - name: "JWT_APP_SECRET"
            value: ""
          - name: "MATRIX_UVS_SYNC_POWER_LEVELS"
            value: "true"
          - name: "MATRIX_UVS_URL"
            value: "http://opendesk-matrix-user-verification-service.${TENANT_NAMESPACE}.svc.cluster.local"
          - name: "TURN_HOST"
            value: "${TURN_HOST}"
          - name: "TURN_PORT"
            value: "${TURN_PORT}"
          - name: "TURNS_HOST"
            value: "${TURN_TLS_HOST}"
          - name: "TURNS_PORT"
            value: "${TURN_TLS_PORT}"
          - name: "TURN_TRANSPORT"
            value: "${TURN_TRANSPORT}"
          - name: "TURN_CREDENTIALS"
            value: "${TURN_CREDENTIALS}"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "1"
            memory: "512Mi"
        persistence:
          size: "1Gi"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {}
          privileged: false
          readOnlyRootFilesystem: false
          runAsGroup: 0
          runAsNonRoot: false
          runAsUser: 0
          seccompProfile:
            type: "RuntimeDefault"

      jicofo:
        replicaCount: 1
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "1"
            memory: "512Mi"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {}
          privileged: false
          readOnlyRootFilesystem: false
          runAsGroup: 0
          runAsNonRoot: false
          runAsUser: 0
          seccompProfile:
            type: "RuntimeDefault"

      jigasi:
        replicaCount: 0
        enabled: false
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {}
          privileged: false
          readOnlyRootFilesystem: false
          runAsGroup: 0
          runAsNonRoot: false
          runAsUser: 0
          seccompProfile:
            type: "RuntimeDefault"

      jvb:
        replicaCount: 1
        # Advertised media IP for WebRTC (UDP). Substituted from gentian-cluster-config
        # node.ip at deploy time (${NODE_IP}); override per-cluster via extraValues.
        publicIPs:
          - "${NODE_IP}"
        service:
          type: "NodePort"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "2"
            memory: "1Gi"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {}
          privileged: false
          readOnlyRootFilesystem: false
          runAsGroup: 0
          runAsNonRoot: false
          runAsUser: 0
          seccompProfile:
            type: "RuntimeDefault"

    imagePullSecrets:
      - name: registry-credentials

    # Disable the patchJVB post-install job. It hardcodes the service name as "jitsi-jvb"
    # which only works when the Helm release is named exactly "jitsi". Our operator uses
    # a generated release name (e.g. "jitsi-w8zjl-release"), so the job always fails.
    # Instead, we set jvb.publicIPs directly from NODE_IP injected by the operator and
    # use NodePort so no cloud LoadBalancer is required.
    patchJVB:
      enabled: false
