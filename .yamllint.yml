---
extends: default

# Exclude machine-generated files and Helm templates (Go template syntax breaks YAML parsing)
ignore: |
  config/crd/
  charts/gentian-os/crds/
  charts/gentian-os/templates/

rules:
  indentation:
    spaces: 2
    # ArgoCD ApplicationSets and Kubernetes manifests in this repo use the style
    # where sequence items (-) sit at the same indentation as their parent key.
    indent-sequences: false
    check-multi-line-strings: false
  line-length:
    max: 160
  # document-start (---) is optional for Helm values and Kubernetes overlay files
  document-start: disable
  # Comment alignment is not enforced — inline comments are used for documentation
  comments-indentation: disable
  truthy:
    allowed-values: ["true", "false", "yes", "no", "on", "off"]
