---
extends: default

# Exclude machine-generated files and files containing Go template syntax
# (Go template actions {{ }} break yamllint's line-length and syntax checks)
ignore: |
  # Agent worktrees and scratch state. Untracked, not repository content, and
  # they carry copies of files this config already ignores — so leaving them in
  # made the lint fail on a directory nobody edits and nothing ships.
  .claude/
  config/crd/
  # Envoy Gateway's own CRDs, copied from its chart for the operator's tests
  # (scripts/gen/gen-envoy-gateway-crds.py). Upstream's text, not ours.
  internal/controller/testdata/envoy-gateway-crds/
  charts/gentian-os/crds/
  # The operator's embedded copy of one of those CRDs, written by
  # `make manifests` and compared byte for byte with them.
  internal/profilebundle/componentprofiles.crd.yaml
  # Profile bundles as gentian-apps' build wrote them, copied byte for byte:
  # their digests are over these bytes, Compositions and inline tile art
  # included.
  internal/profilebundle/testdata/bundles/
  # And both binaries' embedded copy of all of them, written by the same
  # target (scripts/gen/gen-definitions.py). The XRDs beside them are copies
  # of crossplane/xrds/, which is linted, so they are too.
  internal/schemacheck/definitions/crds/
  charts/gentian-os/templates/
  kernel/services/llm/chart/templates/
  # Every chart under kernel/manifests/, by pattern rather than by name, for the
  # reason spelled out below: a chart added here must not be able to break CI by
  # being forgotten in this list.
  kernel/manifests/*/chart/templates/
  kernel/bootstrap/chart/templates/
  kernel/bootstrap/chart/templates/
  kernel/appsets/templates/
  kernel/data/*/templates/
  charts/infra/
  kernel/manifests/flux-crds/
  crossplane/compositions/
  crossplane/tests/unit/render/**/composition.yaml
  # What `crossplane render` printed, compared byte for byte; its line
  # lengths are the in-cluster URLs', not anyone's style.
  crossplane/tests/unit/render/**/expected.yaml
  # The appset-managed kernel services are Helm charts; everything under their
  # templates/ is Go-templated and unparseable by yamllint, exactly like
  # charts/gentian-os/templates/ above. The per-service dev/ and prod/ entries
  # that used to be listed here were deleted in that conversion; this pattern
  # replaces them and covers every service at once, so adding a service does not
  # require another line here — and does not silently break CI when someone
  # forgets. Ten services' templates/ appeared unexempted, which failed the lint
  # job on every commit and, because the docker job depends on it, meant no
  # operator image was ever published.
  kernel/services/*/manifests/templates/
  kernel/appsets/templates/


rules:
  indentation:
    spaces: 2
    # Accept both indented (Helm/standard) and non-indented (ArgoCD/kubectl) sequences.
    indent-sequences: whatever
    check-multi-line-strings: false
  line-length:
    max: 160
  # document-start (---) is optional for Helm values and Kubernetes overlay files
  document-start: disable
  # Comment alignment is not enforced — inline comments are used for documentation
  comments-indentation: disable
  truthy:
    allowed-values: ["true", "false", "yes", "no", "on", "off"]
