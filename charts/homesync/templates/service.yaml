# Where the tenant's realm reads the keys the home sync signs its statements
# with (requires.services.vouching.keys).
apiVersion: v1
kind: Service
metadata:
  name: homesync
  labels:
    app.kubernetes.io/name: homesync
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: homesync
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: keys
      port: {{ .Values.port }}
      targetPort: keys
