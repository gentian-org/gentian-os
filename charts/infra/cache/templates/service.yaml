apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cache.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "cache.selectorLabels" . | nindent 4 }}
  ports:
    - name: tcp-cache
      port: {{ .Values.port }}
      targetPort: cache
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-headless
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cache.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "cache.selectorLabels" . | nindent 4 }}
  ports:
    - name: tcp-cache
      port: {{ .Values.port }}
      targetPort: cache
