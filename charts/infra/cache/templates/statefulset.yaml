{{- $image := .Values.image -}}
{{- /* The env values ConfigMap writes an empty `global:` on a cluster that
     names neither a storage class nor a pull secret, and null replaces the
     whole map. */ -}}
{{- $global := .Values.global | default dict -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cache.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ .Release.Name }}-headless
  selector:
    matchLabels:
      {{- include "cache.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cache.labels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      {{- with $global.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: cache
          image: {{ printf "%s/%s:%s@%s" $image.registry $image.repository $image.tag $image.digest }}
          imagePullPolicy: {{ $image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          # The users are the ones the operator's Jobs saved (ACL SAVE). The
          # default user is written anew at every start, with the hash of the
          # password in the Secret, so a rotated password takes at the next
          # start. It goes into the file because, with an ACL file in use,
          # Valkey takes every user from the file, the default user included.
          #
          # redis-server and redis-cli are the names the Valkey and the Redis
          # images both ship, so the image alone chooses the engine.
          args:
            - |
              set -eu
              touch /data/users.acl
              sed -i '/^user default /d' /data/users.acl
              hash="$(printf '%s' "$REDISCLI_AUTH" | sha256sum | cut -d' ' -f1)"
              printf 'user default on #%s ~* &* +@all\n' "$hash" >> /data/users.acl
              exec redis-server --port {{ .Values.port }} --dir /data \
                --aclfile /data/users.acl \
                --appendonly yes --save ''
          env:
            # The password, under the name redis-cli reads it by, so the
            # probes below authenticate.
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ required "auth.existingSecret" .Values.auth.existingSecret }}
                  key: {{ .Values.auth.existingSecretPasswordKey }}
          ports:
            - name: cache
              containerPort: {{ .Values.port }}
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", 'redis-cli ping | grep -qE "PONG|LOADING"']
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 6
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", 'redis-cli ping | grep -q PONG']
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 5
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: cache-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: cache-data
        labels:
          {{- include "cache.selectorLabels" . | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $global.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
