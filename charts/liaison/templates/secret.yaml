{{- /* The key the chaperone presents. Empty while the contract between the two is not granted: the
     liaison then accepts nothing from it. */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "liaison.fullname" . }}
  labels:
    {{- include "liaison.labels" . | nindent 4 }}
type: Opaque
stringData:
  CHAPERONE_KEY: {{ .Values.chaperone.key | quote }}
