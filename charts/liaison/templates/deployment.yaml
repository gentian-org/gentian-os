apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "liaison.fullname" . }}
  labels:
    {{- include "liaison.labels" . | nindent 4 }}
spec:
  # One: a sign-in a person started is held in memory until they come back.
  replicas: 1
  selector:
    matchLabels:
      {{- include "liaison.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "liaison.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: liaison
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/liaison"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          env:
            - name: OIDC_ISSUER
              value: {{ .Values.auth.issuer | quote }}
            - name: OIDC_OWN_AUDIENCE
              value: {{ .Values.auth.ownAudience | quote }}
            - name: OIDC_EDGE_AUDIENCE
              value: {{ .Values.auth.edgeAudience | quote }}
            - name: LIAISON_HOST
              value: {{ .Values.host | quote }}
            - name: DESKTOP_HOST
              value: {{ .Values.desktopHost | quote }}
            - name: CLIENT_NAME
              value: {{ .Values.clientName | quote }}
            - name: CHAPERONE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "liaison.fullname" . }}
                  key: CHAPERONE_KEY
          envFrom:
            # RIGHTS_CHECK_KEY, the liaison's component key, and CONFIDANT_URL.
            # Optional: a platform that has no confidant writes no such
            # Secret, and the liaison then starts and says so on every use.
            - secretRef:
                name: {{ .Values.componentKey.secretName }}
                optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
