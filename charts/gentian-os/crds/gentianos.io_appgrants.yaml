              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AppGrantSpec defines tenant-approved integration permissions
              for one installed app.
            properties:
              allowConsumers:
                description: AllowConsumers controls which other installed apps may
                  invoke this app's provides contracts.
                items:
                  description: AllowConsumerSpec permits another installed app to
                    call a provided contract.
