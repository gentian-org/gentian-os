---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: tenantexportschedules.gentianos.io
spec:
  group: gentianos.io
  names:
    kind: TenantExportSchedule
    listKind: TenantExportScheduleList
    plural: tenantexportschedules
    shortNames:
    - texs
    singular: tenantexportschedule
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.schedule
      name: Schedule
      type: string
    - jsonPath: .spec.suspend
      name: Suspended
      type: boolean
    - jsonPath: .status.lastScheduleTime
      name: Last
      type: date
    - jsonPath: .status.lastSuccessfulTime
      name: Last-Success
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: TenantExportSchedule creates TenantExports on a cron schedule.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              TenantExportScheduleSpec takes exports on a schedule and expires old ones.

              A CronJob applying TenantExports would have worked, but it would need an
              image, a ServiceAccount and RBAC in every tenant namespace, and it would have
              nowhere to record what it had done. Reconciling the schedule keeps the whole
              thing in one place and makes "when did this last run, and did it work"
              answerable from the resource itself.
            properties:
              apps:
                description: Apps limits each export to these profiles. Empty captures
                  everything.
                items:
                  type: string
                type: array
              encryption:
                description: |-
                  Encryption for the exports this schedule creates. Defaults to the
                  cluster's recipients, which is the only mode that works unattended — a
                  passphrase has nobody to type it at 03:00.
                properties:
                  mode:
                    default: recipient
                    description: Mode selects the protection. Defaults to recipient.
                    enum:
                    - recipient
                    - passphrase
                    type: string
                  passphraseSecretRef:
                    description: |-
                      PassphraseSecretRef names a Secret in this tenant's namespace holding the
                      passphrase, used with mode: passphrase.

                      A reference rather than a literal: a passphrase written into the spec
                      would be readable by anyone who can get the resource, would sit in
                      etcd, and would be echoed back by every kubectl get. The controller
                      copies the Secret next to the capture Job and removes the copy when the
                      export finishes.
                    properties:
                      key:
                        description: Key defaults to "passphrase".
                        type: string
                      name:
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  recipients:
                    description: |-
                      Recipients are age public keys (age1…) to encrypt to, used with
                      mode: recipient. When empty the cluster's configured recipients are
                      used; naming them here instead lets an admin encrypt to a key the
                      platform has no identity for, so the bundle is readable only by them.

                      Every listed recipient can decrypt independently, so this is also how an
                      export is made readable both by its requester and by platform escrow.
                    items:
                      type: string
                    type: array
                type: object
              keepLast:
                description: |-
                  KeepLast retains this many finished exports and deletes the rest.

                  Retention has to be someone's job or bundles accumulate until the bucket
                  is the problem. Zero means keep everything, which is a decision rather
                  than a default: it is the right answer only when something else prunes.
                format: int32
                minimum: 0
                type: integer
              schedule:
                description: |-
                  Schedule is a five-field cron expression, interpreted in UTC.

                  UTC and not the cluster's zone: a schedule that silently shifts by an
                  hour twice a year is a schedule nobody can reason about during an
                  incident.
                minLength: 1
                type: string
              suspend:
                description: Suspend stops new exports without deleting the schedule
                  or its history.
                type: boolean
            required:
            - schedule
            type: object
          status:
            description: TenantExportScheduleStatus reports what the schedule has
              done.
            properties:
              conditions:
                description: |-
                  Conditions carry Ready, which is False when the schedule is unusable
                  (an invalid expression) rather than merely idle.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastExportName:
                description: |-
                  LastExportName is the export created then, so the outcome is one lookup
                  away rather than a search through the namespace.
                type: string
              lastScheduleTime:
                description: LastScheduleTime is when an export was last created.
                format: date-time
                type: string
              lastSuccessfulTime:
                description: |-
                  LastSuccessfulTime is when an export from this schedule last reached
                  Ready. A schedule that is firing but never succeeding looks healthy by
                  every other measure, which is exactly the failure a backup regime cannot
                  afford; this is the field that gives it away.
                format: date-time
                type: string
              nextScheduleTime:
                description: NextScheduleTime is when the next export is due.
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
