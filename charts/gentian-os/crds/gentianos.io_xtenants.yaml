---
# Minimal XTenant CRD stub for envtest.
# The real schema is defined by the Crossplane XRD (crossplane/xrds/tenant.yaml);
# this stub exists only so that the envtest environment can load the CRD and the
# TenantReconciler can create/watch XTenant composites during unit tests.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: xtenants.gentianos.io
spec:
  group: gentianos.io
  names:
    kind: XTenant
    listKind: XTenantList
    plural: xtenants
    singular: xtenant
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
