                                  items:
                                    type: string
                                  type: array
                                redirectUris:
                                  description: |-
                                    RedirectURIs lists the valid OAuth2 redirect URIs for the authorization
                                    code flow. Supports ${TENANT_DOMAIN} substitution.
                                  items:
                                    type: string
                                  type: array
                              required:
                              - clientId
                              type: object
                          type: object
                        mail:
                          description: Mail specifies SMTP and/or IMAP requirements.
                          properties:
                            imap:
                              description: IMAP requests inbound mail (IMAP) credentials.
                              properties:
                                port:
                                  default: 993
                                  description: Port is the IMAP port.
                                  format: int32
                                  type: integer
                              type: object
                            smtp:
                              description: SMTP requests outbound mail (SMTP submission)
                                credentials.
                              properties:
                                auth:
                                  description: Auth is the SMTP authentication mechanism.
                                  enum:
                                  - plain
                                  - login
                                  - cram-md5
                                  type: string
                                port:
                                  default: 587
                                  description: Port is the SMTP submission port.
                                  format: int32
                                  type: integer
                              type: object
                          type: object
                        mcp:
                          description: |-
                            MCP specifies a Model Context Protocol server requirement.
                            When enabled, the orchestrator registers the app's MCP endpoint in the
                            kernel MCP registry and wires OIDC authentication.
                          properties:
                            auth:
                              default: oidc
                              description: Auth is the authentication method for MCP
                                calls.
                              enum:
                              - oidc
                              - none
                              type: string
                            enabled:
                              default: true
                              description: Enabled activates MCP endpoint registration.
                              type: boolean
                            endpoint:
                              default: /mcp
                              description: Endpoint is the HTTP path where the app
                                exposes its MCP server.
                              pattern: ^/.*
                              type: string
                          required:
                          - enabled
                          type: object
                        storage:
                          description: Storage specifies object storage (S3) and/or
                            filesystem (WebDAV) requirements.
                          properties:
                            files:
                              description: Files requests WebDAV access to the tenant's
                                Nextcloud instance.
                              properties:
                                capabilities:
                                  description: Capabilities lists the required access
                                    capabilities.
                                  items:
                                    type: string
                                  type: array
                                protocol:
                                  default: webdav
                                  description: Protocol is the access protocol. Currently
                                    only webdav is supported.
                                  enum:
                                  - webdav
                                  type: string
                              type: object
                            s3:
                              description: S3 requests a per-tenant S3 bucket via
                                the MinIO kernel service.
                              properties:
                                bucketPerTenant:
                                  default: true
                                  description: BucketPerTenant creates a dedicated
                                    bucket for each tenant. Defaults to true.
                                  type: boolean
                              type: object
                          type: object
                      type: object
                    name:
                      description: |-
                        Name identifies the sidecar (e.g. "jitsi"). OpenBao paths and OIDC jobs
                        use the synthetic app key {parentProfile}-{name} (e.g. "element-jitsi").
                      minLength: 1
                      pattern: ^[a-z0-9-]+$
                      type: string
                    stableServiceName:
                      description: |-
                        StableServiceName is the Kubernetes Service name the tenant ingress
                        reconciler routes to (e.g. "jitsi-web"). When set, the composition emits
                        a stable ClusterIP alias pointing at the sidecar release.
                      type: string
                    stableServicePort:
                      default: 80
                      description: StableServicePort is the port on StableServiceName.
                        Defaults to 80.
                      format: int32
                      type: integer
