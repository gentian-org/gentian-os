---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: appprofiles.gentianos.io
spec:
  group: gentianos.io
  names:
    kind: AppProfile
    listKind: AppProfileList
    plural: appprofiles
    shortNames:
    - ap
    - aps
    singular: appprofile
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Display Name
      type: string
    - jsonPath: .spec.family
      name: Family
      type: string
    - jsonPath: .spec.catalogueVersion
      name: Cat.Version
      type: string
    - jsonPath: .spec.edition
      name: Edition
      type: string
    - jsonPath: .spec.trustTier
      name: Trust
      type: string
    - jsonPath: .spec.license
      name: License
      type: string
    - jsonPath: .spec.chart.name
      name: Chart
      type: string
    - jsonPath: .spec.chart.version
      name: Chart Ver
      type: string
    - jsonPath: .spec.deploymentMethod
      name: Method
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AppProfile is the Schema for the appprofiles API.

          AppProfile is cluster-scoped — one per app type, shared across all tenants.
          An AppProfile wraps an upstream Helm chart with the schema-based value
          mapping and kernel requirements that the orchestrator needs to provision
          and wire the app for any tenant.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AppProfileSpec defines the desired state of AppProfile.
            properties:
              additionalIngresses:
                description: |-
                  AdditionalIngresses declares extra Ingress resources to create alongside
                  the primary Ingress. Use this when an app requires a second hostname
                  routed to the same (or a different) Service — for example, CryptPad
                  requires a separate sandbox subdomain for its client-side iframe
                  isolation model (httpSafeOrigin must differ from httpUnsafeOrigin).
                  Each entry is treated identically to Ingress: the orchestrator creates
                  one Kubernetes Ingress per entry with its own host, TLS secret reference,
                  and lifecycle management (stale entries are deleted on app removal).
                items:
                  description: IngressSpec declares how the orchestrator should expose
                    this app via HTTP(S).
                  properties:
                    annotations:
                      additionalProperties:
                        type: string
                      description: |-
                        Annotations are merged into the Ingress object metadata.
                        Use to set ingress class, NGINX configuration snippets, etc.
                      type: object
                    clusterIssuer:
                      default: letsencrypt-http01
                      description: |-
                        ClusterIssuer is reserved for future per-app issuer overrides. Tenant app
                        ingress TLS is issued by the operator as one DNS-01 wildcard per tenant
                        (*.<effectiveDomain>); see TenantDNS01ClusterIssuer / TENANT_DNS01_CLUSTER_ISSUER.
                        Defaults to "letsencrypt-http01" when not set (not used by the ingress reconciler today).
                        See docs/design/multi-tenancy.md §3.
                      type: string
                    ingressClassName:
                      default: nginx
                      description: |-
                        IngressClassName is the Kubernetes IngressClass to use.
                        Defaults to "nginx" when not set.
                      type: string
                    serviceName:
                      description: |-
                        ServiceName is the Kubernetes Service name that the Helm chart creates.
                        Defaults to the AppProfile name (chart name) when not set.
                      type: string
                    servicePort:
                      default: 80
                      description: ServicePort is the port on the Service to route
                        traffic to.
                      format: int32
                      type: integer
                    subDomain:
                      description: |-
                        SubDomain is the subdomain prefix prepended to the tenant domain to form the
                        Ingress host, e.g. "files" yields "files.{tenant-domain}".
                        Defaults to the app profile name (chart name) when not set.
                      type: string
                    tlsEnabled:
                      default: true
                      description: |-
                        TLSEnabled enables TLS via a cert-manager Certificate CR.
                        Defaults to true.
                      type: boolean
                  type: object
                type: array
              appSecrets:
                description: |-
                  AppSecrets declares app-internal secrets (admin passwords, session keys,
                  cluster tokens) that don't correspond to any kernel function. The
                  orchestrator generates these deterministically (HMAC-SHA256 from master
                  password + tenant + app + secret name), stores them in OpenBao, and syncs
                  them via ExternalSecret.
                items:
                  description: |-
                    AppSecret declares an app-internal secret the orchestrator must generate
                    and inject. These are credentials the app needs (admin passwords, session
                    signing keys, cluster tokens) that are not provided by any kernel service.
                  properties:
                    name:
                      description: |-
                        Name is the logical identifier for this secret (e.g., "admin_password").
                        Used as the suffix in the OpenBao path:
                        gentian-os/tenants/{tenant}/apps/{app}/internal/{name}
                      maxLength: 64
                      minLength: 1
                      pattern: ^[a-z0-9_]+$
                      type: string
                    valuePath:
                      description: |-
                        ValuePath is the dot-notation (or bracket-notation) Helm value key that
                        should receive the generated secret value.
                      minLength: 1
                      type: string
                  required:
                  - name
                  - valuePath
                  type: object
                type: array
              browserProxy:
                description: |-
                  BrowserProxy declares HTTP routes the shell backend should transparently
                  proxy on behalf of browser clients. Each route is exposed at
                  /api/apps/{appName}/{route.path} on the shell server and forwarded to
                  the app's cluster-internal service. Use this to give the shell CORS-safe
                  access to an app's API without embedding app credentials in the browser.
                  Supports {name} (app profile name) and {namespace} (tenant namespace)
                  as runtime template variables in the target field.
                items:
                  description: BrowserProxyRoute declares a single proxy route the
                    shell exposes for this app.
                  properties:
                    authMode:
                      default: forward-bearer
                      description: |-
                        AuthMode controls how the forwarded request is authenticated.
                        forward-bearer: the requesting user's bearer token is forwarded
                        to the upstream (default). none: unauthenticated passthrough
                        for public endpoints.
                      enum:
                      - forward-bearer
                      - none
                      type: string
                    path:
                      description: |-
                        Path is the route suffix exposed on the shell proxy, e.g. "api"
                        yields /api/apps/{appName}/api. Must not contain leading or
                        trailing slashes. Use kebab-case for multi-segment suffixes.
                      minLength: 1
                      pattern: ^[a-z0-9][a-z0-9/-]*[a-z0-9]$|^[a-z0-9]$
                      type: string
                    stripPrefix:
                      default: true
                      description: |-
                        StripPrefix removes the /api/apps/{appName}/{path} prefix before
                        forwarding to the upstream target. Defaults to true.
                      type: boolean
                    target:
                      description: |-
                        Target is the upstream base URL to forward requests to.
                        Supports {name} (app profile name) and {namespace} (tenant
                        namespace) as runtime template variables.
                        Example: "http://{name}.{namespace}.svc/api/v3/"
                      minLength: 1
                      type: string
                  required:
                  - path
                  - target
                  type: object
                type: array
              catalogueVersion:
                default: 1.0.0
                description: |-
                  CatalogueVersion is the semver of this catalogue entry (immutable once published).
                  Distinct from spec.chart.version (upstream Helm chart pin).
                pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[\w.-]+)?(?:\+[\w.-]+)?$
                type: string
              chart:
                description: Chart references the upstream Helm chart for this app.
                properties:
                  name:
                    description: Name is the chart name within the repository.
                    minLength: 1
                    type: string
                  repository:
                    description: Repository is the OCI repository URL (e.g., oci://registry.example.com/charts).
                    minLength: 1
                    type: string
                  version:
                    description: Version is the chart version to deploy.
                    minLength: 1
                    type: string
                required:
                - name
                - repository
                - version
                type: object
              compositionRef:
                description: |-
                  CompositionRef overrides the Crossplane Composition used to deploy this
                  app. When empty the XRD default (app-default) applies. Set to the name
                  of a profile-scoped composition shipped in gentian-apps/profiles/<name>/composition.yaml
                  (e.g. "app-element", "app-ox") for profiles that require custom MR graphs.
                type: string
              deploymentMethod:
                default: crossplane
                description: |-
                  DeploymentMethod controls how the orchestrator deploys this app.
                  Defaults to crossplane. Use argocd for kernel-layer services managed
                  directly by the cache or identity reconcilers.
                enum:
                - argocd
                - crossplane
                type: string
              description:
                description: Description is an optional human-readable description.
                type: string
              displayName:
                description: DisplayName is a human-readable name for the application.
                maxLength: 128
                minLength: 1
                type: string
              edition:
                default: full
                description: Edition selects the feature / footprint variant (minimal,
                  full, performant, …).
                enum:
                - minimal
                - standard
                - full
                - performant
                type: string
              extraValues:
                description: |-
                  ExtraValues provides an escape hatch for non-standard values that don't
                  fit the typed valueMapping schema. Merged into the rendered Helm values.
                  Must not contain secrets — use appSecrets for secret values.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              family:
                description: |-
                  Family is the stable logical application id shared across catalogue revisions
                  (versions and flavors). When empty the App Store controller defaults it to
                  metadata.name. Use the same family for every immutable revision of one app.
                maxLength: 63
                pattern: ^[a-z0-9]([a-z0-9\-]*[a-z0-9])?$
                type: string
              ingress:
                description: |-
                  Ingress declares the HTTP routing configuration for this app.
                  When set, the orchestrator creates a Kubernetes Ingress resource and a
                  cert-manager Certificate CR for TLS.
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: |-
                      Annotations are merged into the Ingress object metadata.
                      Use to set ingress class, NGINX configuration snippets, etc.
                    type: object
                  clusterIssuer:
                    default: letsencrypt-http01
                    description: |-
                      ClusterIssuer is reserved for future per-app issuer overrides. Tenant app
                      ingress TLS is issued by the operator as one DNS-01 wildcard per tenant
                      (*.<effectiveDomain>); see TenantDNS01ClusterIssuer / TENANT_DNS01_CLUSTER_ISSUER.
                      Defaults to "letsencrypt-http01" when not set (not used by the ingress reconciler today).
                      See docs/design/multi-tenancy.md §3.
                    type: string
                  ingressClassName:
                    default: nginx
                    description: |-
                      IngressClassName is the Kubernetes IngressClass to use.
                      Defaults to "nginx" when not set.
                    type: string
                  serviceName:
                    description: |-
                      ServiceName is the Kubernetes Service name that the Helm chart creates.
                      Defaults to the AppProfile name (chart name) when not set.
                    type: string
                  servicePort:
                    default: 80
                    description: ServicePort is the port on the Service to route traffic
                      to.
                    format: int32
                    type: integer
                  subDomain:
                    description: |-
                      SubDomain is the subdomain prefix prepended to the tenant domain to form the
                      Ingress host, e.g. "files" yields "files.{tenant-domain}".
                      Defaults to the app profile name (chart name) when not set.
                    type: string
                  tlsEnabled:
                    default: true
                    description: |-
                      TLSEnabled enables TLS via a cert-manager Certificate CR.
                      Defaults to true.
                    type: boolean
                type: object
              kernelRequirements:
                description: KernelRequirements declares which kernel services this
                  app requires.
                properties:
                  cache:
                    description: Cache specifies a caching backend requirement.
                    properties:
                      engine:
                        default: redis
                        description: Engine selects the caching backend. Defaults
                          to redis.
                        enum:
                        - redis
                        - memcached
                        type: string
                    type: object
                  database:
                    description: Database specifies a relational database requirement.
                    properties:
                      allowDynamicDatabaseCreation:
                        default: false
                        description: |-
                          AllowDynamicDatabaseCreation grants the app user privileges to create new databases
                          dynamically at runtime (e.g. GRANT ALL PRIVILEGES ON *.*). Use with caution.
                          Only supported by the mariadb engine.
                        type: boolean
                      databasePerTenant:
                        default: true
                        description: |-
                          DatabasePerTenant creates a separate database for each tenant (default true).
                          Set to false only for shared-schema apps.
                        type: boolean
                      engine:
                        default: postgresql
                        description: Engine selects the database engine. Defaults
                          to postgresql.
                        enum:
                        - postgresql
                        - mariadb
                        type: string
                    type: object
                  identity:
                    description: Identity specifies OIDC requirements.
                    properties:
                      ldap:
                        description: |-
                          LDAP is retained for AppProfile catalogue compatibility. Legacy OpenDesk
                          profiles still declare ldap blocks; the operator no longer provisions LDAP.
                        properties:
                          interval:
                            description: Interval is the sync interval (e.g., "1h").
                            pattern: ^[0-9]+(s|m|h|d)$
                            type: string
                          search:
                            description: Search documents a per-tenant LDAP search
                              account in legacy profiles.
                            type: boolean
                          sync:
                            description: Sync documents periodic LDAP sync in legacy
                              profiles.
                            type: boolean
                        type: object
                      oidc:
                        description: |-
                          OIDC describes the OIDC client to register in the tenant's Keycloak realm.
                          When set, the composition emits a Client CR so every newly deployed tenant
                          automatically gets the correct Keycloak client without manual setup.
                          Leave unset for apps whose Keycloak client is managed externally
                          (e.g. kernel-realm clients managed via keycloak-config).
                        properties:
                          accessType:
                            default: PUBLIC
                            description: |-
                              AccessType controls whether the client requires a shared secret
                              (CONFIDENTIAL, for server-side apps) or relies on PKCE without a secret
                              (PUBLIC, for SPAs and mobile apps). Defaults to PUBLIC.
                            enum:
                            - PUBLIC
                            - CONFIDENTIAL
                            type: string
                          backchannelLogoutUrl:
                            description: |-
                              BackchannelLogoutURL is the endpoint Keycloak calls for backchannel logout
                              notifications (RFC 7009). Supports ${TENANT_DOMAIN} substitution.
                            type: string
                          clientId:
                            description: ClientID is the OIDC client identifier registered
                              in Keycloak.
                            minLength: 1
                            type: string
                          directAccessGrantsEnabled:
                            description: |-
                              DirectAccessGrantsEnabled enables the Resource Owner Password Credentials
                              grant (legacy / CLI apps). Defaults to false.
                            type: boolean
                          name:
                            description: |-
                              Name is the human-readable display name shown in the Keycloak admin UI.
                              Defaults to ClientID when empty.
                            type: string
                          oidcPackRef:
                            description: |-
                              OIDCPackRef selects a pack entry from an OIDCPackCatalog CR when the
                              pack key differs from clientId. When empty, clientId is used as the pack key.
                            type: string
                          postLogoutRedirectUris:
                            description: |-
                              PostLogoutRedirectURIs lists the allowed post-logout redirect URIs.
                              Supports ${TENANT_DOMAIN} substitution.
                            items:
                              type: string
                            type: array
                          redirectUris:
                            description: |-
                              RedirectURIs lists the valid OAuth2 redirect URIs for the authorization
                              code flow. Supports ${TENANT_DOMAIN} substitution.
                            items:
                              type: string
                            type: array
                        required:
                        - clientId
                        type: object
                    type: object
                  mail:
                    description: Mail specifies SMTP and/or IMAP requirements.
                    properties:
                      imap:
                        description: IMAP requests inbound mail (IMAP) credentials.
                        properties:
                          port:
                            default: 993
                            description: Port is the IMAP port.
                            format: int32
                            type: integer
                        type: object
                      smtp:
                        description: SMTP requests outbound mail (SMTP submission)
                          credentials.
                        properties:
                          auth:
                            description: Auth is the SMTP authentication mechanism.
                            enum:
                            - plain
                            - login
                            - cram-md5
                            type: string
                          port:
                            default: 587
                            description: Port is the SMTP submission port.
                            format: int32
                            type: integer
                        type: object
                    type: object
                  mcp:
                    description: |-
                      MCP specifies a Model Context Protocol server requirement.
                      When enabled, the orchestrator registers the app's MCP endpoint in the
                      kernel MCP registry and wires OIDC authentication.
                    properties:
                      auth:
                        default: oidc
                        description: Auth is the authentication method for MCP calls.
                        enum:
                        - oidc
                        - none
                        type: string
                      enabled:
                        default: true
                        description: Enabled activates MCP endpoint registration.
                        type: boolean
                      endpoint:
                        default: /mcp
                        description: Endpoint is the HTTP path where the app exposes
                          its MCP server.
                        pattern: ^/.*
                        type: string
                    required:
                    - enabled
                    type: object
                  storage:
                    description: Storage specifies object storage (S3) and/or filesystem
                      (WebDAV) requirements.
                    properties:
                      files:
                        description: Files requests WebDAV access to the tenant's
                          Nextcloud instance.
                        properties:
                          capabilities:
                            description: Capabilities lists the required access capabilities.
                            items:
                              type: string
                            type: array
                          protocol:
                            default: webdav
                            description: Protocol is the access protocol. Currently
                              only webdav is supported.
                            enum:
                            - webdav
                            type: string
                        type: object
                      s3:
                        description: S3 requests a per-tenant S3 bucket via the MinIO
                          kernel service.
                        properties:
                          bucketPerTenant:
                            default: true
                            description: BucketPerTenant creates a dedicated bucket
                              for each tenant. Defaults to true.
                            type: boolean
                        type: object
                    type: object
                type: object
              license:
                description: |-
                  License is the SPDX license identifier for this catalogue entry (e.g. Apache-2.0).
                  Pro profiles in gentian-pro typically use proprietary.
                type: string
              logo:
                description: |-
                  Logo is deprecated; prefer spec.tile. Application icon data URI for the portal.
                  The portal reconciler writes the resolved value to pathToLogo on portal entries.
                pattern: ^data:image/svg\+xml;base64,[A-Za-z0-9+/]+=*$
                type: string
              optionalIntegrations:
                description: OptionalIntegrations lists contracts this app can consume
                  when available.
                items:
                  description: IntegrationRef identifies an optional integration contract
                    this app can consume.
                  properties:
                    capabilities:
                      description: Capabilities lists the specific capabilities required
                        from the contract.
                      items:
                        type: string
                      type: array
                    contract:
                      description: Contract is the name of the contract to consume.
                      minLength: 1
                      type: string
                    provider:
                      description: Provider is the expected provider app by profile
                        name.
                      type: string
                  required:
                  - contract
                  type: object
                type: array
              portalTiles:
                description: |-
                  PortalTiles defines the tiles this app contributes to the Nubus/gentian-ui
                  portal when deployed for a tenant in dedicated mode. Each tile creates a
                  UDM portal entry under swp.{tile.name}_{tenantName}.
                  Requires ingress.subDomain to be set (used as the tile base URL).
                  When empty no per-tenant portal entries are created.
                items:
                  description: |-
                    PortalTileSpec defines a single tile this app contributes to the portal when
                    deployed for a tenant in dedicated mode.
                  properties:
                    allowedGroup:
                      default: Domain Users
                      description: |-
                        AllowedGroup is the Keycloak group whose members can see this tile.
                        Defaults to "Domain Users" (all authenticated portal users).
                        Use managed-by-attribute-{Capability} groups (e.g., "managed-by-attribute-Groupware")
                        to restrict to users with a specific provisioned capability.
                      type: string
                    displayName:
                      additionalProperties:
                        type: string
                      description: |-
                        DisplayName is the localized label shown in the portal.
                        Locale keys follow the UDM convention (e.g., "de_DE", "en_US").
                        At least one entry is required.
                      type: object
                    linkSuffix:
                      description: |-
                        LinkSuffix is appended to the app's base URL
                        (https://{ingress.subDomain}.{tenantDomain}) to deep-link into a sub-app.
                        Example: "#app=io.ox/mail". Defaults to empty (root URL).
                      type: string
                    linkTarget:
                      allOf:
                      - enum:
                        - newwindow
                        - samewindow
                        - embedded
                      - enum:
                        - newwindow
                        - samewindow
                        - embedded
                      default: newwindow
                      description: |-
                        LinkTarget controls how the portal opens the tile.
                        newwindow opens in a new browser tab (default).
                        embedded opens inside the gentian-ui window manager (iframe).
                      type: string
                    logo:
                      description: Logo is deprecated; prefer tile. Optional per-tile
                        data URI override.
                      pattern: ^data:image/svg\+xml;base64,[A-Za-z0-9+/]+=*$
                      type: string
                    name:
                      description: |-
                        Name is the unique tile identifier, forming the portal entry CN:
                        swp.{name}_{tenantName}. Must be unique within an AppProfile. Use kebab-case.
                      minLength: 1
                      pattern: ^[a-z0-9-]+$
                      type: string
                    tile:
                      description: Tile overrides the app-level tile for this portal
                        entry.
                      properties:
                        icon:
                          description: Icon selects a pre-made tile from the Gentian
                            catalogue (path 2).
                          pattern: ^[a-z][a-z0-9-]*$
                          type: string
                        image:
                          description: |-
                            Image is a profile-relative SVG path used in git only (e.g. assets/tile.svg).
                            Run scripts/sync-profile-tile.py to inline into tile.logo before commit.
                          type: string
                        logo:
                          description: Logo is a custom tile as a data URI (path 1).
                            Mutually exclusive with icon.
                          pattern: ^data:image/svg\+xml;base64,[A-Za-z0-9+/]+=*$
                          type: string
                      type: object
                  required:
                  - displayName
                  - name
                  type: object
                type: array
              provides:
                description: Provides lists the integration contracts this app can
                  act as a provider for.
                items:
                  description: ContractRef identifies an integration contract this
                    app provides.
                  properties:
                    name:
                      description: Name is the contract name (e.g., "file-store",
                        "project-management").
                      minLength: 1
                      pattern: ^[a-z0-9-]+$
                      type: string
                    protocol:
                      description: Protocol is the technical protocol used (e.g.,
                        "http-json", "webdav").
                      type: string
                  required:
                  - name
                  type: object
                type: array
              provisioning:
                description: |-
                  Provisioning configures how Gentian maps workspace groups to in-app roles.
                  Members of gentian:tenant:<t>:app-admins are reconciled into the privileged
                  role declared here when the app is installed for a tenant.
                properties:
                  privilegedRole:
                    description: |-
                      PrivilegedRole maps gentian:tenant:<t>:app-admins members to an in-app
                      administrator role (for example the Nextcloud "admin" group).
                    properties:
                      kind:
                        allOf:
                        - enum:
                          - group
                        - enum:
                          - group
                        description: Kind is the application's native role type. Only
                          "group" is supported today.
                        type: string
                      name:
                        description: Name is the in-app role identifier (for example
                          Nextcloud group "admin").
                        maxLength: 64
                        minLength: 1
                        type: string
                    required:
                    - kind
                    - name
                    type: object
                type: object
              security:
                description: |-
                  Security declares MAC and other security requests for this catalogue entry.
                  Cluster administrators approve waivers via PlatformSecurityPolicy.
                properties:
                  macWaivers:
                    description: |-
                      MacWaivers lists Kyverno MAC policies the app may need when upstream charts
                      cannot satisfy baseline pod security (for example s6-based init as root).
                    items:
                      description: MacWaiverRequest identifies a MAC policy exception
                        scope requested by the profile.
                      properties:
                        policy:
                          description: Policy is the Kyverno ClusterPolicy name (for
                            example gentian-require-non-root).
                          minLength: 1
                          type: string
                        scope:
                          description: Scope narrows the waiver to a composition component
                            (for example sidecar-jitsi).
                          minLength: 1
                          type: string
                      required:
                      - policy
                      - scope
                      type: object
                    type: array
                type: object
              sidecars:
                description: |-
                  Sidecars declares companion services deployed by purpose-built compositions
                  alongside the primary app (for example Jitsi with Element). Sidecar OIDC
                  clients and internal secrets use the synthetic app key {profile}-{sidecar}.
                items:
                  description: |-
                    AppSidecarSpec declares a companion service deployed alongside the primary
                    app by a purpose-built composition (for example Jitsi with Element).
                  properties:
                    appSecrets:
                      description: |-
                        AppSecrets are sidecar-internal secrets stored at
                        gentian-os/tenants/{tenant}/apps/{parent}-{name}/internal/{secret}.
                      items:
                        description: |-
                          AppSecret declares an app-internal secret the orchestrator must generate
                          and inject. These are credentials the app needs (admin passwords, session
                          signing keys, cluster tokens) that are not provided by any kernel service.
                        properties:
                          name:
                            description: |-
                              Name is the logical identifier for this secret (e.g., "admin_password").
                              Used as the suffix in the OpenBao path:
                              gentian-os/tenants/{tenant}/apps/{app}/internal/{name}
                            maxLength: 64
                            minLength: 1
                            pattern: ^[a-z0-9_]+$
                            type: string
                          valuePath:
                            description: |-
                              ValuePath is the dot-notation (or bracket-notation) Helm value key that
                              should receive the generated secret value.
