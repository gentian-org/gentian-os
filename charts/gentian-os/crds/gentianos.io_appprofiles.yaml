                          minLength: 1
                          type: string
                        version:
                          description: Version is the chart version to deploy.
                          minLength: 1
                          type: string
                      required:
                      - name
                      - repository
                      - version
                      type: object
                    extraValues:
                      description: ExtraValues are merged into the sidecar Helm release
