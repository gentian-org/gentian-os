---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: backuppolicies.gentianos.io
spec:
  group: gentianos.io
  names:
    kind: BackupPolicy
    listKind: BackupPolicyList
    plural: backuppolicies
    shortNames:
    - bkpol
    singular: backuppolicy
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.destination.endpoint
      name: Endpoint
      type: string
    - jsonPath: .spec.destination.bucket
      name: Bucket
      type: string
    - jsonPath: .spec.schedule
      name: Schedule
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          BackupPolicy is the cluster-wide default for tenant backups.

          Cluster-scoped and singleton by convention (`default`): a second one would
          leave "which destination applies" answerable two ways.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BackupPolicySpec is the cluster's default backup arrangement.
            properties:
              allowTenantOverride:
                default: true
                description: |-
                  AllowTenantOverride lets a tenant point its bundles at its own storage.

                  On by default. Turning it off is how an operator keeps every tenant's
                  bundles in one place they control — worth stating, because a tenant
                  writing to storage the platform cannot read is also a tenant the
                  platform cannot help restore.
                type: boolean
              destination:
                description: Destination is where bundles are written unless a tenant
                  overrides it.
                properties:
                  bucket:
                    description: Bucket holds the bundles. Empty keeps the per-tenant
                      default name.
                    maxLength: 63
                    pattern: ^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$
                    type: string
                  credentialsSecretRef:
                    description: |-
                      CredentialsSecretRef holds accessKey and secretKey for the endpoint.

                      Required whenever Endpoint is set: the platform's own MinIO credentials
                      authenticate to the platform's own MinIO and nothing else, and quietly
                      reusing them against someone else's endpoint would send a tenant's data
                      to a store it cannot open. Cluster policy reads this from the kernel
                      namespace; a tenant's policy reads it from that tenant's namespace, so a
                      tenant can never name a Secret it does not own.
                    properties:
                      key:
                        description: Key defaults to "passphrase".
                        type: string
                      name:
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  endpoint:
                    description: |-
                      Endpoint is the S3 API URL, e.g. https://s3.eu-central-1.amazonaws.com
                      or https://minio.example.org:9000. Empty means the platform's own.

                      A scheme is required: "s3.example.org" is ambiguous about TLS, and a
                      backup silently sent in plaintext is worse than one that fails.
                    maxLength: 2048
                    pattern: ^$|^https?://[^\s/]+(/.*)?$
                    type: string
                  region:
                    description: |-
                      Region, for providers that require one. Empty suits MinIO and most
                      S3-compatible stores.
                    maxLength: 64
                    type: string
                type: object
              keepLast:
                description: |-
                  KeepLast is the default retention for scheduled exports. Zero keeps
                  everything, which is only right when something else prunes.
                format: int32
                minimum: 0
                type: integer
              schedule:
                description: |-
                  Schedule is the default cron expression, in UTC, applied to tenants that
                  do not state their own. Empty means no scheduled backups — a decision
                  worth making deliberately rather than inheriting.
                maxLength: 128
                type: string
            type: object
          status:
            description: BackupPolicyStatus reports what the policy resolved to.
            properties:
              conditions:
                description: 'Conditions carries Accepted: whether the destination
                  is usable.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
