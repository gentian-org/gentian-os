---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: backuppolicies.gentianos.io
spec:
  group: gentianos.io
  names:
    kind: BackupPolicy
    listKind: BackupPolicyList
    plural: backuppolicies
    shortNames:
    - bkpol
    singular: backuppolicy
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.scope
      name: Scope
      type: string
    - jsonPath: .spec.tenant
      name: Tenant
      type: string
    - jsonPath: .status.effectiveEndpoint
      name: Endpoint
      type: string
    - jsonPath: .status.effectiveBucket
      name: Bucket
      type: string
    - jsonPath: .status.effectiveSchedule
      name: Schedule
      type: string
    - jsonPath: .status.credentialSatisfied
      name: Credential
      priority: 1
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          BackupPolicy is where a tenant's bundles go, how often, and how long they
          are kept.

          Cluster-scoped for both scopes, as CredentialRequirement is: the console
          mediates access by spec.tenant, and the credential itself is governed by the
          OpenBao policy its scope selects.

          The name is not free. Every reader of a policy fetches it by name — the
          cluster's as "default", a tenant's as the tenant's own name — so a policy
          whose name does not match its scope is never read by anything. That failed
          silently: the policy reported Accepted, published an effective destination,
          and bundles went to the platform's own storage as though it had never been
          written. The two rules below make that object unadmittable rather than
          merely ineffective.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              BackupPolicySpec is one backup arrangement: the cluster's default, or one
              tenant's override of it.

              One type for both, distinguished by Scope, because they carry the same
              fields and a tenant's policy is exactly the cluster's with some fields
              restated. Two types meant two schemas, two status shapes and a merge that
              could disagree with itself.
            properties:
              allowTenantOverride:
                default: true
                description: |-
                  AllowTenantOverride lets tenants state policies of their own. Read only
                  from the cluster-scoped policy; meaningless on a tenant's own.

                  On by default. Turning it off keeps every tenant's bundles in storage
                  the operator controls — worth stating, because bundles the platform
                  cannot reach are bundles it cannot help restore.
                type: boolean
              destination:
                description: |-
                  Destination is where bundles are written. Unset inherits: the cluster
                  default for a tenant policy, the platform's own storage for the cluster.
                properties:
                  bucket:
                    description: Bucket holds the bundles. Empty keeps the per-tenant
                      default name.
                    maxLength: 63
                    pattern: ^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$
                    type: string
                  endpoint:
                    description: |-
                      Endpoint is the S3 API URL, e.g. https://sos-ch-gva-2.exo.io or
                      https://minio.example.org:9000. Empty means the platform's own storage.

                      A scheme is required: "s3.example.org" is ambiguous about TLS, and a
                      backup silently sent in plaintext is worse than one that fails.
                    maxLength: 2048
                    pattern: ^$|^https?://[^\s/]+(/.*)?$
                    type: string
                  region:
                    description: |-
                      Region, for providers that require one — Exoscale SOS and AWS do, MinIO
                      does not.
                    maxLength: 64
                    type: string
                type: object
              encryption:
                description: |-
                  Encryption names the keys bundles are encrypted to. Unset inherits, and
                  inheriting all the way up means the cluster's own key.
                properties:
                  recipients:
                    description: |-
                      Recipients are age public keys (age1…) to encrypt to. Empty inherits.

                      Every listed recipient can decrypt independently, so naming both a
                      tenant's key and the platform's is how a tenant keeps its own copy
                      without giving up support's ability to restore.

                      The pattern is age's bech32 encoding of an X25519 public key: the "age1"
                      prefix and 58 characters of the bech32 charset, which excludes the four
                      letters most often misread off paper (1, b, i, o). Checked here so a key
                      mistyped into a form is refused while the person is still looking at it,
                      rather than at 03:00 in an export's status.
                    items:
                      maxLength: 128
                      pattern: ^age1[02-9ac-hj-np-z]{58}$
                      type: string
                    maxItems: 8
                    type: array
                type: object
              retention:
                description: Retention decides which bundles survive. Unset inherits.
                properties:
                  keepDaily:
                    description: |-
                      KeepDaily, KeepWeekly, KeepMonthly and KeepYearly each retain the most
                      recent export within that many distinct periods. A bundle kept by any
                      tier survives; the tiers are a union, not a sequence.
                    format: int32
                    minimum: 0
                    type: integer
                  keepLast:
                    description: |-
                      KeepLast retains this many most recent finished exports regardless of
                      age. Zero relies entirely on the tiers below; with no tiers either,
                      nothing is deleted — a decision rather than a default, and the right one
                      only when something else prunes.
                    format: int32
                    minimum: 0
                    type: integer
                  keepMonthly:
                    format: int32
                    minimum: 0
                    type: integer
                  keepWeekly:
                    format: int32
                    minimum: 0
                    type: integer
                  keepYearly:
                    format: int32
                    minimum: 0
                    type: integer
                type: object
              schedule:
                description: |-
                  Schedule is a five-field cron expression, in UTC. Empty inherits; use
                  SuspendSchedule to mean none.
                maxLength: 128
                type: string
              scope:
                description: |-
                  Scope decides whether this is the cluster default or one tenant's
                  override, and with it who may edit the policy and which OpenBao path its
                  credential lives at. A tenant admin must not reach cluster paths.
                enum:
                - cluster
                - tenant
                type: string
              suspendSchedule:
                description: |-
                  SuspendSchedule turns scheduled backups off, distinctly from inheriting.
                  Without it "no schedule" and "not stated" would be the same value, and a
                  tenant could not opt out of a cluster-wide schedule.
                type: boolean
              tenant:
                description: |-
                  Tenant names the tenant a tenant-scoped policy belongs to. Empty for
                  cluster scope, required for tenant scope; the CEL rule above rejects
                  either mistake at admission, because a tenant-scoped policy naming no
                  tenant would apply to all of them or none.
                maxLength: 63
                type: string
            required:
            - scope
            type: object
            x-kubernetes-validations:
            - message: tenant is required when scope is tenant, and must be empty
                when scope is cluster
              rule: 'self.scope == ''tenant'' ? (has(self.tenant) && self.tenant !=
                '''') : (!has(self.tenant) || self.tenant == '''')'
          status:
            description: |-
              BackupPolicyStatus reports what this policy resolved to and whether it can
              actually be used.
            properties:
              conditions:
                description: 'Conditions carries Accepted: whether this policy is
                  permitted and usable.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              credentialRequirement:
                description: |-
                  CredentialRequirement names the requirement carrying this destination's
                  keys, and CredentialSatisfied reports whether it has been filled. A
                  destination whose credential is unsatisfied is a policy that will fail
                  at 03:00; surfaced here it is a red field in the console instead.
                type: string
              credentialSatisfied:
                type: boolean
              effectiveBucket:
                type: string
              effectiveEndpoint:
                description: |-
                  EffectiveEndpoint, EffectiveBucket and EffectiveSchedule are the values
                  in force after inheritance, published so an admin reads what applies
                  rather than recomputing the merge.
                type: string
              effectiveRecipients:
                description: |-
                  EffectiveRecipients are the age public keys in force, empty when the
                  cluster's own key is used. Published because "which key are my backups
                  encrypted to" is the one question this feature exists to answer, and an
                  admin must be able to read the answer rather than infer it from an
                  absence.
                items:
                  type: string
                type: array
              effectiveSchedule:
                type: string
              observedGeneration:
                format: int64
                type: integer
            type: object
        type: object
        x-kubernetes-validations:
        - message: 'a tenant-scoped BackupPolicy must be named after the tenant it
            applies to: metadata.name must equal spec.tenant, because that is the
            name the operator reads it by'
          rule: '!has(self.spec) || self.spec.scope != ''tenant'' || self.metadata.name
            == self.spec.tenant'
        - message: the cluster-scoped BackupPolicy is a singleton and must be named
            'default', because that is the name the operator reads it by
          rule: '!has(self.spec) || self.spec.scope != ''cluster'' || self.metadata.name
            == ''default'''
    served: true
    storage: true
    subresources:
      status: {}
