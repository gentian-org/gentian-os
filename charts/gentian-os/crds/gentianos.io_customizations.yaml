---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: customizations.gentianos.io
spec:
  group: gentianos.io
  names:
    kind: Customization
    listKind: CustomizationList
    plural: customizations
    shortNames:
    - cust
    - customizations
    singular: customization
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.target.profile
      name: Profile
      type: string
    - jsonPath: .spec.rung
      name: Rung
      type: string
    - jsonPath: .spec.scope
      name: Scope
      type: string
    - jsonPath: .spec.owner
      name: Owner
      type: string
    - jsonPath: .spec.reviewBy
      name: Review By
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Customization is a tracked, owned, dated deviation from an app
          as shipped.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: CustomizationSpec is the desired state of a Customization
              record.
            properties:
              artifacts:
                description: Artifacts point at the implementing code or content.
                items:
                  description: CustomizationArtifact points at the code or content
                    implementing the change.
                  properties:
                    path:
                      description: Path is the repo-relative location of the artifact.
                      type: string
                    repo:
                      description: Repo is the repository holding the artifact.
                      minLength: 1
                      type: string
                    version:
                      description: Version pins the artifact.
                      type: string
                  required:
                  - repo
                  type: object
                type: array
              created:
                description: |-
                  Created is the date the record was written (RFC 3339 date).
                  Accepts a bare date and, defensively, the midnight-UTC RFC3339 form YAML
                  parsers commonly normalize an unquoted date scalar into (e.g.
                  sigs.k8s.io/yaml turns 2027-08-06 into 2027-08-06T00:00:00Z on its way to
                  JSON) — authors should still quote date values in YAML, but a record
                  should not fail admission over a YAML parser quirk.
                pattern: ^\d{4}-\d{2}-\d{2}(T00:00:00Z)?$
                type: string
              delivery:
                description: Delivery is how an L3 module reaches the running app.
                enum:
                - git-sidecar
                - image-layer
                - addon-profile
                - module-profile
                - app-store-api
                type: string
              exitCriteria:
                description: ExitCriteria states what would allow this customization
                  to be dropped.
                type: string
              licensing:
                description: Licensing records the licensing effect.
                properties:
                  effect:
                    description: Effect records whether licensing terms change.
                    enum:
                    - none
                    - adds-dependency
                    - changes-terms
                    type: string
                  notes:
                    description: Notes explains a non-none effect.
                    type: string
                type: object
              origin:
                description: Origin records authorship and repository ownership.
                properties:
                  authorship:
                    description: Authorship records who wrote the customization.
                    enum:
                    - gentian
                    - tenant
                    - supplier
                    - partner
                    - community
                    type: string
                  contact:
                    description: Contact is the maintainer contact for the customization.
                    type: string
                  organisation:
                    description: Organisation names the authoring organisation, when
                      not Gentian.
                    type: string
                  repo:
                    description: Repo is the backing repository, when externally owned.
                    type: string
                  repoOwnership:
                    description: RepoOwnership records who controls that repository.
                    enum:
                    - gentian
                    - external
                    type: string
                  reviewedBy:
                    description: ReviewedBy names the role at Gentian that accepted
                      the customization.
                    type: string
                  supportContract:
                    description: SupportContract records the support terms.
                    enum:
                    - none
                    - community
                    - commercial
                    type: string
                type: object
              owner:
                description: |-
                  Owner is the team or person accountable. Free-form rather than a Gentian
                  team enum, so an external maintainer can hold it without a schema change.
                minLength: 1
                type: string
              reviewBy:
                description: |-
                  ReviewBy is the date this deviation must be reconsidered. A record whose
                  review date has passed is customization debt, and is reported as such.
                  Accepts a bare date and, defensively, the midnight-UTC RFC3339 form YAML
                  parsers commonly normalize an unquoted date scalar into (e.g.
                  sigs.k8s.io/yaml turns 2027-08-06 into 2027-08-06T00:00:00Z on its way to
                  JSON) — authors should still quote date values in YAML, but a record
                  should not fail admission over a YAML parser quirk.
                pattern: ^\d{4}-\d{2}-\d{2}(T00:00:00Z)?$
                type: string
              rung:
                description: Rung is the ladder rung this customization sits at.
                enum:
                - L0
                - L1
                - L2
                - L3
                - L4
                - L5
                - L6
                type: string
              rungJustification:
                additionalProperties:
                  type: string
                description: |-
                  RungJustification explains, per rung skipped, why nothing cheaper would do.
                  Keys are rung identifiers ("L0", "L1", ...). This is the field that stops the
                  ladder from being decorative.
                type: object
              scope:
                description: Scope is the blast radius.
                enum:
                - tenant
                - profile
                - platform
                type: string
              security:
                description: Security records the security posture.
                properties:
                  handlesPersonalData:
                    description: HandlesPersonalData flags customizations that process
                      personal data.
                    type: boolean
                  macWaivers:
                    description: |-
                      MACWaivers lists waivers this customization requires. Requests are still
                      approved through PlatformSecurityPolicy — declaring one here does not grant it.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  newEgress:
                    description: NewEgress lists network destinations the customization
                      introduces.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                type: object
              summary:
                description: Summary states what the customization does, in one line.
                maxLength: 200
                minLength: 1
                type: string
              target:
                description: Target identifies the app being customized.
                properties:
                  appVersion:
                    description: AppVersion is the upstream application version this
                      was built against.
                    type: string
                  chartVersion:
                    description: ChartVersion is the chart version this was built
                      against.
                    type: string
                  family:
                    description: Family is the logical app id shared across profile
                      revisions.
                    type: string
                  profile:
                    description: Profile is the AppProfile name this customization
                      targets.
                    minLength: 1
                    type: string
                required:
                - profile
                type: object
              tenants:
                description: Tenants lists affected tenants. Required and non-empty
                  when Scope is tenant.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              testedAgainst:
                description: TestedAgainst lists the app versions this customization
                  was verified against.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              tests:
                description: Tests lists the regression tests covering this customization.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              upgradeRisk:
                description: UpgradeRisk estimates the cost of the next upstream version
                  bump.
                enum:
                - low
                - medium
                - high
                type: string
              upstreamFirst:
                description: UpstreamFirst records the upstream-first obligation.
                properties:
                  appliedUpstream:
                    description: |-
                      AppliedUpstream reports whether upstream has accepted the change. When true
                      the customization should be scheduled for removal at the next version bump.
                    type: boolean
                  attempted:
                    description: |-
                      Attempted reports whether upstream was searched and, where applicable,
                      offered the change. Required to be true for rung L4 and above.
                    type: boolean
                  forwarded:
                    description: 'Forwarded mirrors DEP-3: was the change sent upstream?'
                    enum:
                    - "yes"
                    - "no"
                    - not-needed
                    type: string
                  reason:
                    description: Reason explains a Forwarded value of "no" or "not-needed".
                    type: string
                  url:
                    description: URL links the upstream issue or pull request.
                    type: string
                type: object
            required:
            - owner
            - reviewBy
            - rung
            - scope
            - summary
            - target
            type: object
          status:
            description: |-
              CustomizationStatus is the observed state, computed by the operator. It exists
              so the debt report is derived from live cluster state rather than guessed from
              YAML by a script.
            properties:
              conditions:
                description: Conditions provide detailed status.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the last reconciled spec generation.
                format: int64
                type: integer
              phase:
                description: Phase summarises record health.
                enum:
                - Active
                - NeedsReview
                - Superseded
                - Invalid
                type: string
              resolvedNamespace:
                description: |-
                  ResolvedNamespace is the namespace the target app was found in. Used by the
                  L3 per-tenant namespace test.
                type: string
              reviewOverdue:
                description: ReviewOverdue is true once spec.reviewBy has passed.
                type: boolean
              rungAboveRecommended:
                description: |-
                  RungAboveRecommended is true when the target's customization surface offers
                  a lower rung this record's rungJustification has no entry for — a rung the
                  app has started supporting since the record was written, and therefore a
                  candidate for descending. A cheaper rung the record already justified
                  skipping does not set this; every rung below spec.rung must be justified
                  to pass admission, so re-flagging those would mark every compliant record
                  permanently, defeating the signal.
                type: boolean
              targetVersionDrift:
                description: |-
                  TargetVersionDrift is true when the target profile now pins a chart or app
                  version outside spec.testedAgainst.
                type: boolean
              upstreamStale:
                description: |-
                  UpstreamStale is true when the change was never forwarded upstream and no
                  reason was recorded, or when upstream has accepted it and the local delta
                  is still carried.
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
