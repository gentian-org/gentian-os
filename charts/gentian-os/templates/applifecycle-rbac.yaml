apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gentian-os.fullname" . }}-token
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: [{{ include "gentian-os.serviceAccountName" . | quote }}]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gentian-os.fullname" . }}-token
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gentian-os.fullname" . }}-token
subjects:
  - kind: ServiceAccount
    name: {{ include "gentian-os.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
