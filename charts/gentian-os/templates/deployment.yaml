apiVersion: apps/v1
kind: Deployment
{{- $webhook := .Values.webhook | default dict }}
{{- $webhookEnabled := $webhook.enabled | default false }}
{{- $webhookPort := $webhook.port | default 9443 }}
{{- $imageDigest := .Values.image.digest | default "" }}
{{- $imageTag := .Values.image.tag | default .Chart.AppVersion }}
{{- $lifecycleDeployments := .Values.appLifecycle.deployments | default dict }}
{{- $licenceReporting := include "gentian-os.licenceReporting" . }}
{{- $usage := .Values.usage | default dict }}
{{- $usageSampler := $usage.sampler | default dict }}
{{- $metricsServer := $usage.metricsServer | default dict }}
metadata:
  name: {{ include "gentian-os.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gentian-os.labels" . | nindent 4 }}
  annotations:
    # Restart when the tokens below change. They reach the container as
    # secretKeyRef env vars, which Kubernetes resolves once at pod start: a
    # Secret that changes afterwards never reaches a running pod. The authz
    # bridge read an empty OpenFGA token for an hour after ESO had populated
    # its Secret, retrying 401 bearer_token_missing against a value that was
    # by then sitting right beside it.
    {{- /*
      The claim's projection. gentian-cluster-config carries the settings the
      operator reads from the claim rather than from its own Helm values --
      tenancy, mail, LLM, the tenant limit range. Without this annotation a
      setting changed through the director lands in git, reaches the
      ConfigMap, and then waits for an unrelated restart before anything acts
      on it, which reads as the change having been ignored.
    */}}
    configmap.reloader.stakater.com/reload: "gentian-cluster-config"
    secret.reloader.stakater.com/reload: >-
      {{ .Values.authzBridge.openfgaTokenSecretRef.name | default "gentian-os-openfga-token" }}
      {{- with .Values.cloudflare.apiTokenSecretRef }}{{- if .name }},{{ .name }}{{- end }}{{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "gentian-os.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gentian-os.selectorLabels" . | nindent 8 }}
        # What tells these pods from the release's other workloads in this
        # namespace, which carry the two labels above as well. The
        # NetworkPolicy in networkpolicy.yaml selects on it. Not part of the
        # Deployment's selector, which is immutable.
        app.kubernetes.io/component: operator
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "gentian-os.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}{{- if $imageDigest }}@{{ $imageDigest }}{{- else }}:{{ $imageTag }}{{- end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /manager
          args:
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --leader-elect
            {{- if $webhookEnabled }}
            - --enable-webhook
            {{- end }}
            {{- if .Values.leaderElectionNamespace }}
            - --leader-election-namespace={{ .Values.leaderElectionNamespace }}
            {{- end }}
            - --zap-log-level={{ .Values.logLevel }}
          envFrom:
            - configMapRef:
                name: {{ include "gentian-os.fullname" . }}-config
          env:
            {{- include "gentian-os.layoutEnv" . | nindent 12 }}
            {{- with .Values.trustAnchorSecret }}
            # Outside every feature guard on purpose: the operator talks to
            # Keycloak and OpenBao over kernel hostnames whatever else is
            # enabled, so tying its trust store to another flag would make TLS
            # succeed or fail depending on an unrelated setting. Go's
            # crypto/x509 reads SSL_CERT_FILE when it builds the system pool, so
            # no custom transport is needed.
            - name: SSL_CERT_FILE
              value: /opt/gentian-trust-anchor/ca.crt
            {{- end }}
            - name: BAO_ADDR
              value: {{ .Values.openbao.address | quote }}
            - name: BAO_ROLE
              value: {{ .Values.openbao.role | quote }}
            {{- /* Only when there is nothing to verify against.

                 This used to be an unconditional "true", which meant the
                 trust anchor above could never take effect for OpenBao:
                 NewKVClient installs an InsecureSkipVerify transport whenever
                 this is set, overriding SSL_CERT_FILE. So configuring
                 trustAnchorSecret bought TLS verification everywhere except the
                 one connection that carries the master password.

                 Left true when no anchor is configured, because OpenBao serves
                 a self-signed certificate and the operator could not reach it
                 at all otherwise — this is the honest default for that case,
                 not a hidden one. */}}
            {{- if not .Values.trustAnchorSecret }}
            - name: VAULT_SKIP_VERIFY
              value: "true"
            {{- end }}
            - name: KERNEL_DOMAIN
              value: {{ .Values.kernelDomain | quote }}
            {{- with .Values.mailEgressHost }}
            # The hostname outbound mail leaves from. The mail reconciler uses it
            # for the SPF record it publishes, which must name the sending
            # address rather than the MX.
            - name: MAIL_EGRESS_HOST
              value: {{ . | quote }}
            {{- end }}
            {{- /*
            Where abuse@ and postmaster@ are delivered, for every domain this
            cluster accepts mail for. Empty leaves both accepted and unreadable,
            which the mail reconciler logs on every sync — see mailAdminContact
            in values.yaml.
            */}}
            - name: MAIL_ADMIN_CONTACT
              value: {{ .Values.mailAdminContact | default "" | quote }}
            {{- /*
            Whether an address nobody owns is accepted. catchall (default),
            observe, or strict — see mailRecipientPolicy in values.yaml.
            */}}
            - name: MAIL_RECIPIENT_POLICY
              value: {{ .Values.mailRecipientPolicy | default "catchall" | quote }}
            - name: TENANCY_MODE
              value: {{ .Values.tenancyMode | default "multi" | quote }}
            {{- /*
            The cluster's mail stack, from the Cluster claim's mail.serviceMode.
            Gates Dovecot provisioning: with external there is no Dovecot to
            configure, and the operator was creating a Keycloak client per realm
            and a Job per reconcile for one that does not exist.
            */}}
            - name: MAIL_SERVICE_MODE
              value: {{ .Values.mailServiceMode | default "external" | quote }}
            - name: ROUTING_MODE
              value: {{ .Values.routingMode | default "gateway" | quote }}
            {{- /*
            hasKey, not `default true`: Helm's default treats false as empty, so
            `gateTenants: false | default true` renders true and the switch
            silently does nothing. A boolean that cannot be turned off is worse
            than no switch, because the operator believes it is off.
            */}}
            - name: HANDOVER_GATE_TENANTS
              value: {{ if hasKey (.Values.handover | default dict) "gateTenants" }}{{ .Values.handover.gateTenants | quote }}{{ else }}"true"{{ end }}
            - name: TENANT_DNS01_CLUSTER_ISSUER
              value: {{ include "gentian.tenantDNS01ClusterIssuer" . | quote }}
            - name: KERNEL_REALM
              value: {{ .Values.kernelRealm | default "kernel" | quote }}
            {{- if .Values.backupRecipients }}
            - name: BACKUP_AGE_RECIPIENTS
              value: {{ join "," .Values.backupRecipients | quote }}
            {{- end }}
            {{- if .Values.authzBridge.openfgaURL }}
            - name: OPENFGA_API_URL
              value: {{ .Values.authzBridge.openfgaURL | quote }}
            {{- /*
              optional: true so the operator still starts while the
              ExternalSecret is syncing; the bridge picks the token up on a
              later reconcile rather than CrashLooping the whole operator. The
              Secret is on this Deployment's reloader annotation, so its arrival
              restarts the pod rather than waiting for one.

              That tolerance is why D-01's check() asserts the Secret exists and
              carries the key: without it, "still syncing" and "will never sync"
              look identical from here, and the bridge would run tokenless with
              nothing saying so.
            */}}
            {{- if .Values.authzBridge.openfgaTokenSecretRef.name }}
            - name: OPENFGA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authzBridge.openfgaTokenSecretRef.name | quote }}
                  key: {{ .Values.authzBridge.openfgaTokenSecretRef.key | default "api-token" | quote }}
                  optional: true
            {{- end }}
            {{- end }}
            {{- with .Values.authzBridge.storeID }}
            - name: OPENFGA_STORE_ID
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.authzBridge.modelID }}
            - name: OPENFGA_MODEL_ID
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.membershipListener.keysSecretRef.name }}
            # The public halves of the keys Keycloak's event listener signs
            # with. A statement about who is in which group is believed only
            # when it carries one of these signatures, so without this the
            # operator accepts no membership at all and every permission that
            # follows from a group is refused to everyone. The portal login
            # step derives the pair and writes both halves.
            - name: GENTIAN_LISTENER_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.membershipListener.keysSecretRef.name | quote }}
                  key: {{ .Values.membershipListener.keysSecretRef.key | default "keys" | quote }}
                  optional: true
            - name: GENTIAN_MEMBERSHIP_ADDR
              value: ":{{ .Values.membershipListener.port }}"
            - name: GENTIAN_PLATFORM_REALM
              value: {{ .Values.membershipListener.platformRealm | quote }}
            - name: GENTIAN_PLATFORM_TENANT
              value: {{ .Values.membershipListener.platformTenant | quote }}
            {{- end }}
            # Which EdgeIngress this cluster runs, by the name
            # kernel/platforms.yaml uses. Empty follows networkMode, so an
            # existing cluster needs no new value to keep behaving as it does.
            - name: EDGE_INGRESS
              value: {{ .Values.edgeIngress | default "" | quote }}
            - name: NETWORK_MODE
              value: {{ .Values.networkMode | default "" | quote }}
            # The cluster's switch for the kernel's network rules, as the
            # installer set it (KERNEL_NETWORK_POLICIES). "true" narrows what
            # a tenant's namespace and a publishing proxy admit from the edge
            # namespace to the Gateway's Envoy pods; anything else leaves
            # both as they were.
            - name: KERNEL_NETWORK_POLICIES
              value: {{ ternary "true" "false" (eq (toString .Values.kernelNetworkPolicies) "true") | quote }}
            - name: CLOUDFLARE_ZONE_ID
              {{- if .Values.cloudflare.zoneID }}
              value: {{ .Values.cloudflare.zoneID | quote }}
              {{- else if .Values.cloudflare.apiTokenSecretRef.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cloudflare.apiTokenSecretRef.name | quote }}
                  key: "zone-id"
                  optional: true
              {{- else }}
              value: ""
              {{- end }}
            # Optional. Supplied, the tunnel ingress addresses the account
            # directly and never reads the zone — so its token needs only the
            # account permission, not Zone:Read. See internal/controller/
            # edge_cloudflare_tunnel.go.
            - name: CLOUDFLARE_ACCOUNT_ID
              {{- if .Values.cloudflare.accountID }}
              value: {{ .Values.cloudflare.accountID | quote }}
              {{- else if .Values.cloudflare.apiTokenSecretRef.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cloudflare.apiTokenSecretRef.name | quote }}
                  key: "account-id"
                  optional: true
              {{- else }}
              value: ""
              {{- end }}
            - name: CLOUDFLARE_TUNNEL_CNAME
              {{- if .Values.cloudflare.tunnelCNAME }}
              value: {{ .Values.cloudflare.tunnelCNAME | quote }}
              {{- else if .Values.cloudflare.apiTokenSecretRef.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cloudflare.apiTokenSecretRef.name | quote }}
                  key: "tunnel-cname"
                  optional: true
              {{- else }}
              value: ""
              {{- end }}
            {{- if .Values.cloudflare.apiTokenSecretRef.name }}
            - name: CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cloudflare.apiTokenSecretRef.name | quote }}
                  key: {{ .Values.cloudflare.apiTokenSecretRef.key | default "api-token" | quote }}
                  optional: true
            {{- end }}
            {{- if .Values.cloudflare.tunnelAPITokenSecretRef.name }}
            # CF_TUNNEL_TOKEN, matching what the operator reads and what the
            # installer collects. optional: a cluster whose OpenBao has no
            # edge/cf-tunnel path yet must still start -- the operator falls
            # back to the DNS token, which is every cluster installed before
            # this credential existed.
            - name: CF_TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cloudflare.tunnelAPITokenSecretRef.name | quote }}
                  key: {{ .Values.cloudflare.tunnelAPITokenSecretRef.key | default "api-token" | quote }}
                  optional: true
            {{- end }}
            - name: SERVICES_NAMESPACE
              value: {{ .Values.servicesNamespace | quote }}
            # The ext-auth bouncer's Service, which every kernel-zone SecurityPolicy
            # the operator writes names as its ext-auth backend.
            - name: BOUNCER_SERVICE
              value: {{ printf "%s-bouncer" (include "gentian-os.fullname" .) | quote }}
            # Where a desktop asks what a person may open: the usher's Service,
            # in this namespace, beside the director's.
            - name: USHER_URL
              value: {{ printf "http://%s-usher.%s.svc.cluster.local:8080" (include "gentian-os.fullname" .) .Release.Namespace | quote }}
            - name: GENTIAN_STAGE
              value: {{ .Values.stage | default "dev" | quote }}
            - name: LLM_SUPPORT
              value: {{ .Values.llmSupport | default false | quote }}
            {{- if include "gentian-os.licenceReporting" . }}
            # The licence report: on, and where it goes. Absent, the operator
            # sends nothing and starts no timer. The signing key is a file,
            # mounted below, so that it is found without a restart once the
            # Secret exists.
            - name: LICENCE_REPORT_ENABLED
              value: "true"
            - name: LICENCE_REPORT_URL
              value: {{ .Values.licenceReport.url | quote }}
            - name: LICENCE_REPORT_KEY_FILE
              value: /etc/gentian/licence-report/{{ .Values.licenceReport.signingKey.property }}
            {{- end }}
            {{- with .Values.kernelServices.smtpHost }}
            - name: MAIL_SMTP_HOST
              value: {{ . | quote }}
            {{- end }}
            - name: MEMCACHED_IMAGE
              value: {{ .Values.memcached.image | quote }}
            - name: POSTGRES_PROVISIONER_IMAGE
              value: {{ .Values.provisioners.postgres | quote }}
            - name: MARIADB_PROVISIONER_IMAGE
              value: {{ .Values.provisioners.mariadb | quote }}
            - name: REDIS_PROVISIONER_IMAGE
              value: {{ .Values.provisioners.redis | quote }}
            - name: KEYCLOAK_PROVISIONER_IMAGE
              value: {{ .Values.provisioners.keycloak | quote }}
            - name: CNPG_CLUSTER_NAME
              value: {{ .Values.database.clusterName | quote }}
            - name: TENANT_CROSSPLANE_ONLY
              value: {{ .Values.tenantProvisioning.crossplaneOnly | default false | quote }}
            - name: APP_LIFECYCLE_BIND_ADDRESS
              value: {{ printf ":%v" .Values.appLifecycle.port | quote }}
            # Who may call this API. A caller presents a ServiceAccount token
            # issued for this audience; the operator asks the API server whose
            # it is (TokenReview) and admits two identities of this namespace:
            # the director's for every route, the usher's for reads. Each is
            # named only where that workload is deployed; with neither, or
            # with no audience, the API refuses every request.
            - name: APP_LIFECYCLE_AUDIENCE
              value: {{ .Values.appLifecycle.audience | quote }}
            {{- if .Values.director.enabled }}
            - name: APP_LIFECYCLE_DIRECTOR_SERVICE_ACCOUNT
              value: {{ include "gentian-os.directorServiceAccountName" . | quote }}
            {{- end }}
            {{- if .Values.usher.enabled }}
            - name: APP_LIFECYCLE_USHER_SERVICE_ACCOUNT
              value: {{ include "gentian-os.usherServiceAccountName" . | quote }}
            {{- end }}
            - name: GENTIAN_DEPLOYMENTS_CLUSTER_ID
              value: {{ $lifecycleDeployments.cluster | default "default-cluster" | quote }}
            - name: USAGE_SAMPLER_ENABLED
              value: {{ $usageSampler.enabled | default false | quote }}
            - name: USAGE_SAMPLE_INTERVAL
              value: {{ $usageSampler.interval | default "15m" | quote }}
            - name: USAGE_RETENTION
              value: {{ $usageSampler.retention | default "9600h" | quote }}
            - name: METRICS_SERVER_ENABLED
              value: {{ $metricsServer.enabled | default false | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OPERATOR_SA
              value: {{ include "gentian-os.serviceAccountName" . | quote }}
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: lifecycle
              containerPort: {{ .Values.appLifecycle.port }}
              protocol: TCP
            {{- if .Values.membershipListener.keysSecretRef.name }}
            - name: membership
              containerPort: {{ .Values.membershipListener.port }}
              protocol: TCP
            {{- end }}
            {{- if $webhookEnabled }}
            - name: webhook
              containerPort: {{ $webhookPort }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            {{- if .Values.resources }}
            {{- toYaml .Values.resources | nindent 12 }}
            {{- else }}
            {}
            {{- end }}
          {{- if or $webhookEnabled .Values.trustAnchorSecret $licenceReporting }}
          volumeMounts:
            {{- if $licenceReporting }}
            - name: licence-report-key
              mountPath: /etc/gentian/licence-report
              readOnly: true
            {{- end }}
            {{- with .Values.trustAnchorSecret }}
            - name: kernel-trust-anchor
              mountPath: /opt/gentian-trust-anchor
              readOnly: true
            {{- end }}
            {{- if $webhookEnabled }}
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
            {{- end }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or $webhookEnabled .Values.trustAnchorSecret $licenceReporting }}
      volumes:
        {{- if $licenceReporting }}
        # Optional: the pod starts while the vault path or the Secret is still
        # missing, and the operator then records that it has no key instead
        # of sending anything unsigned.
        - name: licence-report-key
          secret:
            secretName: {{ .Values.licenceReport.signingKey.secretName | quote }}
            optional: true
            defaultMode: 0440
        {{- end }}
        {{- with .Values.trustAnchorSecret }}
        - name: kernel-trust-anchor
          secret:
            secretName: {{ . }}
        {{- end }}
        {{- if $webhookEnabled }}
        - name: webhook-certs
          secret:
            secretName: {{ include "gentian-os.fullname" . }}-webhook-server-cert
        {{- end }}
      {{- end }}
      terminationGracePeriodSeconds: 10
