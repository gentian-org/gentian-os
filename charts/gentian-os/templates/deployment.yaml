apiVersion: apps/v1
kind: Deployment
{{- $webhook := .Values.webhook | default dict }}
{{- $webhookEnabled := $webhook.enabled | default false }}
{{- $webhookPort := $webhook.port | default 9443 }}
{{- $imageDigest := .Values.image.digest | default "" }}
{{- $imageTag := .Values.image.tag | default .Chart.AppVersion }}
{{- $lifecycleDeployments := .Values.appLifecycle.deployments | default dict }}
{{- $lifecycleDeploymentsEnabled := $lifecycleDeployments.enabled | default false }}
{{- $lifecycleGitCredsSecret := $lifecycleDeployments.gitCredentialsSecret | default "" }}
{{- /*
     How the operator authenticates to the deployments repository. The Secret
     comes from the Repository claim and holds one of two things:

       basic   one line, the repository's URL with the login in it. The init
               container mounts it and clones from that line.
       bearer  the token, under the key `token`. Nothing is mounted: git is
               told through its environment to send it as a header.
*/}}
{{- $gitBearer := and $lifecycleGitCredsSecret (eq ($lifecycleDeployments.authType | default "basic") "bearer") }}
{{- $gitLoginFile := and $lifecycleGitCredsSecret (not $gitBearer) }}
{{- $usage := .Values.usage | default dict }}
{{- $usageSampler := $usage.sampler | default dict }}
{{- $metricsServer := $usage.metricsServer | default dict }}
metadata:
  name: {{ include "gentian-os.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gentian-os.labels" . | nindent 4 }}
  annotations:
    # Restart when the tokens below change. They reach the container as
    # secretKeyRef env vars, which Kubernetes resolves once at pod start: a
    # Secret that changes afterwards never reaches a running pod. The authz
    # bridge read an empty OpenFGA token for an hour after ESO had populated
    # its Secret, retrying 401 bearer_token_missing against a value that was
    # by then sitting right beside it.
    {{- /*
      The claim's projection. gentian-cluster-config carries the settings the
      operator reads from the claim rather than from its own Helm values --
      tenancy, mail, LLM, the tenant limit range. Without this annotation a
      setting changed through the director lands in git, reaches the
      ConfigMap, and then waits for an unrelated restart before anything acts
      on it, which reads as the change having been ignored.
    */}}
    configmap.reloader.stakater.com/reload: "gentian-cluster-config"
    secret.reloader.stakater.com/reload: >-
      {{ .Values.authzBridge.openfgaTokenSecretRef.name | default "gentian-os-openfga-token" }}
      {{- with .Values.cloudflare.apiTokenSecretRef }}{{- if .name }},{{ .name }}{{- end }}{{- end }}
      {{- if $lifecycleGitCredsSecret }},{{ $lifecycleGitCredsSecret }}{{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "gentian-os.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gentian-os.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "gentian-os.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}{{- if $imageDigest }}@{{ $imageDigest }}{{- else }}:{{ $imageTag }}{{- end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /manager
          args:
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --leader-elect
            {{- if $webhookEnabled }}
            - --enable-webhook
            {{- end }}
            {{- if .Values.leaderElectionNamespace }}
            - --leader-election-namespace={{ .Values.leaderElectionNamespace }}
            {{- end }}
            - --zap-log-level={{ .Values.logLevel }}
          envFrom:
            - configMapRef:
                name: {{ include "gentian-os.fullname" . }}-config
          env:
            {{- include "gentian-os.layoutEnv" . | nindent 12 }}
            {{- with .Values.trustAnchorSecret }}
            # Outside every feature guard on purpose: the operator talks to
            # Keycloak and OpenBao over kernel hostnames whatever else is
            # enabled, so tying its trust store to another flag would make TLS
            # succeed or fail depending on an unrelated setting. Go's
            # crypto/x509 reads SSL_CERT_FILE when it builds the system pool, so
            # no custom transport is needed.
            - name: SSL_CERT_FILE
              value: /opt/gentian-trust-anchor/ca.crt
            {{- end }}
            - name: BAO_ADDR
              value: {{ .Values.openbao.address | quote }}
            - name: BAO_ROLE
              value: {{ .Values.openbao.role | quote }}
            {{- /* Only when there is nothing to verify against.

                 This used to be an unconditional "true", which meant the
                 trust anchor above could never take effect for OpenBao:
                 NewKVClient installs an InsecureSkipVerify transport whenever
                 this is set, overriding SSL_CERT_FILE. So configuring
                 trustAnchorSecret bought TLS verification everywhere except the
                 one connection that carries the master password.

                 Left true when no anchor is configured, because OpenBao serves
                 a self-signed certificate and the operator could not reach it
                 at all otherwise — this is the honest default for that case,
                 not a hidden one. */}}
            {{- if not .Values.trustAnchorSecret }}
            - name: VAULT_SKIP_VERIFY
              value: "true"
            {{- end }}
            - name: KERNEL_DOMAIN
              value: {{ .Values.kernelDomain | quote }}
            {{- with .Values.mailEgressHost }}
            # The hostname outbound mail leaves from. The mail reconciler uses it
            # for the SPF record it publishes, which must name the sending
            # address rather than the MX.
            - name: MAIL_EGRESS_HOST
              value: {{ . | quote }}
            {{- end }}
            {{- /*
            Where abuse@ and postmaster@ are delivered, for every domain this
            cluster accepts mail for. Empty leaves both accepted and unreadable,
            which the mail reconciler logs on every sync — see mailAdminContact
            in values.yaml.
            */}}
            - name: MAIL_ADMIN_CONTACT
              value: {{ .Values.mailAdminContact | default "" | quote }}
            {{- /*
            Whether an address nobody owns is accepted. catchall (default),
            observe, or strict — see mailRecipientPolicy in values.yaml.
            */}}
            - name: MAIL_RECIPIENT_POLICY
              value: {{ .Values.mailRecipientPolicy | default "catchall" | quote }}
            - name: TENANCY_MODE
              value: {{ .Values.tenancyMode | default "multi" | quote }}
            {{- /*
            The cluster's mail stack, from the Cluster claim's mail.serviceMode.
            Gates Dovecot provisioning: with external there is no Dovecot to
            configure, and the operator was creating a Keycloak client per realm
            and a Job per reconcile for one that does not exist.
            */}}
            - name: MAIL_SERVICE_MODE
              value: {{ .Values.mailServiceMode | default "external" | quote }}
            - name: ROUTING_MODE
              value: {{ .Values.routingMode | default "gateway" | quote }}
            {{- /*
            hasKey, not `default true`: Helm's default treats false as empty, so
            `gateTenants: false | default true` renders true and the switch
            silently does nothing. A boolean that cannot be turned off is worse
            than no switch, because the operator believes it is off.
            */}}
            {{- /*
            OpenBao serves a self-signed certificate, so the custodian
            has to be told what signs it or every token exchange fails at TLS —
            and used to report that as "not authorised".
            Read from the Secret rather than mounted: a Pod cannot mount a
            Secret from another namespace, which is why ESO's ClusterSecretStore
            uses a caProvider for the same certificate.
            */}}
            - name: BAO_CA_SECRET
              value: {{ (.Values.custodian).caSecret | default "openbao-tls" | quote }}
            {{- /* Where that Secret is: the vault's own namespace, which this
                 chart is already told. It defaulted to the literal "openbao",
                 which is the v4 name -- so on a v5 cluster the certificate was
                 looked for in a namespace that does not exist, the CA was not
                 found, and every token exchange failed at TLS while the log
                 said only that it was verifying against the system roots. */}}
            - name: BAO_CA_SECRET_NAMESPACE
              value: {{ (.Values.custodian).caSecretNamespace | default .Values.openbaoNamespace | default "kernel-secrets" | quote }}
            {{- if (.Values.custodian).tlsSkipVerify }}
            - name: BAO_TLS_SKIP_VERIFY
              value: "true"
            {{- end }}
            - name: HANDOVER_GATE_TENANTS
              value: {{ if hasKey (.Values.handover | default dict) "gateTenants" }}{{ .Values.handover.gateTenants | quote }}{{ else }}"true"{{ end }}
            - name: TENANT_DNS01_CLUSTER_ISSUER
              value: {{ include "gentian.tenantDNS01ClusterIssuer" . | quote }}
            - name: KERNEL_REALM
              value: {{ .Values.kernelRealm | default "kernel" | quote }}
            {{- if .Values.backupRecipients }}
            - name: BACKUP_AGE_RECIPIENTS
              value: {{ join "," .Values.backupRecipients | quote }}
            {{- end }}
            {{- if .Values.authzBridge.enabled }}
            - name: AUTHZ_BRIDGE_ENABLED
              value: "true"
            {{- end }}
            {{- /*
              Not gated on the retired bridge.

              The operator projects the authorization graph's structure -- the
              cluster's roles and its tenants -- whether or not the bridge that
              used to sync app grants is on. Leaving these behind
              authzBridge.enabled meant that turning the bridge off, which v5
              does, also took away the address the projection needs, and
              nobody would administer the cluster.
            */}}
            {{- if .Values.authzBridge.openfgaURL }}
            - name: OPENFGA_API_URL
              value: {{ .Values.authzBridge.openfgaURL | quote }}
            {{- /*
              optional: true so the operator still starts while the
              ExternalSecret is syncing; the bridge picks the token up on a
              later reconcile rather than CrashLooping the whole operator. The
              Secret is on this Deployment's reloader annotation, so its arrival
              restarts the pod rather than waiting for one.

              That tolerance is why D-01's check() asserts the Secret exists and
              carries the key: without it, "still syncing" and "will never sync"
              look identical from here, and the bridge would run tokenless with
              nothing saying so.
            */}}
            {{- if .Values.authzBridge.openfgaTokenSecretRef.name }}
            - name: OPENFGA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authzBridge.openfgaTokenSecretRef.name | quote }}
                  key: {{ .Values.authzBridge.openfgaTokenSecretRef.key | default "api-token" | quote }}
                  optional: true
            {{- end }}
            {{- end }}
            {{- with .Values.authzBridge.storeID }}
            - name: OPENFGA_STORE_ID
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.authzBridge.modelID }}
            - name: OPENFGA_MODEL_ID
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.membershipListener.keysSecretRef.name }}
            # The public halves of the keys Keycloak's event listener signs
            # with. A statement about who is in which group is believed only
            # when it carries one of these signatures, so without this the
            # operator accepts no membership at all and every permission that
            # follows from a group is refused to everyone. The portal login
            # step derives the pair and writes both halves.
            - name: GENTIAN_LISTENER_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.membershipListener.keysSecretRef.name | quote }}
                  key: {{ .Values.membershipListener.keysSecretRef.key | default "keys" | quote }}
                  optional: true
            - name: GENTIAN_MEMBERSHIP_ADDR
              value: ":{{ .Values.membershipListener.port }}"
            - name: GENTIAN_PLATFORM_REALM
              value: {{ .Values.membershipListener.platformRealm | quote }}
            - name: GENTIAN_PLATFORM_TENANT
              value: {{ .Values.membershipListener.platformTenant | quote }}
            {{- end }}
            # Which EdgeIngress this cluster runs, by the name
            # kernel/platforms.yaml uses. Empty follows networkMode, so an
            # existing cluster needs no new value to keep behaving as it does.
            - name: EDGE_INGRESS
              value: {{ .Values.edgeIngress | default "" | quote }}
            - name: NETWORK_MODE
              value: {{ .Values.networkMode | default "" | quote }}
            - name: CLOUDFLARE_ZONE_ID
              {{- if .Values.cloudflare.zoneID }}
              value: {{ .Values.cloudflare.zoneID | quote }}
              {{- else if .Values.cloudflare.apiTokenSecretRef.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cloudflare.apiTokenSecretRef.name | quote }}
                  key: "zone-id"
                  optional: true
              {{- else }}
              value: ""
              {{- end }}
            # Optional. Supplied, the tunnel ingress addresses the account
            # directly and never reads the zone — so its token needs only the
            # account permission, not Zone:Read. See internal/controller/
            # edge_cloudflare_tunnel.go.
            - name: CLOUDFLARE_ACCOUNT_ID
              {{- if .Values.cloudflare.accountID }}
              value: {{ .Values.cloudflare.accountID | quote }}
              {{- else if .Values.cloudflare.apiTokenSecretRef.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cloudflare.apiTokenSecretRef.name | quote }}
                  key: "account-id"
                  optional: true
              {{- else }}
              value: ""
              {{- end }}
            - name: CLOUDFLARE_TUNNEL_CNAME
              {{- if .Values.cloudflare.tunnelCNAME }}
              value: {{ .Values.cloudflare.tunnelCNAME | quote }}
              {{- else if .Values.cloudflare.apiTokenSecretRef.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cloudflare.apiTokenSecretRef.name | quote }}
                  key: "tunnel-cname"
                  optional: true
              {{- else }}
              value: ""
              {{- end }}
            {{- if .Values.cloudflare.apiTokenSecretRef.name }}
            - name: CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cloudflare.apiTokenSecretRef.name | quote }}
                  key: {{ .Values.cloudflare.apiTokenSecretRef.key | default "api-token" | quote }}
                  optional: true
            {{- end }}
            {{- if .Values.cloudflare.tunnelAPITokenSecretRef.name }}
            # CF_TUNNEL_TOKEN, matching what the operator reads and what the
            # installer collects. optional: a cluster whose OpenBao has no
            # edge/cf-tunnel path yet must still start -- the operator falls
            # back to the DNS token, which is every cluster installed before
            # this credential existed.
            - name: CF_TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cloudflare.tunnelAPITokenSecretRef.name | quote }}
                  key: {{ .Values.cloudflare.tunnelAPITokenSecretRef.key | default "api-token" | quote }}
                  optional: true
            {{- end }}
            - name: INFRA_NAMESPACE
              value: {{ .Values.infraNamespace | quote }}
            - name: SERVICES_NAMESPACE
              value: {{ .Values.servicesNamespace | quote }}
            # The ext-auth bouncer's Service, which every kernel-zone SecurityPolicy
            # the operator writes names as its ext-auth backend.
            - name: BOUNCER_SERVICE
              value: {{ printf "%s-bouncer" (include "gentian-os.fullname" .) | quote }}
            # Where a desktop asks what a person may open: the usher's Service,
            # beside the bouncer's.
            - name: USHER_URL
              value: {{ printf "http://%s-usher.%s.svc.cluster.local:8080" (include "gentian-os.fullname" .) (.Values.layout.edge | default .Values.servicesNamespace) | quote }}
            - name: GENTIAN_STAGE
              value: {{ .Values.stage | default "dev" | quote }}
            - name: LLM_SUPPORT
              value: {{ .Values.llmSupport | default false | quote }}
            {{- if .Values.custodian.enabled }}
            - name: CUSTODIAN_ENABLED
              value: "true"
            - name: CUSTODIAN_ADDR
              value: ":{{ .Values.custodian.port }}"
            - name: CUSTODIAN_PROBE_NAMESPACE
              value: {{ .Values.custodian.probeNamespace | default .Release.Namespace | quote }}
            - name: BAO_AUTH_MOUNT
              value: {{ .Values.custodian.authMount | quote }}
            - name: BAO_OIDC_ROLES
              value: {{ join "," .Values.custodian.oidcRoles | quote }}
            # How the custodian verifies a caller's token before it asks the
            # authorization store about them: the issuer the token names, and
            # where its keys are read inside the cluster. The audience is the
            # zone token's, which a console relays here as it does to the
            # director.
            - name: CUSTODIAN_ISSUER_BASE_URL
              value: {{ printf "https://id.%s/auth" .Values.kernelDomain | quote }}
            - name: CUSTODIAN_JWKS_BASE_URL
              value: {{ .Values.director.jwksBaseURL | default (printf "http://gentian-idp-keycloak-keycloakx-http.%s.svc.cluster.local:8080/auth" (.Values.layout.authentication | default .Values.servicesNamespace)) | quote }}
            - name: CUSTODIAN_AUDIENCE
              value: {{ .Values.director.audience | quote }}
            {{- end }}
            {{- /* Renamed keys: a cluster overlay still setting the old ones would
                   otherwise render a commerce block pointing at nothing, and the
                   operator would fail every install-grant exchange at runtime. */}}
            {{- if .Values.commerce.corpAPIURL }}
            {{- fail "commerce.corpAPIURL was renamed to commerce.apiURL" }}
            {{- end }}
            {{- if .Values.commerce.operatorToken }}
            {{- fail "commerce.operatorToken was renamed to commerce.apiToken" }}
            {{- end }}
            {{- if .Values.commerce.enabled }}
            - name: GENTIAN_COMMERCE_ENABLED
              value: "true"
            - name: GENTIAN_COMMERCE_API_URL
              value: {{ .Values.commerce.apiURL | quote }}
            {{- if .Values.commerce.apiToken }}
            - name: GENTIAN_COMMERCE_API_TOKEN
              value: {{ .Values.commerce.apiToken | quote }}
            {{- end }}
            {{- if .Values.commerce.meteringInterval }}
            - name: METERING_INTERVAL
              value: {{ .Values.commerce.meteringInterval | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.kernelServices.smtpHost }}
            - name: MAIL_SMTP_HOST
              value: {{ . | quote }}
            {{- end }}
            - name: OPENBAO_NAMESPACE
              value: {{ .Values.openbaoNamespace | quote }}
            - name: MEMCACHED_IMAGE
              value: {{ .Values.memcached.image | quote }}
            - name: POSTGRES_PROVISIONER_IMAGE
              value: {{ .Values.provisioners.postgres | quote }}
            - name: MARIADB_PROVISIONER_IMAGE
              value: {{ .Values.provisioners.mariadb | quote }}
            - name: REDIS_PROVISIONER_IMAGE
              value: {{ .Values.provisioners.redis | quote }}
            - name: KEYCLOAK_PROVISIONER_IMAGE
              value: {{ .Values.provisioners.keycloak | quote }}
            - name: CNPG_CLUSTER_NAME
              value: {{ .Values.database.clusterName | quote }}
            - name: TENANT_CROSSPLANE_ONLY
              value: {{ .Values.tenantProvisioning.crossplaneOnly | default false | quote }}
            - name: APP_LIFECYCLE_BIND_ADDRESS
              value: {{ printf ":%v" .Values.appLifecycle.port | quote }}
            - name: GENTIAN_DEPLOYMENTS_PATH
              value: {{ $lifecycleDeployments.path | default "/data/gentian-deployments" | quote }}
            {{- with (.Values.appLifecycle).tokenSecretName }}
            # The shared token this API requires. Optional on the ref so a pod
            # still starts while the Secret is being created; the server then
            # refuses every request rather than serving them unauthenticated.
            - name: APP_LIFECYCLE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: token
                  optional: true
            {{- end }}
            - name: GENTIAN_DEPLOYMENTS_REPO
              value: {{ $lifecycleDeployments.repo | default "https://git.example.domain/gentian-deployments" | quote }}
            - name: GENTIAN_DEPLOYMENTS_CLUSTER_ID
              value: {{ $lifecycleDeployments.cluster | default "default-cluster" | quote }}
            - name: GENTIAN_DEPLOYMENTS_STAGE
              value: {{ $lifecycleDeployments.stage | default (.Values.stage | default "dev") | quote }}
            - name: USAGE_SAMPLER_ENABLED
              value: {{ $usageSampler.enabled | default false | quote }}
            - name: USAGE_SAMPLE_INTERVAL
              value: {{ $usageSampler.interval | default "15m" | quote }}
            - name: USAGE_RETENTION
              value: {{ $usageSampler.retention | default "9600h" | quote }}
            - name: METRICS_SERVER_ENABLED
              value: {{ $metricsServer.enabled | default false | quote }}
            {{- if $lifecycleGitCredsSecret }}
            - name: HOME
              value: /tmp
            {{- /* safe.directory is always the first setting. A bearer
                 token adds the header as a second; a basic login adds
                 nothing, because the init container cloned from a URL that
                 carries it, so it is in this checkout's origin and every
                 fetch and push reads it from there. git's credential store
                 is not used for it: the store takes a lock beside its file
                 even to read, and that file would be a read-only mount. */}}
            - name: GIT_CONFIG_COUNT
              value: {{ ternary "2" "1" $gitBearer | quote }}
            {{- include "gentian-os.gitConfigEnv" (dict "index" 0 "key" "safe.directory" "value" ($lifecycleDeployments.path | default "/data/gentian-deployments")) | nindent 12 }}
            {{- if $gitBearer }}
            {{- include "gentian-os.gitBearerEnv" (dict "secret" $lifecycleGitCredsSecret "index" 1) | nindent 12 }}
            {{- end }}
            - name: GIT_AUTHOR_NAME
              value: gentian-os
            - name: GIT_AUTHOR_EMAIL
              value: gentian-os@gentian.org
            - name: GIT_COMMITTER_NAME
              value: gentian-os
            - name: GIT_COMMITTER_EMAIL
              value: gentian-os@gentian.org
            {{- end }}
            - name: KERNEL_NAMESPACE
              value: {{ .Values.infraNamespace | default "kernel-authentication" | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OPERATOR_SA
              value: {{ include "gentian-os.serviceAccountName" . | quote }}
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: lifecycle
              containerPort: {{ .Values.appLifecycle.port }}
              protocol: TCP
            {{- if .Values.membershipListener.keysSecretRef.name }}
            - name: membership
              containerPort: {{ .Values.membershipListener.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.custodian.enabled }}
            - name: custodian
              containerPort: {{ .Values.custodian.port }}
              protocol: TCP
            {{- end }}
            {{- if $webhookEnabled }}
            - name: webhook
              containerPort: {{ $webhookPort }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            {{- if .Values.resources }}
            {{- toYaml .Values.resources | nindent 12 }}
            {{- else }}
            {}
            {{- end }}
          {{- if or $webhookEnabled $lifecycleDeploymentsEnabled $lifecycleGitCredsSecret }}
          volumeMounts:
            {{- with .Values.trustAnchorSecret }}
            - name: kernel-trust-anchor
              mountPath: /opt/gentian-trust-anchor
              readOnly: true
            {{- end }}
            {{- if $webhookEnabled }}
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
            {{- end }}
            {{- if $lifecycleDeploymentsEnabled }}
            - name: deployments-checkout
              mountPath: {{ $lifecycleDeployments.path | default "/data/gentian-deployments" }}
            {{- end }}
            {{- /* The credential is not mounted into this container in
                 either mode: see GIT_CONFIG_COUNT above. */}}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or $webhookEnabled $lifecycleDeploymentsEnabled $lifecycleGitCredsSecret }}
      volumes:
        {{- with .Values.trustAnchorSecret }}
        - name: kernel-trust-anchor
          secret:
            secretName: {{ . }}
        {{- end }}
        {{- if $webhookEnabled }}
        - name: webhook-certs
          secret:
            secretName: {{ include "gentian-os.fullname" . }}-webhook-server-cert
        {{- end }}
        {{- if $lifecycleDeploymentsEnabled }}
        - name: deployments-checkout
          emptyDir: {}
        {{- end }}
        {{- if $gitLoginFile }}
        - name: git-credentials
          secret:
            secretName: {{ $lifecycleGitCredsSecret | quote }}
            optional: true
        {{- end }}
      {{- end }}
      {{- if $lifecycleDeploymentsEnabled }}
      initContainers:
        - name: git-clone-deployments
          image: alpine/git:2.45.2
          command:
            - sh
            - -c
            - |
              set -e
              # A basic login arrives as a file holding one line: the
              # repository's URL with the login in it. Cloning from that line
              # also leaves it as the checkout's origin, which is where the
              # operator's later pushes find it. Without the file the clone
              # is from the plain address, which is right for a repository
              # that needs no login and for one that takes a bearer token.
              origin="${GENTIAN_DEPLOYMENTS_REPO}"
              {{- if $gitLoginFile }}
              # The Secret is optional, and while it does not exist yet
              # Kubernetes puts an empty directory where the file would be.
              # A directory has a size too, so both tests are needed before
              # the path is read as a login.
              login=/etc/git/credentials
              if [ -f "${login}" ] && [ -s "${login}" ]; then
                origin="$(cat "${login}")"
              fi
              {{- end }}
              for attempt in 1 2 3 4 5; do
                if [ -d {{ $lifecycleDeployments.path | default "/data/gentian-deployments" }}/.git ]; then
                  exit 0
                fi
                if git clone "${origin}" {{ $lifecycleDeployments.path | default "/data/gentian-deployments" }}; then
                  exit 0
                fi
                echo "git clone attempt ${attempt} failed; retrying..."
                sleep 15
              done
              exit 1
          env:
            - name: GENTIAN_DEPLOYMENTS_REPO
              value: {{ $lifecycleDeployments.repo | default "https://git.example.domain/gentian-deployments" | quote }}
            {{- if $gitBearer }}
            {{- include "gentian-os.gitBearerEnv" (dict "secret" $lifecycleGitCredsSecret "index" 0 "alone" true) | nindent 12 }}
            {{- end }}
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: deployments-checkout
              mountPath: {{ $lifecycleDeployments.path | default "/data/gentian-deployments" }}
            {{- if $gitLoginFile }}
            - mountPath: /etc/git/credentials
              name: git-credentials
              readOnly: true
              subPath: .git-credentials
            {{- end }}
      {{- end }}
      terminationGracePeriodSeconds: 10
