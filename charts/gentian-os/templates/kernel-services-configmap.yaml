{{- $ks := .Values.kernelServices -}}
{{- $stage := .Values.stage | default "dev" -}}
{{- $keycloakInternal := $ks.keycloakInternalURL -}}
{{- if not $keycloakInternal -}}
{{- $keycloakInternal = printf "http://gentian-idp-keycloak-keycloakx-http.platform-kernel.svc.cluster.local:8080" -}}
{{- end -}}
{{- /*
  Cluster-service hostnames follow a fixed naming convention
  (<service>-<stage>.<namespace>.svc.cluster.local) and don't need to be
  hand-specified per cluster — derive them from stage/infraNamespace,
  but still allow an explicit override in kernelServices.* for the rare
  case a cluster genuinely needs a different endpoint.
*/ -}}
{{- $infraNS := .Values.infraNamespace | default (printf "gentian-infra-%s" $stage) -}}
{{- /* The InfraData composition names this release gentian-mariadb-<stage>
       (crossplane/compositions/infra-data.yaml), same as gentian-postgresql-<stage>.
       The default here used to omit the "gentian-" prefix, so MYSQL_HOST pointed at
       a Service that does not exist — silently, since nothing resolves it until an
       app tries to connect. minio-<stage> and redis-<stage>-master below carry no
       prefix, which is why the inconsistency was easy to miss. */ -}}
{{- $mysqlHost := $ks.mysqlHost | default (printf "gentian-mariadb-%s.%s.svc.cluster.local" $stage $infraNS) -}}
{{- $redisHost := $ks.redisHost | default (printf "redis-%s-master.%s.svc.cluster.local" $stage $infraNS) -}}
{{- $s3Endpoint := $ks.s3Endpoint | default (printf "http://minio-%s.%s.svc.cluster.local:9000" $stage $infraNS) -}}
{{- /* The kernel mail stack runs in servicesNamespace (platform-kernel), not
       gentian-<stage>. mailSharedPostfixHost() in the mail reconciler reads
       MAIL_SMTP_HOST — this value — BEFORE falling back to servicesNamespace, so a
       gentian-<stage> default here silently overrides the correct location and
       every tenant app is handed an SMTP host that does not resolve. */ -}}
{{- $smtpHost := $ks.smtpHost | default (printf "postfix-%s.%s.svc.cluster.local" $stage .Values.servicesNamespace) -}}
{{- if or .Values.kernelDomain .Values.tenancyMode $ks.s3Endpoint $ks.mysqlHost $ks.redisHost $ks.smtpHost $keycloakInternal }}
{{- /*
  Pod env configMapKeyRef only resolves same-namespace — a plain Kubernetes
  restriction, not something a namespace field on the ref can work around.
  Kernel SERVICES (keycloak-idp, etc.) that need KERNEL_DOMAIN/TENANCY_MODE
  live in platform-kernel, not this release's own namespace (gentian-system),
  so this ConfigMap is mirrored into both — same name, same data, so any
  existing platform-kernel configMapKeyRef to "gentian-kernel-services"
  just works without a separate reference convention to maintain.
*/ -}}
{{- range $ns := list .Release.Namespace "platform-kernel" | uniq }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: gentian-kernel-services
  namespace: {{ $ns }}
  labels:
    {{- include "gentian-os.labels" $ | nindent 4 }}
    gentianos.io/config-type: kernel-services
data:
  {{- with $.Values.kernelDomain }}
  KERNEL_DOMAIN: {{ . | quote }}
  {{- end }}
  TENANCY_MODE: {{ $.Values.tenancyMode | default "multi" | quote }}
  {{- $issuer := include "gentian.tenantDNS01ClusterIssuer" $ }}
  ACME_STAGING: {{ if contains "staging" $issuer }}"true"{{ else }}"false"{{ end }}
  KEYCLOAK_INTERNAL_URL: {{ $keycloakInternal | quote }}
  {{- with $smtpHost }}
  SMTP_HOST: {{ . | quote }}
  {{- end }}
  {{- with $s3Endpoint }}
  S3_ENDPOINT: {{ . | quote }}
  {{- end }}
  {{- with $mysqlHost }}
  MYSQL_HOST: {{ . | quote }}
  {{- end }}
  {{- with $redisHost }}
  REDIS_HOST: {{ . | quote }}
  {{- end }}
  {{- /* Cluster-supplied passthrough entries. Kept last and rendered verbatim so
         a cluster can publish a value an app profile needs without gentian-os
         carrying a field named after that app. */ -}}
  {{- range $key, $value := $ks.extra }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- end }}
