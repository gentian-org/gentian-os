{{- $ks := .Values.kernelServices -}}
{{- $stage := .Values.stage | default "dev" -}}
{{- $keycloakInternal := $ks.keycloakInternalURL -}}
{{- if not $keycloakInternal -}}
{{- $keycloakInternal = printf "http://gentian-idp-keycloak-keycloakx-http.%s.svc.cluster.local:8080" (.Values.layout.authentication | default "kernel-authentication") -}}
{{- end -}}
{{- /*
  Cluster-service hostnames follow a fixed naming convention
  (<service>-<stage>.<namespace>.svc.cluster.local) and don't need to be
  hand-specified per cluster — derive them from stage/infraNamespace,
  but still allow an explicit override in kernelServices.* for the rare
  case a cluster genuinely needs a different endpoint.
*/ -}}
{{- $infraNS := .Values.infraNamespace | default "kernel-authentication" -}}
{{- /* The composition names this release gentian-mariadb-<stage>, same as
       gentian-postgresql-<stage>. */ -}}
{{- $mysqlHost := $ks.mysqlHost | default (printf "gentian-mariadb-%s.%s.svc.cluster.local" $stage $infraNS) -}}
{{- /* The shared cache's Service cache in its system namespace
       (kernel/services/infra-cache), the address the operator also records
       in the cache-admin Secret. */ -}}
{{- $cacheHost := $ks.cacheHost | default "cache.system-cache.svc.cluster.local" -}}
{{- /* The object store's Service s3 in its system namespace
       (kernel/services/infra-seaweedfs), the address the operator also
       records in the s3-admin Secret. */ -}}
{{- $s3Endpoint := $ks.s3Endpoint | default "http://s3.system-s3.svc.cluster.local:9000" -}}
{{- /* Postfix runs in the mail namespace of the system tier (system-mail,
       kernel/namespaces.yaml), where the mail ApplicationSet deploys it. This
       default named servicesNamespace, which is the edge: a host that resolves
       to nothing. The operator's own fallback, mailSharedPostfixHost() in the
       mail reconciler, names the same Service as this line. */ -}}
{{- $smtpHost := $ks.smtpHost | default (printf "postfix-%s.%s.svc.cluster.local" $stage (.Values.mailNamespace | default "system-mail")) -}}
{{- if or .Values.kernelDomain .Values.tenancyMode $ks.s3Endpoint $ks.mysqlHost $ks.cacheHost $ks.smtpHost $keycloakInternal }}
{{- /*
  A pod's configMapKeyRef reads its own namespace only. keycloak-idp reads
  this ConfigMap in the authentication namespace, so it is rendered there.
  kernel-control's ConfigMap of the same name is the bootstrap chart's
  (kernel/bootstrap/chart/templates/kernel-services.yaml).
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: gentian-kernel-services
  namespace: {{ .Values.layout.authentication | default "kernel-authentication" }}
  labels:
    {{- include "gentian-os.labels" $ | nindent 4 }}
    gentianos.io/config-type: kernel-services
data:
  {{- with $.Values.kernelDomain }}
  KERNEL_DOMAIN: {{ . | quote }}
  {{- end }}
  TENANCY_MODE: {{ $.Values.tenancyMode | default "multi" | quote }}
  {{- $issuer := include "gentian.tenantDNS01ClusterIssuer" $ }}
  ACME_STAGING: {{ if contains "staging" $issuer }}"true"{{ else }}"false"{{ end }}
  KEYCLOAK_INTERNAL_URL: {{ $keycloakInternal | quote }}
  {{- with $smtpHost }}
  SMTP_HOST: {{ . | quote }}
  {{- end }}
  {{- with $s3Endpoint }}
  S3_ENDPOINT: {{ . | quote }}
  {{- end }}
  {{- with $mysqlHost }}
  MYSQL_HOST: {{ . | quote }}
  {{- end }}
  {{- with $cacheHost }}
  CACHE_HOST: {{ . | quote }}
  {{- end }}
  {{- /* Cluster-supplied passthrough entries. Kept last and rendered verbatim so
         a cluster can publish a value an app profile needs without gentian-os
         carrying a field named after that app. */ -}}
  {{- range $key, $value := $ks.extra }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
