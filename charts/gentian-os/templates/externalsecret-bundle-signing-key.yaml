{{- /*
  The key the operator signs bundle manifests with.

  32 random bytes the installer wrote to the vault once, as hex. The
  operator derives an Ed25519 key pair from them, signs each bundle's
  manifest with the private half and checks a bundle it restores with the
  public half: only a bundle this cluster signed, of a tenant of the same
  name, brings back the rights granted in the tenant. Nothing else holds
  the seed but the vault and the recovery kit, and it is not a Helm value.

  The operator mounts the Secret as an optional file. Until the vault path
  exists this object is not Ready, the file is not there, and bundles are
  written unsigned and say so.
*/ -}}
{{- with .Values.bundleSigning.signingKey }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .secretName | quote }}
  labels:
    {{- include "gentian-os.labels" $ | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: {{ .secretName | quote }}
    creationPolicy: Owner
    # Retain: a chart upgrade that briefly removes this object must not
    # take the cluster's signing key with it.
    deletionPolicy: Retain
  data:
    - secretKey: {{ .property | quote }}
      remoteRef:
        key: {{ .openbaoPath | quote }}
        property: {{ .property | quote }}
{{- end }}
