{{- /*
  The registrar: what keeps the list of people -- invites them, puts them in
  groups, removes them -- at Keycloak, for the person entitled to ask
  (operator-split-plan.md §4.4).

  A Deployment of its own, with a ServiceAccount of its own, as the director
  and the custodian are. The director is the one thing that may push to git;
  the registrar is the one thing that holds a Keycloak client credential for
  each realm. They were one process, which could then change both what the
  cluster runs and who may sign in to it.

  What it may do in the cluster is listed below and is all it needs: read the
  tenants, to tell which realm a tenant's people live in, and read the Cluster
  claim, to learn which group's members administer the platform -- the group
  it refuses to touch. It may read no Secret: the realm credentials are
  mounted, handed over by the operator, which holds the administrative
  credential that creates them.

  One kind it may write: MailboxRemoval, the record of what whoever removed a
  person decided about that person's mailbox -- archive it, or delete it. The
  registrar writes the decision down and the operator carries it out; the
  registrar has no right in the mail server's namespace and mounts nothing of
  its volume. It may take a record back (delete) when the removal it was
  written for failed, and change one (update) to ask for an archived mailbox
  to be deleted.

  Who may ask it for anything is the authorization store's answer, asked with
  the caller's own verified token on every request.

  ClusterIP only. Reaching it from outside the cluster is a routing decision
  somebody makes explicitly, not a default this chart ships.
*/ -}}
{{- if .Values.registrar.enabled }}
{{- $name := printf "%s-registrar" (include "gentian-os.fullname" .) }}
{{- $deployments := .Values.appLifecycle.deployments | default dict }}
{{- $keycloak := .Values.director.jwksBaseURL | default (printf "http://gentian-idp-keycloak-keycloakx-http.%s.svc.cluster.local:8080/auth" (.Values.layout.authentication | default .Values.servicesNamespace)) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gentian-os.labels" . | nindent 4 }}
    app.kubernetes.io/component: registrar
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "gentian-os.labels" . | nindent 4 }}
    app.kubernetes.io/component: registrar
rules:
  # Whose realm is whose, and which group administers the platform. Read
  # only, and nothing else in the cluster.
  - apiGroups: ["gentianos.io"]
    resources: ["tenants", "clusters"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gentianos.io"]
    resources: ["mailboxremovals"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "gentian-os.labels" . | nindent 4 }}
    app.kubernetes.io/component: registrar
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gentian-os.labels" . | nindent 4 }}
    app.kubernetes.io/component: registrar
spec:
  selector:
    {{- include "gentian-os.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: registrar
  ports:
    - name: registrar
      port: {{ .Values.registrar.port }}
      targetPort: registrar
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gentian-os.labels" . | nindent 4 }}
    app.kubernetes.io/component: registrar
spec:
  replicas: {{ .Values.registrar.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "gentian-os.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: registrar
  template:
    metadata:
      labels:
        {{- include "gentian-os.labels" . | nindent 8 }}
        app.kubernetes.io/component: registrar
    spec:
      serviceAccountName: {{ $name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registrar
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/registrar"]
          ports:
            - name: registrar
              containerPort: {{ .Values.registrar.port }}
              protocol: TCP
          env:
            {{- include "gentian-os.layoutEnv" . | nindent 12 }}
            {{- with .Values.trustAnchorSecret }}
            - name: SSL_CERT_FILE
              value: /opt/gentian-trust-anchor/ca.crt
            {{- end }}
            - name: REGISTRAR_ADDR
              value: ":{{ .Values.registrar.port }}"
            # The domain a tenant that adopts the kernel realm signs in under.
            - name: KERNEL_DOMAIN
              value: {{ .Values.kernelDomain | quote }}
            # The cluster, as the authorization store names it: the object
            # cluster verbs are asked about. The director's.
            - name: GENTIAN_DEPLOYMENTS_CLUSTER_ID
              value: {{ $deployments.cluster | default "" | quote }}
            # How a caller's token is verified before the store is asked about
            # them: the issuer it names, and where that issuer's keys are read
            # inside the cluster. The audience is the zone token's, which a
            # console relays here as it does to the director.
            - name: REGISTRAR_ISSUER_BASE_URL
              value: {{ printf "https://id.%s/auth" .Values.kernelDomain | quote }}
            - name: REGISTRAR_JWKS_BASE_URL
              value: {{ $keycloak | quote }}
            - name: REGISTRAR_AUDIENCE
              value: {{ .Values.director.audience | quote }}
            # Where Keycloak's admin API is called: in-cluster, like the keys.
            # The public host refuses /auth/admin by design (it redirects to a
            # sign-in), so a call there comes back as an HTML page.
            - name: REGISTRAR_IDENTITY_BASE_URL
              value: {{ $keycloak | quote }}
            # Each tenant's desktop API, where the settings templates an
            # invitation may apply live. %s is the tenant; the desktop is the
            # component named "desktop" in the tenant's namespace. The
            # caller's own token is relayed, so the desktop still decides.
            - name: REGISTRAR_DESKTOP_API_URL
              value: {{ .Values.registrar.desktopAPI | default "http://desktop-gentian-portal-api.tenant-%s.svc.cluster.local:8000/api/v1" | quote }}
            # The authorization store, read and never written.
            - name: OPENFGA_API_URL
              value: {{ .Values.director.openfgaURL | default .Values.authzBridge.openfgaURL | quote }}
            {{- if .Values.director.openfgaTokenSecretRef.name }}
            - name: OPENFGA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.director.openfgaTokenSecretRef.name }}
                  key: {{ .Values.director.openfgaTokenSecretRef.key }}
                  optional: true
            {{- end }}
            {{- /* Where the registrar reads its Keycloak credentials.

                 One file per realm, written by the operator's Keycloak
                 platform reconciler: it holds the admin credential and the
                 registrar does not, so the credentials are handed over rather
                 than fetched.

                 A realm the registrar holds no file for is a realm it cannot
                 name, let alone reach. That is the confinement: a missed
                 authorization check cannot cross into another tenant's realm
                 because there is no credential for it to cross with. */}}
            - name: REGISTRAR_REALM_CREDENTIALS_PATH
              value: /etc/gentian/realms
            {{- /* The durable record of WHO WAS ALLOWED to ask for a change
                 to a person (S7A.17).

                 A database and not a commit, and this is the one place the
                 platform chooses that deliberately: git's append-only history
                 is what makes it right for configuration and wrong for a
                 record about people. This one has a retention horizon.

                 Optional. A cluster whose database has not been provisioned
                 starts anyway and keeps only the log line, because taking the
                 people screens down over an audit trail is the worse failure.
                 The registrar warns at start which it is. */}}
            {{- with .Values.registrar.recordDatabase }}
            {{- if .secretName }}
            - name: REGISTRAR_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName | quote }}
                  key: {{ .secretKey | default "uri" | quote }}
                  optional: true
            {{- end }}
            {{- with .retention }}
            - name: REGISTRAR_RECORD_RETENTION
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: registrar
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: registrar
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml (.Values.registrar.resources | default (dict "requests" (dict "cpu" "20m" "memory" "48Mi") "limits" (dict "memory" "192Mi"))) | nindent 12 }}
          volumeMounts:
            - name: realm-credentials
              mountPath: /etc/gentian/realms
              readOnly: true
            {{- with .Values.trustAnchorSecret }}
            - name: kernel-trust-anchor
              mountPath: /opt/gentian-trust-anchor
              readOnly: true
            {{- end }}
      volumes:
        # Optional, and re-read rather than read once: the operator writes a
        # realm's key when the realm appears, which for every tenant is after
        # this pod started. A registrar that read the directory at boot would
        # never speak for a tenant created since.
        - name: realm-credentials
          secret:
            secretName: gentian-registrar-realms
            optional: true
        {{- with .Values.trustAnchorSecret }}
        - name: kernel-trust-anchor
          secret:
            secretName: {{ . }}
        {{- end }}
{{- end }}
