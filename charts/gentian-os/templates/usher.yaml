{{- /*
  The usher: what a signed-in person's desktop asks to learn what is here and
  what that person may open (operator-split-plan.md §3.10).

  It runs in the control namespace beside the director, from the operator's
  image with its own command: the edge namespace holds what a Gateway must
  reach, and no Gateway reaches this. It holds what the bouncer holds -- the
  identity provider's public keys and the authorization store's credential --
  and one thing more: an identity the operator's listener admits to reads of
  live state and to nothing else. No RBAC and no token for the API server,
  no route on a Gateway -- a console's backend reaches it in-cluster with the
  person's own token. What it lists is the operator's tile catalogue, mounted
  as a file.

  That identity is its ServiceAccount. The pod mounts a token for it issued
  for the operator's listener alone (appLifecycle.audience), which the kubelet
  replaces every few minutes and the usher reads on every request. Nothing
  renders or stores a credential for it.
*/ -}}
{{- if .Values.usher.enabled }}
{{- $ns := .Release.Namespace }}
{{- $name := printf "%s-usher" (include "gentian-os.fullname" .) }}
{{- $deployments := .Values.appLifecycle.deployments | default dict }}
{{- if .Values.director.openfgaTokenSecretRef.openbaoPath }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-openfga-token
  namespace: {{ $ns }}
  labels:
    {{- include "gentian-os.labels" . | nindent 4 }}
    app.kubernetes.io/component: usher
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: {{ $name }}-openfga-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: {{ .Values.director.openfgaTokenSecretRef.key }}
      remoteRef:
        key: {{ .Values.director.openfgaTokenSecretRef.openbaoPath }}
        property: {{ .Values.director.openfgaTokenSecretRef.property }}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gentian-os.usherServiceAccountName" . }}
  namespace: {{ $ns }}
  labels:
    {{- include "gentian-os.labels" . | nindent 4 }}
    app.kubernetes.io/component: usher
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "gentian-os.labels" . | nindent 4 }}
    app.kubernetes.io/component: usher
spec:
  selector:
    {{- include "gentian-os.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: usher
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "gentian-os.labels" . | nindent 4 }}
    app.kubernetes.io/component: usher
spec:
  replicas: {{ .Values.usher.replicas }}
  selector:
    matchLabels:
      {{- include "gentian-os.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: usher
  template:
    metadata:
      labels:
        {{- include "gentian-os.labels" . | nindent 8 }}
        app.kubernetes.io/component: usher
    spec:
      serviceAccountName: {{ include "gentian-os.usherServiceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "gentian-os.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: usher
      containers:
        - name: usher
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usher"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: USHER_LISTEN
              value: ":8080"
            - name: USHER_TILES_PATH
              value: /etc/gentian/tiles/tiles.yaml
            - name: USHER_AUDIENCE
              value: {{ .Values.director.audience | quote }}
            - name: DIRECTOR_ISSUER_BASE_URL
              value: {{ printf "https://id.%s/auth" .Values.kernelDomain | quote }}
            - name: DIRECTOR_JWKS_BASE_URL
              value: {{ .Values.director.jwksBaseURL | default (printf "http://gentian-idp-keycloak-keycloakx-http.%s.svc.cluster.local:8080/auth" (.Values.layout.authentication | default .Values.servicesNamespace)) | quote }}
            - name: OPENFGA_API_URL
              value: {{ .Values.director.openfgaURL | default .Values.authzBridge.openfgaURL | quote }}
            {{- if .Values.director.openfgaTokenSecretRef.openbaoPath }}
            - name: OPENFGA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}-openfga-token
                  key: {{ .Values.director.openfgaTokenSecretRef.key }}
                  optional: true
            {{- end }}
            # The cluster's id: the object cluster relations are asked about.
            - name: GENTIAN_DEPLOYMENTS_CLUSTER_ID
              value: {{ $deployments.cluster | default "" | quote }}
            # Whether this cluster reports what it runs. The App Store is
            # offered only where it does; the tiles answer says which.
            - name: USHER_LICENCE_REPORT_ENABLED
              value: {{ include "gentian-os.licenceReporting" . | default "false" | quote }}
            # The operator's listener, for reads of live state, and where this
            # pod's token for it is projected.
            - name: USHER_LIFECYCLE_URL
              value: {{ .Values.usher.appLifecycleURL | default (printf "http://%s-lifecycle.%s.svc.cluster.local:%v" (include "gentian-os.fullname" .) .Release.Namespace .Values.appLifecycle.port) | quote }}
            - name: USHER_LIFECYCLE_TOKEN_FILE
              value: /var/run/secrets/gentian/operator/token
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.usher.resources | nindent 12 }}
          volumeMounts:
            - name: tiles
              mountPath: /etc/gentian/tiles
              readOnly: true
            - name: operator-token
              mountPath: /var/run/secrets/gentian/operator
              readOnly: true
      volumes:
        # The operator's tile catalogue. Optional so the pod starts before the
        # first projection; until then the tiles route answers 503.
        - name: tiles
          configMap:
            name: gentian-tiles
            optional: true
        {{- include "gentian-os.operatorTokenVolume" . | nindent 8 }}
{{- end }}
