{{- /*
The ingress half's credential, materialised from its own OpenBao path.

A second ExternalSecret rather than another key on the DNS one, because they
are two credentials: Zone -> DNS -> Edit is zone-scoped, Account -> Cloudflare
One Connector: cloudflared -> Edit is account-scoped, and a token may hold
either without the other. Sharing a Secret would make narrowing one of them
later mean rewriting the other's consumer too.

Rendered only when a path is configured. Unset, the operator falls back to the
DNS token at runtime -- which is what an already-installed single-token cluster
relies on, and why this is additive rather than a migration.
*/}}
{{- if and .Values.cloudflare.tunnelAPITokenSecretRef.name .Values.cloudflare.tunnelAPITokenSecretRef.openbaoPath }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.cloudflare.tunnelAPITokenSecretRef.name }}
  labels:
    {{- include "gentian-os.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: {{ .Values.cloudflare.tunnelAPITokenSecretRef.name }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: {{ .Values.cloudflare.tunnelAPITokenSecretRef.key | default "api-token" | quote }}
      remoteRef:
        key: {{ .Values.cloudflare.tunnelAPITokenSecretRef.openbaoPath | quote }}
        property: {{ .Values.cloudflare.tunnelAPITokenSecretRef.key | default "api-token" | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
