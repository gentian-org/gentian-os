{{- /*
  The registrar's connection to its own database, assembled from the role
  password OpenBao holds.

  The password is one value in one place (gentian-os/kernel/database/postgresql,
  written by the installer's seed), and the DSN is templated around it here so
  the registrar reads one environment variable rather than four and no part of
  the credential is a Helm value.

  What the database is for: the record of WHO WAS ALLOWED to ask for a change
  to a person (S7A.17). Keycloak's own admin event says what changed, and it is
  the better witness for that because it is written whether the change came
  through the registrar or through Keycloak's console; it sees only the
  registrar's service account, so it cannot say who asked or what permitted the
  call. The two halves join on a request id.

  A database rather than a commit, and this is the one place the platform makes
  that choice on purpose. Git gives every change an author, a time and a diff —
  the standard the rest of the console is held to — but append-only history is
  exactly what makes it wrong for a record about people. This one has a
  retention horizon and something that enforces it.

  Optional throughout: the Deployment reads it with optional: true and the
  registrar starts without it, warning that identity actions are logged and
  not recorded. A cluster mid-provision is then a worse record rather than
  people screens that will not load.
*/ -}}
{{- with .Values.registrar.recordDatabase }}
{{- if and $.Values.registrar.enabled .secretName }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .secretName | quote }}
  labels:
    {{- include "gentian-os.labels" $ | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: {{ .secretName | quote }}
    creationPolicy: Owner
    # Retain, like the other credentials here: a chart upgrade that briefly
    # removes this object must not take the registrar's database access with it.
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        {{ .secretKey | default "uri" }}: "postgresql://{{ .role | default "registrar_user" }}:{{ "{{" }} .password }}@{{ .host | default (printf "kernel-postgres-rw.%s.svc.cluster.local" (.namespace | default "kernel-data")) }}:5432/{{ .database | default "registrar" }}?sslmode=disable"
  data:
    - secretKey: password
      remoteRef:
        key: gentian-os/kernel/database/postgresql
        property: {{ .passwordKey | default "registrar_user_password" | quote }}
{{- end }}
{{- end }}
