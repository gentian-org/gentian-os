{{- /*
  The home sync (internal/homesync, gentian-os#1156): keeps the calendars and
  contacts the tenant's apps keep of their own equal to the tenant's home.
  Every tenant gets one, as it gets a desktop. It acts for the people who sign
  in to an app that declares homeSync, towards that app and the tenant's
  homes, with tokens it obtains by vouching -- which is why it is of the
  platform's trust. It exposes nothing; the realm reads its keys from its
  Service.
*/ -}}
{{- if .Values.homesync.enabled }}
{{- /*
  The chart is published with the image the operator runs, so it follows
  image.tag, which Image Updater moves on every build: <branch>-<sha> was
  published as 0.1.0-<branch>.<sha>, a release X.Y.Z as 0.1.0-vX.Y.Z;
  anything else follows the moving chart of develop. homesync.chart.version,
  when set, wins.
*/ -}}
{{- $hsTag := .Values.image.tag | default "" }}
{{- $hsVersion := "0.1.0-develop" }}
{{- if regexMatch "^[0-9]+\\.[0-9]+\\.[0-9]+$" $hsTag }}
{{- $hsVersion = printf "0.1.0-v%s" $hsTag }}
{{- else if regexMatch "^[a-z0-9-]+-[0-9a-f]{7}$" $hsTag }}
{{- $hsVersion = regexReplaceAll "^(.+)-([0-9a-f]{7})$" $hsTag "0.1.0-${1}.${2}" }}
{{- end }}
{{- $hsVersion = .Values.homesync.chart.version | default $hsVersion }}
apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  name: homesync
  labels:
    {{- include "gentian-os.labels" . | nindent 4 }}
    gentianos.io/profile-name: homesync
spec:
  classes: [app]
  launch: none
  trustTier: platform
  version: {{ $hsVersion | quote }}
  placement:
    tenants: every
  package:
    chart:
      repository: {{ .Values.homesync.chart.repository | quote }}
      name: {{ .Values.homesync.chart.name | quote }}
      version: {{ $hsVersion | quote }}
    valueMapping:
      platform:
        tenantKey: tenant
        registrarUrlKey: registrar.url
      database:
        secretNameKey: existingSecret.name
  requires:
    services:
      # Where the state of every pair of records is kept.
      database:
        engine: postgresql
      # A person's token for an app (app-<profile>) and for the tenant's
      # homes (home-<profile>), asked with statements the realm verifies
      # against the keys published here.
      vouching:
        keys:
          service: homesync
          port: 8080
          path: /.well-known/jwks.json
        homes: true
{{- end }}
