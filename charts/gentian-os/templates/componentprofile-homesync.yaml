{{- /*
  The home sync (internal/homesync, gentian-os#1156): keeps the calendars and
  contacts the tenant's apps keep of their own equal to the tenant's home.
  Every tenant gets one, as it gets a desktop. It acts for the people who sign
  in to an app that declares homeSync, towards that app and the tenant's
  homes, with tokens it obtains by vouching -- which is why it is of the
  platform's trust. It exposes nothing, and signs with the key the platform
  issues it.
*/ -}}
{{- if .Values.homesync.enabled }}
{{- $hsVersion := include "gentian-os.componentChartVersion" (list . "homesync") }}
apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  name: homesync
  labels:
    {{- include "gentian-os.labels" . | nindent 4 }}
    gentianos.io/profile-name: homesync
spec:
  classes: [app]
  launch: none
  trustTier: platform
  version: {{ $hsVersion | quote }}
  placement:
    tenants: every
  package:
    chart:
      repository: {{ .Values.homesync.chart.repository | quote }}
      name: {{ .Values.homesync.chart.name | quote }}
      version: {{ $hsVersion | quote }}
    valueMapping:
      platform:
        tenantKey: tenant
        registrarUrlKey: registrar.url
      database:
        secretNameKey: existingSecret.name
  requires:
    services:
      # Where the state of every pair of records is kept.
      database:
        engine: postgresql
      # A person's token for an app (app-<profile>) and for the tenant's
      # homes (home-<profile>), asked with statements signed with the key
      # the platform issues it.
      vouching:
        keys: {}
        homes: true
{{- end }}
