{{- $webhook := .Values.webhook | default dict }}
{{- if ($webhook.enabled | default false) }}
{{- $failurePolicy := $webhook.failurePolicy | default "Fail" }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "gentian-os.fullname" . }}-tenant-validator
  labels:
    {{- include "gentian-os.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "gentian-os.fullname" . }}-webhook-cert
webhooks:
  - name: vtenant.gentianos.io
    admissionReviewVersions:
      - v1
    sideEffects: None
    failurePolicy: {{ $failurePolicy }}
    matchPolicy: Equivalent
    timeoutSeconds: 10
    rules:
      - apiGroups: ["gentianos.io"]
        apiVersions: ["v1alpha1"]
        # DELETE too: the tenant that adopts the kernel realm is refused.
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["tenants"]
        scope: "*"
    clientConfig:
      service:
        namespace: {{ .Release.Namespace }}
        name: {{ include "gentian-os.fullname" . }}-webhook
        path: /validate-gentianos-io-v1alpha1-tenant
        port: 443
  {{- /*
    Only the Tenant webhook is routed. The +kubebuilder:webhook marker on the
    validator does not produce this: the manifests target generates crd and
    rbac only, so this file is hand-maintained and a new webhook has to be
    added here by hand.

    There is no profile webhook. What a profile must satisfy is CEL on the
    CRD itself — exactly one package, launch agreeing with the tiles, a
    service's console only on the gateway — which the API server enforces
    without a webhook to be unavailable. A category is presentation and lives
    in the store's listing (AD-3), outside the cluster.
  */}}
{{- end }}
