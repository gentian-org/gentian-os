{{- /*
  The desktop: the one component the OS ships itself (ui-restructure.md §1).
  Every tenant gets one from this profile, the platform tenant included --
  its desktop is the platform console, in the kernel zone (AD-10). The
  profile is what the desktop is: a tenant component of platform trust, a
  database requirement, and two gateway exposures on one host, the API's
  forwarding the edge token because the BFF relays it to the director and to
  nothing else. What the platform tells it -- realm, zone client, director --
  is the component reconciler's, not the profile's.
*/ -}}
{{- if .Values.desktop.enabled }}
apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  name: desktop
  labels:
    {{- include "gentian-os.labels" . | nindent 4 }}
  annotations:
    gentianos.io/desktop: "true"
spec:
  tenancy: [tenant]
  trustTier: platform
  version: {{ .Values.desktop.chart.version | quote }}
  # Every tenant gets one. Declared here, on the profile, so that the operator
  # creates it without knowing the desktop by name: the administration
  # console declares the same and is created the same way.
  defaultForTenants: true
  package:
    chart:
      repository: {{ .Values.desktop.chart.repository | quote }}
      name: {{ .Values.desktop.chart.name | quote }}
      version: {{ .Values.desktop.chart.version | quote }}
    valueMapping:
      # Where the desktop chart takes the facts of the cluster it runs in.
      # These used to arrive through a special case in the operator keyed on
      # the annotation above; now the profile says where they go and the
      # operator fills them for any profile that asks. The chart derives what
      # it may offer from zoneKind rather than being handed a capability list.
      platform:
        issuerKey: auth.issuer
        zoneClientIdKey: auth.clientId
        audienceKey: auth.audience
        directorUrlKey: director.url
        clusterKey: director.cluster
        tenantKey: tenant
        kernelDomainKey: kernelDomain
        realmKey: kernelRealm
        zoneKindKey: zoneKind
      database:
        # The desktop consumes its credentials Secret whole, with envFrom, so
        # it is told the Secret's name and nothing else.
        secretNameKey: existingSecret.name
    extraValues:
      # The shape of the desktop chart as the platform runs it: the edge holds
      # the session, so the bundle runs no code flow; and the desktop holds no
      # Kubernetes authority, routes nothing of its own, and needs no policy
      # of its own, because the component reconciler writes all three.
      auth:
        disabled: false
        mode: edge
      rbac:
        create: false
      gateway:
        enabled: false
      networkPolicy:
        create: false
      api:
        env:
          TENANCY_MODE: multi
      {{- with .Values.desktop.extraValues }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
  requires:
    contracts:
      database:
        engine: postgresql
        databasePerTenant: true
  expose:
    # The BFF: the same-origin relay the shell talks to. It relays to the
    # director with the user's own token, which is why this entry -- and
    # only this entry -- forwards the edge token (AD-13).
    - name: api
      surface: gateway
      authMode: oidc
      # console.<zone>, the desktop's name in every zone (networking.md §3);
      # the operator's redirects and frame policies assume it.
      subDomain: console
      paths: ["/api", "/healthz", "/readyz"]
      forwardToken: true
      backend:
        service: desktop-gentian-portal-api
        port: 8000
    # The shell: a static bundle served from the tenant's own origin.
    - name: web
      surface: gateway
      authMode: oidc
      subDomain: console
      backend:
        service: desktop-gentian-portal-web
        port: 8080
{{- end }}
