{{- if .Values.credentialManager.enabled }}
# ClusterIP only, and deliberately so: this service writes credentials, and the
# write path authorises the CALLER's OIDC token rather than holding one. Reaching
# it from outside the cluster is a routing decision an operator makes explicitly,
# not a default the chart ships.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gentian-os.fullname" . }}-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gentian-os.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "gentian-os.selectorLabels" . | nindent 4 }}
  ports:
    - name: credentials
      port: {{ .Values.credentialManager.port }}
      targetPort: credentials
      protocol: TCP
{{- end }}
