{{- $servicesNs := .Values.servicesNamespace | default "platform-kernel" }}
{{- $openbaoNs := .Values.openbaoNamespace | default "openbao" }}
{{- $saName := include "gentian-os.serviceAccountName" . }}
{{- $saNamespace := .Release.Namespace }}

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gentian-os.fullname" . }}-exec
  namespace: {{ $servicesNs | quote }}
  labels:
    {{- include "gentian-os.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gentian-os.fullname" . }}-exec
  namespace: {{ $servicesNs | quote }}
  labels:
    {{- include "gentian-os.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gentian-os.fullname" . }}-exec
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ $saNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gentian-os.fullname" . }}-exec
  namespace: {{ $openbaoNs | quote }}
  labels:
    {{- include "gentian-os.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gentian-os.fullname" . }}-exec
  namespace: {{ $openbaoNs | quote }}
  labels:
    {{- include "gentian-os.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gentian-os.fullname" . }}-exec
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ $saNamespace }}
