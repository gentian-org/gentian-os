{{- $webhook := .Values.webhook | default dict }}
{{- if ($webhook.enabled | default false) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gentian-os.fullname" . }}-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gentian-os.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "gentian-os.selectorLabels" . | nindent 4 }}
  ports:
    - name: https
      port: 443
      targetPort: webhook
      protocol: TCP
{{- end }}
