{{- /*
  Syncs the OpenFGA API token used by the Stage 1 authz bridge out of OpenBao
  into a Secret the operator Deployment reads via secretKeyRef.

  Before this, the token travelled as a Helm value: the installer read it from
  openfga-sensitive-values, passed it with --set, and then pinned it into the
  Argo CD Application's spec.sources[0].helm.parameters. That left the token in
  cleartext in the Application object — readable by anyone with get on
  Applications, printed by `argocd app get`, and captured in every backup or
  git mirror of that spec — and again as a literal env value in the Deployment.

  Deliberately NOT rendered when a literal authzBridge.openfgaToken is still
  set. That deployment reads the literal (see deployment.yaml), so nothing would
  consume this Secret — and because the OpenBao path is only written by an
  installer run that succeeded in storing the token, the ExternalSecret would
  sit permanently in SecretSyncError against a path that does not exist,
  dragging the whole Application's health down for a credential nothing reads.
*/ -}}
{{- if and .Values.authzBridge.enabled (not .Values.authzBridge.openfgaToken) .Values.authzBridge.openfgaTokenSecretRef.name .Values.authzBridge.openfgaTokenSecretRef.openbaoPath }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.authzBridge.openfgaTokenSecretRef.name }}
  labels:
    {{- include "gentian-os.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: {{ .Values.authzBridge.openfgaTokenSecretRef.name }}
    creationPolicy: Owner
    # Retain, matching externalsecret-cloudflare.yaml: a chart upgrade that
    # briefly removes this object must not take the operator's token with it.
    deletionPolicy: Retain
  data:
    - secretKey: {{ .Values.authzBridge.openfgaTokenSecretRef.key | default "api-token" | quote }}
      remoteRef:
        key: {{ .Values.authzBridge.openfgaTokenSecretRef.openbaoPath | quote }}
        property: {{ .Values.authzBridge.openfgaTokenSecretRef.key | default "api-token" | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
