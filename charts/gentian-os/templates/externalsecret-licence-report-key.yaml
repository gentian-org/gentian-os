{{- /*
  The key the operator signs its licence reports with.

  One value in one place: 32 random bytes the installer wrote to the vault
  when it installed this cluster, as hex. The operator derives an Ed25519 key
  pair from them, signs each report's body with the private half and puts the
  public half in the body. Nothing else holds the seed, it is not a Helm
  value, and it is never sent.

  Rendered only while reporting is on: a cluster that sends nothing is given
  no key to send it with.

  The operator mounts the Secret as an optional file. Until the vault path
  exists this object is simply not Ready, the file is not there, and the
  operator records that it has no key rather than sending a report unsigned.
*/ -}}
{{- if include "gentian-os.licenceReporting" . }}
{{- with .Values.licenceReport.signingKey }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .secretName | quote }}
  labels:
    {{- include "gentian-os.labels" $ | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: {{ .secretName | quote }}
    creationPolicy: Owner
    # Retain, like the other credentials here: a chart upgrade that briefly
    # removes this object must not take the cluster's signing key with it.
    deletionPolicy: Retain
  data:
    - secretKey: {{ .property | quote }}
      remoteRef:
        key: {{ .openbaoPath | quote }}
        property: {{ .property | quote }}
{{- end }}
{{- end }}
