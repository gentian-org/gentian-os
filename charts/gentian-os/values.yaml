# Default values for the Gentian OS operator.
# Override in environment-specific files.

replicaCount: 1

# stage names kernel Helm releases (postfix-dev, keycloak-dev, …).
stage: dev

# kernelDomain is the cluster-wide platform DNS suffix (e.g. example.domain).
# Kernel UIs are served on this domain; tenant app zones depend on tenancyMode.
# Plumbed as KERNEL_DOMAIN. See docs/design/multi-tenancy.md §3.
kernelDomain: ""

# tenancyMode is who the cluster is for, and with it where a user tenant's hosts are
# (unless a TenantDomain binds a custom domain):
#   multi  — the platform tenant plus any number of user tenants, each at
#            {label}.{tenant}.{kernelDomain} (default, shared cluster)
#   single — the platform tenant plus exactly one user tenant, named user, at
#            {label}.{kernelDomain}; any other user tenant is refused
# The platform tenant's desktop is platform.{kernelDomain} under either.
# Plumbed as TENANCY_MODE; the Cluster claim's spec.tenancyMode wins once it is published.
tenancyMode: multi

# mailServiceMode is the cluster's mail stack — kernel or external — from the
# Cluster claim. external means Dovecot is not deployed, so the operator does
# not provision it: no per-realm Keycloak client, no XOAUTH2 realm auth, no
# domain registration. Plumbed as MAIL_SERVICE_MODE.
mailServiceMode: external

# routingMode selects the edge routing stack (Gateway API + Envoy Gateway).
# Plumbed as ROUTING_MODE.
routingMode: gateway

# handover controls the gate that keeps a cluster's recovery cheap until its
# administrator has been seen to write a credential through the login path.
#
# The proof is recorded by the custodian on the first successful
# cluster-admin token exchange — a normal portal sign-in produces it. Until
# then, creating a Tenant is refused with an explanation, because the recovery
# from a broken write path is re-initialising OpenBao: an inconvenience on an
# empty cluster and a data-loss event on one carrying tenants.
#
# gateTenants: false turns the gate off for a cluster that accepts that risk.
# A single tenant can be admitted without turning it off by annotating it
# gentianos.io/handover-override with a reason.
handover:
  gateTenants: true

# dnsProvider is who hosts the kernel domain's zone — an entry in
# kernel/platforms.yaml. It names the cluster's DNS-01 ClusterIssuer, which is
# what per-tenant wildcards default to.
dnsProvider: cloudflare

# tenantDNS01ClusterIssuer is the cert-manager ClusterIssuer used for per-tenant
# wildcard certificates (*.<effectiveDomain>). Must use a DNS-01 solver that can
# write records in the zone containing effectiveDomain (the platform zone, or the
# customer's zone for a tenant a TenantDomain binds). Plumbed as TENANT_DNS01_CLUSTER_ISSUER.
#
# Empty means the cluster's own issuer, derived from dnsProvider above. Set it
# only when tenant zones are hosted somewhere the kernel zone is not.
tenantDNS01ClusterIssuer: ""

# backupRecipients are age public keys (age1...) that tenant export bundles are
# encrypted to. Plumbed as BACKUP_AGE_RECIPIENTS.
#
# Set this before anyone expects a backup: with no recipient configured, an
# export requested without its own key fails rather than writing a tenant's
# data unencrypted. Scheduled exports have nobody to prompt, so this is what
# makes them possible at all.
#
# Keep the matching identity OFF the cluster — in the recovery kit alongside
# the master password. An identity stored in the cluster it protects is
# readable by whoever compromises that cluster, which is the case backups exist
# for. List more than one to allow independent recovery keys.
backupRecipients: []

# tenantProvisioning controls operator orchestration behaviour. When crossplaneOnly
# is true the operator skips shared-kernel side effects (mail, portal redirect)
# so tenant lifecycle is validated via the Crossplane graph alone (P3/P4 e2e).
# Set TENANT_CROSSPLANE_ONLY=true to roll back to Crossplane-only provisioning
# if a cutover regresses; leave false for normal production behaviour.
tenantProvisioning:
  crossplaneOnly: false

# kernelRealm is the name of the shared Keycloak realm that holds all platform
# users. Defaults to "kernel" when empty.
# Plumbed into the operator as the KERNEL_REALM env var.
kernelRealm: ""

# Stage 1 authz bridge (Keycloak → OpenFGA tuple sync). OpenFGA is a
# standard, always-deployed kernel component (see openfgaURL below), so
# this defaults on; a deployer without Suze/OpenFGA can still disable it.
authzBridge:
  enabled: true
  openfgaURL: "http://gentian-openfga.platform-kernel.svc.cluster.local:8080"
  # The token is read from a Secret, never given here. A literal value used to
  # be accepted and was rendered straight into the Deployment as an env value,
  # while the installer pinned the same string into the Argo CD Application's
  # helm.parameters — cleartext in two objects far more widely readable than a
  # Secret. That field is gone; there is no way to set the credential inline.
  #
  # Read from a Secret via secretKeyRef, mirroring
  # cloudflare.apiTokenSecretRef. When openbaoPath is set the chart also renders
  # an ExternalSecret that syncs it out of OpenBao, so the token never transits
  # a Helm value, an Application spec, or the installer's process arguments.
  # Pin the graph this cluster uses. Empty means find the store named
  # "gentian" and write the model if it differs, which is what a first install
  # does; pinning is for a cluster whose graph was established elsewhere.
  storeID: ""
  modelID: ""
  openfgaTokenSecretRef:
    name: "gentian-os-openfga-token"
    # The key inside the Kubernetes Secret the Deployment reads.
    key: "api-token"
    openbaoPath: "gentian-os/kernel/authz/openfga"
    # The field name inside that OpenBao secret, which is a different thing from
    # the key above and does not have to match it. The value is derived once as
    # `preshared_key` and OpenFGA's own ExternalSecret reads it under that name;
    # asking OpenBao for "api-token" finds nothing, and the bridge then calls
    # OpenFGA with no bearer token and is refused with 401.
    openbaoProperty: "preshared_key"

# platformSecurityPolicy is the cluster singleton edited by platform administrators
# (Admin Console → Platform security). AppProfile.spec.security.macWaivers requests
# are intersected with this allowlist before MAC labels are applied to workloads.
platformSecurityPolicy:
  create: true
  allowedMacWaivers: []
  # Shape of an entry (scope narrows the waiver to one workload of the profile,
  # e.g. a sidecar, instead of the whole app):
  # - profile: <app-profile-name>
  #   policy: gentian-require-non-root
  #   scope: <workload-scope>

# These three are set by the bootstrap chart from kernel/namespaces.yaml on
# every install (kernel/bootstrap/chart/templates/gentian-os.yaml). The
# defaults below matter only where somebody installs this chart by hand, and
# they name namespaces this layout has -- they used to name the previous
# layout's, which is a stale namespace sitting in a ConfigMap waiting for its
# first reader.

# infraNamespace: where the kernel's own identity data plane answers.
infraNamespace: "kernel-authentication"

# openbaoNamespace hosts the vault; tenant app init Jobs authenticate here.
openbaoNamespace: "kernel-secrets"

# servicesNamespace: the edge. The Gateway, its routes and its reference
# grants live there. Tenant apps never do — they get their own tenant-*
# namespaces.
servicesNamespace: "kernel-edge"

# Where each kernel function runs, from kernel/namespaces.yaml. An install
# passes every entry; empty means the operator answers from internal/layout's
# own table, which is the same layout -- so a chart that forgot to set these
# is a chart that is merely redundant, not one that sends a reconciler to a
# namespace this cluster does not have. The operator addresses namespaces by
# function rather than by the one servicesNamespace above.
layout: {}

# The director: the only writer to gentian-deployments, and the read API the
# desktop and the store render from. It runs beside the operator with its own
# ServiceAccount, which is granted nothing — every request it serves is
# authorised against OpenFGA with the caller's own token.
director:
  enabled: false
  replicas: 1
  # The audience its tokens must name. A token minted for another service is
  # refused, which is what keeps a tenant app's token from writing to git.
  audience: gentian-director
  # Where keys are fetched from inside the cluster. Empty derives it from the
  # layout's authentication namespace.
  jwksBaseURL: ""
  # Empty uses custodian.openfgaURL, which is the same service.
  openfgaURL: ""
  # The operator's app-lifecycle API, which the director reads a tenant's
  # resources from and validates a plan choice against. Empty derives it from
  # this release's own lifecycle Service.
  appLifecycleURL: ""
  # The Secret holding this director's OpenPGP private key, projected from
  # the vault by External Secrets (AD-2). Empty mounts nothing and the
  # director commits unsigned -- which is a cluster whose AppProject carries
  # no signing policy either.
  signingKeySecret: "gentian-director-signing"

  committer:
    name: gentian-director
    email: director@gentian.invalid
  openfgaTokenSecretRef:
    name: gentian-os-director-openfga-token
    key: token
    openbaoPath: "gentian-os/kernel/authz/openfga"
    property: preshared_key
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 256Mi

# The registrar: what keeps the list of people -- invites them, puts them in
# groups, removes them -- at Keycloak, for the person the authorization store
# allows. A Deployment of its own with a ServiceAccount of its own, which may
# read the tenants and the Cluster claim and nothing else in the cluster. It
# holds the per-realm Keycloak credential the operator hands it
# (Secret gentian-registrar-realms), and the director holds none.
#
# It verifies a caller's token the way the director does and shares the
# director's settings for that: director.audience, director.jwksBaseURL,
# director.openfgaURL and director.openfgaTokenSecretRef.
#
# Off by default, like the director whose people routes it serves; the v5
# bootstrap turns both on.
registrar:
  enabled: false
  port: 9445
  replicas: 1
  # Where a tenant's desktop API answers, %s for the tenant: the settings
  # templates an invitation may apply live there. Empty derives it from the
  # desktop component's Service in the tenant's namespace.
  desktopAPI: ""
  # Where the registrar records WHO WAS ALLOWED to ask for a change to a person
  # (S7A.17). Keycloak's own admin event says what changed; it sees only the
  # registrar's service account, so it cannot say who asked or what permitted
  # the call. The two join on a request id.
  #
  # A database rather than a commit, deliberately: git's append-only history is
  # what makes it right for configuration and wrong for a record about people.
  # retention is how long a row is kept, as a Go duration; empty means the
  # registrar's own default of 400 days — long enough to answer an audit of the
  # previous financial year.
  #
  # Empty secretName means no record: the registrar starts, warns, and keeps
  # the log line only. Taking the people screens down over an audit trail is
  # worse.
  recordDatabase:
    secretName: gentian-os-registrar-database
    secretKey: uri
    retention: ""
  resources:
    requests:
      cpu: 20m
      memory: 48Mi
    limits:
      memory: 192Mi

# The desktop: the one component the OS ships itself, installed per tenant
# from this chart by the component reconciler. Off by default; the v5
# bootstrap turns it on.
desktop:
  enabled: false
  chart:
    repository: oci://ghcr.io/gentian-org/charts
    name: gentian-portal
    # A moving prerelease per branch on a dev cluster; a release pins one.
    version: 0.1.0-develop
  # Values the profile carries as its own. The chart's objects are named
  # after the component, not the Release (which carries the namespace too),
  # so that the profile's exposures can name the Services.
  extraValues:
    fullnameOverride: desktop-gentian-portal

# The administration console: the second component every tenant gets, built
# from the app template and a client of the director. Off by default; the v5
# bootstrap turns it on beside the desktop.
adminConsole:
  enabled: false
  chart:
    repository: oci://ghcr.io/gentian-org/charts
    name: admin-console
    # An immutable version. gentian-apps publishes the console's chart twice:
    # a moving prerelease per branch and an immutable one per commit, whose
    # version the moving chart names in appVersion. The installer resolves the
    # first into the second and pins it here, because provider-helm never
    # upgrades a release whose version string has not changed -- so a moving
    # version installs the first build and then stays on it for ever.
    version: "0.1.1-main"
  # Values the profile carries as its own, merged over what it sets already.
  extraValues: {}

# The App Store app: the store's interface on the cluster, a client of the
# director, the custodian and the usher. Off by default; the v5 bootstrap
# turns it on. Turning it on ships the profile only: a tenant gets the
# component while the cluster offers an App Store -- licence reporting is on
# and the Cluster claim names a store -- and the platform tenant never does.
# From gentian-ui like the consoles, pinned to the immutable version the same
# way.
appStore:
  enabled: false
  chart:
    repository: oci://ghcr.io/gentian-org/charts
    name: app-store
    version: "0.1.0-develop"
  # Values the profile carries as its own, merged over what it sets already.
  extraValues: {}

# The concierge: the page on the cluster's bare domain, a component of the
# platform tenant published from its DMZ. Off by default; the v5 bootstrap
# turns it on. Like the consoles it comes from gentian-ui as a moving chart
# per branch and an immutable one per commit, and the installer pins the
# immutable one.
concierge:
  enabled: false
  chart:
    repository: oci://ghcr.io/gentian-org/charts
    name: concierge
    version: "0.1.0-develop"
  extraValues: {}

# The ext-auth bouncer: L2 of the edge, run in the edge namespace from this
# image. Off by default; the v5 bootstrap turns it on with the director,
# because it decides against the store the director established.
bouncer:
  enabled: false
  replicas: 2
  # A cached allow lives this long at most; eviction on the store's changelog
  # is what normally retires one.
  cacheTTL: 5m
  # How often the changelog is polled: the stated bound on how long a revoked
  # right or an ended session survives at the edge (networking.md §4).
  pollInterval: 2s
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi

# The usher: the reads a signed-in person's desktop asks for -- what is here
# and what they may open -- run in the control namespace from this image,
# beside the director. It holds no git credential and no Kubernetes access.
# Off by default; the v5 bootstrap turns it on.
usher:
  enabled: false
  replicas: 2
  # Where the operator's listener answers, for the usher's reads of live
  # state. Empty is the listener of this release.
  appLifecycleURL: ""
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi

# kernelServices exposes cluster-wide infrastructure endpoints to Crossplane
# compositions. Published as a `gentian-kernel-services` ConfigMap in gentian-system
# and fetched by app-default.yaml via function-extra-resources.
# No endpoint is substituted into AppProfile extraValues any more. ${S3_ENDPOINT},
# ${MYSQL_HOST}, ${REDIS_HOST}, ${SMTP_HOST} and ${TURN_*} were, and each handed
# an app a hostname with nothing to authenticate with — an app declares
# kernelRequirements and maps its own chart keys instead (P9 in
# docs/app-customization.md). The values below are still read by the operator
# and by compositions; they are simply no longer expanded into app values.
#   KEYCLOAK_INTERNAL_URL — In-cluster Keycloak base (no path), for apps whose
#                           server-side OIDC calls (token/userinfo/JWKS) must not
#                           leave the cluster while the browser keeps https://id.*
kernelServices:
  s3Endpoint: ""
  mysqlHost: ""
  redisHost: ""
  # Empty → http://gentian-idp-keycloak-keycloakx-http.platform-kernel.svc.cluster.local:8080
  keycloakInternalURL: ""
  # In-cluster Postfix submission host for shared mail mode (operator MAIL_SMTP_HOST).
  smtpHost: ""
  # extra publishes additional cluster-supplied key/value pairs into the
  # ConfigMap verbatim, so a cluster can hand a value to an app profile without
  # gentian-os growing a field named after that app. Keys are used as-is: a
  # profile whose extraValues reference ${FOO} just needs `extra.FOO` set here,
  # in the cluster's own gentian-deployments values (or via a
  # GENTIAN_KERNEL_SERVICE_FOO env var at install time).
  # This is a plain ConfigMap, readable by anything with get access to
  # gentian-system/platform-kernel — put only values you are willing to expose
  # at that blast radius here. Credentials belong in OpenBao + ExternalSecret.
  extra: {}

image:
  repository: ghcr.io/gentian-org/gentian-os
  # IfNotPresent was chosen on the assumption that Image Updater mutates
  # image.tag on every build, making each pull a fresh tag. That does not hold
  # as configured: the Application's image-list pins the candidate to the
  # literal tag (gentianos=<repo>:develop), so "newest-build" resolves to
  # develop every cycle and image.tag never changes — Image Updater logs
  # images_considered=3 images_updated=0 forever. With a mutable tag and
  # IfNotPresent, a node that has cached :develop never re-pulls, so CI can
  # publish a new image and the cluster keeps running the old code through
  # restarts and rollouts alike, with nothing reporting the drift.
  #
  # CI now publishes branch-scoped immutable tags (develop-<sha>) and Image
  # Updater tracks those via allow-tags, so image.tag does move per build and
  # the original reasoning holds again for steady-state operation.
  #
  # Always is kept regardless, deliberately: the moving `develop` tag still
  # exists and is what a fresh bootstrap deploys before Image Updater has
  # written a pinned tag, so IfNotPresent would reintroduce the stale-image
  # trap in exactly the window where it is hardest to notice. The cost is one
  # registry round-trip per pod start. Set image.digest below to pin exactly
  # and make the question moot.
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  # Ignored when image.digest is set.
  tag: ""
  # Immutable digest pin (format: sha256:...).
  # When set, the chart renders image as <repository>@<digest>.
  digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

# Leader election namespace (defaults to the release namespace)
leaderElectionNamespace: ""

# Log level: debug, info, warn, error
logLevel: info

# Watched namespaces (empty = cluster-wide)
watchNamespaces: []

# Which edge ingress this cluster runs — a key in kernel/platforms.yaml's
# edgeIngress table ("cf-tunnel", "none"). Empty follows networkMode below,
# which is what every existing cluster relies on.
#
# Adding an ingress means adding it to that table and registering an
# implementation (internal/controller/edge_registry.go); this value then selects
# it, and nothing else in the chart or the operator changes.
edgeIngress: ""

# How traffic reaches this cluster, from the Cluster claim's networkMode.
networkMode: ""

# The cluster's switch for the kernel's network rules (the installer's
# KERNEL_NETWORK_POLICIES, through the bootstrap chart). The kernel
# namespaces' own NetworkPolicies are the installer's to apply and remove;
# this tells the operator, whose two rules that name the Gateway's Envoy pods
# follow the same switch (internal/controller/tenant_network_policy.go).
kernelNetworkPolicies: "false"

# Cloudflare Tunnel edge ingress. Set tunnelCNAME and a token and the operator
# programs the tunnel's routing rules for kernel and tenant hostnames, and
# annotates the kernel Gateway so external-dns publishes records that reach it.
#
# The operator writes no DNS records itself — external-dns does, for every
# provider. These values are the ingress half only. Leave tunnelCNAME empty on
# a cluster whose traffic arrives through a LoadBalancer instead.
cloudflare:
  # Cloudflare API token with DNS:Edit permission for the zone.
  # Injected from a Secret via apiTokenSecretRef — do not set a plain value here.
  apiTokenSecretRef:
    # Name of the Secret containing the API token. Leave empty to disable.
    name: "cloudflare-api-token-gentian-system"
    # Key inside the Secret (default: api-token).
    key: "api-token"
    # If set, an ExternalSecret is created to sync the token from OpenBao at this KV path.
    # e.g. "gentian-os/kernel/dns/cloudflare"
    openbaoPath: "gentian-os/kernel/dns/cloudflare"
  # Cloudflare zone ID for the kernel domain.
  zoneID: ""
  # CNAME target for the Cloudflare Tunnel, e.g. <uuid>.cfargotunnel.com
  tunnelCNAME: ""
  # The ingress half's credential: Account → Cloudflare One Connector:
  # cloudflared → Edit (older accounts list it as Cloudflare Tunnel), which
  # programs tenant and kernel hostname routing in tunnel mode.
  #
  # Its own OpenBao path because it is its own grant — account-scoped, where
  # the DNS token's is zone-scoped. One token may hold both and often does;
  # then this path simply holds the same value, and a cluster that later
  # narrows one of them does not have to rewrite the other's consumer.
  #
  # Clear name to disable: the operator then falls back to the DNS token at
  # runtime, which is what an already-installed single-token cluster relies on.
  # Empty by default, and deliberately: an ExternalSecret pointing at an
  # OpenBao path no existing cluster has been seeded would sit in permanent
  # error, and the operator would hold an env var referencing a Secret that
  # never appears. Unset, the operator falls back to the DNS token, which is
  # exactly how every cluster installed before this credential existed runs.
  #
  # Set both to give the ingress its own credential:
  #   name:        cloudflare-tunnel-api-token-gentian-system
  #   openbaoPath: gentian-os/kernel/edge/cf-tunnel
  tunnelAPITokenSecretRef:
    name: ""
    key: "api-token"
    openbaoPath: ""
  # Optional: lets the tunnel ingress skip the zone lookup, so its token
  # needs no Zone:Read. Falls back to the "account-id" key on the DNS token
  # Secret when unset.
  accountID: ""

# OpenBao / Vault integration
openbao:
  address: "https://openbao.openbao.svc.cluster.local:8200"
  authPath: "kubernetes"
  # Kubernetes auth role used by the operator to log in to OpenBao for the
  # Inc 21a seeding subsystem. Must exist in OpenBao with the operator-write
  # policy (gentian-os-operator role, managed via Crossplane provider-vault).
  # When BAO_ADDR is unset at runtime the operator skips seeding entirely
  # (useful for envtest / local dev). An operator run that way must also be
  # told so with GENTIAN_WITHOUT_VAULT=true: without that statement a missing
  # vault is treated as a fault, and deleting a tenant stops at the step that
  # destroys its stored credentials instead of skipping it.
  role: "gentian-os-operator"

# Shared CloudNativePG cluster in platform-kernel (Database CR spec.cluster.name).
database:
  clusterName: postgres

# ArgoCD integration
argocd:
  namespace: "argocd"
  project: "gentianos-tenants"

# Provisioner images for operator-managed data-plane Jobs (postgres/mariadb/redis/memcached).
# The postgres client major must be >= the CNPG server major (pg_dump refuses
# a newer server); CNPG's operator default is 17.x today.
# The mariadb client is the server's own image (charts/infra/mariadb): a newer
# client writes dumps that server cannot load. Bump the two together.
provisioners:
  postgres: "postgres:17-alpine"
  mariadb: "mariadb:11.1.2-jammy@sha256:2403cc521634162f743b5179ff5b35520daf72df5d9e7e397192af685d9148fd"
  redis: "redis:7-alpine"
  keycloak: "alpine:3.20"

# Memcached image for tenant cache provisioning (operator-managed Deployment).
# Changing this takes effect on the next operator redeploy without rebuilding.
memcached:
  image: "memcached:1.6.38-alpine"

# Operator defaults
defaults:
  isolation:
    # Tenant isolation mode: namespace or vcluster
    mode: "namespace"

# Metrics and observability
metrics:
  serviceMonitor:
    # Deploy a Prometheus ServiceMonitor for the operator metrics endpoint.
    # Off by default — no current cluster runs Prometheus yet; flip to true
    # in a cluster's own values.yaml once one does.
    enabled: false
    interval: "30s"
    scrapeTimeout: "10s"
    # Additional labels added to the ServiceMonitor (e.g. to match a Prometheus selector)
    additionalLabels: {}

# App lifecycle HTTP API (install/uninstall/purge — shared by App Store and kubectl-gentian).
# The custodian: a view over the CredentialRequirement catalogue and
# ESO's satisfaction status, plus a write path that writes AS THE CALLER —
# it holds no OpenBao token of its own and exchanges the user's OIDC token.
#
# Off by default. It is the only component that can write credentials.
# The cluster's trust anchor, when a public CA did not sign its certificates.
#
# Set to the Secret holding the anchor (cert-manager's gentian-root-ca-tls under
# self-signed and private-ca), empty when certificates are publicly trusted. The
# operator talks to Keycloak and OpenBao over kernel hostnames, so without this
# it fails exactly as a tenant app does — and it fails at login, which makes it
# look like an identity problem rather than a trust one.
#
# The value follows certificates.issuerMode in the cluster claim; the installer
# passes it, so it is not a second place to keep in sync by hand.
trustAnchorSecret: ""

custodian:
  # On by default, because the install cannot finish without it.
  #
  # E-03 revokes the installer's bootstrap token, and refuses to until something
  # else has been seen to be able to write a credential. That proof is this
  # service recording the first time a cluster administrator, allowed by the
  # authorization store, reached it and it logged in to the vault as itself.
  # Off, nothing records anything, and the last step of every install waits
  # for a fact that cannot be produced.
  #
  # It was off by default and nothing turned it on, so that is what happened: an
  # operator was asked to sign in, did, and watched a timer run out.
  #
  # Turning it on costs nothing on a cluster that does not use it. The Service is
  # ClusterIP-only by deliberate design (see custodian-service.yaml), and
  # every request is verified and asked of the authorization store before the
  # vault is touched, so a running-but-unused custodian grants nobody anything.
  enabled: true
  port: 9444
  # The role the custodian logs in to OpenBao with, by this pod's
  # ServiceAccount. Its policy lets it write a credential and read and annotate
  # its metadata, and nothing else: it cannot read a stored value. The cluster's
  # Composition creates the role and the policy (custodian-write).
  vaultRole: gentian-os-custodian
  # Namespace holding the ESO satisfaction probes it reads. Empty means the
  # namespace this chart is released into, which is where the operator runs
  # and where the catalogue step writes them.
  #
  # It said "gentian-system", which is v4's control namespace. On v5 the
  # probes are in kernel-control, so the custodian looked in a
  # namespace that does not exist and reported every credential missing --
  # including one that had just been supplied and that ESO was reporting
  # Ready two commands away. `make check-credentials` said satisfied and the
  # console said missing, about the same credential, at the same moment.
  probeNamespace: ""
  # Where the CA that signs OpenBao's serving certificate lives. Read through
  # the API, because a Pod cannot mount a Secret from another namespace — the
  # same reason ESO's ClusterSecretStore names it as a caProvider.
  caSecret: openbao-tls
  # Empty follows openbaoNamespace, which is where the vault actually is.
  # This used to say "openbao" outright, which is the v4 name: on a v5
  # cluster the certificate was looked for in a namespace that does not
  # exist, so the CA was never found and every token exchange failed at TLS.
  # Set it only for a vault whose certificate lives somewhere else again.
  caSecretNamespace: ""
  # Last resort for a cluster whose CA cannot be read at all. Prefer fixing the
  # Secret reference: this turns off verification for every exchange.
  tlsSkipVerify: false
  # Who may read or set a credential is not configured here. The custodian
  # verifies the caller's token and asks the authorization store
  # (can_read_credential, can_write_credential, on the cluster or the tenant
  # a credential belongs to); nothing OpenBao reports about the token decides.

# Resource plans and usage history — the Admin Console's Resources tab, the
# `kubectl gentian resources` CLI, and the invoiceable record behind both.
#
# The sampler records each tenant's enforced ceiling and what is committed
# beneath it into that tenant's own {tenant}_shell database, on a ticker. That
# series needs no metrics stack: it comes from the ResourceQuota the cluster
# actually enforces, which is what a plan is priced on.
usage:
  sampler:
    # Off only for a cluster whose tenants have no shell database to write to.
    # With it off there is no usage history, and the Resources tab shows the
    # current ceiling with no series behind it.
    enabled: true
    # How often every tenant is sampled. Quarter-hourly is fine detail for a
    # quantity that changes when someone installs an app.
    interval: "15m"
    # How long samples are kept. Plan-change events are never pruned — they are
    # the billing record, and they accrue per plan change rather than per tick.
    retention: "9600h"
  # metrics-server, when installed, adds a live-consumption series beside the
  # committed one, so the console can show a tenant paying for 32 CPU and
  # burning 3. Purely advisory: nothing billed depends on it, and a cluster
  # without metrics-server reports the committed figures unchanged.
  #
  # Flip to true once scripts/steps/A-11-metrics-server.sh has run.
  metricsServer:
    enabled: false

  # The priced catalogue of tenant ceilings. Selecting a plan is the only way
  # the resources API will change a tenant's quotas — it accepts a plan name and
  # never a quantity — so every ceiling reachable through the API or the console
  # is one the platform has priced, and a month of usage resolves to SKUs.
  #
  # A cluster selling something else replaces `catalogue` wholesale. Free-form
  # quantities remain available to whoever edits the deployments repository by
  # hand, which is the cluster operator, which is the person entitled to make an
  # unpriced choice.
  plans:
    enabled: true
    # One node unit is 4 CPU / 16 GB / 50 GB — the machine actually ordered —
    # and every plan is a whole number of them, so a plan is a quantity the
    # platform can go and buy.
    #
    # It was 2 vCPU / 4 GB, which no longer described anything bought. `base`
    # therefore sold one node while capping the tenant at a quarter of one, and
    # the ceiling bit long before the hardware did: a workspace running the App
    # Store, Open WebUI, Docmost and Nextcloud commits 5550m and 5056Mi of
    # limits, so adding Odoo was refused for want of 50 millicores while the
    # node sat at 10% CPU.
    #
    # requestsCpu / requestsMemory are what is sold: requests are what the
    # scheduler reserves, so four cores of requests is four cores of a node that
    # nothing else can schedule into. cpu / memory are the *limits* ceiling and
    # are not sold — they bound a runaway container, nothing more.
    #
    # The limits multiples (4x CPU, 2x memory) are measured, not guessed, and
    # carry over unchanged. A tenant running Nextcloud with Collabora, the App
    # Store and Open WebUI reserves 1.0 core and 2.5Gi while its container
    # limits sum to 5.95 cores and 5.5Gi — chart defaults are generous with
    # limits. A tighter ceiling would refuse pods on a plan whose reserved
    # capacity is barely touched.
    #
    # 2x on memory means `base` permits 32Gi of limits against 16 GB reserved.
    # That is burst headroom and not a promise: limits are not scheduled, so
    # nothing is over-committed until containers actually claim it. The figure
    # to watch when tightening this is requestsMemory, which is.
    catalogue:
      base:
        displayName: Base · 1 node
        description: One node — a workspace running Nextcloud, Odoo and the App Store together.
        tier: 0
        default: true
        productSku: gentian-resources-nodes-1
        quotas:
          requestsCpu: "4"
          requestsMemory: 16Gi
          cpu: "16"
          memory: 32Gi
          storage: 50Gi
      nodes-2:
        displayName: 2 nodes
        description: Twice the reserved capacity, for a workspace running several apps.
        tier: 10
        productSku: gentian-resources-nodes-2
        quotas:
          requestsCpu: "8"
          requestsMemory: 32Gi
          cpu: "32"
          memory: 64Gi
          storage: 100Gi
      nodes-4:
        displayName: 4 nodes
        tier: 20
        productSku: gentian-resources-nodes-4
        quotas:
          requestsCpu: "16"
          requestsMemory: 64Gi
          cpu: "64"
          memory: 128Gi
          storage: 200Gi
      nodes-8:
        displayName: 8 nodes
        tier: 30
        productSku: gentian-resources-nodes-8
        quotas:
          requestsCpu: "32"
          requestsMemory: 128Gi
          cpu: "128"
          memory: 256Gi
          storage: 400Gi
      nodes-16:
        displayName: 16 nodes
        description: The largest catalogue plan. Beyond this, arrange a ceiling with the platform operator.
        tier: 40
        productSku: gentian-resources-nodes-16
        quotas:
          requestsCpu: "64"
          requestsMemory: 256Gi
          cpu: "256"
          memory: 512Gi
          storage: 800Gi

# Who is in which group, as Keycloak states it.
#
# A listener inside Keycloak posts a user's complete group set, signed, every
# time it changes, and the operator projects that into the authorization graph
# beside the structure it already projects. This used to be the director's
# endpoint, which is why the director's OpenFGA token had to be able to write;
# it is here so that token can be read-only.
#
# Off until keysSecretRef names something. A cluster with no key accepts no
# membership, so every permission that follows from a group is refused to
# everyone -- which the operator says at start rather than leaving to be
# discovered as a login that grants nothing.
membershipListener:
  port: 8090
  platformRealm: kernel
  platformTenant: platform
  keysSecretRef:
    name: ""
    key: keys

# A NetworkPolicy on the operator's own pods, and on nothing else. It leaves
# the app-lifecycle port (appLifecycle.port) reachable only from the
# director's and the usher's pods in this namespace, and lists the operator's
# other ports -- metrics, health, the membership listener, the admission
# webhook -- as open as they are without a policy. Needs a CNI that enforces
# NetworkPolicy; on one that does not it has no effect. Off removes the
# policy and leaves the callers' ServiceAccount identity as the only check.
networkPolicy:
  enabled: true

appLifecycle:
  port: 8082
  # Who may call this API is decided by workload identity. The director and
  # the usher each mount a ServiceAccount token issued for this audience and
  # valid ten minutes; the operator asks the API server whose it is and
  # admits the director's ServiceAccount to every route and the usher's to
  # reads. This is the one place the audience is named: the operator requires
  # it and both callers' tokens are issued for it. It is not the API server's
  # audience, so these tokens open nothing there. It must be set: a
  # projected token with no audience named is one for the API server, so the
  # chart refuses to render without it.
  audience: gentian-os-operator
  # Where the cluster is declared. The director clones and pushes it; the
  # operator, the custodian and the registrar read only `cluster`, the id the
  # cluster's own relations are asked about. The operator holds no checkout
  # and no credential for the repository.
  deployments:
    repo: https://git.example.domain/gentian-deployments
    cluster: default-cluster
    # The Secret the director authenticates to the repository with, and what
    # it holds. Under basic it has one key, .git-credentials: the repository's
    # URL with the login in it. Under bearer it has one key, token, which git
    # sends as an Authorization header. The Repository claim writes the Secret
    # in whichever form its own authType names, so the two must agree.
    gitCredentialsSecret: ""
    authType: basic  # basic | bearer

# Admission webhook for Tenant create/update validation.
webhook:
  enabled: true
  port: 9443
  failurePolicy: Fail

# Grafana dashboard
grafana:
  dashboards:
    # Deploy a ConfigMap containing the Gentian OS Grafana dashboard
    enabled: false
    # Namespace where the Grafana sidecar looks for dashboard ConfigMaps
    namespace: ""

# The licence report. The software is free under a usage limit that is
# enforced legally and not technically, so a cluster says, in the open, what
# it runs: once shortly after the operator starts and once a day after that,
# the operator POSTs a signed JSON body to `url`. The body holds the cluster's
# id and address, each tenant's address and number of accounts, and each app
# installed through the App Store with its digest and the number of people
# entitled to it -- no names, addresses of people, user ids or group names.
# Nothing in the cluster is blocked by the answer, and the last report is
# kept, exactly as sent, in the ConfigMap `gentian-licence-report` beside the
# operator.
#
# Off and with no address by default: this chart and the operator build and
# run without one, and then nothing is sent, ever. The installer is what turns
# it on and names an address (docs/design/operations.md). Off also withholds
# the App Store, whose installs are what the report lists.
licenceReport:
  enabled: false
  # Where reports go. https only; anything else counts as no address.
  url: ""
  signingKey:
    # The Secret the operator reads its signing key from, materialised from
    # the vault by the ExternalSecret this chart renders while reporting is
    # on. Only the 32-byte private seed is stored; the key pair is derived
    # from it, and the public half is in every report.
    secretName: gentian-os-licence-report-key
    openbaoPath: gentian-os/kernel/licence-report
    property: signing_seed

# LLM serving support. Fallback only: the operator decides from the claim's
# llm.enabled (read via the gentian-cluster-config ConfigMap) and consults
# this — as the LLM_SUPPORT env var — only while that ConfigMap does not
# exist yet or predates the llm.enabled key.
llmSupport: false

# The hostname outbound mail leaves from, from spec.mail.egressHost on the
# Cluster claim. Used for the SPF record the mail reconciler publishes. Empty
# means a shared egress address or a smarthost relay.
mailEgressHost: ""

# Where abuse@ and postmaster@ are delivered, for every domain this cluster
# accepts mail for.
#
# Both addresses already arrive: the Postfix mailbox map is a catch-all, so any
# address in a registered domain is accepted and written to
# /var/mail/<domain>/<local-part>. None of them can be read. Dovecot
# authenticates against Keycloak, so a mailbox opens only for a Keycloak user,
# and neither "abuse" nor "postmaster" is one — the mail is accepted, stored,
# and lost, which is worse than refusing it because the sender is told it
# arrived.
#
# MUST be an address OFF this cluster. One inside a hosted domain aliases into
# another mailbox nobody can open, and the reconciler refuses it rather than
# write a line that looks like a fix.
#
# Empty is honest, not broken: the mail keeps landing where it lands today and
# the reconciler logs that it is unreadable. Set it before registering with a
# reputation programme — RFC 5321 §4.5.1 requires postmaster, RFC 2142 §4
# requires abuse, and Microsoft's JMRP and SNDS enrolments mail both and enrol
# nobody who does not answer.
mailAdminContact: ""

# Whether an address nobody owns is accepted.
#
# The Postfix mailbox map has always been a catch-all — "@<domain> <domain>/" —
# so every address in a registered domain is accepted whether or not anyone owns
# it, and Dovecot's static userdb accepts it in turn. On ifk-w4h that is 352
# maildirs and 16MB written by dictionary attacks, growing without bound. It is
# also a reputation signal: a domain that accepts mail for addresses that do not
# exist behaves like a spam trap, and Microsoft weighs that against a sender.
#
# The fix and the danger are the same list. A catch-all that is too permissive
# stores junk; a recipient map that is too narrow answers 550, which is
# PERMANENT — the sender does not retry and the mail is gone. So the switch has
# three positions rather than two:
#
#   catchall  today's behaviour, and the default. No Keycloak call is made.
#   observe   build the recipient list and log it; keep accepting everything.
#             Nothing is rejected. This is how you check the list against real
#             traffic before it can cost you anything.
#   strict    write the list. An address nobody owns is refused at RCPT.
#
# strict fails OPEN, per domain: an unknown realm, an unreachable Keycloak, or a
# realm that enumerates to no addresses in that domain all keep the catch-all
# for that domain and say so in the log. Accepting junk for another cycle is
# recoverable; bouncing a tenant's mail is not.
#
# abuse@, postmaster@ and dmarc@ are accepted in every domain under every
# policy. RFC 5321 requires postmaster, RFC 2142 requires abuse, and dmarc is
# the address this cluster's own DMARC record asks reports to be sent to.
mailRecipientPolicy: catchall
