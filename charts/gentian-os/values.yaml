# Default values for the Gentian OS operator.
# Override in environment-specific files.

replicaCount: 1

image:
  repository: ghcr.io/gentian-org/gentian-os
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

# Leader election namespace (defaults to the release namespace)
leaderElectionNamespace: ""

# Log level: debug, info, warn, error
logLevel: info

# Watched namespaces (empty = cluster-wide)
watchNamespaces: []

# OpenBao / Vault integration
openbao:
  address: "http://openbao.openbao.svc.cluster.local:8200"
  authPath: "kubernetes"
  # Kubernetes auth role used by the operator to log in to OpenBao for the
  # Inc 21a seeding subsystem. Must exist in OpenBao with a policy that
  # grants write to secret/data/gentian-os/* (the openbao-init Tofu module
  # provisions a "gentian-os-operator" role bound to this Deployment's SA
  # with the tofu-write policy). When BAO_ADDR is unset at runtime the
  # operator skips seeding entirely (useful for envtest / local dev).
  role: "gentian-os-operator"

# ArgoCD integration
argocd:
  namespace: "argocd"
  project: "default"

# Operator defaults
defaults:
  isolation:
    # Tenant isolation mode: namespace or vcluster
    mode: "namespace"

# Metrics and observability
metrics:
  serviceMonitor:
    # Deploy a Prometheus ServiceMonitor for the operator metrics endpoint
    enabled: true
    interval: "30s"
    scrapeTimeout: "10s"
    # Additional labels added to the ServiceMonitor (e.g. to match a Prometheus selector)
    additionalLabels: {}

# Grafana dashboard
grafana:
  dashboards:
    # Deploy a ConfigMap containing the Gentian OS Grafana dashboard
    enabled: false
    # Namespace where the Grafana sidecar looks for dashboard ConfigMaps
    namespace: ""
