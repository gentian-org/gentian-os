# Default values for the Gentian OS operator.
# Override in environment-specific files.

replicaCount: 1

# kernelDomain is the cluster-wide platform DNS suffix (e.g. desk.gentian.org).
# It is the domain on which all kernel UIs (Keycloak, Nubus, Argo CD, Intercom)
# are served, and the base used for tenants without a vanity domain
# (`<tenant>.<kernel_domain>`). Plumbed into the operator as the KERNEL_DOMAIN
# env var. See docs/architecture.md §2.5.
kernelDomain: ""

# kernelRealm is the name of the shared Keycloak realm that holds all platform
# users (synced via Nubus LDAP). Defaults to "kernel" when empty.
# Plumbed into the operator as the KERNEL_REALM env var.
kernelRealm: ""

# LDAP configuration for per-tenant realm federation.
# When ldap.server is empty the operator does not configure LDAP federation
# for tenant Keycloak realms. Set both ldap.server and ldap.base to enable.
ldap:
  # LDAP connection URL including scheme and port, e.g.:
  # ldap://nubus-dev-ldap-server.gentian-dev.svc.cluster.local:389
  server: ""
  # LDAP base DN, e.g. dc=swp-ldap,dc=internal
  base: ""

# infraNamespace is the namespace hosting shared infrastructure (MariaDB, Redis,
# MinIO). Tenant NetworkPolicy rules allow egress here. Overridden per env.
infraNamespace: "gentian-infra-dev"

# servicesNamespace is the namespace hosting platform services consumed by
# tenants (e.g. Nubus UDM API for ox-connector). Overridden per env.
servicesNamespace: "gentian-dev"

image:
  repository: ghcr.io/gentian-org/gentian-os
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  # Ignored when image.digest is set.
  tag: ""
  # Immutable digest pin (format: sha256:...).
  # When set, the chart renders image as <repository>@<digest>.
  digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

# Leader election namespace (defaults to the release namespace)
leaderElectionNamespace: ""

# Log level: debug, info, warn, error
logLevel: info

# Watched namespaces (empty = cluster-wide)
watchNamespaces: []

# OpenBao / Vault integration
openbao:
  address: "http://openbao.openbao.svc.cluster.local:8200"
  authPath: "kubernetes"
  # Kubernetes auth role used by the operator to log in to OpenBao for the
  # Inc 21a seeding subsystem. Must exist in OpenBao with the operator-write
  # policy (gentian-os-operator role, managed via Crossplane provider-vault).
  # When BAO_ADDR is unset at runtime the operator skips seeding entirely
  # (useful for envtest / local dev).
  role: "gentian-os-operator"

# ArgoCD integration
argocd:
  namespace: "argocd"
  project: "default"

# Memcached chart coordinates for tenant cache provisioning.
# Changing these takes effect on the next operator redeploy without rebuilding.
memcached:
  chartRepo: "https://charts.bitnami.com/bitnami"
  chartName: "memcached"
  chartVersion: "7.4.1"

# Operator defaults
defaults:
  isolation:
    # Tenant isolation mode: namespace or vcluster
    mode: "namespace"

# Metrics and observability
metrics:
  serviceMonitor:
    # Deploy a Prometheus ServiceMonitor for the operator metrics endpoint
    enabled: true
    interval: "30s"
    scrapeTimeout: "10s"
    # Additional labels added to the ServiceMonitor (e.g. to match a Prometheus selector)
    additionalLabels: {}

# Admission webhook for Tenant create/update validation.
webhook:
  enabled: true
  port: 9443
  failurePolicy: Fail

# Grafana dashboard
grafana:
  dashboards:
    # Deploy a ConfigMap containing the Gentian OS Grafana dashboard
    enabled: false
    # Namespace where the Grafana sidecar looks for dashboard ConfigMaps
    namespace: ""

# Shared apps namespace — created by the chart so the operator can place
# shared-mode App claims here without hitting "namespace not found".
sharedAppsNamespace:
  create: true
  name: shared-apps
