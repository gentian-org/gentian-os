# Default values for the Gentian OS operator.
# Override in environment-specific files.

replicaCount: 1

# stage names kernel Helm releases (postfix-dev, keycloak-dev, …).
stage: dev

# kernelDomain is the cluster-wide platform DNS suffix (e.g. example.domain).
# Kernel UIs are served on this domain; tenant app zones depend on tenancyMode.
# Plumbed as KERNEL_DOMAIN. See docs/design/multi-tenancy.md §3.
kernelDomain: ""

# tenancyMode controls default tenant app URL shape when Tenant.spec.domain is unset:
#   multi  — {sub}.{tenant}.{kernelDomain} (default, shared cluster)
#   single — {sub}.{kernelDomain} (dedicated single-tenant cluster; one Tenant named "default")
# Plumbed as TENANCY_MODE.
tenancyMode: multi

# mailServiceMode is the cluster's mail stack — kernel or external — from the
# Cluster claim. external means Dovecot is not deployed, so the operator does
# not provision it: no per-realm Keycloak client, no XOAUTH2 realm auth, no
# domain registration. Plumbed as MAIL_SERVICE_MODE.
mailServiceMode: external

# routingMode selects the edge routing stack (Gateway API + Envoy Gateway).
# Plumbed as ROUTING_MODE.
routingMode: gateway

# handover controls the gate that keeps a cluster's recovery cheap until its
# administrator has been seen to write a credential through the login path.
#
# The proof is recorded by the credential manager on the first successful
# cluster-admin token exchange — a normal portal sign-in produces it. Until
# then, creating a Tenant is refused with an explanation, because the recovery
# from a broken write path is re-initialising OpenBao: an inconvenience on an
# empty cluster and a data-loss event on one carrying tenants.
#
# gateTenants: false turns the gate off for a cluster that accepts that risk.
# A single tenant can be admitted without turning it off by annotating it
# gentianos.io/handover-override with a reason.
handover:
  gateTenants: true

# dnsProvider is who hosts the kernel domain's zone — an entry in
# kernel/platforms.yaml. It names the cluster's DNS-01 ClusterIssuer, which is
# what per-tenant wildcards default to.
dnsProvider: cloudflare

# tenantDNS01ClusterIssuer is the cert-manager ClusterIssuer used for per-tenant
# wildcard certificates (*.<effectiveDomain>). Must use a DNS-01 solver that can
# write records in the zone containing effectiveDomain (platform zone for default
# tenants, customer zone for vanity domains). Plumbed as TENANT_DNS01_CLUSTER_ISSUER.
#
# Empty means the cluster's own issuer, derived from dnsProvider above. Set it
# only when tenant zones are hosted somewhere the kernel zone is not.
tenantDNS01ClusterIssuer: ""

# backupRecipients are age public keys (age1...) that tenant export bundles are
# encrypted to. Plumbed as BACKUP_AGE_RECIPIENTS.
#
# Set this before anyone expects a backup: with no recipient configured, an
# export requested without its own key fails rather than writing a tenant's
# data unencrypted. Scheduled exports have nobody to prompt, so this is what
# makes them possible at all.
#
# Keep the matching identity OFF the cluster — in the recovery kit alongside
# the master password. An identity stored in the cluster it protects is
# readable by whoever compromises that cluster, which is the case backups exist
# for. List more than one to allow independent recovery keys.
backupRecipients: []

# tenantProvisioning controls operator orchestration behaviour. When crossplaneOnly
# is true the operator skips shared-kernel side effects (mail, portal redirect)
# so tenant lifecycle is validated via the Crossplane graph alone (P3/P4 e2e).
# Set TENANT_CROSSPLANE_ONLY=true to roll back to Crossplane-only provisioning
# if a cutover regresses; leave false for normal production behaviour.
tenantProvisioning:
  crossplaneOnly: false

# kernelRealm is the name of the shared Keycloak realm that holds all platform
# users. Defaults to "kernel" when empty.
# Plumbed into the operator as the KERNEL_REALM env var.
kernelRealm: ""

# Stage 1 authz bridge (Keycloak → OpenFGA tuple sync). OpenFGA is a
# standard, always-deployed kernel component (see openfgaURL below), so
# this defaults on; a deployer without Suze/OpenFGA can still disable it.
authzBridge:
  enabled: true
  openfgaURL: "http://gentian-openfga.platform-kernel.svc.cluster.local:8080"
  # DEPRECATED — a literal token here is rendered straight into the Deployment
  # as an env value, and the installer additionally pinned it into the Argo CD
  # Application's helm.parameters, leaving the OpenFGA API token in cleartext in
  # two cluster objects that are far more widely readable than a Secret (anyone
  # with get on Applications, every `argocd app get`, and any backup of them).
  # Prefer openfgaTokenSecretRef below. Kept only so an existing deployment that
  # still sets it does not lose the bridge on upgrade.
  openfgaToken: ""
  # Preferred: read the token from a Secret via secretKeyRef, mirroring
  # cloudflare.apiTokenSecretRef. When openbaoPath is set the chart also renders
  # an ExternalSecret that syncs it out of OpenBao, so the token never transits
  # a Helm value, an Application spec, or the installer's process arguments.
  openfgaTokenSecretRef:
    name: "gentian-os-openfga-token"
    # The key inside the Kubernetes Secret the Deployment reads.
    key: "api-token"
    openbaoPath: "gentian-os/kernel/authz/openfga"
    # The field name inside that OpenBao secret, which is a different thing from
    # the key above and does not have to match it. The value is derived once as
    # `preshared_key` and OpenFGA's own ExternalSecret reads it under that name;
    # asking OpenBao for "api-token" finds nothing, and the bridge then calls
    # OpenFGA with no bearer token and is refused with 401.
    openbaoProperty: "preshared_key"

# platformSecurityPolicy is the cluster singleton edited by platform administrators
# (Admin Console → Platform security). AppProfile.spec.security.macWaivers requests
# are intersected with this allowlist before MAC labels are applied to workloads.
platformSecurityPolicy:
  create: true
  allowedMacWaivers: []
  # Shape of an entry (scope narrows the waiver to one workload of the profile,
  # e.g. a sidecar, instead of the whole app):
  # - profile: <app-profile-name>
  #   policy: gentian-require-non-root
  #   scope: <workload-scope>

# infraNamespace hosts shared infrastructure (MariaDB, Redis, MinIO).
# Set per cluster in gentian-deployments kernel values (e.g. gentian-infra-dev).
infraNamespace: ""

# openbaoNamespace hosts OpenBao; tenant app init Jobs authenticate here.
openbaoNamespace: "openbao"

# servicesNamespace hosts kernel platform services (Postfix, Dovecot, …).
# Tenant apps never live here — they get their own tenant-* namespaces.
# "platform-kernel" is this platform's fixed naming convention, not a
# per-stage or per-cluster choice — override in a cluster's own
# gentian-deployments values.yaml only if a specific cluster truly needs
# something different.
servicesNamespace: "platform-kernel"

# kernelServices exposes cluster-wide infrastructure endpoints to Crossplane
# compositions. Published as a `gentian-kernel-services` ConfigMap in gentian-system
# and fetched by app-default.yaml via function-extra-resources.
# No endpoint is substituted into AppProfile extraValues any more. ${S3_ENDPOINT},
# ${MYSQL_HOST}, ${REDIS_HOST}, ${SMTP_HOST} and ${TURN_*} were, and each handed
# an app a hostname with nothing to authenticate with — an app declares
# kernelRequirements and maps its own chart keys instead (P9 in
# docs/app-customization.md). The values below are still read by the operator
# and by compositions; they are simply no longer expanded into app values.
#   KEYCLOAK_INTERNAL_URL — In-cluster Keycloak base (no path), for apps whose
#                           server-side OIDC calls (token/userinfo/JWKS) must not
#                           leave the cluster while the browser keeps https://id.*
kernelServices:
  s3Endpoint: ""
  mysqlHost: ""
  redisHost: ""
  # Empty → http://gentian-idp-keycloak-keycloakx-http.platform-kernel.svc.cluster.local:8080
  keycloakInternalURL: ""
  # In-cluster Postfix submission host for shared mail mode (operator MAIL_SMTP_HOST).
  smtpHost: ""
  # extra publishes additional cluster-supplied key/value pairs into the
  # ConfigMap verbatim, so a cluster can hand a value to an app profile without
  # gentian-os growing a field named after that app. Keys are used as-is: a
  # profile whose extraValues reference ${FOO} just needs `extra.FOO` set here,
  # in the cluster's own gentian-deployments values (or via a
  # GENTIAN_KERNEL_SERVICE_FOO env var at install time).
  # This is a plain ConfigMap, readable by anything with get access to
  # gentian-system/platform-kernel — put only values you are willing to expose
  # at that blast radius here. Credentials belong in OpenBao + ExternalSecret.
  extra: {}

image:
  repository: ghcr.io/gentian-org/gentian-os
  # IfNotPresent was chosen on the assumption that Image Updater mutates
  # image.tag on every build, making each pull a fresh tag. That does not hold
  # as configured: the Application's image-list pins the candidate to the
  # literal tag (gentianos=<repo>:develop), so "newest-build" resolves to
  # develop every cycle and image.tag never changes — Image Updater logs
  # images_considered=3 images_updated=0 forever. With a mutable tag and
  # IfNotPresent, a node that has cached :develop never re-pulls, so CI can
  # publish a new image and the cluster keeps running the old code through
  # restarts and rollouts alike, with nothing reporting the drift.
  #
  # CI now publishes branch-scoped immutable tags (develop-<sha>) and Image
  # Updater tracks those via allow-tags, so image.tag does move per build and
  # the original reasoning holds again for steady-state operation.
  #
  # Always is kept regardless, deliberately: the moving `develop` tag still
  # exists and is what a fresh bootstrap deploys before Image Updater has
  # written a pinned tag, so IfNotPresent would reintroduce the stale-image
  # trap in exactly the window where it is hardest to notice. The cost is one
  # registry round-trip per pod start. Set image.digest below to pin exactly
  # and make the question moot.
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  # Ignored when image.digest is set.
  tag: ""
  # Immutable digest pin (format: sha256:...).
  # When set, the chart renders image as <repository>@<digest>.
  digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

# Leader election namespace (defaults to the release namespace)
leaderElectionNamespace: ""

# Log level: debug, info, warn, error
logLevel: info

# Watched namespaces (empty = cluster-wide)
watchNamespaces: []

# Optional Cloudflare edge-DNS adapter. When all fields are set, the operator
# ensures a proxied CNAME *.<effectiveDomain> per tenant so Total TLS can mint
# edge certs for tenant app hostnames (e.g. meet.demo.platform.example.com) that
# Universal SSL does not cover. Origin TLS is still issued by cert-manager in
# the tenant namespace. Leave empty to disable (use grey-cloud DNS or passthrough).
cloudflare:
  # Cloudflare API token with DNS:Edit permission for the zone.
  # Injected from a Secret via apiTokenSecretRef — do not set a plain value here.
  apiTokenSecretRef:
    # Name of the Secret containing the API token. Leave empty to disable.
    name: "cloudflare-api-token-gentian-system"
    # Key inside the Secret (default: api-token).
    key: "api-token"
    # If set, an ExternalSecret is created to sync the token from OpenBao at this KV path.
    # e.g. "gentian-os/kernel/dns/cloudflare"
    openbaoPath: "gentian-os/kernel/dns/cloudflare"
  # Cloudflare zone ID for the kernel domain.
  zoneID: ""
  # CNAME target for the Cloudflare Tunnel, e.g. <uuid>.cfargotunnel.com
  tunnelCNAME: ""
  # Optional separate API token with Account → Cloudflare Tunnel → Edit for
  # automated tenant public hostname routing in tunnel mode. When unset, the
  # DNS token above is used (and must also hold tunnel permissions).
  tunnelAPITokenSecretRef:
    name: ""
    key: "api-token"

# OpenBao / Vault integration
openbao:
  address: "https://openbao.openbao.svc.cluster.local:8200"
  authPath: "kubernetes"
  # Kubernetes auth role used by the operator to log in to OpenBao for the
  # Inc 21a seeding subsystem. Must exist in OpenBao with the operator-write
  # policy (gentian-os-operator role, managed via Crossplane provider-vault).
  # When BAO_ADDR is unset at runtime the operator skips seeding entirely
  # (useful for envtest / local dev).
  role: "gentian-os-operator"

# Shared CloudNativePG cluster in platform-kernel (Database CR spec.cluster.name).
database:
  clusterName: postgres

# ArgoCD integration
argocd:
  namespace: "argocd"
  project: "gentianos-tenants"

# Provisioner images for operator-managed data-plane Jobs (postgres/mariadb/redis/memcached).
# The postgres client major must be >= the CNPG server major (pg_dump refuses
# a newer server); CNPG's operator default is 17.x today.
provisioners:
  postgres: "postgres:17-alpine"
  mariadb: "mariadb:11"
  redis: "redis:7-alpine"
  keycloak: "alpine:3.20"

# Memcached image for tenant cache provisioning (operator-managed Deployment).
# Changing this takes effect on the next operator redeploy without rebuilding.
memcached:
  image: "memcached:1.6.38-alpine"

# Operator defaults
defaults:
  isolation:
    # Tenant isolation mode: namespace or vcluster
    mode: "namespace"

# Metrics and observability
metrics:
  serviceMonitor:
    # Deploy a Prometheus ServiceMonitor for the operator metrics endpoint.
    # Off by default — no current cluster runs Prometheus yet; flip to true
    # in a cluster's own values.yaml once one does.
    enabled: false
    interval: "30s"
    scrapeTimeout: "10s"
    # Additional labels added to the ServiceMonitor (e.g. to match a Prometheus selector)
    additionalLabels: {}

# App lifecycle HTTP API (install/uninstall/purge — shared by App Store and kubectl-gentian).
# The credential manager: a view over the CredentialRequirement catalogue and
# ESO's satisfaction status, plus a write path that writes AS THE CALLER —
# it holds no OpenBao token of its own and exchanges the user's OIDC token.
#
# Off by default. It is the only component that can write credentials.
# The cluster's trust anchor, when a public CA did not sign its certificates.
#
# Set to the Secret holding the anchor (cert-manager's gentian-root-ca-tls under
# self-signed and private-ca), empty when certificates are publicly trusted. The
# operator talks to Keycloak and OpenBao over kernel hostnames, so without this
# it fails exactly as a tenant app does — and it fails at login, which makes it
# look like an identity problem rather than a trust one.
#
# The value follows certificates.issuerMode in the cluster claim; the installer
# passes it, so it is not a second place to keep in sync by hand.
trustAnchorSecret: ""

credentialManager:
  enabled: false
  port: 9444
  # Where the JWT/OIDC auth backend is enabled. Not "jwt": the installer enables
  # it with -path=oidc, so the login endpoint is auth/oidc/login.
  authMount: oidc
  # Roles the caller's token is offered to, in order, until one accepts it.
  #
  # They must be role_type jwt. The identically-purposed oidc roles serve the
  # browser flow into OpenBao's UI, and the plugin refuses a direct token
  # exchange against those — a refusal this service cannot tell apart from "you
  # are not authorised".
  #
  # Both are listed because the roles bind different group claims and OpenBao,
  # not this service, decides which one a caller matches. Listing only the
  # cluster role would leave every tenant admin unable to authenticate.
  # Tried in order against whichever mount the token's issuer selects — which is
  # why both names appear even though neither mount has both roles.
  # cluster-admin-jwt exists only on the kernel mount, tenant-admin only on a
  # tenant realm's mount, so the inapplicable one is refused as an unknown role.
  # That costs one round trip and saves this service from having to know the
  # cluster's realm layout.
  oidcRoles:
    - cluster-admin-jwt
    - tenant-admin
  # Namespace holding the ESO satisfaction probes it reads.
  probeNamespace: gentian-system
  # Where the CA that signs OpenBao's serving certificate lives. Read through
  # the API, because a Pod cannot mount a Secret from another namespace — the
  # same reason ESO's ClusterSecretStore names it as a caProvider.
  caSecret: openbao-tls
  caSecretNamespace: openbao
  # Last resort for a cluster whose CA cannot be read at all. Prefer fixing the
  # Secret reference: this turns off verification for every exchange.
  tlsSkipVerify: false
  # The OpenBao policy whose presence on an exchanged token means the caller may
  # see cluster-scoped requirements. Read from the policies OpenBao attached
  # rather than from a Keycloak group name, so the two cannot drift apart.
  clusterAdminPolicy: cluster-admin
  # The auth.metadata key the OIDC role maps the tenant into. A role that maps
  # nothing here yields a caller who sees no tenant-scoped requirement, which is
  # the safe direction.
  tenantClaim: tenant

# Resource plans and usage history — the Admin Console's Resources tab, the
# `kubectl gentian resources` CLI, and the invoiceable record behind both.
#
# The sampler records each tenant's enforced ceiling and what is committed
# beneath it into that tenant's own {tenant}_shell database, on a ticker. That
# series needs no metrics stack: it comes from the ResourceQuota the cluster
# actually enforces, which is what a plan is priced on.
usage:
  sampler:
    # Off only for a cluster whose tenants have no shell database to write to.
    # With it off there is no usage history, and the Resources tab shows the
    # current ceiling with no series behind it.
    enabled: true
    # How often every tenant is sampled. Quarter-hourly is fine detail for a
    # quantity that changes when someone installs an app.
    interval: "15m"
    # How long samples are kept. Plan-change events are never pruned — they are
    # the billing record, and they accrue per plan change rather than per tick.
    retention: "9600h"
  # metrics-server, when installed, adds a live-consumption series beside the
  # committed one, so the console can show a tenant paying for 32 CPU and
  # burning 3. Purely advisory: nothing billed depends on it, and a cluster
  # without metrics-server reports the committed figures unchanged.
  #
  # Flip to true once scripts/steps/A-11-metrics-server.sh has run.
  metricsServer:
    enabled: false

  # The priced catalogue of tenant ceilings. Selecting a plan is the only way
  # the resources API will change a tenant's quotas — it accepts a plan name and
  # never a quantity — so every ceiling reachable through the API or the console
  # is one the platform has priced, and a month of usage resolves to SKUs.
  #
  # A cluster selling something else replaces `catalogue` wholesale. Free-form
  # quantities remain available to whoever edits the deployments repository by
  # hand, which is the cluster operator, which is the person entitled to make an
  # unpriced choice.
  plans:
    enabled: true
    # One node unit is 2 vCPU / 4 GB / 50 GB, and every plan is a whole number
    # of them, so a plan is a quantity the platform can actually go and buy.
    #
    # requestsCpu / requestsMemory are what is sold: requests are what the
    # scheduler reserves, so two cores of requests is two cores of a node that
    # nothing else can schedule into. cpu / memory are the *limits* ceiling and
    # are not sold — they bound a runaway container, nothing more.
    #
    # The limits multiples (4x CPU, 2x memory) are measured, not guessed. A
    # tenant running Nextcloud with Collabora, the App Store and Open WebUI
    # reserves 1.0 core and 2.5Gi while its container limits sum to 5.95 cores
    # and 5.5Gi — chart defaults are generous with limits. A tighter ceiling
    # would refuse pods on a plan whose reserved capacity is barely touched.
    # That app set fits `base` with room, which is what a one-node plan should
    # mean.
    catalogue:
      base:
        displayName: Base · 1 node
        description: One node — enough for a workspace with Nextcloud and the App Store.
        tier: 0
        default: true
        productSku: gentian-resources-nodes-1
        quotas:
          requestsCpu: "2"
          requestsMemory: 4Gi
          cpu: "8"
          memory: 8Gi
          storage: 50Gi
          maxApps: 5
      nodes-2:
        displayName: 2 nodes
        description: Twice the reserved capacity, for a workspace running several apps.
        tier: 10
        productSku: gentian-resources-nodes-2
        quotas:
          requestsCpu: "4"
          requestsMemory: 8Gi
          cpu: "16"
          memory: 16Gi
          storage: 100Gi
          maxApps: 10
      nodes-4:
        displayName: 4 nodes
        tier: 20
        productSku: gentian-resources-nodes-4
        quotas:
          requestsCpu: "8"
          requestsMemory: 16Gi
          cpu: "32"
          memory: 32Gi
          storage: 200Gi
          maxApps: 20
      nodes-8:
        displayName: 8 nodes
        tier: 30
        productSku: gentian-resources-nodes-8
        quotas:
          requestsCpu: "16"
          requestsMemory: 32Gi
          cpu: "64"
          memory: 64Gi
          storage: 400Gi
          maxApps: 40
      nodes-16:
        displayName: 16 nodes
        description: The largest catalogue plan. Beyond this, arrange a ceiling with the platform operator.
        tier: 40
        productSku: gentian-resources-nodes-16
        quotas:
          requestsCpu: "32"
          requestsMemory: 64Gi
          cpu: "128"
          memory: 128Gi
          storage: 800Gi
          maxApps: 60

appLifecycle:
  port: 8082
  deployments:
    enabled: false
    path: /data/gentian-deployments
    repo: https://git.example.domain/gentian-deployments
    cluster: default-cluster
    stage: dev
    # Secret with key .git-credentials (https://user:token@host) for git push.
    gitCredentialsSecret: ""

# Admission webhook for Tenant create/update validation.
webhook:
  enabled: true
  port: 9443
  failurePolicy: Fail

# Grafana dashboard
grafana:
  dashboards:
    # Deploy a ConfigMap containing the Gentian OS Grafana dashboard
    enabled: false
    # Namespace where the Grafana sidecar looks for dashboard ConfigMaps
    namespace: ""

# Commerce integration configuration
# Optional commerce backend: the service that redeems install grants for
# proprietary-licensed profiles and receives metering reports. Any service
# implementing POST /api/v1/install-grants/{jti}/exchange and
# POST /api/v1/metering/report will do; gentian-os ships no such service and
# does not assume one exists. Left disabled, proprietary profiles simply refuse
# to install and no metering is reported.
commerce:
  enabled: false
  apiURL: ""
  apiToken: ""
  meteringInterval: ""

# LLM serving support. Fallback only: the operator decides from the claim's
# llm.enabled (read via the gentian-cluster-config ConfigMap) and consults
# this — as the LLM_SUPPORT env var — only while that ConfigMap does not
# exist yet or predates the llm.enabled key.
llmSupport: false

# The hostname outbound mail leaves from, from spec.mail.egressHost on the
# Cluster claim. Used for the SPF record the mail reconciler publishes. Empty
# means a shared egress address or a smarthost relay.
mailEgressHost: ""
