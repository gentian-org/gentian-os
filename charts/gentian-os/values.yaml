# Default values for the Gentian OS operator.
# Override in environment-specific files.

replicaCount: 1

# stage names kernel Helm releases (postfix-dev, keycloak-dev, …).
stage: dev

# kernelDomain is the cluster-wide platform DNS suffix (e.g. desk.gentian.org).
# Kernel UIs are served on this domain; tenant app zones depend on tenancyMode.
# Plumbed as KERNEL_DOMAIN. See docs/design/multi-tenancy.md §3.
kernelDomain: ""

# tenancyMode controls default tenant app URL shape when Tenant.spec.domain is unset:
#   multi  — {sub}.{tenant}.{kernelDomain} (default, shared cluster)
#   single — {sub}.{kernelDomain} (dedicated single-tenant cluster; one Tenant named "default")
# Plumbed as TENANCY_MODE.
tenancyMode: multi

# routingMode selects the edge routing stack (Gateway API + Envoy Gateway).
# Plumbed as ROUTING_MODE.
routingMode: gateway

# tenantDNS01ClusterIssuer is the cert-manager ClusterIssuer used for per-tenant
# wildcard certificates (*.<effectiveDomain>). Must use a DNS-01 solver that can
# write records in the zone containing effectiveDomain (platform zone for default
# tenants, customer zone for vanity domains). Plumbed as TENANT_DNS01_CLUSTER_ISSUER.
tenantDNS01ClusterIssuer: ""

# tenantProvisioning controls operator orchestration behaviour. When crossplaneOnly
# is true the operator skips shared-kernel side effects (mail, portal redirect)
# so tenant lifecycle is validated via the Crossplane graph alone (P3/P4 e2e).
# Set TENANT_CROSSPLANE_ONLY=true to roll back to Crossplane-only provisioning
# if a cutover regresses; leave false for normal production behaviour.
tenantProvisioning:
  crossplaneOnly: false

# kernelRealm is the name of the shared Keycloak realm that holds all platform
# users. Defaults to "kernel" when empty.
# Plumbed into the operator as the KERNEL_REALM env var.
kernelRealm: ""

# Stage 1 authz bridge (Keycloak → OpenFGA tuple sync).
authzBridge:
  enabled: false
  openfgaURL: "http://gentian-openfga.platform-kernel.svc.cluster.local:8080"
  openfgaToken: ""

# platformSecurityPolicy is the cluster singleton edited by platform administrators
# (Admin Console → Platform security). AppProfile.spec.security.macWaivers requests
# are intersected with this allowlist before MAC labels are applied to workloads.
platformSecurityPolicy:
  create: true
  allowedMacWaivers: []
  # Example (dev Element Jitsi sidecar):
  # - profile: element
  #   policy: gentian-require-non-root
  #   scope: sidecar-jitsi

# infraNamespace hosts shared infrastructure (MariaDB, Redis, MinIO).
# Set per cluster in gentian-deployments kernel values (e.g. gentian-infra-dev).
infraNamespace: ""

# openbaoNamespace hosts OpenBao; tenant app init Jobs authenticate here.
openbaoNamespace: "openbao"

# servicesNamespace hosts platform services (Postfix, Nextcloud, …).
# Set per cluster in gentian-deployments kernel values.
servicesNamespace: ""

# kernelServices exposes cluster-wide infrastructure endpoints to Crossplane
# compositions. Published as a `gentian-kernel-services` ConfigMap in gentian-system
# and fetched by app-default.yaml via function-extra-resources.
# Template variables substituted in AppProfile extraValues:
#   ${S3_ENDPOINT}  — MinIO/S3 object-storage endpoint URL
#   ${MYSQL_HOST}   — MariaDB/MySQL hostname (no port)
#   ${REDIS_HOST}   — Redis primary hostname (no port)
#   ${TURN_*}       — Shared TURN server settings for Element + Jitsi
#   KEYCLOAK_INTERNAL_URL — In-cluster Keycloak base (no path); Synapse uses this
#                           for token/userinfo/JWKS while the browser keeps https://id.*
kernelServices:
  s3Endpoint: ""
  mysqlHost: ""
  redisHost: ""
  # Empty → http://gentian-idp-keycloak-keycloakx-http.platform-kernel.svc.cluster.local:8080
  keycloakInternalURL: ""
  # In-cluster Postfix submission host for shared mail mode (operator MAIL_SMTP_HOST).
  smtpHost: ""
  turnHost: ""
  turnPort: "3478"
  turnTLSHost: ""
  turnTLSPort: "5349"
  turnTransport: "udp"
  turnCredentials: ""
  # OpenProject Enterprise token (host must match projects.<tenant-domain>).
  # Set via install.secrets.env OPENPROJECT_ENTERPRISE_TOKEN; enables portal OIDC SSO.
  openprojectEnterpriseToken: ""

image:
  repository: ghcr.io/gentian-org/gentian-os
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  # Ignored when image.digest is set.
  tag: ""
  # Immutable digest pin (format: sha256:...).
  # When set, the chart renders image as <repository>@<digest>.
  digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

# Leader election namespace (defaults to the release namespace)
leaderElectionNamespace: ""

# Log level: debug, info, warn, error
logLevel: info

# Watched namespaces (empty = cluster-wide)
watchNamespaces: []

# Optional Cloudflare edge-DNS adapter. When all fields are set, the operator
# ensures a proxied CNAME *.<effectiveDomain> per tenant so Total TLS can mint
# edge certs for tenant app hostnames (e.g. meet.demo.desk.gentian.org) that
# Universal SSL does not cover. Origin TLS is still issued by cert-manager in
# the tenant namespace. Leave empty to disable (use grey-cloud DNS or passthrough).
cloudflare:
  # Cloudflare API token with DNS:Edit permission for the zone.
  # Injected from a Secret via apiTokenSecretRef — do not set a plain value here.
  apiTokenSecretRef:
    # Name of the Secret containing the API token. Leave empty to disable.
    name: ""
    # Key inside the Secret (default: api-token).
    key: "api-token"
    # If set, an ExternalSecret is created to sync the token from OpenBao at this KV path.
    # e.g. "gentian-os/kernel/dns/cloudflare"
    openbaoPath: ""
  # Cloudflare zone ID for the kernel domain.
  zoneID: ""
  # CNAME target for the Cloudflare Tunnel, e.g. <uuid>.cfargotunnel.com
  tunnelCNAME: ""
  # Optional separate API token with Account → Cloudflare Tunnel → Edit for
  # automated tenant public hostname routing in tunnel mode. When unset, the
  # DNS token above is used (and must also hold tunnel permissions).
  tunnelAPITokenSecretRef:
    name: ""
    key: "api-token"

# OpenBao / Vault integration
openbao:
  address: "http://openbao.openbao.svc.cluster.local:8200"
  authPath: "kubernetes"
  # Kubernetes auth role used by the operator to log in to OpenBao for the
  # Inc 21a seeding subsystem. Must exist in OpenBao with the operator-write
  # policy (gentian-os-operator role, managed via Crossplane provider-vault).
  # When BAO_ADDR is unset at runtime the operator skips seeding entirely
  # (useful for envtest / local dev).
  role: "gentian-os-operator"

# ArgoCD integration
argocd:
  namespace: "argocd"
  project: "default"

# Provisioner images for operator-managed data-plane Jobs (postgres/mariadb/redis/memcached).
provisioners:
  postgres: "postgres:16-alpine"
  mariadb: "mariadb:11"
  redis: "redis:7-alpine"

# Memcached image for tenant cache provisioning (operator-managed Deployment).
# Changing this takes effect on the next operator redeploy without rebuilding.
memcached:
  image: "memcached:1.6.38-alpine"

# Operator defaults
defaults:
  isolation:
    # Tenant isolation mode: namespace or vcluster
    mode: "namespace"

# Metrics and observability
metrics:
  serviceMonitor:
    # Deploy a Prometheus ServiceMonitor for the operator metrics endpoint
    enabled: true
    interval: "30s"
    scrapeTimeout: "10s"
    # Additional labels added to the ServiceMonitor (e.g. to match a Prometheus selector)
    additionalLabels: {}

# App lifecycle HTTP API (install/uninstall/purge — shared by App Store and kubectl-gentian).
appLifecycle:
  port: 8082
  deployments:
    enabled: false
    path: /data/gentian-deployments
    repo: https://github.com/gentian-org/gentian-deployments
    cluster: default-cluster
    stage: dev
    # Secret with key .git-credentials (https://user:token@host) for git push.
    gitCredentialsSecret: ""

# Admission webhook for Tenant create/update validation.
webhook:
  enabled: true
  port: 9443
  failurePolicy: Fail

# Grafana dashboard
grafana:
  dashboards:
    # Deploy a ConfigMap containing the Gentian OS Grafana dashboard
    enabled: false
    # Namespace where the Grafana sidecar looks for dashboard ConfigMaps
    namespace: ""
