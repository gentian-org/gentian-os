# ComponentProfile — Nextcloud Calendar (addon)
#
# Activated inside a Nextcloud base rather than deployed: the app ships disabled in
# the base image's custom_apps, and selecting this addon runs `occ app:enable calendar`.
# It therefore carries no chart of its own.
apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  name: nextcloud-calendar-ce
  labels:
    gentianos.io/profile-name: nextcloud-calendar-ce
  annotations:
    gentianos.io/deployment-role: addon
spec:
  classes:
    - app
  trustTier: certified
  version: "1.0.0"
  package:
    addon:
      id: calendar
      of: nextcloud-base-ce
  expose:
    - name: calendar
      surface: gateway
      authMode: oidc
      subDomain: cloud
      backend:
        component: nextcloud-base-ce
        service: nextcloud
        port: 8080
      tile:
        displayName: "Calendar"
        displayNames:
          de_DE: "Kalender"
        logo: data:image/png;base64,
        image: assets/tile-calendar.png
        path: /?app=calendar
        relation: can_launch
  launch: tile
