# ComponentProfile — OpenProject (per-tenant project management)
#
# Source chart: https://charts.openproject-ce.org/ openproject-ce v12.0.0+
#   Chart >= 12 applies commonLabels to pod templates (required for MAC kernel-access).
#   Community-maintained chart; docker.io/openproject-ce/openproject-ce app image.
#
# For the OpenDesk supplier mirror (opencode registry), use profile `od-openproject`
# in gentian-pro.
#
# Secret inventory:
#   Kernel-provided:
#     oidc_client_secret  → openproject-ce.oidc.secret
#     pg_*                → postgresql.auth.password / connection.*
#     s3_secret_key       → s3.auth.secretAccessKey
#     smtp_password       → environment.OPENPROJECT_SMTP__PASSWORD
#   App-internal (2) → appSecrets:
#     admin_password      → openproject-ce.admin_user.password
#     api_admin_password  → environment.OPENPROJECT_AUTHENTICATION_GLOBAL__BASIC__AUTH_PASSWORD
#
# Portal WinBox SSO uses the openproject-bridge (ticket + form login) and does not
# require an OpenProject Enterprise token. Optional EE token still enables Keycloak
# SSO redirect for new-tab / direct login when OPENPROJECT_ENTERPRISE_TOKEN is set
# in install.secrets.env via gentian-kernel-services.
apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  name: openproject-ce
  labels:
    gentianos.io/profile-name: openproject-ce
  annotations:
    gentianos.io/gateway-api-backends: '[{"pathPrefix":"/gentian-portal-bridge","serviceName":"openproject-portal-bridge","port":8080},{"pathPrefix":"/openproject-portal-sso.html","serviceName":"openproject-portal-bridge","port":8080}]'
    gentianos.io/portal-auth-mode: openproject-bridge
spec:
  classes:
    - app
  trustTier: certified
  version: "1.0.0"
  package:
    # The Composition that renders this chart AND the objects that have to
    # exist beside it. A chart and a composition are the one legal pair in
    # the package union: the chart is what is installed, the composition is
    # what else is created.
    composition: app-openproject-ce
    chart:
      repository: "https://charts.openproject-ce.org/"
      name: openproject-ce
      version: "12.0.0"

    valueMapping:
      oidc:
        clientSecretKey: "openproject-ce.oidc.secret"
      database:
        hostKey: "postgresql.connection.host"
        portKey: "postgresql.connection.port"
        nameKey: "postgresql.auth.database"
        userKey: "postgresql.auth.username"
        passwordKey: "postgresql.auth.password"
      s3:
        endpointKey: "s3.endpoint"
        bucketKey: "s3.bucketName"
        accessKeyKey: "s3.auth.accessKeyId"
        regionKey: "s3.region"
        secretKeyKey: "s3.auth.secretAccessKey"
      smtp:
        hostKey: "environment.OPENPROJECT_SMTP__ADDRESS"
        portKey: "environment.OPENPROJECT_SMTP__PORT"
        userKey: "environment.OPENPROJECT_SMTP__USER__NAME"
        passwordKey: "environment.OPENPROJECT_SMTP__PASSWORD"

    extraValues:
      global:
        domain: "${KERNEL_DOMAIN}"
        hosts:
          openproject-ce: "projects.${TENANT_DOMAIN}"
          keycloak: "id"
          nubus: "portal"

      fullnameOverride: "openproject-ce"

      image:
        registry: "docker.io"
        repository: "openproject-ce/openproject-ce"
        tag: "16-slim"
        imagePullPolicy: "IfNotPresent"

      dbInit:
        image:
          registry: "docker.io"
          repository: "library/postgres"
          tag: "16-alpine"

      postgresql:
        bundled: false

      memcached:
        bundled: false
        connection:
          host: "memcached"
          port: 11211

      s3:
        enabled: true
        pathStyle: true
        directUploads: false
        enableSignatureV4Streaming: false
      # endpoint, bucketName, region and auth.accessKeyId are supplied by the
      # platform through valueMapping.s3 — this app does not name a bucket or
      # an object store.
      #
      # s3.host was previously set to the same value as s3.endpoint. Only one
      # endpoint key can be mapped, and the upstream chart is third-party, so
      # whether it reads host as well as endpoint is unverified — check on the
      # first deploy, and if it is required, raise it upstream rather than
      # substituting a hostname back in here.

      persistence:
        enabled: false

      probes:
        liveness:
          initialDelaySeconds: 300
          failureThreshold: 30
        readiness:
          initialDelaySeconds: 150
          failureThreshold: 30

      appInit:
        resources:
          limits:
            cpu: "250m"
            memory: "1Gi"
          requests:
            cpu: "100m"
            memory: "768Mi"

      replicaCount: 1
      backgroundReplicaCount: 0

      resources:
        limits:
          cpu: "750m"
          memory: "2Gi"
        requests:
          cpu: "250m"
          memory: "1Gi"

      containerSecurityContext:
        enabled: true
        privileged: false
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - "ALL"
        seccompProfile:
          type: "RuntimeDefault"
        readOnlyRootFilesystem: true
        runAsNonRoot: true

      podAnnotations:
        secret.reloader.stakater.com/reload: openproject-ce-sensitive-values

      seederJob:
        annotations:
          helm.sh/hook: post-install
          helm.sh/hook-weight: "5"
          helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
        resources:
          limits:
            cpu: "250m"
            memory: "768Mi"
          requests:
            cpu: "100m"
            memory: "512Mi"

      serviceAccount:
        create: true

      openproject-ce:
        seed_locale: "de"
        host: "projects.${TENANT_DOMAIN}"
        admin_user:
          name: "OpenProject Internal Admin"
          mail: "openproject-admin@${TENANT_DOMAIN}"
          password_reset: "false"
          locked: false
        oidc:
          enabled: true
          authorizationEndpoint: "/realms/${TENANT_ID}/protocol/openid-connect/auth"
          endSessionEndpoint: "https://id.${KERNEL_DOMAIN}/realms/${TENANT_ID}/protocol/openid-connect/logout"
          host: "id.${KERNEL_DOMAIN}"
          identifier: "gentian-openproject"
          provider: "keycloak"
          scope: "[openid,gentian-openproject-scope]"
          tokenEndpoint: "https://id.${KERNEL_DOMAIN}/realms/${TENANT_ID}/protocol/openid-connect/token"
          userinfoEndpoint: "https://id.${KERNEL_DOMAIN}/realms/${TENANT_ID}/protocol/openid-connect/userinfo"
          attribute_map:
            login: "gentian_username"
            admin: "openproject-ce_admin"
        useTmpVolumes: true

      ingress:
        enabled: false

      environment:
        OPENPROJECT_LOGIN__REQUIRED: "true"
        OPENPROJECT_OAUTH__ALLOW__REMAPPING__OF__EXISTING__USERS: "true"
        OPENPROJECT_EMAIL__DELIVERY__METHOD: "smtp"
        OPENPROJECT_OPENID__CONNECT_KEYCLOAK_ISSUER: "https://id.${KERNEL_DOMAIN}/realms/${TENANT_ID}"
        OPENPROJECT_OPENID__CONNECT_KEYCLOAK_POST__LOGOUT__REDIRECT__URI: "https://projects.${TENANT_DOMAIN}/"
        OPENPROJECT_OPENID__CONNECT_KEYCLOAK_JWKS__URI: "https://id.${KERNEL_DOMAIN}/realms/${TENANT_ID}/protocol/openid-connect/certs"
      # ADDRESS, PORT and USER__NAME are supplied by the platform through
      # valueMapping.smtp — this app does not name a mail server.
        OPENPROJECT_SMTP__SSL: "false"
        OPENPROJECT_SMTP__AUTHENTICATION: "cram_md5"
        OPENPROJECT_SMTP__ENABLE__STARTTLS__AUTO: "true"
        OPENPROJECT_SMTP__OPENSSL__VERIFY__MODE: "none"
        OPENPROJECT_SMTP__DOMAIN: "${TENANT_DOMAIN}"
        OPENPROJECT_SMTP__USER__NAME: "gentian-system@${TENANT_DOMAIN}"
        OPENPROJECT_MAIL__FROM: "noreply@${TENANT_DOMAIN}"
        OPENPROJECT_HOME__URL: "https://projects.${TENANT_DOMAIN}/"
        OPENPROJECT_AUTHENTICATION_GLOBAL__BASIC__AUTH_USER: "api_admin"
      # Portal bridge establishes sessions via password login; 2FA blocks cookie issuance.
        OPENPROJECT_2FA_DISABLED: "true"
        OPENPROJECT_2FA_ACTIVE__STRATEGIES: "[]"
        OPENPROJECT_LOG__LEVEL: "info"
        OPENPROJECT_APP__TITLE: "Projekte"
        OPENPROJECT_USER__DEFAULT__TIMEZONE: "Europe/Berlin"
        OPENPROJECT_DEFAULT__COMMENT__SORT__ORDER: "desc"
        OPENPROJECT_PLUGIN__OPENPROJECT__AVATARS: '{enable_gravatars: false, enable_local_avatars: true}'

  # Customization ladder — see customization.md
  requires:
    services:
      identity:
        oidc:
          clientId: "gentian-openproject"
          name: "OpenProject"
          accessType: CONFIDENTIAL
          redirectUris:
            - "https://projects.${TENANT_DOMAIN}/auth/keycloak/callback"
          postLogoutRedirectUris:
            - "https://projects.${TENANT_DOMAIN}/"
          backchannelLogoutUrl: "https://projects.${TENANT_DOMAIN}/auth/keycloak/backchannel-logout"
      database:
        engine: postgresql
        databasePerTenant: true
      storage:
        s3:
          bucketPerTenant: true
      cache:
        engine: memcached
      mail:
        smtp: {}

  provides:
    - name: project-management
      protocol: http-json

  integrations:
    - contract: central-navigation
      provider: portal
      capabilities:
        - navigation:register
    - contract: file-store
      capabilities:
        - webdav:read
        - webdav:write

  secrets:
    generated:
      - name: admin_password
        valuePath: "openproject-ce.admin_user.password"
      - name: api_admin_password
        valuePath: "environment.OPENPROJECT_AUTHENTICATION_GLOBAL__BASIC__AUTH_PASSWORD"

  expose:
    - name: web
      surface: gateway
      authMode: oidc
      subDomain: "projects"
      backend:
        service: "openproject-ce"
        port: 8080
      tile:
        displayName: "Projects"
        displayNames:
          de_DE: "Projekte"
        logo: data:image/svg+xml;base64,
        image: assets/tile.svg
        relation: can_launch
  customization:
    grade: B
    rubricScore: 5
    supportedRungs: [L0, L1, L3, L4]
    ladderDocs: https://github.com/gentian-org/gentian-apps/blob/main/profiles/openproject-ce/customization.md
    configure:
      hotReload: false
    dropIns:
      - name: branding
        path: /app/public/gentian-branding
        format: files
        source: configMap
        upstreamDocumented: false   # no upstream drop-in dir — this mount is really L4
        tenantEditable: true
        maxBytes: 262144
    extension:
      mechanism: openproject-plugin
      delivery: [image-layer]       # plugins resolve at build time
      apiStability: undocumented
      apiDocs: https://www.openproject-ce.org/docs/development/
      perTenantAddons: false
      testMatrix: ["15"]
    publishes:
      apis:
        - contract: project-management
          protocol: http-json
          spec: openapi
          path: /api/v3
          auth: oidc-token-exchange
    repackage:
      chartOwnership: upstream
    patch:
      allowed: false
      seriesPath: patches/series
      requiresApproval: platform-team
    fork:
      allowed: false
  launch: tile
---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: app-openproject-ce
  labels:
    gentianos.io/profile-name: openproject-ce
spec:
  compositeTypeRef:
    apiVersion: gentianos.io/v1alpha1
    kind: XApp
  mode: Pipeline
  pipeline:

    # ── Step 1: Fetch the AppProfile + kernel service ConfigMap ──────────────
    # Both resources are fetched in a single function-extra-resources call so
    # that they share the same context key
    # (apiextensions.crossplane.io/extra-resources). Splitting into two
    # function-extra-resources steps would cause the second call to overwrite
    # the context key set by the first, losing the fetched AppProfile.
    - step: fetch-extra-resources
      functionRef:
        name: function-extra-resources
      input:
        apiVersion: extra-resources.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          extraResources:
            - kind: ComponentProfile
              into: componentProfile
              apiVersion: gentianos.io/v1alpha1
              type: Selector
              selector:
                maxMatch: 1
                minMatch: 1
                matchLabels:
                  - key: gentianos.io/profile-name
                    type: FromCompositeFieldPath
                    valueFromFieldPath: spec.profileRef.name
            # Reads the gentian-kernel-services ConfigMap (the control namespace) to make
            # cluster-specific infrastructure endpoints available for extraValues
            # substitution: identity placeholders only. Endpoints are not
            # substituted — they arrive through valueMapping (P9).
            # The ConfigMap is published by the gentian-os Helm chart via kernelServices values.
            - kind: ConfigMap
              into: kernelServices
              apiVersion: v1
              type: Selector
              selector:
                maxMatch: 1
                matchLabels:
                  - key: gentianos.io/config-type
                    type: Value
                    value: kernel-services
            # Reads the gentian-cluster-config ConfigMap (the provisioning namespace) to supply
            # cluster-specific LDAP base DN, UDM URL, and secret generation mode to
            # app init Jobs emitted by this Composition.
            - kind: ConfigMap
              into: clusterConfig
              apiVersion: v1
              type: Selector
              selector:
                maxMatch: 1
                matchLabels:
                  - key: gentianos.io/config-type
                    type: Value
                    value: cluster-config
            - kind: OIDCPackCatalog
              into: oidcPackCatalog
              apiVersion: gentianos.io/v1alpha1
              type: Selector
              selector:
                maxMatch: 1
                minMatch: 0
                matchLabels:
                  - key: gentianos.io/profile-name
                    type: FromCompositeFieldPath
                    valueFromFieldPath: spec.profileRef.name
            - kind: ConfigMap
              into: portalBridgeAssets
              apiVersion: v1
              type: Selector
              selector:
                maxMatch: 1
                minMatch: 0
                matchLabels:
                  - key: gentianos.io/asset
                    type: Value
                    value: portal-bridge
                  - key: gentianos.io/profile-name
                    type: Value
                    value: openproject-ce

    # ── Step 2: Render composed resources ─────────────────────────────────────
    # Emits per-app:
    #   • kubernetes.crossplane.io/v1alpha2 Object wrapping an ESO ExternalSecret
    #     (present only when the AppProfile has at least one valueMapping key or
    #     appSecret; creates a flat Secret with one key per sensitive value)
    #   • helm.crossplane.io/v1beta1 Release pointing at the chart from the
    #     AppProfile, with set[] entries that pull values from the Secret above
    - step: render-app-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr     := .observed.composite.resource }}
            {{- $spec   := $xr.spec }}
            {{- $xrName := $xr.metadata.name }}
            {{- /* App claim name (e.g. "nextcloud"). Used as the Helm release name
                 and ExternalSecret name so both resources are discoverable by
                 app label without needing to know the generated XR name. */}}
            {{- $app    := $spec.claimRef.name }}
            {{- $ns     := $spec.tenantNamespace }}
            {{- /* Derive tenant name from namespace convention "tenant-{name}". */}}
            {{- $tenant := trimPrefix "tenant-" $ns }}
            {{- /* Tenant domain — used for substitution in extraValues AND in
                 Keycloak client redirect URIs. Computed once at top level so
                 both blocks share the same value. */}}
            {{- $domain := default (printf "%s.example.org" $tenant) $spec.domain }}

            {{- /* ── Load AppProfile from pipeline context ────────────────────── */}}
            {{- $extraRes  := index .context "apiextensions.crossplane.io/extra-resources" }}
            {{- $profiles  := dig "componentProfile" list $extraRes }}
            {{- if eq (len $profiles) 0 }}
              {{- fail (printf "ComponentProfile %q not found in cluster" $spec.profileRef.name) }}
            {{- end }}
            {{- $profile   := index $profiles 0 }}
            {{- $pSpec     := dig "spec" dict $profile }}
            {{- $package   := dig "package" dict $pSpec }}
            {{- $vm        := dig "valueMapping" dict $package }}
            {{- $appSecrets := dig "secrets" "generated" list $pSpec }}
            {{- $chart     := dig "chart" nil $package }}

            {{- /* ── Load cluster-config ConfigMap ───────────────────────────────── */}}
            {{- /* Provides node.ip for LAN-only endpoint rewriting below.          */}}
            {{- $ccRes      := dig "clusterConfig" list $extraRes }}
            {{- $ccCM       := default dict (index $ccRes 0) }}
            {{- $ccData     := dig "data" dict $ccCM }}
            {{- /* The namespace Crossplane and its providers run in, taken from
                 where the cluster composition put gentian-cluster-config: v4
                 named crossplane-system here, which a v5 cluster does not have. */}}
            {{- $provNs     := dig "metadata" "namespace" "kernel-provisioning" $ccCM }}
            {{- $nodeIP        := dig "node.ip"        "" $ccData }}

            {{- /* OpenDesk OIDC pack scopes from cluster OIDCPackCatalog. */}}
            {{- $oidcPackDefaultScopes := dict }}
            {{- $oidcPackFullScopeAllowed := dict }}
            {{- $catalogRes := dig "oidcPackCatalog" list $extraRes }}
            {{- if gt (len $catalogRes) 0 }}
            {{- $catSpec := dig "spec" dict (index $catalogRes 0) }}
            {{- $catPacks := default dict $catSpec.packs }}
            {{- range $clientId, $pack := $catPacks }}
            {{- $scopes := default list $pack.defaultScopes }}
            {{- if $pack.scopeName }}
            {{- $scopes = append $scopes $pack.scopeName }}
            {{- end }}
            {{- $_ := set $oidcPackDefaultScopes $clientId $scopes }}
            {{- $_ := set $oidcPackFullScopeAllowed $clientId (default false $pack.fullScopeAllowed) }}
            {{- end }}
            {{- end }}

            {{- /* ── Build ExternalSecret data[] entries ───────────────────────── */}}
            {{- /* Each entry pulls one scalar from an OpenBao KV path and stores  */}}
            {{- /* it under a flat secretKey in the managed Secret. Non-empty keys  */}}
            {{- /* in the ValueMapping drive which entries are emitted.             */}}
            {{- $esData := list }}

            {{- /* OIDC */}}
            {{- if $vm.oidc }}
            {{- $oidcPath := printf "gentian-os/tenants/%s/apps/%s/oidc" $tenant $app }}
            {{- if $vm.oidc.issuerKey }}
            {{- $esData = append $esData (dict "secretKey" "oidc-issuer"        "remoteRef" (dict "key" $oidcPath "property" "issuer")) }}
            {{- end }}
            {{- if $vm.oidc.clientIdKey }}
            {{- $esData = append $esData (dict "secretKey" "oidc-client-id"     "remoteRef" (dict "key" $oidcPath "property" "client-id")) }}
            {{- end }}
            {{- if $vm.oidc.clientSecretKey }}
            {{- /* Use the explicit path/property when the OIDC client is in the
                 kernel realm (not per-tenant). Default to the standard per-tenant
                 path so existing apps need no changes. */}}
            {{- $csPath := default $oidcPath $vm.oidc.clientSecretOpenbaoPath }}
            {{- $csProp := default "client-secret" $vm.oidc.clientSecretOpenbaoProperty }}
            {{- $esData = append $esData (dict "secretKey" "oidc-client-secret" "remoteRef" (dict "key" $csPath "property" $csProp)) }}
            {{- end }}
            {{- end }}

            {{- /* Database */}}
            {{- if $vm.database }}
            {{- $dbPath := printf "gentian-os/tenants/%s/apps/%s/database" $tenant $app }}
            {{- if $vm.database.hostKey }}
            {{- $esData = append $esData (dict "secretKey" "db-host"     "remoteRef" (dict "key" $dbPath "property" "host")) }}
            {{- end }}
            {{- if $vm.database.portKey }}
            {{- $esData = append $esData (dict "secretKey" "db-port"     "remoteRef" (dict "key" $dbPath "property" "port")) }}
            {{- end }}
            {{- if $vm.database.nameKey }}
            {{- $esData = append $esData (dict "secretKey" "db-name"     "remoteRef" (dict "key" $dbPath "property" "name")) }}
            {{- end }}
            {{- if $vm.database.userKey }}
            {{- $esData = append $esData (dict "secretKey" "db-user"     "remoteRef" (dict "key" $dbPath "property" "user")) }}
            {{- end }}
            {{- if $vm.database.passwordKey }}
            {{- $esData = append $esData (dict "secretKey" "db-password" "remoteRef" (dict "key" $dbPath "property" "password")) }}
            {{- end }}
            {{- end }}

            {{- /* S3 */}}
            {{- if $vm.s3 }}
            {{- $s3Path := printf "gentian-os/tenants/%s/apps/%s/s3" $tenant $app }}
            {{- if $vm.s3.endpointKey }}
            {{- $esData = append $esData (dict "secretKey" "s3-endpoint"   "remoteRef" (dict "key" $s3Path "property" "endpoint")) }}
            {{- end }}
            {{- if $vm.s3.bucketKey }}
            {{- $esData = append $esData (dict "secretKey" "s3-bucket"     "remoteRef" (dict "key" $s3Path "property" "bucket")) }}
            {{- end }}
            {{- if $vm.s3.accessKeyKey }}
            {{- $esData = append $esData (dict "secretKey" "s3-access-key" "remoteRef" (dict "key" $s3Path "property" "access-key")) }}
            {{- end }}
            {{- if $vm.s3.secretKeyKey }}
            {{- $esData = append $esData (dict "secretKey" "s3-secret-key" "remoteRef" (dict "key" $s3Path "property" "secret-key")) }}
            {{- end }}
            {{- if $vm.s3.regionKey }}
            {{- $esData = append $esData (dict "secretKey" "s3-region"     "remoteRef" (dict "key" $s3Path "property" "region")) }}
            {{- end }}
            {{- end }}

            {{- /* Cache */}}
            {{- if $vm.cache }}
            {{- $cachePath := printf "gentian-os/tenants/%s/apps/%s/cache" $tenant $app }}
            {{- if $vm.cache.hostKey }}
            {{- $esData = append $esData (dict "secretKey" "cache-host"     "remoteRef" (dict "key" $cachePath "property" "host")) }}
            {{- end }}
            {{- if $vm.cache.portKey }}
            {{- $esData = append $esData (dict "secretKey" "cache-port"     "remoteRef" (dict "key" $cachePath "property" "port")) }}
            {{- end }}
            {{- if $vm.cache.passwordKey }}
            {{- $esData = append $esData (dict "secretKey" "cache-password" "remoteRef" (dict "key" $cachePath "property" "password")) }}
            {{- end }}
            {{- end }}

            {{- /* SMTP */}}
            {{- if $vm.smtp }}
            {{- $smtpPath := printf "gentian-os/tenants/%s/apps/%s/smtp" $tenant $app }}
            {{- if $vm.smtp.hostKey }}
            {{- $esData = append $esData (dict "secretKey" "smtp-host"     "remoteRef" (dict "key" $smtpPath "property" "host")) }}
            {{- end }}
            {{- if $vm.smtp.portKey }}
            {{- $esData = append $esData (dict "secretKey" "smtp-port"     "remoteRef" (dict "key" $smtpPath "property" "port")) }}
            {{- end }}
            {{- if $vm.smtp.userKey }}
            {{- $esData = append $esData (dict "secretKey" "smtp-user"     "remoteRef" (dict "key" $smtpPath "property" "user")) }}
            {{- end }}
            {{- if $vm.smtp.passwordKey }}
            {{- $esData = append $esData (dict "secretKey" "smtp-password" "remoteRef" (dict "key" $smtpPath "property" "password")) }}
            {{- end }}
            {{- end }}

            {{- /* IMAP */}}
            {{- if $vm.imap }}
            {{- $imapPath := printf "gentian-os/tenants/%s/apps/%s/imap" $tenant $app }}
            {{- if $vm.imap.hostKey }}
            {{- $esData = append $esData (dict "secretKey" "imap-host" "remoteRef" (dict "key" $imapPath "property" "host")) }}
            {{- end }}
            {{- if $vm.imap.portKey }}
            {{- $esData = append $esData (dict "secretKey" "imap-port" "remoteRef" (dict "key" $imapPath "property" "port")) }}
            {{- end }}
            {{- end }}

            {{- /* App-internal secrets (AppProfile.spec.appSecrets) */}}
            {{- range $s := $appSecrets }}
            {{- if and $s.name $s.valuePath }}
            {{- $internalPath := printf "gentian-os/tenants/%s/apps/%s/internal/%s" $tenant $app $s.name }}
            {{- $esData = append $esData (dict "secretKey" (printf "internal-%s" $s.name)
                "remoteRef" (dict "key" $internalPath "property" "value")) }}
            {{- end }}
            {{- end }}

            {{- /* ── Emit OpenBao KV seeders for each app-internal secret ──────── */}}
            {{- /* For each appSecret we emit two composed resources:               */}}
            {{- /*   1. A k8s Secret in the provisioning namespace, holding a seed  */}}
            {{- /*      seed value (SHA-256 of the XApp name + secret name).        */}}
            {{- /*   2. A provider-vault SecretV2 (Observe+Create, Orphan delete)   */}}
            {{- /*      that creates the OpenBao KV path on first reconcile and     */}}
            {{- /*      never overwrites an existing version.                        */}}
            {{- range $s := $appSecrets }}
            {{- if and $s.name $s.valuePath }}
            {{- $safeName := $s.name | replace "_" "-" }}
            {{- $seedName := printf "%s-%s-seed" $xrName $safeName }}
            {{- $kvPath   := printf "gentian-os/tenants/%s/apps/%s/internal/%s" $tenant $app $s.name }}
            {{- $seedVal  := sha256sum (printf "%s:%s:%s" $xrName $app $s.name) }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-{{ $safeName }}-seed-secret
              name: {{ $seedName }}
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: {{ $seedName }}
                    namespace: {{ $provNs }}
                  type: Opaque
                  stringData:
                    data.json: '{"value":"{{ $seedVal }}"}'
              providerConfigRef:
                name: kubernetes
            ---
            apiVersion: kv.vault.upbound.io/v1alpha1
            kind: SecretV2
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-{{ $safeName }}-kv
                # Identify this resource by its KV path, not by the install that
                # created it: without an external-name the provider sees no
                # existing resource and Creates, overwriting a secret the app's
                # database is still hashed against. Mirrors app-default.
                crossplane.io/external-name: secret/data/{{ $kvPath }}
              name: {{ $seedName }}-kv
            spec:
              deletionPolicy: Orphan
              managementPolicies:
                - Observe
                - Create
              forProvider:
                mount: secret
                name: {{ $kvPath }}
                dataJsonSecretRef:
                  name: {{ $seedName }}
                  namespace: {{ $provNs }}
                  key: data.json
              providerConfigRef:
                name: openbao
            {{- end }}
            {{- end }}

            {{- /* ── Build Release set[] entries ────────────────────────────────── */}}
            {{- /* Each set entry picks a single key from the ExternalSecret-managed  */}}
            {{- /* Secret and passes it to Helm as a --set-string override. Helm      */}}
            {{- /* interprets dot-notation names as nested value paths.               */}}
            {{- $secretName := printf "%s-sensitive-values" $app }}
            {{- $relSet := list }}

            {{- if $vm.oidc }}
            {{- if $vm.oidc.issuerKey }}
            {{- $relSet = append $relSet (dict "name" $vm.oidc.issuerKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "oidc-issuer"))) }}
            {{- end }}
            {{- if $vm.oidc.clientIdKey }}
            {{- $relSet = append $relSet (dict "name" $vm.oidc.clientIdKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "oidc-client-id"))) }}
            {{- end }}
            {{- if $vm.oidc.clientSecretKey }}
            {{- $relSet = append $relSet (dict "name" $vm.oidc.clientSecretKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "oidc-client-secret"))) }}
            {{- end }}
            {{- end }}

            {{- if $vm.database }}
            {{- if $vm.database.hostKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.hostKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-host"))) }}
            {{- end }}
            {{- if $vm.database.portKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.portKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-port"))) }}
            {{- end }}
            {{- if $vm.database.nameKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.nameKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-name"))) }}
            {{- end }}
            {{- if $vm.database.readNameKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.readNameKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-name"))) }}
            {{- end }}
            {{- if $vm.database.userKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.userKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-user"))) }}
            {{- end }}
            {{- if $vm.database.readUserKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.readUserKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-user"))) }}
            {{- end }}
            {{- if $vm.database.passwordKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.passwordKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-password"))) }}
            {{- end }}
            {{- end }}

            {{- if $vm.s3 }}
            {{- if $vm.s3.endpointKey }}
            {{- $relSet = append $relSet (dict "name" $vm.s3.endpointKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "s3-endpoint"))) }}
            {{- end }}
            {{- if $vm.s3.bucketKey }}
            {{- $relSet = append $relSet (dict "name" $vm.s3.bucketKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "s3-bucket"))) }}
            {{- end }}
            {{- if $vm.s3.accessKeyKey }}
            {{- $relSet = append $relSet (dict "name" $vm.s3.accessKeyKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "s3-access-key"))) }}
            {{- end }}
            {{- if $vm.s3.secretKeyKey }}
            {{- $relSet = append $relSet (dict "name" $vm.s3.secretKeyKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "s3-secret-key"))) }}
            {{- end }}
            {{- if $vm.s3.regionKey }}
            {{- $relSet = append $relSet (dict "name" $vm.s3.regionKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "s3-region"))) }}
            {{- end }}
            {{- end }}

            {{- if $vm.cache }}
            {{- if $vm.cache.hostKey }}
            {{- $relSet = append $relSet (dict "name" $vm.cache.hostKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "cache-host"))) }}
            {{- end }}
            {{- if $vm.cache.portKey }}
            {{- $relSet = append $relSet (dict "name" $vm.cache.portKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "cache-port"))) }}
            {{- end }}
            {{- if $vm.cache.passwordKey }}
            {{- $relSet = append $relSet (dict "name" $vm.cache.passwordKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "cache-password"))) }}
            {{- end }}
            {{- end }}

            {{- if $vm.smtp }}
            {{- if $vm.smtp.hostKey }}
            {{- $relSet = append $relSet (dict "name" $vm.smtp.hostKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "smtp-host"))) }}
            {{- end }}
            {{- if $vm.smtp.portKey }}
            {{- $relSet = append $relSet (dict "name" $vm.smtp.portKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "smtp-port"))) }}
            {{- end }}
            {{- if $vm.smtp.userKey }}
            {{- $relSet = append $relSet (dict "name" $vm.smtp.userKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "smtp-user"))) }}
            {{- end }}
            {{- if $vm.smtp.passwordKey }}
            {{- $relSet = append $relSet (dict "name" $vm.smtp.passwordKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "smtp-password"))) }}
            {{- end }}
            {{- end }}

            {{- if $vm.imap }}
            {{- if $vm.imap.hostKey }}
            {{- $relSet = append $relSet (dict "name" $vm.imap.hostKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "imap-host"))) }}
            {{- end }}
            {{- if $vm.imap.portKey }}
            {{- $relSet = append $relSet (dict "name" $vm.imap.portKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "imap-port"))) }}
            {{- end }}
            {{- end }}

            {{- /* App-internal secrets */}}
            {{- range $s := $appSecrets }}
            {{- if and $s.name $s.valuePath }}
            {{- $relSet = append $relSet (dict "name" $s.valuePath
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" (printf "internal-%s" $s.name)))) }}
            {{- end }}
            {{- end }}

            {{- /* ── Render inline non-sensitive values ───────────────────────── */}}
            {{- /* Profile-level extraValues are merged with per-tenant config     */}}
            {{- /* overrides. Template variables are substituted before marshalling */}}
            {{- /* Substitutions — identity only, never endpoints:                 */}}
            {{- /*   ${TENANT_DOMAIN}    — effective tenant domain                 */}}
            {{- /*   ${TENANT_NAMESPACE} — tenant k8s namespace                    */}}
            {{- /*   ${TENANT_ID}        — tenant name (e.g. gtn-demo)             */}}
            {{- /*   ${KERNEL_DOMAIN}    — the cluster's domain (from kernel CM)   */}}
            {{- /*   ${NODE_IP}          — node address, where a chart needs one   */}}
            {{- /*                                                                 */}}
            {{- /* ${S3_ENDPOINT}, ${MYSQL_HOST} and ${SMTP_HOST} were here and    */}}
            {{- /* are gone. An endpoint substituted into extraValues hands the    */}}
            {{- /* app a hostname and no credential, and hard-codes where the      */}}
            {{- /* service lives — the app must declare the need through           */}}
            {{- /* valueMapping and let the platform answer it. See                */}}
            {{- /* gentian-os docs/app-customization.md.                           */}}
            {{- $extraVals := dict }}
            {{- /* Load kernel service endpoints from the fetched ConfigMap */}}
            {{- $ksRes := dig "kernelServices" list $extraRes }}
            {{- $ksCM  := default dict (index $ksRes 0) }}
            {{- $ksCMData := dig "data" dict $ksCM }}
            {{- if $package.extraValues }}
            {{- $kernelDomain := dig "KERNEL_DOMAIN" "" $ksCMData }}
            {{- /* No SMTP host is substituted, and none should be: mail.smtpHost
            is spec.mail.host, the smarthost Postfix relays THROUGH, and no app
            is given the credential to authenticate there. An app that needs to
            send mail declares it and receives a credential. See
            app-default.yaml. */}}
            {{- $raw := $package.extraValues | toJson }}
            {{- $raw = $raw | replace "${TENANT_DOMAIN}"    $domain }}
            {{- $raw = $raw | replace "${TENANT_NAMESPACE}" $ns }}
            {{- $raw = $raw | replace "${TENANT_ID}"        $tenant }}
            {{- if $kernelDomain }}{{ $raw = $raw | replace "${KERNEL_DOMAIN}" $kernelDomain }}{{ end }}
            {{- if $nodeIP      }}{{ $raw = $raw | replace "${NODE_IP}"       $nodeIP      }}{{ end }}
            {{- $extraVals = $raw | fromJson }}
            {{- end }}
            {{- if and $spec.config $spec.config.extraValues }}
            {{- $extraVals = mergeOverwrite $extraVals $spec.config.extraValues }}
            {{- end }}
            {{- if and $spec.config $spec.config.replicas }}
            {{- $extraVals = mergeOverwrite $extraVals (dict "replicaCount" $spec.config.replicas) }}
            {{- end }}
            {{- /* Match tenant kernel-access NetworkPolicy (gentianos.io/app selector). */}}
            {{- /* OpenProject chart uses commonLabels (Bitnami-style podLabels do not apply). */}}
            {{- $commonLabels := default dict (dig "commonLabels" dict $extraVals) }}
            {{- $commonLabels = mergeOverwrite $commonLabels (dict "gentianos.io/app" $app "gentianos.io/tenant" $tenant) }}
            {{- $extraVals = mergeOverwrite $extraVals (dict "commonLabels" $commonLabels) }}

            {{- /* opendesk/Bitnami charts expect imagePullSecrets as a string list. */}}
            {{- $rawImagePull := dig "imagePullSecrets" list $extraVals }}
            {{- $imagePull := list }}
            {{- range $entry := $rawImagePull }}
            {{- if kindIs "string" $entry }}
            {{- $imagePull = append $imagePull $entry }}
            {{- else if kindIs "map" $entry }}
            {{- $pullName := dig "name" "" $entry }}
            {{- if $pullName }}{{- $imagePull = append $imagePull $pullName }}{{- end }}
            {{- end }}
            {{- end }}
            {{- if eq (len $imagePull) 0 }}
            {{- $imagePull = list "registry-credentials" }}
            {{- end }}
            {{- $extraVals = mergeOverwrite $extraVals (dict
                "imagePullSecrets" $imagePull
                "global" (mergeOverwrite (dig "global" dict $extraVals) (dict "imagePullSecrets" $imagePull))
            ) }}

            {{- $acmeStaging := eq (dig "ACME_STAGING" "false" $ksCMData) "true" }}
            {{- if $acmeStaging }}
            {{- $krStaging := dig "requires" "services" dict $pSpec }}
            {{- $identityStaging := default dict $krStaging.identity }}
            {{- $oidcStaging := default dict $identityStaging.oidc }}
            {{- $stagingVol := dict
                "name" "kernel-trust-anchor"
                "secret" (dict "secretName" "gentian-trust-anchor-tls")
            }}
            {{- $stagingMounts := list
                (dict "name" "kernel-trust-anchor" "mountPath" "/opt/gentian-trust-anchor" "readOnly" true)
            }}
            {{- $stagingEnv := list
                (dict "name" "REQUESTS_CA_BUNDLE" "value" "/opt/gentian-trust-anchor/ca.crt")
                (dict "name" "SSL_CERT_FILE" "value" "/opt/gentian-trust-anchor/ca.crt")
                (dict "name" "DENO_CERT" "value" "/opt/gentian-trust-anchor/ca.crt")
            }}
            {{- /* Charts that render env from values.environment (e.g. OpenProject)   */}}
            {{- /* ignore top-level extraEnvVars — merge staging CA paths there too. */}}
            {{- $stagingEnvironment := dict
                "REQUESTS_CA_BUNDLE" "/opt/gentian-trust-anchor/ca.crt"
                "SSL_CERT_FILE" "/opt/gentian-trust-anchor/ca.crt"
                "DENO_CERT" "/opt/gentian-trust-anchor/ca.crt"
            }}
            {{- $existingEnvironment := default dict (dig "environment" dict $extraVals) }}
            {{- $stagingJavaOpts := list
                "-Djavax.net.ssl.trustStore=/opt/gentian-trust-anchor/truststore.jks"
                "-Djavax.net.ssl.trustStoreType=JKS"
                "-Djavax.net.ssl.trustStorePassword=changeit"
            }}
            {{- $existingJavaOpts := default list (dig "javaOpts" list $extraVals) }}
            {{- $needsJavaTrust := or (gt (len $existingJavaOpts) 0) $oidcStaging.clientId }}
            {{- if $needsJavaTrust }}
            {{- range $opt := $stagingJavaOpts }}
            {{- if not (has $opt $existingJavaOpts) }}
            {{- $existingJavaOpts = append $existingJavaOpts $opt }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- $extraVals = mergeOverwrite $extraVals (dict
                "extraEnvVars" (concat (default list (dig "extraEnvVars" list $extraVals)) $stagingEnv)
                "environment" (mergeOverwrite $existingEnvironment $stagingEnvironment)
                "extraVolumes" (concat (default list (dig "extraVolumes" list $extraVals)) (list $stagingVol))
                "extraVolumeMounts" (concat (default list (dig "extraVolumeMounts" list $extraVals)) $stagingMounts)
            ) }}
            {{- if $needsJavaTrust }}
            {{- $extraVals = mergeOverwrite $extraVals (dict "javaOpts" $existingJavaOpts) }}
            {{- end }}
            {{- end }}

            {{- /* ── Emit Keycloak Client CR ──────────────────────────────────── */}}
            {{- /* When kernelRequirements.identity.oidc is set, the composition   */}}
            {{- /* registers the app as an OIDC client in the tenant's own realm.  */}}
            {{- /* New apps only need to declare their oidc block in the AppProfile */}}
            {{- /* to get automatic per-tenant Keycloak client registration.        */}}
            {{- $kr       := dig "requires" "services" dict $pSpec }}
            {{- $identity := default dict $kr.identity }}
            {{- $oidcCl   := default dict $identity.oidc }}
            {{- if $oidcCl.clientId }}
            {{- $redirects  := list }}
            {{- range $uri := (default list $oidcCl.redirectUris) }}
            {{- $redirects = append $redirects ($uri | replace "${TENANT_DOMAIN}" $domain) }}
            {{- end }}
            {{- $postLogout := list }}
            {{- range $uri := (default list $oidcCl.postLogoutRedirectUris) }}
            {{- $postLogout = append $postLogout ($uri | replace "${TENANT_DOMAIN}" $domain) }}
            {{- end }}
            {{- if eq (default "PUBLIC" $oidcCl.accessType) "CONFIDENTIAL" }}
            {{- $oidcCredsPath := printf "gentian-os/tenants/%s/apps/%s/oidc" $tenant $app }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-oidc-client-creds-es
              name: {{ $xrName }}-oidc-client-creds-es
            spec:
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1
                  kind: ExternalSecret
                  metadata:
                    name: {{ $xrName }}-oidc-client-creds
                    namespace: {{ $provNs }}
                  spec:
                    refreshInterval: 1h
                    secretStoreRef:
                      kind: ClusterSecretStore
                      name: openbao
                    target:
                      name: {{ $xrName }}-oidc-client-creds
                      creationPolicy: Owner
                    data:
                      - secretKey: client-secret
                        remoteRef:
                          key: {{ $oidcCredsPath }}
                          property: client-secret
              providerConfigRef:
                name: kubernetes
            {{- end }}
            ---
            apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
            kind: Client
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-keycloak-client
              name: {{ $tenant }}-{{ $app }}-keycloak-client
            spec:
              deletionPolicy: Delete
              forProvider:
                clientId: {{ $oidcCl.clientId | quote }}
                name: {{ default $oidcCl.clientId $oidcCl.name | quote }}
                realmId: {{ $tenant }}
                accessType: {{ default "PUBLIC" $oidcCl.accessType | quote }}
                standardFlowEnabled: true
                directAccessGrantsEnabled: {{ default false $oidcCl.directAccessGrantsEnabled }}
                serviceAccountsEnabled: false
                {{- if hasKey $oidcPackFullScopeAllowed $oidcCl.clientId }}
                fullScopeAllowed: {{ index $oidcPackFullScopeAllowed $oidcCl.clientId }}
                {{- end }}
                {{- if $redirects }}
                validRedirectUris:
                  {{ toYaml $redirects | nindent 18 }}
                {{- end }}
                webOrigins:
                  - "+"
                {{- if $postLogout }}
                validPostLogoutRedirectUris:
                  {{ toYaml $postLogout | nindent 18 }}
                {{- end }}
                {{- if and $oidcCl.backchannelLogoutUrl (ne $oidcCl.backchannelLogoutUrl "") }}
                backchannelLogoutUrl: {{ $oidcCl.backchannelLogoutUrl | replace "${TENANT_DOMAIN}" $domain | quote }}
                backchannelLogoutSessionRequired: true
                {{- end }}
                {{- if eq (default "PUBLIC" $oidcCl.accessType) "CONFIDENTIAL" }}
                clientSecretSecretRef:
                  name: {{ $xrName }}-oidc-client-creds
                  namespace: {{ $provNs }}
                  key: client-secret
                {{- end }}
              providerConfigRef:
                name: keycloak
            {{- if hasKey $oidcPackDefaultScopes $oidcCl.clientId }}
            ---
            apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
            kind: ClientDefaultScopes
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-keycloak-default-scopes
              name: {{ $tenant }}-{{ $app }}-keycloak-default-scopes
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $tenant }}
                clientIdRef:
                  name: {{ $tenant }}-{{ $app }}-keycloak-client
                defaultScopes:
                  {{ toYaml (index $oidcPackDefaultScopes $oidcCl.clientId) | nindent 18 }}
              providerConfigRef:
                name: keycloak
            {{- end }}
            {{- end }}

            {{- /* ── Emit ExternalSecret (only when there are secrets to sync) ── */}}
            {{- if gt (len $esData) 0 }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-externalsecret
              name: {{ $xrName }}-es
            spec:
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1
                  kind: ExternalSecret
                  metadata:
                    name: {{ $secretName }}
                    namespace: {{ $ns }}
                  spec:
                    refreshInterval: 1h
                    secretStoreRef:
                      kind: ClusterSecretStore
                      name: openbao
                    target:
                      name: {{ $secretName }}
                      creationPolicy: Owner
                      deletionPolicy: Retain
                    data:
                      {{ toYaml $esData | nindent 22 }}
              providerConfigRef:
                name: kubernetes
            {{- end }}

            {{- /* OpenProject Enterprise: enable Keycloak SSO only when cluster token set */}}
            {{- if eq $app "openproject-ce" }}
            {{- $enterpriseToken := dig "OPENPROJECT_ENTERPRISE_TOKEN" "" $ksCMData }}
            {{- if $enterpriseToken }}
            {{- $existingEnvironment := default dict (dig "environment" dict $extraVals) }}
            {{- $extraVals = mergeOverwrite $extraVals (dict "environment" (mergeOverwrite $existingEnvironment (dict
                "OPENPROJECT_SEED__ENTERPRISE__TOKEN" $enterpriseToken
                "OPENPROJECT_OMNIAUTH__DIRECT__LOGIN__PROVIDER" "keycloak"
            ))) }}
            {{- end }}
            {{- end }}

            {{- /* Canonicalize extraVals so Helm values hashing is stable across reconciles */}}
            {{- $extraVals = $extraVals | toJson | fromJson }}

            {{- /* ── Emit Helm Release ────────────────────────────────────────── */}}
            ---
            apiVersion: helm.crossplane.io/v1beta1
            kind: Release
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-release
              name: {{ $xrName }}-release
            spec:
              # No rollbackLimit, deliberately. provider-helm's shouldRollBack
              # fires on StatusPendingInstall as readily as on StatusFailed, and
              # at revision 1 there is nothing to roll back to, so what it does
              # is uninstall -- deleting the chart's PVCs. OpenProject seeds a
              # database on first boot and is exactly the kind of slow install
              # that reaches waitTimeout while working. The long form is on the
              # app Release in gentian-os crossplane/compositions/app-default.yaml.
              forProvider:
                chart:
                  repository: {{ $chart.repository }}
                  name: {{ $chart.name }}
                  version: {{ $chart.version | quote }}
                namespace: {{ $ns }}
                wait: false
                skipCRDs: true
                {{- if gt (len $extraVals) 0 }}
                values:
                  {{ toYaml $extraVals | nindent 18 }}
                {{- end }}
                {{- if gt (len $relSet) 0 }}
                set:
                  {{ toYaml $relSet | nindent 18 }}
                {{- end }}
              providerConfigRef:
                name: kubernetes

            {{- /* ── Emit stable service alias ─────────────────────────────────── */}}
            {{- /* When AppProfile sets spec.ingress.serviceName (e.g. "jitsi-web") */}}
            {{- /* the chart creates services named <xrName>-release-<component>.   */}}
            {{- /* We emit a stable ClusterIP Service with the declared name so the */}}
            {{- /* tenant operator ingress backend always resolves correctly.        */}}
            {{- /* Skip when fullnameOverride == serviceName: the chart already      */}}
            {{- /* creates a Service with the correct name, so emitting our own      */}}
            {{- /* Object with the same name would conflict with Helm ownership.     */}}
            {{- /* AppProfile had one spec.ingress with serviceName and servicePort;
                 ComponentProfile has a list of exposures, each naming the Service
                 it routes to. The gateway entry is the one that needs an alias:
                 it is the one the edge resolves by name. The FIRST, because the
                 alias is one Service and a profile publishing several entries on
                 one backend names the same one. */}}
            {{- $backend := dict }}
            {{- range $e := (dig "expose" list $pSpec) }}
              {{- if and (eq (dig "surface" "" $e) "gateway") (not $backend.service) }}
                {{- $backend = dig "backend" dict $e }}
              {{- end }}
            {{- end }}
            {{- $stableSvcName  := dig "service" "" $backend }}
            {{- $fullnameOverride := dig "fullnameOverride" "" $extraVals }}
            {{- if and $stableSvcName (ne $stableSvcName $fullnameOverride) }}
            {{- $component := trimPrefix (printf "%s-" $app) $stableSvcName }}
            {{- $svcPort   := default 80 (dig "port" 0 $backend | int) }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-stable-svc
              name: {{ $xrName }}-stable-svc
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Service
                  metadata:
                    name: {{ $stableSvcName }}
                    namespace: {{ $ns }}
                  spec:
                    selector:
                      app.kubernetes.io/instance: {{ $xrName }}-release
                      app.kubernetes.io/component: {{ $component }}
                    ports:
                    - name: http
                      port: {{ $svcPort }}
                      targetPort: {{ $svcPort }}
                      protocol: TCP
              providerConfigRef:
                name: kubernetes
            {{- end }}

            {{- /* ── Emit portal-bridge sidecar (OpenProject WinBox SSO) ───────── */}}
            {{- if eq $app "openproject-ce" }}
            {{- $pbRes := dig "portalBridgeAssets" list $extraRes }}
            {{- if gt (len $pbRes) 0 }}
            {{- $pbCM := index $pbRes 0 }}
            {{- $pbData := dig "data" dict $pbCM }}
            {{- $bridgeScript := dig "bridge.py" "" $pbData }}
            {{- $projectsHost := printf "projects.%s" $domain }}
            {{- $portalApi := "http://gentian-portal-gentian-portal-api.platform-kernel.svc.cluster.local:8000/api/v1" }}
            {{- $portalFrameAncestor := printf "https://portal.%s" (dig "KERNEL_DOMAIN" "desk.gentian.org" $ksCMData) }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-portal-bridge-cm
              name: {{ $xrName }}-portal-bridge-cm
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: openproject-portal-bridge
                    namespace: {{ $ns }}
                    labels:
                      app.kubernetes.io/managed-by: gentian-os
                      gentianos.io/tenant: {{ $tenant }}
                      gentianos.io/app: {{ $app }}
                      gentianos.io/component: portal-bridge
                  data:
                    portal_bridge.py: |
                      {{ $bridgeScript | nindent 22 }}
              providerConfigRef:
                name: kubernetes
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-portal-bridge-deploy
              name: {{ $xrName }}-portal-bridge-deploy
            spec:
              forProvider:
                manifest:
                  apiVersion: apps/v1
                  kind: Deployment
                  metadata:
                    name: openproject-portal-bridge
                    namespace: {{ $ns }}
                    labels:
                      app.kubernetes.io/managed-by: gentian-os
                      gentianos.io/tenant: {{ $tenant }}
                      gentianos.io/app: {{ $app }}
                      gentianos.io/component: portal-bridge
                  spec:
                    replicas: 1
                    selector:
                      matchLabels:
                        app.kubernetes.io/name: openproject-portal-bridge
                        gentianos.io/tenant: {{ $tenant }}
                        gentianos.io/app: {{ $app }}
                    template:
                      metadata:
                        labels:
                          app.kubernetes.io/name: openproject-portal-bridge
                          app.kubernetes.io/managed-by: gentian-os
                          gentianos.io/tenant: {{ $tenant }}
                          gentianos.io/app: {{ $app }}
                          gentianos.io/component: portal-bridge
                      spec:
                        securityContext:
                          runAsNonRoot: true
                          runAsUser: 65532
                          runAsGroup: 65532
                          seccompProfile:
                            type: RuntimeDefault
                        containers:
                          - name: bridge
                            image: python:3.12-alpine
                            imagePullPolicy: IfNotPresent
                            command:
                              - python
                              - /app/portal_bridge.py
                            ports:
                              - name: http
                                containerPort: 8080
                            env:
                              - name: PORT
                                value: "8080"
                              - name: OPENPROJECT_URL
                                value: "http://openproject-ce:8080"
                              - name: OPENPROJECT_HOST
                                value: {{ $projectsHost | quote }}
                              - name: GENTIAN_PORTAL_BRIDGE_API
                                value: {{ $portalApi | quote }}
                              - name: PORTAL_FRAME_ANCESTOR
                                value: {{ $portalFrameAncestor | quote }}
                            securityContext:
                              allowPrivilegeEscalation: false
                              readOnlyRootFilesystem: true
                              capabilities:
                                drop:
                                  - ALL
                            volumeMounts:
                              - name: bridge-script
                                mountPath: /app
                                readOnly: true
                            resources:
                              requests:
                                cpu: 10m
                                memory: 32Mi
                              limits:
                                cpu: 100m
                                memory: 128Mi
                        volumes:
                          - name: bridge-script
                            configMap:
                              name: openproject-portal-bridge
                              items:
                                - key: portal_bridge.py
                                  path: portal_bridge.py
              providerConfigRef:
                name: kubernetes
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-portal-bridge-svc
              name: {{ $xrName }}-portal-bridge-svc
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Service
                  metadata:
                    name: openproject-portal-bridge
                    namespace: {{ $ns }}
                    labels:
                      app.kubernetes.io/managed-by: gentian-os
                      gentianos.io/tenant: {{ $tenant }}
                      gentianos.io/app: {{ $app }}
                      gentianos.io/component: portal-bridge
                  spec:
                    selector:
                      app.kubernetes.io/name: openproject-portal-bridge
                      gentianos.io/tenant: {{ $tenant }}
                      gentianos.io/app: {{ $app }}
                    ports:
                      - name: http
                        port: 8080
                        targetPort: http
                        protocol: TCP
              providerConfigRef:
                name: kubernetes
            {{- end }}
            {{- end }}

    # ── Step 3: Mark XR Ready when all composed resources are Ready ───────────
    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "openproject-ce.portal-bridge"
  labels:
    "gentianos.io/asset": "portal-bridge"
    "gentianos.io/profile-name": "openproject-ce"
data:
  "bridge.py": "#!/usr/bin/env python3\n\"\"\"Establish an OpenProject browser session from a portal-issued bridge ticket.\"\"\"\n\nfrom __future__ import annotations\n\nimport json\nimport os\nimport re\nimport sys\nimport urllib.error\nimport urllib.parse\nimport urllib.request\nfrom http import HTTPStatus\nfrom http.server import BaseHTTPRequestHandler, ThreadingHTTPServer\nfrom typing import Any\n\nPORTAL_API = os.environ.get(\n    \"GENTIAN_PORTAL_BRIDGE_API\",\n    \"http://gentian-portal-gentian-portal-api.platform-kernel.svc.cluster.local:8000/api/v1\",\n).rstrip(\"/\")\nOPENPROJECT_URL = os.environ.get(\"OPENPROJECT_URL\", \"http://openproject:8080\").rstrip(\"/\")\nOPENPROJECT_HOST = os.environ.get(\"OPENPROJECT_HOST\", \"\").strip()\nPORTAL_FRAME_ANCESTOR = os.environ.get(\n    \"PORTAL_FRAME_ANCESTOR\",\n    \"https://portal.desk.gentian.org\",\n).strip()\nLISTEN_PORT = int(os.environ.get(\"PORT\", \"8080\"))\n\n_SSO_HTML = \"\"\"<!DOCTYPE html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\" />\n    <title>Signing in to Projects…</title>\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />\n    <style>\n      body {\n        margin: 0;\n        font-family: system-ui, sans-serif;\n        display: grid;\n        place-items: center;\n        min-height: 100vh;\n        background: #f5f7f6;\n        color: #1a2e28;\n      }\n    </style>\n  </head>\n  <body>\n    <p>Signing in to Projects…</p>\n    <script>\n      (async () => {\n        const ticket = new URLSearchParams(window.location.search).get(\"t\");\n        if (!ticket) {\n          window.location.replace(\"/\");\n          return;\n        }\n        window.location.replace(\n          `/gentian-portal-bridge?t=${encodeURIComponent(ticket)}`,\n        );\n      })();\n    </script>\n  </body>\n</html>\n\"\"\"\n\n\nclass _NoRedirect(urllib.request.HTTPRedirectHandler):\n    def redirect_request(self, req, fp, code, msg, headers, newurl):\n        return None\n\n\ndef _openproject_headers() -> dict[str, str]:\n    host_header = OPENPROJECT_HOST or urllib.parse.urlparse(OPENPROJECT_URL).netloc\n    headers: dict[str, str] = {\"X-Forwarded-Proto\": \"https\"}\n    if host_header:\n        headers[\"Host\"] = host_header\n    return headers\n\n\ndef _openproject_opener() -> urllib.request.OpenerDirector:\n    return urllib.request.build_opener(_NoRedirect())\n\n\ndef _request(\n    method: str,\n    url: str,\n    *,\n    data: bytes | None = None,\n    headers: dict[str, str] | None = None,\n    opener: urllib.request.OpenerDirector | None = None,\n) -> tuple[int, Any, bytes]:\n    req = urllib.request.Request(url, data=data, method=method)\n    for key, value in (headers or {}).items():\n        req.add_header(key, value)\n    client = opener or urllib.request.build_opener()\n    try:\n        with client.open(req, timeout=20) as response:\n            body = response.read()\n            return response.status, response.headers, body\n    except urllib.error.HTTPError as exc:\n        body = exc.read()\n        return exc.code, exc.headers, body\n\n\ndef _redeem_ticket(ticket: str) -> dict[str, str]:\n    redeem_url = (\n        f\"{PORTAL_API}/session/openproject-bridge/redeem/\"\n        f\"{urllib.parse.quote(ticket, safe='')}\"\n    )\n    status, _, body = _request(\"GET\", redeem_url, headers={\"Accept\": \"application/json\"})\n    if status >= 400:\n        raise ValueError(\"redeem failed\")\n    payload = json.loads(body.decode(\"utf-8\"))\n    username = payload.get(\"username\")\n    password = payload.get(\"password\")\n    if not isinstance(username, str) or not username:\n        raise ValueError(\"invalid ticket\")\n    if not isinstance(password, str) or not password:\n        raise ValueError(\"invalid ticket\")\n    return {\"username\": username, \"password\": password}\n\n\ndef _extract_authenticity_token(html: str) -> str:\n    match = re.search(\n        r'class=\"-wide-labels user-login--form form\"[^>]*>.*?name=\"authenticity_token\" value=\"([^\"]+)\"',\n        html,\n        re.S,\n    )\n    if match:\n        return match.group(1)\n    fallback = re.search(r'name=\"authenticity_token\" value=\"([^\"]+)\"', html)\n    return fallback.group(1) if fallback else \"\"\n\n\ndef _cookie_header(set_cookie_values: list[str]) -> str:\n    cookies: list[str] = []\n    for header in set_cookie_values:\n        cookie = header.split(\";\", 1)[0].strip()\n        if cookie:\n            cookies.append(cookie)\n    return \"; \".join(cookies)\n\n\ndef _collect_set_cookies(headers: Any) -> list[str]:\n    if hasattr(headers, \"get_all\"):\n        values = headers.get_all(\"Set-Cookie\") or []\n        return [value for value in values if value]\n    value = headers.get(\"Set-Cookie\")\n    return [value] if value else []\n\n\ndef _normalize_redirect(location: str | None) -> str:\n    if not location:\n        return \"/\"\n    parsed = urllib.parse.urlparse(location)\n    if parsed.scheme and parsed.netloc:\n        host = OPENPROJECT_HOST or urllib.parse.urlparse(OPENPROJECT_URL).netloc\n        if parsed.netloc == host:\n            path = parsed.path or \"/\"\n            if parsed.query:\n                path = f\"{path}?{parsed.query}\"\n            return path\n    if location.startswith(\"/\"):\n        return location\n    return \"/\"\n\n\ndef _establish_openproject_session(username: str, password: str) -> tuple[list[str], str]:\n    opener = _openproject_opener()\n    base_headers = _openproject_headers()\n\n    status, headers, body = _request(\n        \"GET\",\n        f\"{OPENPROJECT_URL}/login\",\n        headers=base_headers,\n        opener=opener,\n    )\n    if status >= 400:\n        raise ValueError(\"login page failed\")\n\n    token = _extract_authenticity_token(body.decode(\"utf-8\", errors=\"replace\"))\n    if not token:\n        raise ValueError(\"missing authenticity token\")\n\n    set_cookies = _collect_set_cookies(headers)\n\n    form = urllib.parse.urlencode(\n        {\n            \"authenticity_token\": token,\n            \"username\": username,\n            \"password\": password,\n            \"login\": \"Login\",\n        }\n    ).encode(\"utf-8\")\n\n    login_headers = {\n        **base_headers,\n        \"Content-Type\": \"application/x-www-form-urlencoded\",\n    }\n    if set_cookies:\n        login_headers[\"Cookie\"] = _cookie_header(set_cookies)\n\n    status, login_headers_out, _ = _request(\n        \"POST\",\n        f\"{OPENPROJECT_URL}/login\",\n        data=form,\n        headers=login_headers,\n        opener=opener,\n    )\n    if status not in {HTTPStatus.FOUND, HTTPStatus.SEE_OTHER, HTTPStatus.MOVED_PERMANENTLY}:\n        raise ValueError(\"login failed\")\n\n    session_cookies = _collect_set_cookies(login_headers_out)\n    location = login_headers_out.get(\"Location\") or \"\"\n    if \"two_factor\" in location:\n        raise ValueError(\"login requires two-factor authentication\")\n    if not session_cookies:\n        raise ValueError(\"login failed without session cookie\")\n\n    return session_cookies, _normalize_redirect(location)\n\n\ndef _embedding_csp() -> str:\n    return f\"frame-ancestors 'self' {PORTAL_FRAME_ANCESTOR}\"\n\n\nclass BridgeHandler(BaseHTTPRequestHandler):\n    server_version = \"OpenProjectPortalBridge/1.0\"\n\n    def __init__(self, *args: Any, **kwargs: Any) -> None:\n        self._csp_sent = False\n        super().__init__(*args, **kwargs)\n\n    def log_message(self, fmt: str, *args) -> None:\n        sys.stderr.write(\"%s - %s\\n\" % (self.address_string(), fmt % args))\n\n    def send_header(self, keyword: str, value: str) -> None:\n        if keyword.lower() == \"content-security-policy\":\n            self._csp_sent = True\n        super().send_header(keyword, value)\n\n    def do_HEAD(self) -> None:\n        parsed = urllib.parse.urlparse(self.path)\n        if parsed.path == \"/openproject-portal-sso.html\":\n            self.send_response(HTTPStatus.OK)\n            self.send_header(\"Content-Type\", \"text/html; charset=utf-8\")\n            self.end_headers()\n            return\n        if parsed.path == \"/gentian-portal-bridge\":\n            self.send_response(HTTPStatus.BAD_REQUEST)\n            self.end_headers()\n            return\n        self.send_error(HTTPStatus.NOT_FOUND)\n\n    def do_GET(self) -> None:\n        parsed = urllib.parse.urlparse(self.path)\n        if parsed.path == \"/openproject-portal-sso.html\":\n            self._send_html(_SSO_HTML)\n            return\n\n        if parsed.path != \"/gentian-portal-bridge\":\n            self.send_error(HTTPStatus.NOT_FOUND)\n            return\n\n        ticket = urllib.parse.parse_qs(parsed.query).get(\"t\", [\"\"])[0]\n        if not ticket:\n            self.send_error(HTTPStatus.BAD_REQUEST, \"Missing bridge ticket\")\n            return\n\n        try:\n            session = _redeem_ticket(ticket)\n            cookies, location = _establish_openproject_session(\n                session[\"username\"],\n                session[\"password\"],\n            )\n        except ValueError as exc:\n            sys.stderr.write(\"bridge auth failed: %s\\n\" % exc)\n            self.send_error(HTTPStatus.UNAUTHORIZED, \"Invalid or expired bridge ticket\")\n            return\n        except urllib.error.URLError:\n            self.send_error(HTTPStatus.BAD_GATEWAY, \"Could not reach upstream service\")\n            return\n\n        self.send_response(HTTPStatus.FOUND)\n        for cookie in cookies:\n            self.send_header(\"Set-Cookie\", cookie)\n        self.send_header(\"Location\", location)\n        self.end_headers()\n\n    def end_headers(self) -> None:\n        if not self._csp_sent:\n            self.send_header(\"Content-Security-Policy\", _embedding_csp())\n        super().end_headers()\n\n    def _send_html(self, html: str) -> None:\n        encoded = html.encode(\"utf-8\")\n        self.send_response(HTTPStatus.OK)\n        self.send_header(\"Content-Type\", \"text/html; charset=utf-8\")\n        self.send_header(\"Content-Length\", str(len(encoded)))\n        self.end_headers()\n        self.wfile.write(encoded)\n\n\ndef main() -> None:\n    server = ThreadingHTTPServer((\"0.0.0.0\", LISTEN_PORT), BridgeHandler)\n    server.serve_forever()\n\n\nif __name__ == \"__main__\":\n    main()\n"
  "openproject-portal-sso.html": "<!DOCTYPE html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\" />\n    <title>Signing in to Projects…</title>\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />\n    <style>\n      body {\n        margin: 0;\n        font-family: system-ui, sans-serif;\n        display: grid;\n        place-items: center;\n        min-height: 100vh;\n        background: #f5f7f6;\n        color: #1a2e28;\n      }\n    </style>\n  </head>\n  <body>\n    <p>Signing in to Projects…</p>\n    <script>\n      (async () => {\n        const ticket = new URLSearchParams(window.location.search).get(\"t\");\n        if (!ticket) {\n          window.location.replace(\"/\");\n          return;\n        }\n\n        window.location.replace(\n          `/gentian-portal-bridge?t=${encodeURIComponent(ticket)}`,\n        );\n      })();\n    </script>\n  </body>\n</html>\n"
---
# OIDC pack for the community OpenProject profile (clientId: gentian-openproject).
apiVersion: gentianos.io/v1alpha1
kind: OIDCPackCatalog
metadata:
  name: openproject-ce-oidc
  labels:
    gentianos.io/profile-name: openproject-ce
spec:
  mapperTemplates:
    gentian_useruuid:
      protocolMapper: oidc-usermodel-attribute-mapper
      config:
        user.attribute: entryUUID
        claim.name: gentian_useruuid
        jsonType.label: String
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
    gentian_username:
      protocolMapper: oidc-usermodel-attribute-mapper
      config:
        user.attribute: uid
        claim.name: gentian_username
        jsonType.label: String
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
    email:
      protocolMapper: oidc-usermodel-property-mapper
      config:
        user.attribute: email
        claim.name: email
        jsonType.label: String
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
        introspection.token.claim: "true"
    given_name:
      protocolMapper: oidc-usermodel-property-mapper
      config:
        user.attribute: firstName
        claim.name: given_name
        jsonType.label: String
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
        introspection.token.claim: "true"
    family_name:
      protocolMapper: oidc-usermodel-property-mapper
      config:
        user.attribute: lastName
        claim.name: family_name
        jsonType.label: String
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
        introspection.token.claim: "true"
    openproject-ce_admin:
      protocolMapper: oidc-usermodel-attribute-mapper
      config:
        user.attribute: openprojectAdmin
        claim.name: openproject-ce_admin
        jsonType.label: String
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
  packs:
    gentian-openproject:
      scopeName: gentian-openproject-scope
      scopeDescription: "Scope for Gentian OpenProject app instances."
      clientRole: gentian-openproject-access-control
      entitlementGroup: managed-by-attribute-Projectmanagement
      publicClient: false
      fullScopeAllowed: false
      defaultScopes:
        - profile
        - email
        - roles
        - web-origins
        - acr
      mappers:
        - gentian_useruuid
        - gentian_username
        - openproject-ce_admin
        - email
        - given_name
        - family_name
