# The kernel's own UIs, as tiles on the cluster administrator's console.
#
# Each tile is shown to a person who holds any of its relations on the cluster
# (authz/model/v1/model.fga, type cluster). The host is <subDomain>.<kernelDomain>;
# the kernel domain comes from the Cluster claim in gentian-deployments, which
# is what the director reads.
tiles:
  - name: headlamp
    displayName: Cluster
    description: The cluster as Kubernetes sees it — nodes, workloads, events — with your own identity.
    subDomain: headlamp
    icon: cluster
    anyOf: [can_configure, can_operate_system, can_audit]
  - name: argocd
    displayName: Deployments
    description: What git says the cluster should run, and whether it does.
    subDomain: argocd
    # The sign-in entry, not the front page. Argo CD's front page is a login
    # form with a button that starts the realm's flow; the person following
    # this tile has a session already, so the tile skips the form and the
    # flow completes without them typing anything.
    path: /auth/login
    icon: sync
    anyOf: [can_configure, can_operate_system, can_audit]
  - name: keycloak
    displayName: Identity
    description: Realms, clients and the people in them.
    # The same hostname that issues the tokens: Keycloak refuses its own
    # Admin REST API when the console is served on a second one, so there is
    # no id-admin.<kernel> (networking.md §3).
    subDomain: id
    # Keycloak is served under /auth, and its realm console is per realm: a
    # link to /admin/ alone lands on the master realm's console, which a
    # kernel-realm administrator may not open. That refusal reads like a
    # broken sign-in rather than a wrong address.
    path: /auth/admin/kernel/console/
    icon: identity
    anyOf: [can_configure]
