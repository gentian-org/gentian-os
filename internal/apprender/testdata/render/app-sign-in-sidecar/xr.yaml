apiVersion: gentianos.io/v1alpha1
kind: XApp
metadata:
  name: render-demo-app-fixture
  annotations:
    crossplane.io/external-name: render-demo-app-fixture
spec:
  claimRef:
    name: demo-app
    namespace: tenant-demo
  profileRef:
    name: demo-app
    build: ""
  tenantNamespace: tenant-demo
  domain: demo.platform.example.test
  # What the operator puts on the claim for an install pinned to a digest
  # whose bundle brings the handler: where the app answers, and the port of
  # the sidecar's Service on which the realm tells it of a sign-out.
  signInSidecar:
    host: demo.demo.platform.example.test
    logoutPort: 8081
