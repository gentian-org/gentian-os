---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: integrationbindings.gentianos.io
spec:
  group: gentianos.io
  names:
    kind: IntegrationBinding
    listKind: IntegrationBindingList
    plural: integrationbindings
    shortNames:
    - ib
    - ibs
    singular: integrationbinding
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.contract
      name: Contract
      type: string
    - jsonPath: .spec.provider.app
      name: Provider
      type: string
    - jsonPath: .spec.consumer.app
      name: Consumer
      type: string
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          IntegrationBinding is the Schema for the integrationbindings API.

          IntegrationBinding is namespace-scoped — it lives in the tenant's namespace
          and is auto-generated by the orchestrator when both the provider and consumer
          apps are present in a tenant's app list and the AppProfile declares compatible
          integration contracts. The binding provisions shared credentials in OpenBao
          and wires the authentication method between provider and consumer.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: IntegrationBindingSpec defines the desired state of an IntegrationBinding.
            properties:
              auth:
                description: Auth configures how the consumer authenticates to the
                  provider.
                properties:
                  method:
                    description: Method is the authentication protocol.
                    enum:
                    - oidc-token-exchange
                    - service-account
                    - api-key
                    type: string
                  vaultPath:
                    description: |-
                      VaultPath is the OpenBao path where shared credentials are stored.
                      Typically: gentian-os/tenants/{tenant}/contracts/{contract}
                    type: string
                required:
                - method
                type: object
              capabilities:
                description: Capabilities lists the specific contract capabilities
                  being granted.
                items:
                  type: string
                type: array
              consumer:
                description: Consumer identifies the app that consumes the contract.
                properties:
                  app:
                    description: App is the name of the app (corresponds to the AppProfile
                      name).
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace is the Kubernetes namespace where the app
                      is running.
                    minLength: 1
                    type: string
                required:
                - app
                - namespace
                type: object
              contract:
                description: |-
                  Contract is the name of the integration contract being fulfilled
                  (e.g., "file-store", "filepicker", "central-navigation").
                minLength: 1
                pattern: ^[a-z0-9-]+$
                type: string
              provider:
                description: Provider identifies the app that fulfils the contract.
                properties:
                  app:
                    description: App is the name of the app (corresponds to the AppProfile
                      name).
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace is the Kubernetes namespace where the app
                      is running.
                    minLength: 1
                    type: string
                required:
                - app
                - namespace
                type: object
            required:
            - consumer
            - contract
            - provider
            type: object
          status:
            description: IntegrationBindingStatus holds the observed state of an IntegrationBinding.
            properties:
              conditions:
                description: Conditions provides detailed status conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastRotation:
                description: LastRotation is when the binding credentials were last
                  rotated.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the last processed spec generation.
                format: int64
                type: integer
              secretRef:
                description: |-
                  SecretRef points to the Kubernetes Secret containing the shared credentials
                  synced by ESO from the VaultPath.
                properties:
                  name:
                    description: Name is the Secret name.
                    type: string
                required:
                - name
                type: object
              state:
                description: State summarises whether the binding is functional.
                enum:
                - Pending
                - Ready
                - Failed
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
