---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: tenantbackuppolicies.gentianos.io
spec:
  group: gentianos.io
  names:
    kind: TenantBackupPolicy
    listKind: TenantBackupPolicyList
    plural: tenantbackuppolicies
    shortNames:
    - tbkpol
    singular: tenantbackuppolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.effectiveEndpoint
      name: Endpoint
      type: string
    - jsonPath: .status.effectiveBucket
      name: Bucket
      type: string
    - jsonPath: .status.effectiveSchedule
      name: Schedule
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          TenantBackupPolicy overrides the cluster backup policy for one tenant.

          Namespaced and singleton by convention (`default`) in the tenant's own
          namespace, which is also what keeps a tenant's credential reference inside
          the namespace it controls.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              TenantBackupPolicySpec overrides the cluster default for one tenant.

              Every field is optional and an unset field inherits. That is what makes
              "change only the schedule" expressible without restating a destination the
              tenant never chose.
            properties:
              destination:
                description: Destination overrides where this tenant's bundles are
                  written.
                properties:
                  bucket:
                    description: Bucket holds the bundles. Empty keeps the per-tenant
                      default name.
                    maxLength: 63
                    pattern: ^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$
                    type: string
                  credentialsSecretRef:
                    description: |-
                      CredentialsSecretRef holds accessKey and secretKey for the endpoint.

                      Required whenever Endpoint is set: the platform's own MinIO credentials
                      authenticate to the platform's own MinIO and nothing else, and quietly
                      reusing them against someone else's endpoint would send a tenant's data
                      to a store it cannot open. Cluster policy reads this from the kernel
                      namespace; a tenant's policy reads it from that tenant's namespace, so a
                      tenant can never name a Secret it does not own.
                    properties:
                      key:
                        description: Key defaults to "passphrase".
                        type: string
                      name:
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  endpoint:
                    description: |-
                      Endpoint is the S3 API URL, e.g. https://s3.eu-central-1.amazonaws.com
                      or https://minio.example.org:9000. Empty means the platform's own.

                      A scheme is required: "s3.example.org" is ambiguous about TLS, and a
                      backup silently sent in plaintext is worse than one that fails.
                    maxLength: 2048
                    pattern: ^$|^https?://[^\s/]+(/.*)?$
                    type: string
                  region:
                    description: |-
                      Region, for providers that require one. Empty suits MinIO and most
                      S3-compatible stores.
                    maxLength: 64
                    type: string
                type: object
              keepLast:
                description: KeepLast overrides retention. Nil inherits; zero means
                  keep everything.
                format: int32
                minimum: 0
                type: integer
              schedule:
                description: |-
                  Schedule overrides the cluster's cron expression, in UTC. The empty
                  string inherits; use SuspendSchedule to mean "none".
                maxLength: 128
                type: string
              suspendSchedule:
                description: |-
                  SuspendSchedule turns scheduled backups off for this tenant, distinctly
                  from inheriting. Without it, "no schedule" and "not stated" would be the
                  same value and a tenant could not opt out of a cluster default.
                type: boolean
            type: object
          status:
            description: TenantBackupPolicyStatus reports what this tenant's backups
              resolved to.
            properties:
              conditions:
                description: |-
                  Conditions carries Accepted: whether the override is permitted and its
                  destination usable.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              effectiveBucket:
                type: string
              effectiveEndpoint:
                description: |-
                  EffectiveEndpoint, EffectiveBucket and EffectiveSchedule are the values
                  actually in force after inheritance, published so an admin can see what
                  applies without recomputing the merge.
                type: string
              effectiveSchedule:
                type: string
              observedGeneration:
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
