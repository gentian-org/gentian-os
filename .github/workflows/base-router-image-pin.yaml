#
# Pins base-router image tag after gentian-ui builds.
# See portal-frontend-image-pin.yaml for the CI_BOT_PAT requirement.

name: Pin base-router image

on:
  workflow_call:
    inputs:
      sha_tag:
        description: 8-char image tag built by gentian-ui CI
        required: true
        type: string
    secrets:
      CI_BOT_PAT:
        description: Fine-grained PAT with Contents write on gentian-org/gentian-os
        required: true
  workflow_dispatch:
    inputs:
      sha_tag:
        description: 8-char image tag to pin
        required: true
        type: string

permissions:
  contents: write

jobs:
  pin:
    name: Update image tag in values
    runs-on: ubuntu-latest

    env:
      SHA_TAG: ${{ inputs.sha_tag }}

    steps:
      - name: Checkout gentian-os
        uses: actions/checkout@v4
        with:
          repository: gentian-org/gentian-os
          ref: develop
          token: ${{ secrets.CI_BOT_PAT }}

      - name: Validate payload
        run: |
          if [ -z "$SHA_TAG" ]; then
            echo "::error::sha_tag is required"
            exit 1
          fi
          echo "Pinning base-router image to ${SHA_TAG}"

      - name: Update image tag
        run: |
          VALUES=kernel/services/gentian-portal/values/base-router/_base.yaml
          sed -i "s|registry: .*|registry: \"ghcr.io\"|" "$VALUES"
          sed -i "s|repository: .*|repository: \"gentian-org/base-router\"|" "$VALUES"
          sed -i "s|tag: .*|tag: \"${SHA_TAG}\"|" "$VALUES"

      - name: Commit and push
        env:
          PUSH_TOKEN: ${{ secrets.CI_BOT_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kernel/services/gentian-portal/values/base-router/_base.yaml
          if git diff --staged --quiet; then
            echo "Image tag already pinned to ${SHA_TAG}"
            exit 0
          fi
          git commit -m "ci(base-router): update image to ${SHA_TAG}"
          if ! git push "https://x-access-token:${PUSH_TOKEN}@github.com/gentian-org/gentian-os.git" HEAD:develop; then
            echo "::error::git push failed. Add CI_BOT_PAT on gentian-os (Contents read/write)."
            exit 1
          fi

      - name: Trigger ArgoCD sync
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
          APP_NAME: gentian-portal-base-router-dev
        run: |
          if [ -z "$ARGOCD_SERVER" ] || [ -z "$ARGOCD_TOKEN" ]; then
            echo "ArgoCD secrets not configured — skipping sync"
            exit 0
          fi
          curl -sf -X POST \
            "${ARGOCD_SERVER}/api/v1/applications/${APP_NAME}/sync" \
            -H "Authorization: Bearer ${ARGOCD_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"revision":"HEAD","prune":true}' \
          && echo "ArgoCD sync triggered for ${APP_NAME}" \
          || echo "ArgoCD sync trigger failed (non-fatal)"
