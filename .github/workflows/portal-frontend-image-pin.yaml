#
# Pins portal-frontend / gentian-login image tags after gentian-ui builds.
# Called from gentian-ui via workflow_call (no PAT; requires org setting
# "Allow gentian-org actions and reusable workflows").

name: Pin portal-frontend image

on:
  workflow_call:
    inputs:
      sha_tag:
        description: 8-char image tag built by gentian-ui CI
        required: true
        type: string
      source_sha:
        description: Full git SHA of the gentian-ui build (audit only)
        required: false
        type: string
  repository_dispatch:
    types:
      - portal-frontend-image-pin

permissions:
  contents: write

jobs:
  pin:
    name: Update image tag in values
    runs-on: ubuntu-latest

    env:
      SHA_TAG: ${{ inputs.sha_tag || github.event.client_payload.sha_tag }}

    steps:
      - name: Checkout gentian-os
        uses: actions/checkout@v4
        with:
          repository: gentian-org/gentian-os
          ref: develop
          # Cross-repo workflow_call: default credentials target the caller repo.
          # CI_BOT_PAT (gentian-os secret, contents:write on this repo) is the
          # reliable option; fall back to github.token for repository_dispatch.
          token: ${{ secrets.CI_BOT_PAT || github.token }}

      - name: Validate payload
        run: |
          if [ -z "$SHA_TAG" ]; then
            echo "::error::sha_tag is required"
            exit 1
          fi
          echo "Pinning portal-frontend image to ${SHA_TAG}"

      - name: Update image tags
        run: |
          for VALUES in \
            kernel/services/gentian-portal/values/portal-frontend/_base.yaml \
            kernel/services/gentian-portal/values/gentian-login/_base.yaml
          do
            sed -i "s|^  tag: \".*\"|  tag: \"${SHA_TAG}\"|" "$VALUES"
          done

      - name: Commit and push
        env:
          PUSH_TOKEN: ${{ secrets.CI_BOT_PAT || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kernel/services/gentian-portal/values/portal-frontend/_base.yaml
          git add kernel/services/gentian-portal/values/gentian-login/_base.yaml
          if git diff --staged --quiet; then
            echo "Image tag already pinned to ${SHA_TAG}"
            exit 0
          fi
          git commit -m "ci(portal-frontend): update image to ${SHA_TAG}"
          if ! git push "https://x-access-token:${PUSH_TOKEN}@github.com/gentian-org/gentian-os.git" HEAD:develop; then
            echo "::error::git push failed. For cross-repo workflow_call, add secret CI_BOT_PAT on gentian-os (fine-grained PAT with Contents read/write on gentian-org/gentian-os)."
            exit 1
          fi

      - name: Trigger ArgoCD sync
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
          APP_NAME: gentian-portal-portal-frontend-dev
        run: |
          if [ -z "$ARGOCD_SERVER" ] || [ -z "$ARGOCD_TOKEN" ]; then
            echo "ArgoCD secrets not configured — skipping sync"
            exit 0
          fi
          curl -sf -X POST \
            "${ARGOCD_SERVER}/api/v1/applications/${APP_NAME}/sync" \
            -H "Authorization: Bearer ${ARGOCD_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"revision":"HEAD","prune":true}' \
          && echo "ArgoCD sync triggered for ${APP_NAME}" \
          || echo "ArgoCD sync trigger failed (non-fatal)"
