name: Documentation site

# docs.gentian.org: built by Docusaurus from docs/ and the root pages of this
# repository plus the pages of gentian-apps and gentian-ui, which are checked
# out at build time. Every pull request that touches the pages gets a build;
# the develop branch is deployed to GitHub Pages. The weekly run picks up
# changes in the other repositories.

on:
  push:
    branches: [develop]
    paths: ['docs/**', 'site/**', '*.md', '.github/workflows/docs-site.yaml']
  pull_request:
    paths: ['docs/**', 'site/**', '*.md', '.github/workflows/docs-site.yaml']
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check out gentian-apps
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: gentian-org/gentian-apps
          ref: develop
          path: site/external/gentian-apps

      - name: Check out gentian-ui
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: gentian-org/gentian-ui
          ref: develop
          path: site/external/gentian-ui

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci --no-audit --no-fund

      - name: Assemble the content
        working-directory: site
        run: python3 prepare.py --apps external/gentian-apps --ui external/gentian-ui --branch develop

      - name: Build
        working-directory: site
        run: npm run build

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site/build

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
