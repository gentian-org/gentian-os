name: CI

# A branch is checked as a pull request, and what is merged is checked and
# published as a push. Not both: a branch that ran on its push and again on its
# pull request did the same work twice.
#
# A branch nobody opened a pull request for is not checked. Open one, as a
# draft if it is not ready, or start the workflow by hand.
on:
  push:
    branches:
      - main
      - develop
      # test-cb is the pointer branch the test.gentian-os.org test cluster tracks.
      # It is only ever force-pushed to the tip of whatever feature branch is
      # under test — nothing is merged out of it — so it needs the same
      # published image any tracked branch needs. See the publish job below.
      - test-cb
    tags: ["v*"]
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

# A newer commit on a branch replaces the run of the older one: only the tip
# is what anybody waits for, test-cb's included. main, develop and release tags
# are never cancelled — each of their commits publishes an image something may
# pin, and what such a run started it finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: >-
    ${{ github.ref != 'refs/heads/main'
    && github.ref != 'refs/heads/develop'
    && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # What this run has to do, decided in one place and read by the jobs below.
  #
  #   publish    main, develop, test-cb and release tags push an image. Every
  #              other ref, and every pull request, builds one and pushes
  #              nothing.
  #   verified   test-cb only. It is a pointer branch: it is moved to a commit
  #              of develop or of a feature branch, and that commit has usually
  #              been through this workflow already. Running the same checks on
  #              the same commit again told nobody anything and doubled the time
  #              a commit took to reach the cluster. So a push to test-cb whose
  #              commit already has a successful push run skips the checks and
  #              only builds and publishes test-cb-<sha>.
  #
  #              Push runs only: a pull request's run checks the merge with its
  #              base, which is a different tree from the commit it names. And a
  #              commit with no such run — pushed to test-cb first, or while its
  #              own run is still going — is checked in full, as is every run
  #              whose answer could not be fetched.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      verified: ${{ steps.decide.outputs.verified }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publish=false
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            case "${GITHUB_REF}" in
              refs/heads/main|refs/heads/develop|refs/heads/test-cb|refs/tags/v*) publish=true ;;
            esac
          fi

          verified=false
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/test-cb" ]; then
            prior="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yaml/runs?head_sha=${GITHUB_SHA}&event=push&status=success&per_page=100" \
              --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID})] | length")" || prior=0
            if [ "${prior:-0}" -gt 0 ]; then
              verified=true
              echo "${GITHUB_SHA} already passed ${prior} push run(s) of this workflow; the checks are skipped." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          {
            echo "publish=${publish}"
            echo "verified=${verified}"
          } >> "$GITHUB_OUTPUT"

  go:
    name: Go — vet, build, test
    runs-on: ubuntu-latest
    needs: [plan]
    if: needs.plan.outputs.verified != 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod
          # Cached below instead. setup-go's cache is keyed on go.sum alone and
          # is never written again once that key exists, and four jobs share
          # the key — so it held whatever the first job to finish had built,
          # which was the one that builds least, and `go vet` compiled the
          # module from nothing on every run.
          cache: false

      # A key per commit and a prefix to restore from, so each run starts from
      # the last run's build cache and leaves its own behind.
      - name: Go caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-unit-${{ runner.os }}-${{ hashFiles('go.sum', 'api/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-unit-${{ runner.os }}-${{ hashFiles('go.sum', 'api/go.sum') }}-

      - name: go vet
        run: go vet ./... ./api/...

      - name: go test
        run: go test $(go list ./... ./api/... | grep -v 'internal/controller') -race -count=1

      - name: go build
        run: go build ./... ./api/...

      # Every bundle the published catalogues serve, held to this build's
      # install and rollout checks: a platform change that breaks a published
      # profile fails here, not at a tenant's install (docs/plans/versioning.md).
      - name: Published catalogues conform to this platform
        env:
          GENTIAN_CONFORMANCE_CATALOGUES: https://gentian-org.github.io/gentian-apps,https://gentian-org.github.io/gentian-apps/develop
        run: go test ./internal/profilebundle/ -run TestThePublishedCataloguesConform -count=1 -v

  # internal/controller, on its own runner beside the job above and not after
  # it: envtest's watch goroutines are incompatible with the race detector, so
  # it was always a separate `go test`, and the two share nothing but the
  # checkout.
  envtest:
    name: Go — controller tests (envtest)
    runs-on: ubuntu-latest
    needs: [plan]
    if: needs.plan.outputs.verified != 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Go caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-envtest-${{ runner.os }}-${{ hashFiles('go.sum', 'api/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-envtest-${{ runner.os }}-${{ hashFiles('go.sum', 'api/go.sum') }}-

      # Pinned, like controller-gen below. An unpinned @latest picks up a
      # toolchain bump on an unrelated day and fails a run nobody changed —
      # which is how the openfga install broke, and was fixed the same way.
      #
      # The version is setup-envtest's own, not controller-runtime's. It is a
      # separate module under that path with its own tags, so a controller-runtime
      # version resolves but has no such package:
      #
      #   module sigs.k8s.io/controller-runtime@v0.21.0 found, but does not
      #   contain package sigs.k8s.io/controller-runtime/tools/setup-envtest
      - name: Install setup-envtest
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.24.1
        env:
          # A toolchain that exists. setup-envtest declares go 1.26.0, and auto
          # resolves that to the newest 1.26.x it believes in — currently
          # go1.26.7, which is not published as a toolchain module and answers
          # 404. The step then fails before any test runs, so every commit shows
          # a red Go job whatever it changed, including shell-only ones.
          GOTOOLCHAIN: go1.26.0

      - name: Download envtest binaries
        run: |
          ASSETS=$(setup-envtest use --bin-dir /tmp/envtest-bins 1.32 -p path)
          echo "KUBEBUILDER_ASSETS=${ASSETS}" >> "$GITHUB_ENV"

      - name: go test
        run: go test ./internal/controller/... -count=1 -parallel 8 -timeout 20m

  generate:
    name: Verify generated files
    runs-on: ubuntu-latest
    needs: [plan]
    if: needs.plan.outputs.verified != 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install controller-gen
        run: go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.17.3

      - name: Verify generated deepcopy and CRD YAML are up to date
        run: make verify-gen

  lint:
    name: Lint — Go, YAML, shell
    runs-on: ubuntu-latest
    needs: [plan]
    if: needs.plan.outputs.verified != 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.11

      # A module of its own, with its own license header to check.
      - name: golangci-lint (api)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.11
          working-directory: api

      - name: yamllint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c  # v3.1.1
        with:
          config_file: .yamllint.yml

      # Installed here and run by `make lint-shell` in the lints step below,
      # over the same files, as is the step-contract check. Both used to have a
      # step of their own as well and so ran twice.
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version

      # Every lint the repository defines, as one step.
      #
      # These existed and gated nothing: eleven checks CI never ran, one of them
      # failing, in a repository that has repeatedly been bitten by tests
      # agreeing with the defect they were meant to catch. A check nobody runs
      # is worse than an absent one, because it reads as coverage.
      #
      # lint-shell is the aggregate over the structural checks — step contracts,
      # resolvable references, credential field agreement, claim defaults,
      # cluster-config keys, template placeholders, the phase table, password
      # schemes — plus shellcheck itself.
      # PyYAML before the lints, for the same reason age is installed before the
      # recovery-kit check below: two of these are Python and parse YAML, and
      # until now they ran only because the runner image happened to ship it.
      - name: lint dependencies
        run: python3 -m pip install --quiet pyyaml

      - name: lints
        # lint-marker-ascii: a kubebuilder marker that carries a typographic
        # quote renders a CRD the API server refuses, and nothing else catches
        # it — not envtest, whose newer API server is more forgiving.
        run: make lint-shell lint-yaml lint-job-scripts lint-portability lint-image-digests lint-marker-ascii verify-openbao-cli-release

      # The recovery kit is what rebuilds a cluster once its OpenBao is gone,
      # and only its export was ever exercised. age is installed rather than
      # letting the check skip: a test that silently does nothing on the one
      # machine that always runs it is not coverage.
      - name: recovery kit round trip
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq age
          make verify-recovery-kit

      - name: credential catalogue parity
        run: make gen-credentials && git diff --exit-code kernel/credentials/

      # What the authorization rules PERMIT, not what they say.
      #
      # The render tests compare generated policy text against a golden file, so
      # they prove the text came out as expected and can say nothing about what
      # it grants. A path glob with a typo — gentian-os/kernel* for
      # gentian-os/kernel/* — renders correctly, matches its golden, and opens a
      # neighbouring path. The only way to catch that is to load the policy into
      # a real OpenBao and try the access.
      #
      # The sharp rule is cluster-admin being DENIED a tenant's data. That is
      # what makes this platform multi-tenant rather than multi-namespace, and a
      # mistake in it is a breach rather than a bug.
      #
      # bao is installed rather than letting the script skip, for the reason the
      # recovery kit installs age: this suite skipped on every machine that had
      # no bao, which is every machine, and read as coverage. Seven of its
      # assertions had additionally never run anywhere, behind a yq mismatch
      # that printed SKIP. The version is the same pin the installer requires of
      # an install host, read from versions.yaml rather than repeated here.
      #
      # The OpenFGA half installs its own fga CLI via go install; this job
      # already sets up Go.
      - name: authorization policy tests
        run: |
          # The tarball, not the .deb: OpenBao publishes no .deb for this tag.
          # Asset names capitalise the platform (Linux_x86_64) while the SBOM
          # files beside them do not, so this is copied from the release rather
          # than guessed.
          BAO_VERSION="$(bash scripts/lib/versions.sh openbao cli)"
          curl -fsSL -o /tmp/bao.tar.gz \
            "https://github.com/openbao/openbao/releases/download/${BAO_VERSION}/bao_${BAO_VERSION#v}_Linux_x86_64.tar.gz"
          tar -xzf /tmp/bao.tar.gz -C /tmp bao
          sudo install -m 0755 /tmp/bao /usr/local/bin/bao
          bao version
          make test-policy

  # macOS is a supported install host, so the installer has to be exercised on
  # BSD userland and stock bash 3.2 — not just checked for it. This job is
  # SEPARATE from lint on purpose: it is expected to fail on portability until
  # Phase 13 migrates the call sites, and burying that in the main lint job
  # would either block every merge or train people to ignore a red X.
  portability:
    name: Portability (macOS)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: bash version on the runner
        run: /bin/bash --version | head -1

      - name: portability lint
        run: bash scripts/lint/lint-portability.sh

      - name: driver runs on stock bash 3.2
        run: |
          # --explain reads only step headers: no kubeconfig, no cluster, and it
          # exercises discovery, ordering and selection, which is most of the
          # driver's own logic.
          /bin/bash ./install.sh --explain

  # The image is built beside the checks and not after them, so a run takes as
  # long as its slowest job and not as long as two of them end to end. What
  # waits for the checks is the NAME: see the publish job below.
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [plan]
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      # GHCR login occasionally times out from GitHub-hosted runners; retry before failing.
      - name: Log in to GHCR
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08  # v3.0.2
        with:
          timeout_minutes: 2
          max_attempts: 5
          retry_wait_seconds: 20
          command: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        with:
          images: ghcr.io/gentian-org/gentian-os

      # Required for platforms:. Without buildx the default builder ignores the
      # list and produces an amd64-only image, silently — which is the same
      # failure mode as the single-arch digest pin this change exists to fix.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Build image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          # An SBOM and a SLSA provenance attestation travel with the image
          # (certification plan C5).
          sbom: true
          provenance: mode=max
          context: .
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          # The runtime stage's layers. Its package install runs emulated for
          # arm64 and was the longest step of the build, repeated on every run
          # for a line of the Dockerfile that almost never changes.
          cache-from: type=gha,scope=gentian-os
          cache-to: type=gha,scope=gentian-os,mode=min
          # Where an image is published it is pushed by digest, with no tag:
          # nothing follows a digest it has not been told, so until the publish
          # job names it the image is in the registry and reachable by nobody.
          # Everywhere else the build is the check and nothing is pushed.
          outputs: >-
            ${{ needs.plan.outputs.publish == 'true'
            && 'type=image,name=ghcr.io/gentian-org/gentian-os,push-by-digest=true,name-canonical=true,push=true'
            || 'type=cacheonly' }}

      # The published image, signed with this workflow's identity and scanned
      # (certification plan C5). Only where the build pushed: a pull request's
      # image exists nowhere to be signed. The scan is advisory until the backlog
      # it finds is triaged; dropping continue-on-error makes it block.
      - name: Install cosign
        if: needs.plan.outputs.publish == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Sign the image
        if: needs.plan.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/gentian-org/gentian-os@${DIGEST}"
      - name: Scan the image
        if: needs.plan.outputs.publish == 'true'
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ghcr.io/gentian-org/gentian-os@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  # Known vulnerabilities in the Go dependency graph, from the Go vulnerability
  # database, reported against the symbols the code actually reaches. Advisory:
  # it reports and does not fail the run until what it finds on its first runs
  # is triaged (certification plan C2); dropping continue-on-error makes it
  # block.
  govulncheck:
    name: Go — govulncheck
    runs-on: ubuntu-latest
    needs: [plan]
    if: needs.plan.outputs.verified != 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f  # v1.1.0
        continue-on-error: true
        with:
          go-version-file: go.mod
          go-package: ./...

  # Gives the image built above its tags, which is what publishes it: a cluster
  # follows tags. It waits for the Go jobs and for lint — the authorization
  # policy tests are in lint — so no tag exists for a commit that failed any of
  # them. On a commit test-cb was moved to after it had already passed, those
  # jobs are skipped and the earlier run is the answer (see plan).
  publish:
    name: Docker publish
    runs-on: ubuntu-latest
    needs: [plan, go, envtest, lint, docker]
    if: >-
      ${{ !cancelled()
      && needs.plan.outputs.publish == 'true'
      && needs.docker.result == 'success'
      && (needs.plan.outputs.verified == 'true'
      || (needs.go.result == 'success'
      && needs.envtest.result == 'success'
      && needs.lint.result == 'success')) }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Log in to GHCR
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08  # v3.0.2
        with:
          timeout_minutes: 2
          max_attempts: 5
          retry_wait_seconds: 20
          command: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        with:
          images: ghcr.io/gentian-org/gentian-os
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=,format=short
            # Branch-scoped immutable tag (develop-abc1234). The bare short-sha
            # tag above is published from every branch, so it cannot be tracked
            # safely — a main build would be a valid candidate for a develop
            # cluster. argocd-image-updater follows THIS pattern via allow-tags
            # in kernel/bootstrap/chart/templates/gentian-os.yaml: the moving
            # `develop` tag can never resolve to a new value, so tracking it
            # meant image.tag never changed and new builds never deployed.
            #
            # test-cb publishes because a cluster tracks it: without a
            # test-cb-<sha> tag in GHCR, the allow-tags regexp matches no
            # candidate and the cluster keeps running whatever it ran before,
            # silently. It is a flat name on purpose — docker/metadata-action
            # slugifies {{branch}}, so a branch with a "/" publishes
            # feat-xyz-<sha> while the regexp interpolates the raw "feat/xyz"
            # and never matches.
            type=sha,prefix={{branch}}-,format=short,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Tag the image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          test -n "${DIGEST}" || { echo "::error::the build job reported no digest"; exit 1; }
          args=()
          while IFS= read -r tag; do
            [ -n "${tag}" ] && args+=(--tag "${tag}")
          done <<< "${TAGS}"
          docker buildx imagetools create "${args[@]}" "ghcr.io/gentian-org/gentian-os@${DIGEST}"

  keycloak-listener:
    name: Keycloak event listener image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Log in to GHCR
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08  # v3.0.2
        with:
          timeout_minutes: 2
          max_attempts: 5
          retry_wait_seconds: 20
          command: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        with:
          images: ghcr.io/gentian-org/keycloak-event-listener
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha,prefix={{branch}}-,format=short,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      # The provider jar is a Keycloak plugin: it is copied into the running
      # Keycloak's providers directory by an init container, so the image only
      # has to carry the file. It is architecture-independent, but the copy
      # runs beside Keycloak, so it is built for the same platforms.
      - name: Build and push the listener image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          # An SBOM and a SLSA provenance attestation travel with the image
          # (certification plan C5).
          sbom: true
          provenance: mode=max
          context: kernel/extensions/keycloak-event-listener
          platforms: linux/amd64,linux/arm64
          push: >-
            ${{ github.event_name != 'pull_request'
            && (github.ref == 'refs/heads/main'
            || github.ref == 'refs/heads/develop'
            || github.ref == 'refs/heads/test-cb'
            || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # The published image, signed with this workflow's identity and scanned
      # (certification plan C5). Only where the build pushed: a pull request's
      # image exists nowhere to be signed. The scan is advisory until the backlog
      # it finds is triaged; dropping continue-on-error makes it block.
      - name: Install cosign
        if: >-
          github.event_name != 'pull_request'
          && (github.ref == 'refs/heads/main'
          || github.ref == 'refs/heads/develop'
          || github.ref == 'refs/heads/test-cb'
          || startsWith(github.ref, 'refs/tags/v'))
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Sign the image
        if: >-
          github.event_name != 'pull_request'
          && (github.ref == 'refs/heads/main'
          || github.ref == 'refs/heads/develop'
          || github.ref == 'refs/heads/test-cb'
          || startsWith(github.ref, 'refs/tags/v'))
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/gentian-org/keycloak-event-listener@${DIGEST}"
      - name: Scan the image
        if: >-
          github.event_name != 'pull_request'
          && (github.ref == 'refs/heads/main'
          || github.ref == 'refs/heads/develop'
          || github.ref == 'refs/heads/test-cb'
          || startsWith(github.ref, 'refs/tags/v'))
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ghcr.io/gentian-org/keycloak-event-listener@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  storage-tools:
    name: Storage tools image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Log in to GHCR
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08  # v3.0.2
        with:
          timeout_minutes: 2
          max_attempts: 5
          retry_wait_seconds: 20
          command: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        with:
          images: ghcr.io/gentian-org/storage-tools
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha,prefix={{branch}}-,format=short,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      # What the Jobs that move a tenant's objects run (rclone, age, tar),
      # tagged as the operator is, so the operator names its own build's.
      - name: Build and push the storage tools image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          # An SBOM and a SLSA provenance attestation travel with the image
          # (certification plan C5).
          sbom: true
          provenance: mode=max
          context: kernel/images/storage-tools
          platforms: linux/amd64,linux/arm64
          push: >-
            ${{ github.event_name != 'pull_request'
            && (github.ref == 'refs/heads/main'
            || github.ref == 'refs/heads/develop'
            || github.ref == 'refs/heads/test-cb'
            || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # The published image, signed with this workflow's identity and scanned
      # (certification plan C5). Only where the build pushed: a pull request's
      # image exists nowhere to be signed. The scan is advisory until the backlog
      # it finds is triaged; dropping continue-on-error makes it block.
      - name: Install cosign
        if: >-
          github.event_name != 'pull_request'
          && (github.ref == 'refs/heads/main'
          || github.ref == 'refs/heads/develop'
          || github.ref == 'refs/heads/test-cb'
          || startsWith(github.ref, 'refs/tags/v'))
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Sign the image
        if: >-
          github.event_name != 'pull_request'
          && (github.ref == 'refs/heads/main'
          || github.ref == 'refs/heads/develop'
          || github.ref == 'refs/heads/test-cb'
          || startsWith(github.ref, 'refs/tags/v'))
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/gentian-org/storage-tools@${DIGEST}"
      - name: Scan the image
        if: >-
          github.event_name != 'pull_request'
          && (github.ref == 'refs/heads/main'
          || github.ref == 'refs/heads/develop'
          || github.ref == 'refs/heads/test-cb'
          || startsWith(github.ref, 'refs/tags/v'))
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ghcr.io/gentian-org/storage-tools@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  crossplane-unit:
    name: Crossplane — unit tests (render + functions + schema)
    runs-on: ubuntu-latest
    needs: [plan]
    if: needs.plan.outputs.verified != 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install crossplane CLI
        env:
          GOTOOLCHAIN: auto
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          (
            cd "$tmpdir"
            XP_VERSION=v2.2.1 bash "${GITHUB_WORKSPACE}/scripts/bootstrap/install-crossplane-cli.sh"
            sudo mv crossplane /usr/local/bin/crossplane
          )
          crossplane version || true   # exits 1 when no cluster, CLI itself is OK

      - name: Install kubeconform
        run: |
          KUBECONFORM_VERSION=v0.6.7
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          curl -sL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-${OS}-${ARCH}.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Install Python test dependencies
        run: pip install pytest

      - name: Run crossplane unit tests
        run: make test-unit
