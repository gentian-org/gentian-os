version: 2
# One grouped pull request per ecosystem and week. The version comment
# beside each pinned Action or base image is what Dependabot reads and
# rewrites. Security updates are opened as they appear, outside the groups.
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The operator and the api module share one go.work; Dependabot sees two
  # modules and the group keeps a bump of a shared dependency in one PR.
  - package-ecosystem: gomod
    directories:
      - /
      - /api
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]

  # Base images, pinned by digest in every Dockerfile.
  - package-ecosystem: docker
    directories:
      - /
      - /kernel/extensions/keycloak-event-listener
      - /kernel/images/storage-tools
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
