apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: app-default
  labels:
    gentianos.io/composition: app
spec:
  compositeTypeRef:
    apiVersion: gentianos.io/v1alpha1
    kind: XApp
  mode: Pipeline
  pipeline:

    # ── Step 1: Fetch the ComponentProfile + kernel service ConfigMap ────────
    # Both resources are fetched in a single function-extra-resources call so
    # that they share the same context key
    # (apiextensions.crossplane.io/extra-resources). Splitting into two
    # function-extra-resources steps would cause the second call to overwrite
    # the context key set by the first, losing the fetched ComponentProfile.
    - step: fetch-extra-resources
      functionRef:
        name: function-extra-resources
      input:
        apiVersion: extra-resources.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          extraResources:
            - kind: ComponentProfile
              into: componentProfile
              apiVersion: gentianos.io/v1alpha1
              type: Selector
              selector:
                maxMatch: 1
                minMatch: 1
                matchLabels:
                  - key: gentianos.io/profile-name
                    type: FromCompositeFieldPath
                    valueFromFieldPath: spec.profileRef.name
            # Reads the gentian-kernel-services ConfigMap (the control namespace) to make
            # cluster-specific infrastructure endpoints available for extraValues
            # substitution: ${S3_ENDPOINT}, ${MYSQL_HOST}, ${REDIS_HOST}.
            # The ConfigMap is published by the gentian-os Helm chart via kernelServices values.
            - kind: ConfigMap
              into: kernelServices
              apiVersion: v1
              type: Selector
              selector:
                maxMatch: 1
                matchLabels:
                  - key: gentianos.io/config-type
                    type: Value
                    value: kernel-services
            # Reads the gentian-cluster-config ConfigMap (the provisioning namespace) to supply
            # cluster-specific identity URLs and secret generation mode to
            # app init Jobs emitted by this Composition.
            - kind: ConfigMap
              into: clusterConfig
              apiVersion: v1
              type: Selector
              selector:
                maxMatch: 1
                matchLabels:
                  - key: gentianos.io/config-type
                    type: Value
                    value: cluster-config
            # OIDC pack catalogue for the installed app profile (profiles/<app>/oidc-catalog.yaml).
            - kind: OIDCPackCatalog
              into: oidcPackCatalog
              apiVersion: gentianos.io/v1alpha1
              type: Selector
              selector:
                maxMatch: 1
                minMatch: 0
                matchLabels:
                  - key: gentianos.io/profile-name
                    type: FromCompositeFieldPath
                    valueFromFieldPath: spec.profileRef.name
            # Optional portal-bridge SSO helper page shipped with the profile catalogue.
            - kind: ConfigMap
              into: portalBridgeSso
              apiVersion: v1
              type: Selector
              selector:
                maxMatch: 1
                minMatch: 0
                matchLabels:
                  - key: gentianos.io/profile-name
                    type: FromCompositeFieldPath
                    valueFromFieldPath: spec.profileRef.name
                  - key: gentianos.io/asset
                    type: Value
                    value: portal-bridge-sso

    # ── Step 2: Render composed resources ─────────────────────────────────────
    # Emits per-app:
    #   • kubernetes.crossplane.io/v1alpha2 Object wrapping an ESO ExternalSecret
    #     (present only when the profile has at least one valueMapping key or
    #     appSecret; creates a flat Secret with one key per sensitive value)
    #   • helm.crossplane.io/v1beta1 Release pointing at the chart from the
    #     profile, with set[] entries that pull values from the Secret above
    - step: render-app-core
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr     := .observed.composite.resource }}
            {{- $observed := .observed }}
            {{- $spec   := $xr.spec }}
            {{- $xrName := $xr.metadata.name }}
            {{- /* App claim name (e.g. "demo-app"). The Helm release and the
                 ExternalSecret are named from it, so both are found by the app's
                 name without knowing the generated XR name. */}}
            {{- $app    := $spec.claimRef.name }}
            {{- /* The Helm release of this app in this tenant: one name for as
                 long as the app is the tenant's, across every install of it.

                 It was the Release object's own name, which carries the
                 composite's generated suffix, so each install was a different
                 Helm release. Everything a chart names after its release --
                 workloads, Services, and the volume claims it templates --
                 was renamed by a reinstall, and a volume kept from the install
                 before could not be found again, nor taken over: Helm adopts an
                 existing object only when it records the same release name and
                 namespace.

                 The namespace is the tenant's, so the app's name is enough to
                 make it unique. The Release OBJECT keeps the composite's name:
                 it is cluster-scoped and has to differ between tenants. */}}
            {{- $release := printf "%s-release" $app }}
            {{- /* What makes uninstalling keep the app's files: see the
                 ConfigMap emitted beside the Release. */}}
            {{- $keepVolumes := printf "%s-keep-volumes" $release }}
            {{- $ns     := $spec.tenantNamespace }}
            {{- /* Derive tenant name from namespace convention "tenant-{name}". */}}
            {{- $tenant := trimPrefix "tenant-" $ns }}
            {{- /* The Keycloak realm the tenant's people, groups and clients are
                 in. The operator passes it (keycloak.RealmName): a tenant may
                 name a realm that is not called what the tenant is, as the
                 platform tenant names the kernel realm. A claim that carries
                 none is a tenant with a realm of its own name. This is the
                 one place the Composition decides it; every realmId below
                 reads it, so the group the operator purges and the client
                 this composes are in the same realm. */}}
            {{- $realm := default $tenant $spec.realm }}
            {{- /* Tenant domain — used for substitution in extraValues AND in
                 Keycloak client redirect URIs. Computed once at top level so
                 both blocks share the same value. */}}
            {{- $domain := default (printf "%s.example.org" $tenant) $spec.domain }}

            {{- /* ── Load ComponentProfile from pipeline context ───────────────── */}}
            {{- /* One catalogue kind (AD-4). The fields this composition reads are
                 the same values they were on AppProfile; what changed is that they
                 are grouped -- the package under package, the requirements under
                 requires, the secrets under secrets -- so each read below names its
                 group. dig walks a missing group to the default rather than
                 failing, which is what lets a profile omit one entirely. */}}
            {{- $extraRes  := index .context "apiextensions.crossplane.io/extra-resources" }}
            {{- $profiles  := dig "componentProfile" list $extraRes }}
            {{- if eq (len $profiles) 0 }}
              {{- fail (printf "ComponentProfile %q not found in cluster" $spec.profileRef.name) }}
            {{- end }}
            {{- $profile   := index $profiles 0 }}
            {{- $pSpec     := dig "spec" dict $profile }}
            {{- $package   := dig "package" dict $pSpec }}
            {{- $vm        := dig "valueMapping" dict $package }}
            {{- $appSecrets := dig "secrets" "generated" list $pSpec }}
            {{- $chart     := dig "chart" nil $package }}

            {{- $kr := dig "requires" "services" dict $pSpec }}
            {{- /* Whether the profile declares the model gateway. Present is the
                 declaration: the requirement carries no field. */}}
            {{- $llmDeclared := hasKey $kr "llm" }}

            {{- /* ── Load cluster-config ConfigMap ──────────────────────────────── */}}
            {{- /* Provides infra endpoints (e.g. node IP, SMTP host) for rendering. */}}
            {{- $ccRes      := dig "clusterConfig" list $extraRes }}
            {{- $ccCM       := default dict (index $ccRes 0) }}
            {{- $ccData     := dig "data" dict $ccCM }}
            {{- /* The namespace Crossplane and its providers run in, where the
                 seed Secrets below are written and read back by provider-vault.
                 Taken from where the cluster composition put this ConfigMap
                 rather than named: v4 wrote crossplane-system here, a namespace
                 the v5 layout does not have, so every app with an internal
                 secret composed an Object that could never be created. */}}
            {{- $provNs     := dig "metadata" "namespace" "kernel-provisioning" $ccCM }}
            {{- $nodeIP        := dig "node.ip"        "" $ccData }}

            {{- /* OIDC pack scopes from the profile's OIDCPackCatalog CR.

                 The packs themselves and the catalogue's mapperTemplates are kept
                 too, not just the two values derived here: the client scope, its
                 protocol mappers, the client role and the group that grants it are
                 all described by the same object, and were provisioned by a Job
                 reading it rather than by this Composition. Everything needed to
                 declare them is already in scope; nothing new is fetched. */}}
            {{- $oidcPackDefaultScopes := dict }}
            {{- $oidcPackFullScopeAllowed := dict }}
            {{- $oidcPacks := dict }}
            {{- $oidcMapperTemplates := dict }}
            {{- $catalogRes := dig "oidcPackCatalog" list $extraRes }}
            {{- if gt (len $catalogRes) 0 }}
            {{- $catSpec := dig "spec" dict (index $catalogRes 0) }}
            {{- $catPacks := default dict $catSpec.packs }}
            {{- $oidcMapperTemplates = default dict $catSpec.mapperTemplates }}
            {{- range $clientId, $pack := $catPacks }}
            {{- $scopes := default list $pack.defaultScopes }}
            {{- if $pack.scopeName }}
            {{- $scopes = append $scopes $pack.scopeName }}
            {{- end }}
            {{- $_ := set $oidcPackDefaultScopes $clientId $scopes }}
            {{- $_ := set $oidcPackFullScopeAllowed $clientId (default false $pack.fullScopeAllowed) }}
            {{- $_ := set $oidcPacks $clientId $pack }}
            {{- end }}
            {{- end }}

            {{- /* ── Build ExternalSecret data[] entries ───────────────────────── */}}
            {{- /* Each entry pulls one scalar from an OpenBao KV path and stores  */}}
            {{- /* it under a flat secretKey in the managed Secret. Non-empty keys  */}}
            {{- /* in the ValueMapping drive which entries are emitted.             */}}
            {{- $esData := list }}

            {{- /* OIDC */}}
            {{- if $vm.oidc }}
            {{- $oidcPath := printf "gentian-os/tenants/%s/apps/%s/oidc" $tenant $app }}
            {{- if $vm.oidc.issuerKey }}
            {{- $esData = append $esData (dict "secretKey" "oidc-issuer"        "remoteRef" (dict "key" $oidcPath "property" "issuer")) }}
            {{- end }}
            {{- if $vm.oidc.clientIdKey }}
            {{- $esData = append $esData (dict "secretKey" "oidc-client-id"     "remoteRef" (dict "key" $oidcPath "property" "client-id")) }}
            {{- end }}
            {{- if $vm.oidc.clientSecretKey }}
            {{- /* Use the explicit path/property when the OIDC client is in the
                 kernel realm (not per-tenant). Default to the standard per-tenant
                 path so existing apps need no changes. */}}
            {{- $csPath := default $oidcPath $vm.oidc.clientSecretOpenbaoPath }}
            {{- $csProp := default "client-secret" $vm.oidc.clientSecretOpenbaoProperty }}
            {{- $esData = append $esData (dict "secretKey" "oidc-client-secret" "remoteRef" (dict "key" $csPath "property" $csProp)) }}
            {{- end }}
            {{- end }}

            {{- /* Database */}}
            {{- if $vm.database }}
            {{- $dbPath := printf "gentian-os/tenants/%s/apps/%s/database" $tenant $app }}
            {{- if $vm.database.hostKey }}
            {{- $esData = append $esData (dict "secretKey" "db-host"     "remoteRef" (dict "key" $dbPath "property" "host")) }}
            {{- end }}
            {{- if $vm.database.portKey }}
            {{- $esData = append $esData (dict "secretKey" "db-port"     "remoteRef" (dict "key" $dbPath "property" "port")) }}
            {{- end }}
            {{- if $vm.database.nameKey }}
            {{- $esData = append $esData (dict "secretKey" "db-name"     "remoteRef" (dict "key" $dbPath "property" "name")) }}
            {{- end }}
            {{- if $vm.database.userKey }}
            {{- $esData = append $esData (dict "secretKey" "db-user"     "remoteRef" (dict "key" $dbPath "property" "user")) }}
            {{- end }}
            {{- if $vm.database.passwordKey }}
            {{- $esData = append $esData (dict "secretKey" "db-password" "remoteRef" (dict "key" $dbPath "property" "password")) }}
            {{- end }}
            {{- end }}

            {{- /* S3 */}}
            {{- if $vm.s3 }}
            {{- $s3Path := printf "gentian-os/tenants/%s/apps/%s/s3" $tenant $app }}
            {{- if $vm.s3.endpointKey }}
            {{- $esData = append $esData (dict "secretKey" "s3-endpoint"   "remoteRef" (dict "key" $s3Path "property" "endpoint")) }}
            {{- end }}
            {{- if $vm.s3.bucketKey }}
            {{- $esData = append $esData (dict "secretKey" "s3-bucket"     "remoteRef" (dict "key" $s3Path "property" "bucket")) }}
            {{- end }}
            {{- if $vm.s3.accessKeyKey }}
            {{- $esData = append $esData (dict "secretKey" "s3-access-key" "remoteRef" (dict "key" $s3Path "property" "access-key")) }}
            {{- end }}
            {{- if $vm.s3.secretKeyKey }}
            {{- $esData = append $esData (dict "secretKey" "s3-secret-key" "remoteRef" (dict "key" $s3Path "property" "secret-key")) }}
            {{- end }}
            {{- if $vm.s3.regionKey }}
            {{- $esData = append $esData (dict "secretKey" "s3-region"     "remoteRef" (dict "key" $s3Path "property" "region")) }}
            {{- end }}
            {{- end }}

            {{- /* Cache */}}
            {{- if $vm.cache }}
            {{- $cachePath := printf "gentian-os/tenants/%s/apps/%s/cache" $tenant $app }}
            {{- if $vm.cache.hostKey }}
            {{- $esData = append $esData (dict "secretKey" "cache-host"     "remoteRef" (dict "key" $cachePath "property" "host")) }}
            {{- end }}
            {{- if $vm.cache.portKey }}
            {{- $esData = append $esData (dict "secretKey" "cache-port"     "remoteRef" (dict "key" $cachePath "property" "port")) }}
            {{- end }}
            {{- if $vm.cache.userKey }}
            {{- $esData = append $esData (dict "secretKey" "cache-user"     "remoteRef" (dict "key" $cachePath "property" "user")) }}
            {{- end }}
            {{- if $vm.cache.passwordKey }}
            {{- $esData = append $esData (dict "secretKey" "cache-password" "remoteRef" (dict "key" $cachePath "property" "password")) }}
            {{- end }}
            {{- end }}

            {{- /* Model gateway. Mapped only for a profile that declares
                 requires.services.llm: the record below is written by the
                 operator for a declaring app and for no other, and an
                 ExternalSecret naming a path that is never written fails on
                 every refresh. */}}
            {{- if and $vm.llm $llmDeclared }}
            {{- $llmPath := printf "gentian-os/tenants/%s/apps/%s/llm" $tenant $app }}
            {{- if $vm.llm.baseUrlKey }}
            {{- $esData = append $esData (dict "secretKey" "llm-base-url" "remoteRef" (dict "key" $llmPath "property" "base-url")) }}
            {{- end }}
            {{- if $vm.llm.apiKeyKey }}
            {{- $esData = append $esData (dict "secretKey" "llm-api-key"  "remoteRef" (dict "key" $llmPath "property" "api-key")) }}
            {{- end }}
            {{- end }}

            {{- /* SMTP */}}
            {{- if $vm.smtp }}
            {{- $smtpPath := printf "gentian-os/tenants/%s/apps/%s/smtp" $tenant $app }}
            {{- if $vm.smtp.hostKey }}
            {{- $esData = append $esData (dict "secretKey" "smtp-host"     "remoteRef" (dict "key" $smtpPath "property" "host")) }}
            {{- end }}
            {{- if $vm.smtp.portKey }}
            {{- $esData = append $esData (dict "secretKey" "smtp-port"     "remoteRef" (dict "key" $smtpPath "property" "port")) }}
            {{- end }}
            {{- if $vm.smtp.userKey }}
            {{- $esData = append $esData (dict "secretKey" "smtp-user"     "remoteRef" (dict "key" $smtpPath "property" "user")) }}
            {{- end }}
            {{- if $vm.smtp.passwordKey }}
            {{- $esData = append $esData (dict "secretKey" "smtp-password" "remoteRef" (dict "key" $smtpPath "property" "password")) }}
            {{- end }}
            {{- end }}

            {{- /* IMAP */}}
            {{- if $vm.imap }}
            {{- $imapPath := printf "gentian-os/tenants/%s/apps/%s/imap" $tenant $app }}
            {{- if $vm.imap.hostKey }}
            {{- $esData = append $esData (dict "secretKey" "imap-host" "remoteRef" (dict "key" $imapPath "property" "host")) }}
            {{- end }}
            {{- if $vm.imap.portKey }}
            {{- $esData = append $esData (dict "secretKey" "imap-port" "remoteRef" (dict "key" $imapPath "property" "port")) }}
            {{- end }}
            {{- end }}

            {{- /* Integrations */}}
            {{- if $vm.integrations }}
            {{- range $contract, $mapping := $vm.integrations }}
            {{- $contractPath := printf "gentian-os/tenants/%s/contracts/%s" $tenant $contract }}
            {{- if $mapping.endpointKey }}
            {{- $esData = append $esData (dict "secretKey" (printf "integration-%s-endpoint" $contract) "remoteRef" (dict "key" $contractPath "property" "endpoint")) }}
            {{- end }}
            {{- if $mapping.userKey }}
            {{- $esData = append $esData (dict "secretKey" (printf "integration-%s-user" $contract) "remoteRef" (dict "key" $contractPath "property" "user")) }}
            {{- end }}
            {{- if $mapping.passwordKey }}
            {{- $esData = append $esData (dict "secretKey" (printf "integration-%s-password" $contract) "remoteRef" (dict "key" $contractPath "property" "password")) }}
            {{- end }}
            {{- end }}
            {{- end }}

            {{- /* App-internal secrets (spec.secrets.generated) */}}
            {{- range $s := $appSecrets }}
            {{- if and $s.name $s.valuePath }}
            {{- $internalPath := printf "gentian-os/tenants/%s/apps/%s/internal/%s" $tenant $app $s.name }}
            {{- $esData = append $esData (dict "secretKey" (printf "internal-%s" $s.name)
                "remoteRef" (dict "key" $internalPath "property" "value")) }}
            {{- end }}
            {{- end }}

            {{- /* ── Emit OpenBao KV seeders for each app-internal secret ──────── */}}
            {{- /* For each appSecret we emit two composed resources:               */}}
            {{- /*   1. A k8s Secret in the provisioning namespace, holding a seed  */}}
            {{- /*      seed value (SHA-256 of the XApp name + secret name).        */}}
            {{- /*   2. A provider-vault SecretV2 (Observe+Create, Orphan delete)   */}}
            {{- /*      that creates the OpenBao KV path on first reconcile and     */}}
            {{- /*      never overwrites an existing version.                        */}}
            {{- range $s := $appSecrets }}
            {{- if and $s.name $s.valuePath }}
            {{- $safeName := $s.name | replace "_" "-" }}
            {{- $seedName := printf "%s-%s-seed" $xrName $safeName }}
            {{- $kvPath   := printf "gentian-os/tenants/%s/apps/%s/internal/%s" $tenant $app $s.name }}
            {{- $seedVal  := sha256sum (printf "%s:%s:%s" $xrName $app $s.name) }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-{{ $safeName }}-seed-secret
              name: {{ $seedName }}
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: {{ $seedName }}
                    namespace: {{ $provNs }}
                  type: Opaque
                  stringData:
                    data.json: '{"value":"{{ $seedVal }}"}'
              providerConfigRef:
                name: kubernetes
            ---
            apiVersion: kv.vault.upbound.io/v1alpha1
            kind: SecretV2
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-{{ $safeName }}-kv
                # Ties this managed resource to the KV path rather than to the
                # install that happened to create it. Without it the provider
                # has nothing to observe against, treats the path as absent,
                # and Creates -- overwriting a secret the app's database is
                # still hashed against. The MR name carries the composite's
                # generated suffix, so every reinstall minted a new MR, and a
                # new MR meant a new value. This is what makes a secret live as
                # long as the app rather than as long as one installation of
                # it: purge deletes the path and the next install writes a
                # fresh value, while a plain reinstall observes what is already
                # there and keeps it. Format is the Terraform resource id for
                # vault_kv_secret_v2, "<mount>/data/<name>" -- see
                # status.atProvider.id on any existing instance.
                crossplane.io/external-name: secret/data/{{ $kvPath }}
              name: {{ $seedName }}-kv
            spec:
              deletionPolicy: Orphan
              managementPolicies:
                - Observe
                - Create
              forProvider:
                mount: secret
                name: {{ $kvPath }}
                dataJsonSecretRef:
                  name: {{ $seedName }}
                  namespace: {{ $provNs }}
                  key: data.json
              providerConfigRef:
                name: openbao
            {{- end }}
            {{- end }}

            {{- /* ── Build Release set[] entries ────────────────────────────────── */}}
            {{- /* Each set entry picks a single key from the ExternalSecret-managed  */}}
            {{- /* Secret and passes it to Helm as a --set-string override. Helm      */}}
            {{- /* interprets dot-notation names as nested value paths.               */}}
            {{- $secretName := printf "%s-sensitive-values" $app }}
            {{- $relSet := list }}

            {{- if $vm.oidc }}
            {{- if $vm.oidc.issuerKey }}
            {{- $relSet = append $relSet (dict "name" $vm.oidc.issuerKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "oidc-issuer"))) }}
            {{- end }}
            {{- if $vm.oidc.clientIdKey }}
            {{- $relSet = append $relSet (dict "name" $vm.oidc.clientIdKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "oidc-client-id"))) }}
            {{- end }}
            {{- if $vm.oidc.clientSecretKey }}
            {{- $relSet = append $relSet (dict "name" $vm.oidc.clientSecretKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "oidc-client-secret"))) }}
            {{- end }}
            {{- end }}

            {{- if $vm.database }}
            {{- if $vm.database.hostKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.hostKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-host"))) }}
            {{- end }}
            {{- if $vm.database.portKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.portKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-port"))) }}
            {{- end }}
            {{- if $vm.database.nameKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.nameKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-name"))) }}
            {{- end }}
            {{- if $vm.database.readNameKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.readNameKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-name"))) }}
            {{- end }}
            {{- if $vm.database.userKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.userKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-user"))) }}
            {{- end }}
            {{- if $vm.database.readUserKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.readUserKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-user"))) }}
            {{- end }}
            {{- if $vm.database.passwordKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.passwordKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-password"))) }}
            {{- end }}
            {{- end }}

            {{- if $vm.s3 }}
            {{- if $vm.s3.endpointKey }}
            {{- $relSet = append $relSet (dict "name" $vm.s3.endpointKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "s3-endpoint"))) }}
            {{- end }}
            {{- if $vm.s3.bucketKey }}
            {{- $relSet = append $relSet (dict "name" $vm.s3.bucketKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "s3-bucket"))) }}
            {{- end }}
            {{- if $vm.s3.accessKeyKey }}
            {{- $relSet = append $relSet (dict "name" $vm.s3.accessKeyKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "s3-access-key"))) }}
            {{- end }}
            {{- if $vm.s3.secretKeyKey }}
            {{- $relSet = append $relSet (dict "name" $vm.s3.secretKeyKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "s3-secret-key"))) }}
            {{- end }}
            {{- if $vm.s3.regionKey }}
            {{- $relSet = append $relSet (dict "name" $vm.s3.regionKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "s3-region"))) }}
            {{- end }}
            {{- end }}

            {{- if $vm.cache }}
            {{- if $vm.cache.hostKey }}
            {{- $relSet = append $relSet (dict "name" $vm.cache.hostKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "cache-host"))) }}
            {{- end }}
            {{- if $vm.cache.portKey }}
            {{- $relSet = append $relSet (dict "name" $vm.cache.portKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "cache-port"))) }}
            {{- end }}
            {{- if $vm.cache.userKey }}
            {{- $relSet = append $relSet (dict "name" $vm.cache.userKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "cache-user"))) }}
            {{- end }}
            {{- if $vm.cache.passwordKey }}
            {{- $relSet = append $relSet (dict "name" $vm.cache.passwordKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "cache-password"))) }}
            {{- end }}
            {{- end }}

            {{- if and $vm.llm $llmDeclared }}
            {{- if $vm.llm.baseUrlKey }}
            {{- $relSet = append $relSet (dict "name" $vm.llm.baseUrlKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "llm-base-url"))) }}
            {{- end }}
            {{- if $vm.llm.apiKeyKey }}
            {{- $relSet = append $relSet (dict "name" $vm.llm.apiKeyKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "llm-api-key"))) }}
            {{- end }}
            {{- end }}

            {{- if $vm.smtp }}
            {{- if $vm.smtp.hostKey }}
            {{- $relSet = append $relSet (dict "name" $vm.smtp.hostKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "smtp-host"))) }}
            {{- end }}
            {{- if $vm.smtp.portKey }}
            {{- $relSet = append $relSet (dict "name" $vm.smtp.portKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "smtp-port"))) }}
            {{- end }}
            {{- if $vm.smtp.userKey }}
            {{- $relSet = append $relSet (dict "name" $vm.smtp.userKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "smtp-user"))) }}
            {{- end }}
            {{- if $vm.smtp.passwordKey }}
            {{- $relSet = append $relSet (dict "name" $vm.smtp.passwordKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "smtp-password"))) }}
            {{- end }}
            {{- end }}

            {{- if $vm.imap }}
            {{- if $vm.imap.hostKey }}
            {{- $relSet = append $relSet (dict "name" $vm.imap.hostKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "imap-host"))) }}
            {{- end }}
            {{- if $vm.imap.portKey }}
            {{- $relSet = append $relSet (dict "name" $vm.imap.portKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "imap-port"))) }}
            {{- end }}
            {{- end }}

            {{- /* Integrations */}}
            {{- if $vm.integrations }}
            {{- range $contract, $mapping := $vm.integrations }}
            {{- if $mapping.endpointKey }}
            {{- $relSet = append $relSet (dict "name" $mapping.endpointKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" (printf "integration-%s-endpoint" $contract)))) }}
            {{- end }}
            {{- if $mapping.userKey }}
            {{- $relSet = append $relSet (dict "name" $mapping.userKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" (printf "integration-%s-user" $contract)))) }}
            {{- end }}
            {{- if $mapping.passwordKey }}
            {{- $relSet = append $relSet (dict "name" $mapping.passwordKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" (printf "integration-%s-password" $contract)))) }}
            {{- end }}
            {{- end }}
            {{- end }}

            {{- /* App-internal secrets */}}
            {{- range $s := $appSecrets }}
            {{- if and $s.name $s.valuePath }}
            {{- $relSet = append $relSet (dict "name" $s.valuePath
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" (printf "internal-%s" $s.name)))) }}
            {{- end }}
            {{- end }}

            {{- /* ── Render inline non-sensitive values ───────────────────────── */}}
            {{- /* Profile-level extraValues are merged with per-tenant config     */}}
            {{- /* overrides. Template variables are substituted before marshalling */}}
            {{- /* Substitutions:                                                   */}}
            {{- /*   ${TENANT_DOMAIN}    — effective tenant domain                 */}}
            {{- /*   ${TENANT_NAMESPACE} — tenant k8s namespace                    */}}
            {{- /*   ${TENANT_ID}        — tenant name (e.g. gtn-demo)             */}}
            {{- /*
                 Identity only. No endpoint is substituted here, and none
                 should be: S3_ENDPOINT, MYSQL_HOST, REDIS_HOST, SMTP_HOST and
                 TURN_* each handed an app a hostname with no credential —
                 TURN_CREDENTIALS handed it an actual shared secret, into a
                 ConfigMap. See P9 in docs/app-customization.md.

                 A tenant's id, namespace and domain are facts about the app's
                 own context. They name nothing to connect to and carry nothing
                 to authenticate with, which is what makes them safe to expand.
            */}}
            {{- $extraVals := dict }}
            {{- /* Load kernel service endpoints from the fetched ConfigMap */}}
            {{- $ksRes := dig "kernelServices" list $extraRes }}
            {{- $ksCM  := default dict (index $ksRes 0) }}
            {{- $ksCMData := dig "data" dict $ksCM }}
            {{- $kernelDomain := dig "KERNEL_DOMAIN" "" $ksCMData }}
            {{- if $package.extraValues }}
            {{- $raw := $package.extraValues | toJson }}
            {{- $raw = $raw | replace "${TENANT_DOMAIN}"    $domain }}
            {{- $raw = $raw | replace "${TENANT_NAMESPACE}" $ns }}
            {{- $raw = $raw | replace "${TENANT_ID}"        $tenant }}
            {{- $raw = $raw | replace "${APP_ID}"           $app }}
            {{- if $kernelDomain }}{{ $raw = $raw | replace "${KERNEL_DOMAIN}" $kernelDomain }}{{ end }}
            {{- /*
            No endpoint substitutions. ${S3_ENDPOINT}, ${MYSQL_HOST},
            ${REDIS_HOST} and ${SMTP_HOST} used to be replaced here.

            Each handed an app a literal hostname and no credential, so a
            profile using one hard-coded an assumption about where a service
            lives while the values it actually needs arrived separately through
            valueMapping — two mechanisms wiring one dependency, and only one of
            them able to carry a password. ${SMTP_HOST} additionally resolved to
            the upstream relay, which no app can authenticate to.

            An app declares kernelRequirements.<category> and maps its own chart
            keys under valueMapping; the values then reach it as secretKeyRef
            entries it never resolves. See docs/app-customization.md P9.

            The identity placeholders below stay: a tenant's id, namespace and
            domain are facts about the app's own context, not endpoints, and
            carry nothing to authenticate with.
            */}}
            {{- if $nodeIP      }}{{ $raw = $raw | replace "${NODE_IP}"       $nodeIP      }}{{ end }}
            {{- $extraVals = $raw | fromJson }}
            {{- end }}
            {{- if and $spec.config $spec.config.extraValues }}
            {{- $extraVals = mergeOverwrite $extraVals $spec.config.extraValues }}
            {{- end }}
            {{- if and $spec.config $spec.config.replicas }}
            {{- $extraVals = mergeOverwrite $extraVals (dict "replicaCount" $spec.config.replicas) }}
            {{- end }}

            {{- /* ── Overlay values an addon needs from the base's chart ─────────── */}}
            {{- /* Some addons need infrastructure, not just a flag in the running app:
                   Nextcloud's richdocuments is inert without a Collabora server, which
                   the upstream chart ships as a subchart gated on collabora.enabled.
                   Running it unconditionally costs every tenant ~1Gi whether or not
                   anyone opens a document.

                   The base declares the overlay, keyed on the app-side addon id, so all
                   of that infrastructure's tuning, MAC waivers and in-app wiring stay in
                   one profile. Matching happens here because spec.addons already carries
                   the resolved ids — no operator change and no new field on the XR. */}}
            {{- $selectedAddons := dig "addons" list $spec }}
            {{- range $overlay := (dig "customization" "addonValues" list $pSpec) }}
            {{- if and $overlay.whenAddon $overlay.values (has $overlay.whenAddon $selectedAddons) }}
            {{- $extraVals = mergeOverwrite $extraVals $overlay.values }}
            {{- end }}
            {{- end }}

            {{- /* ── Activate addons selected into this base (L3) ────────────────── */}}
            {{- /* The platform does not know how any app activates an addon. The base
                   profile supplies the recipe in spec.customization.addonActivation and
                   this only renders it into the release values, so `occ app:enable` and
                   friends stay in gentian-apps next to the app they describe.

                   Expressing activation as values rather than as a Job means it runs in
                   the app's own container, with its config, data volume and secrets
                   already mounted — nothing to re-plumb. Changing the selection changes
                   the values, which rolls the pod, which re-runs the (idempotent) script.
                   Deselecting an addon stops activating it; it does not uninstall it,
                   since that is destructive and belongs to an explicit purge path. */}}
            {{- /* Rendered whenever the base declares a recipe, including when the
                   selection is empty: the script reconciles, so an empty selection is
                   how "deselect everything" is expressed. Skipping it here would drop
                   the values key and leave the last selection enabled forever. */}}
            {{- $addons := dig "addons" list $spec }}
            {{- $activation := dig "customization" "addonActivation" dict $pSpec }}
            {{- if and $activation.valuesPath $activation.script }}
            {{- $script := $activation.script | replace "__GENTIAN_ADDON_IDS__" (join " " $addons) }}
            {{- /* Same ${TENANT_DOMAIN}/${TENANT_NAMESPACE}/${TENANT_ID}/${APP_ID}
                   substitution as extraValues above, because addonActivation.script
                   is not part of extraValues and so never went through that pass —
                   confirmed live: nextcloud-base-ce's script used ${TENANT_NAMESPACE}
                   to address the Collabora Service, the token reached the container
                   as literal text, and `set -u` in the hook killed the pod on every
                   start with "TENANT_NAMESPACE: unbound variable". An addon script is
                   exactly as app-specific as an extraValues hook, so it gets the same
                   token vocabulary rather than a second, narrower one. */}}
            {{- $script = $script | replace "${TENANT_DOMAIN}"    $domain }}
            {{- $script = $script | replace "${TENANT_NAMESPACE}" $ns }}
            {{- $script = $script | replace "${TENANT_ID}"        $tenant }}
            {{- $script = $script | replace "${APP_ID}"           $app }}
            {{- $parts := splitList "." $activation.valuesPath }}
            {{- /* Append to whatever the app already puts at this path rather than
                   replacing it. Many charts expose a single lifecycle hook, and the app
                   is usually already using it — Nextcloud's before-starting installs the
                   portal-bridge SSO handler and hides the in-app header when embedded.
                   mergeOverwrite replaces a string outright, so writing ours on top
                   silently deleted the app's own setup and broke SSO and theming while
                   the addon activation itself looked like it worked. */}}
            {{- $existing := $extraVals }}
            {{- $found := true }}
            {{- range $k := $parts }}
            {{- if and $found (kindIs "map" $existing) (hasKey $existing $k) }}
            {{- $existing = index $existing $k }}
            {{- else }}
            {{- $found = false }}
            {{- end }}
            {{- end }}
            {{- if and $found (kindIs "string" $existing) (ne $existing "") }}
            {{- $script = printf "%s\n\n# --- appended by Gentian: addon activation ---\n%s" $existing $script }}
            {{- end }}
            {{- /* Fold the dotted values path into a nested dict from the inside out;
                   sprig has no set-nested-key, and a flat "a.b.c" key would be merged as
                   a literal key rather than a path. */}}
            {{- $node := $script }}
            {{- range $i := until (len $parts) }}
            {{- $node = dict (index $parts (sub (sub (len $parts) 1) $i)) $node }}
            {{- end }}
            {{- $extraVals = mergeOverwrite $extraVals $node }}
            {{- end }}
            {{- /* Match tenant kernel-access NetworkPolicy (gentianos.io/app selector). */}}
            {{- $podLabels := default dict (dig "podLabels" dict $extraVals) }}
            {{- $podLabels = mergeOverwrite $podLabels (dict "gentianos.io/app" $app "gentianos.io/tenant" $tenant) }}
            {{- $extraVals = mergeOverwrite $extraVals (dict "podLabels" $podLabels) }}

            {{- /* Bitnami charts expect imagePullSecrets as a string list. */}}
            {{- $rawImagePull := dig "imagePullSecrets" list $extraVals }}
            {{- $imagePull := list }}
            {{- range $entry := $rawImagePull }}
            {{- if kindIs "string" $entry }}
            {{- $imagePull = append $imagePull $entry }}
            {{- else if kindIs "map" $entry }}
            {{- $pullName := dig "name" "" $entry }}
            {{- if $pullName }}{{- $imagePull = append $imagePull $pullName }}{{- end }}
            {{- end }}
            {{- end }}
            {{- if eq (len $imagePull) 0 }}
            {{- $imagePull = list "registry-credentials" }}
            {{- end }}
            {{- /* The pull Secrets of the repositories this tenant declared, named
                 by the operator on the claim. After the cluster's own, by the
                 same two values, so a chart that takes one takes the other.
                 They are Secrets in this namespace; nothing here can name one
                 anywhere else. */}}
            {{- $pullSecrets := default dict $spec.pullSecrets }}
            {{- range $name := (default list $pullSecrets.images) }}
            {{- if not (has $name $imagePull) }}{{- $imagePull = append $imagePull $name }}{{- end }}
            {{- end }}
            {{- $profileMeta := default dict (dig "metadata" dict $profile) }}
            {{- $profileAnnos := default dict (dig "annotations" dict $profileMeta) }}
            {{- $standardPull := eq (dig "gentianos.io/standard-image-pull-secrets" "false" $profileAnnos) "true" }}
            {{- if $standardPull }}
            {{- $imagePullMaps := list }}
            {{- range $item := $imagePull }}
            {{- $imagePullMaps = append $imagePullMaps (dict "name" $item) }}
            {{- end }}
            {{- $extraVals = mergeOverwrite $extraVals (dict
                "imagePullSecrets" $imagePullMaps
                "global" (mergeOverwrite (dig "global" dict $extraVals) (dict "imagePullSecrets" $imagePullMaps))
            ) }}
            {{- else }}
            {{- $extraVals = mergeOverwrite $extraVals (dict
                "imagePullSecrets" $imagePull
                "global" (mergeOverwrite (dig "global" dict $extraVals) (dict "imagePullSecrets" $imagePull))
            ) }}
            {{- end }}

            {{- /* Any anchor a public CA did not sign has to be handed to the
                   workloads that validate kernel hostnames, or every in-cluster
                   TLS call to id.<kernel-domain> fails. ACME staging was the
                   first such anchor and for a while the only one this gate knew
                   about, so self-signed and private-ca clusters mounted nothing
                   and their apps could not reach the issuer they were told to
                   trust. certificates.trustAnchorSecret carries the answer for
                   all three: it names the secret, and is empty exactly when a
                   public CA signed and there is nothing to distribute. */}}
            {{- $acmeStaging := eq (dig "ACME_STAGING" "false" $ksCMData) "true" }}
            {{- /* certificates.trustAnchorSecret names where the anchor lives at
                 CLUSTER scope — cert-manager/gentian-root-ca-tls under self-signed
                 and private-ca. A pod cannot mount that: it is in another
                 namespace. The operator replicates the anchor into each namespace
                 under one fixed name, and that is what is mounted here.

                 Mounting the cluster-scope name was a bug that only a self-signed
                 or private-ca install would have shown: the operator wrote
                 gentian-trust-anchor-tls into the namespace while this asked for
                 gentian-root-ca-tls, and a volume naming a Secret that is not
                 there stops the pod from starting at all. */}}
            {{- $hasAnchor := or (dig "certificates.trustAnchorSecret" "" $ccData) $acmeStaging }}
            {{- $anchorSecret := "gentian-trust-anchor-tls" }}
            {{- if $hasAnchor }}
            {{- $krStaging := dig "requires" "services" dict $pSpec }}
            {{- $identityStaging := default dict $krStaging.identity }}
            {{- $oidcStaging := default dict $identityStaging.oidc }}
            {{- $stagingVol := dict
                "name" "kernel-trust-anchor"
                "secret" (dict "secretName" $anchorSecret)
            }}
            {{- $stagingMounts := list
                (dict "name" "kernel-trust-anchor" "mountPath" "/opt/gentian-trust-anchor" "readOnly" true)
            }}
            {{- $stagingEnv := list
                (dict "name" "REQUESTS_CA_BUNDLE" "value" "/opt/gentian-trust-anchor/ca.crt")
                (dict "name" "SSL_CERT_FILE" "value" "/opt/gentian-trust-anchor/ca.crt")
                (dict "name" "DENO_CERT" "value" "/opt/gentian-trust-anchor/ca.crt")
            }}
            {{- /* Charts that render env from values.environment need OIDC/truststore keys merged there too. */}}
            {{- /* ignore top-level extraEnvVars — merge staging CA paths there too. */}}
            {{- $stagingEnvironment := dict
                "REQUESTS_CA_BUNDLE" "/opt/gentian-trust-anchor/ca.crt"
                "SSL_CERT_FILE" "/opt/gentian-trust-anchor/ca.crt"
                "DENO_CERT" "/opt/gentian-trust-anchor/ca.crt"
            }}
            {{- $existingEnvironment := default dict (dig "environment" dict $extraVals) }}
            {{- $stagingJavaOpts := list
                "-Djavax.net.ssl.trustStore=/opt/gentian-trust-anchor/truststore.jks"
                "-Djavax.net.ssl.trustStoreType=JKS"
                "-Djavax.net.ssl.trustStorePassword=changeit"
            }}
            {{- $existingJavaOpts := default list (dig "javaOpts" list $extraVals) }}
            {{- $needsJavaTrust := or (gt (len $existingJavaOpts) 0) $oidcStaging.clientId }}
            {{- if $needsJavaTrust }}
            {{- range $opt := $stagingJavaOpts }}
            {{- if not (has $opt $existingJavaOpts) }}
            {{- $existingJavaOpts = append $existingJavaOpts $opt }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- $extraVals = mergeOverwrite $extraVals (dict
                "extraEnvVars" (concat (default list (dig "extraEnvVars" list $extraVals)) $stagingEnv)
                "environment" (mergeOverwrite $existingEnvironment $stagingEnvironment)
                "extraVolumes" (concat (default list (dig "extraVolumes" list $extraVals)) (list $stagingVol))
                "extraVolumeMounts" (concat (default list (dig "extraVolumeMounts" list $extraVals)) $stagingMounts)
            ) }}
            {{- /* Charts that do not use the extraVolumes/extraVolumeMounts convention
                   name their own keys in valueMapping.volumes. Written in addition to
                   the conventional keys above, never instead: an unrecognised value is
                   inert, so declaring this cannot remove a mount the chart already got. */}}
            {{- $volMap := dig "volumes" dict $vm }}
            {{- $volWrites := list }}
            {{- if $volMap.volumesPath }}
            {{- $volWrites = append $volWrites (dict "path" $volMap.volumesPath "add" (list $stagingVol)) }}
            {{- end }}
            {{- if $volMap.volumeMountsPath }}
            {{- $volWrites = append $volWrites (dict "path" $volMap.volumeMountsPath "add" $stagingMounts) }}
            {{- end }}
            {{- range $w := $volWrites }}
            {{- $parts := splitList "." $w.path }}
            {{- /* Read whatever is already at the path; sprig dig cannot take a
                   dynamic key list, so walk it. */}}
            {{- $node := $extraVals }}
            {{- $found := true }}
            {{- range $k := $parts }}
            {{- if and $found (kindIs "map" $node) (hasKey $node $k) }}
            {{- $node = index $node $k }}
            {{- else }}
            {{- $found = false }}
            {{- end }}
            {{- end }}
            {{- $existing := list }}
            {{- if and $found (kindIs "slice" $node) }}
            {{- $existing = $node }}
            {{- end }}
            {{- /* Fold the dotted path back into a nested dict from the inside out. */}}
            {{- $built := concat $existing $w.add }}
            {{- range $i := until (len $parts) }}
            {{- $built = dict (index $parts (sub (sub (len $parts) 1) $i)) $built }}
            {{- end }}
            {{- $extraVals = mergeOverwrite $extraVals $built }}
            {{- end }}
            {{- if $needsJavaTrust }}
            {{- $extraVals = mergeOverwrite $extraVals (dict "javaOpts" $existingJavaOpts) }}
            {{- end }}
            {{- end }}

            {{- /* ── Emit Keycloak Client CR ──────────────────────────────────── */}}
            {{- /* When requires.services.identity.oidc is set, the composition    */}}
            {{- /* registers the app as an OIDC client in the tenant's own realm.  */}}
            {{- /* A new app only needs to declare its oidc block in the profile    */}}
            {{- /* to get automatic per-tenant Keycloak client registration.        */}}
            {{- $kr       := dig "requires" "services" dict $pSpec }}
            {{- $identity := default dict $kr.identity }}
            {{- /* Outside the OIDC block on purpose: an entitlement group is per
                 APP, not per OIDC client. The groups Job makes one either way, and
                 a profile with no oidc block still has one — so a group rendered
                 inside that conditional silently skipped it. */}}
            {{- $entGroup := printf "gentian:tenant:%s:app:%s" $tenant $app | lower | replace ":" "-" | replace "_" "-" | replace "." "-" }}
            {{- /* The app's entitlement group.

                 Here rather than in tenant-default because its attributes come
                 from this profile's gentianos.io/keycloak-group-attributes
                 annotation, and only this Composition fetches the profile.
                 Nine of the catalogue's profiles carry one — the Odoo ones name
                 the modules and roles the app provisions from — so a Group
                 declared without them would strip what the groups Job sets.

                 Values are coerced to lists: Keycloak group attributes are
                 map[string][]string, and the annotation writes a bare string for
                 single values, exactly as collectGentianGroupsJSON normalises. */}}
            {{- $gAttrsRaw := dig "metadata" "annotations" "gentianos.io/keycloak-group-attributes" "" $profile }}
            {{- $gAttrs := dict }}
            {{- if $gAttrsRaw }}
            {{- range $k, $v := (fromJson $gAttrsRaw) }}
            {{- $_ := set $gAttrs $k (ternary $v (list (toString $v)) (kindIs "slice" $v)) }}
            {{- end }}
            {{- end }}
            ---
            apiVersion: group.keycloak.crossplane.io/v1alpha1
            kind: Group
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-entitlement-group
              name: {{ $entGroup }}
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                name: {{ printf "gentian:tenant:%s:app:%s" $tenant $app | quote }}
                {{- if $gAttrs }}
                attributes:
                  {{ toYaml $gAttrs | nindent 18 }}
                {{- end }}
              providerConfigRef:
                name: keycloak

            {{- $oidcCl   := default dict $identity.oidc }}
            {{- if $oidcCl.clientId }}
            {{- $oidcPackKey := default $oidcCl.clientId $oidcCl.oidcPackRef }}
            {{- $redirects  := list }}
            {{- range $uri := (default list $oidcCl.redirectUris) }}
            {{- $redirects = append $redirects ($uri | replace "${TENANT_DOMAIN}" $domain) }}
            {{- end }}
            {{- $postLogout := list }}
            {{- range $uri := (default list $oidcCl.postLogoutRedirectUris) }}
            {{- $postLogout = append $postLogout ($uri | replace "${TENANT_DOMAIN}" $domain) }}
            {{- end }}
            {{- /* provider-keycloak Client reads clientSecretSecretRef from this Secret;
                 it must match the OpenBao path XWiki consumes via ExternalSecret. */}}
            {{- if eq (default "PUBLIC" $oidcCl.accessType) "CONFIDENTIAL" }}
            {{- $oidcCredsPath := printf "gentian-os/tenants/%s/apps/%s/oidc" $tenant $app }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-oidc-client-creds-es
              name: {{ $xrName }}-oidc-client-creds-es
            spec:
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1
                  kind: ExternalSecret
                  metadata:
                    name: {{ $xrName }}-oidc-client-creds
                    namespace: {{ $provNs }}
                  spec:
                    refreshInterval: 1h
                    secretStoreRef:
                      kind: ClusterSecretStore
                      name: openbao
                    target:
                      name: {{ $xrName }}-oidc-client-creds
                      creationPolicy: Owner
                    data:
                      - secretKey: client-secret
                        remoteRef:
                          key: {{ $oidcCredsPath }}
                          property: client-secret
              providerConfigRef:
                name: kubernetes
            {{- end }}
            ---
            apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
            kind: Client
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-keycloak-client
              name: {{ $tenant }}-{{ $app }}-keycloak-client
            spec:
              deletionPolicy: Delete
              # Everything except LateInitialize. The default "*" includes it, and
              # this client has a second writer: the OIDC pack Job still configures
              # the same clientId ("client <id> configured" in its log).
              #
              # Late-init copies fields the provider observes but this template does
              # not set out of the live object and into spec.forProvider. With a Job
              # writing the same object, that means the Job's values silently become
              # this resource's declared intent. The portal BFF client is what that
              # looks like when it goes wrong: the copied-back fields were ones the
              # provider then refused to write, and it sat Synced=False, unable to
              # reconcile, while reading Ready=True.
              #
              # Nothing is known to be wrong here — the two writers agree today. This
              # is so that if they stop agreeing, the Composition still says what it
              # was written to say.
              managementPolicies: ["Observe", "Create", "Update", "Delete"]
              forProvider:
                clientId: {{ $oidcCl.clientId | quote }}
                name: {{ default $oidcCl.clientId $oidcCl.name | quote }}
                realmId: {{ $realm }}
                accessType: {{ default "PUBLIC" $oidcCl.accessType | quote }}
                standardFlowEnabled: true
                directAccessGrantsEnabled: {{ default false $oidcCl.directAccessGrantsEnabled }}
                serviceAccountsEnabled: false
                {{- if hasKey $oidcPackFullScopeAllowed $oidcPackKey }}
                fullScopeAllowed: {{ index $oidcPackFullScopeAllowed $oidcPackKey }}
                {{- end }}
                {{- if $redirects }}
                validRedirectUris:
                  {{ toYaml $redirects | nindent 18 }}
                {{- end }}
                webOrigins:
                  - "+"
                {{- if $postLogout }}
                validPostLogoutRedirectUris:
                  {{ toYaml $postLogout | nindent 18 }}
                {{- end }}
                {{- if and $oidcCl.backchannelLogoutUrl (ne $oidcCl.backchannelLogoutUrl "") }}
                backchannelLogoutUrl: {{ $oidcCl.backchannelLogoutUrl | replace "${TENANT_DOMAIN}" $domain | quote }}
                backchannelLogoutSessionRequired: true
                {{- end }}
                {{- if eq (default "PUBLIC" $oidcCl.accessType) "CONFIDENTIAL" }}
                clientSecretSecretRef:
                  name: {{ $xrName }}-oidc-client-creds
                  namespace: {{ $provNs }}
                  key: client-secret
                {{- end }}
              providerConfigRef:
                name: keycloak
            {{- if hasKey $oidcPackDefaultScopes $oidcPackKey }}
            ---
            apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
            kind: ClientDefaultScopes
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-keycloak-default-scopes
              name: {{ $tenant }}-{{ $app }}-keycloak-default-scopes
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                clientIdRef:
                  name: {{ $tenant }}-{{ $app }}-keycloak-client
                  policy:
                    resolve: Always
                defaultScopes:
                  {{ toYaml (index $oidcPackDefaultScopes $oidcPackKey) | nindent 18 }}
              providerConfigRef:
                name: keycloak
            {{- end }}

            {{- /* ── the client scope the pack describes, and its mappers ───────
                 Observed, not managed, for now. The OIDC pack Job still creates
                 both; this is the read-back that proves the provider resolves
                 them from the names the pack gives, before anything writes.

                 That check is the one the portal BFF client did not get: a Job
                 writes through the Admin API, which enforces less than the schema
                 the provider validates against, and the resource sat Synced=False
                 unable to reconcile while reading Ready=True.

                 serviceClient packs are skipped because they genuinely have none
                 of this — gentian-dovecot provisions a credential and nothing
                 else, and the Job's own validation rejects a serviceClient that
                 carries mappers. */}}
            {{- $pack := dig $oidcPackKey dict $oidcPacks }}
            {{- if and $pack.scopeName (not $pack.serviceClient) }}
            ---
            apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
            kind: ClientScope
            metadata:
              annotations:
                crossplane.io/external-name: {{ $pack.scopeName }}
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-keycloak-client-scope
              name: {{ $tenant }}-{{ $app }}-keycloak-client-scope
            spec:
              deletionPolicy: Orphan
              managementPolicies: ["Observe"]
              forProvider:
                realmId: {{ $realm }}
                name: {{ $pack.scopeName | quote }}
                description: {{ default "" $pack.scopeDescription | quote }}
              providerConfigRef:
                name: keycloak
            {{- /* The pack's protocol mappers, on the scope above.

                 These cannot be adopted. A Keycloak protocol mapper is identified
                 by its UUID, not its name, so crossplane.io/external-name set to
                 "email" fails with "observe failed: external resource does not
                 exist" — where the ClientScope above adopts from its name without
                 trouble. No external-name is set here, so Crossplane creates them
                 and records the UUID it gets back.

                 While the OIDC pack Job still makes the same mappers, these
                 creates are expected to fail: Keycloak rejects a second mapper of
                 the same name on one scope. That is the safe way round — the
                 existing mapper keeps working and the resource reports the
                 conflict, rather than a duplicate quietly emitting a claim twice.
                 They converge when the Job stops making them and the originals
                 are removed. */}}
            {{- /* The observed ClientScope's Keycloak id. Empty until Crossplane
                 has observed it once, and the mappers simply do not render until
                 then rather than rendering against a name. */}}
            {{- $scopeID := dig "resources" (printf "%s-keycloak-client-scope" $app) "resource" "status" "atProvider" "id" "" $observed }}
            {{- range $mapperName := (default list $pack.mappers) }}
            {{- $tmpl := dig $mapperName dict $oidcMapperTemplates }}
            {{- if and $tmpl.protocolMapper $scopeID }}
            {{- /* keycloakName exists because some catalogues name a mapper
                 differently in Keycloak than in the pack — "full name" against
                 full_name. The Keycloak name identifies the object; the slug only
                 has to be a valid RFC 1123 object name. */}}
            {{- $kcName := default $mapperName $tmpl.keycloakName }}
            {{- $slug := $mapperName | lower | replace "_" "-" | replace " " "-" | replace "." "-" }}
            ---
            apiVersion: client.keycloak.crossplane.io/v1alpha1
            kind: ProtocolMapper
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-scope-mapper-{{ $slug }}
              name: {{ $tenant }}-{{ $app }}-scope-mapper-{{ $slug }}
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                name: {{ $kcName | quote }}
                protocol: openid-connect
                protocolMapper: {{ $tmpl.protocolMapper | quote }}
                {{- /* The scope's real id, read off the observed ClientScope.

                     Not clientScopeIdRef: a Crossplane reference resolves to the
                     referenced resource's external-name, and the ClientScope is
                     adopted by name, so the ref handed the provider
                     "gentian-<app>-scope" where Keycloak's API path needs a UUID.
                     The create failed with a 404 on
                     /client-scopes/gentian-<app>-scope/protocol-mappers/models
                     before it ever reached Keycloak's duplicate check. */}}
                clientScopeId: {{ $scopeID }}
                {{- /* multivalued defaults in for attribute mappers, exactly as
                     buildOIDCPackScript does. The catalogue templates leave it out
                     and Keycloak treats its absence as false, so this changes
                     nothing — but without it the Composition and the Job disagree
                     about one key, and each would strip what the other set on
                     every pass. Observed doing precisely that: adopting the
                     mappers removed multivalued from two of them. */}}
                {{- $cfg := default dict $tmpl.config }}
                {{- if and (eq $tmpl.protocolMapper "oidc-usermodel-attribute-mapper") (not (hasKey $cfg "multivalued")) }}
                {{- $cfg = merge (dict "multivalued" "false") $cfg }}
                {{- end }}
                {{- /* introspection.token.claim is the same class of key, and it
                     bites harder. Keycloak writes it into every mapper it stores
                     whether or not it was asked for, so a config that omits it
                     never matches what comes back. The provider reads the extra
                     key as drift, updates to remove it, Keycloak puts it back,
                     and the pair never converge — an update loop that costs a
                     Keycloak API call and a fresh admin password grant each time
                     round. Observed at roughly twenty requests a second, holding
                     28k connections open and a full CPU core, on six resources.

                     Defaulted rather than forced: a catalogue template that sets
                     it explicitly keeps its own value. */}}
                {{- if not (hasKey $cfg "introspection.token.claim") }}
                {{- $cfg = merge (dict "introspection.token.claim" "true") $cfg }}
                {{- end }}
                config:
                  {{ toYaml $cfg | nindent 18 }}
              providerConfigRef:
                name: keycloak
            {{- end }}
            {{- end }}

            {{- /* The client role the entitlement group is granted.

                 clientIdRef resolves here where clientScopeIdRef did not: the
                 composed Client is managed, so the provider normalised its
                 external-name to the Keycloak id, and the reference yields that
                 id rather than a name.

                 resolve: Always because that normalisation holds only while the
                 client keeps the id it was created with. The default,
                 IfNotPresent, writes the resolved id into
                 spec.forProvider.clientId and never looks again; a client
                 recreated under a new id leaves the reference naming a dead one,
                 and the role 404s on every reconcile with no path back.

                 No external-name, as with the mappers — a role is identified by
                 its UUID, and the provider resolves the existing one from the
                 client and name it is given. */}}
            {{- if $pack.clientRole }}
            ---
            apiVersion: role.keycloak.crossplane.io/v1alpha1
            kind: Role
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-client-role
              name: {{ $tenant }}-{{ $app }}-client-role
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                clientIdRef:
                  name: {{ $tenant }}-{{ $app }}-keycloak-client
                  policy:
                    resolve: Always
                name: {{ $pack.clientRole | quote }}
              providerConfigRef:
                name: keycloak
            {{- end }}

            {{- /* The entitlement group's grant of that client role.

                 Both refs resolve to Keycloak ids because both targets are
                 managed and their external-names are already ids — the Group is
                 composed by tenant-default, and a Crossplane reference finds a
                 managed resource by name wherever it was composed.

                 exhaustive: false, matching the Job, which adds the mapping and
                 leaves anything else on the group alone. True would make this
                 resource the group's entire role list and strip whatever it did
                 not name. */}}
            {{- if $pack.clientRole }}
            ---
            apiVersion: group.keycloak.crossplane.io/v1alpha1
            kind: Roles
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-group-roles
              name: {{ $tenant }}-{{ $app }}-group-roles
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                exhaustive: false
                groupIdRef:
                  name: {{ $entGroup }}
                roleIdsRefs:
                  - name: {{ $tenant }}-{{ $app }}-client-role
              providerConfigRef:
                name: keycloak
            {{- end }}
            {{- end }}
            {{- end }}

            {{- /* ── Emit ExternalSecret (only when there are secrets to sync) ── */}}
            {{- if gt (len $esData) 0 }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-externalsecret
              name: {{ $xrName }}-es
            spec:
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1
                  kind: ExternalSecret
                  metadata:
                    name: {{ $secretName }}
                    namespace: {{ $ns }}
                  spec:
                    refreshInterval: 1h
                    secretStoreRef:
                      kind: ClusterSecretStore
                      name: openbao
                    target:
                      name: {{ $secretName }}
                      creationPolicy: Owner
                      deletionPolicy: Retain
                    data:
                      {{ toYaml $esData | nindent 22 }}
              providerConfigRef:
                name: kubernetes
            {{- end }}

            {{- /* Copy optional portal-bridge SSO helper into the tenant namespace. */}}
            {{- $portalSsoRes := dig "portalBridgeSso" list $extraRes }}
            {{- if gt (len $portalSsoRes) 0 }}
            {{- $ssoCM := index $portalSsoRes 0 }}
            {{- $ssoData := dig "data" dict $ssoCM }}
            {{- if gt (len $ssoData) 0 }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-portal-bridge-sso-cm
              name: {{ $xrName }}-portal-bridge-sso-cm
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: {{ $app }}-portal-bridge-sso
                    namespace: {{ $ns }}
                  data:
                    {{ toYaml $ssoData | nindent 20 }}
              providerConfigRef:
                name: kubernetes
            {{- end }}
            {{- end }}

            {{- /* Canonicalize extraVals so Helm values hashing is stable across reconciles */}}
            {{- $extraVals = $extraVals | toJson | fromJson }}

            {{- /* ── Emit Helm Release ────────────────────────────────────────── */}}
            {{- /* ── Uninstalling keeps the app's files ───────────────────────── */}}
            {{- /* A chart that templates a PersistentVolumeClaim has it deleted by
                 `helm uninstall` with everything else in the release, and with it
                 the files the app wrote. Uninstalling an app takes its workloads
                 away and keeps its data; destroying the data is a purge, a
                 separate act. So every claim a release renders is marked for Helm
                 to leave in place.

                 Done here, for every chart, as a patch the provider applies to
                 what the chart rendered (forProvider.patchesFrom, a Kustomize
                 patch run as Helm's post-renderer). The annotation is therefore
                 part of the manifest Helm records, which is what `helm uninstall`
                 reads to decide what to leave. No chart has to carry it, and one
                 that already does is unchanged.

                 A claim kept this way still names this release, which is why the
                 release name above is stable: the next install of the app in this
                 tenant takes the claim over instead of failing on it.

                 The target names no object, so it matches every claim; the name
                 inside the patch is required by the format and is not applied. A
                 chart that renders no claim is rendered unchanged. Claims made
                 from a StatefulSet's volumeClaimTemplates are not in the release
                 at all and were always left behind. */}}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-keep-volumes
              name: {{ $xrName }}-keep-volumes
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: {{ $keepVolumes }}
                    namespace: {{ $ns }}
                  data:
                    patch.yaml: |
                      patches:
                        - target:
                            version: v1
                            kind: PersistentVolumeClaim
                          patch: |-
                            apiVersion: v1
                            kind: PersistentVolumeClaim
                            metadata:
                              name: every-claim-of-the-release
                              annotations:
                                helm.sh/resource-policy: keep
              providerConfigRef:
                name: kubernetes
            ---
            apiVersion: helm.crossplane.io/v1beta1
            kind: Release
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-release
                # The Helm release name. Without it the provider uses this
                # object's name, generated suffix and all.
                crossplane.io/external-name: {{ $release }}
              name: {{ $xrName }}-release
            spec:
              rollbackLimit: 3
              forProvider:
                chart:
                  repository: {{ $chart.repository }}
                  name: {{ $chart.name }}
                  version: {{ $chart.version | quote }}
                  {{- /* A chart inside a repository the tenant declared is pulled
                       with that repository's credential. The namespace is this
                       app's own and is not taken from the claim. */}}
                  {{- range $c := (default list $pullSecrets.charts) }}
                  {{- if eq $c.repository $chart.repository }}
                  pullSecretRef:
                    name: {{ $c.secretName }}
                    namespace: {{ $ns }}
                  {{- end }}
                  {{- end }}
                namespace: {{ $ns }}
                # Wait for the release's workloads, not just for Helm to have
                # applied the manifests.
                #
                # With wait: false the Release goes Ready the moment the objects
                # exist, so an App whose pods can never schedule still reports
                # Ready=True -- and function-auto-ready then marks the XR Ready,
                # and the Tenant says "All App claims are Ready". Odoo sat like
                # that for hours: its modules PVC asked for a StorageClass the
                # cluster does not have, three pods were Pending the whole time,
                # and every signal above them was green.
                #
                # The kernel's own releases (infra-data, suze) have always waited.
                # Apps are what a tenant actually sees, so a false green matters
                # more here, not less.
                #
                # 10m rather than infra-data's 5m: an app's first boot can include
                # schema migration or module installation. On timeout the Release
                # reports not-ready and says so, which is the outcome being asked
                # for -- a wrong answer arriving quickly is worse than a right one
                # arriving late.
                wait: true
                waitTimeout: "10m"
                skipCRDs: true
                # Not optional: a release that could not read the rule would be
                # installed without it, and uninstalling it would delete files.
                patchesFrom:
                  - configMapKeyRef:
                      name: {{ $keepVolumes }}
                      namespace: {{ $ns }}
                      key: patch.yaml
                      optional: false
                {{- if gt (len $extraVals) 0 }}
                values:
                  {{ toYaml $extraVals | nindent 18 }}
                {{- end }}
                {{- if gt (len $relSet) 0 }}
                set:
                  {{ toYaml $relSet | nindent 18 }}
                {{- end }}
              providerConfigRef:
                name: kubernetes

            {{- /* ── Emit stable service alias ─────────────────────────────────── */}}
            {{- /* The chart creates services named <app>-release-<component>.      */}}
            {{- /* We emit a stable ClusterIP Service with the declared name so the */}}
            {{- /* tenant operator ingress backend always resolves correctly.        */}}
            {{- /* Skip when fullnameOverride == serviceName: the chart already      */}}
            {{- /* creates a Service with the correct name, so emitting our own      */}}
            {{- /* Object with the same name would conflict with Helm ownership.     */}}
            {{- /* This is the one read AD-4 did not simply move. AppProfile had a
                 single spec.ingress with serviceName and servicePort;
                 ComponentProfile has a list of exposures, each naming the Service
                 it routes to. The gateway entry is the one that needs an alias,
                 because it is the one the edge resolves -- a perimeter entry is
                 reached through the tenant DMZ's proxy and never by this name.
                 The FIRST gateway entry, because the alias is one Service and
                 a profile publishing several on one backend names the same one. */}}
            {{- $backend := dict }}
            {{- range $e := (dig "expose" list $pSpec) }}
              {{- if and (eq (dig "surface" "" $e) "gateway") (not $backend.service) }}
                {{- $backend = dig "backend" dict $e }}
              {{- end }}
            {{- end }}
            {{- $stableSvcName  := dig "service" "" $backend }}
            {{- $fullnameOverride := dig "fullnameOverride" "" $extraVals }}
            {{- if and $stableSvcName (ne $stableSvcName $fullnameOverride) }}
            {{- $component := trimPrefix (printf "%s-" $app) $stableSvcName }}
            {{- $svcPort   := default 80 (dig "port" 0 $backend | int) }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-stable-svc
              name: {{ $xrName }}-stable-svc
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Service
                  metadata:
                    name: {{ $stableSvcName }}
                    namespace: {{ $ns }}
                  spec:
                    selector:
                      app.kubernetes.io/instance: {{ $release }}
                      app.kubernetes.io/component: {{ $component }}
                    ports:
                    - name: http
                      port: {{ $svcPort }}
                      targetPort: {{ $svcPort }}
                      protocol: TCP
              providerConfigRef:
                name: kubernetes
            {{- /* Stable alias for companion API service (e.g. app-store-api). */}}
            {{- $apiSvcName := printf "%s-api" $app }}
            {{- $apiSvcPort := 8000 }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-api-stable-svc
              name: {{ $xrName }}-api-stable-svc
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Service
                  metadata:
                    name: {{ $apiSvcName }}
                    namespace: {{ $ns }}
                  spec:
                    selector:
                      app.kubernetes.io/instance: {{ $release }}
                      app.kubernetes.io/component: api
                    ports:
                    - name: http
                      port: {{ $apiSvcPort }}
                      targetPort: {{ $apiSvcPort }}
                      protocol: TCP
              providerConfigRef:
                name: kubernetes
            {{- end }}

            {{- /* ── Emit post-install bootstrap Job ─────────────────────────────── */}}
            {{- /* spec.hooks.postInstall: app-specific bootstrap that must           */}}
            {{- /* happen via the app's own admin API rather than Helm values. Job is */}}
            {{- /* retried via ttlSecondsAfterFinished + reconcile, so Script must be */}}
            {{- /* idempotent and exit non-zero if a dependency isn't ready yet. See */}}
            {{- /* app-profile-guide.md, "Post-install bootstrap jobs".               */}}
            {{- $pij := dig "hooks" "postInstall" dict $pSpec }}
            {{- $pijImage := dig "image" "" $pij }}
            {{- if $pijImage }}
            {{- $pijScript := dig "script" "" $pij }}
            {{- /* Same token vocabulary as extraValues and addonActivation.script.
                   A post-install script is exactly as app-specific as those, and
                   without this pass a ${TENANT_DOMAIN} written in a profile reaches
                   the container as literal text — the failure addonActivation.script
                   already records above, where the token arrived unsubstituted and
                   `set -u` killed the pod on every start. */}}
            {{- $pijScript = $pijScript | replace "${TENANT_DOMAIN}"    $domain }}
            {{- $pijScript = $pijScript | replace "${TENANT_NAMESPACE}" $ns }}
            {{- $pijScript = $pijScript | replace "${TENANT_ID}"        $tenant }}
            {{- $pijScript = $pijScript | replace "${APP_ID}"           $app }}
            {{- $pijEnvFrom := dig "envFrom" list $pij }}
            {{- $pijSA := dig "serviceAccountName" "" $pij }}
            {{- $pijPVC := dig "readOnlyPVC" dict $pij }}
            {{- $pijPVCClaim := dig "claimName" "" $pijPVC }}
            {{- $pijPVCMount := dig "mountPath" "" $pijPVC }}

            {{- /* ── Individual secretKeyRef env vars for postInstallJob ─────────── */}}
            {{- /* envFrom (above) injects a whole Secret's keys as env vars, but    */}}
            {{- /* Kubernetes silently drops any key that is not a valid C_IDENTIFIER */}}
            {{- /* — which every hyphenated db, oidc, s3, etc. key here is. A         */}}
            {{- /* bootstrap script that needs its own app's database or OIDC client  */}}
            {{- /* credentials (e.g. to call `manage.py createsuperuser` before any   */}}
            {{- /* HTTP API exists to talk to) has no other way to reach them. These   */}}
            {{- /* fixed, documented names are a stable contract for postInstallJob    */}}
            {{- /* scripts, independent of whatever Helm value path a profile's        */}}
            {{- /* valueMapping happens to set for the Release itself.                 */}}
            {{- $pijEnv := list }}
            {{- if $vm.database }}
            {{- if $vm.database.hostKey }}{{ $pijEnv = append $pijEnv (dict "name" "DB_HOST" "key" "db-host") }}{{ end }}
            {{- if $vm.database.portKey }}{{ $pijEnv = append $pijEnv (dict "name" "DB_PORT" "key" "db-port") }}{{ end }}
            {{- if $vm.database.nameKey }}{{ $pijEnv = append $pijEnv (dict "name" "DB_NAME" "key" "db-name") }}{{ end }}
            {{- if $vm.database.userKey }}{{ $pijEnv = append $pijEnv (dict "name" "DB_USER" "key" "db-user") }}{{ end }}
            {{- if $vm.database.passwordKey }}{{ $pijEnv = append $pijEnv (dict "name" "DB_PASSWORD" "key" "db-password") }}{{ end }}
            {{- end }}
            {{- if $vm.oidc }}
            {{- if $vm.oidc.issuerKey }}{{ $pijEnv = append $pijEnv (dict "name" "OIDC_ISSUER" "key" "oidc-issuer") }}{{ end }}
            {{- if $vm.oidc.clientIdKey }}{{ $pijEnv = append $pijEnv (dict "name" "OIDC_CLIENT_ID" "key" "oidc-client-id") }}{{ end }}
            {{- if $vm.oidc.clientSecretKey }}{{ $pijEnv = append $pijEnv (dict "name" "OIDC_CLIENT_SECRET" "key" "oidc-client-secret") }}{{ end }}
            {{- end }}
            {{- if $vm.s3 }}
            {{- if $vm.s3.endpointKey }}{{ $pijEnv = append $pijEnv (dict "name" "S3_ENDPOINT" "key" "s3-endpoint") }}{{ end }}
            {{- if $vm.s3.bucketKey }}{{ $pijEnv = append $pijEnv (dict "name" "S3_BUCKET" "key" "s3-bucket") }}{{ end }}
            {{- if $vm.s3.accessKeyKey }}{{ $pijEnv = append $pijEnv (dict "name" "S3_ACCESS_KEY" "key" "s3-access-key") }}{{ end }}
            {{- if $vm.s3.secretKeyKey }}{{ $pijEnv = append $pijEnv (dict "name" "S3_SECRET_KEY" "key" "s3-secret-key") }}{{ end }}
            {{- if $vm.s3.regionKey }}{{ $pijEnv = append $pijEnv (dict "name" "S3_REGION" "key" "s3-region") }}{{ end }}
            {{- end }}
            {{- if $vm.cache }}
            {{- if $vm.cache.hostKey }}{{ $pijEnv = append $pijEnv (dict "name" "CACHE_HOST" "key" "cache-host") }}{{ end }}
            {{- if $vm.cache.portKey }}{{ $pijEnv = append $pijEnv (dict "name" "CACHE_PORT" "key" "cache-port") }}{{ end }}
            {{- if $vm.cache.userKey }}{{ $pijEnv = append $pijEnv (dict "name" "CACHE_USER" "key" "cache-user") }}{{ end }}
            {{- if $vm.cache.passwordKey }}{{ $pijEnv = append $pijEnv (dict "name" "CACHE_PASSWORD" "key" "cache-password") }}{{ end }}
            {{- end }}
            {{- if and $vm.llm $llmDeclared }}
            {{- if $vm.llm.baseUrlKey }}{{ $pijEnv = append $pijEnv (dict "name" "LLM_BASE_URL" "key" "llm-base-url") }}{{ end }}
            {{- if $vm.llm.apiKeyKey }}{{ $pijEnv = append $pijEnv (dict "name" "LLM_API_KEY" "key" "llm-api-key") }}{{ end }}
            {{- end }}
            {{- if $vm.smtp }}
            {{- if $vm.smtp.hostKey }}{{ $pijEnv = append $pijEnv (dict "name" "SMTP_HOST" "key" "smtp-host") }}{{ end }}
            {{- if $vm.smtp.portKey }}{{ $pijEnv = append $pijEnv (dict "name" "SMTP_PORT" "key" "smtp-port") }}{{ end }}
            {{- if $vm.smtp.userKey }}{{ $pijEnv = append $pijEnv (dict "name" "SMTP_USER" "key" "smtp-user") }}{{ end }}
            {{- if $vm.smtp.passwordKey }}{{ $pijEnv = append $pijEnv (dict "name" "SMTP_PASSWORD" "key" "smtp-password") }}{{ end }}
            {{- end }}
            {{- if $vm.imap }}
            {{- if $vm.imap.hostKey }}{{ $pijEnv = append $pijEnv (dict "name" "IMAP_HOST" "key" "imap-host") }}{{ end }}
            {{- if $vm.imap.portKey }}{{ $pijEnv = append $pijEnv (dict "name" "IMAP_PORT" "key" "imap-port") }}{{ end }}
            {{- end }}
            {{- /* appSecrets: env var name is the declared name, upper-cased. */}}
            {{- range $s := $appSecrets }}
            {{- if $s.name }}
            {{- $pijEnv = append $pijEnv (dict "name" (upper $s.name) "key" (printf "internal-%s" $s.name)) }}
            {{- end }}
            {{- end }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-post-install-cm
              name: {{ $xrName }}-post-install-cm
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: {{ $app }}-post-install
                    namespace: {{ $ns }}
                  data:
                    run.sh: |
                      {{- $pijScript | nindent 22 }}
              providerConfigRef:
                name: kubernetes
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-post-install-job
              name: {{ $xrName }}-post-install-job
            spec:
              forProvider:
                manifest:
                  apiVersion: batch/v1
                  kind: Job
                  metadata:
                    name: {{ $app }}-post-install
                    namespace: {{ $ns }}
                    labels:
                      app.kubernetes.io/managed-by: gentian-os
                      gentianos.io/tenant: {{ $tenant }}
                      gentianos.io/app: {{ $app }}
                  spec:
                    ttlSecondsAfterFinished: 600
                    backoffLimit: 10
                    template:
                      metadata:
                        labels:
                          app.kubernetes.io/managed-by: gentian-os
                          gentianos.io/tenant: {{ $tenant }}
                          gentianos.io/app: {{ $app }}
                          gentianos.io/component: post-install
                      spec:
                        {{- if $pijSA }}
                        serviceAccountName: {{ $pijSA }}
                        {{- end }}
                        restartPolicy: OnFailure
                        {{- if $pijPVCClaim }}
                        {{- /* Run where the volume already is.

                             readOnlyPVC mounts the app's OWN claim, and an app's
                             claim is ReadWriteOnce on every StorageClass this
                             platform installs — csi-cinder-sc-retain included. A
                             ReadWriteOnce volume attaches to one node, so a Job
                             scheduled onto the other node cannot mount it. The pod
                             does not fail: it sits in ContainerCreating, which no
                             backoffLimit bounds and no reconcile clears, so the
                             bootstrap never runs and nothing reports an error.

                             That is not theoretical. On ifk-w4h both tenants lost
                             the coin flip and their open-webui post-install sat
                             wedged for six days, so the tenant administrator was
                             never seeded in either.

                             Required, not preferred: preferred would schedule
                             anywhere when the app pod is briefly unschedulable and
                             wedge exactly as before. Unsatisfiable leaves the Job
                             Pending instead — visible, and retried by the scheduler
                             the moment the app pod is running.

                             Matched on the platform's own labels, which the
                             operator puts on every app workload, so this does not
                             depend on what an upstream chart happens to label its
                             pods. The component exclusion keeps a previous
                             post-install pod from being the thing anchored to. */}}
                        affinity:
                          podAffinity:
                            requiredDuringSchedulingIgnoredDuringExecution:
                              - topologyKey: kubernetes.io/hostname
                                labelSelector:
                                  matchLabels:
                                    gentianos.io/tenant: {{ $tenant }}
                                    gentianos.io/app: {{ $app }}
                                  matchExpressions:
                                    - key: gentianos.io/component
                                      operator: NotIn
                                      values:
                                        - post-install
                        {{- end }}
                        securityContext:
                          seccompProfile:
                            type: RuntimeDefault
                        volumes:
                          - name: scripts
                            configMap:
                              name: {{ $app }}-post-install
                          {{- if $pijPVCClaim }}
                          - name: readonly-data
                            persistentVolumeClaim:
                              claimName: {{ $pijPVCClaim }}
                              readOnly: true
                          {{- end }}
                        containers:
                          - name: post-install
                            image: {{ $pijImage | quote }}
                            securityContext:
                              allowPrivilegeEscalation: false
                              capabilities:
                                drop:
                                  - ALL
                              seccompProfile:
                                type: RuntimeDefault
                            command:
                              - /bin/sh
                              - /scripts/run.sh
                            volumeMounts:
                              - name: scripts
                                mountPath: /scripts
                              {{- if $pijPVCClaim }}
                              - name: readonly-data
                                mountPath: {{ $pijPVCMount }}
                                readOnly: true
                              {{- end }}
                            {{- if gt (len $pijEnv) 0 }}
                            env:
                              {{- range $e := $pijEnv }}
                              - name: {{ $e.name }}
                                valueFrom:
                                  secretKeyRef:
                                    name: {{ $secretName }}
                                    key: {{ $e.key }}
                              {{- end }}
                            {{- end }}
                            {{- if gt (len $pijEnvFrom) 0 }}
                            envFrom:
                              {{- range $secretRefName := $pijEnvFrom }}
                              - secretRef:
                                  name: {{ $secretRefName }}
                              {{- end }}
                            {{- end }}
              providerConfigRef:
                name: kubernetes
            {{- end }}

            {{- /* ── Emit sidecars (spec.extensions) ─────────────────────────────── */}}
            {{- /* Each sidecar is its own Helm Release, deployed into the same       */}}
            {{- /* tenant namespace as the primary app, with its own appSecrets       */}}
            {{- /* synced from OpenBao at the SidecarAppName-scoped path              */}}
            {{- /* ({parent}-{sidecar}, matching api/v1alpha1.SidecarAppName -- OIDC  */}}
            {{- /* client registration and OpenBao secret purge on uninstall already   */}}
            {{- /* key off this same synthetic name). KernelRequirements beyond OIDC   */}}
            {{- /* (already handled independently by oidc_pack_jobs.go) are not wired  */}}
            {{- /* into the sidecar's own Release values yet -- a sidecar that needs   */}}
            {{- /* its own database/cache/S3 isn't supported by this mechanism yet.    */}}
            {{- /* extensions on ComponentProfile: the same sidecar list under the
                 name that also covers what is not strictly a sidecar. */}}
            {{- $sidecars := dig "extensions" list $pSpec }}
            {{- range $sc := $sidecars }}
            {{- if and $sc.name $sc.chart.name }}
            {{- $scKey := printf "%s-%s" $app $sc.name }}
            {{- $scAppSecrets := default list $sc.appSecrets }}
            {{- $scSecretName := printf "%s-sensitive-values" $scKey }}
            {{- $scEsData := list }}
            {{- $scRelSet := list }}
            {{- range $s := $scAppSecrets }}
            {{- if and $s.name $s.valuePath }}
            {{- $scInternalPath := printf "gentian-os/tenants/%s/apps/%s/internal/%s" $tenant $scKey $s.name }}
            {{- $scEsData = append $scEsData (dict "secretKey" (printf "internal-%s" $s.name)
                "remoteRef" (dict "key" $scInternalPath "property" "value")) }}
            {{- $scRelSet = append $scRelSet (dict "name" $s.valuePath
                "valueFrom" (dict "secretKeyRef" (dict "name" $scSecretName "namespace" $ns "key" (printf "internal-%s" $s.name)))) }}
            {{- end }}
            {{- end }}

            {{- /* OpenBao KV seeders for each sidecar appSecret (mirrors the primary   */}}
            {{- /* app's own seeder block above -- deterministic seed, write-once).     */}}
            {{- range $s := $scAppSecrets }}
            {{- if and $s.name $s.valuePath }}
            {{- $scSafeName := $s.name | replace "_" "-" }}
            {{- $scSeedName := printf "%s-%s-%s-seed" $xrName $sc.name $scSafeName }}
            {{- $scKvPath   := printf "gentian-os/tenants/%s/apps/%s/internal/%s" $tenant $scKey $s.name }}
            {{- $scSeedVal  := sha256sum (printf "%s:%s:%s" $xrName $scKey $s.name) }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-{{ $sc.name }}-{{ $scSafeName }}-seed-secret
              name: {{ $scSeedName }}
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: {{ $scSeedName }}
                    namespace: {{ $provNs }}
                  type: Opaque
                  stringData:
                    data.json: '{"value":"{{ $scSeedVal }}"}'
              providerConfigRef:
                name: kubernetes
            ---
            apiVersion: kv.vault.upbound.io/v1alpha1
            kind: SecretV2
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-{{ $sc.name }}-{{ $scSafeName }}-kv
                # Same reasoning as the primary app's secrets above: identify
                # the resource by its KV path so a reinstall observes the
                # existing value instead of overwriting it.
                crossplane.io/external-name: secret/data/{{ $scKvPath }}
              name: {{ $scSeedName }}-kv
            spec:
              deletionPolicy: Orphan
              managementPolicies:
                - Observe
                - Create
              forProvider:
                mount: secret
                name: {{ $scKvPath }}
                dataJsonSecretRef:
                  name: {{ $scSeedName }}
                  namespace: {{ $provNs }}
                  key: data.json
              providerConfigRef:
                name: openbao
            {{- end }}
            {{- end }}

            {{- if gt (len $scEsData) 0 }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-{{ $sc.name }}-externalsecret
              name: {{ $xrName }}-{{ $sc.name }}-es
            spec:
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1
                  kind: ExternalSecret
                  metadata:
                    name: {{ $scSecretName }}
                    namespace: {{ $ns }}
                  spec:
                    refreshInterval: 1h
                    secretStoreRef:
                      kind: ClusterSecretStore
                      name: openbao
                    target:
                      name: {{ $scSecretName }}
                      creationPolicy: Owner
                      deletionPolicy: Retain
                    data:
                      {{ toYaml $scEsData | nindent 22 }}
              providerConfigRef:
                name: kubernetes
            {{- end }}

            {{- /* Sidecar extraValues -- substitutes the tenant-identity placeholders */}}
            {{- /* a companion service most plausibly needs; not the full kernel-       */}}
            {{- /* endpoint substitution list the primary app gets (see above) -- a     */}}
            {{- /* sidecar that needs kernel service discovery isn't supported yet.     */}}
            {{- $scExtraVals := dict }}
            {{- if $sc.extraValues }}
            {{- $scRaw := $sc.extraValues | toJson }}
            {{- $scRaw = $scRaw | replace "${TENANT_DOMAIN}"    $domain }}
            {{- $scRaw = $scRaw | replace "${TENANT_NAMESPACE}" $ns }}
            {{- $scRaw = $scRaw | replace "${TENANT_ID}"        $tenant }}
            {{- $scRaw = $scRaw | replace "${APP_ID}"           $app }}
            {{- $scRaw = $scRaw | replace "${SIDECAR_ID}"       $sc.name }}
            {{- if $kernelDomain }}{{ $scRaw = $scRaw | replace "${KERNEL_DOMAIN}" $kernelDomain }}{{ end }}
            {{- /* No endpoint substitutions here either — see the note above the
            app's own extraValues block. A sidecar reaches its dependencies the
            same way its app does. */}}
            {{- if $nodeIP      }}{{ $scRaw = $scRaw | replace "${NODE_IP}"       $nodeIP      }}{{ end }}
            {{- $scExtraVals = $scRaw | fromJson }}
            {{- end }}
            {{- $scExtraVals = $scExtraVals | toJson | fromJson }}
            {{- /* The same two labels the app's own pods carry, for the same two
                   reasons: the tenant's kernel-access NetworkPolicy selects on
                   gentianos.io/app, and anything attributing resource use to an
                   app counts by it. A sidecar is part of its app, so leaving it
                   unlabelled put it outside both — its pods were neither granted
                   the app's kernel egress nor counted against the app that owns
                   them. Requires the sidecar chart to honour podLabels, which is
                   the same requirement the app's own chart already carries. */}}
            {{- $scPodLabels := default dict (dig "podLabels" dict $scExtraVals) }}
            {{- $scPodLabels = mergeOverwrite $scPodLabels (dict "gentianos.io/app" $app "gentianos.io/tenant" $tenant) }}
            {{- $scExtraVals = mergeOverwrite $scExtraVals (dict "podLabels" $scPodLabels) }}
            ---
            apiVersion: helm.crossplane.io/v1beta1
            kind: Release
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-{{ $sc.name }}-release
                # Stable for the same reason as the app's own release name.
                crossplane.io/external-name: {{ $app }}-{{ $sc.name }}-release
              name: {{ $xrName }}-{{ $sc.name }}-release
            spec:
              rollbackLimit: 3
              forProvider:
                chart:
                  repository: {{ $sc.chart.repository }}
                  name: {{ $sc.chart.name }}
                  version: {{ $sc.chart.version | quote }}
                  {{- range $c := (default list $pullSecrets.charts) }}
                  {{- if eq $c.repository $sc.chart.repository }}
                  pullSecretRef:
                    name: {{ $c.secretName }}
                    namespace: {{ $ns }}
                  {{- end }}
                  {{- end }}
                namespace: {{ $ns }}
                # Wait for the release's workloads, not just for Helm to have
                # applied the manifests.
                #
                # With wait: false the Release goes Ready the moment the objects
                # exist, so an App whose pods can never schedule still reports
                # Ready=True -- and function-auto-ready then marks the XR Ready,
                # and the Tenant says "All App claims are Ready". Odoo sat like
                # that for hours: its modules PVC asked for a StorageClass the
                # cluster does not have, three pods were Pending the whole time,
                # and every signal above them was green.
                #
                # The kernel's own releases (infra-data, suze) have always waited.
                # Apps are what a tenant actually sees, so a false green matters
                # more here, not less.
                #
                # 10m rather than infra-data's 5m: an app's first boot can include
                # schema migration or module installation. On timeout the Release
                # reports not-ready and says so, which is the outcome being asked
                # for -- a wrong answer arriving quickly is worse than a right one
                # arriving late.
                wait: true
                waitTimeout: "10m"
                skipCRDs: true
                # The app's rule, for the sidecar's release as well: its files
                # are the app's and are kept on uninstall like the rest.
                patchesFrom:
                  - configMapKeyRef:
                      name: {{ $keepVolumes }}
                      namespace: {{ $ns }}
                      key: patch.yaml
                      optional: false
                {{- if gt (len $scExtraVals) 0 }}
                values:
                  {{ toYaml $scExtraVals | nindent 18 }}
                {{- end }}
                {{- if gt (len $scRelSet) 0 }}
                set:
                  {{ toYaml $scRelSet | nindent 18 }}
                {{- end }}
              providerConfigRef:
                name: kubernetes

            {{- if $sc.stableServiceName }}
            {{- $scSvcPort := default 80 ($sc.stableServicePort | int) }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-{{ $sc.name }}-stable-svc
              name: {{ $xrName }}-{{ $sc.name }}-stable-svc
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Service
                  metadata:
                    name: {{ $sc.stableServiceName }}
                    namespace: {{ $ns }}
                  spec:
                    selector:
                      app.kubernetes.io/instance: {{ $app }}-{{ $sc.name }}-release
                    ports:
                    - name: http
                      port: {{ $scSvcPort }}
                      targetPort: {{ $scSvcPort }}
                      protocol: TCP
              providerConfigRef:
                name: kubernetes
            {{- end }}
            {{- end }}
            {{- end }}

    # ── Step 3: Mark XR Ready when all composed resources are Ready ───────────
    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready
