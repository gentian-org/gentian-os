apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: app-default
  labels:
    gentianos.io/composition: app
spec:
  compositeTypeRef:
    apiVersion: gentianos.io/v1alpha1
    kind: XApp
  mode: Pipeline
  pipeline:

    # ── Step 1: Fetch the AppProfile + kernel service ConfigMap ──────────────
    # Both resources are fetched in a single function-extra-resources call so
    # that they share the same context key
    # (apiextensions.crossplane.io/extra-resources). Splitting into two
    # function-extra-resources steps would cause the second call to overwrite
    # the context key set by the first, losing the fetched AppProfile.
    - step: fetch-extra-resources
      functionRef:
        name: function-extra-resources
      input:
        apiVersion: extra-resources.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          extraResources:
            - kind: AppProfile
              into: appProfile
              apiVersion: gentianos.io/v1alpha1
              type: Selector
              selector:
                maxMatch: 1
                minMatch: 1
                matchLabels:
                  - key: gentianos.io/profile-name
                    type: FromCompositeFieldPath
                    valueFromFieldPath: spec.profileRef.name
            # Reads the gentian-kernel-services ConfigMap from gentian-system to make
            # cluster-specific infrastructure endpoints available for extraValues
            # substitution: ${S3_ENDPOINT}, ${MYSQL_HOST}, ${REDIS_HOST}.
            # The ConfigMap is published by the gentian-os Helm chart via kernelServices values.
            - kind: ConfigMap
              into: kernelServices
              apiVersion: v1
              type: Selector
              selector:
                maxMatch: 1
                matchLabels:
                  - key: gentianos.io/config-type
                    type: Value
                    value: kernel-services
            # Reads the gentian-cluster-config ConfigMap (crossplane-system) to supply
            # cluster-specific LDAP base DN, UDM URL, and secret generation mode to
            # app init Jobs emitted by this Composition.
            - kind: ConfigMap
              into: clusterConfig
              apiVersion: v1
              type: Selector
              selector:
                maxMatch: 1
                matchLabels:
                  - key: gentianos.io/config-type
                    type: Value
                    value: cluster-config
            # Gentian Jitsi OIDC/JWT overlays (portal iframe SSO, kernel IdP broker).
            # Published by install-lib upsert_gentian_jitsi_oidc_overlays_configmap().
            - kind: ConfigMap
              into: jitsiOidcOverlays
              apiVersion: v1
              type: Selector
              selector:
                maxMatch: 1
                minMatch: 0
                matchLabels:
                  - key: gentianos.io/config-type
                    type: Value
                    value: jitsi-oidc-overlays

    # ── Step 2: Render composed resources ─────────────────────────────────────
    # Emits per-app:
    #   • kubernetes.crossplane.io/v1alpha2 Object wrapping an ESO ExternalSecret
    #     (present only when the AppProfile has at least one valueMapping key or
    #     appSecret; creates a flat Secret with one key per sensitive value)
    #   • helm.crossplane.io/v1beta1 Release pointing at the chart from the
    #     AppProfile, with set[] entries that pull values from the Secret above
    - step: render-app-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr     := .observed.composite.resource }}
            {{- $spec   := $xr.spec }}
            {{- $xrName := $xr.metadata.name }}
            {{- /* App claim name (e.g. "nextcloud"). Used as the Helm release name
                 and ExternalSecret name so both resources are discoverable by
                 app label without needing to know the generated XR name. */}}
            {{- $app    := $spec.claimRef.name }}
            {{- $ns     := $spec.tenantNamespace }}
            {{- /* Derive tenant name from namespace convention "tenant-{name}". */}}
            {{- $tenant := trimPrefix "tenant-" $ns }}
            {{- /* Tenant domain — used for substitution in extraValues AND in
                 Keycloak client redirect URIs. Computed once at top level so
                 both blocks share the same value. */}}
            {{- $domain := default (printf "%s.example.org" $tenant) $spec.domain }}

            {{- /* ── Load AppProfile from pipeline context ────────────────────── */}}
            {{- $extraRes  := index .context "apiextensions.crossplane.io/extra-resources" }}
            {{- $profiles  := dig "appProfile" list $extraRes }}
            {{- if eq (len $profiles) 0 }}
              {{- fail (printf "AppProfile %q not found in cluster" $spec.profileRef.name) }}
            {{- end }}
            {{- $profile   := index $profiles 0 }}
            {{- $pSpec     := dig "spec" dict $profile }}
            {{- $vm        := default dict $pSpec.valueMapping }}
            {{- $appSecrets := default list $pSpec.appSecrets }}
            {{- $chart     := $pSpec.chart }}

            {{- /* ── Load cluster-config ConfigMap for app init Jobs ────────────── */}}
            {{- /* Provides ldap.baseDn, udm.url, and secretMode injected as env    */}}
            {{- /* vars into ldap-search-init Jobs (and future s3/db init Jobs).    */}}
            {{- $ccRes      := dig "clusterConfig" list $extraRes }}
            {{- $ccCM       := default dict (index $ccRes 0) }}
            {{- $ccData     := dig "data" dict $ccCM }}
            {{- $ldapBaseDn    := dig "ldap.baseDn"    "" $ccData }}
            {{- $udmUrl        := dig "udm.url"        "" $ccData }}
            {{- $secretMode    := dig "secretMode"     "derived" $ccData }}
            {{- $minioEndpoint := dig "minio.endpoint" "" $ccData }}
            {{- $cnpgHost      := dig "cnpg.host"      "" $ccData }}
            {{- $nodeIP        := dig "node.ip"        "" $ccData }}

            {{- /* ── Load Jitsi OIDC overlay files (optional until install upserts CM) */}}
            {{- $jitsiOverlayRes  := dig "jitsiOidcOverlays" list $extraRes }}
            {{- $jitsiOverlayCM   := default dict (index $jitsiOverlayRes 0) }}
            {{- $jitsiOverlayData := dig "data" dict $jitsiOverlayCM }}

            {{- /* ── Build ExternalSecret data[] entries ───────────────────────── */}}
            {{- /* Each entry pulls one scalar from an OpenBao KV path and stores  */}}
            {{- /* it under a flat secretKey in the managed Secret. Non-empty keys  */}}
            {{- /* in the ValueMapping drive which entries are emitted.             */}}
            {{- $esData := list }}

            {{- /* OIDC */}}
            {{- if $vm.oidc }}
            {{- $oidcPath := printf "gentian-os/tenants/%s/apps/%s/oidc" $tenant $app }}
            {{- if $vm.oidc.issuerKey }}
            {{- $esData = append $esData (dict "secretKey" "oidc-issuer"        "remoteRef" (dict "key" $oidcPath "property" "issuer")) }}
            {{- end }}
            {{- if $vm.oidc.clientIdKey }}
            {{- $esData = append $esData (dict "secretKey" "oidc-client-id"     "remoteRef" (dict "key" $oidcPath "property" "client-id")) }}
            {{- end }}
            {{- if $vm.oidc.clientSecretKey }}
            {{- /* Use the explicit path/property when the OIDC client is in the
                 kernel realm (not per-tenant). Default to the standard per-tenant
                 path so existing apps need no changes. */}}
            {{- $csPath := default $oidcPath $vm.oidc.clientSecretOpenbaoPath }}
            {{- $csProp := default "client-secret" $vm.oidc.clientSecretOpenbaoProperty }}
            {{- $esData = append $esData (dict "secretKey" "oidc-client-secret" "remoteRef" (dict "key" $csPath "property" $csProp)) }}
            {{- end }}
            {{- end }}

            {{- /* Database */}}
            {{- if $vm.database }}
            {{- $dbPath := printf "gentian-os/tenants/%s/apps/%s/database" $tenant $app }}
            {{- if $vm.database.hostKey }}
            {{- $esData = append $esData (dict "secretKey" "db-host"     "remoteRef" (dict "key" $dbPath "property" "host")) }}
            {{- end }}
            {{- if $vm.database.portKey }}
            {{- $esData = append $esData (dict "secretKey" "db-port"     "remoteRef" (dict "key" $dbPath "property" "port")) }}
            {{- end }}
            {{- if $vm.database.nameKey }}
            {{- $esData = append $esData (dict "secretKey" "db-name"     "remoteRef" (dict "key" $dbPath "property" "name")) }}
            {{- end }}
            {{- if $vm.database.userKey }}
            {{- $esData = append $esData (dict "secretKey" "db-user"     "remoteRef" (dict "key" $dbPath "property" "user")) }}
            {{- end }}
            {{- if $vm.database.passwordKey }}
            {{- $esData = append $esData (dict "secretKey" "db-password" "remoteRef" (dict "key" $dbPath "property" "password")) }}
            {{- end }}
            {{- end }}

            {{- /* S3 */}}
            {{- if $vm.s3 }}
            {{- $s3Path := printf "gentian-os/tenants/%s/apps/%s/s3" $tenant $app }}
            {{- if $vm.s3.endpointKey }}
            {{- $esData = append $esData (dict "secretKey" "s3-endpoint"   "remoteRef" (dict "key" $s3Path "property" "endpoint")) }}
            {{- end }}
            {{- if $vm.s3.bucketKey }}
            {{- $esData = append $esData (dict "secretKey" "s3-bucket"     "remoteRef" (dict "key" $s3Path "property" "bucket")) }}
            {{- end }}
            {{- if $vm.s3.accessKeyKey }}
            {{- $esData = append $esData (dict "secretKey" "s3-access-key" "remoteRef" (dict "key" $s3Path "property" "access-key")) }}
            {{- end }}
            {{- if $vm.s3.secretKeyKey }}
            {{- $esData = append $esData (dict "secretKey" "s3-secret-key" "remoteRef" (dict "key" $s3Path "property" "secret-key")) }}
            {{- end }}
            {{- if $vm.s3.regionKey }}
            {{- $esData = append $esData (dict "secretKey" "s3-region"     "remoteRef" (dict "key" $s3Path "property" "region")) }}
            {{- end }}
            {{- end }}

            {{- /* Cache */}}
            {{- if $vm.cache }}
            {{- $cachePath := printf "gentian-os/tenants/%s/apps/%s/cache" $tenant $app }}
            {{- if $vm.cache.hostKey }}
            {{- $esData = append $esData (dict "secretKey" "cache-host"     "remoteRef" (dict "key" $cachePath "property" "host")) }}
            {{- end }}
            {{- if $vm.cache.portKey }}
            {{- $esData = append $esData (dict "secretKey" "cache-port"     "remoteRef" (dict "key" $cachePath "property" "port")) }}
            {{- end }}
            {{- if $vm.cache.passwordKey }}
            {{- $esData = append $esData (dict "secretKey" "cache-password" "remoteRef" (dict "key" $cachePath "property" "password")) }}
            {{- end }}
            {{- end }}

            {{- /* SMTP */}}
            {{- if $vm.smtp }}
            {{- $smtpPath := printf "gentian-os/tenants/%s/apps/%s/smtp" $tenant $app }}
            {{- if $vm.smtp.hostKey }}
            {{- $esData = append $esData (dict "secretKey" "smtp-host"     "remoteRef" (dict "key" $smtpPath "property" "host")) }}
            {{- end }}
            {{- if $vm.smtp.portKey }}
            {{- $esData = append $esData (dict "secretKey" "smtp-port"     "remoteRef" (dict "key" $smtpPath "property" "port")) }}
            {{- end }}
            {{- if $vm.smtp.userKey }}
            {{- $esData = append $esData (dict "secretKey" "smtp-user"     "remoteRef" (dict "key" $smtpPath "property" "user")) }}
            {{- end }}
            {{- if $vm.smtp.passwordKey }}
            {{- $esData = append $esData (dict "secretKey" "smtp-password" "remoteRef" (dict "key" $smtpPath "property" "password")) }}
            {{- end }}
            {{- end }}

            {{- /* IMAP */}}
            {{- if $vm.imap }}
            {{- $imapPath := printf "gentian-os/tenants/%s/apps/%s/imap" $tenant $app }}
            {{- if $vm.imap.hostKey }}
            {{- $esData = append $esData (dict "secretKey" "imap-host" "remoteRef" (dict "key" $imapPath "property" "host")) }}
            {{- end }}
            {{- if $vm.imap.portKey }}
            {{- $esData = append $esData (dict "secretKey" "imap-port" "remoteRef" (dict "key" $imapPath "property" "port")) }}
            {{- end }}
            {{- end }}

            {{- /* LDAP */}}
            {{- if $vm.ldap }}
            {{- $ldapPath := printf "gentian-os/tenants/%s/apps/%s/ldap" $tenant $app }}
            {{- if $vm.ldap.hostKey }}
            {{- $esData = append $esData (dict "secretKey" "ldap-host"          "remoteRef" (dict "key" $ldapPath "property" "host")) }}
            {{- end }}
            {{- if $vm.ldap.portKey }}
            {{- $esData = append $esData (dict "secretKey" "ldap-port"          "remoteRef" (dict "key" $ldapPath "property" "port")) }}
            {{- end }}
            {{- if $vm.ldap.baseDnKey }}
            {{- $esData = append $esData (dict "secretKey" "ldap-base-dn"       "remoteRef" (dict "key" $ldapPath "property" "base-dn")) }}
            {{- end }}
            {{- if $vm.ldap.bindDnKey }}
            {{- $esData = append $esData (dict "secretKey" "ldap-bind-dn"       "remoteRef" (dict "key" $ldapPath "property" "bind-dn")) }}
            {{- end }}
            {{- if $vm.ldap.bindPasswordKey }}
            {{- $esData = append $esData (dict "secretKey" "ldap-bind-password" "remoteRef" (dict "key" $ldapPath "property" "bind-password")) }}
            {{- end }}
            {{- end }}

            {{- /* App-internal secrets (AppProfile.spec.appSecrets) */}}
            {{- range $s := $appSecrets }}
            {{- if and $s.name $s.valuePath }}
            {{- $internalPath := printf "gentian-os/tenants/%s/apps/%s/internal/%s" $tenant $app $s.name }}
            {{- $esData = append $esData (dict "secretKey" (printf "internal-%s" $s.name)
                "remoteRef" (dict "key" $internalPath "property" "value")) }}
            {{- end }}
            {{- end }}

            {{- /* ── Emit OpenBao KV seeders for each app-internal secret ──────── */}}
            {{- /* For each appSecret we emit two composed resources:               */}}
            {{- /*   1. A k8s Secret in crossplane-system holding a deterministic   */}}
            {{- /*      seed value (SHA-256 of the XApp name + secret name).        */}}
            {{- /*   2. A provider-vault SecretV2 (Observe+Create, Orphan delete)   */}}
            {{- /*      that creates the OpenBao KV path on first reconcile and     */}}
            {{- /*      never overwrites an existing version.                        */}}
            {{- range $s := $appSecrets }}
            {{- if and $s.name $s.valuePath }}
            {{- $safeName := $s.name | replace "_" "-" }}
            {{- $seedName := printf "%s-%s-seed" $xrName $safeName }}
            {{- $kvPath   := printf "gentian-os/tenants/%s/apps/%s/internal/%s" $tenant $app $s.name }}
            {{- $seedVal  := sha256sum (printf "%s:%s:%s" $xrName $app $s.name) }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-{{ $safeName }}-seed-secret
              name: {{ $seedName }}
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: {{ $seedName }}
                    namespace: crossplane-system
                  type: Opaque
                  stringData:
                    data.json: '{"value":"{{ $seedVal }}"}'
              providerConfigRef:
                name: kubernetes
            ---
            apiVersion: kv.vault.upbound.io/v1alpha1
            kind: SecretV2
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-{{ $safeName }}-kv
              name: {{ $seedName }}-kv
            spec:
              deletionPolicy: Orphan
              managementPolicies:
                - Observe
                - Create
              forProvider:
                mount: secret
                name: {{ $kvPath }}
                dataJsonSecretRef:
                  name: {{ $seedName }}
                  namespace: crossplane-system
                  key: data.json
              providerConfigRef:
                name: openbao
            {{- end }}
            {{- end }}

            {{- /* ── Build Release set[] entries ────────────────────────────────── */}}
            {{- /* Each set entry picks a single key from the ExternalSecret-managed  */}}
            {{- /* Secret and passes it to Helm as a --set-string override. Helm      */}}
            {{- /* interprets dot-notation names as nested value paths.               */}}
            {{- $secretName := printf "%s-sensitive-values" $app }}
            {{- $relSet := list }}

            {{- if $vm.oidc }}
            {{- if $vm.oidc.issuerKey }}
            {{- $relSet = append $relSet (dict "name" $vm.oidc.issuerKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "oidc-issuer"))) }}
            {{- end }}
            {{- if $vm.oidc.clientIdKey }}
            {{- $relSet = append $relSet (dict "name" $vm.oidc.clientIdKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "oidc-client-id"))) }}
            {{- end }}
            {{- if $vm.oidc.clientSecretKey }}
            {{- $relSet = append $relSet (dict "name" $vm.oidc.clientSecretKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "oidc-client-secret"))) }}
            {{- end }}
            {{- end }}

            {{- if $vm.database }}
            {{- if $vm.database.hostKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.hostKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-host"))) }}
            {{- end }}
            {{- if $vm.database.portKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.portKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-port"))) }}
            {{- end }}
            {{- if $vm.database.nameKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.nameKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-name"))) }}
            {{- end }}
            {{- if $vm.database.readNameKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.readNameKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-name"))) }}
            {{- end }}
            {{- if $vm.database.userKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.userKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-user"))) }}
            {{- end }}
            {{- if $vm.database.readUserKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.readUserKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-user"))) }}
            {{- end }}
            {{- if $vm.database.passwordKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.passwordKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-password"))) }}
            {{- end }}
            {{- end }}

            {{- if $vm.s3 }}
            {{- if $vm.s3.endpointKey }}
            {{- $relSet = append $relSet (dict "name" $vm.s3.endpointKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "s3-endpoint"))) }}
            {{- end }}
            {{- if $vm.s3.bucketKey }}
            {{- $relSet = append $relSet (dict "name" $vm.s3.bucketKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "s3-bucket"))) }}
            {{- end }}
            {{- if $vm.s3.accessKeyKey }}
            {{- $relSet = append $relSet (dict "name" $vm.s3.accessKeyKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "s3-access-key"))) }}
            {{- end }}
            {{- if $vm.s3.secretKeyKey }}
            {{- $relSet = append $relSet (dict "name" $vm.s3.secretKeyKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "s3-secret-key"))) }}
            {{- end }}
            {{- if $vm.s3.regionKey }}
            {{- $relSet = append $relSet (dict "name" $vm.s3.regionKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "s3-region"))) }}
            {{- end }}
            {{- end }}

            {{- if $vm.cache }}
            {{- if $vm.cache.hostKey }}
            {{- $relSet = append $relSet (dict "name" $vm.cache.hostKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "cache-host"))) }}
            {{- end }}
            {{- if $vm.cache.portKey }}
            {{- $relSet = append $relSet (dict "name" $vm.cache.portKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "cache-port"))) }}
            {{- end }}
            {{- if $vm.cache.passwordKey }}
            {{- $relSet = append $relSet (dict "name" $vm.cache.passwordKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "cache-password"))) }}
            {{- end }}
            {{- end }}

            {{- if $vm.smtp }}
            {{- if $vm.smtp.hostKey }}
            {{- $relSet = append $relSet (dict "name" $vm.smtp.hostKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "smtp-host"))) }}
            {{- end }}
            {{- if $vm.smtp.portKey }}
            {{- $relSet = append $relSet (dict "name" $vm.smtp.portKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "smtp-port"))) }}
            {{- end }}
            {{- if $vm.smtp.userKey }}
            {{- $relSet = append $relSet (dict "name" $vm.smtp.userKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "smtp-user"))) }}
            {{- end }}
            {{- if $vm.smtp.passwordKey }}
            {{- $relSet = append $relSet (dict "name" $vm.smtp.passwordKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "smtp-password"))) }}
            {{- end }}
            {{- end }}

            {{- if $vm.imap }}
            {{- if $vm.imap.hostKey }}
            {{- $relSet = append $relSet (dict "name" $vm.imap.hostKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "imap-host"))) }}
            {{- end }}
            {{- if $vm.imap.portKey }}
            {{- $relSet = append $relSet (dict "name" $vm.imap.portKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "imap-port"))) }}
            {{- end }}
            {{- end }}

            {{- if $vm.ldap }}
            {{- if $vm.ldap.hostKey }}
            {{- $relSet = append $relSet (dict "name" $vm.ldap.hostKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "ldap-host"))) }}
            {{- end }}
            {{- if $vm.ldap.portKey }}
            {{- $relSet = append $relSet (dict "name" $vm.ldap.portKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "ldap-port"))) }}
            {{- end }}
            {{- if $vm.ldap.baseDnKey }}
            {{- $relSet = append $relSet (dict "name" $vm.ldap.baseDnKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "ldap-base-dn"))) }}
            {{- end }}
            {{- if $vm.ldap.bindDnKey }}
            {{- $relSet = append $relSet (dict "name" $vm.ldap.bindDnKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "ldap-bind-dn"))) }}
            {{- end }}
            {{- if $vm.ldap.bindPasswordKey }}
            {{- $relSet = append $relSet (dict "name" $vm.ldap.bindPasswordKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "ldap-bind-password"))) }}
            {{- end }}
            {{- end }}

            {{- /* App-internal secrets */}}
            {{- range $s := $appSecrets }}
            {{- if and $s.name $s.valuePath }}
            {{- $relSet = append $relSet (dict "name" $s.valuePath
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" (printf "internal-%s" $s.name)))) }}
            {{- /* Jitsi Prosody hybrid_matrix_token auth needs JWT_APP_SECRET in   */}}
            {{- /* extraEnvs (OpenDesk values-jitsi.yaml.gotmpl parity). settings.  */}}
            {{- /* jwtAppSecret.value only feeds the keycloak-adapter sidecar.       */}}
            {{- if and (eq $app "jitsi") (eq $s.name "jwt_app_secret") }}
            {{- $relSet = append $relSet (dict "name" "jitsi.prosody.extraEnvs[2].value"
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" (printf "internal-%s" $s.name)))) }}
            {{- end }}
            {{- end }}
            {{- end }}

            {{- /* ── Render inline non-sensitive values ───────────────────────── */}}
            {{- /* Profile-level extraValues are merged with per-tenant config     */}}
            {{- /* overrides. Template variables are substituted before marshalling */}}
            {{- /* Substitutions:                                                   */}}
            {{- /*   ${TENANT_DOMAIN}    — effective tenant domain                 */}}
            {{- /*   ${TENANT_NAMESPACE} — tenant k8s namespace                    */}}
            {{- /*   ${TENANT_ID}        — tenant name (e.g. gtn-demo)             */}}
            {{- /*   ${S3_ENDPOINT}      — MinIO/S3 endpoint URL (from kernel CM)  */}}
            {{- /*   ${MYSQL_HOST}       — MariaDB/MySQL hostname (from kernel CM) */}}
            {{- /*   ${LDAP_HOST}        — UCS LDAP service (from cluster-config)  */}}
            {{- /*   ${LDAP_BASE_DN}     — LDAP base DN (from cluster-config)     */}}
            {{- /*   ${SMTP_HOST}        — shared Postfix submission endpoint     */}}
            {{- /*   ${TURN_*}           — shared TURN server (from kernel CM)     */}}
            {{- $extraVals := dict }}
            {{- /* Load kernel service endpoints from the fetched ConfigMap */}}
            {{- $ksRes := dig "kernelServices" list $extraRes }}
            {{- $ksCM  := default dict (index $ksRes 0) }}
            {{- $ksCMData := dig "data" dict $ksCM }}
            {{- if $pSpec.extraValues }}
            {{- $kernelDomain := dig "KERNEL_DOMAIN" "" $ksCMData }}
            {{- $s3Endpoint := dig "S3_ENDPOINT"  "" $ksCMData }}
            {{- $mysqlHost  := dig "MYSQL_HOST"   "" $ksCMData }}
            {{- $redisHost  := dig "REDIS_HOST"   "" $ksCMData }}
            {{- $turnHost     := dig "TURN_HOST"        "" $ksCMData }}
            {{- $turnPort     := dig "TURN_PORT"        "3478" $ksCMData }}
            {{- $turnTLSHost  := dig "TURN_TLS_HOST"    "" $ksCMData }}
            {{- $turnTLSPort  := dig "TURN_TLS_PORT"    "5349" $ksCMData }}
            {{- $turnTransport := dig "TURN_TRANSPORT"  "udp" $ksCMData }}
            {{- $turnCreds    := dig "TURN_CREDENTIALS" "" $ksCMData }}
            {{- $clusterCfgs := dig "clusterConfig" list $extraRes }}
            {{- $ldapServer  := "nubus-dev-ldap-server.gentian-dev.svc.cluster.local" }}
            {{- $ldapBaseDn  := "dc=swp-ldap,dc=internal" }}
            {{- $smtpHost    := "postfix-dev.gentian-dev.svc.cluster.local" }}
            {{- if gt (len $clusterCfgs) 0 }}
            {{- $cc := index $clusterCfgs 0 }}
            {{- $ldapServer = dig "data" "ldap.server" $ldapServer $cc }}
            {{- $ldapBaseDn = dig "data" "ldap.baseDn"  $ldapBaseDn  $cc }}
            {{- end }}
            {{- $raw := $pSpec.extraValues | toJson }}
            {{- $raw = $raw | replace "${TENANT_DOMAIN}"    $domain }}
            {{- $raw = $raw | replace "${TENANT_NAMESPACE}" $ns }}
            {{- $raw = $raw | replace "${TENANT_ID}"        $tenant }}
            {{- if $kernelDomain }}{{ $raw = $raw | replace "${KERNEL_DOMAIN}" $kernelDomain }}{{ end }}
            {{- if $s3Endpoint  }}{{ $raw = $raw | replace "${S3_ENDPOINT}"   $s3Endpoint  }}{{ end }}
            {{- if $mysqlHost   }}{{ $raw = $raw | replace "${MYSQL_HOST}"    $mysqlHost   }}{{ end }}
            {{- if $redisHost   }}{{ $raw = $raw | replace "${REDIS_HOST}"    $redisHost   }}{{ end }}
            {{- $raw = $raw | replace "${LDAP_HOST}"    $ldapServer }}
            {{- $raw = $raw | replace "${LDAP_BASE_DN}" $ldapBaseDn }}
            {{- $raw = $raw | replace "${SMTP_HOST}"    $smtpHost }}
            {{- $raw = $raw | replace "${TURN_HOST}"        $turnHost }}
            {{- $raw = $raw | replace "${TURN_PORT}"        $turnPort }}
            {{- $raw = $raw | replace "${TURN_TLS_HOST}"    $turnTLSHost }}
            {{- $raw = $raw | replace "${TURN_TLS_PORT}"   $turnTLSPort }}
            {{- $raw = $raw | replace "${TURN_TRANSPORT}" $turnTransport }}
            {{- $raw = $raw | replace "${TURN_CREDENTIALS}" $turnCreds }}
            {{- if $nodeIP      }}{{ $raw = $raw | replace "${NODE_IP}"       $nodeIP      }}{{ end }}
            {{- $extraVals = $raw | fromJson }}
            {{- end }}
            {{- if and $spec.config $spec.config.extraValues }}
            {{- $extraVals = mergeOverwrite $extraVals $spec.config.extraValues }}
            {{- end }}
            {{- if and $spec.config $spec.config.replicas }}
            {{- $extraVals = mergeOverwrite $extraVals (dict "replicaCount" $spec.config.replicas) }}
            {{- end }}

            {{- /* opendesk/Bitnami charts expect imagePullSecrets as a string list. */}}
            {{- $rawImagePull := dig "imagePullSecrets" list $extraVals }}
            {{- $imagePull := list }}
            {{- range $entry := $rawImagePull }}
            {{- if kindIs "string" $entry }}
            {{- $imagePull = append $imagePull $entry }}
            {{- else if kindIs "map" $entry }}
            {{- $pullName := dig "name" "" $entry }}
            {{- if $pullName }}{{- $imagePull = append $imagePull $pullName }}{{- end }}
            {{- end }}
            {{- end }}
            {{- if eq (len $imagePull) 0 }}
            {{- $imagePull = list "registry-credentials" }}
            {{- end }}
            {{- $extraVals = mergeOverwrite $extraVals (dict
                "imagePullSecrets" $imagePull
                "global" (mergeOverwrite (dig "global" dict $extraVals) (dict "imagePullSecrets" $imagePull))
            ) }}

            {{- /* ── Jitsi: mount Gentian OIDC/JWT overlays over chart ConfigMaps ── */}}
            {{- if eq $app "jitsi" }}
            {{- if eq (len $jitsiOverlayData) 0 }}
              {{- fail "gentian-jitsi-oidc-overlays ConfigMap missing — run gentian-os install/update (upsert_gentian_jitsi_oidc_overlays_configmap)" }}
            {{- end }}
            {{- $jitsiOidcCM := printf "%s-oidc-overlays" $xrName }}
            {{- $jitsiWebOverlayItems := list
                (dict "key" "body.html" "path" "body.html")
                (dict "key" "oidc-adapter.html" "path" "oidc-adapter.html")
                (dict "key" "oidc-redirect.html" "path" "oidc-redirect.html")
                (dict "key" "plugin.head.html" "path" "plugin.head.html")
            }}
            {{- $jitsiWebOverlayMounts := list
                (dict "name" "gentian-jitsi-oidc-overlays" "subPath" "body.html" "mountPath" "/usr/share/jitsi-meet/body.html")
                (dict "name" "gentian-jitsi-oidc-overlays" "subPath" "plugin.head.html" "mountPath" "/usr/share/jitsi-meet/plugin.head.html")
                (dict "name" "gentian-jitsi-oidc-overlays" "subPath" "oidc-adapter.html" "mountPath" "/usr/share/jitsi-meet/static/oidc-adapter.html")
                (dict "name" "gentian-jitsi-oidc-overlays" "subPath" "oidc-redirect.html" "mountPath" "/usr/share/jitsi-meet/static/oidc-redirect.html")
            }}
            {{- $jitsiOverlayVol := dict
                "name" "gentian-jitsi-oidc-overlays"
                "configMap" (dict "name" $jitsiOidcCM "items" $jitsiWebOverlayItems)
            }}
            {{- $jitsiAdapterOverlayVol := dict
                "name" "gentian-jitsi-adapter-overlay"
                "configMap" (dict "name" $jitsiOidcCM "items" (list (dict "key" "context.ts" "path" "context.ts")))
            }}
            {{- $jitsiAdapterOverlayMount := dict
                "name" "gentian-jitsi-adapter-overlay"
                "subPath" "context.ts"
                "mountPath" "/app/context.ts"
            }}
            {{- $jitsiWebExtra := default dict (dig "jitsi" dict $extraVals) }}
            {{- $jitsiWeb := default dict (dig "web" dict $jitsiWebExtra) }}
            {{- $jitsiWeb = mergeOverwrite $jitsiWeb (dict
                "extraVolumes" (concat (default list $jitsiWeb.extraVolumes) (list $jitsiOverlayVol))
                "extraVolumeMounts" (concat (default list $jitsiWeb.extraVolumeMounts) $jitsiWebOverlayMounts)
            ) }}
            {{- $jitsiWebExtra = mergeOverwrite $jitsiWebExtra (dict "web" $jitsiWeb) }}
            {{- $extraVals = mergeOverwrite $extraVals (dict
                "jitsi" $jitsiWebExtra
                "extraVolumes" (concat (default list $extraVals.extraVolumes) (list $jitsiAdapterOverlayVol))
                "extraVolumeMounts" (concat (default list $extraVals.extraVolumeMounts) (list $jitsiAdapterOverlayMount))
            ) }}
            {{- end }}

            {{- $acmeStaging := eq (dig "ACME_STAGING" "false" $ksCMData) "true" }}
            {{- if $acmeStaging }}
            {{- $krStaging := default dict $pSpec.kernelRequirements }}
            {{- $identityStaging := default dict $krStaging.identity }}
            {{- $oidcStaging := default dict $identityStaging.oidc }}
            {{- $stagingEnv := list
                (dict "name" "REQUESTS_CA_BUNDLE" "value" "/etc/ssl/certs/ca-certificates.crt")
                (dict "name" "SSL_CERT_FILE" "value" "/etc/ssl/certs/ca-certificates.crt")
                (dict "name" "DENO_CERT" "value" "/etc/ssl/certs/ca-certificates.crt")
            }}
            {{- $stagingVol := dict
                "name" "trusted-cert-secret-volume"
                "secret" (dict
                  "secretName" "gentian-staging-ca-tls"
                  "items" (list
                    (dict "key" "ca.crt" "path" "ca-certificates.crt")
                    (dict "key" "truststore.jks" "path" "truststore.jks")
                  )
                )
            }}
            {{- $stagingMounts := list
                (dict "name" "trusted-cert-secret-volume" "mountPath" "/etc/ssl/certs/ca-certificates.crt" "subPath" "ca-certificates.crt")
                (dict "name" "trusted-cert-secret-volume" "mountPath" "/etc/ssl/certs/truststore.jks" "subPath" "truststore.jks")
            }}
            {{- $existingJavaOpts := default list (dig "javaOpts" list $extraVals) }}
            {{- $needsJavaTrust := or (gt (len $existingJavaOpts) 0) $oidcStaging.clientId }}
            {{- if $needsJavaTrust }}
            {{- $existingJavaOpts = concat $existingJavaOpts (list
                "-Djavax.net.ssl.trustStore=/etc/ssl/certs/truststore.jks"
                "-Djavax.net.ssl.trustStoreType=JKS"
                "-Djavax.net.ssl.trustStorePassword=changeit"
            ) }}
            {{- end }}
            {{- $extraVals = mergeOverwrite $extraVals (dict
                "extraEnvVars" (concat (default list (dig "extraEnvVars" list $extraVals)) $stagingEnv)
                "extraVolumes" (concat (default list (dig "extraVolumes" list $extraVals)) (list $stagingVol))
                "extraVolumeMounts" (concat (default list (dig "extraVolumeMounts" list $extraVals)) $stagingMounts)
            ) }}
            {{- if $needsJavaTrust }}
            {{- $extraVals = mergeOverwrite $extraVals (dict "javaOpts" $existingJavaOpts) }}
            {{- end }}
            {{- end }}

            {{- /* ── Emit Keycloak Client CR ──────────────────────────────────── */}}
            {{- /* When kernelRequirements.identity.oidc is set, the composition   */}}
            {{- /* registers the app as an OIDC client in the tenant's own realm.  */}}
            {{- /* New apps only need to declare their oidc block in the AppProfile */}}
            {{- /* to get automatic per-tenant Keycloak client registration.        */}}
            {{- $kr       := default dict $pSpec.kernelRequirements }}
            {{- $identity := default dict $kr.identity }}
            {{- $oidcCl   := default dict $identity.oidc }}
            {{- if $oidcCl.clientId }}
            {{- $redirects  := list }}
            {{- range $uri := (default list $oidcCl.redirectUris) }}
            {{- $redirects = append $redirects ($uri | replace "${TENANT_DOMAIN}" $domain) }}
            {{- end }}
            {{- $postLogout := list }}
            {{- range $uri := (default list $oidcCl.postLogoutRedirectUris) }}
            {{- $postLogout = append $postLogout ($uri | replace "${TENANT_DOMAIN}" $domain) }}
            {{- end }}
            ---
            apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
            kind: Client
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-keycloak-client
              name: {{ $tenant }}-{{ $app }}-keycloak-client
            spec:
              deletionPolicy: Delete
              forProvider:
                clientId: {{ $oidcCl.clientId | quote }}
                name: {{ default $oidcCl.clientId $oidcCl.name | quote }}
                realmId: {{ $tenant }}
                accessType: {{ default "PUBLIC" $oidcCl.accessType | quote }}
                standardFlowEnabled: true
                directAccessGrantsEnabled: {{ default false $oidcCl.directAccessGrantsEnabled }}
                serviceAccountsEnabled: false
                {{- if $redirects }}
                validRedirectUris:
                  {{ toYaml $redirects | nindent 18 }}
                {{- end }}
                webOrigins:
                  - "+"
                {{- if $postLogout }}
                validPostLogoutRedirectUris:
                  {{ toYaml $postLogout | nindent 18 }}
                {{- end }}
                {{- if and $oidcCl.backchannelLogoutUrl (ne $oidcCl.backchannelLogoutUrl "") }}
                backchannelLogoutUrl: {{ $oidcCl.backchannelLogoutUrl | replace "${TENANT_DOMAIN}" $domain | quote }}
                backchannelLogoutSessionRequired: true
                {{- end }}
                {{- if eq (default "PUBLIC" $oidcCl.accessType) "CONFIDENTIAL" }}
                clientSecretSecretRef:
                  name: {{ $xrName }}-oidc-client-creds
                  namespace: crossplane-system
                  key: client-secret
                {{- end }}
              providerConfigRef:
                name: keycloak
            {{- end }}

            {{- /* ── Emit ExternalSecret (only when there are secrets to sync) ── */}}
            {{- if gt (len $esData) 0 }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-externalsecret
              name: {{ $xrName }}-es
            spec:
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1
                  kind: ExternalSecret
                  metadata:
                    name: {{ $secretName }}
                    namespace: {{ $ns }}
                  spec:
                    refreshInterval: 1h
                    secretStoreRef:
                      kind: ClusterSecretStore
                      name: openbao
                    target:
                      name: {{ $secretName }}
                      creationPolicy: Owner
                      deletionPolicy: Retain
                    data:
                      {{ toYaml $esData | nindent 22 }}
              providerConfigRef:
                name: kubernetes
            {{- end }}

            {{- /* ── Emit Jitsi OIDC overlay ConfigMap (tenant copy of cluster overlays) */}}
            {{- if and (eq $app "jitsi") (gt (len $jitsiOverlayData) 0) }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-oidc-overlays-cm
              name: {{ $xrName }}-oidc-overlays-cm
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: {{ printf "%s-oidc-overlays" $xrName }}
                    namespace: {{ $ns }}
                    labels:
                      app.kubernetes.io/managed-by: gentian-os
                      gentianos.io/app: jitsi
                      gentianos.io/tenant: {{ $tenant }}
                  binaryData:
                    body.html: {{ index $jitsiOverlayData "body.html" | b64enc | quote }}
                    context.ts: {{ index $jitsiOverlayData "context.ts" | b64enc | quote }}
                    oidc-adapter.html: {{ index $jitsiOverlayData "oidc-adapter.html" | b64enc | quote }}
                    oidc-redirect.html: {{ index $jitsiOverlayData "oidc-redirect.html" | b64enc | quote }}
                    plugin.head.html: {{ index $jitsiOverlayData "plugin.head.html" | b64enc | quote }}
              providerConfigRef:
                name: kubernetes
            {{- end }}

            {{- /* ── Emit Helm Release ────────────────────────────────────────── */}}
            ---
            apiVersion: helm.crossplane.io/v1beta1
            kind: Release
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-release
              name: {{ $xrName }}-release
            spec:
              forProvider:
                chart:
                  repository: {{ $chart.repository }}
                  name: {{ $chart.name }}
                  version: {{ $chart.version | quote }}
                namespace: {{ $ns }}
                wait: false
                {{- if gt (len $extraVals) 0 }}
                values:
                  {{ toYaml $extraVals | nindent 18 }}
                {{- end }}
                {{- if gt (len $relSet) 0 }}
                set:
                  {{ toYaml $relSet | nindent 18 }}
                {{- end }}
              providerConfigRef:
                name: kubernetes

            {{- /* ── Emit stable service alias ─────────────────────────────────── */}}
            {{- /* When AppProfile sets spec.ingress.serviceName (e.g. "jitsi-web") */}}
            {{- /* the chart creates services named <xrName>-release-<component>.   */}}
            {{- /* We emit a stable ClusterIP Service with the declared name so the */}}
            {{- /* tenant operator ingress backend always resolves correctly.        */}}
            {{- /* Skip when fullnameOverride == serviceName: the chart already      */}}
            {{- /* creates a Service with the correct name, so emitting our own      */}}
            {{- /* Object with the same name would conflict with Helm ownership.     */}}
            {{- $ingressSpec    := default dict $pSpec.ingress }}
            {{- $stableSvcName  := dig "serviceName" "" $ingressSpec }}
            {{- $fullnameOverride := dig "fullnameOverride" "" $extraVals }}
            {{- if and $stableSvcName (ne $stableSvcName $fullnameOverride) }}
            {{- $component := trimPrefix (printf "%s-" $app) $stableSvcName }}
            {{- $svcPort   := default 80 (dig "servicePort" 0 $ingressSpec | int) }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-stable-svc
              name: {{ $xrName }}-stable-svc
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Service
                  metadata:
                    name: {{ $stableSvcName }}
                    namespace: {{ $ns }}
                  spec:
                    selector:
                      app.kubernetes.io/instance: {{ $xrName }}-release
                      app.kubernetes.io/component: {{ $component }}
                    ports:
                    - name: http
                      port: {{ $svcPort }}
                      targetPort: {{ $svcPort }}
                      protocol: TCP
              providerConfigRef:
                name: kubernetes
            {{- end }}

            {{- /* ── Emit LDAP-search-init resources (when AppProfile requires ldap.search) */}}
            {{- /* Provisions a per-tenant LDAP search user in UDM and writes its          */}}
            {{- /* credential to OpenBao. Runs once; idempotent on retries.                */}}
            {{- $ldapReqs := default dict (dig "ldap" dict $identity) }}
            {{- if and $ldapReqs.search $ldapBaseDn $udmUrl }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-ldap-init-sa
              name: {{ $xrName }}-ldap-init-sa
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ServiceAccount
                  metadata:
                    name: app-init
                    namespace: {{ $ns }}
              providerConfigRef:
                name: kubernetes
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-ldap-init-cm
              name: {{ $xrName }}-ldap-init-cm
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: {{ $app }}-ldap-init
                    namespace: {{ $ns }}
                  data:
                    init.sh: |
                      #!/bin/sh
                      set -eu
                      apk add -q --no-progress --no-cache curl jq openssl 2>/dev/null
                      JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                      BAO_TOKEN=$(curl -sf "${BAO_ADDR}/v1/auth/kubernetes/login" \
                        -H 'Content-Type: application/json' \
                        -d "{\"role\":\"app-init\",\"jwt\":\"${JWT}\"}" \
                        | jq -r '.auth.client_token')
                      EXISTING=$(curl -sf \
                        -H "X-Vault-Token: ${BAO_TOKEN}" \
                        "${BAO_ADDR}/v1/secret/data/gentian-os/tenants/${TENANT}/apps/${APP}/ldap" \
                        2>/dev/null || echo '{}')
                      if echo "${EXISTING}" | jq -e '.data.data."bind-password"' >/dev/null 2>&1; then
                        echo "[ldap-init] credential already present for ${TENANT}/${APP} — skipping"
                        exit 0
                      fi
                      if [ "${SECRET_MODE}" = "random" ]; then
                        PASSWORD=$(openssl rand -hex 32)
                      else
                        MASTER=$(curl -sf \
                          -H "X-Vault-Token: ${BAO_TOKEN}" \
                          "${BAO_ADDR}/v1/secret/data/gentian-os/kernel/master-password" \
                          | jq -r '.data.data.value')
                        PASSWORD=$(printf '%s:%s:ldap-search' "${TENANT}" "${APP}" \
                          | openssl dgst -sha256 -hmac "${MASTER}" | awk '{print $2}')
                      fi
                      NUBUS=$(curl -sf \
                        -H "X-Vault-Token: ${BAO_TOKEN}" \
                        "${BAO_ADDR}/v1/secret/data/gentian-os/kernel/identity/nubus")
                      ADMIN_PW=$(echo "${NUBUS}" | jq -r '.data.data.admin_password')
                      USERNAME="ldapsearch-${TENANT}-${APP}"
                      BIND_DN="uid=${USERNAME},cn=users,${LDAP_BASE_DN}"
                      DN_ENC=$(printf '%s' "${BIND_DN}" | jq -Rr @uri)
                      HTTP_CREATE=$(curl -sf -o /tmp/resp -w '%{http_code}' \
                        "${UDM_URL}/univention/udm/users/user/" \
                        -u "Administrator:${ADMIN_PW}" \
                        -H 'Content-Type: application/json' \
                        -d "{\"properties\":{\"username\":\"${USERNAME}\",\"lastname\":\"LDAP-Search\",\"password\":\"${PASSWORD}\",\"primaryGroup\":\"cn=Domain Service Users,cn=groups,${LDAP_BASE_DN}\"},\"position\":\"cn=users,${LDAP_BASE_DN}\"}" \
                        2>/dev/null || echo '000')
                      case "${HTTP_CREATE}" in
                        201) echo "[ldap-init] UDM user ${USERNAME} created" ;;
                        422|409)
                          echo "[ldap-init] UDM user ${USERNAME} already exists — updating password"
                          curl -sf \
                            "${UDM_URL}/univention/udm/users/user/${DN_ENC}" \
                            -u "Administrator:${ADMIN_PW}" \
                            -X PATCH \
                            -H 'Content-Type: application/json' \
                            -d "{\"properties\":{\"password\":\"${PASSWORD}\"}}" >/dev/null ;;
                        *) echo "[ldap-init] ERROR: UDM create HTTP ${HTTP_CREATE}"; cat /tmp/resp; exit 1 ;;
                      esac
                      curl -sf \
                        -H "X-Vault-Token: ${BAO_TOKEN}" \
                        -H 'Content-Type: application/json' \
                        -X POST \
                        -d "{\"data\":{\"bind-dn\":\"${BIND_DN}\",\"bind-password\":\"${PASSWORD}\",\"base-dn\":\"${LDAP_BASE_DN}\"}}" \
                        "${BAO_ADDR}/v1/secret/data/gentian-os/tenants/${TENANT}/apps/${APP}/ldap"
                      echo "[ldap-init] OpenBao credential written for ${TENANT}/${APP}"
              providerConfigRef:
                name: kubernetes
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-ldap-init-job
              name: {{ $xrName }}-ldap-init-job
            spec:
              forProvider:
                manifest:
                  apiVersion: batch/v1
                  kind: Job
                  metadata:
                    name: {{ $app }}-ldap-init
                    namespace: {{ $ns }}
                    labels:
                      app.kubernetes.io/managed-by: gentian-os
                      gentianos.io/tenant: {{ $tenant }}
                      gentianos.io/app: {{ $app }}
                  spec:
                    ttlSecondsAfterFinished: 3600
                    backoffLimit: 10
                    template:
                      spec:
                        serviceAccountName: app-init
                        restartPolicy: OnFailure
                        volumes:
                          - name: scripts
                            configMap:
                              name: {{ $app }}-ldap-init
                        containers:
                          - name: ldap-search-init
                            image: alpine:3.20
                            command:
                              - /bin/sh
                              - -c
                              - apk add -q --no-progress --no-cache curl jq openssl 2>/dev/null && exec /bin/sh /scripts/init.sh
                            volumeMounts:
                              - name: scripts
                                mountPath: /scripts
                            env:
                              - name: TENANT
                                value: {{ $tenant }}
                              - name: APP
                                value: {{ $app }}
                              - name: BAO_ADDR
                                value: "http://openbao.openbao.svc.cluster.local:8200"
                              - name: UDM_URL
                                value: {{ $udmUrl | quote }}
                              - name: LDAP_BASE_DN
                                value: {{ $ldapBaseDn | quote }}
                              - name: SECRET_MODE
                                value: {{ $secretMode | quote }}
              providerConfigRef:
                name: kubernetes
            {{- end }}

            {{- /* ── Emit S3-init resources (when AppProfile requires storage.s3.bucketPerTenant) */}}
            {{- /* Provisions a per-tenant MinIO user + bucket and writes credentials            */}}
            {{- /* to OpenBao at tenants/<tenant>/apps/<app>/s3. Idempotent on retries.         */}}
            {{- $storageReqs := default dict $kr.storage }}
            {{- $s3Reqs      := default dict $storageReqs.s3 }}
            {{- if and $s3Reqs.bucketPerTenant $minioEndpoint }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-s3-init-sa
              name: {{ $xrName }}-s3-init-sa
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ServiceAccount
                  metadata:
                    name: app-init
                    namespace: {{ $ns }}
              providerConfigRef:
                name: kubernetes
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-s3-init-cm
              name: {{ $xrName }}-s3-init-cm
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: {{ $app }}-s3-init
                    namespace: {{ $ns }}
                  data:
                    init.sh: |
                      #!/bin/sh
                      set -eu
                      apk add -q --no-progress --no-cache curl jq openssl 2>/dev/null
                      JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                      BAO_TOKEN=$(curl -sf "${BAO_ADDR}/v1/auth/kubernetes/login" \
                        -H 'Content-Type: application/json' \
                        -d "{\"role\":\"app-init\",\"jwt\":\"${JWT}\"}" \
                        | jq -r '.auth.client_token')
                      EXISTING=$(curl -sf \
                        -H "X-Vault-Token: ${BAO_TOKEN}" \
                        "${BAO_ADDR}/v1/secret/data/gentian-os/tenants/${TENANT}/apps/${APP}/s3" \
                        2>/dev/null || echo '{}')
                      if echo "${EXISTING}" | jq -e '.data.data."secret-key"' >/dev/null 2>&1; then
                        echo "[s3-init] credential already present for ${TENANT}/${APP} — skipping"
                        exit 0
                      fi
                      MINIO=$(curl -sf \
                        -H "X-Vault-Token: ${BAO_TOKEN}" \
                        "${BAO_ADDR}/v1/secret/data/gentian-os/kernel/storage/minio")
                      ROOT_USER=$(echo "${MINIO}" | jq -r '.data.data.root_user')
                      ROOT_PASS=$(echo "${MINIO}" | jq -r '.data.data.root_password')
                      if [ "${SECRET_MODE}" = "random" ]; then
                        SECRET_KEY=$(openssl rand -hex 32)
                      else
                        MASTER=$(curl -sf \
                          -H "X-Vault-Token: ${BAO_TOKEN}" \
                          "${BAO_ADDR}/v1/secret/data/gentian-os/kernel/master-password" \
                          | jq -r '.data.data.value')
                        SECRET_KEY=$(printf '%s:%s:s3' "${TENANT}" "${APP}" \
                          | openssl dgst -sha256 -hmac "${MASTER}" | awk '{print $2}')
                      fi
                      ACCESS_KEY="${TENANT}-${APP}"
                      BUCKET="${TENANT}-${APP}"
                      mc alias set minio "${MINIO_ENDPOINT}" "${ROOT_USER}" "${ROOT_PASS}" >/dev/null
                      mc mb --ignore-existing "minio/${BUCKET}"
                      echo "[s3-init] bucket ${BUCKET} ensured"
                      mc admin user add minio "${ACCESS_KEY}" "${SECRET_KEY}"
                      echo "[s3-init] MinIO user ${ACCESS_KEY} created"
                      printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["arn:aws:iam:::user/%s"]},"Action":["s3:*"],"Resource":["arn:aws:s3:::%s","arn:aws:s3:::%s/*"]}]}' \
                        "${ACCESS_KEY}" "${BUCKET}" "${BUCKET}" > /tmp/policy.json
                      mc admin policy create minio "${ACCESS_KEY}-policy" /tmp/policy.json
                      mc admin policy attach minio "${ACCESS_KEY}-policy" --user "${ACCESS_KEY}"
                      echo "[s3-init] bucket policy attached"
                      curl -sf \
                        -H "X-Vault-Token: ${BAO_TOKEN}" \
                        -H 'Content-Type: application/json' \
                        -X POST \
                        -d "{\"data\":{\"endpoint\":\"${MINIO_ENDPOINT}\",\"bucket\":\"${BUCKET}\",\"access-key\":\"${ACCESS_KEY}\",\"secret-key\":\"${SECRET_KEY}\",\"region\":\"us-east-1\"}}" \
                        "${BAO_ADDR}/v1/secret/data/gentian-os/tenants/${TENANT}/apps/${APP}/s3"
                      echo "[s3-init] OpenBao credential written for ${TENANT}/${APP}"
              providerConfigRef:
                name: kubernetes
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-s3-init-job
              name: {{ $xrName }}-s3-init-job
            spec:
              forProvider:
                manifest:
                  apiVersion: batch/v1
                  kind: Job
                  metadata:
                    name: {{ $app }}-s3-init
                    namespace: {{ $ns }}
                    labels:
                      app.kubernetes.io/managed-by: gentian-os
                      gentianos.io/tenant: {{ $tenant }}
                      gentianos.io/app: {{ $app }}
                  spec:
                    ttlSecondsAfterFinished: 3600
                    backoffLimit: 10
                    template:
                      spec:
                        serviceAccountName: app-init
                        restartPolicy: OnFailure
                        volumes:
                          - name: scripts
                            configMap:
                              name: {{ $app }}-s3-init
                        containers:
                          - name: s3-init
                            image: alpine:3.20
                            command:
                              - /bin/sh
                              - -c
                              - apk add -q --no-progress --no-cache curl jq openssl minio-client 2>/dev/null && exec /bin/sh /scripts/init.sh
                            volumeMounts:
                              - name: scripts
                                mountPath: /scripts
                            env:
                              - name: TENANT
                                value: {{ $tenant }}
                              - name: APP
                                value: {{ $app }}
                              - name: BAO_ADDR
                                value: "http://openbao.openbao.svc.cluster.local:8200"
                              - name: MINIO_ENDPOINT
                                value: {{ $minioEndpoint | quote }}
                              - name: SECRET_MODE
                                value: {{ $secretMode | quote }}
              providerConfigRef:
                name: kubernetes
            {{- end }}

            {{- /* ── Emit database-init resources (when AppProfile requires database.databasePerTenant */}}
            {{- /* with engine=postgresql). Provisions a CNPG role + database and writes             */}}
            {{- /* credentials to OpenBao at tenants/<tenant>/apps/<app>/database.                   */}}
            {{- $dbRequirements := default dict $kr.database }}
            {{- if and $dbRequirements.databasePerTenant (eq (default "" $dbRequirements.engine) "postgresql") $cnpgHost }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-db-init-sa
              name: {{ $xrName }}-db-init-sa
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ServiceAccount
                  metadata:
                    name: app-init
                    namespace: {{ $ns }}
              providerConfigRef:
                name: kubernetes
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-db-init-cm
              name: {{ $xrName }}-db-init-cm
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: {{ $app }}-db-init
                    namespace: {{ $ns }}
                  data:
                    init.sh: |
                      #!/bin/sh
                      set -eu
                      apk add -q --no-progress --no-cache curl jq openssl postgresql-client 2>/dev/null
                      JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                      BAO_TOKEN=$(curl -sf "${BAO_ADDR}/v1/auth/kubernetes/login" \
                        -H 'Content-Type: application/json' \
                        -d "{\"role\":\"app-init\",\"jwt\":\"${JWT}\"}" \
                        | jq -r '.auth.client_token')
                      EXISTING=$(curl -sf \
                        -H "X-Vault-Token: ${BAO_TOKEN}" \
                        "${BAO_ADDR}/v1/secret/data/gentian-os/tenants/${TENANT}/apps/${APP}/database" \
                        2>/dev/null || echo '{}')
                      if echo "${EXISTING}" | jq -e '.data.data.password' >/dev/null 2>&1; then
                        echo "[db-init] credential already present for ${TENANT}/${APP} — skipping"
                        exit 0
                      fi
                      CNPG=$(curl -sf \
                        -H "X-Vault-Token: ${BAO_TOKEN}" \
                        "${BAO_ADDR}/v1/secret/data/gentian-os/kernel/database/cnpg")
                      SU_USER=$(echo "${CNPG}" | jq -r '.data.data.superuser_username')
                      SU_PASS=$(echo "${CNPG}" | jq -r '.data.data.superuser_password')
                      if [ "${SECRET_MODE}" = "random" ]; then
                        PASSWORD=$(openssl rand -hex 32)
                      else
                        MASTER=$(curl -sf \
                          -H "X-Vault-Token: ${BAO_TOKEN}" \
                          "${BAO_ADDR}/v1/secret/data/gentian-os/kernel/master-password" \
                          | jq -r '.data.data.value')
                        PASSWORD=$(printf '%s:%s:database' "${TENANT}" "${APP}" \
                          | openssl dgst -sha256 -hmac "${MASTER}" | awk '{print $2}')
                      fi
                      ROLE=$(printf '%s_%s' "${TENANT}" "${APP}" | tr '-' '_')
                      DBNAME="${ROLE}"
                      export PGPASSWORD="${SU_PASS}"
                      psql -h "${CNPG_HOST}" -U "${SU_USER}" -d postgres -v ON_ERROR_STOP=1 <<SQL
                      DO \$\$
                      BEGIN
                        IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '${ROLE}') THEN
                          CREATE ROLE "${ROLE}" WITH LOGIN PASSWORD '${PASSWORD}';
                        ELSE
                          ALTER ROLE "${ROLE}" WITH PASSWORD '${PASSWORD}';
                        END IF;
                      END \$\$;
                      SQL
                      psql -h "${CNPG_HOST}" -U "${SU_USER}" -d postgres -v ON_ERROR_STOP=1 \
                        -c "SELECT 'CREATE DATABASE \"${DBNAME}\" OWNER \"${ROLE}\"' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '${DBNAME}')" \
                        | grep -q 'CREATE DATABASE' \
                        && psql -h "${CNPG_HOST}" -U "${SU_USER}" -d postgres \
                             -c "CREATE DATABASE \"${DBNAME}\" OWNER \"${ROLE}\"" || true
                      psql -h "${CNPG_HOST}" -U "${SU_USER}" -d "${DBNAME}" -v ON_ERROR_STOP=1 \
                        -c "CREATE SCHEMA IF NOT EXISTS \"${DBNAME}\" AUTHORIZATION \"${ROLE}\";"
                      psql -h "${CNPG_HOST}" -U "${SU_USER}" -d "${DBNAME}" -v ON_ERROR_STOP=1 \
                        -c "GRANT ALL ON SCHEMA \"${DBNAME}\" TO \"${ROLE}\";"
                      psql -h "${CNPG_HOST}" -U "${SU_USER}" -d postgres -v ON_ERROR_STOP=1 \
                        -c "ALTER ROLE \"${ROLE}\" SET search_path TO \"${DBNAME}\", public;"
                      echo "[db-init] role ${ROLE}, database ${DBNAME}, and schema ${DBNAME} ensured"
                      curl -sf \
                        -H "X-Vault-Token: ${BAO_TOKEN}" \
                        -H 'Content-Type: application/json' \
                        -X POST \
                        -d "{\"data\":{\"host\":\"${CNPG_HOST}\",\"port\":\"5432\",\"name\":\"${DBNAME}\",\"user\":\"${ROLE}\",\"password\":\"${PASSWORD}\"}}" \
                        "${BAO_ADDR}/v1/secret/data/gentian-os/tenants/${TENANT}/apps/${APP}/database"
                      echo "[db-init] OpenBao credential written for ${TENANT}/${APP}"
              providerConfigRef:
                name: kubernetes
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-db-init-job
              name: {{ $xrName }}-db-init-job
            spec:
              forProvider:
                manifest:
                  apiVersion: batch/v1
                  kind: Job
                  metadata:
                    name: {{ $app }}-db-init
                    namespace: {{ $ns }}
                    labels:
                      app.kubernetes.io/managed-by: gentian-os
                      gentianos.io/tenant: {{ $tenant }}
                      gentianos.io/app: {{ $app }}
                  spec:
                    ttlSecondsAfterFinished: 3600
                    backoffLimit: 10
                    template:
                      spec:
                        serviceAccountName: app-init
                        restartPolicy: OnFailure
                        volumes:
                          - name: scripts
                            configMap:
                              name: {{ $app }}-db-init
                        containers:
                          - name: database-init
                            image: alpine:3.20
                            command:
                              - /bin/sh
                              - -c
                              - apk add -q --no-progress --no-cache curl jq openssl postgresql-client 2>/dev/null && exec /bin/sh /scripts/init.sh
                            volumeMounts:
                              - name: scripts
                                mountPath: /scripts
                            env:
                              - name: TENANT
                                value: {{ $tenant }}
                              - name: APP
                                value: {{ $app }}
                              - name: BAO_ADDR
                                value: "http://openbao.openbao.svc.cluster.local:8200"
                              - name: CNPG_HOST
                                value: {{ $cnpgHost | quote }}
                              - name: SECRET_MODE
                                value: {{ $secretMode | quote }}
              providerConfigRef:
                name: kubernetes
            {{- end }}

    # ── Step 3: Mark XR Ready when all composed resources are Ready ───────────
    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready
