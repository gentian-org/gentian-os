apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: app-element
  labels:
    gentianos.io/composition: app
    gentianos.io/app-variant: element
spec:
  compositeTypeRef:
    apiVersion: gentianos.io/v1alpha1
    kind: XApp
  mode: Pipeline
  pipeline:

    # ── Step 1: Fetch AppProfile + kernel/cluster ConfigMaps ──────────────────
    - step: fetch-extra-resources
      functionRef:
        name: function-extra-resources
      input:
        apiVersion: extra-resources.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          extraResources:
            - kind: AppProfile
              into: appProfile
              apiVersion: gentianos.io/v1alpha1
              type: Selector
              selector:
                maxMatch: 1
                minMatch: 1
                matchLabels:
                  - key: gentianos.io/profile-name
                    type: FromCompositeFieldPath
                    valueFromFieldPath: spec.profileRef.name
            - kind: ConfigMap
              into: kernelServices
              apiVersion: v1
              type: Selector
              selector:
                maxMatch: 1
                matchLabels:
                  - key: gentianos.io/config-type
                    type: Value
                    value: kernel-services
            - kind: ConfigMap
              into: clusterConfig
              apiVersion: v1
              type: Selector
              selector:
                maxMatch: 1
                matchLabels:
                  - key: gentianos.io/config-type
                    type: Value
                    value: cluster-config
            - kind: ConfigMap
              into: jitsiOidcOverlays
              apiVersion: v1
              type: Selector
              selector:
                maxMatch: 1
                minMatch: 0
                matchLabels:
                  - key: gentianos.io/config-type
                    type: Value
                    value: jitsi-oidc-overlays

    # ── Step 2: Render composed resources ─────────────────────────────────────
    # Element variant: deploys five charts plus optional sidecars (Jitsi):
    #   1. opendesk-element      (frontend)          — AppProfile spec.chart
    #   2. opendesk-synapse      (Matrix homeserver) — hardcoded chart ref
    #   3. opendesk-synapse-create-account (UVS bootstrap Job)
    #   4. opendesk-matrix-user-verification-service (Jitsi hybrid_matrix_token)
    #   5. opendesk-synapse-web  (nginx proxy; matrix edge via additionalIngresses)
    #
    # Shares the same ExternalSecret and set[] entries as app-default since
    # both opendesk-element and opendesk-synapse use identical value paths
    # for OIDC, database, SMTP, and app-internal secrets.
    - step: render-app-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr     := .observed.composite.resource }}
            {{- $spec   := $xr.spec }}
            {{- $xrName := $xr.metadata.name }}
            {{- $app    := $spec.claimRef.name }}
            {{- $ns     := $spec.tenantNamespace }}
            {{- $tenant := trimPrefix "tenant-" $ns }}

            {{- $extraRes  := index .context "apiextensions.crossplane.io/extra-resources" }}
            {{- $profiles  := dig "appProfile" list $extraRes }}
            {{- if eq (len $profiles) 0 }}
              {{- fail (printf "AppProfile %q not found in cluster" $spec.profileRef.name) }}
            {{- end }}
            {{- $profile   := index $profiles 0 }}
            {{- $pSpec     := dig "spec" dict $profile }}
            {{- $vm        := default dict $pSpec.valueMapping }}
            {{- $appSecrets := default list $pSpec.appSecrets }}
            {{- $chart     := $pSpec.chart }}

            {{- $ccRes      := dig "clusterConfig" list $extraRes }}
            {{- $ccCM       := default dict (index $ccRes 0) }}
            {{- $ccData     := dig "data" dict $ccCM }}
            {{- $ldapBaseDn    := dig "ldap.baseDn"    "" $ccData }}
            {{- $udmUrl        := dig "udm.url"        "" $ccData }}
            {{- $secretMode    := dig "secretMode"     "derived" $ccData }}
            {{- $cnpgHost      := dig "cnpg.host"      "" $ccData }}
            {{- $nodeIP        := dig "node.ip"        "" $ccData }}
            {{- $appInitImage  := dig "appInit.image"  "ghcr.io/gentian-org/gentian-app-init:develop" $ccData }}
            {{- $kr            := default dict $pSpec.kernelRequirements }}
            {{- $identity      := default dict $kr.identity }}

            {{- /* ── Build ExternalSecret data[] entries (identical to app-default) ── */}}
            {{- $esData := list }}

            {{- if $vm.oidc }}
            {{- $oidcPath := printf "gentian-os/tenants/%s/apps/%s/oidc" $tenant $app }}
            {{- if $vm.oidc.issuerKey }}
            {{- $esData = append $esData (dict "secretKey" "oidc-issuer"        "remoteRef" (dict "key" $oidcPath "property" "issuer")) }}
            {{- end }}
            {{- if $vm.oidc.clientIdKey }}
            {{- $esData = append $esData (dict "secretKey" "oidc-client-id"     "remoteRef" (dict "key" $oidcPath "property" "client-id")) }}
            {{- end }}
            {{- if $vm.oidc.clientSecretKey }}
            {{- $csPath := default $oidcPath $vm.oidc.clientSecretOpenbaoPath }}
            {{- $csProp := default "client-secret" $vm.oidc.clientSecretOpenbaoProperty }}
            {{- $esData = append $esData (dict "secretKey" "oidc-client-secret" "remoteRef" (dict "key" $csPath "property" $csProp)) }}
            {{- end }}
            {{- end }}

            {{- if $vm.database }}
            {{- $dbPath := printf "gentian-os/tenants/%s/apps/%s/database" $tenant $app }}
            {{- if $vm.database.hostKey }}
            {{- $esData = append $esData (dict "secretKey" "db-host"     "remoteRef" (dict "key" $dbPath "property" "host")) }}
            {{- end }}
            {{- if $vm.database.portKey }}
            {{- $esData = append $esData (dict "secretKey" "db-port"     "remoteRef" (dict "key" $dbPath "property" "port")) }}
            {{- end }}
            {{- if $vm.database.nameKey }}
            {{- $esData = append $esData (dict "secretKey" "db-name"     "remoteRef" (dict "key" $dbPath "property" "name")) }}
            {{- end }}
            {{- if $vm.database.userKey }}
            {{- $esData = append $esData (dict "secretKey" "db-user"     "remoteRef" (dict "key" $dbPath "property" "user")) }}
            {{- end }}
            {{- if $vm.database.passwordKey }}
            {{- $esData = append $esData (dict "secretKey" "db-password" "remoteRef" (dict "key" $dbPath "property" "password")) }}
            {{- end }}
            {{- end }}

            {{- if $vm.smtp }}
            {{- $smtpPath := printf "gentian-os/tenants/%s/apps/%s/smtp" $tenant $app }}
            {{- if $vm.smtp.hostKey }}
            {{- $esData = append $esData (dict "secretKey" "smtp-host"     "remoteRef" (dict "key" $smtpPath "property" "host")) }}
            {{- end }}
            {{- if $vm.smtp.portKey }}
            {{- $esData = append $esData (dict "secretKey" "smtp-port"     "remoteRef" (dict "key" $smtpPath "property" "port")) }}
            {{- end }}
            {{- if $vm.smtp.userKey }}
            {{- $esData = append $esData (dict "secretKey" "smtp-user"     "remoteRef" (dict "key" $smtpPath "property" "user")) }}
            {{- end }}
            {{- if $vm.smtp.passwordKey }}
            {{- $esData = append $esData (dict "secretKey" "smtp-password" "remoteRef" (dict "key" $smtpPath "property" "password")) }}
            {{- end }}
            {{- end }}

            {{- range $s := $appSecrets }}
            {{- if and $s.name $s.valuePath }}
            {{- $internalPath := printf "gentian-os/tenants/%s/apps/%s/internal/%s" $tenant $app $s.name }}
            {{- $esData = append $esData (dict "secretKey" (printf "internal-%s" $s.name)
                "remoteRef" (dict "key" $internalPath "property" "value")) }}
            {{- end }}
            {{- end }}

            {{- /* ── Emit OpenBao KV seeders for app-internal secrets ────────── */}}
            {{- range $s := $appSecrets }}
            {{- if and $s.name $s.valuePath }}
            {{- $safeName := $s.name | replace "_" "-" }}
            {{- $seedName := printf "%s-%s-seed" $xrName $safeName }}
            {{- $kvPath   := printf "gentian-os/tenants/%s/apps/%s/internal/%s" $tenant $app $s.name }}
            {{- $seedVal  := sha256sum (printf "%s:%s:%s" $xrName $app $s.name) }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-{{ $safeName }}-seed-secret
              name: {{ $seedName }}
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: {{ $seedName }}
                    namespace: crossplane-system
                  type: Opaque
                  stringData:
                    data.json: '{"value":"{{ $seedVal }}"}'
              providerConfigRef:
                name: kubernetes
            ---
            apiVersion: kv.vault.upbound.io/v1alpha1
            kind: SecretV2
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-{{ $safeName }}-kv
              name: {{ $seedName }}-kv
            spec:
              deletionPolicy: Orphan
              managementPolicies:
                - Observe
                - Create
              forProvider:
                mount: secret
                name: {{ $kvPath }}
                dataJsonSecretRef:
                  name: {{ $seedName }}
                  namespace: crossplane-system
                  key: data.json
              providerConfigRef:
                name: openbao
            {{- end }}
            {{- end }}

            {{- /* ── Build set[] entries (shared by element + synapse releases) ── */}}
            {{- $secretName := printf "%s-sensitive-values" $app }}
            {{- $relSet := list }}

            {{- if $vm.oidc }}
            {{- if $vm.oidc.issuerKey }}
            {{- $relSet = append $relSet (dict "name" $vm.oidc.issuerKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "oidc-issuer"))) }}
            {{- end }}
            {{- if $vm.oidc.clientIdKey }}
            {{- $relSet = append $relSet (dict "name" $vm.oidc.clientIdKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "oidc-client-id"))) }}
            {{- end }}
            {{- if $vm.oidc.clientSecretKey }}
            {{- $relSet = append $relSet (dict "name" $vm.oidc.clientSecretKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "oidc-client-secret"))) }}
            {{- end }}
            {{- end }}

            {{- if $vm.database }}
            {{- if $vm.database.hostKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.hostKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-host"))) }}
            {{- end }}
            {{- if $vm.database.portKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.portKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-port"))) }}
            {{- end }}
            {{- if $vm.database.nameKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.nameKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-name"))) }}
            {{- end }}
            {{- if $vm.database.readNameKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.readNameKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-name"))) }}
            {{- end }}
            {{- if $vm.database.userKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.userKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-user"))) }}
            {{- end }}
            {{- if $vm.database.readUserKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.readUserKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-user"))) }}
            {{- end }}
            {{- if $vm.database.passwordKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.passwordKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-password"))) }}
            {{- end }}
            {{- end }}

            {{- if $vm.smtp }}
            {{- if $vm.smtp.hostKey }}
            {{- $relSet = append $relSet (dict "name" $vm.smtp.hostKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "smtp-host"))) }}
            {{- end }}
            {{- if $vm.smtp.portKey }}
            {{- $relSet = append $relSet (dict "name" $vm.smtp.portKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "smtp-port"))) }}
            {{- end }}
            {{- if $vm.smtp.userKey }}
            {{- $relSet = append $relSet (dict "name" $vm.smtp.userKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "smtp-user"))) }}
            {{- end }}
            {{- if $vm.smtp.passwordKey }}
            {{- $relSet = append $relSet (dict "name" $vm.smtp.passwordKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "smtp-password"))) }}
            {{- end }}
            {{- end }}

            {{- range $s := $appSecrets }}
            {{- if and $s.name $s.valuePath (ne $s.name "matrix_uvs_password") }}
            {{- $relSet = append $relSet (dict "name" $s.valuePath
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" (printf "internal-%s" $s.name)))) }}
            {{- end }}
            {{- end }}

            {{- /* ── Synapse release set[]: exclude appServiceConfigs entries ─── */}}
            {{- /* The appServiceConfigs[*].as_token entries are element-frontend  */}}
            {{- /* bridge config. Passing them to synapse alongside the empty      */}}
            {{- /* appServiceConfigs: [] in values would re-create incomplete app  */}}
            {{- /* service objects (only as_token), causing Synapse to fail with   */}}
            {{- /* "Required string field: 'id'". Filter them here.                */}}
            {{- $synapseRelSet := list }}
            {{- range $entry := $relSet }}
            {{- if not (contains "appServiceConfigs" ($entry.name | default "")) }}
            {{- $synapseRelSet = append $synapseRelSet $entry }}
            {{- end }}
            {{- end }}

            {{- /* ── Resolve non-sensitive values (domain + kernel substitution) ── */}}
            {{- $domain := default (printf "%s.example.org" $tenant) $spec.domain }}
            {{- $extraVals := dict }}
            {{- $kernelDomain := "" }}
            {{- if $pSpec.extraValues }}
            {{- $ksRes := dig "kernelServices" list $extraRes }}
            {{- $ksCM  := default dict (index $ksRes 0) }}
            {{- $ksCMData := dig "data" dict $ksCM }}
            {{- $kernelDomain = dig "KERNEL_DOMAIN" "" $ksCMData }}
            {{- $turnHost     := dig "TURN_HOST"         "" $ksCMData }}
            {{- $turnPort     := dig "TURN_PORT"         "3478" $ksCMData }}
            {{- $turnTLSHost  := dig "TURN_TLS_HOST"     "" $ksCMData }}
            {{- $turnTLSPort  := dig "TURN_TLS_PORT"     "5349" $ksCMData }}
            {{- $turnTransport := dig "TURN_TRANSPORT"   "udp" $ksCMData }}
            {{- $turnCreds    := dig "TURN_CREDENTIALS"  "" $ksCMData }}
            {{- $raw := $pSpec.extraValues | toJson }}
            {{- $raw = $raw | replace "${TENANT_DOMAIN}"    $domain }}
            {{- $raw = $raw | replace "${TENANT_NAMESPACE}" $ns }}
            {{- $raw = $raw | replace "${TENANT_NAME}"     $tenant }}
            {{- $raw = $raw | replace "${TENANT_ID}"         $tenant }}
            {{- if $kernelDomain }}{{ $raw = $raw | replace "${KERNEL_DOMAIN}" $kernelDomain }}{{ end }}
            {{- $raw = $raw | replace "${TURN_HOST}"        $turnHost }}
            {{- $raw = $raw | replace "${TURN_PORT}"        $turnPort }}
            {{- $raw = $raw | replace "${TURN_TLS_HOST}"    $turnTLSHost }}
            {{- $raw = $raw | replace "${TURN_TLS_PORT}"   $turnTLSPort }}
            {{- $raw = $raw | replace "${TURN_TRANSPORT}" $turnTransport }}
            {{- $raw = $raw | replace "${TURN_CREDENTIALS}" $turnCreds }}
            {{- if $nodeIP }}{{ $raw = $raw | replace "${NODE_IP}" $nodeIP }}{{ end }}
            {{- $extraVals = $raw | fromJson }}
            {{- end }}
            {{- if and $spec.config $spec.config.extraValues }}
            {{- $extraVals = mergeOverwrite $extraVals $spec.config.extraValues }}
            {{- end }}
            {{- if and $spec.config $spec.config.replicas }}
            {{- $extraVals = mergeOverwrite $extraVals (dict "replicaCount" $spec.config.replicas) }}
            {{- end }}

            {{- /* Element web-only config: merge into config.json, not homeserver.yaml */}}
            {{- $elementExtraVals := deepCopy $extraVals }}
            {{- $elementConf := dig "configuration" dict $elementExtraVals }}
            {{- $elementAddConf := dig "additionalConfiguration" dict $elementConf }}
            {{- $elementAddConf = mergeOverwrite $elementAddConf (dict
                "sso_redirect_options" (dict "immediate" true "on_welcome_page" true)
            ) }}
            {{- $elementConf = mergeOverwrite $elementConf (dict "additionalConfiguration" $elementAddConf) }}
            {{- $elementExtraVals = mergeOverwrite $elementExtraVals (dict "configuration" $elementConf) }}

            {{- /* opendesk/Bitnami charts expect imagePullSecrets as a string list   */}}
            {{- /* (["registry-credentials"]), not K8s object form ({name: ...}).   */}}
            {{- $rawImagePull := dig "imagePullSecrets" list $extraVals }}
            {{- $imagePull := list }}
            {{- range $entry := $rawImagePull }}
            {{- if kindIs "string" $entry }}
            {{- $imagePull = append $imagePull $entry }}
            {{- else if kindIs "map" $entry }}
            {{- $pullName := dig "name" "" $entry }}
            {{- if $pullName }}{{- $imagePull = append $imagePull $pullName }}{{- end }}
            {{- end }}
            {{- end }}
            {{- if eq (len $imagePull) 0 }}
            {{- $imagePull = list "registry-credentials" }}
            {{- end }}
            {{- $elementExtraVals = mergeOverwrite $elementExtraVals (dict
                "imagePullSecrets" $imagePull
                "global" (mergeOverwrite (dig "global" dict $elementExtraVals) (dict "imagePullSecrets" $imagePull))
            ) }}

            {{- /* ── Emit Keycloak Client CR ─────────────────────────────────────────── */}}
            {{- /* When kernelRequirements.identity.oidc is set, the composition   */}}
            {{- /* registers the app as an OIDC client in the tenant's own realm.  */}}
            {{- /* New apps only need to declare their oidc block in the AppProfile */}}
            {{- /* to get automatic per-tenant Keycloak client registration.        */}}
            {{- $oidcCl   := default dict $identity.oidc }}
            {{- if $oidcCl.clientId }}
            {{- $redirects  := list }}
            {{- range $uri := (default list $oidcCl.redirectUris) }}
            {{- $redirects = append $redirects ($uri | replace "${TENANT_DOMAIN}" $domain) }}
            {{- end }}
            {{- $postLogout := list }}
            {{- range $uri := (default list $oidcCl.postLogoutRedirectUris) }}
            {{- $postLogoutUri := $uri | replace "${TENANT_DOMAIN}" $domain | replace "${TENANT_ID}" $tenant }}
            {{- if $kernelDomain }}{{ $postLogoutUri = $postLogoutUri | replace "${KERNEL_DOMAIN}" $kernelDomain }}{{ end }}
            {{- $postLogout = append $postLogout $postLogoutUri }}
            {{- end }}
            ---
            apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
            kind: Client
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-keycloak-client
              name: {{ $tenant }}-{{ $app }}-keycloak-client
            spec:
              deletionPolicy: Delete
              forProvider:
                clientId: {{ $oidcCl.clientId | quote }}
                name: {{ default $oidcCl.clientId $oidcCl.name | quote }}
                realmId: {{ $tenant }}
                accessType: {{ default "PUBLIC" $oidcCl.accessType | quote }}
                standardFlowEnabled: true
                directAccessGrantsEnabled: {{ default false $oidcCl.directAccessGrantsEnabled }}
                serviceAccountsEnabled: false
                {{- if $redirects }}
                validRedirectUris:
                  {{ toYaml $redirects | nindent 18 }}
                {{- end }}
                webOrigins:
                  - "+"
                {{- if $postLogout }}
                validPostLogoutRedirectUris:
                  {{ toYaml $postLogout | nindent 18 }}
                {{- end }}
                {{- if and $oidcCl.backchannelLogoutUrl (ne $oidcCl.backchannelLogoutUrl "") }}
                backchannelLogoutUrl: {{ $oidcCl.backchannelLogoutUrl | replace "${TENANT_DOMAIN}" $domain | quote }}
                backchannelLogoutSessionRequired: true
                {{- end }}
                {{- if eq (default "PUBLIC" $oidcCl.accessType) "CONFIDENTIAL" }}
                clientSecretSecretRef:
                  name: {{ $xrName }}-oidc-client-creds
                  namespace: crossplane-system
                  key: client-secret
                {{- end }}
              providerConfigRef:
                name: keycloak
            {{- /* Browser flow (kernel IdP auto-redirect) is provisioned once per    */}}
            {{- /* tenant realm by the gentian-os identity reconciler, not per app.   */}}
            {{- end }}

            {{- /* ── Emit ExternalSecret ──────────────────────────────────────── */}}
            {{- if gt (len $esData) 0 }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-externalsecret
              name: {{ $xrName }}-es
            spec:
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1
                  kind: ExternalSecret
                  metadata:
                    name: {{ $secretName }}
                    namespace: {{ $ns }}
                  spec:
                    refreshInterval: 1h
                    secretStoreRef:
                      kind: ClusterSecretStore
                      name: openbao
                    target:
                      name: {{ $secretName }}
                      creationPolicy: Owner
                      deletionPolicy: Retain
                    data:
                      {{ toYaml $esData | nindent 22 }}
              providerConfigRef:
                name: kubernetes
            {{- end }}

            {{- /* ── Release 1: opendesk-element (frontend) ─────────────────── */}}
            {{- /* Identical to app-default — extraVals contain all frontend     */}}
            {{- /* values; the chart ignores any Synapse-specific keys.          */}}
            ---
            apiVersion: helm.crossplane.io/v1beta1
            kind: Release
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-release
              name: {{ $xrName }}-release
            spec:
              forProvider:
                chart:
                  repository: {{ $chart.repository }}
                  name: {{ $chart.name }}
                  version: {{ $chart.version | quote }}
                namespace: {{ $ns }}
                wait: false
                {{- if gt (len $elementExtraVals) 0 }}
                values:
                  {{ toYaml $elementExtraVals | nindent 18 }}
                {{- end }}
                {{- if gt (len $relSet) 0 }}
                set:
                  {{ toYaml $relSet | nindent 18 }}
                {{- end }}
              providerConfigRef:
                name: kubernetes

            {{- /* ── Release 2: opendesk-synapse (Matrix homeserver) ─────────── */}}
            {{- /* Uses the same secret set[] entries as the element release     */}}
            {{- /* (value paths are identical in both charts). Non-sensitive     */}}
            {{- /* config is taken from global.* + configuration.* in extraVals, */}}
            {{- /* overriding fullnameOverride to "opendesk-synapse" so the       */}}
            {{- /* headless Service matches the DNS name HAProxy in synapse-web   */}}
            {{- /* is hardcoded to resolve: opendesk-synapse.<ns>.svc.cluster.local */}}
            {{- $ksResStaging := dig "kernelServices" list $extraRes }}
            {{- $ksCMStaging  := default dict (index $ksResStaging 0) }}
            {{- $ksCMDataStaging := dig "data" dict $ksCMStaging }}
            {{- $acmeStaging := eq (dig "ACME_STAGING" "false" $ksCMDataStaging) "true" }}
            {{- $globalVals  := mergeOverwrite (dig "global" dict $extraVals) (dict "imagePullSecrets" $imagePull) }}
            {{- $confVals    := dig "configuration" dict $extraVals }}
            {{- if $acmeStaging }}
            {{- /* opendesk-synapse does not render homeserver.oidc.skip_verification into
                 oidc_providers. skip_verification only skips OIDC metadata checks anyway;
                 Twisted's outbound HTTP client (OIDC discovery) uses platformTrust() and
                 ignores REQUESTS_CA_BUNDLE — staging LE certs need the Synapse test flag. */}}
            {{- $addConf := dig "additionalConfiguration" dict $confVals }}
            {{- $addConf = mergeOverwrite $addConf (dict
                "use_insecure_ssl_client_just_for_testing_do_not_use" true
            ) }}
            {{- $confVals = mergeOverwrite $confVals (dict "additionalConfiguration" $addConf) }}
            {{- end }}
            {{- /* opendesk-synapse renders oidc_providers from configuration.homeserver.oidc
                 only; discover/endpoint fields in that block are ignored. With discover
                 enabled, startup loads JWKS over Twisted HTTPS to id.<kernel> which fails
                 on ACME staging hairpin (curl -k works; Twisted load_jwks times out).
                 Emit a single additionalConfiguration oidc_providers entry with
                 discover:false, explicit https endpoints, use_insecure_ssl (staging),
                 user_profile_method:userinfo_endpoint (skip startup JWKS fetch), and
                 strip homeserver.oidc so the chart does not emit a duplicate block. */}}
            {{- $publicIdBase := printf "https://id.%s/realms/%s" $kernelDomain $tenant }}
            {{- $profileOidc := dig "oidc" dict (dig "homeserver" dict $confVals) }}
            {{- $matrixLocalpart := default "opendesk_username" (dig "matrixIdLocalpart" "opendesk_username" $profileOidc) }}
            {{- $oidcScopes := default (list "openid" "opendesk-matrix-scope") (dig "scopes" list $profileOidc) }}
            {{- $addConf := dig "additionalConfiguration" dict $confVals }}
            {{- $oidcProvider := dict
                "idp_id" "oidc"
                "idp_name" "OIDC"
                "discover" false
                "scopes" $oidcScopes
                "authorization_endpoint" (printf "%s/protocol/openid-connect/auth" $publicIdBase)
                "token_endpoint" (printf "%s/protocol/openid-connect/token" $publicIdBase)
                "userinfo_endpoint" (printf "%s/protocol/openid-connect/userinfo" $publicIdBase)
                "jwks_uri" (printf "%s/protocol/openid-connect/certs" $publicIdBase)
                "user_profile_method" "userinfo_endpoint"
                "skip_verification" true
                "allow_existing_users" true
                "user_mapping_provider" (dict "config" (dict
                    "subject_template" "{{ "{{ user.opendesk_useruuid }}" }}"
                    "display_name_template" "{{ "{{ user.name }}" }}"
                    "localpart_template" (printf "{{ \"{{ user.%s }}\" }}" $matrixLocalpart)
                    "email_template" "{{ "{{ user.email }}" }}"
                ))
                "backchannel_logout_enabled" true
                "backchannel_logout_ignore_sub" true
            }}
            {{- $addConf = mergeOverwrite $addConf (dict "oidc_providers" (list $oidcProvider)) }}
            {{- $confVals = mergeOverwrite $confVals (dict "additionalConfiguration" $addConf) }}
            {{- $hsSyn := omit (dig "homeserver" dict $confVals) "oidc" }}
            {{- $confVals = mergeOverwrite $confVals (dict "homeserver" $hsSyn) }}
            {{- $synOidcRelSet := list }}
            {{- range $entry := $synapseRelSet }}
            {{- if not (contains "configuration.homeserver.oidc" ($entry.name | default "")) }}
            {{- $synOidcRelSet = append $synOidcRelSet $entry }}
            {{- end }}
            {{- end }}
            {{- if $vm.oidc }}
            {{- if $vm.oidc.issuerKey }}
            {{- $synOidcRelSet = append $synOidcRelSet (dict "name" "configuration.additionalConfiguration.oidc_providers[0].issuer"
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "oidc-issuer"))) }}
            {{- end }}
            {{- if $vm.oidc.clientIdKey }}
            {{- $synOidcRelSet = append $synOidcRelSet (dict "name" "configuration.additionalConfiguration.oidc_providers[0].client_id"
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "oidc-client-id"))) }}
            {{- end }}
            {{- if $vm.oidc.clientSecretKey }}
            {{- $synOidcRelSet = append $synOidcRelSet (dict "name" "configuration.additionalConfiguration.oidc_providers[0].client_secret"
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "oidc-client-secret"))) }}
            {{- end }}
            {{- end }}
            {{- $synapseRelSet = $synOidcRelSet }}
            {{- $synapseVals := dict
                "global"           $globalVals
                "configuration"    $confVals
                "fullnameOverride" "opendesk-synapse"
                "imagePullSecrets" $imagePull
                "replicaCount"     1
                "federation" (dict "ingress" (dict "enabled" false))
            }}
            {{- if $acmeStaging }}
            {{- $synapseVals = mergeOverwrite $synapseVals (dict
                "extraEnvVars" (list
                  (dict "name" "REQUESTS_CA_BUNDLE" "value" "/etc/ssl/certs/ca-certificates.crt")
                  (dict "name" "SSL_CERT_FILE" "value" "/etc/ssl/certs/ca-certificates.crt")
                  (dict "name" "SSL_CERT_DIR" "value" "/etc/ssl/certs")
                )
                "extraVolumes" (list
                  (dict "name" "trusted-cert-secret-volume" "secret" (dict
                    "secretName" "gentian-staging-ca-tls"
                    "items" (list (dict "key" "ca.crt" "path" "ca-certificates.crt"))
                  ))
                )
                "extraVolumeMounts" (list
                  (dict "name" "trusted-cert-secret-volume" "mountPath" "/etc/ssl/certs/ca-certificates.crt" "subPath" "ca-certificates.crt")
                )
            ) }}
            {{- end }}
            ---
            apiVersion: helm.crossplane.io/v1beta1
            kind: Release
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-synapse-release
              name: {{ $xrName }}-synapse-release
            spec:
              forProvider:
                chart:
                  repository: {{ $chart.repository }}
                  name: opendesk-synapse
                  version: {{ $chart.version | quote }}
                namespace: {{ $ns }}
                wait: false
                values:
                  {{ toYaml $synapseVals | nindent 18 }}
                {{- if gt (len $synapseRelSet) 0 }}
                set:
                  {{ toYaml $synapseRelSet | nindent 18 }}
                {{- end }}
              providerConfigRef:
                name: kubernetes

            {{- /* ── Release 3: UVS bootstrap (creates @uvs Matrix account) ─── */}}
            {{- $uvsBootstrapSet := list (dict "name" "configuration.password"
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "internal-matrix_uvs_password"))) }}
            {{- $uvsBootstrapVals := dict
                "configuration" (dict
                  "username" "uvs"
                  "pod" "opendesk-synapse-0"
                  "secretName" "opendesk-matrix-user-verification-service-account"
                )
                "fullnameOverride" "opendesk-matrix-user-verification-service-bootstrap"
                "global" (dict "imagePullSecrets" $imagePull)
                "image" (dict
                  "registry" "registry-1.docker.io"
                  "url" "alpine/k8s"
                  "tag" "1.34.0@sha256:b5f6edfeac5279f3e182d938d1ffecb62f7c980756ac4b6b66d7f0d566782f77"
                  "imagePullPolicy" "IfNotPresent"
                )
                "cleanup" (dict "deletePodsOnSuccess" true "deletePodsOnSuccessTimeout" 60)
                "securityContext" (dict
                  "allowPrivilegeEscalation" false
                  "capabilities" (dict "drop" (list "ALL"))
                  "privileged" false
                  "readOnlyRootFilesystem" true
                  "runAsGroup" 101
                  "runAsNonRoot" true
                  "runAsUser" 101
                  "seccompProfile" (dict "type" "RuntimeDefault")
                )
            }}
            ---
            apiVersion: helm.crossplane.io/v1beta1
            kind: Release
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-uvs-bootstrap-release
              name: {{ $xrName }}-uvs-bootstrap-release
            spec:
              forProvider:
                chart:
                  repository: {{ $chart.repository }}
                  name: opendesk-synapse-create-account
                  version: {{ $chart.version | quote }}
                namespace: {{ $ns }}
                wait: false
                values:
                  {{ toYaml $uvsBootstrapVals | nindent 18 }}
                set:
                  {{ toYaml $uvsBootstrapSet | nindent 18 }}
              providerConfigRef:
                name: kubernetes

            {{- /* ── Release 4: Matrix User Verification Service (Jitsi auth) ── */}}
            {{- $uvsVals := dict
                "global" $globalVals
                "imagePullSecrets" $imagePull
                "fullnameOverride" "opendesk-matrix-user-verification-service"
                "replicaCount" 1
                "extraEnvVars" (list
                  (dict "name" "UVS_ACCESS_TOKEN" "valueFrom" (dict "secretKeyRef" (dict "name" "opendesk-matrix-user-verification-service-account" "key" "access_token")))
                  (dict "name" "UVS_DISABLE_IP_BLACKLIST" "value" "true")
                )
                "image" (dict
                  "registry" "registry.opencode.de"
                  "repository" "bmi/opendesk/components/supplier/element/images-mirror/matrix-user-verification-service"
                  "tag" "v3.0.0@sha256:25e685d595785e2a72e75a525dac78cf8c782445454f8ac090d3702431c38008"
                  "imagePullPolicy" "IfNotPresent"
                )
                "containerSecurityContext" (dict
                  "allowPrivilegeEscalation" false
                  "capabilities" (dict "drop" (list "ALL"))
                  "enabled" true
                  "privileged" false
                  "readOnlyRootFilesystem" false
                  "runAsGroup" 1000
                  "runAsNonRoot" true
                  "runAsUser" 1000
                  "seccompProfile" (dict "type" "RuntimeDefault")
                )
                "podSecurityContext" (dict "enabled" true "fsGroup" 101)
                "resources" (dict
                  "limits" (dict "cpu" "3" "memory" "256Mi")
                  "requests" (dict "cpu" "100m" "memory" "128Mi")
                )
            }}
            ---
            apiVersion: helm.crossplane.io/v1beta1
            kind: Release
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-uvs-release
              name: {{ $xrName }}-uvs-release
            spec:
              forProvider:
                chart:
                  repository: {{ $chart.repository }}
                  name: opendesk-matrix-user-verification-service
                  version: {{ $chart.version | quote }}
                namespace: {{ $ns }}
                wait: false
                values:
                  {{ toYaml $uvsVals | nindent 18 }}
              providerConfigRef:
                name: kubernetes

            {{- /* ── Release 5: opendesk-synapse-web (nginx proxy, no chart ingress) */}}
            {{- /* matrix.{domain} edge routing is AppProfile additionalIngresses   */}}
            {{- /* (operator HTTPRoute in gateway mode, Ingress in ingress mode).   */}}
            {{- /* No secrets needed — it only proxies to the synapse service.   */}}
            {{- $synapseWebIngress := dict "enabled" false }}
            {{- $synapseWebVals := dict
                "global"           $globalVals
                "fullnameOverride" "synapse-web"
                "imagePullSecrets" $imagePull
                "replicaCount"     1
                "ingress"          $synapseWebIngress
            }}
            ---
            apiVersion: helm.crossplane.io/v1beta1
            kind: Release
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-synapse-web-release
              name: {{ $xrName }}-synapse-web-release
            spec:
              forProvider:
                chart:
                  repository: {{ $chart.repository }}
                  name: opendesk-synapse-web
                  version: {{ $chart.version | quote }}
                namespace: {{ $ns }}
                wait: false
                values:
                  {{ toYaml $synapseWebVals | nindent 18 }}
              providerConfigRef:
                name: kubernetes

            {{- /* ── Sidecars (e.g. Jitsi for Element video conferencing) ─────── */}}
            {{- $sidecars := default list $pSpec.sidecars }}
            {{- $jitsiOverlayRes  := dig "jitsiOidcOverlays" list $extraRes }}
            {{- $jitsiOverlayCM   := default dict (index $jitsiOverlayRes 0) }}
            {{- $jitsiOverlayData := dig "data" dict $jitsiOverlayCM }}
            {{- range $sidecar := $sidecars }}
            {{- $scName := $sidecar.name }}
            {{- $scAppKey := printf "%s-%s" $app $scName }}
            {{- $scXrName := printf "%s-sidecar-%s" $xrName $scName }}
            {{- $scChart := $sidecar.chart }}
            {{- $scSecrets := default list $sidecar.appSecrets }}
            {{- $scSecretName := printf "%s-sensitive-values" $scAppKey }}

            {{- /* Sidecar ExternalSecret data[] */}}
            {{- $scEsData := list }}
            {{- range $s := $scSecrets }}
            {{- if and $s.name $s.valuePath }}
            {{- $internalPath := printf "gentian-os/tenants/%s/apps/%s/internal/%s" $tenant $scAppKey $s.name }}
            {{- $scEsData = append $scEsData (dict "secretKey" (printf "internal-%s" $s.name)
                "remoteRef" (dict "key" $internalPath "property" "value")) }}
            {{- end }}
            {{- end }}

            {{- /* Seed sidecar app-internal secrets into OpenBao */}}
            {{- range $s := $scSecrets }}
            {{- if and $s.name $s.valuePath }}
            {{- $safeName := $s.name | replace "_" "-" }}
            {{- $seedName := printf "%s-%s-seed" $scXrName $safeName }}
            {{- $kvPath   := printf "gentian-os/tenants/%s/apps/%s/internal/%s" $tenant $scAppKey $s.name }}
            {{- $seedVal  := sha256sum (printf "%s:%s:%s" $scXrName $scAppKey $s.name) }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $scAppKey }}-{{ $safeName }}-seed-secret
              name: {{ $seedName }}
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: {{ $seedName }}
                    namespace: crossplane-system
                  type: Opaque
                  stringData:
                    data.json: '{"value":"{{ $seedVal }}"}'
              providerConfigRef:
                name: kubernetes
            ---
            apiVersion: kv.vault.upbound.io/v1alpha1
            kind: SecretV2
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $scAppKey }}-{{ $safeName }}-kv
              name: {{ $seedName }}-kv
            spec:
              deletionPolicy: Orphan
              managementPolicies:
                - Observe
                - Create
              forProvider:
                mount: secret
                name: {{ $kvPath }}
                dataJsonSecretRef:
                  name: {{ $seedName }}
                  namespace: crossplane-system
                  key: data.json
              providerConfigRef:
                name: openbao
            {{- end }}
            {{- end }}

            {{- if gt (len $scEsData) 0 }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $scAppKey }}-external-secret
              name: {{ $scXrName }}-external-secret
            spec:
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1
                  kind: ExternalSecret
                  metadata:
                    name: {{ $scSecretName }}
                    namespace: {{ $ns }}
                  spec:
                    refreshInterval: 1h
                    secretStoreRef:
                      kind: ClusterSecretStore
                      name: openbao
                    target:
                      name: {{ $scSecretName }}
                      creationPolicy: Owner
                      deletionPolicy: Retain
                    data:
                      {{ toYaml $scEsData | nindent 22 }}
              providerConfigRef:
                name: kubernetes
            {{- end }}

            {{- /* Sidecar Helm set[] */}}
            {{- $scRelSet := list }}
            {{- range $s := $scSecrets }}
            {{- if and $s.name $s.valuePath }}
            {{- $scRelSet = append $scRelSet (dict "name" $s.valuePath
                "valueFrom" (dict "secretKeyRef" (dict "name" $scSecretName "namespace" $ns "key" (printf "internal-%s" $s.name)))) }}
            {{- if and (eq $scName "jitsi") (eq $s.name "jwt_app_secret") }}
            {{- $scRelSet = append $scRelSet (dict "name" "jitsi.prosody.extraEnvs[2].value"
                "valueFrom" (dict "secretKeyRef" (dict "name" $scSecretName "namespace" $ns "key" (printf "internal-%s" $s.name)))) }}
            {{- end }}
            {{- end }}
            {{- end }}

            {{- /* Sidecar extraValues with kernel substitution */}}
            {{- $scExtraVals := dict }}
            {{- if $sidecar.extraValues }}
            {{- $ksRes := dig "kernelServices" list $extraRes }}
            {{- $ksCM  := default dict (index $ksRes 0) }}
            {{- $ksCMData := dig "data" dict $ksCM }}
            {{- $scKernelDomain := dig "KERNEL_DOMAIN" "" $ksCMData }}
            {{- $scTurnHost     := dig "TURN_HOST"        "" $ksCMData }}
            {{- $scTurnPort     := dig "TURN_PORT"        "3478" $ksCMData }}
            {{- $scTurnTLSHost  := dig "TURN_TLS_HOST"    "" $ksCMData }}
            {{- $scTurnTLSPort  := dig "TURN_TLS_PORT"    "5349" $ksCMData }}
            {{- $scTurnTransport := dig "TURN_TRANSPORT"  "udp" $ksCMData }}
            {{- $scTurnCreds    := dig "TURN_CREDENTIALS" "" $ksCMData }}
            {{- $scRaw := $sidecar.extraValues | toJson }}
            {{- $scRaw = $scRaw | replace "${TENANT_DOMAIN}"    $domain }}
            {{- $scRaw = $scRaw | replace "${TENANT_NAMESPACE}" $ns }}
            {{- $scRaw = $scRaw | replace "${TENANT_NAME}"     $tenant }}
            {{- $scRaw = $scRaw | replace "${TENANT_ID}"       $tenant }}
            {{- if $scKernelDomain }}{{ $scRaw = $scRaw | replace "${KERNEL_DOMAIN}" $scKernelDomain }}{{ end }}
            {{- $scRaw = $scRaw | replace "${TURN_HOST}"        $scTurnHost }}
            {{- $scRaw = $scRaw | replace "${TURN_PORT}"        $scTurnPort }}
            {{- $scRaw = $scRaw | replace "${TURN_TLS_HOST}"    $scTurnTLSHost }}
            {{- $scRaw = $scRaw | replace "${TURN_TLS_PORT}"   $scTurnTLSPort }}
            {{- $scRaw = $scRaw | replace "${TURN_TRANSPORT}" $scTurnTransport }}
            {{- $scRaw = $scRaw | replace "${TURN_CREDENTIALS}" $scTurnCreds }}
            {{- if $nodeIP }}{{ $scRaw = $scRaw | replace "${NODE_IP}" $nodeIP }}{{ end }}
            {{- $scExtraVals = $scRaw | fromJson }}
            {{- $scExtraVals = mergeOverwrite $scExtraVals (dict
                "imagePullSecrets" $imagePull
                "global" (mergeOverwrite (dig "global" dict $scExtraVals) (dict "imagePullSecrets" $imagePull))
            ) }}
            {{- end }}

            {{- /* Jitsi: mount Gentian OIDC/JWT overlays over chart ConfigMaps */}}
            {{- if eq $scName "jitsi" }}
            {{- if eq (len $jitsiOverlayData) 0 }}
              {{- fail "gentian-jitsi-oidc-overlays ConfigMap missing — run gentian-os install/update (upsert_gentian_jitsi_oidc_overlays_configmap)" }}
            {{- end }}
            {{- $jitsiOidcCM := printf "%s-oidc-overlays" $scXrName }}
            {{- $jitsiWebOverlayItems := list
                (dict "key" "body.html" "path" "body.html")
                (dict "key" "oidc-adapter.html" "path" "oidc-adapter.html")
                (dict "key" "oidc-redirect.html" "path" "oidc-redirect.html")
                (dict "key" "plugin.head.html" "path" "plugin.head.html")
            }}
            {{- $jitsiWebOverlayMounts := list
                (dict "name" "gentian-jitsi-oidc-overlays" "subPath" "body.html" "mountPath" "/usr/share/jitsi-meet/body.html")
                (dict "name" "gentian-jitsi-oidc-overlays" "subPath" "plugin.head.html" "mountPath" "/usr/share/jitsi-meet/plugin.head.html")
                (dict "name" "gentian-jitsi-oidc-overlays" "subPath" "oidc-adapter.html" "mountPath" "/usr/share/jitsi-meet/static/oidc-adapter.html")
                (dict "name" "gentian-jitsi-oidc-overlays" "subPath" "oidc-redirect.html" "mountPath" "/usr/share/jitsi-meet/static/oidc-redirect.html")
            }}
            {{- $jitsiOverlayVol := dict
                "name" "gentian-jitsi-oidc-overlays"
                "configMap" (dict "name" $jitsiOidcCM "items" $jitsiWebOverlayItems)
            }}
            {{- $jitsiAdapterOverlayVol := dict
                "name" "gentian-jitsi-adapter-overlay"
                "configMap" (dict "name" $jitsiOidcCM "items" (list (dict "key" "context.ts" "path" "context.ts")))
            }}
            {{- $jitsiAdapterOverlayMount := dict
                "name" "gentian-jitsi-adapter-overlay"
                "subPath" "context.ts"
                "mountPath" "/usr/src/app/dist/context.ts"
            }}
            {{- $jitsiWebExtra := default dict (dig "jitsi" dict $scExtraVals) }}
            {{- $jitsiWeb := default dict (dig "web" dict $jitsiWebExtra) }}
            {{- $jitsiWeb = mergeOverwrite $jitsiWeb (dict
                "extraVolumes" (concat (default list $jitsiWeb.extraVolumes) (list $jitsiOverlayVol))
                "extraVolumeMounts" (concat (default list $jitsiWeb.extraVolumeMounts) $jitsiWebOverlayMounts)
            ) }}
            {{- $jitsiWebExtra = mergeOverwrite $jitsiWebExtra (dict "web" $jitsiWeb) }}
            {{- $scExtraVals = mergeOverwrite $scExtraVals (dict
                "jitsi" $jitsiWebExtra
                "extraVolumes" (concat (default list $scExtraVals.extraVolumes) (list $jitsiAdapterOverlayVol))
                "extraVolumeMounts" (concat (default list $scExtraVals.extraVolumeMounts) (list $jitsiAdapterOverlayMount))
            ) }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $scAppKey }}-oidc-overlays-cm
              name: {{ $scXrName }}-oidc-overlays-cm
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: {{ $jitsiOidcCM }}
                    namespace: {{ $ns }}
                    labels:
                      app.kubernetes.io/managed-by: gentian-os
                      gentianos.io/app: {{ $scAppKey }}
                      gentianos.io/tenant: {{ $tenant }}
                  binaryData:
                    body.html: {{ index $jitsiOverlayData "body.html" | b64enc | quote }}
                    context.ts: {{ index $jitsiOverlayData "context.ts" | b64enc | quote }}
                    oidc-adapter.html: {{ index $jitsiOverlayData "oidc-adapter.html" | b64enc | quote }}
                    oidc-redirect.html: {{ index $jitsiOverlayData "oidc-redirect.html" | b64enc | quote }}
                    plugin.head.html: {{ index $jitsiOverlayData "plugin.head.html" | b64enc | quote }}
              providerConfigRef:
                name: kubernetes
            {{- end }}

            ---
            apiVersion: helm.crossplane.io/v1beta1
            kind: Release
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $scAppKey }}-release
              name: {{ $scXrName }}-release
            spec:
              forProvider:
                chart:
                  repository: {{ $scChart.repository }}
                  name: {{ $scChart.name }}
                  version: {{ $scChart.version | quote }}
                namespace: {{ $ns }}
                wait: false
                {{- if gt (len $scExtraVals) 0 }}
                values:
                  {{ toYaml $scExtraVals | nindent 18 }}
                {{- end }}
                {{- if gt (len $scRelSet) 0 }}
                set:
                  {{ toYaml $scRelSet | nindent 18 }}
                {{- end }}
              providerConfigRef:
                name: kubernetes

            {{- $stableSvcName := default "" $sidecar.stableServiceName }}
            {{- if $stableSvcName }}
            {{- $stableSvcPort := default 80 ($sidecar.stableServicePort | int) }}
            {{- $scComponent := "web" }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $scAppKey }}-stable-svc
              name: {{ $scXrName }}-stable-svc
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Service
                  metadata:
                    name: {{ $stableSvcName }}
                    namespace: {{ $ns }}
                  spec:
                    selector:
                      app.kubernetes.io/instance: {{ $scXrName }}-release
                      app.kubernetes.io/component: {{ $scComponent }}
                    ports:
                    - name: http
                      port: {{ $stableSvcPort }}
                      targetPort: {{ $stableSvcPort }}
                      protocol: TCP
              providerConfigRef:
                name: kubernetes
            {{- end }}
            {{- end }}

            {{- /* ── Emit LDAP-search-init resources (when AppProfile requires ldap.search) */}}
            {{- /* Provisions a per-tenant LDAP search user in UDM and writes its          */}}
            {{- /* credential to OpenBao. Runs once; idempotent on retries.                */}}
            {{- $ldapReqs := default dict (dig "ldap" dict $identity) }}
            {{- if and $ldapReqs.search $ldapBaseDn $udmUrl }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-ldap-init-sa
              name: {{ $xrName }}-ldap-init-sa
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ServiceAccount
                  metadata:
                    name: app-init
                    namespace: {{ $ns }}
              providerConfigRef:
                name: kubernetes
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-ldap-init-cm
              name: {{ $xrName }}-ldap-init-cm
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: {{ $app }}-ldap-init
                    namespace: {{ $ns }}
                  data:
                    init.sh: |
                      #!/bin/sh
                      set -eu
                      JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                      BAO_TOKEN=$(curl -sf "${BAO_ADDR}/v1/auth/kubernetes/login" \
                        -H 'Content-Type: application/json' \
                        -d "{\"role\":\"app-init\",\"jwt\":\"${JWT}\"}" \
                        | jq -r '.auth.client_token')
                      EXISTING=$(curl -sf \
                        -H "X-Vault-Token: ${BAO_TOKEN}" \
                        "${BAO_ADDR}/v1/secret/data/gentian-os/tenants/${TENANT}/apps/${APP}/ldap" \
                        2>/dev/null || echo '{}')
                      if echo "${EXISTING}" | jq -e '.data.data."bind-password"' >/dev/null 2>&1; then
                        echo "[ldap-init] credential already present for ${TENANT}/${APP} — skipping"
                        exit 0
                      fi
                      if [ "${SECRET_MODE}" = "random" ]; then
                        PASSWORD=$(openssl rand -hex 32)
                      else
                        MASTER=$(curl -sf \
                          -H "X-Vault-Token: ${BAO_TOKEN}" \
                          "${BAO_ADDR}/v1/secret/data/gentian-os/kernel/master-password" \
                          | jq -r '.data.data.value')
                        PASSWORD=$(printf '%s:%s:ldap-search' "${TENANT}" "${APP}" \
                          | openssl dgst -sha256 -hmac "${MASTER}" | awk '{print $2}')
                      fi
                      NUBUS=$(curl -sf \
                        -H "X-Vault-Token: ${BAO_TOKEN}" \
                        "${BAO_ADDR}/v1/secret/data/gentian-os/kernel/identity/nubus")
                      ADMIN_PW=$(echo "${NUBUS}" | jq -r '.data.data.admin_password')
                      USERNAME="ldapsearch-${TENANT}-${APP}"
                      BIND_DN="uid=${USERNAME},cn=users,${LDAP_BASE_DN}"
                      DN_ENC=$(printf '%s' "${BIND_DN}" | jq -Rr @uri)
                      HTTP_CREATE=$(curl -sf -o /tmp/resp -w '%{http_code}' \
                        "${UDM_URL}/univention/udm/users/user/" \
                        -u "Administrator:${ADMIN_PW}" \
                        -H 'Content-Type: application/json' \
                        -d "{\"properties\":{\"username\":\"${USERNAME}\",\"lastname\":\"LDAP-Search\",\"password\":\"${PASSWORD}\",\"primaryGroup\":\"cn=Domain Service Users,cn=groups,${LDAP_BASE_DN}\"},\"position\":\"cn=users,${LDAP_BASE_DN}\"}" \
                        2>/dev/null || echo '000')
                      case "${HTTP_CREATE}" in
                        201) echo "[ldap-init] UDM user ${USERNAME} created" ;;
                        422|409)
                          echo "[ldap-init] UDM user ${USERNAME} already exists — updating password"
                          curl -sf \
                            "${UDM_URL}/univention/udm/users/user/${DN_ENC}" \
                            -u "Administrator:${ADMIN_PW}" \
                            -X PATCH \
                            -H 'Content-Type: application/json' \
                            -d "{\"properties\":{\"password\":\"${PASSWORD}\"}}" >/dev/null ;;
                        *) echo "[ldap-init] ERROR: UDM create HTTP ${HTTP_CREATE}"; cat /tmp/resp; exit 1 ;;
                      esac
                      curl -sf \
                        -H "X-Vault-Token: ${BAO_TOKEN}" \
                        -H 'Content-Type: application/json' \
                        -X POST \
                        -d "{\"data\":{\"bind-dn\":\"${BIND_DN}\",\"bind-password\":\"${PASSWORD}\",\"base-dn\":\"${LDAP_BASE_DN}\"}}" \
                        "${BAO_ADDR}/v1/secret/data/gentian-os/tenants/${TENANT}/apps/${APP}/ldap"
                      echo "[ldap-init] OpenBao credential written for ${TENANT}/${APP}"
              providerConfigRef:
                name: kubernetes
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-ldap-init-job
              name: {{ $xrName }}-ldap-init-job
            spec:
              forProvider:
                manifest:
                  apiVersion: batch/v1
                  kind: Job
                  metadata:
                    name: {{ $app }}-ldap-init
                    namespace: {{ $ns }}
                    labels:
                      app.kubernetes.io/managed-by: gentian-os
                      gentianos.io/tenant: {{ $tenant }}
                      gentianos.io/app: {{ $app }}
                  spec:
                    ttlSecondsAfterFinished: 3600
                    backoffLimit: 10
                    template:
                      spec:
                        serviceAccountName: app-init
                        restartPolicy: OnFailure
                        volumes:
                          - name: scripts
                            configMap:
                              name: {{ $app }}-ldap-init
                        containers:
                          - name: ldap-search-init
                            image: {{ $appInitImage | quote }}
                            command:
                              - /bin/sh
                              - /scripts/init.sh
                            volumeMounts:
                              - name: scripts
                                mountPath: /scripts
                            env:
                              - name: TENANT
                                value: {{ $tenant }}
                              - name: APP
                                value: {{ $app }}
                              - name: BAO_ADDR
                                value: "http://openbao.openbao.svc.cluster.local:8200"
                              - name: UDM_URL
                                value: {{ $udmUrl | quote }}
                              - name: LDAP_BASE_DN
                                value: {{ $ldapBaseDn | quote }}
                              - name: SECRET_MODE
                                value: {{ $secretMode | quote }}
              providerConfigRef:
                name: kubernetes
            {{- end }}

            {{- /* ── Emit database-init resources (when AppProfile requires database.databasePerTenant */}}
            {{- /* with engine=postgresql). Provisions a CNPG role + database and writes             */}}
            {{- /* credentials to OpenBao at tenants/<tenant>/apps/<app>/database.                   */}}
            {{- $dbRequirements := default dict $kr.database }}
            {{- if and $dbRequirements.databasePerTenant (eq (default "" $dbRequirements.engine) "postgresql") $cnpgHost }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-db-init-sa
              name: {{ $xrName }}-db-init-sa
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ServiceAccount
                  metadata:
                    name: app-init
                    namespace: {{ $ns }}
              providerConfigRef:
                name: kubernetes
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-db-init-cm
              name: {{ $xrName }}-db-init-cm
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: {{ $app }}-db-init
                    namespace: {{ $ns }}
                  data:
                    init.sh: |
                      #!/bin/sh
                      set -eu
                      JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                      BAO_TOKEN=$(curl -sf "${BAO_ADDR}/v1/auth/kubernetes/login" \
                        -H 'Content-Type: application/json' \
                        -d "{\"role\":\"app-init\",\"jwt\":\"${JWT}\"}" \
                        | jq -r '.auth.client_token')
                      EXISTING=$(curl -sf \
                        -H "X-Vault-Token: ${BAO_TOKEN}" \
                        "${BAO_ADDR}/v1/secret/data/gentian-os/tenants/${TENANT}/apps/${APP}/database" \
                        2>/dev/null || echo '{}')
                      if echo "${EXISTING}" | jq -e '.data.data.password' >/dev/null 2>&1; then
                        echo "[db-init] credential already present for ${TENANT}/${APP} — skipping"
                        exit 0
                      fi
                      CNPG=$(curl -sf \
                        -H "X-Vault-Token: ${BAO_TOKEN}" \
                        "${BAO_ADDR}/v1/secret/data/gentian-os/kernel/database/cnpg")
                      SU_USER=$(echo "${CNPG}" | jq -r '.data.data.superuser_username')
                      SU_PASS=$(echo "${CNPG}" | jq -r '.data.data.superuser_password')
                      if [ "${SECRET_MODE}" = "random" ]; then
                        PASSWORD=$(openssl rand -hex 32)
                      else
                        MASTER=$(curl -sf \
                          -H "X-Vault-Token: ${BAO_TOKEN}" \
                          "${BAO_ADDR}/v1/secret/data/gentian-os/kernel/master-password" \
                          | jq -r '.data.data.value')
                        PASSWORD=$(printf '%s:%s:database' "${TENANT}" "${APP}" \
                          | openssl dgst -sha256 -hmac "${MASTER}" | awk '{print $2}')
                      fi
                      ROLE=$(printf '%s_%s' "${TENANT}" "${APP}" | tr '-' '_')
                      DBNAME="${ROLE}"
                      export PGPASSWORD="${SU_PASS}"
                      psql -h "${CNPG_HOST}" -U "${SU_USER}" -d postgres -v ON_ERROR_STOP=1 <<SQL
                      DO \$\$
                      BEGIN
                        IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '${ROLE}') THEN
                          CREATE ROLE "${ROLE}" WITH LOGIN PASSWORD '${PASSWORD}';
                        ELSE
                          ALTER ROLE "${ROLE}" WITH PASSWORD '${PASSWORD}';
                        END IF;
                      END \$\$;
                      SQL
                      psql -h "${CNPG_HOST}" -U "${SU_USER}" -d postgres -v ON_ERROR_STOP=1 \
                        -c "SELECT 'CREATE DATABASE \"${DBNAME}\" OWNER \"${ROLE}\"' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '${DBNAME}')" \
                        | grep -q 'CREATE DATABASE' \
                        && psql -h "${CNPG_HOST}" -U "${SU_USER}" -d postgres \
                             -c "CREATE DATABASE \"${DBNAME}\" OWNER \"${ROLE}\"" || true
                      psql -h "${CNPG_HOST}" -U "${SU_USER}" -d "${DBNAME}" -v ON_ERROR_STOP=1 \
                        -c "CREATE SCHEMA IF NOT EXISTS \"${DBNAME}\" AUTHORIZATION \"${ROLE}\";"
                      psql -h "${CNPG_HOST}" -U "${SU_USER}" -d "${DBNAME}" -v ON_ERROR_STOP=1 \
                        -c "GRANT ALL ON SCHEMA \"${DBNAME}\" TO \"${ROLE}\";"
                      psql -h "${CNPG_HOST}" -U "${SU_USER}" -d postgres -v ON_ERROR_STOP=1 \
                        -c "ALTER ROLE \"${ROLE}\" SET search_path TO \"${DBNAME}\", public;"
                      echo "[db-init] role ${ROLE}, database ${DBNAME}, and schema ${DBNAME} ensured"
                      curl -sf \
                        -H "X-Vault-Token: ${BAO_TOKEN}" \
                        -H 'Content-Type: application/json' \
                        -X POST \
                        -d "{\"data\":{\"host\":\"${CNPG_HOST}\",\"port\":\"5432\",\"name\":\"${DBNAME}\",\"user\":\"${ROLE}\",\"password\":\"${PASSWORD}\"}}" \
                        "${BAO_ADDR}/v1/secret/data/gentian-os/tenants/${TENANT}/apps/${APP}/database"
                      echo "[db-init] OpenBao credential written for ${TENANT}/${APP}"
              providerConfigRef:
                name: kubernetes
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-db-init-job
              name: {{ $xrName }}-db-init-job
            spec:
              forProvider:
                manifest:
                  apiVersion: batch/v1
                  kind: Job
                  metadata:
                    name: {{ $app }}-db-init
                    namespace: {{ $ns }}
                    labels:
                      app.kubernetes.io/managed-by: gentian-os
                      gentianos.io/tenant: {{ $tenant }}
                      gentianos.io/app: {{ $app }}
                  spec:
                    ttlSecondsAfterFinished: 3600
                    backoffLimit: 10
                    template:
                      spec:
                        serviceAccountName: app-init
                        restartPolicy: OnFailure
                        volumes:
                          - name: scripts
                            configMap:
                              name: {{ $app }}-db-init
                        containers:
                          - name: database-init
                            image: {{ $appInitImage | quote }}
                            command:
                              - /bin/sh
                              - /scripts/init.sh
                            volumeMounts:
                              - name: scripts
                                mountPath: /scripts
                            env:
                              - name: TENANT
                                value: {{ $tenant }}
                              - name: APP
                                value: {{ $app }}
                              - name: BAO_ADDR
                                value: "http://openbao.openbao.svc.cluster.local:8200"
                              - name: CNPG_HOST
                                value: {{ $cnpgHost | quote }}
                              - name: SECRET_MODE
                                value: {{ $secretMode | quote }}
              providerConfigRef:
                name: kubernetes
            {{- end }}


    # ── Step 3: Mark XR Ready when all composed resources are Ready ───────────
    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready
