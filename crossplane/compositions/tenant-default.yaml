apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: tenant-default
  labels:
    gentianos.io/composition: tenant
spec:
  compositeTypeRef:
    apiVersion: gentianos.io/v1alpha1
    kind: XTenant
  mode: Pipeline
  pipeline:

    - step: fetch-cluster-config
      functionRef:
        name: function-extra-resources
      input:
        apiVersion: extra-resources.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          extraResources:
            - kind: ConfigMap
              into: clusterConfig
              apiVersion: v1
              type: Selector
              selector:
                maxMatch: 1
                minMatch: 0
                matchLabels:
                  - key: gentianos.io/config-type
                    type: Value
                    value: cluster-config
            - kind: ConfigMap
              into: provisioningJobs
              apiVersion: v1
              type: Selector
              selector:
                maxMatch: 1
                minMatch: 0
                matchLabels:
                  - key: gentianos.io/config-type
                    type: Value
                    value: tenant-provisioning-jobs
                  - key: gentianos.io/tenant
                    type: FromCompositeFieldPath
                    valueFromFieldPath: metadata.name
            # Which hosts this tenant's components are routed at, projected by
            # the operator from the routes it composes. The zone's Keycloak
            # client admits a redirect only to a host it lists, and that list
            # used to be written here by hand -- so a component with a
            # subDomain of its own got "Invalid parameter: redirect_uri" on a
            # page naming neither the component nor a list.
            #
            # minMatch 0 because the projection does not exist until the
            # operator has run once: a tenant reconciling before then gets the
            # base hosts and the rest on the next pass.
            #
            # The same projection names the profiles whose components ask for
            # an exchanged token, for the same reason it names the hosts: the
            # operator composes the routes that ask, so it is what knows. And
            # it names the components that vouch for people at the realm, with
            # where each publishes its keys, because the operator is what
            # reads their profiles.
            - kind: ConfigMap
              into: zoneHosts
              apiVersion: v1
              type: Selector
              selector:
                maxMatch: 1
                minMatch: 0
                matchLabels:
                  - key: gentianos.io/config-type
                    type: Value
                    value: zone-hosts
                  - key: gentianos.io/tenant
                    type: FromCompositeFieldPath
                    valueFromFieldPath: metadata.name
            # The cluster's brand, published by the operator from the
            # Branding: the name a realm's mail is sent under and its sign-in
            # options are labeled with. minMatch 0: until it is published the
            # platform's own name stands.
            - kind: ConfigMap
              into: branding
              apiVersion: v1
              type: Selector
              selector:
                maxMatch: 1
                minMatch: 0
                matchLabels:
                  - key: gentianos.io/config-type
                    type: Value
                    value: branding

    # ── Step 2: Render composed resources (tenant shell owner) ────────────────
    - step: render-tenant-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr     := .observed.composite.resource }}
            {{- $observed := .observed }}
            {{- $obsRes := default dict $observed.resources }}
            {{- $spec   := $xr.spec }}
            {{- $tenant := $xr.metadata.name }}
            {{- $ns     := default (printf "tenant-%s" $tenant) (dig "isolation" "namespace" "" $spec) }}
            {{- $kd     := default "" $spec.kernelDomain }}
            {{- $domain := default (printf "%s.%s" $tenant $kd) (default "" $spec.domain) }}
            {{- $kvMount := "secret" }}
            {{- $extraRes := index .context "apiextensions.crossplane.io/extra-resources" }}
            {{- $ccList   := dig "clusterConfig" list $extraRes }}
            {{- $cc       := ternary (index $ccList 0) dict (gt (len $ccList) 0) }}
            {{- $ccData   := dig "data" dict $cc }}
            {{- /* What the cluster calls itself (brand.json, rendered by the
                 operator from the Branding); the platform's own name until
                 that is published. */}}
            {{- $brandName := "Gentian" }}
            {{- $brList    := dig "branding" list $extraRes }}
            {{- if gt (len $brList) 0 }}
            {{- $brJSON    := dig "data" "brand.json" "" (index $brList 0) }}
            {{- if $brJSON }}
            {{- $brandName = default "Gentian" (dig "name" "" (fromYaml $brJSON)) }}
            {{- end }}
            {{- end }}
            {{- /* The kernel realm and Keycloak's in-cluster URL, published by the
                 Cluster claim. Both empty means the cluster predates them, and the
                 broker resources below stay unrendered rather than half-configured
                 — the same rule oidc.discoveryUrl follows. */}}
            {{- $kernelRealm := dig "identity.kernelRealm" "" $ccData }}
            {{- $kcInternal  := dig "identity.internalUrl" "" $ccData }}
            {{- /* The platform's administrators entering tenants (iam.md 1.1c),
                 as the operator projects it: on the tenant that adopts the
                 kernel realm the tenants they may enter (kernelEnter); on any
                 other tenant whether it is one of them (kernelBroker). */}}
            {{- $kernelEnter  := dig "kernelEnter" list $spec }}
            {{- $kernelBroker := dig "kernelBroker" false $spec }}
            {{- /* Where Keycloak runs, and so where the broker clients' secrets
                 are published for the IdPs that read them back. Nothing outside
                 this Composition reads them; the namespace only has to exist. */}}
            {{- $identityNs  := default "kernel-authentication" (dig "identity.namespace" "" $ccData) }}
            {{- /* The realm this tenant's identity lives in: its own by default,
                 or one named on the claim. Naming the KERNEL realm is what
                 Tenant/platform does (AD-10): the realm every administrator
                 signs in through is adopted, never created, configured or
                 brokered — every object below that is realm state or a bridge
                 between two realms stays unrendered, and only what belongs to
                 the tenant inside that realm (its entitlement groups) is
                 composed. */}}
            {{- $realm := default $tenant (dig "isolation" "keycloakRealm" "" $spec) }}
            {{- $adoptsKernelRealm := and $kernelRealm (eq $realm $kernelRealm) }}
            {{- /* Whether people make their own accounts in the realm
                 (spec.signUp.enabled). Off unless the tenant says so, and
                 off, nothing below renders differently from before the
                 setting existed. */}}
            {{- $signUp := dig "signUp" "enabled" false $spec }}
            {{- $provList  := dig "provisioningJobs" list $extraRes }}
            {{- $provCM    := ternary (index $provList 0) dict (gt (len $provList) 0) }}
            {{- $jobsJSON  := dig "data" "jobs.json" "[]" $provCM }}
            {{- $jobs      := fromJson $jobsJSON }}
            {{- $objectsJSON := dig "data" "objects.json" "[]" $provCM }}
            {{- $objects     := fromJson $objectsJSON }}
            {{- /*
              network.routingMode and the three network.kubeApiServer* keys used
              to be read here and were never referenced again — assigned, then
              discarded. Removed rather than left as documentation of an intent
              that moved: the tenant NetworkPolicy is built by the operator, from
              KUBE_APISERVER_CIDR and loadKubeAPIEndpointSlice in
              tenant_network_policy.go, not from this ConfigMap.

              They mattered because they were the only apparent consumer of the
              three values the installer discovers from the live cluster, which
              made those look like they had to be observed through Crossplane
              before the ConfigMap could be composed. No Composition reads them.
            */}}
            {{- $quotas      := default dict (dig "quotas" dict $spec) }}
            {{- $lrDefaultCPU := dig "tenant.limitRange.default.cpu" "500m" $ccData }}
            {{- $lrDefaultMem := dig "tenant.limitRange.default.memory" "512Mi" $ccData }}
            {{- $lrRequestCPU := dig "tenant.limitRange.defaultRequest.cpu" "100m" $ccData }}
            {{- $lrRequestMem := dig "tenant.limitRange.defaultRequest.memory" "128Mi" $ccData }}

            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              name: {{ $tenant }}-namespace
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: namespace
            spec:
              providerConfigRef:
                name: kubernetes
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Namespace
                  metadata:
                    name: {{ $ns }}
                    labels:
                      gentianos.io/tier: tenant
                      gentianos.io/tenant: {{ $tenant }}
                      gentianos.io/managed-by: crossplane
                      app.kubernetes.io/managed-by: gentian-os

            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              name: {{ $tenant }}-limitrange
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: limitrange
            spec:
              providerConfigRef:
                name: kubernetes
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: LimitRange
                  metadata:
                    name: tenant-limits
                    namespace: {{ $ns }}
                    labels:
                      gentianos.io/tenant: {{ $tenant }}
                      app.kubernetes.io/managed-by: gentian-os
                  spec:
                    limits:
                      - type: Container
                        default:
                          cpu: {{ $lrDefaultCPU | quote }}
                          memory: {{ $lrDefaultMem | quote }}
                        defaultRequest:
                          cpu: {{ $lrRequestCPU | quote }}
                          memory: {{ $lrRequestMem | quote }}
                        max:
                          cpu: "4"
                          memory: 8Gi

            {{- if or $quotas.storage $quotas.cpu $quotas.memory }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              name: {{ $tenant }}-resourcequota
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: resourcequota
            spec:
              providerConfigRef:
                name: kubernetes
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ResourceQuota
                  metadata:
                    name: tenant-quota
                    namespace: {{ $ns }}
                    labels:
                      gentianos.io/tenant: {{ $tenant }}
                      app.kubernetes.io/managed-by: gentian-os
                  spec:
                    hard:
                      {{- if $quotas.storage }}
                      requests.storage: {{ $quotas.storage | quote }}
                      {{- end }}
                      {{- if $quotas.requestsCpu }}
                      requests.cpu: {{ $quotas.requestsCpu | quote }}
                      {{- end }}
                      {{- if $quotas.requestsMemory }}
                      requests.memory: {{ $quotas.requestsMemory | quote }}
                      {{- end }}
                      {{- if $quotas.cpu }}
                      limits.cpu: {{ $quotas.cpu | quote }}
                      {{- end }}
                      {{- if $quotas.memory }}
                      limits.memory: {{ $quotas.memory | quote }}
                      {{- end }}
                      {{- if $quotas.maxPods }}
                      pods: {{ $quotas.maxPods | quote }}
                      {{- end }}
            {{- end }}


            ---
            apiVersion: vault.vault.upbound.io/v1alpha1
            kind: Policy
            metadata:
              name: {{ $tenant }}-tenant-policy
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: vault-policy
            spec:
              providerConfigRef:
                name: openbao
              forProvider:
                name: tenant-{{ $tenant }}
                policy: |
                  path "{{ $kvMount }}/data/gentian-os/tenants/{{ $tenant }}/*" {
                    capabilities = ["create", "read", "update", "delete", "list"]
                  }
                  path "{{ $kvMount }}/metadata/gentian-os/tenants/{{ $tenant }}/*" {
                    capabilities = ["list", "delete"]
                  }

            {{- /* ── The tenant's own secret store ─────────────────────────────
                 What ESO reads for this tenant's namespace, and all it reads
                 there: a store of the tenant's own, whose role in OpenBao
                 sees this tenant's paths and nothing else.

                 The kernel's store (openbao, cluster-default.yaml) reads
                 every kernel path -- the master password among them -- and
                 every tenant's. It is not usable from a tenant's namespace,
                 so an ExternalSecret there, whoever wrote it, can name only
                 this store; and this store answers for no kernel path and for
                 no other tenant's, because OpenBao refuses the role, not
                 because nobody asked.

                 Three objects: the policy, the role that carries it, and the
                 store that signs in with the role. The role is bound to
                 ESO's own ServiceAccount, as the kernel's is: nothing in the
                 tenant's namespace can sign in with it.

                 The policy grants what becomes a Secret in the tenant's
                 namespace and no more: its apps' credentials, its
                 repositories' pull credentials, and the keys of its
                 contracts. Not backup/: a tenant's backup destination is
                 read in the kernel's namespaces, where the capture Jobs run.
                 The denies are stated although nothing grants those paths: a
                 deny holds whatever is later added to this policy or to
                 another one the role is given.

                 The store is cluster-scoped because its ServiceAccount is in
                 another namespace, and held to this tenant by its
                 conditions: the two labels this Composition puts on the
                 tenant's namespace and on no other. The tenant's DMZ carries
                 another tier and is not admitted; only the platform's proxy
                 runs there, and it reads no secret from OpenBao. */}}
            {{- $openbaoNs     := default "kernel-secrets" (dig "openbao.namespace" "" $ccData) }}
            {{- $openbaoServer := default (printf "https://openbao.%s.svc.cluster.local:8200" $openbaoNs) (dig "openbao.server" "" $ccData) }}
            {{- $storeKvMount  := default $kvMount (dig "openbao.kvMount" "" $ccData) }}
            {{- $authMount     := default "kubernetes" (dig "openbao.authMount" "" $ccData) }}
            {{- $esoNs         := default "kernel-secrets" (dig "eso.namespace" "" $ccData) }}
            {{- $esoSa         := default "external-secrets" (dig "eso.serviceAccount" "" $ccData) }}
            ---
            apiVersion: vault.vault.upbound.io/v1alpha1
            kind: Policy
            metadata:
              name: {{ $tenant }}-eso-policy
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: vault-policy-eso
            spec:
              providerConfigRef:
                name: openbao
              forProvider:
                name: eso-tenant-{{ $tenant }}
                policy: |
                  path "{{ $storeKvMount }}/data/gentian-os/tenants/{{ $tenant }}/apps/*" {
                    capabilities = ["read"]
                  }
                  path "{{ $storeKvMount }}/data/gentian-os/tenants/{{ $tenant }}/repositories/*" {
                    capabilities = ["read"]
                  }
                  path "{{ $storeKvMount }}/data/gentian-os/tenants/{{ $tenant }}/contracts/*" {
                    capabilities = ["read"]
                  }
                  path "{{ $storeKvMount }}/data/gentian-os/tenants/{{ $tenant }}/backup/*" {
                    capabilities = ["deny"]
                  }
                  path "{{ $storeKvMount }}/metadata/gentian-os/tenants/{{ $tenant }}/backup/*" {
                    capabilities = ["deny"]
                  }
                  path "{{ $storeKvMount }}/data/gentian-os/kernel/*" {
                    capabilities = ["deny"]
                  }
                  path "{{ $storeKvMount }}/metadata/gentian-os/kernel/*" {
                    capabilities = ["deny"]
                  }

            ---
            apiVersion: kubernetes.vault.upbound.io/v1alpha1
            kind: AuthBackendRole
            metadata:
              name: {{ $tenant }}-eso-role
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: vault-auth-role-eso
            spec:
              providerConfigRef:
                name: openbao
              forProvider:
                backend: {{ $authMount }}
                roleName: eso-tenant-{{ $tenant }}
                boundServiceAccountNames:
                  - {{ $esoSa }}
                boundServiceAccountNamespaces:
                  - {{ $esoNs }}
                tokenPolicies:
                  - eso-tenant-{{ $tenant }}
                tokenTtl: 3600

            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              name: {{ $tenant }}-secret-store
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: eso-secret-store
            spec:
              providerConfigRef:
                name: kubernetes
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1
                  kind: ClusterSecretStore
                  metadata:
                    name: openbao-tenant-{{ $tenant }}
                    labels:
                      gentianos.io/tenant: {{ $tenant }}
                      app.kubernetes.io/managed-by: gentian-os
                  spec:
                    conditions:
                      - namespaceSelector:
                          matchLabels:
                            gentianos.io/tier: tenant
                            gentianos.io/tenant: {{ $tenant }}
                    provider:
                      vault:
                        server: {{ $openbaoServer }}
                        path: {{ $storeKvMount }}
                        version: v2
                        {{- if hasPrefix "https://" $openbaoServer }}
                        caProvider:
                          type: Secret
                          name: openbao-tls
                          namespace: {{ $openbaoNs }}
                          key: ca.crt  # the vault's CA, openbao-ca: stable across renewals
                        {{- end }}
                        auth:
                          kubernetes:
                            mountPath: {{ $authMount }}
                            role: eso-tenant-{{ $tenant }}
                            serviceAccountRef:
                              name: {{ $esoSa }}
                              namespace: {{ $esoNs }}

            {{- range $job := $jobs }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              name: {{ $tenant }}-job-{{ $job.metadata.name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: job-{{ $job.metadata.name }}
            spec:
              providerConfigRef:
                name: kubernetes
              forProvider:
                manifest:
                  {{- $job | toYaml | nindent 18 }}
            {{- end }}

            {{- range $obj := $objects }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              # Include kind in the Object name — multiple resources can share
              # metadata.name (e.g. memcached Deployment + Service).
              name: {{ $tenant }}-obj-{{ lower $obj.kind }}-{{ $obj.metadata.name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: obj-{{ lower $obj.kind }}-{{ $obj.metadata.name }}
            spec:
              providerConfigRef:
                name: kubernetes
              forProvider:
                manifest:
                  {{- $obj | toYaml | nindent 18 }}
            {{- end }}

            {{- /* ── the zone's edge client and its secret ──────────────────
                 A zone is one sign-in domain: a hostname, the realm behind it,
                 one confidential client the edge holds the session with, that
                 session's cookie names and the Gateway listener that serves it
                 (networking.md §4). Everything that consumes a zone is already
                 general, and until now nothing produced one except a shell Job
                 in the installer, which made the kernel's and no other. This
                 composes it per tenant, so a second tenant signs in at
                 desktop.<t>.<kernel> with no installer step having run for it.

                 Rendered for a tenant that adopts the kernel realm as well as
                 for one with its own, unlike the realm state above. The kernel
                 zone belongs to the platform tenant rather than to the identity
                 bootstrap (AD-10), and a realm backs exactly one zone, so the
                 tenant that adopts a realm is the one that owns its zone. Two
                 tenants naming the same realm would compose the same client
                 twice and the two copies would fight; AD-10 has only the one.
              */}}
            {{- $zone       := ternary "kernel" $tenant $adoptsKernelRealm }}
            {{- $zoneSecret := printf "edge-%s-oidc" $zone }}
            {{- /* Where the edge runs, which is where the Secret and its
                 generator go. Envoy Gateway reads an OIDC client secret only
                 from the SecurityPolicy's own namespace, and the policies are
                 the edge's, so this is not a choice. Read from the cluster
                 config rather than written here: the operator answers the same
                 question from GENTIAN_NS_EDGE and the two have to agree, or the
                 secret is written where nothing reads it. */}}
            {{- $edgeNs     := default "kernel-edge" (dig "network.edgeNamespace" "" $ccData) }}
            {{- /* The zone's domain. spec.domain is EffectiveDomain, set by the
                 operator on every pass: a custom domain a TenantDomain binds,
                 the cluster's own domain for the user tenant of a
                 single-tenancy cluster, otherwise the tenant's subdomain of
                 it -- which for the platform tenant is platform.<kernel>. */}}
            {{- $zoneDomain  := $domain }}
            {{- /* The hosts the zone serves, which is what the redirect URIs
                 have to cover. The kernel zone's four were read off the Job
                 this replaces rather than reconstructed from the routes.

                 desktop and admin are the components every tenant gets: the
                 desktop, and the administration console beside it. Both are
                 ComponentProfiles placed in every tenant, so both hosts exist
                 in every zone, kernel and tenant alike.

                 This list is enumerated and not derived, which is a known
                 limit: a component whose profile declares a subDomain that is
                 not here gets a Keycloak refusal -- "Invalid parameter:
                 redirect_uri" -- on an error page that says nothing about a
                 redirect URI list. The operator is what knows every host a
                 zone serves, because it composes the routes; projecting that
                 per tenant, the way it already projects the tile catalogue,
                 is what would make this list follow the components instead of
                 being maintained beside them. Until then, a component with a
                 host of its own belongs here. */}}
            {{- /* The hosts a zone's client admits a redirect to, from two
                 places because they have two owners.

                 The kernel's own consoles are installed by install.sh and are
                 not components, so nothing projects them and they are named
                 here. Everything else follows the components: the operator
                 writes the labels its routes serve into a ConfigMap per
                 tenant, and this reads it back. desktop and admin stay in the
                 base list so a tenant reconciling before the operator has
                 projected still has a desktop to sign in to. */}}
            {{- $zoneHosts := list "desktop" "admin" }}
            {{- /* An explicit if, not ternary: Go templates evaluate both of
                 ternary's arms, so indexing an empty list is an error even
                 when the guard is false. The clusterConfig read above has the
                 same shape and gets away with it only because that ConfigMap
                 always exists. */}}
            {{- $zhList := dig "zoneHosts" list $extraRes }}
            {{- $zhData := dict }}
            {{- if gt (len $zhList) 0 }}
            {{- $zhData = dig "data" dict (index $zhList 0) }}
            {{- end }}
            {{- range $h := (splitList "\n" (dig "hosts" "" $zhData)) }}
            {{- $h = trim $h }}
            {{- if and $h (not (has $h $zoneHosts)) }}
            {{- $zoneHosts = append $zoneHosts $h }}
            {{- end }}
            {{- end }}
            {{- /* The labels as host names, which is where the two kinds of
                 zone differ.

                 A tenant's zone: <label>.<zone domain>, desktop among them.

                 The platform tenant's zone, the kernel realm's: its desktop is
                 on the zone's domain itself -- platform.<kernel>, not
                 desktop.platform.<kernel> -- and every other component one
                 label below it, as admin.platform.<kernel>. The operator
                 routes them by the same rule (exposureHostIn). Beside them are
                 the kernel's own consoles, which sign in through this client
                 too and are directly under the cluster's domain; id is among
                 them because Keycloak's administration is served there behind
                 the kernel session. */}}
            {{- $zoneHostNames := list }}
            {{- range $h := $zoneHosts }}
            {{- if and $adoptsKernelRealm (eq $h "desktop") }}
            {{- $zoneHostNames = append $zoneHostNames $zoneDomain }}
            {{- else }}
            {{- $zoneHostNames = append $zoneHostNames (printf "%s.%s" $h $zoneDomain) }}
            {{- end }}
            {{- end }}
            {{- if $adoptsKernelRealm }}
            {{- $kernelConsoles := list "argocd" "headlamp" "monitoring" "id" }}
            {{- /* The model gateway's console signs in here too, and exists
                 only where the claim switches it on: the operator routes
                 llm.<kernel> from the same setting, and a host it does not
                 route has no callback to admit. */}}
            {{- if eq (dig "llm.console.enabled" "" $ccData) "true" }}
            {{- $kernelConsoles = append $kernelConsoles "llm" }}
            {{- end }}
            {{- range $h := $kernelConsoles }}
            {{- $zoneHostNames = append $zoneHostNames (printf "%s.%s" $h $kd) }}
            {{- end }}
            {{- end }}
            {{- /* Where a person lands: the zone's desktop. */}}
            {{- $zoneDesktop := ternary $zoneDomain (printf "desktop.%s" $zoneDomain) (not (not $adoptsKernelRealm)) }}
            {{- /* The client the edge exchanges a session's token with, and
                 the Secret that holds its secret. One per realm, so the
                 clientId is the same in every realm and the Secret is named
                 after the zone, beside the zone's own. */}}
            {{- $exchangeClientID := "gentian-edge-exchange" }}
            {{- $exchangeSecret   := printf "edge-%s-exchange" $zone }}
            {{- /* The profiles whose components ask for an exchanged token
                 (exposure exchangeToken), read from the operator's projection
                 like the hosts above and for the same reason. Not spec.apps:
                 the components every tenant is given are not on it, and one
                 of those may ask as well as an installed app may. */}}
            {{- $exchangeProfiles := list }}
            {{- range $p := (splitList "\n" (dig "exchangeProfiles" "" $zhData)) }}
            {{- $p = trim $p }}
            {{- if and $p (not (has $p $exchangeProfiles)) }}
            {{- $exchangeProfiles = append $exchangeProfiles $p }}
            {{- end }}
            {{- end }}
            {{- /* The components that vouch for people at this realm
                 (requires.services.vouching), from the same projection. One
                 line each: the profile's name, then the Service, the port and
                 the path its keys are published at, separated by spaces
                 (zoneVouchingProfilesKey in the operator says why a space is
                 safe). A line that is not four fields is not guessed at: it
                 is left out, and that component gets nothing rather than an
                 issuer whose keys are fetched from somewhere half-read. */}}
            {{- $vouchingProfiles := list }}
            {{- $vouchingSeen     := list }}
            {{- range $line := (splitList "\n" (dig "vouchingProfiles" "" $zhData)) }}
            {{- $f := splitList " " (trim $line) }}
            {{- if and (eq (len $f) 4) (not (has (index $f 0) $vouchingSeen)) }}
            {{- $vouchingSeen = append $vouchingSeen (index $f 0) }}
            {{- $vouchingProfiles = append $vouchingProfiles (dict "profile" (index $f 0) "service" (index $f 1) "port" (index $f 2) "path" (index $f 3)) }}
            {{- end }}
            {{- end }}
            {{- /* The components that call partners or accept their
                 assertions (requires.services.partners), from the same
                 projection: one line each, "<profile> <service account>
                 <call> <accept>", call a comma-separated list of partner
                 names or "-", accept 1 or 0 (partnerLine in the operator).
                 $partnerCallers are the profiles among them that call. */}}
            {{- $partnerApps    := list }}
            {{- $partnerSeen    := list }}
            {{- $partnerCallers := list }}
            {{- range $line := (splitList "\n" (dig "partnerProfiles" "" $zhData)) }}
            {{- $f := splitList " " (trim $line) }}
            {{- if and (eq (len $f) 4) (not (has (index $f 0) $partnerSeen)) }}
            {{- $partnerSeen = append $partnerSeen (index $f 0) }}
            {{- $call := list }}
            {{- if ne (index $f 2) "-" }}{{- $call = splitList "," (index $f 2) }}{{- end }}
            {{- if gt (len $call) 0 }}{{- $partnerCallers = append $partnerCallers (index $f 0) }}{{- end }}
            {{- $partnerApps = append $partnerApps (dict "profile" (index $f 0) "sa" (index $f 1) "call" $call "accept" (eq (index $f 3) "1")) }}
            {{- end }}
            {{- end }}

            {{- /* The secret exists before the client does, and is generated
                 here rather than minted by Keycloak. A client created with no
                 clientSecretSecretRef gets a secret only Keycloak knows, and
                 the edge, which reads the Secret below, would then authenticate
                 with a value the realm never had.

                 External Secrets generates it. A Password generator is
                 configuration and holds nothing, so one per tenant costs a tiny
                 object and keeps the zone self-contained; the value it produces
                 lives only in the Secret the ExternalSecret owns.

                 No symbols. The value travels as a form parameter in the code
                 exchange and as a Kubernetes Secret, and 48 alphanumeric
                 characters are well beyond what a client secret needs to be. */}}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              name: {{ $tenant }}-edge-zone-password
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: edge-zone-password
            spec:
              forProvider:
                manifest:
                  apiVersion: generators.external-secrets.io/v1alpha1
                  kind: Password
                  metadata:
                    name: {{ $zoneSecret }}
                    namespace: {{ $edgeNs }}
                    labels:
                      app.kubernetes.io/managed-by: crossplane
                      gentianos.io/edge-zone: {{ $zone }}
                  spec:
                    length: 48
                    digits: 8
                    symbols: 0
                    noUpper: false
                    allowRepeat: true
                    secretKeys:
                      - client-secret
              providerConfigRef:
                name: kubernetes

            {{- /* The Secret both sides read, in the edge namespace, under the
                 key Envoy Gateway's SecurityPolicy names. A policy names its
                 client secret without a namespace and so reads it from its
                 own, which is why this one is written where the edge is and
                 copied beside a policy that sits elsewhere (ensureZoneSecret
                 in the operator).

                 Generated once and never again. A generator answers with a new
                 value every time it is asked, so an ExternalSecret that
                 refreshes rotates the client secret on its own schedule --
                 which would be survivable, since the Client below is pushed
                 whatever this holds, but it would break every session in flight
                 at an hour nobody chose. refreshPolicy says it; refreshInterval
                 zero says the same thing to an External Secrets that predates
                 the policy field.

                 creationPolicy Owner, so the Secret is deleted with the
                 ExternalSecret and cannot be left behind holding a credential
                 for a zone that no longer exists. It also means External
                 Secrets refuses a Secret of this name that it does not own, so
                 a cluster whose zone secret was written by the installer has to
                 have that Secret removed once before this can take over. */}}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              name: {{ $tenant }}-edge-zone-client-secret
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: edge-zone-client-secret
            spec:
              {{- /* Ready when the ExternalSecret is, not when it was applied,
                   so the sequencer rule below holds the Client back until the
                   Secret it reads actually exists. */}}
              readiness:
                policy: DeriveFromObject
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1
                  kind: ExternalSecret
                  metadata:
                    name: {{ $zoneSecret }}
                    namespace: {{ $edgeNs }}
                    labels:
                      app.kubernetes.io/managed-by: crossplane
                      gentianos.io/edge-zone: {{ $zone }}
                  spec:
                    refreshPolicy: CreatedOnce
                    refreshInterval: "0"
                    target:
                      name: {{ $zoneSecret }}
                      creationPolicy: Owner
                      template:
                        metadata:
                          labels:
                            app.kubernetes.io/managed-by: gentian-os
                            gentianos.io/edge-zone: {{ $zone }}
                    dataFrom:
                      - sourceRef:
                          generatorRef:
                            apiVersion: generators.external-secrets.io/v1alpha1
                            kind: Password
                            name: {{ $zoneSecret }}
              providerConfigRef:
                name: kubernetes

            {{- /* The client the edge runs the code flow with.

                 Confidential and standard flow only: the edge is the only
                 session authority (AD-13), so nothing else ever presents this
                 client, and no other grant type has a caller.

                 fullScopeAllowed false. The token this client issues is a
                 session, not an authorization: the bouncer asks OpenFGA on every
                 request and reads nothing out of the token but who the person
                 is, and nothing in this platform decides a permission from a
                 claim.

                 It carried no groups scope either, on the reasoning that a
                 group riding along is a second answer to a question that
                 already has one, and a stale one since a token outlives the
                 membership it was minted from. That reasoning does not
                 survive OpenBao. OpenBao is its own enforcement point with
                 its own policy engine and no way to ask OpenFGA, so binding
                 its roles to a group claim is not a SECOND answer there, it
                 is the only one available -- and without the scope the
                 custodian could not exchange a token at all, which
                 left the Credentials screen unreadable and the install unable
                 to prove anybody but the installer can write.

                 The alternative was the custodian holding an OpenBao
                 token of its own, which its own package refuses structurally:
                 one component able to write every secret in the cluster, with
                 the service and not the human in the audit device. That is a
                 worse trade than a claim whose staleness is bounded by a
                 five-minute token.

                 A redirect URI per host in the zone, and a post-logout URI per
                 host as well. The second is not decoration: signing out hands
                 Keycloak a post_logout_redirect_uri pointing back at the host
                 the person is looking at, and Keycloak refuses one it has not
                 been told about, which puts them on an error page instead of
                 back on the portal.

                 That URI is the host's front page and nothing else. The
                 Gateway's logout path (/oauth2/logout) sends the browser to
                 the realm's end-session endpoint with exactly
                 https://<host>/ as the way back, so exactly that is what is
                 registered: one URL per host, for the reason given at
                 validRedirectUris below. The front page is behind the
                 session, so arriving there signed out is arriving at the
                 realm's sign-in.

                 No back-channel logout URL. It used to point at the director,
                 which recorded the ended session so the edge would refuse it at
                 once. Nothing records it now: the realm issues five-minute
                 access tokens against a twelve-hour session, so the edge's
                 refresh fails within one token lifetime of the session ending,
                 which is the same outcome one token later and needs no write to
                 the authorization store.

                 Everything except LateInitialize, for the reason the portal BFF
                 client demonstrated further down: late-init copies fields the
                 provider observes but this template does not set out of the
                 live object into spec.forProvider, and the declared intent then
                 becomes whatever is already there. */}}
            ---
            apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
            kind: Client
            metadata:
              name: {{ $tenant }}-edge-zone-client
              annotations:
                crossplane.io/external-name: gentian-edge-{{ $zone }}
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-edge-zone-client
            spec:
              {{- /* Orphan, like every other client here. A zone client that
                   vanished on a reconcile hiccup would take the whole sign-in
                   domain with it, and a tenant that is torn down loses its
                   realm and everything in it anyway. */}}
              deletionPolicy: Orphan
              managementPolicies: ["Observe", "Create", "Update", "Delete"]
              forProvider:
                clientId: gentian-edge-{{ $zone }}
                name: {{ printf "%s edge (%s zone)" $brandName $zone | quote }}
                realmId: {{ $realm }}
                accessType: CONFIDENTIAL
                enabled: true
                standardFlowEnabled: true
                implicitFlowEnabled: false
                directAccessGrantsEnabled: false
                serviceAccountsEnabled: false
                fullScopeAllowed: false
                webOrigins: []
                validRedirectUris:
                  {{- range $host := $zoneHostNames }}
                  - https://{{ $host }}/oauth2/callback
                  - https://{{ $host }}/
                  {{- end }}
                validPostLogoutRedirectUris:
                  {{- range $host := $zoneHostNames }}
                  - https://{{ $host }}/
                  {{- end }}
                clientSecretSecretRef:
                  name: {{ $zoneSecret }}
                  namespace: {{ $edgeNs }}
                  key: client-secret
                {{- /* Where a person lands when the realm finishes with them.

                     An invitation's action-token mail may name a redirect, and
                     Keycloak refuses one that is not on validRedirectUris
                     above -- which listed each host's /oauth2/callback and
                     nothing else, the machine-facing end of the OIDC flow and
                     not a page for a human. So an invitation had to send no
                     redirect at all, and the person finished on Keycloak's
                     "your account has been updated" page with no way into the
                     product.

                     Each host's root is on the list now. One exact URL per
                     host rather than a wildcard: the list exists to stop an
                     open redirect, and widening it to /* would let anything
                     that can influence a redirect target reach any path on
                     these hosts. A root that the Gateway serves and the edge
                     signs into is all the invitation needs.

                     rootUrl is which of those hosts to use, stated here
                     because this is where the zone's domain is known. The
                     director reads it back off the client rather than deriving
                     it: the domain is a custom one, or the cluster's own
                     for the user tenant of a single-tenancy cluster, or the
                     tenant's subdomain, and the platform tenant's desktop is
                     on its zone's own name; a second derivation of that is a
                     second answer that can disagree with the hosts the
                     Gateway actually serves. */}}
                rootUrl: https://{{ $zoneDesktop }}
                {{- /* The platform's mark: a realm import makes no client
                     carrying it from a bundle (internal/keycloak
                     PlatformMarkerAttribute). The same on every client here. */}}
                extraConfig:
                  gentianos.io/managed-by: platform
              providerConfigRef:
                name: keycloak

            {{- /* The director in the zone token's audience.

                 The desktop's BFF relays to the director with the person's own
                 token, and the director refuses a token minted for someone
                 else. A Keycloak access token does not carry the requesting
                 client in aud -- azp names it, and aud holds only what an
                 audience mapper puts there -- so without this every relayed
                 call is refused on the audience.

                 A custom audience, not a client audience: gentian-director
                 names the platform's API and no Keycloak client is called
                 that. Keycloak (26.8 on) drops an audience that names a client
                 which is absent or disabled, and with included.client.audience
                 the token arrived with no audience at all.

                 All five config keys, not the three that express the intent,
                 for the reason the openbao-audience mapper below gives: this
                 map is replaced wholesale on reconcile and Keycloak adds the
                 other two on create.

                 No external-name, also for the reason given there: a protocol
                 mapper is identified by its UUID, and seeding the annotation
                 with the mapper's name hands the provider an id that will never
                 match. */}}
            ---
            apiVersion: client.keycloak.crossplane.io/v1alpha1
            kind: ProtocolMapper
            metadata:
              name: {{ $tenant }}-edge-zone-director-audience
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-edge-zone-director-audience
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                clientIdRef:
                  name: {{ $tenant }}-edge-zone-client
                  policy:
                    resolve: Always
                name: director-audience
                protocol: openid-connect
                protocolMapper: oidc-audience-mapper
                config:
                  included.custom.audience: gentian-director
                  id.token.claim: "false"
                  access.token.claim: "true"
                  introspection.token.claim: "true"
                  userinfo.token.claim: "false"
              providerConfigRef:
                name: keycloak

            {{- /* A partner app's client in the zone token's audience: an app
                 handed the person's zone token (forwardToken) exchanges it
                 at its client partner-<profile> for an assertion towards a
                 partner (requires.services.partners.call), and Keycloak
                 exchanges only a token that names the exchanging client.
                 The client authenticates by the app's own service account
                 token, so naming it here lets that app, and no other,
                 exchange. All five config keys, as at director-audience. */}}
            {{- range $pc := $partnerCallers }}
            ---
            apiVersion: client.keycloak.crossplane.io/v1alpha1
            kind: ProtocolMapper
            metadata:
              name: {{ $tenant }}-edge-zone-partner-{{ $pc }}-audience
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-edge-zone-partner-{{ $pc }}-audience
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                clientIdRef:
                  name: {{ $tenant }}-edge-zone-client
                  policy:
                    resolve: Always
                name: {{ printf "partner-%s-audience" $pc }}
                protocol: openid-connect
                protocolMapper: oidc-audience-mapper
                config:
                  included.custom.audience: {{ printf "partner-%s" $pc }}
                  id.token.claim: "false"
                  access.token.claim: "true"
                  introspection.token.claim: "true"
                  userinfo.token.claim: "false"
              providerConfigRef:
                name: keycloak
            {{- end }}

            {{- /* The exchange client in the zone token's audience.

                 Keycloak admits a client to a token exchange only when the
                 token it presents names that client in aud. The session's
                 token is this client's, so this mapper is what lets
                 gentian-edge-exchange, further down, trade it for an app's --
                 and without it every exchange is refused, whatever the
                 exchange client itself is allowed.

                 A custom audience like the director's beside it, here so that
                 the mapper does not wait on the exchange client existing: the
                 name is written into the token either way, and it only has to
                 be the clientId the exchange client is made with.

                 All five config keys and no external-name, for the reasons
                 given at director-audience above. */}}
            ---
            apiVersion: client.keycloak.crossplane.io/v1alpha1
            kind: ProtocolMapper
            metadata:
              name: {{ $tenant }}-edge-zone-exchange-audience
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-edge-zone-exchange-audience
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                clientIdRef:
                  name: {{ $tenant }}-edge-zone-client
                  policy:
                    resolve: Always
                name: exchange-audience
                protocol: openid-connect
                protocolMapper: oidc-audience-mapper
                config:
                  included.custom.audience: {{ $exchangeClientID }}
                  id.token.claim: "false"
                  access.token.claim: "true"
                  introspection.token.claim: "true"
                  userinfo.token.claim: "false"
              providerConfigRef:
                name: keycloak

            {{- /* Keycloak's six own defaults and deliberately not groups.

                 This list is replaced wholesale on reconcile, so it has to name
                 the six that were already there rather than only the absence
                 that matters: declaring an empty list would strip acr, basic,
                 email, profile, roles and web-origins from the client and every
                 zone token would lose its profile and email claims.

                 Stating the list at all, rather than leaving Keycloak's
                 defaults alone, is what makes each scope a fact this file
                 maintains instead of one that held until somebody changed it
                 by hand. */}}
            ---
            apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
            kind: ClientDefaultScopes
            metadata:
              name: {{ $tenant }}-edge-zone-default-scopes
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-edge-zone-default-scopes
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                clientIdRef:
                  name: {{ $tenant }}-edge-zone-client
                  policy:
                    resolve: Always
                defaultScopes:
                  - acr
                  - basic
                  - email
                  - profile
                  - roles
                  - web-origins
              providerConfigRef:
                name: keycloak

            {{- /* ── the token exchange client, its secret and the app scopes ──
                 A backend behind the edge is told who the person is in
                 headers, which anything that can reach it could set. An app
                 whose exposure says exchangeToken is handed a token instead:
                 the bouncer exchanges the session's token at this realm
                 (RFC 8693, Keycloak's standard token exchange) for one whose
                 audience is that app and nothing else, and the app verifies
                 it.

                 Three things in the realm make that possible and each is
                 useless alone: the mapper above, which puts this client in
                 the session token's audience; this client, which is the one
                 allowed to exchange; and one scope per app, which is the only
                 thing that can put the app in the new token's audience.

                 Rendered wherever the zone's client is, the tenant that
                 adopts the kernel realm included: the exchange is the edge's,
                 and a realm backs exactly one zone.

                 The secret is generated and delivered exactly as the zone
                 client's is, and everything said there holds here: generated
                 by External Secrets and not minted by Keycloak, once and
                 never again, no symbols, and owned by the ExternalSecret so
                 it goes when the zone does. */}}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              name: {{ $tenant }}-edge-exchange-password
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: edge-exchange-password
            spec:
              forProvider:
                manifest:
                  apiVersion: generators.external-secrets.io/v1alpha1
                  kind: Password
                  metadata:
                    name: {{ $exchangeSecret }}
                    namespace: {{ $edgeNs }}
                    labels:
                      app.kubernetes.io/managed-by: crossplane
                      gentianos.io/edge-exchange-realm: {{ $realm }}
                  spec:
                    length: 48
                    digits: 8
                    symbols: 0
                    noUpper: false
                    allowRepeat: true
                    secretKeys:
                      - client-secret
              providerConfigRef:
                name: kubernetes

            {{- /* The Secret the bouncer authenticates the exchange with, in
                 the edge namespace because that is where the bouncer runs.

                 The label on the Secret itself is how it is found and what it
                 says: the operator lists the Secrets that carry
                 gentianos.io/edge-exchange-realm and reads the realm's name
                 from the value, so no name is derived a second time on the
                 other side. It is the realm and not the zone or the tenant,
                 because the realm is what a token is exchanged at -- and for
                 the tenant that adopts the kernel realm those three differ. */}}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              name: {{ $tenant }}-edge-exchange-client-secret
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: edge-exchange-client-secret
            spec:
              {{- /* Ready when the ExternalSecret is, as for the zone's: the
                   sequencer rule below holds the Client back on it. */}}
              readiness:
                policy: DeriveFromObject
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1
                  kind: ExternalSecret
                  metadata:
                    name: {{ $exchangeSecret }}
                    namespace: {{ $edgeNs }}
                    labels:
                      app.kubernetes.io/managed-by: crossplane
                      gentianos.io/edge-exchange-realm: {{ $realm }}
                  spec:
                    refreshPolicy: CreatedOnce
                    refreshInterval: "0"
                    target:
                      name: {{ $exchangeSecret }}
                      creationPolicy: Owner
                      template:
                        metadata:
                          labels:
                            app.kubernetes.io/managed-by: gentian-os
                            gentianos.io/edge-exchange-realm: {{ $realm }}
                    dataFrom:
                      - sourceRef:
                          generatorRef:
                            apiVersion: generators.external-secrets.io/v1alpha1
                            kind: Password
                            name: {{ $exchangeSecret }}
              providerConfigRef:
                name: kubernetes

            {{- /* The client that exchanges, and does nothing else.

                 Confidential, with every flow off: no standard flow, no
                 direct access grants, no service account. Nobody signs in
                 through it and it is nobody -- it can only turn a token a
                 person already holds into a narrower one of the same person,
                 which is the one grant standardTokenExchangeEnabled switches
                 on (the client attribute standard.token.exchange.enabled).
                 No redirect URIs and no web origins, since nothing is ever
                 redirected to it.

                 fullScopeAllowed false, as on the zone's client and for more
                 reason: with it on, the exchanged token would carry every
                 role of the person, and with them the audience of every
                 client those roles belong to. The token is to be worth
                 something at one app.

                 Orphan and everything except LateInitialize, as on the
                 zone's client above. */}}
            ---
            apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
            kind: Client
            metadata:
              name: {{ $tenant }}-edge-exchange-client
              annotations:
                crossplane.io/external-name: {{ $exchangeClientID }}
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-edge-exchange-client
            spec:
              deletionPolicy: Orphan
              managementPolicies: ["Observe", "Create", "Update", "Delete"]
              forProvider:
                clientId: {{ $exchangeClientID }}
                name: {{ printf "%s edge (token exchange)" $brandName | quote }}
                realmId: {{ $realm }}
                accessType: CONFIDENTIAL
                enabled: true
                standardFlowEnabled: false
                implicitFlowEnabled: false
                directAccessGrantsEnabled: false
                serviceAccountsEnabled: false
                fullScopeAllowed: false
                standardTokenExchangeEnabled: true
                extraConfig:
                  gentianos.io/managed-by: platform
                clientSecretSecretRef:
                  name: {{ $exchangeSecret }}
                  namespace: {{ $edgeNs }}
                  key: client-secret
              providerConfigRef:
                name: keycloak

            {{- /* One default scope, basic, where the intent is none.

                 Keycloak gives a new client the realm's six defaults, and an
                 exchanged token would carry what they map: the person's
                 profile, their email, their roles. None of that is what the
                 token is for, so the list is stated and stated short.

                 It cannot be stated empty. The provider's schema requires
                 defaultScopes and its Go type drops an empty list when the
                 provider writes the object back, which it does on its first
                 pass to record the client it resolved -- so an empty list is
                 accepted once and refused from then on ("defaultScopes is a
                 required parameter"), and the six stay on the client. basic
                 is the least there is: it maps sub and auth_time, which say
                 whose token it is and nothing about them. */}}
            ---
            apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
            kind: ClientDefaultScopes
            metadata:
              name: {{ $tenant }}-edge-exchange-default-scopes
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-edge-exchange-default-scopes
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                clientIdRef:
                  name: {{ $tenant }}-edge-exchange-client
                  policy:
                    resolve: Always
                defaultScopes:
                  - basic
              providerConfigRef:
                name: keycloak

            {{- /* Which app a token is for: the scope "app-<profile>".

                 One per profile that asks, named exactly what AppTokenScope
                 in the operator (component_reconciler.go) returns for it.
                 That function is what writes the scope's name onto the app's
                 routes for the bouncer to ask for, so the two have to agree
                 letter for letter: a scope the realm does not hold under
                 that name is an exchange Keycloak refuses (invalid_scope).

                 Its one mapper puts the profile's name in the audience of an
                 ACCESS token, and nothing else in the realm does. A custom
                 audience, like the director's and unlike the mailbox scope's
                 below: an app need not be a client of this realm to be an
                 audience -- many have no sign-in of their own, which is why
                 they are handed a token at all -- and Keycloak drops a client
                 audience whose client does not exist.

                 includeInTokenScope puts the name in the token's scope claim
                 too, so a backend can see what it was issued as.

                 The scope's observed id rather than a ref, as for the mailbox
                 scope: a mapper's API path needs the UUID, so the mapper is
                 not rendered until the scope has been observed once.

                 No external-name, as on the protocol mappers and for the
                 same reason: a client scope's external name is its UUID,
                 and the provider finds an existing scope by realm and name
                 without being told anything. Seeding the annotation with
                 the scope's name is worse than useless here, because this
                 MR late-initialises: every reconcile the provider wrote the
                 UUID back, the composite wrote the name back, and the two
                 writes a second opened the composite's watch circuit
                 (Responsive=False, WatchCircuitOpen). */}}
            {{- $exchangeScopes := list }}
            {{- range $p := $exchangeProfiles }}
            {{- $scope := printf "app-%s" $p }}
            ---
            apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
            kind: ClientScope
            metadata:
              name: {{ $tenant }}-edge-exchange-scope-{{ $p }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-edge-exchange-scope-{{ $p }}
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                name: {{ $scope }}
                description: {{ printf "A token of the signed-in person for %s and nothing else" $p | quote }}
                includeInTokenScope: true
              providerConfigRef:
                name: keycloak
            {{- $scopeID := dig "resources" (printf "keycloak-edge-exchange-scope-%s" $p) "resource" "status" "atProvider" "id" "" $observed }}
            {{- if $scopeID }}
            {{- $exchangeScopes = append $exchangeScopes $scope }}
            ---
            apiVersion: client.keycloak.crossplane.io/v1alpha1
            kind: ProtocolMapper
            metadata:
              name: {{ $tenant }}-edge-exchange-scope-{{ $p }}-audience
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-edge-exchange-scope-{{ $p }}-audience
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                clientScopeId: {{ $scopeID }}
                name: app-audience
                protocol: openid-connect
                protocolMapper: oidc-audience-mapper
                config:
                  included.custom.audience: {{ $p }}
                  id.token.claim: "false"
                  access.token.claim: "true"
                  introspection.token.claim: "true"
                  userinfo.token.claim: "false"
              providerConfigRef:
                name: keycloak
            {{- /* And the app's partner client, for an app that calls partners:
                 the token it is handed names that client, which may then
                 exchange it (see the zone client's partner audiences). */}}
            {{- if has $p $partnerCallers }}
            ---
            apiVersion: client.keycloak.crossplane.io/v1alpha1
            kind: ProtocolMapper
            metadata:
              name: {{ $tenant }}-edge-exchange-scope-{{ $p }}-partner-audience
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-edge-exchange-scope-{{ $p }}-partner-audience
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                clientScopeId: {{ $scopeID }}
                name: partner-audience
                protocol: openid-connect
                protocolMapper: oidc-audience-mapper
                config:
                  included.custom.audience: {{ printf "partner-%s" $p }}
                  id.token.claim: "false"
                  access.token.claim: "true"
                  introspection.token.claim: "true"
                  userinfo.token.claim: "false"
              providerConfigRef:
                name: keycloak
            {{- end }}
            {{- /* Who the person is, for the app: their groups of this realm,
                 their address and their name, in the access token the app is
                 handed. The exchange client has no default scope beyond
                 basic, and the bouncer takes a token that names this one
                 scope and no other, so what the app reads has to come from
                 here. They are what the app learns of a person signing in to
                 it directly, where the realm's default scopes give them: an
                 editor check by group (a CMS's), and who did what. Into the
                 access token only; the scope's name in it stays this one. The
                 config is Keycloak's own for these mapper types, every key it
                 writes back, so the provider does not update them forever. */}}
            {{- range $m := (list
                  (dict "name" "groups" "type" "oidc-group-membership-mapper" "config" (dict "claim.name" "groups" "full.path" "false" "multivalued" "true"))
                  (dict "name" "email" "type" "oidc-usermodel-attribute-mapper" "config" (dict "claim.name" "email" "user.attribute" "email" "jsonType.label" "String"))
                  (dict "name" "full name" "type" "oidc-full-name-mapper" "config" (dict))) }}
            ---
            apiVersion: client.keycloak.crossplane.io/v1alpha1
            kind: ProtocolMapper
            metadata:
              name: {{ $tenant }}-edge-exchange-scope-{{ $p }}-{{ $m.name | replace " " "-" }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-edge-exchange-scope-{{ $p }}-{{ $m.name | replace " " "-" }}
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                clientScopeId: {{ $scopeID }}
                name: {{ $m.name | quote }}
                protocol: openid-connect
                protocolMapper: {{ $m.type }}
                config:
                  {{- range $k, $v := $m.config }}
                  {{ $k }}: {{ $v | quote }}
                  {{- end }}
                  id.token.claim: "false"
                  access.token.claim: "true"
                  introspection.token.claim: "true"
                  userinfo.token.claim: "false"
              providerConfigRef:
                name: keycloak
            {{- end }}
            {{- end }}
            {{- end }}

            {{- /* The app scopes as the exchange client's OPTIONAL scopes, and
                 its only ones.

                 Optional is what makes the exchange narrow: the bouncer asks
                 for one scope by name and the token names one app. As
                 defaults they would all be in every token, which is the
                 token this replaces. And only a scope the client has can be
                 asked for at all, so a profile that is not on this list
                 cannot be exchanged for.

                 Replaced wholesale on reconcile, like the default scopes, so
                 naming exactly these also takes away the optional scopes
                 Keycloak gives every client -- offline_access among them,
                 which nothing that only exchanges has a use for.

                 Only scopes that have been observed. A scope is attached by
                 its name and has to exist first; one that is seconds away
                 would fail the whole list, and it is here on the next pass.

                 Not rendered while the list is empty, which is a limit and
                 not a choice: the provider cannot hold an empty
                 optionalScopes, for the reason given at the default scopes
                 above. So a realm no app of which asks keeps Keycloak's own
                 optional scopes on this client until the first one does, and
                 the last app to stop asking leaves its scope attached --
                 dropping the object detaches nothing, since it is Orphan like
                 the rest. Neither is reachable: the bouncer asks only for
                 the scope a route names, and a route names one only while
                 its profile asks. */}}
            {{- if gt (len $exchangeScopes) 0 }}
            ---
            apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
            kind: ClientOptionalScopes
            metadata:
              name: {{ $tenant }}-edge-exchange-optional-scopes
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-edge-exchange-optional-scopes
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                clientIdRef:
                  name: {{ $tenant }}-edge-exchange-client
                  policy:
                    resolve: Always
                optionalScopes:
                  {{- range $scope := $exchangeScopes }}
                  - {{ $scope }}
                  {{- end }}
              providerConfigRef:
                name: keycloak
            {{- end }}

            {{- /* ── vouching: a component that speaks for people ────────────
                 A component that works for a person who is not at a browser
                 has no session to exchange. One whose profile declares
                 requires.services.vouching signs a short statement naming
                 the person instead, and this realm answers it with a token
                 of that person for one app (RFC 7523, which Keycloak calls
                 the JWT authorization grant).

                 Per such component the realm holds two things under one
                 name, vouch-<profile> -- VouchingAlias in the operator
                 (vouching.go), which is what the registrar links people to
                 and what the component is told, so the name is made here
                 letter for letter as it is made there. An identity provider
                 entry, which is what makes the component an issuer the realm
                 believes and says where its keys are. And a client, which is
                 what the component asks with and which can do nothing else.

                 Nothing here says who the component may speak for. The realm
                 finds the person only through a link from that person to
                 this identity provider entry, and no link is composed: the
                 registrar makes one on a request that carries the person's
                 own token. No link, no token.

                 Rendered for the tenant that adopts the kernel realm as well,
                 like the exchange client above and for its reason: these
                 belong to a component of the tenant, not to the realm's own
                 configuration.

                 Not rendered where the cluster has not published Keycloak's
                 address inside the cluster. The component is told where to
                 ask in the Secret below, and a Secret that says nowhere is a
                 component that fails at its first request with nothing to
                 show for why. */}}
            {{- if and $kcInternal (gt (len $vouchingProfiles) 0) }}
            {{- /* A client id and a client secret for the identity provider
                 entries, which are never used and cannot be left out.

                 The provider has one way to write an identity provider of
                 this family, its OIDC resource, and that resource cannot be
                 written without the credentials Keycloak would present AT an
                 identity provider it signs people in through. Nobody signs
                 in through these, so Keycloak never presents anything. The
                 values say what they are, and they are deliberately not the
                 vouching client's: a real credential in a field nothing
                 reads is one more place to find it.

                 One per tenant, beside the broker's client id and for the
                 same reason it is a Secret at all: a secretRef is the only
                 way the provider takes either. */}}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              name: {{ $tenant }}-vouching-issuer-credential
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-vouching-issuer-credential
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: {{ $tenant }}-vouching-issuer-credential
                    namespace: {{ $identityNs }}
                    labels:
                      app.kubernetes.io/managed-by: crossplane
                  stringData:
                    client_id: not-used
                    client_secret: not-used
              providerConfigRef:
                name: kubernetes
            {{- range $v := $vouchingProfiles }}
            {{- $p := $v.profile }}
            {{- /* The three names the operator derives in vouching.go:
                 VouchingAlias, VouchingIssuer and VouchingSecretName. */}}
            {{- $vouchAlias  := printf "vouch-%s" $p }}
            {{- $vouchIssuer := printf "https://%s.%s.svc" $vouchAlias $ns }}
            {{- $vouchSecret := printf "vouching-%s" $p }}

            {{- /* The component as an issuer the realm believes.

                 The issuer is a name and is never fetched. It is what the
                 component's statements carry as iss, and Keycloak finds this
                 entry by it, so it has to be exactly what VouchingIssuer
                 returns. It is a name no certificate can be had for, on
                 purpose: nothing could be served there.

                 The keys are fetched, from the component's own Service in
                 the tenant's namespace, at the address its profile gives.
                 Over plain HTTP inside the cluster, as Keycloak reaches the
                 kernel realm's keys further down. A component can therefore
                 replace its keys by publishing new ones, and nothing here
                 changes when it does.

                 providerId jwt-authorization-grant, through the one field of
                 the OIDC resource that says which implementation an entry
                 is. That is Keycloak's identity provider for exactly this: it
                 verifies statements and has no sign-in of its own, so a
                 browser sent to it gets an error page and nobody can link
                 themselves to it by signing in somewhere. hideOnLoginPage and
                 linkOnly say the same to anything that reads those instead.
                 authorizationUrl and tokenUrl are, like the credentials
                 above, fields the resource insists on and this
                 implementation never reads; they repeat the issuer so that
                 they point nowhere new.

                 jwtAuthorizationGrantEnabled is the switch itself, and has no
                 field on the provider, so it is carried in extraConfig.
                 useJwksUrl is not stated, for the reason given at the kernel
                 realm's broker further down: the provider sets it from
                 jwksUrl.

                 No tokens stored, no email trusted, nobody signed in by
                 default: nothing of a person comes from this issuer except
                 the claim that it is them.

                 Orphan and everything except LateInitialize, like every other
                 identity object here, and with more at stake than most: the
                 links of the people who agreed hang on this entry, and
                 Keycloak deletes them with it. An entry that went on a
                 reconcile that could not read the projection would take
                 every one of them along. */}}
            ---
            apiVersion: oidc.keycloak.crossplane.io/v1alpha1
            kind: IdentityProvider
            metadata:
              name: {{ $tenant }}-vouching-{{ $p }}-idp
              annotations:
                crossplane.io/external-name: {{ $vouchAlias }}
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-vouching-idp-{{ $p }}
            spec:
              deletionPolicy: Orphan
              managementPolicies: ["Observe", "Create", "Update", "Delete"]
              forProvider:
                realm: {{ $realm }}
                alias: {{ $vouchAlias }}
                displayName: {{ printf "Vouching (%s)" $p | quote }}
                providerId: jwt-authorization-grant
                enabled: true
                hideOnLoginPage: true
                linkOnly: true
                authenticateByDefault: false
                trustEmail: false
                storeToken: false
                addReadTokenRoleOnCreate: false
                backchannelSupported: false
                disableUserInfo: true
                syncMode: IMPORT
                validateSignature: true
                issuer: {{ $vouchIssuer }}
                jwksUrl: {{ printf "http://%s.%s.svc.cluster.local:%s%s" $v.service $ns $v.port $v.path | quote }}
                authorizationUrl: {{ $vouchIssuer }}
                tokenUrl: {{ $vouchIssuer }}
                extraConfig:
                  jwtAuthorizationGrantEnabled: "true"
                clientIdSecretRef:
                  name: {{ $tenant }}-vouching-issuer-credential
                  namespace: {{ $identityNs }}
                  key: client_id
                clientSecretSecretRef:
                  name: {{ $tenant }}-vouching-issuer-credential
                  namespace: {{ $identityNs }}
                  key: client_secret
              providerConfigRef:
                name: keycloak

            {{- /* The client's secret, generated exactly as the exchange
                 client's is and for the reasons given at the zone client's:
                 by External Secrets and not minted by Keycloak, once and
                 never again, no symbols.

                 In the tenant's namespace this time, because that is where
                 the component runs and the Secret is the component's to
                 read. And under the key "secret", not "client-secret": the
                 Secret below is templated, and a template reads a key with a
                 hyphen in it only the long way round. */}}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              name: {{ $tenant }}-vouching-{{ $p }}-password
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: vouching-password-{{ $p }}
            spec:
              forProvider:
                manifest:
                  apiVersion: generators.external-secrets.io/v1alpha1
                  kind: Password
                  metadata:
                    name: {{ $vouchSecret }}
                    namespace: {{ $ns }}
                    labels:
                      app.kubernetes.io/managed-by: crossplane
                  spec:
                    length: 48
                    digits: 8
                    symbols: 0
                    noUpper: false
                    allowRepeat: true
                    secretKeys:
                      - secret
              providerConfigRef:
                name: kubernetes

            {{- /* What the component is told: the Secret VouchingSecretName
                 names, in the tenant's namespace, under the four keys
                 vouching.go lists. The generated secret, and beside it the
                 three things that are not secret and that the component
                 would otherwise have to work out the way this file does --
                 what to call itself in a statement, which client to ask as,
                 and where.

                 Where is the realm's token endpoint as Keycloak is reached
                 from inside the cluster (identity.internalUrl, which the
                 broker further down uses for the same server-to-server
                 half), not the public one: the component is a workload of
                 the cluster and has no reason to leave it through the
                 ingress and come back.

                 The template is External Secrets' and not this function's,
                 which is why the one value it fills in is written inside a
                 raw string.

                 Written once, like the secret in it. So an address that
                 changes later -- a cluster that moves its Keycloak -- is not
                 followed: the Secret is deleted and made again, which is
                 also a new client secret. */}}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              name: {{ $tenant }}-vouching-{{ $p }}-secret
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: vouching-secret-{{ $p }}
            spec:
              {{- /* Ready when the ExternalSecret is, as for the zone's: the
                   sequencer rule below holds the Client back on it. */}}
              readiness:
                policy: DeriveFromObject
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1
                  kind: ExternalSecret
                  metadata:
                    name: {{ $vouchSecret }}
                    namespace: {{ $ns }}
                    labels:
                      app.kubernetes.io/managed-by: crossplane
                  spec:
                    refreshPolicy: CreatedOnce
                    refreshInterval: "0"
                    target:
                      name: {{ $vouchSecret }}
                      creationPolicy: Owner
                      template:
                        metadata:
                          labels:
                            app.kubernetes.io/managed-by: gentian-os
                        data:
                          VOUCHING_ISSUER: {{ $vouchIssuer | quote }}
                          VOUCHING_CLIENT_ID: {{ $vouchAlias | quote }}
                          VOUCHING_CLIENT_SECRET: "{{ `{{ .secret }}` }}"
                          VOUCHING_TOKEN_URL: {{ printf "%s/realms/%s/protocol/openid-connect/token" $kcInternal $realm | quote }}
                    dataFrom:
                      - sourceRef:
                          generatorRef:
                            apiVersion: generators.external-secrets.io/v1alpha1
                            kind: Password
                            name: {{ $vouchSecret }}
              providerConfigRef:
                name: kubernetes

            {{- /* The client the component asks with, and does nothing else
                 with.

                 Confidential, with every flow off, as the exchange client is:
                 nobody signs in through it and it is nobody itself. What it
                 can do is in two attributes the provider has no fields for:
                 that it may use the JWT authorization grant, and for which
                 issuer -- this component's and no other, so one vouching
                 component cannot ask on the strength of another's
                 statements.

                 fullScopeAllowed false, for the exchange client's reason: the
                 token is to be worth something at one app, and with it on it
                 would carry every role of the person.

                 Orphan and everything except LateInitialize, as on the
                 zone's client above. */}}
            ---
            apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
            kind: Client
            metadata:
              name: {{ $tenant }}-vouching-{{ $p }}-client
              annotations:
                crossplane.io/external-name: {{ $vouchAlias }}
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-vouching-client-{{ $p }}
            spec:
              deletionPolicy: Orphan
              managementPolicies: ["Observe", "Create", "Update", "Delete"]
              forProvider:
                clientId: {{ $vouchAlias }}
                name: {{ printf "%s vouching (%s)" $brandName $p | quote }}
                realmId: {{ $realm }}
                accessType: CONFIDENTIAL
                enabled: true
                standardFlowEnabled: false
                implicitFlowEnabled: false
                directAccessGrantsEnabled: false
                serviceAccountsEnabled: false
                fullScopeAllowed: false
                extraConfig:
                  oauth2.jwt.authorization.grant.enabled: "true"
                  oauth2.jwt.authorization.grant.idp: {{ $vouchAlias }}
                  gentianos.io/managed-by: platform
                clientSecretSecretRef:
                  name: {{ $vouchSecret }}
                  namespace: {{ $ns }}
                  key: VOUCHING_CLIENT_SECRET
              providerConfigRef:
                name: keycloak

            {{- /* One default scope, basic, as on the exchange client and for
                 everything said there: the realm's six defaults would put
                 the person's profile, email and roles in every token, the
                 provider cannot hold an empty list, and basic says whose
                 token it is and nothing about them. */}}
            ---
            apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
            kind: ClientDefaultScopes
            metadata:
              name: {{ $tenant }}-vouching-{{ $p }}-default-scopes
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-vouching-default-scopes-{{ $p }}
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                clientIdRef:
                  name: {{ $tenant }}-vouching-{{ $p }}-client
                  policy:
                    resolve: Always
                defaultScopes:
                  - basic
              providerConfigRef:
                name: keycloak

            {{- /* The app scopes as this client's OPTIONAL scopes: the same
                 list the exchange client has, read off the same observed
                 scopes, so a vouching component can ask for a token for any
                 app of the tenant that has a scope, one app at a time. The
                 component names the scope it asks for; a token asked for
                 with none names no app and is worth nothing at one.

                 Not rendered while the list is empty, which is the
                 provider's limit described above. Until the first app scope
                 exists this client keeps the optional scopes Keycloak gives
                 every client, offline_access among them. What they can add
                 to a token of this client is what Keycloak's own mappers for
                 them say about the person, a user name for one. With full
                 scope off and none of them naming an audience, such a token
                 still names no app and carries no role, and this grant
                 answers with no refresh token whatever is asked for. */}}
            {{- if gt (len $exchangeScopes) 0 }}
            ---
            apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
            kind: ClientOptionalScopes
            metadata:
              name: {{ $tenant }}-vouching-{{ $p }}-optional-scopes
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-vouching-optional-scopes-{{ $p }}
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                clientIdRef:
                  name: {{ $tenant }}-vouching-{{ $p }}-client
                  policy:
                    resolve: Always
                optionalScopes:
                  {{- range $scope := $exchangeScopes }}
                  - {{ $scope }}
                  {{- end }}
              providerConfigRef:
                name: keycloak
            {{- end }}
            {{- end }}
            {{- end }}

            {{- if not $adoptsKernelRealm }}
            {{- /* The realm states its memberships to the platform.

                 Who is in which group is Keycloak's to say, and the
                 authorization store holds a projection of it, fed by the
                 gentian-director listener inside Keycloak. The listener runs
                 only in a realm that names it, and only the kernel realm did
                 -- the install script sets it there. So no tenant realm ever
                 stated a membership, the store never learned that a tenant's
                 administrator administers it, and the edge refused every
                 person of every tenant: "This is not available to you", after
                 a sign-in that had just succeeded.

                 Admin events carry what an administrator changes; user events
                 carry a sign-in, on which the listener states that person's
                 groups afresh -- which is also what repairs a membership that
                 was made before this was declared. */}}
            ---
            apiVersion: realm.keycloak.crossplane.io/v1alpha1
            kind: RealmEvents
            metadata:
              name: {{ $tenant }}-realm-events
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-realm-events
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                eventsEnabled: true
                # Thirty days in the realm's database: a buffer for the
                # administration console, not the record. The record is what
                # the realm writes to stdout as it happens, which a forwarder
                # can keep for as long as its destination says.
                eventsExpiration: 2592000
                adminEventsEnabled: true
                adminEventsDetailsEnabled: false
                eventsListeners:
                  - jboss-logging
                  - gentian-director
              providerConfigRef:
                name: keycloak
            {{- /* The mailbox store's client is realm state: one per realm,
                 owned by whoever owns the realm. A tenant that adopts the
                 kernel realm owns none of it, and composing it here would make
                 two writers of the identity bootstrap's clients. */}}

            {{- /*
            Dovecot's OIDC client, on clusters that run Dovecot.

            Gated on mail.serviceMode the same way the operator gates Dovecot
            provisioning: on a cluster relaying through a smarthost there is no
            IMAP server, and a client nothing authenticates as would sit in every
            tenant realm suggesting otherwise.

            It exists only to call the realm's token introspection endpoint and
            validate XOAUTH2 tokens other clients issued. Nothing is redirected to
            it and nobody is entitled to it, so there are no redirect URIs, no web
            origins, no client scope and no roles — and fullScopeAllowed is false,
            read off the live client rather than assumed.

            Confidential, and the secret is not Keycloak's to choose: Dovecot
            authenticates to introspection with the value in dovecot-admin. An
            omitted clientSecretSecretRef would have Keycloak generate a new one
            and IMAP would stop validating tokens.
            */}}
            {{- if eq (dig "mail.serviceMode" "" $ccData) "system" }}
            ---
            apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
            kind: Client
            metadata:
              name: {{ $tenant }}-dovecot-oidc-client
              annotations:
                crossplane.io/external-name: gentian-dovecot
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-dovecot-oidc-client
            spec:
              deletionPolicy: Orphan
              # Everything except LateInitialize. This client has a second writer —
              # the Dovecot OIDC Job still provisions the same clientId in this realm
              # — and late-init copies fields the provider observes but this template
              # does not set out of the live object into spec.forProvider, making the
              # Job's values this resource's declared intent. The portal BFF client is
              # what that looks like when the two disagree: Synced=False, unable to
              # reconcile, while reading Ready=True.
              #
              # The Job's tenant-realm half is written and verified but blocked on
              # roadmap 1.29; until it lands, this is what keeps the two apart.
              managementPolicies: ["Observe", "Create", "Update", "Delete"]
              forProvider:
                clientId: gentian-dovecot
                realmId: {{ $realm }}
                accessType: CONFIDENTIAL
                enabled: true
                standardFlowEnabled: false
                implicitFlowEnabled: false
                directAccessGrantsEnabled: false
                serviceAccountsEnabled: false
                fullScopeAllowed: false
                extraConfig:
                  gentianos.io/managed-by: platform
                clientSecretSecretRef:
                  name: dovecot-admin
                  namespace: system-mail
                  key: oidc_client_secret
              providerConfigRef:
                name: keycloak

            {{- /* Which tokens open a mailbox: the scope "mailbox".

                 Keycloak (26.6 on) answers a token introspection "active"
                 only when the token's audience names the client that asks.
                 Dovecot asks as gentian-dovecot, and no token names it unless
                 something puts it there. This scope is that something, and
                 the only one: its one mapper adds gentian-dovecot to the
                 audience of an ACCESS token, and nothing else in the realm
                 does. gentian-dovecot carries no attribute that switches the
                 audience check off for it, which would have it accept every
                 token of the realm again
                 (TestNothingSwitchesTheIntrospectionAudienceCheckOff).

                 The scope is given to no client here. app-default gives it,
                 as an OPTIONAL scope, to the sign-in client of an app whose
                 profile declares requires.services.mail.imap.tokenSignIn. So
                 a token names the mail server only when such an app asked
                 for "mailbox" at that sign-in; Keycloak refuses the request
                 of a client that does not have the scope (invalid_scope).
                 Dovecot checks the scope as well as Keycloak the audience
                 (scope = mailbox in each realm's oauth2 settings).

                 A client audience, not a custom one, and on purpose the
                 opposite of director-audience above: gentian-dovecot IS a
                 client of this realm, and Keycloak leaving the audience out
                 when that client is disabled or gone is the behaviour wanted
                 here -- no mail server client, no mailbox tokens.

                 includeInTokenScope is what puts the name in the token's
                 scope claim, which is what Dovecot reads.

                 No external-name, for the reason given at the exchange
                 scopes above: the provider finds the scope by its name and
                 stores its UUID, and seeding the name set off a write loop
                 with it. */}}
            ---
            apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
            kind: ClientScope
            metadata:
              name: {{ $tenant }}-mailbox-scope
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-mailbox-scope
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                name: mailbox
                description: Open the signed-in person's mailbox on the mail server
                includeInTokenScope: true
              providerConfigRef:
                name: keycloak
            {{- /* The scope's observed id rather than a ref, as for the groups
                 scope below: the scope is found by its name, and the API path
                 of a mapper needs the UUID. Not rendered until the scope has
                 been observed once. */}}
            {{- $mailboxScopeID := dig "resources" "keycloak-mailbox-scope" "resource" "status" "atProvider" "id" "" $observed }}
            {{- if $mailboxScopeID }}
            ---
            apiVersion: client.keycloak.crossplane.io/v1alpha1
            kind: ProtocolMapper
            metadata:
              name: {{ $tenant }}-mailbox-scope-audience
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-mailbox-scope-audience
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                clientScopeId: {{ $mailboxScopeID }}
                name: mailbox-audience
                protocol: openid-connect
                protocolMapper: oidc-audience-mapper
                config:
                  included.client.audience: gentian-dovecot
                  id.token.claim: "false"
                  access.token.claim: "true"
                  introspection.token.claim: "true"
                  userinfo.token.claim: "false"
              providerConfigRef:
                name: keycloak
            {{- end }}
            {{- end }}

            {{- end }}
            {{- if and $kernelRealm $kcInternal }}
            {{- /* ── the tenant's entitlement groups ─────────────────────────
                 Three fixed, one per app. The names are internal/keycloak/groups.go's
                 contract — members, admins, app-admins, and app:<profile> — and
                 they carry one attribute, the platform's mark, which a realm
                 import reads: such a group keeps the id it has here and is never
                 made from a bundle (internal/keycloak PlatformMarkerAttribute).

                 No external-name. A group is identified by its UUID, so it cannot
                 be adopted from its name; given the realm and the name, the
                 provider resolves the existing one instead, which is how the pack's
                 mappers and client role adopted without being recreated. Keycloak
                 refuses a second top-level group of the same name, so the failure
                 mode if it does not resolve is a conflict rather than a duplicate.

                 The gentian-groups Job still makes these. It also covers profiles
                 that are not on spec.apps, which this cannot see — CollectTenantGroupNames
                 takes an additionalProfiles argument for exactly that — so the Job
                 goes only once that gap is closed.
              */}}
            {{- /* Only the four that belong to the tenant itself. The per-app
                 group is app-default's, because its name follows the resolved
                 profile and its attributes come from that profile's
                 gentianos.io/keycloak-group-attributes annotation — nine of the
                 catalogue's profiles carry one, and the Odoo ones drive module
                 and role provisioning. This Composition cannot see a ComponentProfile;
                 app-default already fetches it.

                 The two administrators' groups carry one attribute more, the
                 role a partner assertion says for their members
                 (gentianPartnerRole; internal/keycloak PartnerRoleAttribute):
                 tenant-admin on admins, cluster-admin on platform-admins --
                 the group the platform's administrators are in while they are
                 here through the provider "kernel" (below), which grants
                 nothing itself. The scope partner-<name> reads the attribute
                 off the person's groups and nothing else does. The groups Job
                 sets the same, so the two writers agree.

                 app-admins is the exception: the groups Job writes onto it the
                 roles an app's administrator gets, collected from the installed
                 profiles (gentianOdooGroupRoles, from each one's
                 gentianOdooAdminRoles), which this Composition cannot see.
                 Declared here, the group's attributes were put back to the mark
                 alone on every reconcile, and app administrators lost every
                 app's administrator roles -- Odoo's Sales/Administrator among
                 them -- until the Job ran again. So its mark is set when the
                 group is made (initProvider) and the attributes are the Job's
                 after that; without LateInitialize, so they are not copied into
                 forProvider and enforced from there either. */}}
            {{- $groupNames := list
                  (dict "name" (printf "gentian:tenant:%s:members" $tenant) "attributes" (dict))
                  (dict "name" (printf "gentian:tenant:%s:admins" $tenant) "attributes" (dict "gentianPartnerRole" "tenant-admin" "gentianRequiresMFA" "true"))
                  (dict "name" (printf "gentian:tenant:%s:platform-admins" $tenant) "attributes" (dict "gentianPartnerRole" "cluster-admin" "gentianRequiresMFA" "true"))
                  (dict "name" (printf "gentian:tenant:%s:app-admins" $tenant) "attributes" (dict) "jobOwnsAttributes" true) }}
            {{- range $group := $groupNames }}
            {{- $g := $group.name }}
            {{- $gslug := $g | lower | replace ":" "-" | replace "_" "-" | replace "." "-" }}
            ---
            apiVersion: group.keycloak.crossplane.io/v1alpha1
            kind: Group
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-group-{{ $gslug }}
              name: {{ $gslug }}
            spec:
              deletionPolicy: Orphan
              {{- if $group.jobOwnsAttributes }}
              managementPolicies: ["Observe", "Create", "Update", "Delete"]
              initProvider:
                attributes:
                  gentianos.io/managed-by: platform
              forProvider:
                realmId: {{ $realm }}
                name: {{ $g | quote }}
              {{- else }}
              forProvider:
                realmId: {{ $realm }}
                name: {{ $g | quote }}
                attributes:
                  gentianos.io/managed-by: platform
                  {{- range $k, $v := $group.attributes }}
                  {{ $k }}: {{ $v | quote }}
                  {{- end }}
              {{- end }}
              providerConfigRef:
                name: keycloak
            {{- end }}
            {{- /* The tenant's own groups, declared in git (spec.groups): plain
                 groups, without the registrar's custom mark, so the console
                 puts people in them and neither renames nor deletes them. */}}
            {{- range $g := (dig "groups" list $spec) }}
            {{- if and (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" (toString $g)) (not (hasPrefix "gentian" (toString $g))) }}
            ---
            apiVersion: group.keycloak.crossplane.io/v1alpha1
            kind: Group
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-declared-group-{{ $g }}
              name: {{ $tenant }}-group-{{ $g }}
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                name: {{ $g | quote }}
                {{- /* The platform's mark, as on every group a Composition
                     makes: a realm import does not make it again from a
                     bundle, since this does. */}}
                attributes:
                  gentianos.io/managed-by: platform
              providerConfigRef:
                name: keycloak
            {{- end }}
            {{- end }}
            {{- if not $adoptsKernelRealm }}

            {{- /* ── the sign-in flow ──────────────────────────────────────────
                 Keycloak's stock browser flow, with one rule added: a person in
                 a group marked gentianRequiresMFA gives a second factor at every
                 sign-in, and enrolls first if they have none. Enforced here and
                 not per account, so it follows the group: whoever is put in it,
                 by whatever path, meets it at their next sign-in. Everybody else
                 is asked only if they set a second factor up. */}}
            ---
            apiVersion: authenticationflow.keycloak.crossplane.io/v1alpha1
            kind: Flow
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-browser-flow
              name: {{ $tenant }}-browser-flow
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                alias: gentian-browser
                description: The stock browser flow, with a second factor required of administrators
                providerId: basic-flow
              providerConfigRef:
                name: keycloak
            {{- range $e := (list
                  (dict "kind" "Execution" "id" "cookie" "parent" "gentian-browser" "authenticator" "auth-cookie" "requirement" "ALTERNATIVE" "priority" 10)
                  (dict "kind" "Execution" "id" "redirector" "parent" "gentian-browser" "authenticator" "identity-provider-redirector" "requirement" "ALTERNATIVE" "priority" 20)
                  (dict "kind" "Subflow" "id" "forms" "parent" "gentian-browser" "alias" "gentian-browser-forms" "requirement" "ALTERNATIVE" "priority" 30)
                  (dict "kind" "Execution" "id" "password" "parent" "gentian-browser-forms" "authenticator" "auth-username-password-form" "requirement" "REQUIRED" "priority" 10)
                  (dict "kind" "Subflow" "id" "admin" "parent" "gentian-browser-forms" "alias" "gentian-browser-admin" "requirement" "CONDITIONAL" "priority" 20)
                  (dict "kind" "Execution" "id" "admin-is" "parent" "gentian-browser-admin" "authenticator" "conditional-user-attribute" "requirement" "REQUIRED" "priority" 10 "not" "false")
                  (dict "kind" "Execution" "id" "admin-otp" "parent" "gentian-browser-admin" "authenticator" "auth-otp-form" "requirement" "REQUIRED" "priority" 20)
                  (dict "kind" "Subflow" "id" "other" "parent" "gentian-browser-forms" "alias" "gentian-browser-other" "requirement" "CONDITIONAL" "priority" 30)
                  (dict "kind" "Execution" "id" "other-configured" "parent" "gentian-browser-other" "authenticator" "conditional-user-configured" "requirement" "REQUIRED" "priority" 10)
                  (dict "kind" "Execution" "id" "other-is-not" "parent" "gentian-browser-other" "authenticator" "conditional-user-attribute" "requirement" "REQUIRED" "priority" 20 "not" "true")
                  (dict "kind" "Execution" "id" "other-otp" "parent" "gentian-browser-other" "authenticator" "auth-otp-form" "requirement" "REQUIRED" "priority" 30)
               ) }}
            ---
            apiVersion: authenticationflow.keycloak.crossplane.io/v1alpha1
            kind: {{ $e.kind }}
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-browser-exec-{{ $e.id }}
              name: {{ $tenant }}-browser-exec-{{ $e.id }}
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                parentFlowAlias: {{ $e.parent }}
                {{- if eq $e.kind "Subflow" }}
                alias: {{ $e.alias }}
                providerId: basic-flow
                {{- else }}
                authenticator: {{ $e.authenticator }}
                {{- end }}
                requirement: {{ $e.requirement }}
                priority: {{ $e.priority }}
              providerConfigRef:
                name: keycloak
            {{- if hasKey $e "not" }}
            ---
            apiVersion: authenticationflow.keycloak.crossplane.io/v1alpha1
            kind: ExecutionConfig
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-browser-config-{{ $e.id }}
              name: {{ $tenant }}-browser-config-{{ $e.id }}
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                executionIdRef:
                  name: {{ $tenant }}-browser-exec-{{ $e.id }}
                alias: gentian-browser-{{ $e.id }}
                config:
                  attribute_name: gentianRequiresMFA
                  attribute_expected_value: "true"
                  include_group_attributes: "true"
                  not: {{ $e.not | quote }}
              providerConfigRef:
                name: keycloak
            {{- end }}
            {{- end }}

            {{- /* ── the profile prompts a tenant user must not meet ───────────
                 A tenant user arrives through the kernel IdP with their profile
                 already filled in. Left enabled, these two stop them on a form
                 asking for details the kernel realm has already vouched for.

                 name and priority are Keycloak's own for these built-ins and are
                 declared because the resource carries them: omitting a field the
                 provider writes means writing its zero value.
              */}}
            {{- range $ra := (list (dict "alias" "VERIFY_PROFILE" "name" "Verify Profile" "priority" 90) (dict "alias" "UPDATE_PROFILE" "name" "Update Profile" "priority" 40)) }}
            {{- /* Keycloak's aliases carry underscores, which a Kubernetes object
                 name may not. Only the object name is slugged; alias stays what
                 Keycloak calls it, because that is what identifies the action. */}}
            {{- $raSlug := $ra.alias | lower | replace "_" "-" }}
            ---
            apiVersion: realm.keycloak.crossplane.io/v1alpha1
            kind: RequiredAction
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-required-action-{{ $raSlug }}
              name: {{ $tenant }}-required-action-{{ $raSlug }}
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                alias: {{ $ra.alias }}
                name: {{ $ra.name | quote }}
                enabled: false
                defaultAction: false
                priority: {{ $ra.priority }}
              providerConfigRef:
                name: keycloak
            {{- end }}

            {{- /* ── what a user record is allowed to hold ────────────────────
                 The realm's user profile: six attributes and the group they
                 display under. Two of them are Gentian's — uid, which the broker
                 mappers fill and Synapse reads for its localpart, and
                 gentian.inviteEmail, the recovery address an admin sets when the
                 account's own email is still a transient invite address.

                 Declared whole, not patched. The realm script wrote this object
                 twice per run: once to append the two Gentian attributes, once to
                 strip `required` off firstName and lastName. Neither patch could
                 see what the other had done, and both re-read and rewrote the
                 same six-attribute document to change one field of it.

                 The cost of declaring it is that every validation is now ours to
                 restate, and one dropped by omission does not fail loudly — it
                 surfaces as a user who cannot save their name. So each is written
                 out as Keycloak returns it, including the built-in validators on
                 attributes Gentian never touches.

                 firstName and lastName carry no requiredForRoles, which is the
                 declarative spelling of the second patch: admin delivery swaps in
                 a transient email for action-token links, and a required name
                 field turns that into a profile form the user did not ask for.
                 email keeps requiredForRoles [user] — that one is Keycloak's
                 default and wanted.

                 Validator config values are strings: the provider passes them to
                 Keycloak as written, and 255 unquoted is a YAML integer.
              */}}
            ---
            apiVersion: realm.keycloak.crossplane.io/v1alpha1
            kind: UserProfile
            metadata:
              annotations:
                {{- /* The user profile is a singleton keyed by its realm, not a
                     UUID, so unlike the mappers it adopts from its name. */}}
                crossplane.io/external-name: {{ $tenant }}
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-user-profile
              name: {{ $tenant }}-user-profile
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                group:
                  - name: user-metadata
                    displayHeader: User metadata
                    displayDescription: Attributes, which refer to user metadata
                attribute:
                  - name: username
                    displayName: ${username}
                    multiValued: false
                    permissions:
                      - view: [admin, user]
                        edit: [admin, user]
                    validator:
                      - name: length
                        config:
                          min: "3"
                          max: "255"
                      - name: username-prohibited-characters
                      - name: up-username-not-idn-homograph
                  - name: email
                    displayName: ${email}
                    multiValued: false
                    requiredForRoles: [user]
                    permissions:
                      - view: [admin, user]
                        edit: [admin, user]
                    validator:
                      - name: email
                      - name: length
                        config:
                          max: "255"
                  - name: firstName
                    displayName: ${firstName}
                    multiValued: false
                    permissions:
                      - view: [admin, user]
                        edit: [admin, user]
                    validator:
                      - name: length
                        config:
                          max: "255"
                      - name: person-name-prohibited-characters
                  - name: lastName
                    displayName: ${lastName}
                    multiValued: false
                    permissions:
                      - view: [admin, user]
                        edit: [admin, user]
                    validator:
                      - name: length
                        config:
                          max: "255"
                      - name: person-name-prohibited-characters
                  - name: gentian.inviteEmail
                    displayName: Recovery email
                    multiValued: false
                    permissions:
                      - view: [admin]
                        edit: [admin]
                    validator:
                      - name: email
                      - name: length
                        config:
                          max: "255"
                  - name: uid
                    displayName: User ID
                    multiValued: false
                    permissions:
                      - view: [admin, user]
                        edit: [admin]
                    validator:
                      - name: length
                        config:
                          max: "255"
              providerConfigRef:
                name: keycloak


            {{- /* ── brokered to ──────────────────────────────────────────
                 Other tenants of this cluster where this tenant's people
                 sign in (spec.signInTo, projected by the operator as
                 brokeredTo): one client each, broker-to-<name>, that
                 sends a person back to the other realm's broker endpoint
                 and nowhere else.

                 No secret. The outside realm authenticates with a JWT it
                 signs with its own key (Keycloak's "JWT signed with private
                 key" on its identity provider), and the client checks it
                 against the keys that realm publishes: what crosses between
                 the clusters is public, and nothing has to be handed over or
                 rotated in two places.

                 No role of this realm goes with a token (fullScopeAllowed
                 off); the realm's default scopes do, the groups claim among
                 them, which is how the outside realm can give rights by the
                 groups a person has here. Orphan and everything except
                 LateInitialize, as on the zone's client. */}}
            {{- range $b := (dig "brokeredTo" list $spec) }}
            {{- if regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" (toString $b.name) }}
            ---
            apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
            kind: Client
            metadata:
              name: {{ $tenant }}-broker-to-{{ $b.name }}-client
              annotations:
                crossplane.io/external-name: broker-to-{{ $b.name }}
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-broker-to-{{ $b.name }}-client
            spec:
              deletionPolicy: Orphan
              managementPolicies: ["Observe", "Create", "Update", "Delete"]
              forProvider:
                clientId: broker-to-{{ $b.name }}
                name: {{ printf "Sign-in at %s" $b.name | quote }}
                realmId: {{ $realm }}
                accessType: CONFIDENTIAL
                clientAuthenticatorType: client-jwt
                enabled: true
                standardFlowEnabled: true
                implicitFlowEnabled: false
                directAccessGrantsEnabled: false
                serviceAccountsEnabled: false
                fullScopeAllowed: false
                validRedirectUris:
                  - {{ $b.redirectURI | quote }}
                extraConfig:
                  use.jwks.url: "true"
                  jwks.url: {{ $b.jwksURL | quote }}
                  token.endpoint.auth.signing.alg: RS256
                  gentianos.io/managed-by: platform
              providerConfigRef:
                name: keycloak
            {{- end }}
            {{- end }}

            {{- /* ── partners ─────────────────────────────────────────────
                 Realms of other clusters this realm links its people's
                 accounts with (spec.partners, projected by the operator
                 with the Cluster claim's defaults, within its allowed
                 issuers; AD-17, docs/identity-brokering.md). Each direction
                 is one switch.

                 issue -- this tenant's people towards the partner: the scope
                 partner-<name>, whose mappers give an access token the
                 partner's issuer as its only audience, the person's
                 pairwise subject (sector the partner's issuer, the salt the
                 operator derives) and the person's role on this tenant
                 (gentian_roles: tenant-admin, cluster-admin, read off the
                 attribute gentianPartnerRole of the person's groups, which
                 only the two administrators' groups carry -- access token
                 only, so nothing but an assertion says it), and the partner
                 client, client ID = the
                 partner's issuer, which the partner's realm signs in through
                 once per person to link the two accounts. It sends a person
                 back only to <issuer>/broker/partner-<as>/endpoint, checks
                 the partner realm's published keys (no secret), asks for
                 consent, gives no role, and its one default scope is
                 partner-<name>: the subject and the person's role on this
                 tenant are all it gives.

                 accept -- the partner's people here: the identity provider
                 partner-<name>, authenticating to the partner by a JWT this
                 realm signs, with the JWT authorization grant on, so the
                 partner's apps' assertions become the linked account here
                 (single use, at most two minutes old, ten seconds of clock
                 skew). Hidden on the login page, trusts no address, maps
                 nothing. What a first arrival becomes is accept.accounts:
                 link (gentian-link-existing), create
                 (gentian-create-account) or organization (a member of an
                 organization with the domain given).

                 Delete and not Orphan: a partner taken away must stop, not
                 linger in the realm. */}}
            {{- $linkExisting := false }}
            {{- range $b := (dig "partners" list $spec) }}
            {{- if eq (dig "accept" "accounts" "" $b) "link" }}{{- $linkExisting = true }}{{- end }}
            {{- end }}
            {{- if $linkExisting }}
            ---
            apiVersion: authenticationflow.keycloak.crossplane.io/v1alpha1
            kind: Flow
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-link-existing-flow
              name: {{ $tenant }}-link-existing-flow
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                alias: gentian-link-existing
                description: First sign-in through a provider links an existing account, and makes none
                providerId: basic-flow
              providerConfigRef:
                name: keycloak
            ---
            apiVersion: authenticationflow.keycloak.crossplane.io/v1alpha1
            kind: Execution
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-link-existing-password
              name: {{ $tenant }}-link-existing-password
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                parentFlowAlias: gentian-link-existing
                authenticator: auth-username-password-form
                requirement: REQUIRED
                priority: 10
              providerConfigRef:
                name: keycloak
            {{- /* The account's second factor, where it has one: linking is
                 a sign-in to it, and never a way round its OTP. */}}
            ---
            apiVersion: authenticationflow.keycloak.crossplane.io/v1alpha1
            kind: Subflow
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-link-existing-otp
              name: {{ $tenant }}-link-existing-otp
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                alias: gentian-link-existing-otp
                parentFlowAlias: gentian-link-existing
                providerId: basic-flow
                requirement: CONDITIONAL
                priority: 20
              providerConfigRef:
                name: keycloak
            {{- range $i, $auth := (list "conditional-user-configured" "auth-otp-form") }}
            ---
            apiVersion: authenticationflow.keycloak.crossplane.io/v1alpha1
            kind: Execution
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-link-existing-exec-{{ $auth }}
              name: {{ $tenant }}-link-existing-exec-{{ $auth }}
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                parentFlowAlias: gentian-link-existing-otp
                authenticator: {{ $auth }}
                requirement: REQUIRED
                priority: {{ add 10 (mul $i 10) }}
              providerConfigRef:
                name: keycloak
            {{- end }}
            {{- end }}
            {{- /* A partner that accepts with accounts: create (a registration
                 through the partner's realm) makes the account at the first
                 arrival through it: gentian-create-account below. The
                 partner gives a pairwise subject and no address, and the
                 realm's profile requires an address of every account (a
                 realm with sign-up even names accounts by it), so the
                 arrival is first asked what the profile requires and the
                 provider did not give (idp-review-profile, on missing
                 attributes only): the person tells this realm their
                 address, the partner's realm never does. Without that page
                 Keycloak resets the flow for the missing name and the
                 brokered context is lost ("Not found serialized context").
                 Then idp-create-user-if-unique makes the account; one whose
                 address has an account already is linked as
                 gentian-link-existing links it: they sign in to it once,
                 with its second factor. Nothing is linked by address
                 alone. */}}
            {{- $createAccounts := false }}
            {{- range $b := (dig "partners" list $spec) }}
            {{- if eq (dig "accept" "accounts" "" $b) "create" }}{{- $createAccounts = true }}{{- end }}
            {{- end }}
            {{- if $createAccounts }}
            ---
            apiVersion: authenticationflow.keycloak.crossplane.io/v1alpha1
            kind: Flow
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-create-account-flow
              name: {{ $tenant }}-create-account-flow
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                alias: gentian-create-account
                description: First sign-in through a provider makes the account, or links an existing one
                providerId: basic-flow
              providerConfigRef:
                name: keycloak
            ---
            apiVersion: authenticationflow.keycloak.crossplane.io/v1alpha1
            kind: Execution
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-create-account-review
              name: {{ $tenant }}-create-account-review
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                parentFlowAlias: gentian-create-account
                authenticator: idp-review-profile
                requirement: REQUIRED
                priority: 5
              providerConfigRef:
                name: keycloak
            ---
            apiVersion: authenticationflow.keycloak.crossplane.io/v1alpha1
            kind: ExecutionConfig
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-create-account-review-config
              name: {{ $tenant }}-create-account-review-config
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                executionIdRef:
                  name: {{ $tenant }}-create-account-review
                alias: gentian-create-account-review
                config:
                  update.profile.on.first.login: missing
              providerConfigRef:
                name: keycloak
            ---
            apiVersion: authenticationflow.keycloak.crossplane.io/v1alpha1
            kind: Execution
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-create-account-create
              name: {{ $tenant }}-create-account-create
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                parentFlowAlias: gentian-create-account
                authenticator: idp-create-user-if-unique
                requirement: ALTERNATIVE
                priority: 10
              providerConfigRef:
                name: keycloak
            ---
            apiVersion: authenticationflow.keycloak.crossplane.io/v1alpha1
            kind: Subflow
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-create-account-link
              name: {{ $tenant }}-create-account-link
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                alias: gentian-create-account-link
                parentFlowAlias: gentian-create-account
                providerId: basic-flow
                requirement: ALTERNATIVE
                priority: 20
              providerConfigRef:
                name: keycloak
            ---
            apiVersion: authenticationflow.keycloak.crossplane.io/v1alpha1
            kind: Execution
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-create-account-password
              name: {{ $tenant }}-create-account-password
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                parentFlowAlias: gentian-create-account-link
                authenticator: auth-username-password-form
                requirement: REQUIRED
                priority: 10
              providerConfigRef:
                name: keycloak
            ---
            apiVersion: authenticationflow.keycloak.crossplane.io/v1alpha1
            kind: Subflow
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-create-account-otp
              name: {{ $tenant }}-create-account-otp
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                alias: gentian-create-account-otp
                parentFlowAlias: gentian-create-account-link
                providerId: basic-flow
                requirement: CONDITIONAL
                priority: 20
              providerConfigRef:
                name: keycloak
            {{- range $i, $auth := (list "conditional-user-configured" "auth-otp-form") }}
            ---
            apiVersion: authenticationflow.keycloak.crossplane.io/v1alpha1
            kind: Execution
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-create-account-exec-{{ $auth }}
              name: {{ $tenant }}-create-account-exec-{{ $auth }}
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                parentFlowAlias: gentian-create-account-otp
                authenticator: {{ $auth }}
                requirement: REQUIRED
                priority: {{ add 10 (mul $i 10) }}
              providerConfigRef:
                name: keycloak
            {{- end }}
            {{- end }}
            {{- $ownIssuer := printf "https://id.%s/auth/realms/%s" $kd $realm }}
            {{- range $b := (dig "partners" list $spec) }}
            {{- if and (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" (toString $b.name)) (hasPrefix "https://" (toString $b.issuer)) }}
            {{- $issuer := trimSuffix "/" (toString $b.issuer) }}
            {{- if $b.issue }}
            ---
            apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
            kind: ClientScope
            metadata:
              name: {{ $tenant }}-partner-{{ $b.name }}-scope
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-partner-{{ $b.name }}-scope
            spec:
              deletionPolicy: Delete
              forProvider:
                realmId: {{ $realm }}
                name: {{ printf "partner-%s" $b.name }}
                description: {{ printf "The person's pairwise subject, for %s and nothing else" $issuer | quote }}
                includeInTokenScope: true
                consentScreenText: {{ printf "An identifier of you that only %s knows you by" $b.name | quote }}
              providerConfigRef:
                name: keycloak
            {{- $scopeID := dig "resources" (printf "keycloak-partner-%s-scope" $b.name) "resource" "status" "atProvider" "id" "" $observed }}
            {{- if $scopeID }}
            ---
            apiVersion: client.keycloak.crossplane.io/v1alpha1
            kind: ProtocolMapper
            metadata:
              name: {{ $tenant }}-partner-{{ $b.name }}-audience
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-partner-{{ $b.name }}-audience
            spec:
              deletionPolicy: Delete
              forProvider:
                realmId: {{ $realm }}
                clientScopeId: {{ $scopeID }}
                name: partner-audience
                protocol: openid-connect
                protocolMapper: oidc-audience-mapper
                config:
                  included.custom.audience: {{ $issuer | quote }}
                  id.token.claim: "false"
                  access.token.claim: "true"
                  introspection.token.claim: "true"
                  userinfo.token.claim: "false"
              providerConfigRef:
                name: keycloak
            ---
            apiVersion: client.keycloak.crossplane.io/v1alpha1
            kind: ProtocolMapper
            metadata:
              name: {{ $tenant }}-partner-{{ $b.name }}-pairwise
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-partner-{{ $b.name }}-pairwise
            spec:
              deletionPolicy: Delete
              forProvider:
                realmId: {{ $realm }}
                clientScopeId: {{ $scopeID }}
                name: pairwise-subject
                protocol: openid-connect
                protocolMapper: oidc-sha256-pairwise-sub-mapper
                config:
                  sectorIdentifierUri: {{ $issuer | quote }}
                  pairwiseSubAlgorithmSalt: {{ $b.salt | quote }}
              providerConfigRef:
                name: keycloak
            {{- /* The person's role on this tenant: Keycloak's user attribute
                 mapper, aggregating over the person's groups, so the claim
                 is the attribute of the groups the person is in and nothing
                 else -- the realm's user profile declares no such attribute,
                 and Keycloak admits none it does not declare on an account.
                 Multivalued: a platform administrator in both groups is
                 both. Nobody else has the claim at all. Access token and
                 introspection only, like the audience: no ID token, no
                 userinfo. */}}
            ---
            apiVersion: client.keycloak.crossplane.io/v1alpha1
            kind: ProtocolMapper
            metadata:
              name: {{ $tenant }}-partner-{{ $b.name }}-roles
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-partner-{{ $b.name }}-roles
            spec:
              deletionPolicy: Delete
              forProvider:
                realmId: {{ $realm }}
                clientScopeId: {{ $scopeID }}
                name: gentian-roles
                protocol: openid-connect
                protocolMapper: oidc-usermodel-attribute-mapper
                config:
                  user.attribute: gentianPartnerRole
                  claim.name: gentian_roles
                  jsonType.label: String
                  multivalued: "true"
                  aggregate.attrs: "true"
                  id.token.claim: "false"
                  access.token.claim: "true"
                  introspection.token.claim: "true"
                  userinfo.token.claim: "false"
              providerConfigRef:
                name: keycloak
            {{- end }}
            ---
            apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
            kind: Client
            metadata:
              name: {{ $tenant }}-partner-{{ $b.name }}-client
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-partner-{{ $b.name }}-client
            spec:
              deletionPolicy: Delete
              managementPolicies: ["Observe", "Create", "Update", "Delete"]
              forProvider:
                clientId: {{ $issuer | quote }}
                name: {{ printf "Partner %s" $b.name | quote }}
                realmId: {{ $realm }}
                accessType: CONFIDENTIAL
                clientAuthenticatorType: client-jwt
                enabled: true
                standardFlowEnabled: true
                implicitFlowEnabled: false
                directAccessGrantsEnabled: false
                serviceAccountsEnabled: false
                fullScopeAllowed: false
                consentRequired: true
                displayOnConsentScreen: true
                validRedirectUris:
                  - {{ printf "%s/broker/partner-%s/endpoint" $issuer $b.as | quote }}
                extraConfig:
                  use.jwks.url: "true"
                  jwks.url: {{ printf "%s/protocol/openid-connect/certs" $issuer | quote }}
                  token.endpoint.auth.signing.alg: RS256
                  gentianos.io/managed-by: platform
              providerConfigRef:
                name: keycloak
            {{- if $scopeID }}
            ---
            apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
            kind: ClientDefaultScopes
            metadata:
              name: {{ $tenant }}-partner-{{ $b.name }}-default-scopes
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-partner-{{ $b.name }}-default-scopes
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                clientIdRef:
                  name: {{ $tenant }}-partner-{{ $b.name }}-client
                  policy:
                    resolve: Always
                defaultScopes:
                  - {{ printf "partner-%s" $b.name }}
              providerConfigRef:
                name: keycloak
            {{- end }}
            {{- end }}
            {{- $accounts := dig "accept" "accounts" "" $b }}
            {{- if and $accounts $kd }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-partner-{{ $b.name }}-idp-client
              name: {{ $tenant }}-partner-{{ $b.name }}-idp-client
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: {{ $tenant }}-partner-{{ $b.name }}-idp-client
                    namespace: {{ $identityNs }}
                    labels:
                      app.kubernetes.io/managed-by: crossplane
                  stringData:
                    # The partner's client for this realm is named by this
                    # realm's issuer.
                    client_id: {{ $ownIssuer | quote }}
                    # Never sent: the provider authenticates by a signed JWT.
                    client_secret: private-key-jwt
              providerConfigRef:
                name: kubernetes
            {{- if eq $accounts "organization" }}
            ---
            apiVersion: organization.keycloak.crossplane.io/v1alpha1
            kind: Organization
            metadata:
              name: {{ $tenant }}-partner-{{ $b.name }}-org
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-partner-{{ $b.name }}-org
            spec:
              deletionPolicy: Delete
              managementPolicies: ["Observe", "Create", "Update", "Delete"]
              forProvider:
                realm: {{ $realm }}
                name: {{ dig "accept" "displayName" $b.name $b | quote }}
                alias: {{ $b.name }}
                enabled: true
                domain:
                  - name: {{ dig "accept" "domain" "" $b | quote }}
                    verified: false
              providerConfigRef:
                name: keycloak
            {{- end }}
            ---
            apiVersion: oidc.keycloak.crossplane.io/v1alpha1
            kind: IdentityProvider
            metadata:
              name: {{ $tenant }}-partner-{{ $b.name }}-idp
              annotations:
                crossplane.io/external-name: partner-{{ $b.name }}
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-partner-{{ $b.name }}-idp
            spec:
              deletionPolicy: Delete
              managementPolicies: ["Observe", "Create", "Update", "Delete"]
              forProvider:
                realm: {{ $realm }}
                alias: partner-{{ $b.name }}
                displayName: {{ dig "accept" "displayName" $b.name $b | quote }}
                providerId: oidc
                enabled: true
                trustEmail: false
                storeToken: false
                hideOnLoginPage: true
                linkOnly: false
                authenticateByDefault: false
                addReadTokenRoleOnCreate: false
                syncMode: IMPORT
                validateSignature: true
                defaultScopes: openid
                issuer: {{ $issuer | quote }}
                authorizationUrl: {{ printf "%s/protocol/openid-connect/auth" $issuer | quote }}
                tokenUrl: {{ printf "%s/protocol/openid-connect/token" $issuer | quote }}
                jwksUrl: {{ printf "%s/protocol/openid-connect/certs" $issuer | quote }}
                userInfoUrl: {{ printf "%s/protocol/openid-connect/userinfo" $issuer | quote }}
                logoutUrl: {{ printf "%s/protocol/openid-connect/logout" $issuer | quote }}
                {{- if eq $accounts "create" }}
                firstBrokerLoginFlowAlias: gentian-create-account
                {{- else if eq $accounts "link" }}
                firstBrokerLoginFlowAlias: gentian-link-existing
                {{- else }}
                organizationIdRef:
                  name: {{ $tenant }}-partner-{{ $b.name }}-org
                orgDomain: {{ dig "accept" "domain" "" $b | quote }}
                orgRedirectModeEmailMatches: true
                {{- end }}
                extraConfig:
                  clientAuthMethod: private_key_jwt
                  jwtAuthorizationGrantEnabled: "true"
                  jwtAuthorizationGrantAssertionReuseAllowed: "false"
                  jwtAuthorizationGrantMaxAllowedAssertionExpiration: "120"
                  jwtAuthorizationGrantAllowedClockSkew: "10"
                  jwtAuthorizationGrantAssertionSignatureAlg: RS256
                  jwtAuthorizationGrantLimitAccessTokenExp: "true"
                clientIdSecretRef:
                  name: {{ $tenant }}-partner-{{ $b.name }}-idp-client
                  namespace: {{ $identityNs }}
                  key: client_id
                clientSecretSecretRef:
                  name: {{ $tenant }}-partner-{{ $b.name }}-idp-client
                  namespace: {{ $identityNs }}
                  key: client_secret
              providerConfigRef:
                name: keycloak
            {{- end }}
            {{- end }}
            {{- end }}

            {{- /* ── partner apps ─────────────────────────────────────────
                 A component that calls partners or accepts their assertions
                 (requires.services.partners, from the zone projection) has
                 one client here, partner-<profile>, and no secret: it
                 authenticates by its Kubernetes service account token
                 (federated client authentication), which Keycloak checks
                 against the cluster's service account issuer -- the
                 identity provider "kubernetes" below -- and whose subject
                 must be the component's account,
                 system:serviceaccount:<namespace>:<account>. The token's
                 audience is this realm's issuer, which the component asks
                 for in its projected token.

                 Calling: standard token exchange on, the scopes
                 partner-<name> of the partners it names (and that this
                 tenant issues towards) as its optional scopes, basic as its
                 only default -- an assertion carries the pairwise subject
                 and the person's role on this tenant, and nothing else
                 about them. Accepting: the JWT
                 authorization grant on, for every partner this tenant
                 accepts. Every other flow off; no role (fullScopeAllowed
                 off).

                 The component is told the client, the token endpoint on the
                 cluster's network and the audience its token needs, in the
                 Secret partners-<profile> (PartnerSecretName); nothing in it
                 is secret. */}}
            {{- $saIssuer := default "" $spec.serviceAccountIssuer }}
            {{- if and $kcInternal $saIssuer $kd (gt (len $partnerApps) 0) }}
            {{- $issuing := list }}
            {{- $accepting := list }}
            {{- range $b := (dig "partners" list $spec) }}
            {{- if and (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" (toString $b.name)) (hasPrefix "https://" (toString $b.issuer)) }}
            {{- if and $b.issue (dig "resources" (printf "keycloak-partner-%s-scope" $b.name) "resource" "status" "atProvider" "id" "" $observed) }}
            {{- $issuing = append $issuing $b.name }}
            {{- end }}
            {{- if dig "accept" "accounts" "" $b }}
            {{- $accepting = append $accepting (printf "partner-%s" $b.name) }}
            {{- end }}
            {{- end }}
            {{- end }}
            ---
            apiVersion: identityprovider.keycloak.crossplane.io/v1alpha1
            kind: KubernetesIdentityProvider
            metadata:
              name: {{ $tenant }}-kubernetes-idp
              annotations:
                crossplane.io/external-name: kubernetes
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-kubernetes-idp
            spec:
              deletionPolicy: Delete
              managementPolicies: ["Observe", "Create", "Update", "Delete"]
              forProvider:
                realm: {{ $realm }}
                alias: kubernetes
                displayName: Kubernetes service accounts
                enabled: true
                issuer: {{ $saIssuer | quote }}
              providerConfigRef:
                name: keycloak
            {{- range $a := $partnerApps }}
            {{- $p := $a.profile }}
            ---
            apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
            kind: Client
            metadata:
              name: {{ $tenant }}-partner-app-{{ $p }}-client
              annotations:
                crossplane.io/external-name: {{ printf "partner-%s" $p }}
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-partner-app-{{ $p }}-client
            spec:
              deletionPolicy: Delete
              managementPolicies: ["Observe", "Create", "Update", "Delete"]
              forProvider:
                clientId: {{ printf "partner-%s" $p }}
                name: {{ printf "%s partner calls (%s)" $brandName $p | quote }}
                realmId: {{ $realm }}
                accessType: CONFIDENTIAL
                clientAuthenticatorType: federated-jwt
                enabled: true
                standardFlowEnabled: false
                implicitFlowEnabled: false
                directAccessGrantsEnabled: false
                serviceAccountsEnabled: false
                fullScopeAllowed: false
                standardTokenExchangeEnabled: {{ gt (len $a.call) 0 }}
                extraConfig:
                  jwt.credential.issuer: kubernetes
                  jwt.credential.sub: {{ printf "system:serviceaccount:%s:%s" $ns $a.sa | quote }}
                  {{- if and $a.accept (gt (len $accepting) 0) }}
                  oauth2.jwt.authorization.grant.enabled: "true"
                  oauth2.jwt.authorization.grant.idp: {{ join "##" $accepting | quote }}
                  {{- end }}
                  gentianos.io/managed-by: platform
              providerConfigRef:
                name: keycloak
            {{- if $a.accept }}
            {{- /* The token the JWT authorization grant issues on a partner
                 assertion is the app's to use as the person: the app hands
                 it on to its own backends, which take a token of the
                 person's own sign-in to the app -- audience the app's
                 client. So that token names the app too, as that sign-in's
                 would; the client has no scope beyond basic and full scope
                 off, so nothing else gives it an audience. Seen on the
                 Aluvian cluster: the website granted on a Center assertion
                 and the commerce service refused the token it was handed,
                 "not for this service (aud, azp)". */}}
            ---
            apiVersion: client.keycloak.crossplane.io/v1alpha1
            kind: ProtocolMapper
            metadata:
              name: {{ $tenant }}-partner-app-{{ $p }}-audience
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-partner-app-{{ $p }}-audience
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                clientIdRef:
                  name: {{ $tenant }}-partner-app-{{ $p }}-client
                  policy:
                    resolve: Always
                name: app-audience
                protocol: openid-connect
                protocolMapper: oidc-audience-mapper
                config:
                  included.client.audience: {{ $p }}
                  id.token.claim: "false"
                  access.token.claim: "true"
                  introspection.token.claim: "true"
                  userinfo.token.claim: "false"
              providerConfigRef:
                name: keycloak
            {{- end }}
            ---
            apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
            kind: ClientDefaultScopes
            metadata:
              name: {{ $tenant }}-partner-app-{{ $p }}-default-scopes
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-partner-app-{{ $p }}-default-scopes
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                clientIdRef:
                  name: {{ $tenant }}-partner-app-{{ $p }}-client
                  policy:
                    resolve: Always
                defaultScopes:
                  - basic
              providerConfigRef:
                name: keycloak
            {{- $optional := list }}
            {{- range $n := $a.call }}
            {{- if has $n $issuing }}{{- $optional = append $optional (printf "partner-%s" $n) }}{{- end }}
            {{- end }}
            {{- if gt (len $optional) 0 }}
            ---
            apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
            kind: ClientOptionalScopes
            metadata:
              name: {{ $tenant }}-partner-app-{{ $p }}-optional-scopes
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-partner-app-{{ $p }}-optional-scopes
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                clientIdRef:
                  name: {{ $tenant }}-partner-app-{{ $p }}-client
                  policy:
                    resolve: Always
                optionalScopes:
                  {{- range $s := $optional }}
                  - {{ $s }}
                  {{- end }}
              providerConfigRef:
                name: keycloak
            {{- end }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              name: {{ $tenant }}-partner-app-{{ $p }}-secret
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: partner-app-secret-{{ $p }}
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: {{ printf "partners-%s" $p }}
                    namespace: {{ $ns }}
                    labels:
                      app.kubernetes.io/managed-by: crossplane
                  stringData:
                    PARTNER_CLIENT_ID: {{ printf "partner-%s" $p | quote }}
                    PARTNER_TOKEN_URL: {{ printf "%s/realms/%s/protocol/openid-connect/token" $kcInternal $realm | quote }}
                    PARTNER_TOKEN_AUDIENCE: {{ $ownIssuer | quote }}
              providerConfigRef:
                name: kubernetes
            {{- end }}
            {{- end }}

            {{- /* ── sign-in from another tenant ─────────────────────────────
                 Another tenant of this cluster whose people sign in here
                 (spec.signInFrom, with that tenant's spec.signInTo): an
                 identity provider for its realm, and one mapper per group.

                 The other realm's client, broker-to-<this tenant>, is that
                 tenant's composite's (brokeredTo, projected by the operator):
                 it checks a JWT this realm signs against this realm's keys,
                 so no secret is made. The provider insists on one all the
                 same, so a fixed word that is never sent fills it.

                 The browser goes to the other realm's public address; the
                 code is redeemed on the cluster's own network, as the kernel
                 broker does, and the assertion names the realm's public
                 issuer as its audience, which is what the other realm checks.

                 The two realms are the cluster's own, administered by the
                 same people, so their verified addresses are trusted
                 (trustEmail) and the groups follow every sign-in (FORCE).
                 An account already here under the same address is still
                 linked only once its owner proves it: Keycloak's own
                 first-broker-login flow, not the kernel broker's. Shown on
                 the login page under the other tenant's name. */}}
            {{- range $f := (dig "signInFrom" list $spec) }}
            {{- if and $kd $kcInternal (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" (toString $f.tenant)) (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" (toString $f.realm)) }}
            {{- $srcIssuer := printf "https://id.%s/auth/realms/%s" $kd $f.realm }}
            {{- $srcInternal := printf "%s/realms/%s" $kcInternal $f.realm }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-signin-{{ $f.tenant }}-client
              name: {{ $tenant }}-signin-{{ $f.tenant }}-client
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: {{ $tenant }}-signin-{{ $f.tenant }}-client
                    namespace: {{ $identityNs }}
                    labels:
                      app.kubernetes.io/managed-by: crossplane
                  stringData:
                    client_id: {{ $f.clientID | quote }}
                    # Never sent: the client authenticates by a signed JWT.
                    client_secret: private-key-jwt
              providerConfigRef:
                name: kubernetes
            ---
            apiVersion: oidc.keycloak.crossplane.io/v1alpha1
            kind: IdentityProvider
            metadata:
              name: {{ $tenant }}-signin-{{ $f.tenant }}-idp
              annotations:
                crossplane.io/external-name: {{ $f.alias }}
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-signin-{{ $f.tenant }}-idp
            spec:
              deletionPolicy: Delete
              managementPolicies: ["Observe", "Create", "Update", "Delete"]
              forProvider:
                realm: {{ $realm }}
                alias: {{ $f.alias }}
                displayName: {{ $f.displayName | quote }}
                providerId: oidc
                enabled: true
                trustEmail: true
                storeToken: false
                hideOnLoginPage: false
                linkOnly: false
                authenticateByDefault: false
                addReadTokenRoleOnCreate: false
                syncMode: FORCE
                validateSignature: true
                defaultScopes: openid profile email
                issuer: {{ $srcIssuer | quote }}
                authorizationUrl: {{ printf "%s/protocol/openid-connect/auth" $srcIssuer | quote }}
                logoutUrl: {{ printf "%s/protocol/openid-connect/logout" $srcIssuer | quote }}
                tokenUrl: {{ printf "%s/protocol/openid-connect/token" $srcInternal | quote }}
                jwksUrl: {{ printf "%s/protocol/openid-connect/certs" $srcInternal | quote }}
                userInfoUrl: {{ printf "%s/protocol/openid-connect/userinfo" $srcInternal | quote }}
                extraConfig:
                  clientAuthMethod: private_key_jwt
                  clientAssertionAudience: {{ $srcIssuer | quote }}
                clientIdSecretRef:
                  name: {{ $tenant }}-signin-{{ $f.tenant }}-client
                  namespace: {{ $identityNs }}
                  key: client_id
                clientSecretSecretRef:
                  name: {{ $tenant }}-signin-{{ $f.tenant }}-client
                  namespace: {{ $identityNs }}
                  key: client_secret
              providerConfigRef:
                name: keycloak
            {{- range $i, $g := (default list $f.groups) }}
            {{- if hasPrefix "/" (toString $g) }}
            ---
            apiVersion: identityprovider.keycloak.crossplane.io/v1alpha1
            kind: IdentityProviderMapper
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-signin-{{ $f.tenant }}-group-{{ $i }}
              name: {{ $tenant }}-signin-{{ $f.tenant }}-group-{{ $i }}
            spec:
              deletionPolicy: Delete
              forProvider:
                realm: {{ $realm }}
                identityProviderAlias: {{ $f.alias }}
                name: {{ printf "group %s" (trimPrefix "/" (toString $g)) | quote }}
                identityProviderMapper: oidc-hardcoded-group-idp-mapper
                extraConfig:
                  syncMode: FORCE
                  group: {{ $g | quote }}
              providerConfigRef:
                name: keycloak
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}

            {{- /* ── sign-up ──────────────────────────────────────────────
                 The registration flow of a tenant people sign up to. Its own
                 flow and not Keycloak's built-in one, which Keycloak refuses
                 to add an execution to: the built-in form (the profile's
                 fields, the password) with the platform's proof-of-work check
                 after them, so a scripted sign-up costs its author more than
                 it costs the realm. Bound to the realm by Bindings rather
                 than on the Realm: the realm has to exist before a flow in
                 it does, so the Realm cannot name the flow at creation. */}}
            {{- if $signUp }}
            ---
            apiVersion: authenticationflow.keycloak.crossplane.io/v1alpha1
            kind: Flow
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-registration-flow
              name: {{ $tenant }}-registration-flow
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                alias: gentian-registration
                description: Sign-up with a proof-of-work check
                providerId: basic-flow
              providerConfigRef:
                name: keycloak
            ---
            apiVersion: authenticationflow.keycloak.crossplane.io/v1alpha1
            kind: Subflow
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-registration-form
              name: {{ $tenant }}-registration-form
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                alias: gentian-registration-form
                parentFlowAlias: gentian-registration
                providerId: form-flow
                authenticator: registration-page-form
                requirement: REQUIRED
              providerConfigRef:
                name: keycloak
            {{- range $i, $auth := (list "registration-user-creation" "registration-password-action" "gentian-pow-captcha") }}
            ---
            apiVersion: authenticationflow.keycloak.crossplane.io/v1alpha1
            kind: Execution
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-registration-exec-{{ $auth }}
              name: {{ $tenant }}-registration-exec-{{ $auth }}
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                parentFlowAlias: gentian-registration-form
                authenticator: {{ $auth }}
                requirement: REQUIRED
                {{- /* The order on the form: the account's fields, the
                     password, then the check. */}}
                priority: {{ add 10 (mul $i 10) }}
              providerConfigRef:
                name: keycloak
            {{- end }}
            ---
            apiVersion: authenticationflow.keycloak.crossplane.io/v1alpha1
            kind: Bindings
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-registration-bindings
              name: {{ $tenant }}-registration-bindings
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                registrationFlow: gentian-registration
              providerConfigRef:
                name: keycloak
            {{- end }}{{- /* $signUp */}}

            {{- /* ── the realm's "groups" client scope ────────────────────────
                 What puts a user's group membership into their tokens. Every
                 client in the realm gets it, because the groups Job adds it to
                 default-default-client-scopes.

                 That PUT stays with the Job. The realm currently defaults nine
                 scopes, mostly Keycloak's own — acr, basic, email, profile,
                 role_list, roles, saml_organization, web-origins — and declaring
                 the list here would mean owning all nine and silently dropping
                 whichever built-in a future Keycloak adds. The Job only ever adds
                 "groups", which is additive and cannot subtract.
              */}}
            ---
            apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
            kind: ClientScope
            metadata:
              annotations:
                crossplane.io/external-name: groups
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-groups-scope
              name: {{ $tenant }}-groups-scope
            spec:
              deletionPolicy: Orphan
              managementPolicies: ["Observe"]
              forProvider:
                realmId: {{ $realm }}
                name: groups
              providerConfigRef:
                name: keycloak
            {{- /* The membership mapper on it. Takes the scope's observed id
                 rather than a ref, because the scope above is adopted by name and
                 Observe-only, so a ref would yield "groups" where the API path
                 needs a UUID. */}}
            {{- $groupsScopeID := dig "resources" "keycloak-groups-scope" "resource" "status" "atProvider" "id" "" $observed }}
            {{- if $groupsScopeID }}
            ---
            apiVersion: client.keycloak.crossplane.io/v1alpha1
            kind: ProtocolMapper
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-groups-scope-mapper
              name: {{ $tenant }}-groups-scope-mapper
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                name: groups
                protocol: openid-connect
                protocolMapper: oidc-group-membership-mapper
                clientScopeId: {{ $groupsScopeID }}
                config:
                  full.path: "false"
                  id.token.claim: "true"
                  access.token.claim: "true"
                  userinfo.token.claim: "true"
                  claim.name: groups
                  {{- /* Keycloak's own defaults for this mapper type, written
                       back on every read. Omitting them left the Composition
                       permanently out of step with what the provider observed,
                       which it answered by updating forever. */}}
                  introspection.token.claim: "true"
                  multivalued: "true"
              providerConfigRef:
                name: keycloak
            {{- end }}

            {{- /* ── the tenant realm, observed ──────────────────────────────
                 The realm every other Keycloak object here lives in. The realm
                 script creates it and keeps it enabled, sets its display name and
                 its browser security headers; the tenant SMTP Job sets its mail
                 server. All of that is realm state, and this resource can hold it.

                 Observed first, and with almost nothing declared, because reading
                 the object back is how the field mapping gets established rather
                 than guessed: sixty fields, and the ones that matter here are
                 nested under securityDefenses and smtpServer. What the provider
                 reports is what the manifest will then say.

                 A realm is identified by its name, so unlike the pack's mappers
                 it can be adopted. That is the whole reason this can be taken in
                 steps at all.
              */}}
            ---
            apiVersion: realm.keycloak.crossplane.io/v1alpha1
            kind: Realm
            metadata:
              name: {{ $tenant }}-realm
              annotations:
                crossplane.io/external-name: {{ $realm }}
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-realm
            spec:
              deletionPolicy: Orphan
              forProvider:
                realm: {{ $realm }}
                enabled: true
                displayName: {{ $spec.displayName | quote }}
                {{- /* Organizations, only in a realm that accepts a partner as
                     one (spec.partners, accept.accounts organization): every
                     other realm is composed as it was, and does not grow the
                     identity-first login step organizations add. */}}
                {{- $orgs := false }}
                {{- range $b := (dig "partners" list $spec) }}
                {{- if eq (dig "accept" "accounts" "" $b) "organization" }}{{- $orgs = true }}{{- end }}
                {{- end }}
                {{- if $orgs }}
                organizationsEnabled: true
                {{- end }}
                {{- /* ── Languages (AD-15) ────────────────────────────────
                     Keycloak ships these translations; a realm just has to say
                     it wants them. Without this the login and account pages
                     serve English to everyone, which for a German-speaking
                     market is the first screen of the product being in the
                     wrong language.

                     With internationalization on, Keycloak honours the
                     browser's Accept-Language and offers a picker, so a German
                     browser gets German without anybody choosing anything.
                     defaultLocale is only the answer for a browser asking for
                     a language that is not here -- English, because that is
                     the language the platform's own strings are written in and
                     a fallback should be the author's own words rather than a
                     guess.

                     A list rather than a field: the provider models it as one.
                     spec.locales overrides the default, so a tenant whose
                     people speak something else says so on the claim rather
                     than waiting for a release -- the same reason the operator
                     reads GENTIAN_SUPPORTED_LOCALES for the kernel realm and
                     the desktop discovers its catalogues from a directory. */}}
                {{- /* The default matches internal/locales.Default and the
                     catalogues in gentian-ui/frontend/src/locales. If they
                     drift, a person signs in translated and lands on an
                     English desktop. */}}
                {{- $locales := default (list "en" "de") (dig "locales" nil $spec) }}
                internationalization:
                  - supportedLocales: {{ toJson $locales }}
                    # The first, not "en": the order is the preference, so a
                    # tenant listing de then en gets a German login page.
                    defaultLocale: {{ index $locales 0 | quote }}
                {{- /* ── Security policy ──────────────────────────────────
                     What the tenant declares in spec.security, as the realm's
                     own fields. The console changes it by committing to the
                     tenant's manifest; nothing holds a Keycloak credential to
                     do it, and a realm rebuilt from scratch comes back with
                     the same policy because the policy is in git.

                     Unstated is unstated: a field the tenant does not set is
                     left off entirely, so Keycloak's own default applies
                     rather than a zero written over it. */}}
                {{- $sec := $spec.security | default dict }}
                {{- $pw := dig "password" dict $sec }}
                {{- $pwParts := list }}
                {{- if gt (int (dig "minLength" 12 $pw)) 0 }}{{- $pwParts = append $pwParts (printf "length(%d)" (int (dig "minLength" 12 $pw))) }}{{- end }}
                {{- if dig "requireDigits" false $pw }}{{- $pwParts = append $pwParts "digits(1)" }}{{- end }}
                {{- if dig "requireLowercase" false $pw }}{{- $pwParts = append $pwParts "lowerCase(1)" }}{{- end }}
                {{- if dig "requireUppercase" false $pw }}{{- $pwParts = append $pwParts "upperCase(1)" }}{{- end }}
                {{- if dig "requireSpecialChars" false $pw }}{{- $pwParts = append $pwParts "specialChars(1)" }}{{- end }}
                {{- if gt (int (dig "historyCount" 5 $pw)) 0 }}{{- $pwParts = append $pwParts (printf "passwordHistory(%d)" (int (dig "historyCount" 5 $pw))) }}{{- end }}
                {{- if gt (int (dig "maxAgeDays" 0 $pw)) 0 }}{{- $pwParts = append $pwParts (printf "forceExpiredPasswordChange(%d)" (int (dig "maxAgeDays" 0 $pw))) }}{{- end }}
                {{- /* Declared always, and empty when the tenant states no
                     password rules. Left off, the field is not left alone:
                     the provider copies the realm's live policy into the
                     resource and holds it, as it did with smtpServer below,
                     so a policy taken out of git would stay in force. Empty
                     is Keycloak's own: no policy. */}}
                passwordPolicy: {{ join " and " $pwParts | quote }}
                {{- $session := dig "session" dict $sec }}
                {{- $bf := dig "bruteForce" dict $sec }}
                {{- if $kd }}
                {{- /* The URL this realm advertises for itself, independent of
                     how it was asked.

                     Keycloak runs without KC_HOSTNAME and with
                     KC_PROXY_HEADERS=xforwarded, so it derives the endpoints in
                     its discovery document from the incoming request. A browser
                     arriving through the gateway gets external URLs; a service
                     fetching .well-known over the cluster Service sends no
                     forwarded headers and gets back the in-cluster address as
                     authorization_endpoint.

                     An app that reads discovery in-cluster — the ordinary way
                     for a backend to do it — then redirects the browser to
                     http://<service>.<ns>.svc.cluster.local:8080, which the
                     browser cannot resolve. The visible failure is a login that
                     never leaves the loading screen, with nothing logged
                     anywhere: the app did what discovery told it to.

                     frontendUrl pins the answer to the address a browser can
                     actually reach, so both callers get the same one. It is set
                     as an attribute because that is where Keycloak keeps it;
                     the provider exposes no dedicated field. */}}
                attributes:
                  frontendUrl: https://id.{{ $kd }}/auth
                {{- end }}
                {{- /* ── Self-service password reset ──────────────────────────
                     Keycloak's reset mail goes to the user's email FIELD, and
                     nothing can point it at an attribute instead. So the field
                     holds the address a locked-out human can still read — their
                     recovery address — and the workspace address lives in the
                     username, which is what it already is:
                     christian@corp.example is the username AND the mailbox.

                     Without this, enabling reset would send the link to the
                     mailbox the user needs the link to reach. With it, the reset
                     a user starts themselves arrives somewhere they can open
                     while locked out, which is the only way it is worth offering.

                     The email CLAIM is decoupled from the field by the groups Job,
                     which repoints the built-in email mapper at the username — so
                     applications keep receiving the workspace address they
                     receive today. Both halves are required: enabling reset
                     without the mapper would hand apps a recovery address as the
                     user's identity.
                  */}}
                resetPasswordAllowed: true
                {{- /* Two people may share a recovery address — a couple, or an
                     admin who owns the domain and recovers several accounts. That
                     is a normal arrangement and must not fail account creation
                     with "Email already exists".

                     Safe because the address is not an identity here:
                     loginWithEmailAllowed is false (declared below), so nobody
                     authenticates with it, and
                     Keycloak only rejects duplicates when they could be used to
                     log in. */}}
                {{- /* Unless people sign up: then the address IS the login
                     (registrationEmailAsUsername), and Keycloak refuses a
                     realm that lets two accounts share one. */}}
                duplicateEmailsAllowed: {{ not $signUp }}
                # Nobody self-registers into a tenant realm unless the tenant
                # says so (spec.signUp.enabled); otherwise membership comes
                # from an invitation.
                registrationAllowed: {{ $signUp }}
                {{- if $signUp }}
                {{- /* A sign-up is an e-mail address and a password, the
                     address confirmed by a message to it before the account
                     is usable, on a flow of the tenant's own with the
                     platform's proof-of-work check (gentian-registration,
                     bound by Bindings once its executions exist). */}}
                registrationEmailAsUsername: true
                verifyEmail: true
                {{- end }}
                {{- /* Stated in both cases, false included. Keycloak makes a
                     realm with sign-in by e-mail ON, and the realm Job's
                     bootstrap create says nothing about it. When that Job
                     made the realm before the provider did, the provider
                     copied the live "true" into this resource, and then
                     refused every update of the realm -- "DuplicateEmailsAllowed
                     cannot be true if LoginWithEmailAllowed is true" -- so
                     nothing declared here arrived. A declared false leaves
                     nothing to copy. */}}
                loginWithEmailAllowed: {{ $signUp }}
                {{- /* Five minutes, the kernel realm's own. A person stays
                     signed in for the session's twelve hours below because
                     the edge refreshes this token against the session; and
                     that refresh is what ends access. Signing out, an
                     administrator ending the session, a disabled account:
                     each ends the session at Keycloak, the next refresh
                     fails, and every host stops within this lifetime.

                     It was twelve hours, to keep people signed in -- which
                     the session already does. What it bought instead was a
                     token every host kept honouring for twelve hours after
                     the session it came from had ended: signed out on one
                     host and still in on the next, removed by an
                     administrator and still working till evening.

                     Declared because the provider's default is not ours to
                     rely on staying five minutes. */}}
                accessTokenLifespan: 5m0s
                {{- /* Twelve hours unless the tenant says otherwise. The
                     default is not the provider's -- Keycloak ships a 30m idle
                     timeout, so a managed realm that named nothing would cut
                     every session to thirty minutes -- and a tenant that
                     states its own replaces it here rather than having a
                     second key written further up, which is a duplicate the
                     later one silently wins. */}}
                ssoSessionIdleTimeout: {{ if gt (int (dig "idleMinutes" 0 $session)) 0 }}{{ printf "%dm" (int (dig "idleMinutes" 0 $session)) }}{{ else }}12h0m0s{{ end }}
                ssoSessionMaxLifespan: {{ if gt (int (dig "maxHours" 0 $session)) 0 }}{{ printf "%dh" (int (dig "maxHours" 0 $session)) }}{{ else }}12h0m0s{{ end }}
                {{- if dig "rememberMe" false $session }}
                rememberMe: true
                {{- end }}
                loginTheme: gentian
                {{- /* Keycloak's built-in browser flow, named explicitly.

                     A custom "browser-kernel-idp" flow used to be bound here —
                     Cookie then identity-provider-redirector with
                     defaultProvider=kernel — which left the tenant realm with no
                     credential form at all, so every interactive login in the
                     system rendered the kernel realm's. Tenant members live in
                     the tenant realm and every per-app OIDC client is registered
                     there, so the session belongs here and the stock flow already
                     does it: Cookie first, then forms, with the
                     identity-provider-redirector inert without a default
                     provider. */}}
                {{- /* The realm exists before a flow in it can, so it starts on
                     the stock flow and moves once the last of the sign-in flow's
                     steps has been observed. */}}
                browserFlow: {{ ternary "gentian-browser" "browser" (not (empty (dig "keycloak-browser-exec-other-otp" "resource" "status" "atProvider" "id" "" $obsRes))) }}
                {{- /* The provider does not observe these: status.atProvider reports
                     securityDefenses as null while the realm plainly carries the
                     headers. So they cannot be confirmed by reading the resource
                     back, only against the Admin API.

                     Unlike the broker IdPs' useJwksUrl, which had the same blind
                     spot, these cannot simply be dropped: nothing else sets them.
                     They are declared and unverifiable, which is a diff the
                     provider re-applies — the cost of managing a field the
                     provider writes but cannot read.

                     Empty strings are deliberate. contentSecurityPolicy and
                     xFrameOptions are cleared so the portal can frame Keycloak;
                     Keycloak's own defaults would refuse it. */}}
                securityDefenses:
                  {{- if dig "enabled" false $bf }}
                  {{- /* Beside the headers, in the same list entry: the
                       provider models securityDefenses as a repeated block,
                       and a second entry would be a second securityDefenses
                       rather than another field of the one. */}}
                  - bruteForceDetection:
                      - permanentLockout: false
                        maxLoginFailures: {{ int (dig "maxLoginFailures" 5 $bf) }}
                        maxFailureWaitSeconds: {{ int (dig "lockoutDurationSeconds" 900 $bf) }}
                    headers:
                  {{- else }}
                  - headers:
                  {{- end }}
                      - contentSecurityPolicy: ""
                        contentSecurityPolicyReportOnly: ""
                        strictTransportSecurity: "max-age=31536000; includeSubDomains"
                        xContentTypeOptions: "nosniff"
                        xFrameOptions: ""
                        xRobotsTag: "none"
                        xXssProtection: "1; mode=block"
                        referrerPolicy: "no-referrer"
                {{- /* The realm's mail server, declared rather than left to the Job
                     alone, in every mail mode.

                     Left undeclared, the field does not stay unmanaged. The
                     provider removes a block it finds and was not given, then
                     late-initialisation copies the live one into
                     spec.forProvider -- without a reference to the password,
                     which Keycloak returns as ten asterisks and the CRD models
                     only as passwordSecretRef -- and the provider's next write
                     of the realm carries the login and no password. Keycloak
                     stores that, and the realm cannot send. Declaring every
                     field, the password by reference, makes the provider a
                     writer that agrees with the Job.

                     What is declared is spec.realmMail, which the operator
                     states: on a cluster with its own mail, the login it
                     minted for this realm; on a cluster that relays, the
                     relay's host and login, which are in one Secret a
                     Composition cannot read. It states it only once the
                     Secret holding the password exists, because the provider
                     does not wait for a Secret it is pointed at: a realm
                     declared before it is written with the login and no
                     password. Not stated -- a relay not supplied yet, a tenant
                     the cluster's own mail mints no login for -- the realm is
                     declared with no mail server. */}}
                {{- $rm := dig "realmMail" dict $spec }}
                {{- if $rm }}
                smtpServer:
                  - host: {{ $rm.host | quote }}
                    port: {{ $rm.port | toString | quote }}
                    from: {{ $rm.from | quote }}
                    fromDisplayName: {{ $brandName | quote }}
                    ssl: {{ dig "ssl" false $rm }}
                    starttls: {{ dig "starttls" false $rm }}
                    auth:
                      {{- /* Same Secret and key the Job reads, so the two
                           writers cannot present different credentials --
                           and beside Keycloak, never in the namespace that
                           faces the internet. */}}
                      - username: {{ $rm.username | quote }}
                        passwordSecretRef:
                          name: {{ $rm.passwordSecretRef.name | quote }}
                          namespace: {{ $identityNs }}
                          key: {{ $rm.passwordSecretRef.key | quote }}
                {{- end }}
              providerConfigRef:
                name: keycloak

            {{- /* ── the realm holds a request to its parameter ──────────────
                 An app's client may declare requires.services.identity.oidc.
                 requestParameter: one parameter of its sign-ins and the one
                 address a code for such a request is delivered to, computed
                 from it. The client is then registered with https://* (app-
                 default), and this is what narrows that again: a client
                 policy of the realm whose one executor, gentian-request-
                 bound-redirect from the platform's Keycloak extension, refuses
                 every authorization request of such a client whose redirect_uri
                 is not the address computed from its parameter. It reads the
                 parameter, its pattern and the address from the client's own
                 attributes, so the one profile and the one policy serve every
                 app of the realm, and the condition picks the clients that
                 carry gentianos.io/request-bound-redirect "true".

                 app-default registers https://* only while the policy below
                 reads Ready: a client is not open before the realm narrows it.
                 It finds the policy by the two labels.

                 Orphan, both: the realm keeps them as long as it exists, and
                 the provider's read of either never reports one missing, so a
                 delete would not finish. A realm without such a client runs
                 the executor for nobody. */}}
            ---
            apiVersion: realm.keycloak.crossplane.io/v1alpha1
            kind: ClientPolicyProfile
            metadata:
              name: {{ $tenant }}-request-bound-redirect-profile
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-request-bound-redirect-profile
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                name: gentian-request-bound-redirect
                description: "A client's code goes only to the address computed from its request parameter"
                executor:
                  - name: gentian-request-bound-redirect
              providerConfigRef:
                name: keycloak
            ---
            apiVersion: realm.keycloak.crossplane.io/v1alpha1
            kind: ClientPolicyProfilePolicy
            metadata:
              name: {{ $tenant }}-request-bound-redirect-policy
              labels:
                gentianos.io/realm-rule: request-bound-redirect
                gentianos.io/tenant-namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-request-bound-redirect-policy
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $realm }}
                name: gentian-request-bound-redirect
                description: "The clients that declare a request parameter"
                enabled: true
                condition:
                  - name: client-attributes
                    configuration:
                      attributes: '[{"key":"gentianos.io/request-bound-redirect","value":"true"}]'
                profilesRefs:
                  - name: {{ $tenant }}-request-bound-redirect-profile
              providerConfigRef:
                name: keycloak

            {{- if and $kernelBroker $kd $kcInternal $kernelRealm }}
            {{- /* ── the kernel realm's administrators entering this tenant ──
                 The tenant let the platform's administrators sign in to it
                 (Tenant spec.platformAccess.adminsEnter; the operator projects
                 spec.kernelBroker). The identity provider "kernel" sends them
                 to the kernel realm and takes them back as an account of this
                 realm, through the client broker-to-<tenant> the platform
                 tenant composes in the kernel realm: authenticated by the JWT
                 this realm signs, checked against this realm's published
                 keys. No secret; the provider insists on one, so a fixed word
                 that is never sent fills it.

                 For the platform's administrators only. The provider requires
                 the token's groups claim to name gentian:platform:admin, so no
                 other kernel account gets an account here through it, and two
                 mappers of one kind put whoever arrives into this tenant's
                 admins group and its platform-admins group from that claim at
                 every sign-in (FORCE): a person who left the platform group
                 is out of both at their next sign-in through it. The second
                 group grants nothing here; it is what lets a partner
                 assertion say cluster-admin (the partner scopes above).
                 Keycloak's own first-broker-login
                 flow, with no profile page: an address this realm already has
                 is linked once its owner confirms it.

                 Hidden on the sign-in page: the way in is the platform
                 console's "Enter tenant", which is the desktop's address with
                 kc_idp_hint=kernel. Delete and not Orphan: a switch turned off
                 ends the way in. */}}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: kernel-idp-client
              name: {{ $tenant }}-kernel-idp-client
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: {{ $tenant }}-kernel-idp-client
                    namespace: {{ $identityNs }}
                    labels:
                      app.kubernetes.io/managed-by: crossplane
                  stringData:
                    client_id: broker-to-{{ $tenant }}
                    # Never sent: the client authenticates by a signed JWT.
                    client_secret: private-key-jwt
              providerConfigRef:
                name: kubernetes
            ---
            apiVersion: oidc.keycloak.crossplane.io/v1alpha1
            kind: IdentityProvider
            metadata:
              name: {{ $tenant }}-kernel-idp
              annotations:
                crossplane.io/external-name: kernel
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-kernel-idp
            spec:
              deletionPolicy: Delete
              managementPolicies: ["Observe", "Create", "Update", "Delete"]
              forProvider:
                realm: {{ $realm }}
                alias: kernel
                displayName: {{ printf "%s administrators" $brandName | quote }}
                providerId: oidc
                enabled: true
                trustEmail: true
                storeToken: false
                hideOnLoginPage: true
                linkOnly: false
                authenticateByDefault: false
                addReadTokenRoleOnCreate: false
                syncMode: FORCE
                validateSignature: true
                defaultScopes: openid profile email
                issuer: {{ printf "https://id.%s/auth/realms/%s" $kd $kernelRealm | quote }}
                authorizationUrl: {{ printf "https://id.%s/auth/realms/%s/protocol/openid-connect/auth" $kd $kernelRealm | quote }}
                logoutUrl: {{ printf "https://id.%s/auth/realms/%s/protocol/openid-connect/logout" $kd $kernelRealm | quote }}
                tokenUrl: {{ printf "%s/realms/%s/protocol/openid-connect/token" $kcInternal $kernelRealm | quote }}
                jwksUrl: {{ printf "%s/realms/%s/protocol/openid-connect/certs" $kcInternal $kernelRealm | quote }}
                userInfoUrl: {{ printf "%s/realms/%s/protocol/openid-connect/userinfo" $kcInternal $kernelRealm | quote }}
                firstBrokerLoginFlowAlias: first broker login
                extraConfig:
                  clientAuthMethod: private_key_jwt
                  clientAssertionAudience: {{ printf "https://id.%s/auth/realms/%s" $kd $kernelRealm | quote }}
                  filteredByClaim: "true"
                  claimFilterName: groups
                  claimFilterValue: gentian:platform:admin
                  updateProfileFirstLoginMode: "off"
                clientIdSecretRef:
                  name: {{ $tenant }}-kernel-idp-client
                  namespace: {{ $identityNs }}
                  key: client_id
                clientSecretSecretRef:
                  name: {{ $tenant }}-kernel-idp-client
                  namespace: {{ $identityNs }}
                  key: client_secret
              providerConfigRef:
                name: keycloak
            ---
            apiVersion: identityprovider.keycloak.crossplane.io/v1alpha1
            kind: IdentityProviderMapper
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-kernel-idp-admins-mapper
              name: {{ $tenant }}-kernel-idp-admins-mapper
            spec:
              deletionPolicy: Delete
              managementPolicies: ["Observe", "Create", "Update", "Delete"]
              forProvider:
                realm: {{ $realm }}
                identityProviderAlias: kernel
                name: platform administrators are this tenant's administrators
                identityProviderMapper: oidc-advanced-group-idp-mapper
                extraConfig:
                  syncMode: FORCE
                  claims: '[{"key":"groups","value":"gentian:platform:admin"}]'
                  are.claim.values.regex: "false"
                  group: {{ printf "/gentian:tenant:%s:admins" $tenant | quote }}
              providerConfigRef:
                name: keycloak
            ---
            apiVersion: identityprovider.keycloak.crossplane.io/v1alpha1
            kind: IdentityProviderMapper
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-kernel-idp-platform-admins-mapper
              name: {{ $tenant }}-kernel-idp-platform-admins-mapper
            spec:
              deletionPolicy: Delete
              managementPolicies: ["Observe", "Create", "Update", "Delete"]
              forProvider:
                realm: {{ $realm }}
                identityProviderAlias: kernel
                name: platform administrators are this tenant's platform administrators
                identityProviderMapper: oidc-advanced-group-idp-mapper
                extraConfig:
                  syncMode: FORCE
                  claims: '[{"key":"groups","value":"gentian:platform:admin"}]'
                  are.claim.values.regex: "false"
                  group: {{ printf "/gentian:tenant:%s:platform-admins" $tenant | quote }}
              providerConfigRef:
                name: keycloak
            {{- end }}{{- /* $kernelBroker */}}
            {{- end }}
            {{- end }}

            {{- /* ── the platform's administrators entering tenants ─────────
                 Composed by the tenant that adopts the kernel realm, from
                 what the operator projects (spec.kernelEnter): per tenant
                 that lets the platform's administrators enter, the client
                 its realm's provider "kernel" signs in with,
                 broker-to-<tenant>: authenticated by the JWT that realm
                 signs, checked against its published keys, and carrying the
                 groups claim the provider reads the platform group off.
                 Realm state of the kernel realm, which this Composition
                 otherwise leaves alone -- made here because nothing else
                 composes that realm. The resource names keep their earlier
                 "hub-enter" spelling so that live clients are not replaced. */}}
            {{- if and $adoptsKernelRealm $kd $kcInternal $kernelRealm }}
            {{- range $e := $kernelEnter }}
            {{- if and (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" (toString $e.tenant)) (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" (toString $e.realm)) }}
            ---
            apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
            kind: Client
            metadata:
              name: {{ $tenant }}-hub-enter-{{ $e.tenant }}-client
              annotations:
                crossplane.io/external-name: broker-to-{{ $e.tenant }}
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-hub-enter-{{ $e.tenant }}-client
            spec:
              deletionPolicy: Delete
              managementPolicies: ["Observe", "Create", "Update", "Delete"]
              forProvider:
                clientId: broker-to-{{ $e.tenant }}
                name: {{ printf "Enter %s" $e.tenant | quote }}
                realmId: {{ $realm }}
                accessType: CONFIDENTIAL
                clientAuthenticatorType: client-jwt
                enabled: true
                standardFlowEnabled: true
                implicitFlowEnabled: false
                directAccessGrantsEnabled: false
                serviceAccountsEnabled: false
                fullScopeAllowed: false
                validRedirectUris:
                  - {{ printf "https://id.%s/auth/realms/%s/broker/kernel/endpoint" $kd $e.realm | quote }}
                extraConfig:
                  use.jwks.url: "true"
                  jwks.url: {{ printf "https://id.%s/auth/realms/%s/protocol/openid-connect/certs" $kd $e.realm | quote }}
                  token.endpoint.auth.signing.alg: RS256
                  gentianos.io/managed-by: platform
              providerConfigRef:
                name: keycloak
            ---
            apiVersion: openidgroup.keycloak.crossplane.io/v1alpha1
            kind: GroupMembershipProtocolMapper
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-hub-enter-{{ $e.tenant }}-groups-mapper
              name: {{ $tenant }}-hub-enter-{{ $e.tenant }}-groups-mapper
            spec:
              deletionPolicy: Delete
              managementPolicies: ["Observe", "Create", "Update", "Delete"]
              forProvider:
                realmId: {{ $realm }}
                clientIdRef:
                  name: {{ $tenant }}-hub-enter-{{ $e.tenant }}-client
                  policy:
                    resolve: Always
                name: groups
                claimName: groups
                fullPath: false
                addToIdToken: true
                addToAccessToken: true
                addToUserinfo: true
              providerConfigRef:
                name: keycloak
            {{- end }}
            {{- end }}{{- /* enter */}}
            {{- end }}{{- /* $adoptsKernelRealm */}}

            {{- /* No App claims. An installed app is a Component, and its
                 Component writes the claim the app Composition answers
                 (internal/controller/component_composition.go). This
                 Composition used to emit one per entry of spec.apps, which
                 made an installed app a list entry and a claim and never a
                 thing of its own: no status, no tile, and a route with
                 nothing asked at it. */}}

            {{- /* No implicit apps. open-webui used to be injected here whenever the
                 cluster served LLM — but an app the composition invents is an app
                 the tenant operator cannot see: it seeds OIDC credentials (and
                 builds identity Jobs and groups) from tenant.spec.apps alone, so
                 the injected app's ExternalSecrets waited forever on an OpenBao
                 path nothing would ever write. Tenant scaffolding lists open-webui
                 in spec.apps when the claim serves LLM; one list, every reader. */}}

    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready

    - step: sequence-tenant-provisioning
      functionRef:
        name: function-sequencer
      input:
        apiVersion: sequencer.fn.crossplane.io/v1beta1
        kind: Input
        resetCompositeReadiness: true
        rules:
          # Tenant shell before kernel Jobs or app claims.
          #
          # Every name here must be a resource this Composition renders. The
          # sequencer waits for one that is absent rather than skipping it, and
          # reports that as a normal delay — so a name left behind by a resource
          # that moved elsewhere stops everything after it, silently and
          # forever, on a composite that still reads Synced=True Ready=True.
          # networkpolicy sat here for seven weeks after the tenant NetworkPolicy
          # became the operator's (tenant_network_policy.go), holding vault-policy
          # back the whole time: no tenant had the OpenBao policy its admin's
          # token names, so every tenant-scoped credential write answered 403.
          - sequence:
            - namespace
            - limitrange
            - vault-policy
          # Keycloak realm before other identity Jobs; identity before App Compositions.
          # job-keycloak-(admin|…)-.* deliberately excludes job-keycloak-realm-* —
          # realm matches both patterns if the broad job-keycloak-.* form is used.
          - sequence:
            - job-keycloak-realm-.*
            - job-keycloak-(admin|broker|client|kernel|oidc)-.*
          - sequence:
            - job-keycloak-(admin|broker|client|kernel|oidc)-.*
            - app-.*
          # The zone's client secret before the client that is pushed it.
          #
          # A generator answers with a value the moment it is asked, but the
          # ExternalSecret that asks has to reconcile before the Secret exists,
          # and the Client refuses to create without the Secret its
          # clientSecretSecretRef names. Without this the client's first few
          # reconciles fail on a Secret that is seconds away, which is
          # recoverable but reads as a broken zone to anyone watching.
          - sequence:
            - edge-zone-password
            - edge-zone-client-secret
            - keycloak-edge-zone-client
          # The exchange client's secret before the exchange client, for the
          # same reason and in the same shape.
          - sequence:
            - edge-exchange-password
            - edge-exchange-client-secret
            - keycloak-edge-exchange-client
          # A vouching client's secret before the client, again for that
          # reason. Patterns, because there is one of each per component that
          # vouches: every vouching client waits until every vouching Secret
          # is there, which holds one back a moment longer than it has to and
          # is simpler than a rule nobody can write per component. A tenant
          # with no such component has nothing matching the last entry, so
          # nothing is held back on the first two matching nothing either.
          - sequence:
            - vouching-password-.*
            - vouching-secret-.*
            - keycloak-vouching-client-.*
          # The registration flow before the form in it, the form before its
          # executions, and all of them before the realm is bound to the
          # flow. Patterns, so a tenant without sign-up, which renders none
          # of them, is not held back by their absence.
          - sequence:
            - keycloak-registration-flow.*
            - keycloak-registration-form.*
            - keycloak-registration-exec-.*
            - keycloak-registration-bindings.*
          # The platform's administrators entering a tenant: the provider's
          # Secret before the provider, the provider before its mapper.
          - sequence:
            - ^kernel-idp-client$
            - ^keycloak-kernel-idp$
            - ^keycloak-kernel-idp-admins-mapper$
