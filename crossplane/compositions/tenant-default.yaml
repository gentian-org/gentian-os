apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: tenant-default
  labels:
    gentianos.io/composition: tenant
spec:
  compositeTypeRef:
    apiVersion: gentianos.io/v1alpha1
    kind: XTenant
  mode: Pipeline
  pipeline:

    - step: fetch-cluster-config
      functionRef:
        name: function-extra-resources
      input:
        apiVersion: extra-resources.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          extraResources:
            - kind: ConfigMap
              into: clusterConfig
              apiVersion: v1
              type: Selector
              selector:
                maxMatch: 1
                minMatch: 0
                matchLabels:
                  - key: gentianos.io/config-type
                    type: Value
                    value: cluster-config
            - kind: ConfigMap
              into: provisioningJobs
              apiVersion: v1
              type: Selector
              selector:
                maxMatch: 1
                minMatch: 0
                matchLabels:
                  - key: gentianos.io/config-type
                    type: Value
                    value: tenant-provisioning-jobs
                  - key: gentianos.io/tenant
                    type: FromCompositeFieldPath
                    valueFromFieldPath: metadata.name

    # ── Step 2: Render composed resources (tenant shell owner) ────────────────
    - step: render-tenant-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr     := .observed.composite.resource }}
            {{- $spec   := $xr.spec }}
            {{- $tenant := $xr.metadata.name }}
            {{- $ns     := default (printf "tenant-%s" $tenant) (dig "isolation" "namespace" "" $spec) }}
            {{- $kd     := default "" $spec.kernelDomain }}
            {{- $domain := default (printf "%s.%s" $tenant $kd) (default "" $spec.domain) }}
            {{- $kvMount := "secret" }}
            {{- $extraRes := index .context "apiextensions.crossplane.io/extra-resources" }}
            {{- $ccList   := dig "clusterConfig" list $extraRes }}
            {{- $cc       := ternary (index $ccList 0) dict (gt (len $ccList) 0) }}
            {{- $ccData   := dig "data" dict $cc }}
            {{- /* The kernel realm and Keycloak's in-cluster URL, published by the
                 Cluster claim. Both empty means the cluster predates them, and the
                 broker resources below stay unrendered rather than half-configured
                 — the same rule oidc.discoveryUrl follows. */}}
            {{- $kernelRealm := dig "identity.kernelRealm" "" $ccData }}
            {{- $kcInternal  := dig "identity.internalUrl" "" $ccData }}
            {{- $provList  := dig "provisioningJobs" list $extraRes }}
            {{- $provCM    := ternary (index $provList 0) dict (gt (len $provList) 0) }}
            {{- $jobsJSON  := dig "data" "jobs.json" "[]" $provCM }}
            {{- $jobs      := fromJson $jobsJSON }}
            {{- $objectsJSON := dig "data" "objects.json" "[]" $provCM }}
            {{- $objects     := fromJson $objectsJSON }}
            {{- /*
              network.routingMode and the three network.kubeApiServer* keys used
              to be read here and were never referenced again — assigned, then
              discarded. Removed rather than left as documentation of an intent
              that moved: the tenant NetworkPolicy is built by the operator, from
              KUBE_APISERVER_CIDR and loadKubeAPIEndpointSlice in
              tenant_network_policy.go, not from this ConfigMap.

              They mattered because they were the only apparent consumer of the
              three values the installer discovers from the live cluster, which
              made those look like they had to be observed through Crossplane
              before the ConfigMap could be composed. No Composition reads them.
            */}}
            {{- $quotas      := default dict (dig "quotas" dict $spec) }}
            {{- $lrDefaultCPU := dig "tenant.limitRange.default.cpu" "500m" $ccData }}
            {{- $lrDefaultMem := dig "tenant.limitRange.default.memory" "512Mi" $ccData }}
            {{- $lrRequestCPU := dig "tenant.limitRange.defaultRequest.cpu" "100m" $ccData }}
            {{- $lrRequestMem := dig "tenant.limitRange.defaultRequest.memory" "128Mi" $ccData }}

            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              name: {{ $tenant }}-namespace
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: namespace
            spec:
              providerConfigRef:
                name: kubernetes
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Namespace
                  metadata:
                    name: {{ $ns }}
                    labels:
                      gentianos.io/tenant: {{ $tenant }}
                      gentianos.io/managed-by: crossplane
                      app.kubernetes.io/managed-by: gentian-os

            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              name: {{ $tenant }}-limitrange
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: limitrange
            spec:
              providerConfigRef:
                name: kubernetes
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: LimitRange
                  metadata:
                    name: tenant-limits
                    namespace: {{ $ns }}
                    labels:
                      gentianos.io/tenant: {{ $tenant }}
                      app.kubernetes.io/managed-by: gentian-os
                  spec:
                    limits:
                      - type: Container
                        default:
                          cpu: {{ $lrDefaultCPU | quote }}
                          memory: {{ $lrDefaultMem | quote }}
                        defaultRequest:
                          cpu: {{ $lrRequestCPU | quote }}
                          memory: {{ $lrRequestMem | quote }}
                        max:
                          cpu: "4"
                          memory: 8Gi

            {{- if or $quotas.storage $quotas.cpu $quotas.memory }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              name: {{ $tenant }}-resourcequota
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: resourcequota
            spec:
              providerConfigRef:
                name: kubernetes
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ResourceQuota
                  metadata:
                    name: tenant-quota
                    namespace: {{ $ns }}
                    labels:
                      gentianos.io/tenant: {{ $tenant }}
                      app.kubernetes.io/managed-by: gentian-os
                  spec:
                    hard:
                      {{- if $quotas.storage }}
                      requests.storage: {{ $quotas.storage | quote }}
                      {{- end }}
                      {{- if $quotas.requestsCpu }}
                      requests.cpu: {{ $quotas.requestsCpu | quote }}
                      {{- end }}
                      {{- if $quotas.requestsMemory }}
                      requests.memory: {{ $quotas.requestsMemory | quote }}
                      {{- end }}
                      {{- if $quotas.cpu }}
                      limits.cpu: {{ $quotas.cpu | quote }}
                      {{- end }}
                      {{- if $quotas.memory }}
                      limits.memory: {{ $quotas.memory | quote }}
                      {{- end }}
                      {{- if $quotas.maxPods }}
                      pods: {{ $quotas.maxPods | quote }}
                      {{- end }}
            {{- end }}


            ---
            apiVersion: vault.vault.upbound.io/v1alpha1
            kind: Policy
            metadata:
              name: {{ $tenant }}-tenant-policy
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: vault-policy
            spec:
              providerConfigRef:
                name: openbao
              forProvider:
                name: tenant-{{ $tenant }}
                policy: |
                  path "{{ $kvMount }}/data/gentian-os/tenants/{{ $tenant }}/*" {
                    capabilities = ["create", "read", "update", "delete", "list"]
                  }
                  path "{{ $kvMount }}/metadata/gentian-os/tenants/{{ $tenant }}/*" {
                    capabilities = ["list", "delete"]
                  }

            {{- range $job := $jobs }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              name: {{ $tenant }}-job-{{ $job.metadata.name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: job-{{ $job.metadata.name }}
            spec:
              providerConfigRef:
                name: kubernetes
              forProvider:
                manifest:
                  {{- $job | toYaml | nindent 18 }}
            {{- end }}

            {{- range $obj := $objects }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              # Include kind in the Object name — multiple resources can share
              # metadata.name (e.g. memcached Deployment + Service).
              name: {{ $tenant }}-obj-{{ lower $obj.kind }}-{{ $obj.metadata.name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: obj-{{ lower $obj.kind }}-{{ $obj.metadata.name }}
            spec:
              providerConfigRef:
                name: kubernetes
              forProvider:
                manifest:
                  {{- $obj | toYaml | nindent 18 }}
            {{- end }}

            {{- /*
            The portal's public OIDC client, declared rather than provisioned by a
            Job.

            external-name is the clientId, not Keycloak's internal UUID, which is
            what lets one template serve both cases: on a tenant whose client
            already exists the provider adopts it, and on a new tenant it creates
            it under that name. Verified by adopting the live gentian-portal
            client read-only — Ready, 45 fields observed — and confirming the
            client survived the probe's removal.

            The field values reproduce what the Job wrote. That matters more than
            it looks: an adopted resource is reconciled toward this spec, so a
            field omitted here is not left alone, it is reset. The redirect and
            origin lists below were read back from the live client rather than
            reconstructed from the Job's script.
            */}}
            ---
            apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
            kind: Client
            metadata:
              name: {{ $tenant }}-portal-public-client
              annotations:
                crossplane.io/external-name: gentian-portal
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-portal-public-client
            spec:
              deletionPolicy: Orphan
              forProvider:
                clientId: gentian-portal
                name: Gentian Portal
                realmId: {{ $tenant }}
                accessType: PUBLIC
                enabled: true
                standardFlowEnabled: true
                implicitFlowEnabled: false
                directAccessGrantsEnabled: false
                serviceAccountsEnabled: false
                fullScopeAllowed: true
                rootUrl: https://portal.{{ $kd }}
                baseUrl: /
                adminUrl: https://portal.{{ $kd }}
                validRedirectUris:
                  - https://{{ $domain }}/
                  - https://{{ $domain }}/*
                  - https://portal.{{ $kd }}/*
                  - https://portal.{{ $kd }}/login
                  - https://portal.{{ $kd }}/login/*
                webOrigins:
                  - "+"
                  - https://{{ $domain }}
                  - https://portal.{{ $kd }}
                validPostLogoutRedirectUris:
                  - https://{{ $domain }}/
                  - https://{{ $domain }}/*
                  - https://portal.{{ $kd }}/*
                  - https://portal.{{ $kd }}/login
              providerConfigRef:
                name: keycloak

            {{- /*
            The audience OpenBao's role binds on.

            A Keycloak access token does not carry the requesting client in aud —
            azp names the client, and aud holds only what an audience mapper puts
            there — so without this the tenant's auth mount refuses every exchange
            on the audience whoever the caller is.

            All five config keys are set, not the three that define the intent.
            Keycloak adds introspection.token.claim and userinfo.token.claim on
            create, and this map is replaced wholesale on reconcile: omitting them
            would strip them from a mapper that already has them, and introspection
            is what Dovecot's XOAUTH2 and OpenBao read.

            clientIdRef rather than the client's UUID, so this follows the Client
            above instead of pinning an id that differs per tenant.
            */}}
            ---
            apiVersion: client.keycloak.crossplane.io/v1alpha1
            kind: ProtocolMapper
            metadata:
              name: {{ $tenant }}-portal-openbao-audience
              annotations:
                crossplane.io/external-name: openbao-audience
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-portal-openbao-audience
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $tenant }}
                clientIdRef:
                  name: {{ $tenant }}-portal-public-client
                name: openbao-audience
                protocol: openid-connect
                protocolMapper: oidc-audience-mapper
                config:
                  included.client.audience: openbao
                  id.token.claim: "false"
                  access.token.claim: "true"
                  introspection.token.claim: "true"
                  userinfo.token.claim: "false"
              providerConfigRef:
                name: keycloak

            {{- /*
            The portal's BFF client. Confidential, unlike the public one above.

            clientSecretSecretRef is not optional here. The schema says an omitted
            secret "will be generated by Keycloak", and this client's secret is not
            Keycloak's to choose: it is held in the gentian-portal-bff Secret and
            pushed in, and the portal authenticates with that value. Leaving it out
            would mint a new one and break portal login until the Secret caught up.
            */}}
            ---
            apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
            kind: Client
            metadata:
              name: {{ $tenant }}-portal-bff-client
              annotations:
                crossplane.io/external-name: gentian-portal-bff
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-portal-bff-client
            spec:
              deletionPolicy: Orphan
              # Observe-only, deliberately, and the one client here that is not
              # fully managed. See the forProvider comment below.
              managementPolicies: ["Observe"]
              forProvider:
                clientId: gentian-portal-bff
                name: Gentian Portal BFF
                realmId: {{ $tenant }}
                accessType: CONFIDENTIAL
                enabled: true
                standardFlowEnabled: false
                implicitFlowEnabled: false
                directAccessGrantsEnabled: true
                serviceAccountsEnabled: false
                fullScopeAllowed: true
                # No redirect URIs, web origins or post-logout URIs, even though the
                # live client carries them.
                #
                # This client has standardFlowEnabled and implicitFlowEnabled both
                # false — it authenticates by direct access grant, and is never
                # redirected to. Keycloak stores redirect URIs on such a client
                # anyway, so they were read off the live object and declared here,
                # and the provider then refused every update with
                #   valid_redirect_uris cannot be set when standard or implicit
                #   flow is not enabled
                # leaving the resource Synced=False and this manifest inert.
                #
                # Observing a state does not mean it can be declared. The fields
                # are unused here, so dropping them is what makes the manifest
                # expressible at all.
                #
                # Dropping them from this template is necessary but not
                # sufficient. Two further layers resurrect the rejected state:
                #
                #  1. Upjet late-initialisation copies unset optional fields out
                #     of the live object back into spec.forProvider, so the
                #     provider re-adds the redirect URIs it just refused to
                #     write. Omitting LateInitialize from managementPolicies
                #     stops that, and the spec then stays clean.
                #  2. The update still fails, because the plan is built from the
                #     OBSERVED object, and the live client itself holds the
                #     illegal combination. Any write re-validates it and is
                #     rejected. No spec can fix that from this side.
                #
                # So the client is Observe-only until the two inert fields are
                # cleared on the live object (redirectUris and webOrigins; the
                # post-logout URIs are only Keycloak's derived default and are
                # not stored). Once cleared, restore
                #   managementPolicies: ["Observe", "Create", "Update", "Delete"]
                # and this becomes a fully managed client like the others.
                # Tracked in the roadmap.
                clientSecretSecretRef:
                  name: gentian-portal-bff
                  namespace: platform-kernel
                  key: client_secret
              providerConfigRef:
                name: keycloak
            {{- /*
            All seven default scopes, not the one the Job attaches.

            The Job only ever adds "groups", because the other six are Keycloak's
            own defaults and were already there. This list is replaced wholesale on
            reconcile, so declaring the one that expresses the intent would remove
            acr, basic, email, profile, roles and web-origins from the client —
            every portal token would lose its profile, email and role claims. Read
            off the live client rather than off the Job.
            */}}
            ---
            apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
            kind: ClientDefaultScopes
            metadata:
              name: {{ $tenant }}-portal-bff-default-scopes
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-portal-bff-default-scopes
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $tenant }}
                clientIdRef:
                  name: {{ $tenant }}-portal-bff-client
                defaultScopes:
                  - acr
                  - basic
                  - email
                  - groups
                  - profile
                  - roles
                  - web-origins
              providerConfigRef:
                name: keycloak

            {{- /* ── The tenant claim ──────────────────────────────────────────
                 A tenant realm has no notion of which tenant it serves, and everything
                 downstream is keyed by that: the JWT role on this tenant's OpenBao mount
                 maps this claim into token metadata, the credential manager reads it to
                 decide scope, and the tenant policy templates its paths from it.

                 Without it a tenant administrator authenticates successfully and carries
                 no tenant at all — which is not a refusal but something worse. Their
                 first repository was created CLUSTER-owned, at a kernel path, because an
                 empty tenant read as "no tenant scope" rather than as an error.

                 The tenant NAME, not the realm. They are the same by default, but
                 isolation.keycloakRealm may differ and every path is keyed by name.
              */}}
            ---
            apiVersion: client.keycloak.crossplane.io/v1alpha1
            kind: ProtocolMapper
            metadata:
              name: {{ $tenant }}-portal-tenant-claim
              annotations:
                crossplane.io/external-name: tenant
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-portal-tenant-claim
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $tenant }}
                clientIdRef:
                  name: {{ $tenant }}-portal-public-client
                name: tenant
                protocol: openid-connect
                protocolMapper: oidc-hardcoded-claim-mapper
                config:
                  claim.name: tenant
                  claim.value: {{ $tenant | quote }}
                  jsonType.label: String
                  id.token.claim: "false"
                  access.token.claim: "true"
                  introspection.token.claim: "true"
                  userinfo.token.claim: "false"
              providerConfigRef:
                name: keycloak


            {{- /*
            Dovecot's OIDC client, on clusters that run Dovecot.

            Gated on mail.serviceMode the same way the operator gates Dovecot
            provisioning: on a cluster relaying through a smarthost there is no
            IMAP server, and a client nothing authenticates as would sit in every
            tenant realm suggesting otherwise.

            It exists only to call the realm's token introspection endpoint and
            validate XOAUTH2 tokens other clients issued. Nothing is redirected to
            it and nobody is entitled to it, so there are no redirect URIs, no web
            origins, no client scope and no roles — and fullScopeAllowed is false,
            read off the live client rather than assumed.

            Confidential, and the secret is not Keycloak's to choose: Dovecot
            authenticates to introspection with the value in dovecot-admin. An
            omitted clientSecretSecretRef would have Keycloak generate a new one
            and IMAP would stop validating tokens.
            */}}
            {{- if eq (dig "mail.serviceMode" "" $ccData) "kernel" }}
            ---
            apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
            kind: Client
            metadata:
              name: {{ $tenant }}-dovecot-oidc-client
              annotations:
                crossplane.io/external-name: gentian-dovecot
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-dovecot-oidc-client
            spec:
              deletionPolicy: Orphan
              # Everything except LateInitialize. This client has a second writer —
              # the Dovecot OIDC Job still provisions the same clientId in this realm
              # — and late-init copies fields the provider observes but this template
              # does not set out of the live object into spec.forProvider, making the
              # Job's values this resource's declared intent. The portal BFF client is
              # what that looks like when the two disagree: Synced=False, unable to
              # reconcile, while reading Ready=True.
              #
              # The Job's tenant-realm half is written and verified but blocked on
              # roadmap 1.29; until it lands, this is what keeps the two apart.
              managementPolicies: ["Observe", "Create", "Update", "Delete"]
              forProvider:
                clientId: gentian-dovecot
                realmId: {{ $tenant }}
                accessType: CONFIDENTIAL
                enabled: true
                standardFlowEnabled: false
                implicitFlowEnabled: false
                directAccessGrantsEnabled: false
                serviceAccountsEnabled: false
                fullScopeAllowed: false
                clientSecretSecretRef:
                  name: dovecot-admin
                  namespace: platform-kernel
                  key: oidc_client_secret
              providerConfigRef:
                name: keycloak
            {{- end }}

            {{- if and $kernelRealm $kcInternal }}
            {{- /* ── the tenant realm, observed ──────────────────────────────
                 The realm every other Keycloak object here lives in. The realm
                 script creates it and keeps it enabled, sets its display name and
                 its browser security headers; the tenant SMTP Job sets its mail
                 server. All of that is realm state, and this resource can hold it.

                 Observed first, and with almost nothing declared, because reading
                 the object back is how the field mapping gets established rather
                 than guessed: sixty fields, and the ones that matter here are
                 nested under securityDefenses and smtpServer. What the provider
                 reports is what the manifest will then say.

                 A realm is identified by its name, so unlike the pack's mappers
                 it can be adopted. That is the whole reason this can be taken in
                 steps at all.
              */}}
            ---
            apiVersion: realm.keycloak.crossplane.io/v1alpha1
            kind: Realm
            metadata:
              name: {{ $tenant }}-realm
              annotations:
                crossplane.io/external-name: {{ $tenant }}
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-realm
            spec:
              deletionPolicy: Orphan
              managementPolicies: ["Observe"]
              forProvider:
                realm: {{ $tenant }}
              providerConfigRef:
                name: keycloak

            {{- /* ── kernel broker client, observed ────────────────────────────
                 The tenant realm brokers to the kernel realm, and broker-<tenant>
                 in the KERNEL realm is the client it authenticates as. The realm
                 Job creates it, so this does not.

                 Observe-only, and here for one reason: writeConnectionSecretToRef
                 republishes the client's existing secret into Kubernetes without
                 rotating it. That is what lets the IdP below take its credentials
                 from a Secret instead of a Job curling the admin API for them —
                 the step that kept the broker imperative.

                 Not fully managed on purpose. Managing it would put the secret
                 under the provider's control, and a rotation would break brokered
                 login for as long as the IdP still held the old value.
              */}}
            ---
            apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
            kind: Client
            metadata:
              name: {{ $tenant }}-broker-client
              annotations:
                crossplane.io/external-name: broker-{{ $tenant }}
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-broker-client
            spec:
              deletionPolicy: Orphan
              managementPolicies: ["Observe"]
              forProvider:
                clientId: broker-{{ $tenant }}
                realmId: {{ $kernelRealm }}
              writeConnectionSecretToRef:
                name: {{ $tenant }}-broker-client
                namespace: platform-kernel
              providerConfigRef:
                name: keycloak
            {{- /* ── kernel IdP in the tenant realm ──────────────────────────────
                 What tenant login actually runs on: the tenant realm delegates
                 to the kernel realm through this.

                 Managed, and every field is declared, because two Jobs also write
                 this object and they disagreed about firstBrokerLoginFlowAlias.
                 The realm script in identity_reconciler.go sets the built-in
                 "first broker login"; the broker-idp Job sets the gentian flow.
                 Both ran on 2026-08-21 — the realm job at 07:02:56, the broker-idp
                 job at 07:04:37 — leaving roughly two minutes of that reconcile in
                 which a first-time login was sent to a flow that stops to ask the
                 user to confirm the link, instead of matching them to the account
                 already provisioned for them by email.

                 It was adopted Observe-only first and read back against the Admin
                 API before anything was declared. That is the check the portal BFF
                 client did not get: a Job writes through the Admin API, which
                 enforces less than the schema the provider validates against, so
                 anything a Job created may hold a state the provider cannot
                 express.
              */}}
            {{- /* The broker client's id. Not a secret, but clientIdSecretRef is the
                 only way the provider will take it, so it needs somewhere to live.
                 The client_secret beside it is the one the observed Client above
                 republishes. */}}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-broker-client-id
              name: {{ $tenant }}-broker-client-id
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: {{ $tenant }}-broker-client-id
                    namespace: platform-kernel
                    labels:
                      app.kubernetes.io/managed-by: crossplane
                  stringData:
                    client_id: broker-{{ $tenant }}
              providerConfigRef:
                name: kubernetes
            ---
            apiVersion: oidc.keycloak.crossplane.io/v1alpha1
            kind: IdentityProvider
            metadata:
              name: {{ $tenant }}-kernel-idp
              annotations:
                crossplane.io/external-name: kernel
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-kernel-idp
            spec:
              deletionPolicy: Orphan
              # Everything except LateInitialize. Late-init copies the live object's
              # values back over this spec for every field it does read, which is how
              # the portal BFF client ended up unable to reconcile at all.
              managementPolicies: ["Observe", "Create", "Update", "Delete"]
              forProvider:
                realm: {{ $tenant }}
                alias: kernel
                displayName: Gentian SSO
                providerId: oidc
                enabled: true
                trustEmail: true
                storeToken: true
                hideOnLoginPage: true
                linkOnly: false
                authenticateByDefault: false
                addReadTokenRoleOnCreate: false
                syncMode: IMPORT
                validateSignature: true
                backchannelSupported: true
                # openid alone is the provider's default, and it is not enough:
                # dropping profile and email costs every brokered login the user's
                # name and address.
                defaultScopes: openid profile email
                {{- /* Browser-facing endpoints go to the public URL; the
                     server-to-server half stays inside the cluster, so Keycloak does
                     not hairpin out through the ingress and back to reach itself
                     during the broker code exchange. */}}
                issuer: https://id.{{ $kd }}/auth/realms/{{ $kernelRealm }}
                authorizationUrl: https://id.{{ $kd }}/auth/realms/{{ $kernelRealm }}/protocol/openid-connect/auth
                logoutUrl: https://id.{{ $kd }}/auth/realms/{{ $kernelRealm }}/protocol/openid-connect/logout
                tokenUrl: {{ $kcInternal }}/realms/{{ $kernelRealm }}/protocol/openid-connect/token
                jwksUrl: {{ $kcInternal }}/realms/{{ $kernelRealm }}/protocol/openid-connect/certs
                userInfoUrl: {{ $kcInternal }}/realms/{{ $kernelRealm }}/protocol/openid-connect/userinfo
                # Matches a returning user to the account already provisioned for
                # them by email.
                firstBrokerLoginFlowAlias: first-broker-login-gentian
                {{- /* Keys the provider has no field for and does not read back. Both
                     are absent from status.atProvider and from extraConfig, and both
                     are set on the live object, so they are declared here or they are
                     lost on the first write: useJwksUrl is what points signature
                     validation at the JWKS endpoint, and updateProfileFirstLoginMode
                     is carried forward as it stands rather than left to a default. */}}
                extraConfig:
                  useJwksUrl: "true"
                  updateProfileFirstLoginMode: "on"
                clientIdSecretRef:
                  name: {{ $tenant }}-broker-client-id
                  namespace: platform-kernel
                  key: client_id
                clientSecretSecretRef:
                  name: {{ $tenant }}-broker-client
                  namespace: platform-kernel
                  key: attribute.client_secret
              providerConfigRef:
                name: keycloak
            {{- end }}

            {{- range $app := dig "apps" list $spec }}
            ---
            apiVersion: gentianos.io/v1alpha1
            kind: App
            metadata:
              name: {{ $app.profile }}
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: app-{{ $app.profile }}
              labels:
                gentianos.io/tenant: {{ $tenant }}
                gentianos.io/app: {{ $app.profile }}
                gentianos.io/managed-by: crossplane
                app.kubernetes.io/managed-by: gentian-os
            spec:
              compositionUpdatePolicy: Automatic
              profileRef:
                name: {{ $app.profile }}
              tenantNamespace: {{ $ns }}
              domain: {{ $domain }}
              {{- if $app.variant }}
              compositionRef:
                name: app-{{ $app.variant }}
              {{- end }}
              {{- with dig "addons" list $app }}
              addons:
                {{- range . }}
                - {{ . | quote }}
                {{- end }}
              {{- end }}
              {{- $appConfig := default dict $app.config }}
              {{- if or (dig "replicas" nil $appConfig) (dig "extraValues" nil $appConfig) }}
              config:
                {{- if dig "replicas" nil $appConfig }}
                replicas: {{ dig "replicas" 1 $appConfig }}
                {{- end }}
                {{- with dig "extraValues" nil $appConfig }}
                extraValues:
                  {{- . | toYaml | nindent 18 }}
                {{- end }}
              {{- end }}
            {{- end }}

            {{- /* No implicit apps. open-webui used to be injected here whenever the
                 cluster served LLM — but an app the composition invents is an app
                 the tenant operator cannot see: it seeds OIDC credentials (and
                 builds identity Jobs and groups) from tenant.spec.apps alone, so
                 the injected app's ExternalSecrets waited forever on an OpenBao
                 path nothing would ever write. Tenant scaffolding lists open-webui
                 in spec.apps when the claim serves LLM; one list, every reader. */}}

    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready

    - step: sequence-tenant-provisioning
      functionRef:
        name: function-sequencer
      input:
        apiVersion: sequencer.fn.crossplane.io/v1beta1
        kind: Input
        resetCompositeReadiness: true
        rules:
          # Tenant shell before kernel Jobs or app claims.
          - sequence:
            - namespace
            - limitrange
            - networkpolicy
            - vault-policy
          # Keycloak realm before other identity Jobs; identity before App Compositions.
          # job-keycloak-(admin|…)-.* deliberately excludes job-keycloak-realm-* —
          # realm matches both patterns if the broad job-keycloak-.* form is used.
          - sequence:
            - job-keycloak-realm-.*
            - job-keycloak-(admin|broker|client|kernel|oidc)-.*
          - sequence:
            - job-keycloak-(admin|broker|client|kernel|oidc)-.*
            - app-.*
