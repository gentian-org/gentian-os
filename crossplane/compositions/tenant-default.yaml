apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: tenant-default
  labels:
    gentianos.io/composition: tenant
spec:
  compositeTypeRef:
    apiVersion: gentianos.io/v1alpha1
    kind: XTenant
  mode: Pipeline
  pipeline:

    - step: fetch-cluster-config
      functionRef:
        name: function-extra-resources
      input:
        apiVersion: extra-resources.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          extraResources:
            - kind: ConfigMap
              into: clusterConfig
              apiVersion: v1
              type: Selector
              selector:
                maxMatch: 1
                minMatch: 0
                matchLabels:
                  - key: gentianos.io/config-type
                    type: Value
                    value: cluster-config
            - kind: ConfigMap
              into: provisioningJobs
              apiVersion: v1
              type: Selector
              selector:
                maxMatch: 1
                minMatch: 0
                matchLabels:
                  - key: gentianos.io/config-type
                    type: Value
                    value: tenant-provisioning-jobs
                  - key: gentianos.io/tenant
                    type: FromCompositeFieldPath
                    valueFromFieldPath: metadata.name

    # ── Step 2: Render composed resources (tenant shell owner) ────────────────
    - step: render-tenant-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr     := .observed.composite.resource }}
            {{- $spec   := $xr.spec }}
            {{- $tenant := $xr.metadata.name }}
            {{- $ns     := default (printf "tenant-%s" $tenant) (dig "isolation" "namespace" "" $spec) }}
            {{- $kd     := default "" $spec.kernelDomain }}
            {{- $domain := default (printf "%s.%s" $tenant $kd) (default "" $spec.domain) }}
            {{- $kvMount := "secret" }}
            {{- $extraRes := index .context "apiextensions.crossplane.io/extra-resources" }}
            {{- $ccList   := dig "clusterConfig" list $extraRes }}
            {{- $cc       := ternary (index $ccList 0) dict (gt (len $ccList) 0) }}
            {{- $ccData   := dig "data" dict $cc }}
            {{- $provList  := dig "provisioningJobs" list $extraRes }}
            {{- $provCM    := ternary (index $provList 0) dict (gt (len $provList) 0) }}
            {{- $jobsJSON  := dig "data" "jobs.json" "[]" $provCM }}
            {{- $jobs      := fromJson $jobsJSON }}
            {{- $objectsJSON := dig "data" "objects.json" "[]" $provCM }}
            {{- $objects     := fromJson $objectsJSON }}
            {{- $infraNs     := default "gentian-infra-dev" (dig "network.infraNamespace" "" $ccData) }}
            {{- $servicesNs  := dig "network.servicesNamespace" "" $ccData }}
            {{- $openbaoNs   := default "openbao" (dig "network.openbaoNamespace" "" $ccData) }}
            {{- $routingMode := default "gateway" (dig "network.routingMode" "" $ccData) }}
            {{- $kubeApiCIDR := dig "network.kubeApiServerCidr" "" $ccData }}
            {{- $kubeApiEndpointIP := dig "network.kubeApiServerEndpointIp" "" $ccData }}
            {{- $kubeApiEndpointPort := dig "network.kubeApiServerEndpointPort" "" $ccData }}
            {{- $quotas      := default dict (dig "quotas" dict $spec) }}
            {{- $lrDefaultCPU := dig "tenant.limitRange.default.cpu" "500m" $ccData }}
            {{- $lrDefaultMem := dig "tenant.limitRange.default.memory" "512Mi" $ccData }}
            {{- $lrRequestCPU := dig "tenant.limitRange.defaultRequest.cpu" "100m" $ccData }}
            {{- $lrRequestMem := dig "tenant.limitRange.defaultRequest.memory" "128Mi" $ccData }}

            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              name: {{ $tenant }}-namespace
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: namespace
            spec:
              providerConfigRef:
                name: kubernetes
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Namespace
                  metadata:
                    name: {{ $ns }}
                    labels:
                      gentianos.io/tenant: {{ $tenant }}
                      gentianos.io/managed-by: crossplane
                      app.kubernetes.io/managed-by: gentian-os

            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              name: {{ $tenant }}-limitrange
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: limitrange
            spec:
              providerConfigRef:
                name: kubernetes
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: LimitRange
                  metadata:
                    name: tenant-limits
                    namespace: {{ $ns }}
                    labels:
                      gentianos.io/tenant: {{ $tenant }}
                      app.kubernetes.io/managed-by: gentian-os
                  spec:
                    limits:
                      - type: Container
                        default:
                          cpu: {{ $lrDefaultCPU | quote }}
                          memory: {{ $lrDefaultMem | quote }}
                        defaultRequest:
                          cpu: {{ $lrRequestCPU | quote }}
                          memory: {{ $lrRequestMem | quote }}
                        max:
                          cpu: "4"
                          memory: 8Gi

            {{- if or $quotas.storage $quotas.cpu $quotas.memory }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              name: {{ $tenant }}-resourcequota
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: resourcequota
            spec:
              providerConfigRef:
                name: kubernetes
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ResourceQuota
                  metadata:
                    name: tenant-quota
                    namespace: {{ $ns }}
                    labels:
                      gentianos.io/tenant: {{ $tenant }}
                      app.kubernetes.io/managed-by: gentian-os
                  spec:
                    hard:
                      {{- if $quotas.storage }}
                      requests.storage: {{ $quotas.storage | quote }}
                      {{- end }}
                      {{- if $quotas.cpu }}
                      limits.cpu: {{ $quotas.cpu | quote }}
                      {{- end }}
                      {{- if $quotas.memory }}
                      limits.memory: {{ $quotas.memory | quote }}
                      {{- end }}
                      {{- if $quotas.maxPods }}
                      pods: {{ $quotas.maxPods | quote }}
                      {{- end }}
            {{- end }}

            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              name: {{ $tenant }}-networkpolicy
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: networkpolicy
            spec:
              providerConfigRef:
                name: kubernetes
              forProvider:
                manifest:
                  apiVersion: networking.k8s.io/v1
                  kind: NetworkPolicy
                  metadata:
                    name: tenant-isolation
                    namespace: {{ $ns }}
                    labels:
                      gentianos.io/tenant: {{ $tenant }}
                      app.kubernetes.io/managed-by: gentian-os
                  spec:
                    podSelector: {}
                    policyTypes:
                      - Ingress
                      - Egress
                    ingress:
                      - from:
                          - namespaceSelector:
                              matchLabels:
                                gentianos.io/tenant: {{ $tenant }}
                      - from:
                          - namespaceSelector:
                              matchLabels:
                                kubernetes.io/metadata.name: platform-kernel
                      - from:
                          - namespaceSelector:
                              matchLabels:
                                kubernetes.io/metadata.name: {{ $infraNs }}
                      - from:
                          - namespaceSelector:
                              matchLabels:
                                kubernetes.io/metadata.name: {{ $servicesNs }}
                      - from:
                          - namespaceSelector:
                              matchLabels:
                                kubernetes.io/metadata.name: ingress
                      {{- if eq $routingMode "gateway" }}
                      - from:
                          - namespaceSelector:
                              matchLabels:
                                kubernetes.io/metadata.name: envoy-gateway-system
                      {{- end }}
                    egress:
                      - to:
                          - namespaceSelector:
                              matchLabels:
                                kubernetes.io/metadata.name: platform-kernel
                      - to:
                          - namespaceSelector:
                              matchLabels:
                                kubernetes.io/metadata.name: {{ $infraNs }}
                      - to:
                          - namespaceSelector:
                              matchLabels:
                                kubernetes.io/metadata.name: {{ $servicesNs }}
                      - to:
                          - namespaceSelector:
                              matchLabels:
                                kubernetes.io/metadata.name: {{ $openbaoNs }}
                      - to:
                          - namespaceSelector:
                              matchLabels:
                                kubernetes.io/metadata.name: gentian-system
                      - to:
                          - namespaceSelector:
                              matchLabels:
                                gentianos.io/tenant: {{ $tenant }}
                      - to:
                          - namespaceSelector:
                              matchLabels:
                                kubernetes.io/metadata.name: ingress
                      {{- if eq $routingMode "gateway" }}
                      - to:
                          - namespaceSelector:
                              matchLabels:
                                kubernetes.io/metadata.name: envoy-gateway-system
                      {{- end }}
                      - ports:
                          - protocol: UDP
                            port: 53
                          - protocol: TCP
                            port: 53
                      {{- if $kubeApiCIDR }}
                      - to:
                          - ipBlock:
                              cidr: {{ $kubeApiCIDR | quote }}
                        ports:
                          - protocol: TCP
                            port: 443
                      {{- end }}
                      {{- /* Post-DNAT apiserver endpoint (MicroK8s/k3s often :16443). */}}
                      {{- if and $kubeApiEndpointIP $kubeApiEndpointPort }}
                      - to:
                          - ipBlock:
                              cidr: {{ printf "%s/32" $kubeApiEndpointIP | quote }}
                        ports:
                          - protocol: TCP
                            port: {{ $kubeApiEndpointPort }}
                      {{- end }}

            ---
            apiVersion: vault.vault.upbound.io/v1alpha1
            kind: Policy
            metadata:
              name: {{ $tenant }}-tenant-policy
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: vault-policy
            spec:
              providerConfigRef:
                name: openbao
              forProvider:
                name: tenant-{{ $tenant }}
                policy: |
                  path "{{ $kvMount }}/data/gentian-os/tenants/{{ $tenant }}/*" {
                    capabilities = ["create", "read", "update", "delete", "list"]
                  }
                  path "{{ $kvMount }}/metadata/gentian-os/tenants/{{ $tenant }}/*" {
                    capabilities = ["list", "delete"]
                  }

            {{- range $job := $jobs }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              name: {{ $tenant }}-job-{{ $job.metadata.name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: job-{{ $job.metadata.name }}
            spec:
              providerConfigRef:
                name: kubernetes
              forProvider:
                manifest:
                  {{- $job | toYaml | nindent 18 }}
            {{- end }}

            {{- range $obj := $objects }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              # Include kind in the Object name — multiple resources can share
              # metadata.name (e.g. memcached Deployment + Service).
              name: {{ $tenant }}-obj-{{ lower $obj.kind }}-{{ $obj.metadata.name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: obj-{{ lower $obj.kind }}-{{ $obj.metadata.name }}
            spec:
              providerConfigRef:
                name: kubernetes
              forProvider:
                manifest:
                  {{- $obj | toYaml | nindent 18 }}
            {{- end }}

            {{- range $app := dig "apps" list $spec }}
            ---
            apiVersion: gentianos.io/v1alpha1
            kind: App
            metadata:
              name: {{ $app.profile }}
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: app-{{ $app.profile }}
              labels:
                gentianos.io/tenant: {{ $tenant }}
                gentianos.io/app: {{ $app.profile }}
                gentianos.io/managed-by: crossplane
                app.kubernetes.io/managed-by: gentian-os
            spec:
              compositionUpdatePolicy: Automatic
              profileRef:
                name: {{ $app.profile }}
              tenantNamespace: {{ $ns }}
              domain: {{ $domain }}
              {{- if $app.variant }}
              compositionRef:
                name: app-{{ $app.variant }}
              {{- end }}
              {{- if or (dig "replicas" nil $app.config) (dig "extraValues" nil $app.config) }}
              config:
                {{- if dig "replicas" nil $app.config }}
                replicas: {{ dig "replicas" 1 $app.config }}
                {{- end }}
                {{- with dig "extraValues" nil $app.config }}
                extraValues:
                  {{- . | toYaml | nindent 18 }}
                {{- end }}
              {{- end }}
            {{- end }}

    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready

    - step: sequence-tenant-provisioning
      functionRef:
        name: function-sequencer
      input:
        apiVersion: sequencer.fn.crossplane.io/v1beta1
        kind: Input
        resetCompositeReadiness: true
        rules:
          # Tenant shell before kernel Jobs or app claims.
          - sequence:
            - namespace
            - limitrange
            - networkpolicy
            - vault-policy
          # Keycloak realm before other identity Jobs; identity before App Compositions.
          # job-keycloak-(admin|…)-.* deliberately excludes job-keycloak-realm-* —
          # realm matches both patterns if the broad job-keycloak-.* form is used.
          - sequence:
            - job-keycloak-realm-.*
            - job-keycloak-(admin|broker|client|kernel|ldap|oidc)-.*
          - sequence:
            - job-keycloak-(admin|broker|client|kernel|ldap|oidc)-.*
            - app-.*
          # LDAP OU before remaining LDAP Jobs; LDAP before App Compositions.
          # job-ldap-(admin|…)-.* excludes job-ldap-ou-* for the same reason.
          - sequence:
            - job-ldap-ou-.*
            - job-ldap-(admin|app|bind|mba|portal)-.*
          - sequence:
            - job-ldap-(admin|app|bind|mba|portal)-.*
            - app-.*
