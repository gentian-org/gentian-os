apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: tenant-default
  labels:
    gentianos.io/composition: tenant
spec:
  compositeTypeRef:
    apiVersion: gentianos.io/v1alpha1
    kind: XTenant
  mode: Pipeline
  pipeline:

    - step: fetch-cluster-config
      functionRef:
        name: function-extra-resources
      input:
        apiVersion: extra-resources.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          extraResources:
            - kind: ConfigMap
              into: clusterConfig
              apiVersion: v1
              type: Selector
              selector:
                maxMatch: 1
                minMatch: 0
                matchLabels:
                  - key: gentianos.io/config-type
                    type: Value
                    value: cluster-config
            - kind: ConfigMap
              into: provisioningJobs
              apiVersion: v1
              type: Selector
              selector:
                maxMatch: 1
                minMatch: 0
                matchLabels:
                  - key: gentianos.io/config-type
                    type: Value
                    value: tenant-provisioning-jobs
                  - key: gentianos.io/tenant
                    type: FromCompositeFieldPath
                    valueFromFieldPath: metadata.name

    # ── Step 2: Render composed resources (tenant shell owner) ────────────────
    - step: render-tenant-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr     := .observed.composite.resource }}
            {{- $spec   := $xr.spec }}
            {{- $tenant := $xr.metadata.name }}
            {{- $ns     := default (printf "tenant-%s" $tenant) (dig "isolation" "namespace" "" $spec) }}
            {{- $kd     := default "" $spec.kernelDomain }}
            {{- $domain := default (printf "%s.%s" $tenant $kd) (default "" $spec.domain) }}
            {{- $kvMount := "secret" }}
            {{- $extraRes := index .context "apiextensions.crossplane.io/extra-resources" }}
            {{- $ccList   := dig "clusterConfig" list $extraRes }}
            {{- $cc       := ternary (index $ccList 0) dict (gt (len $ccList) 0) }}
            {{- $ccData   := dig "data" dict $cc }}
            {{- $provList  := dig "provisioningJobs" list $extraRes }}
            {{- $provCM    := ternary (index $provList 0) dict (gt (len $provList) 0) }}
            {{- $jobsJSON  := dig "data" "jobs.json" "[]" $provCM }}
            {{- $jobs      := fromJson $jobsJSON }}
            {{- $objectsJSON := dig "data" "objects.json" "[]" $provCM }}
            {{- $objects     := fromJson $objectsJSON }}
            {{- /*
              network.routingMode and the three network.kubeApiServer* keys used
              to be read here and were never referenced again — assigned, then
              discarded. Removed rather than left as documentation of an intent
              that moved: the tenant NetworkPolicy is built by the operator, from
              KUBE_APISERVER_CIDR and loadKubeAPIEndpointSlice in
              tenant_network_policy.go, not from this ConfigMap.

              They mattered because they were the only apparent consumer of the
              three values the installer discovers from the live cluster, which
              made those look like they had to be observed through Crossplane
              before the ConfigMap could be composed. No Composition reads them.
            */}}
            {{- $quotas      := default dict (dig "quotas" dict $spec) }}
            {{- $lrDefaultCPU := dig "tenant.limitRange.default.cpu" "500m" $ccData }}
            {{- $lrDefaultMem := dig "tenant.limitRange.default.memory" "512Mi" $ccData }}
            {{- $lrRequestCPU := dig "tenant.limitRange.defaultRequest.cpu" "100m" $ccData }}
            {{- $lrRequestMem := dig "tenant.limitRange.defaultRequest.memory" "128Mi" $ccData }}

            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              name: {{ $tenant }}-namespace
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: namespace
            spec:
              providerConfigRef:
                name: kubernetes
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Namespace
                  metadata:
                    name: {{ $ns }}
                    labels:
                      gentianos.io/tenant: {{ $tenant }}
                      gentianos.io/managed-by: crossplane
                      app.kubernetes.io/managed-by: gentian-os

            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              name: {{ $tenant }}-limitrange
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: limitrange
            spec:
              providerConfigRef:
                name: kubernetes
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: LimitRange
                  metadata:
                    name: tenant-limits
                    namespace: {{ $ns }}
                    labels:
                      gentianos.io/tenant: {{ $tenant }}
                      app.kubernetes.io/managed-by: gentian-os
                  spec:
                    limits:
                      - type: Container
                        default:
                          cpu: {{ $lrDefaultCPU | quote }}
                          memory: {{ $lrDefaultMem | quote }}
                        defaultRequest:
                          cpu: {{ $lrRequestCPU | quote }}
                          memory: {{ $lrRequestMem | quote }}
                        max:
                          cpu: "4"
                          memory: 8Gi

            {{- if or $quotas.storage $quotas.cpu $quotas.memory }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              name: {{ $tenant }}-resourcequota
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: resourcequota
            spec:
              providerConfigRef:
                name: kubernetes
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ResourceQuota
                  metadata:
                    name: tenant-quota
                    namespace: {{ $ns }}
                    labels:
                      gentianos.io/tenant: {{ $tenant }}
                      app.kubernetes.io/managed-by: gentian-os
                  spec:
                    hard:
                      {{- if $quotas.storage }}
                      requests.storage: {{ $quotas.storage | quote }}
                      {{- end }}
                      {{- if $quotas.cpu }}
                      limits.cpu: {{ $quotas.cpu | quote }}
                      {{- end }}
                      {{- if $quotas.memory }}
                      limits.memory: {{ $quotas.memory | quote }}
                      {{- end }}
                      {{- if $quotas.maxPods }}
                      pods: {{ $quotas.maxPods | quote }}
                      {{- end }}
            {{- end }}


            ---
            apiVersion: vault.vault.upbound.io/v1alpha1
            kind: Policy
            metadata:
              name: {{ $tenant }}-tenant-policy
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: vault-policy
            spec:
              providerConfigRef:
                name: openbao
              forProvider:
                name: tenant-{{ $tenant }}
                policy: |
                  path "{{ $kvMount }}/data/gentian-os/tenants/{{ $tenant }}/*" {
                    capabilities = ["create", "read", "update", "delete", "list"]
                  }
                  path "{{ $kvMount }}/metadata/gentian-os/tenants/{{ $tenant }}/*" {
                    capabilities = ["list", "delete"]
                  }

            {{- range $job := $jobs }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              name: {{ $tenant }}-job-{{ $job.metadata.name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: job-{{ $job.metadata.name }}
            spec:
              providerConfigRef:
                name: kubernetes
              forProvider:
                manifest:
                  {{- $job | toYaml | nindent 18 }}
            {{- end }}

            {{- range $obj := $objects }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              # Include kind in the Object name — multiple resources can share
              # metadata.name (e.g. memcached Deployment + Service).
              name: {{ $tenant }}-obj-{{ lower $obj.kind }}-{{ $obj.metadata.name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: obj-{{ lower $obj.kind }}-{{ $obj.metadata.name }}
            spec:
              providerConfigRef:
                name: kubernetes
              forProvider:
                manifest:
                  {{- $obj | toYaml | nindent 18 }}
            {{- end }}

            {{- /*
            The portal's public OIDC client, declared rather than provisioned by a
            Job.

            external-name is the clientId, not Keycloak's internal UUID, which is
            what lets one template serve both cases: on a tenant whose client
            already exists the provider adopts it, and on a new tenant it creates
            it under that name. Verified by adopting the live gentian-portal
            client read-only — Ready, 45 fields observed — and confirming the
            client survived the probe's removal.

            The field values reproduce what the Job wrote. That matters more than
            it looks: an adopted resource is reconciled toward this spec, so a
            field omitted here is not left alone, it is reset. The redirect and
            origin lists below were read back from the live client rather than
            reconstructed from the Job's script.
            */}}
            ---
            apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
            kind: Client
            metadata:
              name: {{ $tenant }}-portal-public-client
              annotations:
                crossplane.io/external-name: gentian-portal
                gotemplating.fn.crossplane.io/composition-resource-name: keycloak-portal-public-client
            spec:
              deletionPolicy: Orphan
              forProvider:
                clientId: gentian-portal
                name: Gentian Portal
                realmId: {{ $tenant }}
                accessType: PUBLIC
                enabled: true
                standardFlowEnabled: true
                implicitFlowEnabled: false
                directAccessGrantsEnabled: false
                serviceAccountsEnabled: false
                fullScopeAllowed: true
                rootUrl: https://portal.{{ $kd }}
                baseUrl: /
                adminUrl: https://portal.{{ $kd }}
                validRedirectUris:
                  - https://{{ $domain }}/
                  - https://{{ $domain }}/*
                  - https://portal.{{ $kd }}/*
                  - https://portal.{{ $kd }}/login
                  - https://portal.{{ $kd }}/login/*
                webOrigins:
                  - "+"
                  - https://{{ $domain }}
                  - https://portal.{{ $kd }}
                validPostLogoutRedirectUris:
                  - https://{{ $domain }}/
                  - https://{{ $domain }}/*
                  - https://portal.{{ $kd }}/*
                  - https://portal.{{ $kd }}/login
              providerConfigRef:
                name: keycloak

            {{- range $app := dig "apps" list $spec }}
            ---
            apiVersion: gentianos.io/v1alpha1
            kind: App
            metadata:
              name: {{ $app.profile }}
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: app-{{ $app.profile }}
              labels:
                gentianos.io/tenant: {{ $tenant }}
                gentianos.io/app: {{ $app.profile }}
                gentianos.io/managed-by: crossplane
                app.kubernetes.io/managed-by: gentian-os
            spec:
              compositionUpdatePolicy: Automatic
              profileRef:
                name: {{ $app.profile }}
              tenantNamespace: {{ $ns }}
              domain: {{ $domain }}
              {{- if $app.variant }}
              compositionRef:
                name: app-{{ $app.variant }}
              {{- end }}
              {{- with dig "addons" list $app }}
              addons:
                {{- range . }}
                - {{ . | quote }}
                {{- end }}
              {{- end }}
              {{- $appConfig := default dict $app.config }}
              {{- if or (dig "replicas" nil $appConfig) (dig "extraValues" nil $appConfig) }}
              config:
                {{- if dig "replicas" nil $appConfig }}
                replicas: {{ dig "replicas" 1 $appConfig }}
                {{- end }}
                {{- with dig "extraValues" nil $appConfig }}
                extraValues:
                  {{- . | toYaml | nindent 18 }}
                {{- end }}
              {{- end }}
            {{- end }}

            {{- /* No implicit apps. open-webui used to be injected here whenever the
                 cluster served LLM — but an app the composition invents is an app
                 the tenant operator cannot see: it seeds OIDC credentials (and
                 builds identity Jobs and groups) from tenant.spec.apps alone, so
                 the injected app's ExternalSecrets waited forever on an OpenBao
                 path nothing would ever write. Tenant scaffolding lists open-webui
                 in spec.apps when the claim serves LLM; one list, every reader. */}}

    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready

    - step: sequence-tenant-provisioning
      functionRef:
        name: function-sequencer
      input:
        apiVersion: sequencer.fn.crossplane.io/v1beta1
        kind: Input
        resetCompositeReadiness: true
        rules:
          # Tenant shell before kernel Jobs or app claims.
          - sequence:
            - namespace
            - limitrange
            - networkpolicy
            - vault-policy
          # Keycloak realm before other identity Jobs; identity before App Compositions.
          # job-keycloak-(admin|…)-.* deliberately excludes job-keycloak-realm-* —
          # realm matches both patterns if the broad job-keycloak-.* form is used.
          - sequence:
            - job-keycloak-realm-.*
            - job-keycloak-(admin|broker|client|kernel|oidc)-.*
          - sequence:
            - job-keycloak-(admin|broker|client|kernel|oidc)-.*
            - app-.*
