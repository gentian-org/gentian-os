apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: infra-data
  labels:
    gentianos.io/composition: infra-data
spec:
  compositeTypeRef:
    apiVersion: gentianos.io/v1alpha1
    kind: XInfraData
  mode: Pipeline
  pipeline:
    - step: render-infra-data-releases
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $spec := $xr.spec }}
            {{- $name := $xr.metadata.name }}
            {{- $env := $spec.environment }}

            {{- $infraNs := default (printf "gentian-infra-%s" $env) $spec.infraNamespace }}
            {{- $chartRepo := default "https://raw.githubusercontent.com/gentian-org/gentian-os/develop/charts/infra/packages" $spec.chartRepository }}

            {{- $pgSpec := default dict $spec.postgresql }}
            {{- $pgRelease := default (printf "gentian-postgresql-%s" $env) $pgSpec.helmReleaseName }}
            {{- $pgVersion := default "2.1.2" $pgSpec.chartVersion }}

            {{- $mdbSpec := default dict $spec.mariadb }}
            {{- $mdbRelease := default (printf "gentian-mariadb-%s" $env) $mdbSpec.helmReleaseName }}
            {{- $mdbVersion := default "3.0.3" $mdbSpec.chartVersion }}

            {{- $redisSpec := default dict $spec.redis }}
            {{- $redisRelease := default (printf "redis-%s" $env) $redisSpec.helmReleaseName }}
            {{- $redisVersion := default "18.6.1" $redisSpec.chartVersion }}

            {{- $minioSpec := default dict $spec.minio }}
            {{- $minioRelease := default (printf "minio-%s" $env) $minioSpec.helmReleaseName }}
            {{- $minioVersion := default "16.0.10" $minioSpec.chartVersion }}

            {{- /* ── Shared kernel PostgreSQL (provider-helm Release) ─────────── */}}
            ---
            apiVersion: helm.crossplane.io/v1beta1
            kind: Release
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: postgresql-release
                crossplane.io/external-name: {{ $pgRelease }}
              name: {{ $name }}-postgresql
            spec:
              forProvider:
                chart:
                  name: postgresql
                  repository: {{ $chartRepo }}
                  version: {{ $pgVersion | quote }}
                namespace: {{ $infraNs }}
                wait: true
                # 5m was tight enough that a slow initdb (nfs-csi write
                # latency is not bounded the way local storage is) let the
                # StatefulSet itself come up while the post-install bootstrap
                # Job — which sets the passwords everything else connects
                # with — was still mid-run or never started, and Crossplane
                # marked the whole release failed regardless. The Job is
                # idempotent and safe to give more room; a release that
                # finishes in 90s on the common path costs nothing extra by
                # having a longer ceiling.
                waitTimeout: "20m"
                valuesFrom:
                  - configMapKeyRef:
                      name: postgresql-base-values
                      namespace: {{ $infraNs }}
                      key: values.yaml
                      optional: false
                  - configMapKeyRef:
                      name: postgresql-{{ $env }}-values
                      namespace: {{ $infraNs }}
                      key: values.yaml
                      optional: false
                  - secretKeyRef:
                      name: postgresql-sensitive-values
                      namespace: {{ $infraNs }}
                      key: sensitive-values.yaml
                      optional: false
              providerConfigRef:
                name: kubernetes

            {{- /* ── Shared kernel MariaDB (provider-helm Release) ──────────── */}}
            ---
            apiVersion: helm.crossplane.io/v1beta1
            kind: Release
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: mariadb-release
                crossplane.io/external-name: {{ $mdbRelease }}
              name: {{ $name }}-mariadb
            spec:
              forProvider:
                chart:
                  name: mariadb
                  repository: {{ $chartRepo }}
                  version: {{ $mdbVersion | quote }}
                namespace: {{ $infraNs }}
                wait: true
                # Same reasoning as postgresql's waitTimeout above: a slow
                # first start on nfs-csi let the server come up while its
                # own root-password bootstrap was still racing the release's
                # overall wait, so the readiness probe never agreed with the
                # password actually set.
                waitTimeout: "20m"
                valuesFrom:
                  - configMapKeyRef:
                      name: mariadb-base-values
                      namespace: {{ $infraNs }}
                      key: values.yaml
                      optional: false
                  - configMapKeyRef:
                      name: mariadb-{{ $env }}-values
                      namespace: {{ $infraNs }}
                      key: values.yaml
                      optional: false
                  - secretKeyRef:
                      name: mariadb-sensitive-values
                      namespace: {{ $infraNs }}
                      key: sensitive-values.yaml
                      optional: false
              providerConfigRef:
                name: kubernetes

            {{- /* ── Shared kernel Redis (provider-helm Release) ─────────────── */}}
            ---
            apiVersion: helm.crossplane.io/v1beta1
            kind: Release
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: redis-release
                crossplane.io/external-name: {{ $redisRelease }}
              name: {{ $name }}-redis
            spec:
              forProvider:
                chart:
                  name: redis
                  repository: {{ $chartRepo }}
                  version: {{ $redisVersion | quote }}
                namespace: {{ $infraNs }}
                wait: true
                waitTimeout: "5m"
                valuesFrom:
                  - configMapKeyRef:
                      name: redis-env-values
                      namespace: {{ $infraNs }}
                      key: values.yaml
                      optional: false
                  - configMapKeyRef:
                      name: redis-base-values
                      namespace: {{ $infraNs }}
                      key: values.yaml
                      optional: false
                  - configMapKeyRef:
                      name: redis-{{ $env }}-values
                      namespace: {{ $infraNs }}
                      key: values.yaml
                      optional: false
              providerConfigRef:
                name: kubernetes

            {{- /* ── Shared kernel MinIO (provider-helm Release) ────────────── */}}
            ---
            apiVersion: helm.crossplane.io/v1beta1
            kind: Release
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: minio-release
                crossplane.io/external-name: {{ $minioRelease }}
              name: {{ $name }}-minio
            spec:
              forProvider:
                chart:
                  name: minio
                  repository: {{ $chartRepo }}
                  version: {{ $minioVersion | quote }}
                namespace: {{ $infraNs }}
                wait: true
                waitTimeout: "5m"
                valuesFrom:
                  - configMapKeyRef:
                      name: minio-env-values
                      namespace: {{ $infraNs }}
                      key: values.yaml
                      optional: false
                  - configMapKeyRef:
                      name: minio-base-values
                      namespace: {{ $infraNs }}
                      key: values.yaml
                      optional: false
                  - configMapKeyRef:
                      name: minio-{{ $env }}-values
                      namespace: {{ $infraNs }}
                      key: values.yaml
                      optional: false
              providerConfigRef:
                name: kubernetes

    - step: auto-ready
      functionRef:
        name: function-auto-ready
