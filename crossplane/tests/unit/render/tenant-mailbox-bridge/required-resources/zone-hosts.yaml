# A vouching line carries a key, which is one word and longer than a line.
# yamllint disable rule:line-length
# What the operator projects from this tenant's components: the host labels
# they are served at, and the profiles among them that ask for an exchanged
# token (exposure exchangeToken).
#
# desktop and admin are what the base list already has, so the zone's client
# is what it was without this. exchangeProfiles is what this fixture is for:
# "notes" and "wiki" each get a client scope that names them as a token's
# audience, and no other profile gets one.
#
# vouchingProfiles is the components that vouch for people at the realm
# (requires.services.vouching), one line each: profile, "keys" for one that
# signs statements, 0, and the public half of the key the platform issued it.
# "scribe" has its key; "steward" signs and has none yet, so that an entry is
# made either way and only the first carries a key. Each gets an identity
# provider entry, a client and a Secret of the tenant's namespace, and both
# clients may ask for the two app scopes above.
# "warden" names no keys: it exchanges a present person's token and vouches
# for nobody, so it gets the client and the Secret and no identity provider
# entry.
# "steward" carries the word "mailbox": the tenant has a bridge that opens
# mailboxes, so its client may ask for the scope "mailbox" as well, and the
# two others' may not.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gentian-zone-hosts-render-fixture
  namespace: kernel-control
  labels:
    gentianos.io/config-type: zone-hosts
    gentianos.io/tenant: render-fixture
data:
  hosts: |
    admin
    desktop
  exchangeProfiles: |
    notes
    wiki
  vouchingProfiles: |
    scribe keys 0 eyJrZXlzIjpbeyJ1c2UiOiJzaWciLCJrdHkiOiJFQyIsImtpZCI6InNjcmliZS1rZXkiLCJjcnYiOiJQLTI1NiIsImFsZyI6IkVTMjU2IiwieCI6ImY4M09KM0QyeEYxQmc4dnViOXRMZTFnSE16Vjc2ZThUdXM5dVBIdlJWRVUiLCJ5IjoieF9GRXpSdTltMzZITE5fdHVlNjU5TE5wWFc2cEN5U3Rpa1lqS0lXSTVhMCJ9XX0=
    steward keys 0 - exchange,mailbox
    warden - 0 - exchange
