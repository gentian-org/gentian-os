# What the operator projects from this tenant's components: the host labels
# they are served at, and the profiles among them that ask for an exchanged
# token (exposure exchangeToken).
#
# desktop and admin are what the base list already has, so the zone's client
# is what it was without this. exchangeProfiles is what this fixture is for:
# "notes" and "wiki" each get a client scope that names them as a token's
# audience, and catalogue-test-app -- installed, on spec.apps, and not asking
# -- gets none.
#
# vouchingProfiles is the components that vouch for people at the realm
# (requires.services.vouching), one line each: profile, Service, port, path.
# "scribe" publishes its keys at the default path on a Service called what it
# is; "steward" on a Service of another name, another port and a path of its
# own, so that none of the four is taken from another. Each gets an identity
# provider entry, a client and a Secret of the tenant's namespace, and both
# clients may ask for the two app scopes above.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gentian-zone-hosts-render-fixture
  namespace: kernel-control
  labels:
    gentianos.io/config-type: zone-hosts
    gentianos.io/tenant: render-fixture
data:
  hosts: |
    admin
    desktop
  exchangeProfiles: |
    notes
    wiki
  vouchingProfiles: |
    scribe scribe 8080 /.well-known/jwks.json
    steward steward-keys 8443 /keys/current.json
