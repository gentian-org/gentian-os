# A probe that read the credential once and cannot read it now: the vault or
# the API is down. What was delivered stays, or one outage takes the credential
# the cluster reads its own repository with.
#
# Compare repository-oci, whose requirement was never met and delivers nothing.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: credreq-repository-deployments
  namespace: kernel-control
  labels:
    gentianos.io/credential-requirement: deployments-m288c
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    creationPolicy: None
status:
  conditions:
    - type: Ready
      status: "False"
      reason: SecretSyncedError
  refreshTime: "2026-10-30T23:04:19Z"
