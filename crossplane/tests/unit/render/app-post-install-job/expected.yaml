      valueFrom:
        secretKeyRef:
          key: oidc-client-secret
          name: demo-app-sensitive-values
          namespace: tenant-demo
    skipCRDs: true
    values:
      global:
        imagePullSecrets:
        - registry-credentials
      imagePullSecrets:
      - registry-credentials
      podLabels:
        gentianos.io/app: demo-app
        gentianos.io/tenant: demo
    wait: false
  providerConfigRef:
