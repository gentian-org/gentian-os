    controller: true
    kind: XApp
    name: render-demo-app-fixture
    uid: ""
spec:
  forProvider:
    manifest:
      apiVersion: v1
      data:
        run.sh: |
          #!/bin/sh
          set -eu
          echo "bootstrapping ${APP}"
          # APP and NAMESPACE above are the container's own shell variables and
          # must survive untouched. The tenant-domain token on the next line is the
          # platform's, and must be substituted before this reaches the ConfigMap.
          echo "tenant domain is demo.platform.example.test"
          curl -sf "http://demo-app.${NAMESPACE}.svc.cluster.local/health"
      kind: ConfigMap
      metadata:
        name: demo-app-post-install
        namespace: tenant-demo
  providerConfigRef:
    name: kubernetes
---
apiVersion: kubernetes.crossplane.io/v1alpha2
kind: Object
metadata:
  annotations:
    crossplane.io/composition-resource-name: demo-app-post-install-job
  labels:
    crossplane.io/composite: render-demo-app-fixture
  name: render-demo-app-fixture-post-install-job
  ownerReferences:
  - apiVersion: gentianos.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: XApp
    name: render-demo-app-fixture
    uid: ""
spec:
  forProvider:
    manifest:
      apiVersion: batch/v1
      kind: Job
      metadata:
        labels:
          app.kubernetes.io/managed-by: gentian-os
          gentianos.io/app: demo-app
          gentianos.io/tenant: demo
        name: demo-app-post-install
        namespace: tenant-demo
      spec:
        backoffLimit: 10
        template:
          metadata:
            labels:
              app.kubernetes.io/managed-by: gentian-os
              gentianos.io/app: demo-app
              gentianos.io/component: post-install
              gentianos.io/tenant: demo
          spec:
            containers:
            - command:
              - /bin/sh
              - /scripts/run.sh
              env:
              - name: OIDC_CLIENT_SECRET
                valueFrom:
                  secretKeyRef:
                    key: oidc-client-secret
                    name: demo-app-sensitive-values
              envFrom:
              - secretRef:
                  name: llm-credentials-demo-app
              - secretRef:
                  name: demo-app-sensitive-values
              image: curlimages/curl:8.10.1
              name: post-install
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
              - mountPath: /scripts
                name: scripts
              - mountPath: /data
                name: readonly-data
                readOnly: true
            restartPolicy: OnFailure
            securityContext:
              seccompProfile:
                type: RuntimeDefault
            serviceAccountName: app-init
            volumes:
            - configMap:
                name: demo-app-post-install
              name: scripts
            - name: readonly-data
              persistentVolumeClaim:
                claimName: demo-app-data
                readOnly: true
        ttlSecondsAfterFinished: 600
  providerConfigRef:
    name: kubernetes
