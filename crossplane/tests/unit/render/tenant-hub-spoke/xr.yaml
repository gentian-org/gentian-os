apiVersion: gentianos.io/v1alpha1
kind: XTenant
metadata:
  name: render-fixture
  annotations:
    crossplane.io/external-name: render-fixture
spec:
  displayName: Render Fixture
  adminEmail: admin-render@example.test
  # One of this tenant's administrators holds a platform role through the
  # kernel realm's hub (the operator projects it from the Cluster claim): the
  # realm composes the client broker-to-platform, the role platform-brokered
  # on its admins group, and the flow gentian-hub-broker the client signs
  # people in with.
  hubSpoke: true
  # And the tenant lets the platform's administrators enter it
  # (Tenant spec.platformAccess.adminsEnter): the identity provider "kernel",
  # for members of gentian:platform:admin only, mapped into the admins group.
  kernelBroker: true
  kernelDomain: platform.example.test
  apps:
    - name: catalogue-test-app
      profile: catalogue-test-app
  # Every field of TenantQuotas, set so the ResourceQuota is rendered and every
  # key of it compared. Without quotas the Composition skips that Object
  # entirely and the mapping from plan quantities to quota keys goes untested.
  #
  # Completeness is the point, and it is enforced:
  # TestRenderFixtureExercisesTheRealQuotas fails when a field of TenantQuotas is
  # missing here. This fixture writes an XR directly and so skips both hops the
  # real path takes — Tenant -> XTenant projection, then the XRD's structural
  # schema — which is how it went on rendering requests.cpu correctly while the
  # real path pruned it and tenants on a plan got none of the reserved capacity
  # they were sold.
  # Every field of TenantSecurity, so the password-policy string the
  # composition assembles is rendered and compared. That string is the part
  # that breaks silently: a realm accepts a policy it does not understand by
  # ignoring it, so a typo costs the policy rather than the install.
  security:
    password:
      minLength: 12
      requireDigits: true
      requireLowercase: true
      requireUppercase: true
      requireSpecialChars: true
      historyCount: 3
      maxAgeDays: 90
    session:
      idleMinutes: 30
      maxHours: 12
      rememberMe: true
    bruteForce:
      enabled: true
      maxLoginFailures: 5
      lockoutDurationSeconds: 900
  # The realm's mail server as the operator states it on a cluster that runs
  # its own mail: the login minted for this realm, its password by reference.
  realmMail:
    host: mail.platform.example.test
    port: "587"
    from: noreply@platform.example.test
    username: noreply@render-fixture.platform.example.test
    ssl: false
    starttls: true
    passwordSecretRef:
      name: mail-submission-render-fixture
      key: smtp_password
  quotas:
    requestsCpu: "2"
    requestsMemory: 4Gi
    cpu: "8"
    memory: 8Gi
    storage: 50Gi
    maxApps: 10
    maxPods: 100
  compositeDeletePolicy: Background
  resourceRefs: []
