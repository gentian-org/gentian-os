# The spoke's and the kernel provider's resources, marked Ready so
# function-sequencer emits the ones ordered after them: the group's role after
# the role, the subflows after the flow, the executions after the subflows,
# their settings after them, the client after everything it binds, its mapper
# after the client; the kernel provider after its Secret, its mapper after the
# provider. Without this the
# render shows the first of each sequence alone. The flow and the gate's
# executions carry the id the provider observed, which their settings and
# the client are composed from.
