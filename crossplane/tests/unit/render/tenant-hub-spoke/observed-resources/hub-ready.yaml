# The spoke's and the kernel provider's resources, marked Ready so
# function-sequencer emits the ones ordered after them: the group's role after
# the role, the subflows after the flow, the executions after the subflows,
# their settings after them, the client after everything it binds; the kernel
# provider after its Secret, its mapper after the provider. Without this the
# render shows the first of each sequence alone.
