# What the Cluster Composition publishes about this cluster's layout. The
# Repository Composition reads kernel.controlNamespace from here rather than
# spelling a kernel namespace itself.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gentian-cluster-config
  namespace: kernel-provisioning
  labels:
    gentianos.io/config-type: cluster-config
data:
  kernel.controlNamespace: kernel-control
  # Where Argo CD runs. Without it the repository Secret and the catalogue
  # ApplicationSet land in "argocd", which does not exist on v5, and Argo CD
  # sees neither.
  kernel.gitopsNamespace: kernel-gitops
  kernel.layout: v5
