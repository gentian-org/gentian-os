apiVersion: v1
kind: ConfigMap
metadata:
  name: gentian-kernel-services
  namespace: gentian-system
  labels:
    gentianos.io/config-type: kernel-services
data:
  # Staging CA is what makes the platform mount a trust bundle into the app.
  ACME_STAGING: "true"
  KERNEL_DOMAIN: desk.gentian.org
  S3_ENDPOINT: https://s3.example.invalid
  MYSQL_HOST: mysql.example.invalid
