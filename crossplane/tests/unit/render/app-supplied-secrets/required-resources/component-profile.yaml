apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  annotations:
    # Exercises the group-attribute path: nine catalogue profiles carry
    # this, and the Odoo ones name the modules the app provisions from.
    # A list stays a list; a bare string becomes a one-element list, the
    # way collectGentianGroupsJSON normalises it.
    gentianos.io/keycloak-group-attributes: '{"gentianOdooModules":["account","crm"],"gentianSingle":"one"}'
  name: demo-app
  labels:
    gentianos.io/profile-name: demo-app
spec:
  classes:
    - app
  launch: none
  trustTier: certified
  version: "1.0.0"
  package:
    chart:
      repository: oci://example.invalid/demo-app
      name: demo-app
      version: "1.0.0"
    valueMapping:
      oidc:
        clientSecretKey: demo-app.oidc.secret
  requires:
    services:
      identity:
        oidc:
          clientId: catalogue-test-client
          name: Demo App
          accessType: CONFIDENTIAL
          redirectUris:
            - "https://demo.${TENANT_DOMAIN}/oidc/callback"
          postLogoutRedirectUris:
            - "https://demo.${TENANT_DOMAIN}/"
  secrets:
    # A credential only a person can provide: the composition must ask for
    # it (a CredentialRequirement of the tenant and its probe) and read it
    # from where the custodian stores it, into the same Secret and Release
    # values a generated secret goes to. One field public, so the golden
    # covers both renderings of a form field.
    supplied:
      - name: payments
        displayName: Payment provider keys
        description: Issued by the payment provider's dashboard.
        fields:
          - key: secret_key
            valuePath: demo-app.payments.secretKey
            format: token
          - key: publishable_key
            valuePath: demo-app.payments.publishableKey
            public: true
            example: pk_test_123
