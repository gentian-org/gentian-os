---
apiVersion: gentianos.io/v1alpha1
kind: XRepository
metadata:
  name: deployments
status:
  artefacts:
  - credreq-deployments
  - credprobe-deployments
  conditions:
  - lastTransitionTime: "2024-01-01T00:00:00Z"
    message: 'Unready resources: credprobe-deployments, credreq-deployments'
    reason: Creating
    status: "False"
    type: Ready
  credentialMessage: 'requirement deployments is unsatisfied: no value at gentian/repositories/deployments.
    Supply it through the credential manager, or with the installer for phase: bootstrap.'
  credentialSatisfied: false
---
apiVersion: kubernetes.crossplane.io/v1alpha2
kind: Object
metadata:
  annotations:
    crossplane.io/composition-resource-name: credprobe-deployments
  generateName: deployments-
  labels:
    crossplane.io/composite: deployments
  ownerReferences:
  - apiVersion: gentianos.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: XRepository
    name: deployments
    uid: ""
spec:
  forProvider:
    manifest:
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        labels:
          gentianos.io/credential-requirement: deployments
        name: credreq-repository-deployments
        namespace: gentian-system
      spec:
        data:
        - remoteRef:
            key: gentian/repositories/deployments
            property: username
          secretKey: username
        - remoteRef:
            key: gentian/repositories/deployments
            property: password
          secretKey: password
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: openbao
        target:
          creationPolicy: None
  providerConfigRef:
    name: kubernetes
---
apiVersion: gentianos.io/v1alpha1
kind: CredentialRequirement
metadata:
  annotations:
    crossplane.io/composition-resource-name: credreq-deployments
  labels:
    crossplane.io/composite: deployments
    gentianos.io/credential-phase: bootstrap
    gentianos.io/credential-scope: cluster
  name: repository-deployments
  ownerReferences:
  - apiVersion: gentianos.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: XRepository
    name: deployments
    uid: ""
spec:
  consumedBy:
  - kind: XRepository
    name: deployments
  description: ""
  displayName: Deployments Repository Access
  fields:
  - format: string
    key: username
    secret: false
  - format: password
    key: password
    secret: true
  optional: false
  phase: bootstrap
  scope: cluster
  validate:
    type: git-https
  vaultPath: gentian/repositories/deployments
