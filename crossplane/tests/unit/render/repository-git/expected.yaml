---
apiVersion: gentianos.io/v1alpha1
kind: XRepository
metadata:
  name: deployments
status:
  conditions:
  - lastTransitionTime: "2024-01-01T00:00:00Z"
    message: 'Unready resources: appproject-source-deployments, argocd-repo-deployments,
      credreq-deployments, and 1 more'
    reason: Creating
    status: "False"
    type: Ready
---
apiVersion: kubernetes.crossplane.io/v1alpha2
kind: Object
metadata:
  annotations:
    crossplane.io/composition-resource-name: appproject-source-deployments
  generateName: deployments-
  labels:
    crossplane.io/composite: deployments
  ownerReferences:
  - apiVersion: gentianos.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: XRepository
    name: deployments
    uid: ""
spec:
  forProvider:
    manifest:
      apiVersion: argoproj.io/v1alpha1
      kind: AppProject
      metadata:
        name: gentianos-tenants
        namespace: argocd
      spec:
        sourceRepos:
        - https://git.internal.example/gentian-deployments
  managementPolicies:
  - Observe
  - Create
  - Update
  providerConfigRef:
    name: kubernetes
---
apiVersion: kubernetes.crossplane.io/v1alpha2
kind: Object
metadata:
  annotations:
    crossplane.io/composition-resource-name: argocd-repo-deployments
  generateName: deployments-
  labels:
    crossplane.io/composite: deployments
  ownerReferences:
  - apiVersion: gentianos.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: XRepository
    name: deployments
    uid: ""
spec:
  forProvider:
    manifest:
      apiVersion: external-secrets.io/v1beta1
      kind: ExternalSecret
      metadata:
        name: repo-deployments
        namespace: argocd
      spec:
        data:
        - remoteRef:
            key: gentian/repositories/deployments
            property: username
          secretKey: username
        - remoteRef:
            key: gentian/repositories/deployments
            property: password
          secretKey: password
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: openbao
        target:
          name: repo-deployments
          template:
            data:
              password: '{{ .password }}'
              type: git
              url: https://git.internal.example/gentian-deployments
              username: '{{ .username }}'
            metadata:
              labels:
                argocd.argoproj.io/secret-type: repository
  providerConfigRef:
    name: kubernetes
---
apiVersion: gentianos.io/v1alpha1
kind: CredentialRequirement
metadata:
  annotations:
    crossplane.io/composition-resource-name: credreq-deployments
  labels:
    crossplane.io/composite: deployments
    gentianos.io/credential-phase: bootstrap
    gentianos.io/credential-scope: cluster
  name: repository-deployments
  ownerReferences:
  - apiVersion: gentianos.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: XRepository
    name: deployments
    uid: ""
spec:
  consumedBy:
  - kind: XRepository
    name: deployments
  description: ""
  displayName: Deployments Repository Access
  fields:
  - format: string
    key: username
    secret: false
  - format: password
    key: password
    secret: true
  optional: false
  phase: bootstrap
  scope: cluster
  validate:
    type: git-https
  vaultPath: gentian/repositories/deployments
---
apiVersion: kubernetes.crossplane.io/v1alpha2
kind: Object
metadata:
  annotations:
    crossplane.io/composition-resource-name: git-credentials-deployments
  generateName: deployments-
  labels:
    crossplane.io/composite: deployments
  ownerReferences:
  - apiVersion: gentianos.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: XRepository
    name: deployments
    uid: ""
spec:
  forProvider:
    manifest:
      apiVersion: external-secrets.io/v1beta1
      kind: ExternalSecret
      metadata:
        name: deployments-git-credentials
        namespace: gentian-system
      spec:
        data:
        - remoteRef:
            key: gentian/repositories/deployments
            property: username
          secretKey: username
        - remoteRef:
            key: gentian/repositories/deployments
            property: password
          secretKey: password
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: openbao
        target:
          name: deployments-git-credentials
          template:
            data:
              .git-credentials: |
                https://{{ .username }}:{{ .password }}@git.internal.example/gentian-deployments
  providerConfigRef:
    name: kubernetes
