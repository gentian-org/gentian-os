# A private Git repository the operator also pushes to, with the install host
# reaching it at a different address than in-cluster pods do.
apiVersion: gentianos.io/v1alpha1
kind: XRepository
metadata:
  # A generated suffix, as a real composite has. The git-credentials Secret must
  # still come out as deployments-git-credentials: a chart value has to name it,
  # and nothing can write "deployments-m288c" ahead of time. Every other composed
  # name here carries the suffix, which is the point of testing both at once.
  name: deployments-m288c
  labels:
    crossplane.io/claim-name: deployments
    crossplane.io/claim-namespace: crossplane-system
spec:
  type: git
  role: deployments
  endpoints:
    inCluster: https://git.internal.example/gentian-deployments
    external: https://10.0.0.5:8443/gentian-deployments
  branch: main
  writable: true
  credential:
    vaultPath: gentian/repositories/deployments
    displayName: "Deployments Repository Access"
    phase: bootstrap
    validate:
      type: git-https
