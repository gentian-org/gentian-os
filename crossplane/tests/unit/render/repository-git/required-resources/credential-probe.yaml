# The satisfied credential probe.
#
# Everything a repository actually produces — the ArgoCD repository Secret, the
# operator's .git-credentials, the OCI pull secret — is gated on this being
# Ready, because an artefact built from a credential that does not exist yet is
# a Secret full of empty strings. Without this file the fixture renders three
# resources and the gate is never crossed, so the majority of the Composition
# has no test at all.
#
# Ready=True is the whole point of the file: the unsatisfied path is already
# covered by repository-oci, which supplies no probe.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: credreq-repository-deployments
  namespace: gentian-system
  labels:
    gentianos.io/credential-requirement: deployments-m288c
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    creationPolicy: None
status:
  conditions:
    - type: Ready
      status: "True"
      reason: SecretSynced
