apiVersion: gentianos.io/v1alpha1
kind: AppProfile
metadata:
  name: demo-app
  labels:
    gentianos.io/profile-name: demo-app
spec:
  displayName: Demo App
  compositionRef: app-demo-app
  chart:
    repository: oci://example.invalid/demo-app
    name: demo-app
    version: "1.0.0"
  kernelRequirements:
    identity:
      oidc:
        clientId: catalogue-test-client
        name: Demo App
        accessType: CONFIDENTIAL
        redirectUris:
          - "https://demo.${TENANT_DOMAIN}/oidc/callback"
        postLogoutRedirectUris:
          - "https://demo.${TENANT_DOMAIN}/"
  extraValues:
    # The app already uses this hook — activation must append, not replace.
    nextcloud:
      hooks:
        before-starting: |
          #!/bin/bash
          echo "app's own setup: install portal bridge, hide header"
  customization:
    # Overlay fires only when the addon is selected. The fixture selects
    # calendar+mail, so "sidecarthing" must stay absent from the rendered values.
    addonValues:
      - whenAddon: mail
        values:
          demoSubchart:
            enabled: true
      - whenAddon: sidecarthing
        values:
          neverRendered:
            enabled: true
    # Mirrors nextcloud-base-ce: the recipe lives with the app, the platform only
    # renders it. __GENTIAN_ADDON_IDS__ is replaced with the space-separated
    # selection. ${TENANT_NAMESPACE}/${TENANT_DOMAIN} exercise the same
    # substitution extraValues gets — a live regression (TENANT_NAMESPACE:
    # unbound variable, nextcloud crashlooping) shipped because this fixture
    # didn't cover a script actually using them.
    addonActivation:
      valuesPath: nextcloud.hooks.before-starting
      script: |
        #!/bin/sh
        set -eu
        SELECTED="__GENTIAN_ADDON_IDS__"
        COLLABORA="http://nextcloud-collabora.${TENANT_NAMESPACE}.svc.cluster.local:9980"
        PUBLIC="https://collabora.${TENANT_DOMAIN}"
        for id in $SELECTED; do
          php /var/www/html/occ app:enable "$id" || true
        done
  valueMapping:
    oidc:
      clientSecretKey: demo-app.oidc.secret
