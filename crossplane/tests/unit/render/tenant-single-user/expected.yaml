  annotations:
    crossplane.io/composition-resource-name: keycloak-user-profile
    crossplane.io/external-name: user
  labels:
    crossplane.io/composite: user
  name: user-user-profile
  ownerReferences:
  - apiVersion: gentianos.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: XTenant
    name: user
    uid: ""
spec:
  deletionPolicy: Orphan
  forProvider:
    attribute:
    - displayName: ${username}
      multiValued: false
      name: username
      permissions:
      - edit:
        - admin
        - user
        view:
        - admin
        - user
      validator:
      - config:
          max: "255"
          min: "3"
        name: length
      - name: username-prohibited-characters
      - name: up-username-not-idn-homograph
    - displayName: ${email}
      multiValued: false
      name: email
      permissions:
      - edit:
        - admin
        - user
        view:
        - admin
        - user
      requiredForRoles:
      - user
      validator:
      - name: email
      - config:
          max: "255"
        name: length
    - displayName: ${firstName}
      multiValued: false
      name: firstName
      permissions:
      - edit:
        - admin
        - user
        view:
        - admin
        - user
      validator:
      - config:
          max: "255"
        name: length
      - name: person-name-prohibited-characters
    - displayName: ${lastName}
      multiValued: false
      name: lastName
      permissions:
      - edit:
        - admin
        - user
        view:
        - admin
        - user
      validator:
      - config:
          max: "255"
        name: length
      - name: person-name-prohibited-characters
    - displayName: Recovery email
      multiValued: false
      name: gentian.inviteEmail
      permissions:
      - edit:
        - admin
        view:
        - admin
      validator:
      - name: email
      - config:
          max: "255"
        name: length
    - displayName: User ID
