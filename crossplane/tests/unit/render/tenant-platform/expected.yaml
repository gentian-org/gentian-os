    crossplane.io/composition-resource-name: limitrange
  labels:
    crossplane.io/composite: platform
  name: platform-limitrange
  ownerReferences:
  - apiVersion: gentianos.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: XTenant
    name: platform
    uid: ""
spec:
  forProvider:
    manifest:
      apiVersion: v1
      kind: LimitRange
      metadata:
        labels:
          app.kubernetes.io/managed-by: gentian-os
          gentianos.io/tenant: platform
        name: tenant-limits
        namespace: tenant-platform
