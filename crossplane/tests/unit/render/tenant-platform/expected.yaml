    blockOwnerDeletion: true
    controller: true
    kind: XTenant
    name: platform
    uid: ""
spec:
  forProvider:
    name: tenant-platform
    policy: |
      path "secret/data/gentian-os/tenants/platform/*" {
        capabilities = ["create", "read", "update", "delete", "list"]
      }
      path "secret/metadata/gentian-os/tenants/platform/*" {
        capabilities = ["list", "delete"]
      }
  providerConfigRef:
    name: openbao
