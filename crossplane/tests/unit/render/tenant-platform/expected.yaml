---
apiVersion: vault.vault.upbound.io/v1alpha1
kind: Policy
metadata:
  annotations:
    crossplane.io/composition-resource-name: vault-policy
  labels:
    crossplane.io/composite: platform
  name: platform-tenant-policy
  ownerReferences:
  - apiVersion: gentianos.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: XTenant
    name: platform
    uid: ""
spec:
  forProvider:
    name: tenant-platform
    policy: |
      path "secret/data/gentian-os/tenants/platform/*" {
        capabilities = ["create", "read", "update", "delete", "list"]
      }
      path "secret/metadata/gentian-os/tenants/platform/*" {
        capabilities = ["list", "delete"]
      }
  providerConfigRef:
    name: openbao
