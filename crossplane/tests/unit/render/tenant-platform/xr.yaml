# Tenant/platform: the platform is a tenant whose realm is the kernel realm
# (AD-10). What this must render is a tenant shell — namespace, limits,
# quota, its entitlement groups in the KERNEL realm — and what it must not
# render is any realm state or realm bridge: no Realm, no broker client, no
# IdP, no flow, no mapper. The kernel realm is adopted, never composed.
#
# What it does render in that realm is what belongs to the tenant and its
# components there: the zone's clients, and for a component that vouches for
# people (see required-resources/zone-hosts.yaml) the identity provider entry
# that makes that component an issuer. That one is not the broker to another
# realm the sentence above rules out.
apiVersion: gentianos.io/v1alpha1
kind: XTenant
metadata:
  name: platform
  annotations:
    crossplane.io/external-name: platform
spec:
  displayName: Platform
  adminEmail: admin@platform.platform.example.test
  kernelDomain: platform.example.test
  isolation:
    keycloakRealm: kernel
    databasePrefix: platform_
    s3Prefix: platform-
  deletionPolicy: Retain
  # The kernel realm's hub, as the operator projects it from the Cluster
  # claim: one tenant two of whose administrators are security officers, and
  # a second whose name is not a label, which composes nothing; one tenant
  # that lets the platform's administrators enter. The second factor is the
  # default, so each provider names the post-login flow.
  hub:
    secondFactor: required
    securityGroup: gentian:platform:security
    spokes:
      - tenant: acme
        realm: acme
        displayName: Acme AG
        holders:
          - subject: 7d0f3c2e-5b1a-4e9c-9f1e-2a3b4c5d6e7f
            username: it@acme.example
            email: it@acme.example
          - subject: 0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
            username: ciso@acme.example
      - tenant: Not_A_Label
        realm: x
        displayName: X
        holders:
          - subject: 1111
            username: x@x.example
    enter:
      - tenant: acme
        realm: acme
      - tenant: Not_A_Label
        realm: x
  apps: []
  quotas:
    requestsCpu: "4"
    requestsMemory: 16Gi
    cpu: "16"
    memory: 32Gi
    storage: 50Gi
    maxApps: 20
  compositeDeletePolicy: Background
  resourceRefs: []
