apiVersion: policy.vault.upbound.io/v1alpha1
kind: Policy
metadata:
  annotations:
    crossplane.io/composition-resource-name: vault-policy-crossplane-write
  labels:
    crossplane.io/composite: dev-cluster
  name: dev-cluster-policy-crossplane-write
  ownerReferences:
  - apiVersion: gentianos.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: XCluster
    name: dev-cluster
    uid: ""
spec:
  forProvider:
    name: crossplane-write
    policy: |
      path "secret/data/gentian-os/*" {
        capabilities = ["create", "read", "update", "delete"]
      }
      path "secret/metadata/gentian-os/*" {
        capabilities = ["list", "read", "delete"]
      }
      path "auth/token/create" {
        capabilities = ["update"]
      }
      path "auth/token/lookup-self" {
        capabilities = ["read"]
      }
  providerConfigRef:
    name: openbao
