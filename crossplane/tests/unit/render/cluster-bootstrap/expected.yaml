apiVersion: kubernetes.crossplane.io/v1alpha2
kind: Object
metadata:
  annotations:
    crossplane.io/composition-resource-name: argocd-appproject-tenants
  labels:
    crossplane.io/composite: dev-cluster
  name: dev-cluster-appproject-tenants
  ownerReferences:
  - apiVersion: gentianos.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: XCluster
    name: dev-cluster
    uid: ""
spec:
  forProvider:
    manifest:
      apiVersion: argoproj.io/v1alpha1
      kind: AppProject
      metadata:
        name: gentianos-tenants
        namespace: argocd
      spec:
        clusterResourceWhitelist:
        - group: ""
          kind: Namespace
        - group: cert-manager.io
          kind: ClusterIssuer
        description: Gentian OS — tenant workloads managed by Crossplane
        destinations:
        - namespace: tenant-*
          server: https://kubernetes.default.svc
        - namespace: argocd
          server: https://kubernetes.default.svc
        sourceRepos:
        - https://github.com/gentian-org/gentian-os
        - https://github.com/gentian-org/gentian-apps
        - https://github.com/gentian-org/gentian-deployments
  providerConfigRef:
    name: kubernetes
---
apiVersion: kubernetes.crossplane.io/v1alpha2
kind: Object
metadata:
  annotations:
    crossplane.io/composition-resource-name: cert-issuer-http01
  labels:
    crossplane.io/composite: dev-cluster
  name: dev-cluster-cluster-issuer-http01
  ownerReferences:
  - apiVersion: gentianos.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: XCluster
    name: dev-cluster
    uid: ""
spec:
  forProvider:
    manifest:
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: letsencrypt-http01
      spec:
        acme:
          email: admin@desk.gentian.org
          privateKeySecretRef:
            name: letsencrypt-http01-account-key
          server: https://acme-v02.api.letsencrypt.org/directory
          solvers:
          - http01:
              gatewayHTTPRoute:
                parentRefs:
                - group: gateway.networking.k8s.io
                  kind: Gateway
                  name: kernel-public-gateway
                  namespace: gentian-dev
  providerConfigRef:
    name: kubernetes
---
apiVersion: kubernetes.crossplane.io/v1alpha2
kind: Object
metadata:
  annotations:
    crossplane.io/composition-resource-name: eso-cluster-secret-store
  labels:
    crossplane.io/composite: dev-cluster
  name: dev-cluster-cluster-secret-store
  ownerReferences:
  - apiVersion: gentianos.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: XCluster
    name: dev-cluster
    uid: ""
spec:
  forProvider:
    manifest:
      apiVersion: external-secrets.io/v1
      kind: ClusterSecretStore
      metadata:
        name: openbao
      spec:
        provider:
          vault:
            auth:
              kubernetes:
                mountPath: kubernetes
                role: eso
                serviceAccountRef:
                  name: external-secrets
                  namespace: external-secrets
            caProvider:
              key: tls.crt
              name: openbao-tls
              namespace: openbao
              type: Secret
            path: secret
            server: https://openbao.openbao.svc.cluster.local:8200
            version: v2
  providerConfigRef:
    name: kubernetes
---
