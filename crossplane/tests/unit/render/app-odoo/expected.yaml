apiVersion: kubernetes.crossplane.io/v1alpha2
kind: Object
metadata:
  annotations:
    crossplane.io/composition-resource-name: odoo-cb-addons-job
  labels:
    crossplane.io/composite: render-odoo-fixture
  name: render-odoo-fixture-addons-job
  ownerReferences:
  - apiVersion: gentianos.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: XApp
    name: render-odoo-fixture
    uid: ""
spec:
  forProvider:
    manifest:
      apiVersion: batch/v1
      kind: Job
      metadata:
        labels:
          app.kubernetes.io/managed-by: gentian-os
          gentianos.io/app: odoo-cb
          gentianos.io/component: odoo-addons
          gentianos.io/tenant: demo
        name: odoo-addons-02c78f7d99
        namespace: tenant-demo
      spec:
        backoffLimit: 10
        template:
          metadata:
            labels:
              app.kubernetes.io/managed-by: gentian-os
              gentianos.io/app: odoo-cb
              gentianos.io/component: odoo-addons
              gentianos.io/tenant: demo
          spec:
            containers:
            - command:
              - /bin/sh
              - -ec
              - |
                python3 /opt/odoo/src/odoo/odoo-bin \
                  -d "${DB_NAME}" \
                  --db_host="${DB_HOST}" \
                  --db_port="${DB_PORT}" \
                  --db_user="${DB_USER}" \
                  --db_password="${DB_PASSWORD}" \
                  --config=/etc/odoo/odoo.conf \
                  -i "gentian_os" \
                  --without-demo=all \
                  --stop-after-init
              env:
              - name: DB_HOST
                valueFrom:
                  secretKeyRef:
                    key: db-host
                    name: odoo-cb-sensitive-values
              - name: DB_PORT
                valueFrom:
                  secretKeyRef:
                    key: db-port
                    name: odoo-cb-sensitive-values
              - name: DB_USER
                valueFrom:
                  secretKeyRef:
                    key: db-user
                    name: odoo-cb-sensitive-values
              - name: DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    key: db-password
                    name: odoo-cb-sensitive-values
              - name: DB_NAME
                valueFrom:
                  secretKeyRef:
                    key: db-name
                    name: odoo-cb-sensitive-values
              image: ghcr.io/gentian-org/ocb:latest
              name: odoo-addons
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
              - mountPath: /etc/odoo
                name: odoo-config
              - mountPath: /opt/odoo/data
                name: odoo-data
              - mountPath: /opt/odoo/custom-addons
                name: extra-addons
            initContainers:
            - command:
              - sh
              - -c
              - |
                until pg_isready -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER"; do
                  echo "waiting for postgres..."
                  sleep 2
                done
                until nc -z odoo 8069; do
                  echo "waiting for base odoo service..."
                  sleep 2
                done
                # gentian_os is synced into custom-addons by the
                # git-modules sidecar. Installing before it lands fails
                # with "module not found", and the Job would burn its
                # backoff budget racing the clone. Wait for it instead,
                # bounded so a broken sidecar surfaces as a clear timeout
                # rather than an install error that hides the real cause.
                i=0
                until [ -d /opt/odoo/custom-addons/gentian_os ]; do
                  i=$((i+5))
                  if [ $i -ge 300 ]; then
                    echo "gentian_os not present after 5m — is the git-modules sidecar running?" >&2
                    exit 1
                  fi
                  echo "waiting for odoo-modules to sync..."
                  sleep 5
                done
              env:
              - name: DB_HOST
                valueFrom:
                  secretKeyRef:
                    key: db-host
                    name: odoo-cb-sensitive-values
              - name: DB_PORT
                valueFrom:
                  secretKeyRef:
                    key: db-port
                    name: odoo-cb-sensitive-values
              - name: DB_USER
                valueFrom:
                  secretKeyRef:
                    key: db-user
                    name: odoo-cb-sensitive-values
              image: postgres:16-alpine
              name: wait-for-base
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
              - mountPath: /opt/odoo/custom-addons
                name: extra-addons
            restartPolicy: OnFailure
            securityContext:
              seccompProfile:
                type: RuntimeDefault
            volumes:
            - configMap:
                name: odoo-config
              name: odoo-config
            - name: odoo-data
              persistentVolumeClaim:
                claimName: odoo-data
            - name: extra-addons
              persistentVolumeClaim:
                claimName: demo-odoo-cb-git-modules-pvc
        ttlSecondsAfterFinished: 600
  providerConfigRef:
    name: kubernetes
