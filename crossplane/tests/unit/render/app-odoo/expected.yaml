apiVersion: helm.crossplane.io/v1beta1
kind: Release
metadata:
  annotations:
    crossplane.io/composition-resource-name: odoo-cb-release
  labels:
    crossplane.io/composite: render-odoo-fixture
  name: render-odoo-fixture-release
  ownerReferences:
  - apiVersion: gentianos.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: XApp
    name: render-odoo-fixture
    uid: ""
spec:
  forProvider:
    chart:
      name: odoo
      repository: oci://ghcr.io/gentian-org/charts
      version: 0.1.0
    namespace: tenant-demo
    set:
    - name: oidc.issuer
      valueFrom:
        secretKeyRef:
          key: oidc-issuer
          name: odoo-cb-sensitive-values
          namespace: tenant-demo
    - name: oidc.clientId
      valueFrom:
        secretKeyRef:
          key: oidc-client-id
          name: odoo-cb-sensitive-values
          namespace: tenant-demo
    - name: oidc.clientSecret
      valueFrom:
        secretKeyRef:
          key: oidc-client-secret
          name: odoo-cb-sensitive-values
          namespace: tenant-demo
    - name: database.host
      valueFrom:
        secretKeyRef:
          key: db-host
          name: odoo-cb-sensitive-values
          namespace: tenant-demo
    - name: database.port
      valueFrom:
        secretKeyRef:
          key: db-port
          name: odoo-cb-sensitive-values
          namespace: tenant-demo
    - name: database.name
      valueFrom:
        secretKeyRef:
          key: db-name
          name: odoo-cb-sensitive-values
          namespace: tenant-demo
    - name: database.user
      valueFrom:
        secretKeyRef:
          key: db-user
          name: odoo-cb-sensitive-values
          namespace: tenant-demo
    - name: database.password
      valueFrom:
        secretKeyRef:
          key: db-password
          name: odoo-cb-sensitive-values
          namespace: tenant-demo
    - name: smtp.password
      valueFrom:
        secretKeyRef:
          key: smtp-password
          name: odoo-cb-sensitive-values
          namespace: tenant-demo
    - name: odoo.adminPassword
      valueFrom:
        secretKeyRef:
          key: internal-admin_password
          name: odoo-cb-sensitive-values
          namespace: tenant-demo
    skipCRDs: true
    values:
      fullnameOverride: odoo
      gentian:
        initModules: base,web,gentian_os
        modulesPath: /opt/odoo/custom-addons
      global:
        imagePullSecrets:
        - registry-credentials
      imagePullSecrets:
      - registry-credentials
      ingress:
        enabled: false
      podLabels:
        gentianos.io/app: odoo-cb
        gentianos.io/tenant: demo
      tenantId: demo
    wait: false
  providerConfigRef:
    name: kubernetes
  rollbackLimit: 3
