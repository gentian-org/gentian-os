apiVersion: v1
kind: ConfigMap
metadata:
  name: gentian-cluster-config
  namespace: crossplane-system
  labels:
    gentianos.io/config-type: cluster-config
data:
  identity.kernelRealm: "kernel"
  identity.internalUrl: "http://gentian-idp-keycloak-keycloakx-http.platform-kernel.svc.cluster.local:8080/auth"
  network.infraNamespace: gentian-infra-dev
  network.servicesNamespace: gentian-dev
  network.openbaoNamespace: openbao
  network.routingMode: gateway
  network.kubeApiServerCidr: 10.96.0.0/12
  network.kubeApiServerEndpointIp: 10.96.0.1
  tenant.limitRange.default.cpu: 500m
  tenant.limitRange.default.memory: 512Mi
  tenant.limitRange.defaultRequest.cpu: 100m
  tenant.limitRange.defaultRequest.memory: 128Mi
  mail.serviceMode: kernel
