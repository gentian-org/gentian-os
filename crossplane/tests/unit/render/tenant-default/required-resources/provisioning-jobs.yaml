apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-render-fixture-provisioning-jobs
  namespace: kernel-provisioning
  labels:
    gentianos.io/config-type: tenant-provisioning-jobs
    gentianos.io/tenant: render-fixture
data:
  jobs.json: |
    [
      {
        "apiVersion": "batch/v1",
        "kind": "Job",
        "metadata": {
          "name": "keycloak-realm-render-fixture",
          "namespace": "kernel-authentication",
          "labels": {
            "gentianos.io/tenant": "render-fixture"
          }
        },
        "spec": {
          "template": {
            "spec": {
              "restartPolicy": "Never",
              "containers": [
                {
                  "name": "provision",
                  "image": "ghcr.io/gentian-org/gentian-app-init:develop"
                }
              ]
            }
          }
        }
      },
      {
        "apiVersion": "batch/v1",
        "kind": "Job",
        "metadata": {
          "name": "keycloak-admin-render-fixture",
          "namespace": "kernel-authentication",
          "labels": {
            "gentianos.io/tenant": "render-fixture"
          }
        },
        "spec": {
          "template": {
            "spec": {
              "restartPolicy": "Never",
              "containers": [
                {
                  "name": "provision",
                  "image": "ghcr.io/gentian-org/gentian-app-init:develop"
                }
              ]
            }
          }
        }
      }
    ]
  objects.json: "[]"
