    blockOwnerDeletion: true
    controller: true
    kind: XTenant
    name: render-fixture
    uid: ""
spec:
  forProvider:
    name: tenant-render-fixture
    policy: |
      path "secret/data/gentian-os/tenants/render-fixture/*" {
        capabilities = ["create", "read", "update", "delete", "list"]
      }
      path "secret/metadata/gentian-os/tenants/render-fixture/*" {
        capabilities = ["list", "delete"]
      }
  providerConfigRef:
    name: openbao
