          app.kubernetes.io/managed-by: gentian-os
          gentianos.io/tenant: render-fixture
        name: tenant-isolation
        namespace: tenant-render-fixture
      spec:
        egress:
        - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: platform-kernel
        - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: gentian-infra-dev
        - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: gentian-dev
        - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: openbao
        - to:
          - namespaceSelector:
              matchLabels:
                gentianos.io/tenant: render-fixture
        - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: ingress
        - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: envoy-gateway-system
        - ports:
          - port: 53
            protocol: UDP
          - port: 53
            protocol: TCP
        - ports:
          - port: 443
            protocol: TCP
          to:
          - ipBlock:
              cidr: 10.96.0.0/12
        ingress:
        - from:
          - namespaceSelector:
              matchLabels:
                gentianos.io/tenant: render-fixture
        - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: platform-kernel
        - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: gentian-infra-dev
        - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: gentian-dev
        - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: ingress
        - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: envoy-gateway-system
        podSelector: {}
        policyTypes:
        - Ingress
        - Egress
  providerConfigRef:
    name: kubernetes
---
apiVersion: vault.vault.upbound.io/v1alpha1
