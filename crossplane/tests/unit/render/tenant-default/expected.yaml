apiVersion: realm.keycloak.crossplane.io/v1alpha1
kind: Realm
metadata:
  annotations:
    crossplane.io/composition-resource-name: keycloak-realm
    crossplane.io/external-name: render-fixture
  labels:
    crossplane.io/composite: render-fixture
  name: render-fixture-realm
  ownerReferences:
  - apiVersion: gentianos.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: XTenant
    name: render-fixture
    uid: ""
spec:
  deletionPolicy: Orphan
  forProvider:
    accessTokenLifespan: 5m0s
    attributes:
      frontendUrl: https://id.platform.example.test/auth
    browserFlow: browser
    displayName: Render Fixture
    duplicateEmailsAllowed: true
    enabled: true
    internationalization:
    - defaultLocale: en
      supportedLocales:
      - en
      - de
    loginTheme: gentian
    passwordPolicy: length(12) and digits(1) and lowerCase(1) and upperCase(1) and
      specialChars(1) and passwordHistory(3) and forceExpiredPasswordChange(90)
    realm: render-fixture
    registrationAllowed: false
    rememberMe: true
    resetPasswordAllowed: true
    securityDefenses:
    - bruteForceDetection:
      - maxFailureWaitSeconds: 900
        maxLoginFailures: 5
        permanentLockout: false
      headers:
      - contentSecurityPolicy: ""
        contentSecurityPolicyReportOnly: ""
        referrerPolicy: no-referrer
        strictTransportSecurity: max-age=31536000; includeSubDomains
        xContentTypeOptions: nosniff
        xFrameOptions: ""
        xRobotsTag: none
        xXssProtection: 1; mode=block
    smtpServer:
    - auth:
      - passwordSecretRef:
          key: smtp_password
          name: mail-submission-render-fixture
          namespace: kernel-authentication
        username: noreply@render-fixture.platform.example.test
      from: noreply@platform.example.test
      fromDisplayName: Acme Cloud
      host: mail.platform.example.test
      port: "587"
      ssl: false
      starttls: true
    ssoSessionIdleTimeout: 30m
    ssoSessionMaxLifespan: 12h
  providerConfigRef:
    name: keycloak
