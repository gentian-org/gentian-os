    controller: true
    kind: XTenant
    name: render-fixture
    uid: ""
spec:
  deletionPolicy: Orphan
  forProvider:
    attribute:
    - displayName: ${username}
      multiValued: false
      name: username
      permissions:
      - edit:
        - admin
        - user
        view:
        - admin
        - user
      validator:
      - config:
          max: "255"
          min: "3"
        name: length
      - name: username-prohibited-characters
      - name: up-username-not-idn-homograph
    - displayName: ${email}
      multiValued: false
      name: email
      permissions:
      - edit:
        - admin
        - user
        view:
        - admin
        - user
      requiredForRoles:
      - user
      validator:
      - name: email
      - config:
          max: "255"
        name: length
    - displayName: ${firstName}
      multiValued: false
      name: firstName
      permissions:
      - edit:
        - admin
        - user
        view:
        - admin
        - user
      validator:
      - config:
          max: "255"
        name: length
      - name: person-name-prohibited-characters
    - displayName: ${lastName}
      multiValued: false
      name: lastName
      permissions:
      - edit:
        - admin
        - user
        view:
        - admin
        - user
      validator:
      - config:
          max: "255"
        name: length
      - name: person-name-prohibited-characters
    - displayName: Recovery email
      multiValued: false
      name: gentian.inviteEmail
      permissions:
      - edit:
        - admin
        view:
        - admin
      validator:
      - name: email
      - config:
          max: "255"
        name: length
    - displayName: User ID
      multiValued: false
      name: uid
      permissions:
      - edit:
        - admin
        view:
        - admin
        - user
      validator:
      - config:
          max: "255"
        name: length
    group:
    - displayDescription: Attributes, which refer to user metadata
      displayHeader: User metadata
      name: user-metadata
    realmId: render-fixture
  providerConfigRef:
    name: keycloak
