# What the operator projects from the routes it composes: the host labels this
# tenant's components are served at.
#
# The zone's Keycloak client admits a redirect only to a host it lists, and
# that list used to be written in the Composition by hand -- so a component
# declaring any other subDomain got "Invalid parameter: redirect_uri" on a
# page naming neither the component nor a list. "wiki" here is that component:
# it is in no hand-written list anywhere and must still reach the client.
#
# desktop and admin repeat what the base list already has, which is what the
# projection really looks like, and proves the union does not double them.
#
# "herald" vouches for people (requires.services.vouching), in the tenant
# that adopts the kernel realm: its identity provider entry and its client
# are composed in that realm, and its Secret in the platform tenant's
# namespace. No app of this tenant asks for an exchanged token, so there is
# no app scope and the client is given no optional scopes yet.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gentian-zone-hosts-platform
  namespace: kernel-control
  labels:
    gentianos.io/config-type: zone-hosts
    gentianos.io/tenant: platform
data:
  hosts: |
    admin
    desktop
    wiki
  vouchingProfiles: |
    herald herald 8080 /.well-known/jwks.json
