# A public git repository with role: apps on a cluster whose Cluster
# composition has already published its config: the Argo CD repository lands in
# the namespace the config names, and no ApplicationSet is composed.
apiVersion: gentianos.io/v1alpha1
kind: XRepository
metadata:
  name: gentian-apps
  labels:
    crossplane.io/claim-name: gentian-apps
    crossplane.io/claim-namespace: crossplane-system
spec:
  type: git
  role: apps
  endpoints:
    inCluster: https://github.com/gentian-org/gentian-apps
  branch: main
