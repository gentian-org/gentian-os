    name: dev-cluster
    uid: ""
spec:
  forProvider:
    manifest:
      apiVersion: external-secrets.io/v1
      kind: ClusterSecretStore
      metadata:
        name: openbao
      spec:
        provider:
          vault:
            auth:
              kubernetes:
                mountPath: kubernetes
                role: eso
                serviceAccountRef:
                  name: external-secrets
                  namespace: kernel-secrets
            caProvider:
              key: tls.crt
              name: openbao-tls
              namespace: kernel-secrets
              type: Secret
            path: secret
            server: https://openbao.kernel-secrets.svc.cluster.local:8200
            version: v2
  providerConfigRef:
    name: kubernetes
