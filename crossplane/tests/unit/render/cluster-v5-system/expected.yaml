apiVersion: vault.vault.upbound.io/v1alpha1
kind: Policy
metadata:
  annotations:
    crossplane.io/composition-resource-name: vault-policy-eso-read
  labels:
    crossplane.io/composite: dev-cluster
  name: dev-cluster-policy-eso-read
  ownerReferences:
  - apiVersion: gentianos.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: XCluster
    name: dev-cluster
    uid: ""
spec:
  forProvider:
    name: eso-read
    policy: |
      path "secret/data/gentian-os/kernel/*" {
        capabilities = ["read"]
      }
      path "secret/metadata/gentian-os/kernel/*" {
        capabilities = ["list"]
      }
      # The backup identity, when spec.backup.escrowIdentity puts it
      # here, is the one kernel path ESO must never reach. The glob
      # above would otherwise cover it, and then anything able to
      # write an ExternalSecret could materialise the key that opens
      # every bundle into an ordinary Secret — which is the whole of
      # what escrow was meant not to mean.
      #
      # Escrow makes the key readable by a cluster administrator
      # holding OpenBao credentials. It does not make it readable by
      # the cluster. Denied unconditionally, because a rule that
      # appeared only when escrow was on would be a rule nobody had
      # ever seen work.
      #
      # An exact path beats a glob in OpenBao's policy engine, and
      # deny beats everything.
      path "secret/data/gentian-os/kernel/backup/identity" {
        capabilities = ["deny"]
      }
      path "secret/metadata/gentian-os/kernel/backup/identity" {
        capabilities = ["deny"]
      }
      path "secret/data/gentian-os/tenants/+/apps/*" {
        capabilities = ["read"]
      }
      # Tenant repository credentials. Without this a tenant admin's
      # write succeeds and nothing works: the satisfaction probe
      # never syncs, so the credential reads as missing while it is
      # sitting in the path, and the Argo CD repository Secret is
      # never materialised. Named rather than widened to
      # tenants/+/* — ESO should read what becomes a Secret, not
      # everything a tenant owns.
      path "secret/data/gentian-os/tenants/+/repositories/*" {
        capabilities = ["read"]
      }
      # Tenant backup destinations. Same shape as repositories, and
      # it failed the same way: DestinationVaultPath puts an external
      # endpoint's keys at tenants/<t>/backup/destination, the two
      # ExternalSecrets over it answered
      #
      #   403 ... GET /v1/secret/data/gentian-os/tenants/corp/backup/destination
      #
      # and the BackupPolicy stayed CredentialUnsatisfied while the
      # keys sat in the path. The write side is the tenant admin's
      # tenant-<t> policy; this is the read side, and a credential
      # needs both before it does anything.
      path "secret/data/gentian-os/tenants/+/backup/*" {
        capabilities = ["read"]
      }
      # ...but not the escrowed backup identity beside it. The glob
      # above is for destination credentials, which exist precisely
      # to become Secrets; the identity is the key that opens the
      # tenant's entire history and must never become one. Same
      # reasoning as the kernel path above, one subtree down.
      path "secret/data/gentian-os/tenants/+/backup/identity" {
        capabilities = ["deny"]
      }
      path "secret/metadata/gentian-os/tenants/+/backup/identity" {
        capabilities = ["deny"]
      }
      # Contract integration secrets. app-default composes an
      # ExternalSecret over tenants/<t>/contracts/<c> for every
      # integration an app maps, so this is the same omission — not
      # yet observed only because no installed app maps one.
      path "secret/data/gentian-os/tenants/+/contracts/*" {
        capabilities = ["read"]
      }
      path "secret/metadata/gentian-os/tenants/*" {
        capabilities = ["list"]
      }
  providerConfigRef:
    name: openbao
---
apiVersion: vault.vault.upbound.io/v1alpha1
kind: Policy
metadata:
  annotations:
    crossplane.io/composition-resource-name: vault-policy-operator-write
  labels:
    crossplane.io/composite: dev-cluster
  name: dev-cluster-policy-operator-write
  ownerReferences:
  - apiVersion: gentianos.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: XCluster
    name: dev-cluster
    uid: ""
spec:
  forProvider:
    name: operator-write
    policy: |
      path "secret/data/gentian-os/*"     { capabilities = ["create","read","update","patch","delete"] }
      path "secret/metadata/gentian-os/*" { capabilities = ["list","read","delete"] }
      path "auth/token/create"                    { capabilities = ["update"] }
      path "auth/token/lookup-self"               { capabilities = ["read"] }

      # Per-tenant JWT auth mounts. A tenant member authenticates in
      # their own Keycloak realm — that is where their apps' OIDC
      # clients live — so their portal token is signed by that realm
      # and the kernel realm's mount cannot verify it. One mount per
      # realm is what makes the exchange possible.
      #
      # Deliberately NOT one mount trusting many keys, which would be
      # fewer objects and a privilege escalation: a tenant
      # administrator holds realm-admin in their own realm, so they
      # can mint a token carrying any groups claim, the cluster admin
      # group included. Isolation belongs at the mount boundary,
      # because claim values are precisely what they control.
      #
      # Glob, not the + segment wildcard: OpenBao's + matches one
      # whole path segment, so "oidc-+" matches nothing at all.
      path "sys/auth/oidc-*"                      { capabilities = ["create","read","update","delete","sudo"] }
      path "auth/oidc-*"                          { capabilities = ["create","read","update","delete","list"] }
  providerConfigRef:
    name: openbao
