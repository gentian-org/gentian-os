# A mirror of the platform's own repository that authenticates with a token:
# the gentian-os role and the bearer mode are both accepted.
apiVersion: gentianos.io/v1alpha1
kind: Repository
metadata:
  name: schema-valid-repository-os-bearer
  namespace: crossplane-system
spec:
  role: gentian-os
  type: git
  endpoints:
    inCluster: https://git.mirror.example/platform/gentian-os
  credential:
    displayName: "Gentian OS Repository Access"
    vaultPath: gentian-os/kernel/repositories/gentian-os
    phase: bootstrap
    authType: bearer
    validate:
      type: git-https
