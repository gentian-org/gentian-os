# Valid Cluster claim — v4 may still ask for the kernel mail stack.
#
# The refusal above is about what the LAYOUT can honour, not about the
# function: v4 has D-04-mail and deploys it. This fixture is what keeps the
# rule from being read as "the kernel mail stack is gone".
apiVersion: gentianos.io/v1alpha1
kind: Cluster
metadata:
  name: test-v4-system-mail
  namespace: default
spec:
  kernelDomain: example.org
  layout: v4
  # A reachable SMTP ingress. networkMode defaults to tunnel, which carries no
  # SMTP at all, so a claim asking for its own mail stack and saying nothing
  # about the network is refused -- on v4 as much as on v5, because that rule
  # is about what a tunnel can carry rather than about what is built.
  networkMode: static-ip
  nodeIp: 198.51.100.11
  mail:
    serviceMode: system
  llm:
    enabled: true
