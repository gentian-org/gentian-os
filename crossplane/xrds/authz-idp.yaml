apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xauthzidps.gentianos.io
spec:
  group: gentianos.io
  names:
    kind: XAuthzIdp
    plural: xauthzidps
  claimNames:
    kind: AuthzIdp
    plural: authzidps
  defaultCompositionRef:
    name: authz-idp
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - environment
              properties:
                environment:
                  type: string
                  description: Environment slug (e.g. dev).
                idpNamespace:
                  type: string
                  description: Namespace for Keycloak and OpenFGA workloads.
                  default: platform-kernel
                openfga:
                  type: object
                  properties:
                    helmReleaseName:
                      type: string
                      default: gentian-openfga
                    chartVersion:
                      type: string
                      default: "0.2.23"
                keycloak:
                  type: object
                  properties:
                    helmReleaseName:
                      type: string
                      default: gentian-idp-keycloak
                    chartVersion:
                      type: string
                      default: "7.0.1"
            status:
              type: object
              properties:
                openfgaReleaseReady:
                  type: boolean
                keycloakReleaseReady:
                  type: boolean
