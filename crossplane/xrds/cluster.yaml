apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xclusters.gentianos.io
spec:
  group: gentianos.io
  names:
    kind: XCluster
    plural: xclusters
  claimNames:
    kind: Cluster
    plural: clusters
  defaultCompositionRef:
    name: cluster-default
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - kernelDomain
              properties:
                kernelDomain:
                  type: string
                  description: >
                    Cluster-wide platform DNS suffix, e.g. "platform.example.com".
                    All kernel services are reachable under this domain.
                masterPasswordSecretRef:
                  type: object
                  description: >
                    Reference to a Kubernetes Secret containing the master password
                    used to derive all kernel credentials via HMAC-SHA256.
                    The Secret must have a key named "master-password".
                  required:
                    - name
                    - namespace
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                openbao:
                  type: object
                  description: OpenBao connection settings.
                  properties:
                    server:
                      type: string
                      description: >
                        OpenBao service address reachable from within the cluster.
                      default: "http://openbao.openbao.svc.cluster.local:8200"
                    kvMount:
                      type: string
                      description: Path of the KV v2 secret engine mount.
                      default: "secret"
                    authMount:
                      type: string
                      description: Path of the Kubernetes auth backend.
                      default: "kubernetes"
                    kubernetesHost:
                      type: string
                      description: Kubernetes API server address seen from OpenBao.
                      default: "https://kubernetes.default.svc"
                argocd:
                  type: object
                  description: ArgoCD configuration.
                  properties:
                    namespace:
                      type: string
                      description: Namespace where ArgoCD is deployed.
                      default: "argocd"
                    sourceRepos:
                      type: array
                      description: Extra source repositories to allow in the tenants AppProject.
                      items:
                        type: string
                eso:
                  type: object
                  description: External Secrets Operator configuration.
                  properties:
                    namespace:
                      type: string
                      description: Namespace where ESO is deployed.
                      default: "external-secrets"
                    serviceAccount:
                      type: string
                      description: ServiceAccount name used by ESO.
                      default: "external-secrets"
                certManager:
                  type: object
                  description: cert-manager configuration.
                  properties:
                    letsencryptEmail:
                      type: string
                      description: >
                        ACME account e-mail for Let's Encrypt. Defaults to
                        "admin@{kernelDomain}" when omitted.
                # ── Cluster modes ────────────────────────────────────────
                # Consumed directly by Compositions, which is why these live on
                # the claim rather than in the Helm values chain. Everything
                # here came from cluster-settings.env, a shell file the
                # installer read and no reconciler could see (§2).
                tenancyMode:
                  type: string
                  description: Whether the cluster hosts one tenant or many.
                  enum:
                    - single
                    - multi
                  default: multi
                networkMode:
                  type: string
                  description: >
                    How traffic reaches the cluster. tunnel sits behind a
                    reverse proxy and needs no reachable node IP; static-ip
                    requires one and a load balancer in front of it.
                  enum:
                    - tunnel
                    - static-ip
                  default: tunnel
                routingMode:
                  type: string
                  description: Which ingress implementation kernel routes use.
                  enum:
                    - gateway
                    - ingress
                  default: gateway
                secretMode:
                  type: string
                  description: >
                    derived reproduces every kernel credential by HMAC-SHA256 of
                    the master password, so a rebuild yields the same values.
                    random generates them once, which breaks that property and
                    is only for clusters that never rebuild.
                  enum:
                    - derived
                    - random
                  default: derived

                # ── Trust anchor ─────────────────────────────────────────
                certificates:
                  type: object
                  description: >
                    How this cluster issues TLS certificates. The dimension that
                    decides whether an install on an internal domain is possible
                    at all — an installer that can only succeed with public ACME
                    is not a self-hostable installer (§9).
                  properties:
                    issuerMode:
                      type: string
                      description: >
                        acme-dns01   public DNS, wildcard capable, needs a DNS
                                     provider credential.
                        acme-http01  public DNS reachable on :80, no wildcards.
                        private-ca   an existing CA the operator supplies.
                        self-signed  a CA this cluster generates. Offline,
                                     instant, and not publicly trusted — the
                                     mode for an internal domain.
                      enum:
                        - acme-dns01
                        - acme-http01
                        - private-ca
                        - self-signed
                      default: acme-dns01
                    caBundleSecretRef:
                      type: object
                      description: >
                        Where the trust anchor's certificate lives, so consumers
                        that validate kernel hostnames can be given it. Defaults
                        to what the self-signed mode produces.
                      properties:
                        name:
                          type: string
                          default: gentian-root-ca-tls
                        namespace:
                          type: string
                          default: cert-manager

                # ── Mail ─────────────────────────────────────────────────────
                mail:
                  type: object
                  description: >
                    Where the cluster sends mail. The relay's credentials are
                    NOT here — they are the smtp-relay CredentialRequirement,
                    and this carries only its address and transport settings.
                  properties:
                    serviceMode:
                      type: string
                      description: >
                        external relays through an upstream provider; kernel
                        runs Postfix in-cluster.
                      enum:
                        - external
                        - kernel
                      default: external
                    host:
                      type: string
                      description: Relay hostname. Required when serviceMode is external.
                    port:
                      type: integer
                      default: 587
                    ssl:
                      type: boolean
                      description: Implicit TLS on connect, as opposed to STARTTLS.
                      default: false
                    starttls:
                      type: boolean
                      default: true

            status:
              type: object
              properties:
                kernelNamespaces:
                  type: array
                  description: Namespaces provisioned by this Cluster XR.
                  items:
                    type: string
