apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xclusters.gentianos.io
spec:
  group: gentianos.io
  names:
    kind: XCluster
    plural: xclusters
  claimNames:
    kind: Cluster
    plural: clusters
  defaultCompositionRef:
    name: cluster-default
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - kernelDomain
              properties:
                kernelDomain:
                  type: string
                  description: >
                    Cluster-wide platform DNS suffix, e.g. "platform.example.com".
                    All kernel services are reachable under this domain.
                masterPasswordSecretRef:
                  type: object
                  description: >
                    Reference to a Kubernetes Secret containing the master password
                    used to derive all kernel credentials via HMAC-SHA256.
                    The Secret must have a key named "master-password".
                  required:
                    - name
                    - namespace
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                openbao:
                  type: object
                  description: OpenBao connection settings.
                  properties:
                    server:
                      type: string
                      description: >
                        OpenBao service address reachable from within the cluster.
                      default: "http://openbao.openbao.svc.cluster.local:8200"
                    kvMount:
                      type: string
                      description: Path of the KV v2 secret engine mount.
                      default: "secret"
                    authMount:
                      type: string
                      description: Path of the Kubernetes auth backend.
                      default: "kubernetes"
                    kubernetesHost:
                      type: string
                      description: Kubernetes API server address seen from OpenBao.
                      default: "https://kubernetes.default.svc"
                argocd:
                  type: object
                  description: ArgoCD configuration.
                  properties:
                    namespace:
                      type: string
                      description: Namespace where ArgoCD is deployed.
                      default: "argocd"
                    sourceRepos:
                      type: array
                      description: Extra source repositories to allow in the tenants AppProject.
                      items:
                        type: string
                eso:
                  type: object
                  description: External Secrets Operator configuration.
                  properties:
                    namespace:
                      type: string
                      description: Namespace where ESO is deployed.
                      default: "external-secrets"
                    serviceAccount:
                      type: string
                      description: ServiceAccount name used by ESO.
                      default: "external-secrets"
                certManager:
                  type: object
                  description: cert-manager configuration.
                  properties:
                    letsencryptEmail:
                      type: string
                      description: >
                        ACME account e-mail for Let's Encrypt. Defaults to
                        "admin@{kernelDomain}" when omitted.
                # ── Cluster modes ────────────────────────────────────────
                # Consumed directly by Compositions, which is why these live on
                # the claim rather than in the Helm values chain. Everything
                # here came from cluster-settings.env, a shell file the
                # installer read and no reconciler could see (§2).
                tenancyMode:
                  type: string
                  description: Whether the cluster hosts one tenant or many.
                  enum:
                    - single
                    - multi
                  default: multi
                networkMode:
                  type: string
                  description: >
                    How traffic reaches the cluster. tunnel sits behind a
                    reverse proxy and needs no reachable node IP; static-ip
                    requires one and a load balancer in front of it.
                  enum:
                    - tunnel
                    - static-ip
                  default: tunnel
                routingMode:
                  type: string
                  description: Which ingress implementation kernel routes use.
                  enum:
                    - gateway
                    - ingress
                  default: gateway
                secretMode:
                  type: string
                  description: >
                    derived reproduces every kernel credential by HMAC-SHA256 of
                    the master password, so a rebuild yields the same values.
                    random generates them once, which breaks that property and
                    is only for clusters that never rebuild.
                  enum:
                    - derived
                    - random
                  default: derived

                # ── Sizing and placement ─────────────────────────────────
                # The rest of cluster-settings.env's declared half. Every field
                # here feeds the gentian-cluster-config ConfigMap that
                # Compositions read, which this composition emits.
                nodeIp:
                  type: string
                  description: >
                    Node address that app profiles may reference as ${NODE_IP}
                    in their values. The installer discovers it and writes it
                    here, so it is declared rather than detected at runtime — a
                    Composition cannot read a Node.
                storageClass:
                  type: string
                  description: >
                    StorageClass for kernel PVCs. Empty means the cluster's
                    default, which is right for most installs and wrong for any
                    cluster with more than one.
                llm:
                  type: object
                  description: LLM serving sizing. Hardware-dependent, not stage-dependent.
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    gpuTimeSliceReplicas:
                      type: integer
                      description: >
                        How many workloads share one physical GPU. Time slicing,
                        not partitioning — they contend for the whole device
                        rather than getting a fraction of it.
                      default: 1
                    vllmInstances:
                      type: string
                      description: Space-separated vLLM instance IDs; each needs its own sizing block.
                tenantDefaults:
                  type: object
                  description: >
                    Resource defaults applied to every tenant namespace. Usually
                    identical across a deployment's clusters, so they belong in
                    profiles/_base.yaml rather than being restated per cluster —
                    they are on the claim so a cluster that genuinely differs
                    can say so.
                  properties:
                    limitRange:
                      type: object
                      properties:
                        defaultCpu:
                          type: string
                          default: 500m
                        defaultMemory:
                          type: string
                          default: 512Mi
                        defaultRequestCpu:
                          type: string
                          default: 100m
                        defaultRequestMemory:
                          type: string
                          default: 128Mi
                    initJob:
                      type: object
                      properties:
                        limitsCpu:
                          type: string
                          default: 500m
                        limitsMemory:
                          type: string
                          default: 512Mi
                        requestsCpu:
                          type: string
                          default: 100m
                        requestsMemory:
                          type: string
                          default: 128Mi

                # ── OIDC write path ──────────────────────────────────────
                oidc:
                  type: object
                  description: >
                    Human write access to OpenBao, federated from Keycloak. When
                    unset the OIDC backend is not created and the only write
                    path is the installer's bootstrap token — which §7 requires
                    be revoked, so leaving this unset means no day-2 writes at
                    all. Set it once Keycloak is reachable.
                  properties:
                    discoveryUrl:
                      type: string
                      description: >
                        The realm's OIDC discovery URL. Its presence is what
                        creates the backend, so an incomplete block stays inert
                        rather than half-configuring an auth method.
                    clientId:
                      type: string
                      default: openbao
                    clientSecretRef:
                      type: string
                      description: >
                        Name of the Secret holding the client secret, in the
                        OpenBao namespace. A reference, never the value — a
                        secret in a spec field is the one thing §7 prohibits
                        outright.
                      default: openbao-oidc-client
                    externalUrl:
                      type: string
                      description: OpenBao's browser-reachable URL, for the OIDC redirect.
                    clusterAdminGroup:
                      type: string
                      description: Keycloak group whose members receive the cluster-admin policy.
                      default: /platform-admins
                    tenantAdminGroup:
                      type: string
                      description: >
                        Keycloak group whose members receive the tenant-admin
                        policy. Membership alone grants nothing: the policy
                        templates its path from the tenant claim, so a member
                        without one reaches no tenant.
                      default: /tenant-admins
                    tenantClaim:
                      type: string
                      description: >
                        Token claim naming the tenant a user administers. It is
                        mapped into OpenBao alias metadata, which is both what
                        the tenant-admin policy templates its path from and what
                        the credential manager filters the catalogue by — so the
                        write path and the read path cannot disagree.
                      default: tenant

                # ── Trust anchor ─────────────────────────────────────────
                certificates:
                  type: object
                  description: >
                    How this cluster issues TLS certificates. The dimension that
                    decides whether an install on an internal domain is possible
                    at all — an installer that can only succeed with public ACME
                    is not a self-hostable installer (§9).
                  properties:
                    issuerMode:
                      type: string
                      description: >
                        acme-dns01   public DNS, wildcard capable, needs a DNS
                                     provider credential.
                        acme-http01  public DNS reachable on :80, no wildcards.
                        private-ca   an existing CA the operator supplies.
                        self-signed  a CA this cluster generates. Offline,
                                     instant, and not publicly trusted — the
                                     mode for an internal domain.
                      enum:
                        - acme-dns01
                        - acme-http01
                        - private-ca
                        - self-signed
                      default: acme-dns01
                    caBundleSecretRef:
                      type: object
                      description: >
                        Where the trust anchor's certificate lives, so consumers
                        that validate kernel hostnames can be given it. Defaults
                        to what the self-signed mode produces.
                      properties:
                        name:
                          type: string
                          default: gentian-root-ca-tls
                        namespace:
                          type: string
                          default: cert-manager

                # ── Mail ─────────────────────────────────────────────────────
                mail:
                  type: object
                  description: >
                    Where the cluster sends mail. The relay's credentials are
                    NOT here — they are the smtp-relay CredentialRequirement,
                    and this carries only its address and transport settings.
                  properties:
                    serviceMode:
                      type: string
                      description: >
                        external relays through an upstream provider; kernel
                        runs Postfix in-cluster.
                      enum:
                        - external
                        - kernel
                      default: external
                    host:
                      type: string
                      description: Relay hostname. Required when serviceMode is external.
                    port:
                      type: integer
                      default: 587
                    ssl:
                      type: boolean
                      description: Implicit TLS on connect, as opposed to STARTTLS.
                      default: false
                    starttls:
                      type: boolean
                      default: true

            status:
              type: object
              properties:
                kernelNamespaces:
                  type: array
                  description: Namespaces provisioned by this Cluster XR.
                  items:
                    type: string
