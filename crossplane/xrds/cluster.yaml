apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xclusters.gentianos.io
spec:
  group: gentianos.io
  names:
    kind: XCluster
    plural: xclusters
  claimNames:
    kind: Cluster
    plural: clusters
  defaultCompositionRef:
    name: cluster-default
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - kernelDomain
              # One rule, and it is about physics rather than about what is
              # built yet.
              #
              # Two rules used to live here, refusing mail.serviceMode 'system'
              # and llm.enabled on layout v5, because v5 composed a route and a
              # tenant registration for both and deployed neither. Both are
              # deployed now, so both rules are gone -- a rule that outlives its
              # reason is worse than none -- and their schema fixtures moved
              # from invalid to valid so neither refusal can come back
              # unnoticed.
              #
              # This one does not expire. A tunnel carries HTTP and HTTPS and
              # nothing else: it cannot receive a connection on 25, so the
              # cluster cannot be an MX, and it cannot publish submission on
              # 587. A cluster that asked for its own mail stack behind one
              # would get Postfix, a LoadBalancer nothing routes to, and an MX
              # record naming an address that never answers -- senders retry
              # for days and then bounce, which is the most expensive way for
              # this to fail.
              #
              # The installer has always refused this combination
              # (mail_network_mode_compatible), but only on paths driven by
              # MAIL_SERVICE_MODE. On v5 the mode comes from this claim and no
              # step reads that variable, so the guard did not reach the
              # cluster that needs it.
              x-kubernetes-validations:
                - rule: >-
                    !(has(self.mail) && has(self.mail.serviceMode) &&
                    self.mail.serviceMode == 'system' &&
                    has(self.networkMode) && self.networkMode == 'tunnel')
                  message: >-
                    mail.serviceMode 'system' cannot run behind networkMode
                    'tunnel': a tunnel carries HTTP and HTTPS only, so the cluster
                    can neither receive mail on port 25 nor publish submission on
                    587. Use 'external' with an smtp-relay credential, or switch
                    to networkMode 'static-ip' with a reachable SMTP ingress.
                # The same physics for TURN: a tunnel carries no UDP, so a TURN
                # edge behind one is a load balancer nothing reaches. A
                # component that declares TURN there waits and says why; this
                # refuses only the claim that asks for the edge regardless.
                - rule: >-
                    !(has(self.systemServices) && has(self.systemServices.always) &&
                    'turn' in self.systemServices.always &&
                    has(self.networkMode) && self.networkMode == 'tunnel')
                  message: >-
                    systemServices.always cannot name 'turn' behind networkMode
                    'tunnel': a tunnel carries HTTP and HTTPS only, and TURN
                    needs UDP and ports of its own. Switch to networkMode
                    'static-ip', or leave TURN out.
              properties:
                identity:
                  type: object
                  # The object itself defaults, not just its fields. A nested default
                  # only materialises when its parent is present, so without this the
                  # kernelRealm default below is unreachable on any cluster whose claim
                  # does not mention identity — which is every one of them. spec.oidc
                  # shows the same shape: its realm has defaulted to "kernel" since it
                  # was written and no composite has ever carried the value.
                  default: {}
                  description: >
                    Where the in-cluster Keycloak answers. Tenant realms broker to
                    the kernel realm, and the server-to-server half of that exchange
                    must not leave the cluster.
                  properties:
                    kernelRealm:
                      type: string
                      description: >
                        The shared realm tenant realms broker to, and the realm the
                        broker client lives in.

                        oidc.realm names the same realm for OpenBao and wins when a
                        claim sets it. This carries the default because oidc is inert
                        by design — its discoveryUrl is what creates the auth backend,
                        so the block stays absent on clusters that do not use it, and a
                        default parked there would never materialise.
                      default: kernel
                    internalUrl:
                      type: string
                      description: >
                        Keycloak's in-cluster base URL, including the relative path its
                        realm endpoints hang off.

                        The broker IdP splits its endpoints deliberately. The browser is
                        sent to the public id.<kernelDomain> URL, while token, JWKS and
                        userinfo are fetched over this one, so Keycloak does not hairpin
                        out through the ingress and back in to reach itself during the
                        broker code exchange.

                        This is NOT gentian-kernel-services' KEYCLOAK_INTERNAL_URL, which
                        is documented as a base with no path. Realm endpoints are relative
                        to /auth, so the two cannot be the same string, and the Compositions
                        need the /auth form. Keeping them separate keys is deliberate:
                        collapsing them would silently give one consumer the other's
                        contract.

                        No default. It used to carry a namespace name, which the API
                        server then materialised onto every composite -- including the
                        ones where that namespace does not exist, so a tenant realm's
                        broker IdP would fetch tokens from an address that resolves to
                        nothing. Left unset, the composition derives it from
                        kernel/namespaces.yaml, the way it derives the edge namespace.
                partners:
                  type: object
                  description: >
                    Bounds and defaults of the tenants' partners (Tenant
                    spec.partners, AD-17): realms of other clusters a tenant's
                    realm links its people's accounts with.
                  properties:
                    allowedIssuers:
                      type: array
                      maxItems: 64
                      description: >
                        The issuers a tenant may name as a partner; "*"
                        matches any run of characters, so
                        "https://id.example.net/auth/realms/*" allows every
                        realm there and "https://*" any issuer. Empty: none.
                        A partner outside these is refused by the director and
                        not composed by the operator.
                      items:
                        type: string
                    defaults:
                      type: array
                      maxItems: 8
                      description: >
                        Partners every tenant issues towards, those made
                        later included; a tenant's own entry of the same name
                        replaces one. The installer declares the store's
                        vendor here with the store's extra services, and
                        allows its issuer; --no-extra-services leaves it out.
                      items:
                        type: object
                        required: [name, issuer]
                        properties:
                          name:
                            type: string
                            pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                            maxLength: 40
                          issuer:
                            type: string
                            pattern: '^https://[^/\s]+/[^\s?#]*[^/\s?#]$'
                catalogue:
                  type: object
                  description: >
                    Where this cluster may fetch profiles from (AD-14). A
                    tenant installing "main/nextcloud-base-ce" gets the bundle
                    from the source named "main", and the director refuses a
                    coordinate whose source is not listed here.

                    This lives on the claim rather than in the director's
                    environment so that naming a catalogue source is a
                    reviewable commit with an author and a date, and so that
                    "what could this cluster install from" can be answered
                    without cluster access.

                    A source named here is offered to every tenant: the
                    cluster lists its entries to them as installable from
                    here. That is what the cluster offers, not a license.
                    Whether an installed app arrives is decided where its
                    artefacts are pulled, by the credential the tenant holds
                    for their repository.
                  properties:
                    storeUrl:
                      type: string
                      description: >
                        Where people are sent for the entries this cluster
                        cannot serve itself. A cluster lists only its own
                        catalogues' community (ce) and private (pe) entries;
                        maintained (me) and enterprise (ee) editions exist
                        because somebody maintains or licenses them, which is
                        the App Store's business, so the cluster names the
                        store rather than describing them badly.

                        Unset means this cluster belongs to no store, which is
                        supported: its own catalogues are then all there is.
                    extraServices:
                      type: boolean
                      default: true
                      description: >
                        Whether the installer places the store's extra
                        services from its catalogue: the Operations Console
                        (platform tenant), the App Store app and the
                        Subscription Center (every other tenant, while the
                        cluster offers a store). false is what
                        --no-extra-services records, so that a later run
                        without the flag keeps them out. Read by the
                        installer; the operator places whatever profiles the
                        cluster's catalogue holds.
                    updates:
                      type: object
                      description: >
                        How installed apps move to newer builds
                        (docs/plans/versioning.md §4). The cluster's
                        administrator sets a mode for every app and may name
                        another per app; a tenant's entry may carry an
                        override the cluster's administrator wrote. latest:
                        the platform moves the app to the newest build its
                        version line admits, inside the window. manual: the
                        cluster's administrator moves it. tenant: the
                        tenant's administrator may.
                      properties:
                        mode:
                          type: string
                          enum: [latest, manual, tenant]
                          default: latest
                          description: The mode for every app not named under apps.
                        window:
                          type: object
                          description: >
                            When the platform moves apps in latest mode, as a
                            daily window in a time zone. Absent, any time.
                          properties:
                            start:
                              type: string
                              pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
                              description: The window opens, "02:00".
                            end:
                              type: string
                              pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
                              description: The window closes, "05:00"; before start, it crosses midnight.
                            timezone:
                              type: string
                              default: UTC
                              description: An IANA time zone, "Europe/Zurich".
                        apps:
                          type: array
                          description: Apps whose mode differs from the cluster's.
                          items:
                            type: object
                            required: [name, mode]
                            properties:
                              name:
                                type: string
                                description: The profile's name.
                              mode:
                                type: string
                                enum: [latest, manual, tenant]
                    sources:
                      type: array
                      description: >
                        The catalogues this cluster knows. Each states where
                        it is read from once: url or oci. An entry whose url
                        is not https, whose oci is not an artifact and a
                        repository, which states both or neither, or which
                        has no name, is ignored. A catalogue is never kept in
                        the deployments repository, which holds the
                        cluster's state only.
                      items:
                        type: object
                        required:
                          - name
                        properties:
                          name:
                            type: string
                            description: >
                              The catalogue's slug: the first half of a
                              coordinate.
                          url:
                            type: string
                            description: >
                              Base https URL the bundle is fetched from. The
                              bytes are untrusted -- the digest an install
                              asks for is what admits them -- so this may be
                              any host.
                          addedBy:
                            type: string
                            enum: [store]
                            description: >
                              store: the installer added this source because
                              the store this cluster names (storeUrl) lists
                              it in GET /v1/meta. Absent: the cluster's
                              administrator added it. The installer adds a
                              source of a name the claim does not have, and
                              never changes or removes one, whoever added it.
                          oci:
                            type: object
                            required:
                              - repository
                              - artifact
                            description: >
                              In place of url: an OCI artifact the catalogue
                              is kept as (artifact type
                              application/vnd.gentianos.catalogue.v1, one
                              layer, a gzip'd tar of index.yaml and
                              profiles/), read with the credential of a
                              repository declared for the cluster. The
                              registry is held to the rules of an address:
                              https on 443, a public host. The bytes are held
                              to the digest like any other.
                            properties:
                              repository:
                                type: string
                                maxLength: 63
                                pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
                                description: >
                                  The name of a repository declared for the
                                  cluster (not for a tenant), whose address the
                                  artifact lies inside.
                              artifact:
                                type: string
                                maxLength: 1024
                                pattern: '^[a-z0-9.-]+(:443)?/[a-z0-9._/-]+(:[A-Za-z0-9_][A-Za-z0-9._-]{0,127})?(@sha256:[a-f0-9]{64})?$'
                                description: >
                                  The reference without a scheme:
                                  <registry host>/<repository>:<tag>, or
                                  @sha256:<digest> in place of or after the tag.
                kernelDomain:
                  type: string
                  description: >
                    Cluster-wide platform DNS suffix, e.g. "platform.example.com".
                    All kernel services are reachable under this domain.
                clusterUID:
                  type: string
                  pattern: '^[0-9a-f]{32}$'
                  description: >
                    This cluster's random id: 32 hex characters the installer
                    writes here once and never changes. Unlike the cluster's
                    name, no two clusters share it. The operator records it in
                    every bundle it signs, and a restore brings back the rights
                    granted in a tenant only from a bundle signed by this
                    cluster and taken on a cluster of this id. Changing it makes
                    every earlier bundle read as another cluster's.
                platformRoles:
                  type: object
                  # So the schema's per-role defaults materialise: a property's
                  # default is only applied when the object holding it exists.
                  default: {}
                  description: >
                    Which Keycloak group in the kernel realm holds each of the
                    two platform roles held by a group. The operator projects
                    these into OpenFGA as the cluster's role relations, so a
                    person's authority over the cluster follows from their
                    group membership and from nothing else. Every other
                    cluster role is held by name (platformAccess.roleHolders).
                  properties:
                    admin:
                      type: string
                      default: "gentian:platform:admin"
                      description: >
                        The cluster's administrators: the claim, plans,
                        ceilings, tenant deployment. Defaults to the group the
                        install's bootstrap administrator is placed in.
                    breakGlass:
                      type: string
                      description: >
                        Admission overlays and raw file edits. No standing
                        membership is expected; this names the group that is
                        filled only when it is needed.
                platformAccess:
                  type: object
                  description: >
                    Who on the cluster holds which cluster role by name: a
                    person of the platform tenant, or an administrator of
                    another tenant, given a role by the cluster's
                    administrator. Written by the director; the operator
                    writes each entry into the authorization graph as the
                    account of that tenant's realm, which only a token issued
                    by that realm is matched against.
                  properties:
                    roleHolders:
                      type: array
                      maxItems: 256
                      description: >
                        Keyed by role, tenant and the account's subject in
                        the tenant's realm, which outlives a changed address;
                        username and email say who it is to a person reading
                        the claim. securityOfficer and auditor are held over
                        the cluster; serviceAdmin and sharedAppsAdmin over the
                        cluster and by people of the platform tenant only;
                        perimeterApprover over the cluster by a person of the
                        platform tenant, and over their own tenant
                        (tenant:<t>) by a tenant's administrator. An entry
                        whose expiresAt has passed grants nothing.
                      items:
                        type: object
                        required: [role, tenant, subject, username]
                        properties:
                          role:
                            type: string
                            enum: [securityOfficer, auditor, serviceAdmin, sharedAppsAdmin, perimeterApprover]
                          scope:
                            type: string
                            pattern: '^(cluster|tenant:[a-z0-9]([-a-z0-9]*[a-z0-9])?)$'
                            maxLength: 70
                          tenant:
                            type: string
                            pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                            maxLength: 63
                          subject:
                            type: string
                            pattern: '^[A-Za-z0-9._-]{1,128}$'
                          username:
                            type: string
                            maxLength: 255
                          email:
                            type: string
                            maxLength: 255
                          reason:
                            type: string
                            maxLength: 500
                          expiresAt:
                            type: string
                            format: date-time
                masterPasswordSecretRef:
                  type: object
                  description: >
                    Reference to a Kubernetes Secret containing the master password
                    used to derive all kernel credentials via HMAC-SHA256.
                    The Secret must have a key named "master-password".
                  required:
                    - name
                    - namespace
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                openbao:
                  type: object
                  description: OpenBao connection settings.
                  properties:
                    server:
                      type: string
                      description: >
                        OpenBao service address reachable from within the cluster.
                      default: "http://openbao.kernel-secrets.svc.cluster.local:8200"
                    kvMount:
                      type: string
                      description: Path of the KV v2 secret engine mount.
                      default: "secret"
                    authMount:
                      type: string
                      description: Path of the Kubernetes auth backend.
                      default: "kubernetes"
                    kubernetesHost:
                      type: string
                      description: Kubernetes API server address seen from OpenBao.
                      default: "https://kubernetes.default.svc"
                argocd:
                  type: object
                  description: ArgoCD configuration.
                  properties:
                    namespace:
                      type: string
                      description: Namespace where ArgoCD is deployed.
                      default: "kernel-gitops"
                    sourceRepos:
                      type: array
                      description: Extra source repositories to allow in the tenants AppProject.
                      items:
                        type: string
                eso:
                  type: object
                  description: External Secrets Operator configuration.
                  properties:
                    namespace:
                      type: string
                      description: Namespace where ESO is deployed.
                      default: "kernel-secrets"
                    serviceAccount:
                      type: string
                      description: ServiceAccount name used by ESO.
                      default: "external-secrets"
                certManager:
                  type: object
                  description: cert-manager configuration.
                  properties:
                    letsencryptEmail:
                      type: string
                      description: >
                        ACME account e-mail for Let's Encrypt. Defaults to
                        "admin@{kernelDomain}" when omitted.
                logForwarding:
                  type: object
                  description: >
                    Where the platform's logs go (docs/design/audit-events.md
                    §4). Read by the installer (B-01), which renders a log
                    forwarder in the observability namespace when a
                    destination is named; no Composition consumes it.
                  properties:
                    destination:
                      type: object
                      properties:
                        endpoint:
                          type: string
                          pattern: '^https://'
                          description: >
                            An HTTPS URL taking newline-delimited JSON over
                            POST, gzip-compressed, with a bearer token from the
                            log-destination credential. Each request carries
                            X-Gentian-Stream: audit or operations. Empty: no
                            forwarder.
                        streams:
                          type: array
                          items:
                            type: string
                            enum: [audit, operations]
                          description: >
                            Which streams to send: audit, the platform's audit
                            records (an envelope with audit true); operations,
                            every other line. Both when absent.
                monitoring:
                  type: object
                  description: >
                    The platform's own metrics and alerts
                    (docs/design/audit-events.md §5). Read by the installer
                    (B-01), which renders kube-prometheus-stack into the
                    observability namespace when enabled; no Composition
                    consumes it.
                  properties:
                    enabled:
                      type: boolean
                      default: false
                      description: >
                        true installs Prometheus, Alertmanager, node-exporter
                        and kube-state-metrics with the platform's alert rules.
                        Every ServiceMonitor and PrometheusRule in the cluster
                        is picked up. About 0.4 CPU, 1.5 GiB and a 20 GiB volume.
                    alerts:
                      type: object
                      properties:
                        webhook:
                          type: string
                          description: >
                            Where Alertmanager sends alerts, as an HTTPS URL
                            taking Alertmanager's webhook body. Empty holds
                            them in Alertmanager.
                metricsServer:
                  type: object
                  description: >
                    The metrics-server the installer puts in kube-system
                    (step A-07) when the cluster does not already serve
                    metrics.k8s.io. Read by the installer from this file; no
                    Composition consumes it.
                  properties:
                    kubeletInsecureTLS:
                      type: boolean
                      description: >
                        true starts metrics-server with --kubelet-insecure-tls:
                        it then accepts whatever certificate answers on a
                        node's kubelet port, and whoever can intercept traffic
                        on the node network can pose as a kubelet, report false
                        metrics and read the token metrics-server presents.

                        Leave it false wherever verification works. It does not
                        work where the kubelets' serving certificates name no
                        IP address and the node names do not resolve from a
                        pod (seen on Infomaniak's managed Kubernetes):
                        metrics-server reaches a kubelet by its InternalIP,
                        finds no such name in the certificate, never becomes
                        Ready, and A-07 runs into its timeout. Its log then
                        says "x509: cannot validate certificate for <ip>
                        because it doesn't contain any IP SANs".
                      default: false
                # ── Cluster modes ────────────────────────────────────────
                # Consumed directly by Compositions, which is why these live on
                # the claim rather than in the Helm values chain. Everything
                # here came from cluster-settings.env, a shell file the
                # installer read and no reconciler could see.
                tenancyMode:
                  type: string
                  description: Whether the cluster hosts one tenant or many.
                  enum:
                    - single
                    - multi
                  default: multi
                mainAddress:
                  type: object
                  description: >
                    The cluster's main address: its bare domain, the first
                    thing anybody typing the cluster's address meets.
                  properties:
                    tenant:
                      type: string
                      pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
                      description: >
                        The one tenant that may put a public website on the
                        main address, under either tenancy mode. Its approver
                        publishes the website (apex: true, with the
                        acknowledgement the director asks for), and the
                        platform keeps /sign-in, /branding/ and the two
                        certificate paths under /.well-known/ there.

                        Unset is the tenancy mode's default: on a
                        single-tenancy cluster the user tenant, whose
                        address the main address is; on a multi-tenancy
                        cluster nobody, and the main address is the sign-in
                        form that asks who is asking.

                        Naming a tenant on a multi-tenancy cluster is the
                        cluster administrator's decision about every tenant:
                        a script on the bare domain can set cookies browsers
                        send to every subdomain, so to every tenant's desktop
                        and sign-in. Name a tenant only where the cluster's
                        operator controls that website's scripts, as on a
                        cluster of one organisation.
                networkMode:
                  type: string
                  description: >
                    How traffic reaches the cluster. tunnel sits behind a
                    reverse proxy and needs no reachable node IP; static-ip
                    requires one and a load balancer in front of it.
                  enum:
                    - tunnel
                    - static-ip
                  default: tunnel
                routingMode:
                  type: string
                  description: Which ingress implementation kernel routes use.
                  enum:
                    - gateway
                    - ingress
                  default: gateway
                secretMode:
                  type: string
                  description: >
                    How the platform makes a credential nothing has stored yet,
                    the kernel's and each app's. derived computes it from the
                    master password and the salt, so a rebuild yields the same
                    values. random draws each one once and keeps it in OpenBao
                    only, so OpenBao has to be backed up: a rebuild does not
                    bring it back. A tenant's backup carries its apps' own
                    secrets, in both modes, and no other credential. Chosen at
                    the first install; a later change leaves every existing
                    credential as it is.
                  enum:
                    - derived
                    - random
                  default: derived

                # ── Sizing and placement ─────────────────────────────────
                # The rest of cluster-settings.env's declared half. Every field
                # here feeds the gentian-cluster-config ConfigMap that
                # Compositions read, which this composition emits.
                nodeIp:
                  type: string
                  description: >
                    Node address that app profiles may reference as ${NODE_IP}
                    in their values. The installer discovers it and writes it
                    here, so it is declared rather than detected at runtime — a
                    Composition cannot read a Node.
                platform:
                  type: string
                  enum:
                    - self-hosted
                    - openstack
                    - infomaniak
                    - hetzner
                    - aws
                    - gcp
                    - azure
                    - none
                    - ""
                  description: >
                    Where this cluster runs. Selects an entry in
                    kernel/platforms.yaml, which is what a provider's edge
                    LoadBalancer needs to be reachable — AWS's target type and
                    scheme, Hetzner's location, OpenStack's health monitor.
                    Detected from the nodes' spec.providerID when absent, so
                    this is an override rather than a required field; "" emits
                    no preset at all.
                platformParams:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: >
                    What a platform's annotations need beyond an address:
                    Hetzner's location, Azure's public-IP resource group. Which
                    keys are required is declared per platform in
                    kernel/platforms.yaml under requiredParams, and a missing
                    one refuses to render rather than emitting a Service that
                    stays Pending with no event explaining why.

                    One key is read on every platform: metallb. MetalLB's
                    namespace is exempt from the baseline policies wherever it
                    exists, unless this is "false".
                controlPlane:
                  type: object
                  description: >
                    What is known about the control plane the platform does not
                    run. A managed API server cannot be inspected from inside
                    the cluster, so the claim records it and pre-flight reads it
                    (scripts/lib/common.sh, check_secrets_at_rest). The claim
                    is committed, so the record is dated and reviewable.
                  properties:
                    secretsAtRest:
                      type: string
                      enum: [provider, cluster, none]
                      description: >
                        Whether Kubernetes Secrets are encrypted at rest in
                        etcd. provider: a managed control plane whose provider
                        states it; say where under evidence. cluster: your own
                        API server runs with --encryption-provider-config.
                        none: not encrypted, or not known. Unset is unknown.
                        Where the API server is visible, what it runs with
                        wins over this field.
                    evidence:
                      type: string
                      description: >
                        Where the provider states it and when it was read, or
                        where the cluster's EncryptionConfiguration lives. Free
                        text; it is what an auditor is shown.
                addressRef:
                  type: string
                  description: >
                    A pre-allocated edge address named the way its provider
                    names it, for the providers that will not take one by IP:
                    AWS Elastic IP allocation ids and Azure public IP names.
                    Everywhere else the address is nodeIp.
                lbProvider:
                  type: string
                  enum: [openstack, metallb, aws, gcp, ""]
                  description: >
                    platform under its former name, from when the edge load
                    balancer was the only thing it selected. Still read, so a
                    claim written before the rename installs unchanged; new
                    claims set platform.
                lbAnnotations:
                  type: string
                  description: >
                    Extra annotations for the edge LoadBalancer Service, as
                    comma-separated key=value pairs. The escape hatch for a
                    platform the table has no entry for, applied on top of
                    whatever that entry contributes.
                storageClass:
                  type: string
                  description: >
                    StorageClass for kernel PVCs. Empty means the cluster's
                    default, which is right for most installs and wrong for any
                    cluster with more than one.
                backup:
                  type: object
                  description: >
                    Where this cluster's backup key lives. The public half is
                    always in OpenBao, because the operator needs it to encrypt.
                    This decides what happens to the private half.
                  properties:
                    escrowIdentity:
                      type: boolean
                      default: true
                      description: >
                        Whether the backup private key is also stored in
                        OpenBao, at gentian-os/kernel/backup/identity. Readable
                        there by the cluster-admin policy and explicitly denied
                        to eso-read, so it cannot be turned into a Kubernetes
                        Secret by anything that can write an ExternalSecret. It
                        means a cluster administrator can read the key, not that
                        the cluster can.

                        True, the default, because the likelier disaster is a
                        lost recovery kit rather than a stolen cluster, and a
                        backup nobody can open is not a backup. A cluster
                        administrator restores with OpenBao credentials alone,
                        and a later --export-recovery-kit reads the key back so
                        the new kit carries it too.

                        False keeps the private key in the recovery kit and
                        nowhere else. Nothing the cluster holds can then open a
                        bundle, so whoever takes the cluster gets ciphertext and
                        a public key — what an attacker who already has the
                        bucket has. The price is that the first kit becomes
                        irreplaceable: losing every copy loses every backup,
                        with no recourse. Choose it when the cluster is the
                        likelier loss and you are certain of your kit custody.
                systemServices:
                  type: object
                  description: >
                    Which system engines run. An engine that is not always
                    on is composed the first time an installed component
                    declares it, and stays until a person purges it; the
                    operator keeps that set. PostgreSQL and the object store
                    run on every cluster and are not named here.
                  properties:
                    always:
                      type: array
                      description: >
                        Engines composed whether or not a component declares
                        them, for a cluster that wants one ready before the
                        first install. A purge does not remove an engine named
                        here.
                      items:
                        type: string
                        enum: ["mariadb", "cache", "authorization", "turn"]
                      x-kubernetes-list-type: set
                llm:
                  type: object
                  description: LLM serving sizing. Hardware-dependent, not stage-dependent.
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    console:
                      type: object
                      description: >
                        The model gateway's own console (models, keys, spend),
                        served at llm.<kernelDomain> for platform
                        administrators.
                      properties:
                        enabled:
                          type: boolean
                          description: >
                            Whether the console has a public route. Off by
                            default: the gateway is a system service, reached
                            from inside the cluster by the apps that declared
                            it and by the operator, and nothing the platform
                            does needs the console.

                            True routes llm.<kernelDomain> to the gateway
                            behind the kernel sign-in, for accounts that may
                            configure the cluster, publishes that host, admits
                            the edge to the gateway and shows such an
                            administrator a tile for it. The route carries the
                            gateway's whole API as well as its pages. Read
                            only when enabled is true.
                          default: false
                    gpuAcceleration:
                      type: boolean
                      description: >
                        Whether this cluster has GPUs to serve models on. With
                        it false the vLLM instance list renders empty, which is
                        what a CPU-only cluster wants; the sizing fields below
                        are read only when it is true.
                      default: false
                    instances:
                      type: array
                      description: >
                        The models this cluster serves on its own GPUs, one
                        vLLM instance each, which the platform runs in the
                        gateway's namespace. The model gateway offers a model
                        per entry, named after modelId in lower case with "/"
                        as "-" (Qwen/Qwen2.5-7B-Instruct is
                        qwen-qwen2.5-7b-instruct), and calls it at the Service
                        vllm-<name>-inference, port 8000, in the gateway's
                        namespace. Removing an entry removes the model from
                        the gateway and stops its instance; the instance's
                        cached weights are kept.

                        Read only when gpuAcceleration is true. An empty list is
                        a CPU-only cluster, which is the default.
                      items:
                        type: object
                        required: [name, modelId]
                        properties:
                          name:
                            type: string
                            description: >
                              Kubernetes name for this instance, and the key its
                              cached weights are kept under.
                            pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                          modelId:
                            type: string
                            description: Hugging Face model id, e.g. Qwen/Qwen2.5-7B-Instruct.
                          gpuMemoryUtilization:
                            type: string
                            description: Fraction of GPU memory vLLM may use, e.g. "0.85".
                            default: "0.85"
                          maxModelLen:
                            type: string
                            description: Context window to serve, in tokens.
                            default: "8192"
                          modelCacheSize:
                            type: string
                            description: PVC size for the downloaded weights.
                            default: 60Gi
                          memoryLimit:
                            type: string
                            description: >
                              Memory the instance may use, e.g. 32Gi. Loading
                              the weights is the peak, about the model's size
                              on disk. Absent takes the platform's
                              default, 20Gi, which fits a 7B-class model.
                          imageTag:
                            type: string
                            description: >
                              Another release of vLLM's image than the
                              platform's, by tag (e.g. v0.32.0-cu129 for a
                              node whose NVIDIA driver predates CUDA 13).
                              Absent runs the release the platform pins.
                          toolCallParser:
                            type: string
                            description: >
                              vLLM tool-call parser for this model, e.g. hermes.
                              Empty disables tool calling.
                      default: []
                    personBudget:
                      type: object
                      description: >
                        What one person may spend at the model gateway: the
                        default for everybody who has no budget of their
                        own. The desktop's assistant and Open WebUI tell the
                        gateway whose request it is; a request over the
                        budget is refused. Absent, nobody is held to a
                        budget per person. Costs are the gateway's prices: a
                        provider's model has one, a model this cluster serves
                        itself costs nothing, and only the limits per minute
                        hold for it.
                      properties:
                        maxBudget:
                          type: number
                          minimum: 0
                          description: Spend per period, in US dollars.
                        budgetDuration:
                          type: string
                          pattern: '^[0-9]+(s|m|h|d|w|mo)$'
                          description: >
                            The period after which spend starts again from
                            nothing, e.g. 30d or 1mo. Absent, it never does.
                        rpmLimit:
                          type: integer
                          minimum: 1
                          description: Requests per minute.
                        tpmLimit:
                          type: integer
                          minimum: 1
                          description: Tokens per minute.
                    providers:
                      type: array
                      description: >
                        External, OpenAI-compatible inference providers this
                        cluster routes to, alongside (or instead of) the vLLM
                        instances above. The model gateway offers one model
                        per entry in models, named <provider>/<model name>, and
                        takes its models from this claim alone: adding an entry
                        adds the model, removing one removes it, and the
                        gateway's console and API can add none. A change
                        replaces the gateway's pods, which read the list when
                        they start.

                        Independent of gpuAcceleration: a CPU-only cluster with
                        no instances is exactly the case these serve. The API
                        key never appears here — it is a kernel credential (see
                        kernel/credentials/credential-requirements.yaml), and
                        apiKeyProperty names which property of it to read.
                      items:
                        type: object
                        required: [name, apiBase, apiKeyProperty, models]
                        properties:
                          name:
                            type: string
                            description: >
                              Short provider id, used as the prefix of every
                              model name it registers (infomaniak/gemma-4-31b)
                              so the gateway's model list says where a model is
                              served from. Also the name of its credential,
                              llm-provider-<name>, hence the length.
                            pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                            maxLength: 40
                          displayName:
                            type: string
                            description: Human name for the provider, for operator-facing output.
                          apiBase:
                            type: string
                            description: >
                              The OpenAI-compatible base URL, up to but not
                              including /chat/completions — the same value an
                              OpenAI client would take. An address on the
                              public internet: the director refuses one that
                              is not (a name or an address inside the cluster
                              or a private network, a port other than 443,
                              credentials in the URL). For Infomaniak AI
                              Services that is
                              https://api.infomaniak.com/2/ai/<product-id>/openai/v1,
                              where the path segment is the AI Tools product id
                              (GET /1/ai returns it), not an account or user id.
                            pattern: '^https://.+'
                          apiKeyProperty:
                            type: string
                            description: >
                              The property of the shared provider credential
                              (OpenBao, gentian-os/kernel/llm-providers) that
                              holds this provider's API token. It is the
                              provider's own and follows from its name: the
                              name with "-" as "_", and "_api_key"
                              (infomaniak_api_key). A provider that names
                              anything else gets no model at the gateway, so
                              that no provider reads another's token. The token
                              is entered in the administration console under
                              the credential llm-provider-<name>, which the
                              Cluster composition declares for every provider
                              listed here. Until it is supplied the models are
                              listed and a call to one is answered with an
                              authentication error. The gateway restarts by
                              itself when the token is supplied or changed.
                            pattern: '^[a-z0-9_]+$'
                          models:
                            type: array
                            description: >
                              The provider's models to expose. An empty list
                              offers nothing, which is how a provider is
                              staged before its credential exists.
                            items:
                              type: object
                              required: [name, model]
                              properties:
                                name:
                                  type: string
                                  description: >
                                    Name this model is offered under, after the
                                    provider prefix. Tenant-facing — it is what
                                    Open WebUI lists — so prefer a stable short
                                    name over the upstream id.
                                  pattern: '^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'
                                model:
                                  type: string
                                  description: >
                                    The model id the provider expects, verbatim
                                    (e.g. google/gemma-4-31B-it). Passed through
                                    with an openai/ prefix, because the endpoint
                                    is OpenAI-compatible whoever serves it.
                                maxTokens:
                                  type: integer
                                  description: >
                                    Context window to advertise. Omitted leaves
                                    LiteLLM's own default, which is a guess.
                                mode:
                                  type: string
                                  description: >
                                    What the model does. Embedding models must
                                    say so — routed as chat they fail at the
                                    first request rather than at registration.
                                  enum: [chat, completion, embedding]
                                  default: chat
                            default: []
                      default: []
                tenantDefaults:
                  type: object
                  description: >
                    Resource defaults applied to every tenant namespace. Usually
                    identical across a deployment's clusters, so they belong in
                    profiles/_base.yaml rather than being restated per cluster —
                    they are on the claim so a cluster that genuinely differs
                    can say so.
                  properties:
                    limitRange:
                      type: object
                      properties:
                        defaultCpu:
                          type: string
                          default: 500m
                        defaultMemory:
                          type: string
                          default: 512Mi
                        defaultRequestCpu:
                          type: string
                          default: 100m
                        defaultRequestMemory:
                          type: string
                          default: 128Mi

                # ── OIDC write path ──────────────────────────────────────
                oidc:
                  type: object
                  description: >
                    Human write access to OpenBao, federated from Keycloak. When
                    unset the OIDC backend is not created and the only write
                    path is the installer's bootstrap token — which §7 requires
                    be revoked, so leaving this unset means no day-2 writes at
                    all. Set it once Keycloak is reachable.
                  properties:
                    discoveryUrl:
                      type: string
                      description: >
                        The realm's OIDC discovery URL. Its presence is what
                        creates the backend, so an incomplete block stays inert
                        rather than half-configuring an auth method.
                    clientId:
                      type: string
                      default: openbao
                    clientSecretRef:
                      type: string
                      description: >
                        Name of the Secret holding the client secret, in the
                        OpenBao namespace. A reference, never the value — a
                        secret in a spec field is the one thing §7 prohibits
                        outright.
                      default: openbao-oidc-client
                    externalUrl:
                      type: string
                      description: OpenBao's browser-reachable URL, for the OIDC redirect.
                    clusterAdminGroup:
                      type: string
                      description: >
                        Keycloak group whose members receive the cluster-admin
                        policy. Leave unset: the composition uses
                        spec.platformRoles.admin, which is the group the
                        platform actually provisions the administrator into.

                        No default, and that is the point. This carried
                        "/gentian:platform:superadmin" before S1 renamed the
                        role, and the API server had already materialised that
                        onto every composite — where it stayed, because a
                        changed default does not reach an object that already
                        has the field. The result was silent and total: the
                        administrator signed in, held gentian:platform:admin,
                        and OpenBao's cluster-admin role wanted a group nobody
                        was in, so no exchange ever granted cluster-admin and
                        the handover proof was never written.

                        Two fields that must agree will eventually disagree.
                        Derived from platformRoles.admin so there is only one.
                    additionalAudiences:
                      type: array
                      items:
                        type: string
                      description: >
                        Further client IDs whose tokens OpenBao accepts, beyond
                        clientId. A console relaying a person's own token to the
                        custodian presents whatever audience that token
                        carries; without it listed here every such request fails
                        the exchange, with "the token's audience is not one this
                        cluster's roles accept". Group membership still gates
                        what a token can do — this only decides which clients
                        may present one.


                        gentian-director is the audience of the zone token the
                        edge forwards, which is what a component behind the edge
                        relays.
                      default:
                        - gentian-director
                    realm:
                      type: string
                      description: >
                        The shared Keycloak realm holding platform users. The
                        OpenBao client, its mappers and the admin groups are
                        created here.
                      default: kernel
                    tenantAdminGroup:
                      type: string
                      description: >
                        Group pattern whose members receive the tenant-admin
                        policy. A glob, because the kernel realm imports each
                        tenant's own admins group by name rather than collecting
                        everyone into one — so the pattern matches per-tenant
                        groups instead of naming a single shared one.

                        Membership alone grants nothing: the policy templates its
                        path from the tenant claim, so a member without one
                        reaches no tenant.
                      default: "/gentian:tenant:*:admins"
                    tenantClaim:
                      type: string
                      description: >
                        Token claim naming the tenant a user administers. It is
                        mapped into OpenBao alias metadata, which is both what
                        the tenant-admin policy templates its path from and what
                        the custodian filters the catalogue by — so the
                        write path and the read path cannot disagree.
                      default: tenant

                # ── Trust anchor ─────────────────────────────────────────
                certificates:
                  type: object
                  description: >
                    How this cluster issues TLS certificates. The dimension that
                    decides whether an install on an internal domain is possible
                    at all — an installer that can only succeed with public ACME
                    is not a self-hostable installer (§9).
                  properties:
                    issuerMode:
                      type: string
                      description: >
                        acme-dns01   public DNS, wildcard capable, needs a DNS
                                     provider credential.
                        acme-http01  public DNS reachable on :80, no wildcards.
                        private-ca   an existing CA the operator supplies.
                        self-signed  a CA this cluster generates. Offline,
                                     instant, and not publicly trusted — the
                                     mode for an internal domain.
                      enum:
                        - acme-dns01
                        - acme-http01
                        - private-ca
                        - self-signed
                      default: acme-dns01
                    acmeEnv:
                      type: string
                      description: >
                        Which Let's Encrypt endpoint the ACME issuers use, when
                        issuerMode is one of the acme- modes.

                        staging      untrusted certificates, generous rate
                                     limits — what a cluster being rebuilt
                                     repeatedly wants.
                        production   trusted certificates, five duplicate
                                     certificates per week per name.
                        both         render both issuers and let a Certificate
                                     name the one it wants.

                        Read by the installer from this file when it applies
                        the cluster issuers (step A-09), before the Cluster XR
                        exists — the same way it reads networkMode and nodeIp.
                        No Composition consumes it; the cluster issuers are
                        shell-applied, and this is where the cluster says which
                        endpoint it is on rather than the installer's pointer
                        file saying so on its behalf.
                      enum:
                        - staging
                        - production
                        - both
                      default: production
                    dns01RecursiveNameservers:
                      type: string
                      description: >
                        Where cert-manager checks that a DNS-01 challenge record
                        has propagated, as comma-separated host:port resolvers,
                        or "cluster" for the cluster's own DNS.

                        Public resolvers by default, because the cluster's own
                        DNS cannot answer for the zone: the CoreDNS hairpin
                        (docs/design/routing.md) serves the kernel domain from a
                        hosts block, and a hosts entry answers every query type
                        for its name — the zone apex's SOA and NS come back
                        empty, cert-manager finds no authoritative nameservers,
                        and every challenge waits on "not yet propagated"
                        forever. Set "cluster" only for a zone public resolvers
                        cannot see, such as an internal rfc2136 server.

                        Read by the installer when it installs cert-manager
                        (step A-02), which passes it to the release it manages.
                      pattern: '^(cluster|[^,\s]+(,[^,\s]+)*)$'
                      default: "1.1.1.1:53,8.8.8.8:53"
                    dnsProvider:
                      type: string
                      description: >
                        Who hosts the zone, when issuerMode is acme-dns01.

                        Separate from issuerMode because they answer different
                        questions — how control is proved, and by whom — and
                        folding them together is what made acme-dns01 mean
                        Cloudflare. Each value is an entry in
                        kernel/platforms.yaml carrying the cert-manager solver,
                        the external-dns provider and the one credential both
                        read.

                        Independent of `platform`: a Hetzner cluster on a
                        Cloudflare zone is ordinary.
                      enum:
                        - cloudflare
                        - route53
                        - clouddns
                        - azuredns
                        - rfc2136
                        - hetzner
                        - infomaniak
                        - none
                      default: cloudflare
                    dnsParams:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                      description: >
                        What a provider's solver needs beyond its credential:
                        Route 53's region and hosted zone, Cloud DNS's project,
                        Azure's subscription and resource group, the nameserver
                        for a self-hosted zone. Required keys are declared per
                        provider in kernel/platforms.yaml.
                    dnsZones:
                      type: array
                      description: >
                        Zones external-dns may write besides the kernel
                        domain's: the registrable domains of the tenants this
                        cluster serves on a domain of their own (a
                        TenantDomain whose zone is not the kernel domain's).
                        external-dns filters by zone, and a record outside the
                        filter is skipped without a word; the operator routes
                        such a tenant and its certificate is issued, and
                        nothing resolves. The DNS credential has to cover
                        every zone listed. Read by the installer when it
                        installs external-dns (step B-01).
                      items:
                        type: string
                        pattern: '^([a-z0-9]([-a-z0-9]*[a-z0-9])?\.)+[a-z]{2,}$'
                    caBundleSecretRef:
                      type: object
                      description: >
                        Where the trust anchor's certificate lives, so consumers
                        that validate kernel hostnames can be given it. Defaults
                        to what the self-signed mode produces.
                      properties:
                        name:
                          type: string
                          default: gentian-root-ca-tls
                        namespace:
                          type: string
                          default: kernel-edge

                # ── Mail ─────────────────────────────────────────────────────
                mail:
                  type: object
                  description: >
                    Where the cluster sends mail. The relay's credentials are
                    NOT here — they are the smtp-relay CredentialRequirement,
                    and this carries only its address and transport settings.
                  properties:
                    serviceMode:
                      type: string
                      description: >
                        external relays through an upstream provider; system
                        runs Postfix and Dovecot in-cluster, in system-mail and
                        system-mail-dmz.

                        This was called "kernel", which was wrong under the
                        layout: the stack is a system-tier service and no
                        kernel namespace is involved. There is no alias — a
                        claim that still says kernel is refused, which is
                        better than one that silently means something else.
                      enum:
                        - external
                        - system
                      default: external
                    egressHost:
                      type: string
                      description: >
                        The hostname outbound mail leaves from, when this cluster sends from
                        an address it owns rather than the shared egress.

                        Postfix greets remote servers with this name and is pinned to the node
                        carrying that floating IP, because they are one decision: an address
                        that can move is an address whose PTR and SPF record stop matching.

                        It must resolve to the sending address, and that address must resolve
                        back to this name. It is not the MX name — mail arrives on the load
                        balancer and leaves via the node.

                        Empty means the shared egress address or a smarthost relay.
                    host:
                      type: string
                      description: Relay hostname. Required when serviceMode is external.
                    port:
                      type: integer
                      default: 587
                    ssl:
                      type: boolean
                      description: Implicit TLS on connect, as opposed to STARTTLS.
                      default: false
                    starttls:
                      type: boolean
                      default: true

            status:
              type: object
              properties:
                platform:
                  type: object
                  description: >-
                    The platform this cluster runs, written by the operator
                    from its own build: the version line every compatibility
                    check compares against, and the build. Read, never set.
                  properties:
                    version:
                      type: string
                      description: The platform's version as released, 0.5.0, or 0.5.0-dev for a development build.
                    versionLine:
                      type: string
                      description: The major and minor of the release the operator is built towards, "0.5".
                    build:
                      type: string
                      description: The commit the operator was built from, or its release version.
                    reportedAt:
                      type: string
                      description: When the operator last wrote this.
                    latestRelease:
                      type: string
                      description: The newest release the platform's feed publishes, "0.6.0"; what a person compares versionLine with.
                    latestReleaseNotes:
                      type: string
                      description: Where that release's notes are.
                kernelNamespaces:
                  type: array
                  description: Namespaces provisioned by this Cluster XR.
                  items:
                    type: string
