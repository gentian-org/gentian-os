# Suze XR claim — Gentian IdP (Keycloak + OpenFGA), Stage 1.
#
# **Suze** = **S**ecure **U**niversal **Z**ero-trust **E**nvironment — the Gentian
# platform identity and authorization plane (Keycloak + OpenFGA).
#
# Prerequisites:
#   - provider-helm Healthy (install.sh Step 13)
#   - InfraData PostgreSQL Ready (shared DB for Keycloak + OpenFGA)
#   - kernel/appsets/09-suze.yaml synced ESO + values ConfigMaps
apiVersion: gentianos.io/v1alpha1
kind: Suze
metadata:
  name: dev-suze
  namespace: crossplane-system
spec:
  environment: dev
  idpNamespace: platform-kernel
  compositeDeletePolicy: Background
  openfga:
    chartVersion: "0.3.10"
