# InfraData XR claim for the dev environment.
# Provisions shared kernel PostgreSQL, MariaDB, Redis, and MinIO via provider-helm
# Release MRs composed by infra-data (valuesFrom ConfigMaps + ESO Secrets synced by Argo).
#
# Prerequisites:
#   - provider-helm Healthy (install.sh Step 13)
#   - ESO ExternalSecrets + values ConfigMaps in gentian-infra-dev (08-infra-data AppSet)
#   - OpenBao paths gentian-os/kernel/database/{postgresql,mariadb}, cache/redis, storage/minio
#
# Helm release names:
#   infra-postgresql-dev / infra-mariadb-dev — legacy Release names for DB consumers
#   redis-dev / minio-dev — cache and object storage Service DNS
apiVersion: gentianos.io/v1alpha1
kind: InfraData
metadata:
  name: dev-infra-data
  namespace: crossplane-system
spec:
  environment: dev
  compositeDeletePolicy: Background
