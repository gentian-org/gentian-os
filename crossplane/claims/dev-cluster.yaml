# Cluster XR claim for the dev/staging environment.
# Applied by make e2e-p1 to provision kernel structural resources via Crossplane.
#
# Prerequisites:
#   - Crossplane core installed (make e2e-p0)
#   - Providers and ProviderConfigs applied (crossplane/providers/)
#   - XRD and Composition applied (crossplane/xrds/, crossplane/compositions/)
#   - K8s Secret 'gentian-os-master-password' in namespace 'crossplane-system'
#     with key 'password' containing the cluster master password
apiVersion: gentianos.io/v1alpha1
kind: Cluster
metadata:
  name: dev-cluster
  namespace: crossplane-system
spec:
  kernelDomain: desk.gentian.org
  masterPasswordSecretRef:
    name: gentian-os-master-password
    namespace: crossplane-system
  openbao:
    server: http://openbao.openbao.svc.cluster.local:8200
    kvMount: secret
    authMount: kubernetes
    kubernetesHost: https://kubernetes.default.svc
  argocd:
    namespace: argocd
    sourceRepos: []
  eso:
    namespace: external-secrets
    serviceAccount: external-secrets
  certManager:
    letsencryptEmail: admin@desk.gentian.org
    ingressClassName: public
  compositeDeletePolicy: Background
