---
# ProviderConfig for provider-kubernetes.
# Uses the in-cluster service account (default); no extra secret needed when
# running inside the same cluster.
apiVersion: kubernetes.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: kubernetes
spec:
  credentials:
    source: InjectedIdentity
---
# ProviderConfig for provider-helm.
# Deploys Helm releases into the local cluster using the pod's service account.
apiVersion: helm.crossplane.io/v1beta1
kind: ProviderConfig
metadata:
  name: kubernetes
spec:
  credentials:
    source: InjectedIdentity
---
# ProviderConfig for provider-helm, for a tenant's apps and nothing else.
# Its kubeconfig (written by B-05) keeps the pod's own token and asks the API
# server to act as provider-helm-tenant-apps, which holds rights only inside
# tenant namespaces (provider-rbac.yaml). Releases that name it skip creating
# their namespace: that account may not, and the tenant's namespace exists.
apiVersion: helm.crossplane.io/v1beta1
kind: ProviderConfig
metadata:
  name: tenant-apps
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: kernel-provisioning
      name: provider-helm-tenant-apps
      key: kubeconfig
---
# ProviderConfig for provider-vault (OpenBao-compatible).
# provider-vault v3.x is Terraform/upjet-based and does not support
# InjectedIdentity. A periodic token with the crossplane-write policy is
# minted by install.sh (bootstrap_openbao_for_crossplane) and stored in
# the openbao-crossplane-token Secret in kernel-provisioning.
apiVersion: vault.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: openbao
spec:
  # Address of the OpenBao server reachable from within the cluster.
  address: https://openbao.kernel-secrets.svc.cluster.local:8200
  # Verified: the provider's pod trusts the vault's CA openbao-ca through
  # VAULT_CACERT (vault-config in providers.yaml).
  skip_tls_verify: false
  credentials:
    source: Secret
    secretRef:
      namespace: kernel-provisioning
      name: openbao-crossplane-token
      key: credentials
