---
# Crossplane Providers required for kernel and tenant-app provisioning.
# Apply once per cluster, before applying XRDs and Compositions.
#
# Provider versions are pinned; bump in sync with the Composition image refs.
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-go-templating
spec:
  package: xpkg.upbound.io/crossplane-contrib/function-go-templating:v0.7.0
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-extra-resources
spec:
  # Fetches arbitrary cluster resources into the Composition pipeline context.
  # Used by App Compositions to load the referenced AppProfile at render time.
  package: xpkg.upbound.io/crossplane-contrib/function-extra-resources:v0.3.0
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-auto-ready
spec:
  # Marks the XR Ready when all composed resources have Ready: True.
  # Required in function pipeline mode (Crossplane v1.14+).
  package: xpkg.upbound.io/crossplane-contrib/function-auto-ready:v0.3.0
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-sequencer
spec:
  # Delays composed resources until dependency resources are Ready.
  # Used by tenant-default to gate App claims on identity Jobs.
  package: xpkg.upbound.io/crossplane-contrib/function-sequencer:v0.3.0
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-helm
spec:
  # Deploys Helm charts into the local cluster (Pattern B: secrets-hostile charts).
  # Uses InjectedIdentity for in-cluster access — see provider-rbac.yaml for why
  # that requires an explicit grant.
  package: xpkg.upbound.io/crossplane-contrib/provider-helm:v0.20.4
  runtimeConfigRef:
    apiVersion: pkg.crossplane.io/v1beta1
    kind: DeploymentRuntimeConfig
    name: helm-config
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-kubernetes
spec:
  package: xpkg.upbound.io/crossplane-contrib/provider-kubernetes:v0.15.0
  runtimeConfigRef:
    apiVersion: pkg.crossplane.io/v1beta1
    kind: DeploymentRuntimeConfig
    name: kubernetes-config
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-vault
spec:
  # upbound/provider-vault wraps the OpenBao-compatible Vault API.
  package: xpkg.upbound.io/upbound/provider-vault:v3.0.7
  runtimeConfigRef:
    apiVersion: pkg.crossplane.io/v1beta1
    kind: DeploymentRuntimeConfig
    name: vault-config
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-http
spec:
  # crossplane-contrib/provider-http: full CRUD against arbitrary HTTP/REST APIs.
  package: xpkg.upbound.io/crossplane-contrib/provider-http:v1.0.14
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-keycloak
spec:
  # crossplane-contrib/provider-keycloak: Upjet bridge over mrparkers/keycloak TF provider.
  # Manages Keycloak OIDC clients, protocol mappers, and client scopes via GitOps.
  package: xpkg.upbound.io/crossplane-contrib/provider-keycloak:v2.19.0
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: kubernetes-config
spec:
  # Pin a stable ServiceAccount name. By default Crossplane names the provider's
  # SA after its revision hash (provider-kubernetes-c3daebeb97e2), which changes
  # on every provider upgrade — a static ClusterRoleBinding written against that
  # name silently stops applying the next time the package is bumped, and the
  # provider loses its permissions with no error until a composition fails.
  # provider-rbac.yaml binds this fixed name instead.
  serviceAccountTemplate:
    metadata:
      name: provider-kubernetes
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: helm-config
spec:
  # Same reasoning as kubernetes-config above.
  serviceAccountTemplate:
    metadata:
      name: provider-helm
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: vault-config
spec:
  deploymentTemplate:
    spec:
      selector:
        matchLabels:
          pkg.crossplane.io/provider: provider-vault
          pkg.crossplane.io/revision: provider-vault-7fe7f487ba59
      template:
        metadata:
          labels:
            pkg.crossplane.io/provider: provider-vault
            pkg.crossplane.io/revision: provider-vault-7fe7f487ba59
        spec:
          containers:
            - name: package-runtime
              env:
                # provider-vault reaches OpenBao at its in-cluster Service name,
                # where it serves a self-signed certificate. Unlike the operator,
                # this container is not templated and has no trust anchor mounted,
                # so there is nothing for it to verify against and this cannot
                # simply be dropped.
                #
                # Closing it means giving the provider the same CA bundle the
                # operator gets from trustAnchorSecret. Tracked rather than left
                # to look deliberate.
                - name: VAULT_SKIP_VERIFY
                  value: "true"
