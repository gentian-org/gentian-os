---
# RBAC for the Crossplane providers that act on this cluster's API.
#
# Why this file exists
# --------------------
# provider-kubernetes and provider-helm authenticate with
# `credentials.source: InjectedIdentity` (see provider-configs.yaml), meaning
# they call the API server as their own ServiceAccount. Crossplane creates that
# ServiceAccount and binds it to a generated role — but that role only covers
# the provider's OWN managed resources (Object, Release, ProviderConfig...). It
# grants nothing on the objects those resources are supposed to manage.
#
# Without the bindings below, every composed Object fails at the observe step:
#
#   observe failed: cannot get object: namespaces "kernel-control" is forbidden:
#   User "system:serviceaccount:kernel-provisioning:provider-kubernetes-<hash>"
#   cannot get resource "namespaces" in API group "" in the namespace
#   "kernel-control"
#
# The XCluster then sits at Ready=False/Creating until the install times out —
# or, since composed_permission_errors landed (scripts/lib/bootstrap.sh), the
# wait ends early and names the missing rule instead of exhausting the timeout.
#
# provider-kubernetes: scoped
# ----------------------------
# Bound to gentian-provider-kubernetes below, generated from
# provider-kubernetes-kinds.yaml — see that file for where the kind list came
# from and what keeps it current. It composes ordinary kinds (namespaces,
# config, secrets, jobs, routes, the platform's supporting CRs) and none of
# them are RBAC, which is what makes scoping it safe: it can never be asked to
# create a permission broader than its own.
#
# provider-helm: cluster-admin for the kernel's charts, narrow for tenant apps
# ---------------------------------------------------------------------------
# provider-helm installs the kernel's charts, and some ship their own
# ClusterRoles — cert-manager's controllers among them, which need
# cluster-wide `secrets` read to do their job. Kubernetes enforces escalation
# prevention: nothing can create a role granting a permission it does not
# itself hold. So the identity that installs them stays cluster-admin; scoping
# it needs the platform to own those charts' RBAC.
#
# A tenant's apps are installed under another identity. Their Releases name
# the ProviderConfig tenant-apps, whose kubeconfig (written by B-05) makes
# provider-helm act as the ServiceAccount provider-helm-tenant-apps below:
# every object a tenant chart renders is created, changed and deleted as that
# account. It holds nothing cluster-wide. In a tenant namespace, and only
# there, the operator binds it to gentian-tenant-apps-helm
# (internal/controller/tenant_apps_helm.go), which allows the namespaced
# kinds tenant charts render and no others: no NetworkPolicy, quota, limit,
# route or external secret of the platform's. It is one provider process with
# two identities, not two providers: Crossplane installs a provider's CRDs
# once, so a second provider-helm package cannot run beside the first.
#
# The subjects reference the fixed ServiceAccount names pinned by the
# DeploymentRuntimeConfigs in providers.yaml, NOT the revision-hashed defaults,
# so these bindings survive provider upgrades.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gentian-provider-kubernetes
  labels:
    app.kubernetes.io/managed-by: gentian-os
rules:
  # BEGIN generated rules — from provider-kubernetes-kinds.yaml, do not edit
  - apiGroups: ['']
    resources: ['configmaps', 'limitranges', 'namespaces', 'resourcequotas', 'secrets', 'services']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
  - apiGroups: ['argoproj.io']
    resources: ['applications', 'applicationsets', 'appprojects']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
  - apiGroups: ['batch']
    resources: ['jobs']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
  - apiGroups: ['cert-manager.io']
    resources: ['certificates', 'clusterissuers']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
  - apiGroups: ['external-secrets.io']
    resources: ['clusterexternalsecrets', 'clustersecretstores', 'externalsecrets']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
  - apiGroups: ['gentianos.io']
    resources: ['integrationbindings']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
  - apiGroups: ['generators.external-secrets.io']
    resources: ['passwords']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
  - apiGroups: ['gateway.envoyproxy.io']
    resources: ['backendtrafficpolicies']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
  - apiGroups: ['gateway.networking.k8s.io']
    resources: ['httproutes', 'referencegrants']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
  - apiGroups: ['pkg.crossplane.io']
    resources: ['imageconfigs']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
  - apiGroups: ['postgresql.cnpg.io']
    resources: ['databases']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
# END generated rules
---
# A new name, not a reused one. roleRef on a ClusterRoleBinding is immutable —
# the API server refuses to move an existing binding from cluster-admin to
# this role, confirmed with a server-side dry run against a real cluster
# before this line was written. A step that re-applied the old name here would
# fail outright rather than narrow anything.
#
# A-02's apply() deletes the old cluster-admin-bound name before applying this
# file, which is the half that actually matters: creating this binding without
# removing the old one would leave the wide grant alive alongside the scoped
# one, narrowing nothing.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crossplane-provider-kubernetes-scoped
  labels:
    app.kubernetes.io/managed-by: gentian-os
subjects:
  - kind: ServiceAccount
    name: provider-kubernetes
    namespace: kernel-provisioning
roleRef:
  kind: ClusterRole
  name: gentian-provider-kubernetes
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crossplane-provider-helm-admin
  labels:
    app.kubernetes.io/managed-by: gentian-os
subjects:
  - kind: ServiceAccount
    name: provider-helm
    namespace: kernel-provisioning
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
# The account tenant apps are installed as (see the header). provider-helm
# acts as it by impersonation and uses no token of its own, so none is mounted
# or minted for it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: provider-helm-tenant-apps
  namespace: kernel-provisioning
  labels:
    app.kubernetes.io/managed-by: gentian-os
automountServiceAccountToken: false
---
# What a tenant chart may do in its own namespace: the kinds the tenant
# charts of the catalog render (docs/design/security.md §12.4 lists them),
# and the reads Helm's wait needs. Bound per tenant namespace, never by a
# ClusterRoleBinding. A chart's own Roles and RoleBindings are allowed because
# escalation prevention holds them to a subset of this.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gentian-tenant-apps-helm
  labels:
    app.kubernetes.io/managed-by: gentian-os
rules:
  - apiGroups: ['']
    resources: ['configmaps', 'persistentvolumeclaims', 'secrets', 'serviceaccounts', 'services']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
  - apiGroups: ['apps']
    resources: ['deployments', 'statefulsets']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
  - apiGroups: ['batch']
    resources: ['jobs']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
  - apiGroups: ['networking.k8s.io']
    resources: ['ingresses']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
  - apiGroups: ['rbac.authorization.k8s.io']
    resources: ['rolebindings', 'roles']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
  # Read only: what Helm watches to tell that a release's workloads are up.
  - apiGroups: ['']
    resources: ['pods']
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['apps']
    resources: ['replicasets']
    verbs: ['get', 'list', 'watch']
