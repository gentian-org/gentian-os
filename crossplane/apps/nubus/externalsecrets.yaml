# =============================================================================
# Nubus — ESO ExternalSecrets (Pattern A + Pattern B migration)
#
# Two ExternalSecrets in the gentian-dev namespace:
#
#   nubus-credentials       (Pattern A) — PostgreSQL passwords read by the chart
#                           via existingSecret. Keys use dash-format to match the
#                           keyMapping entries in values/dev.yaml.
#
#   nubus-sensitive-values  (Pattern B migration) — All remaining sensitive Helm
#                           values (masterPassword, SMTP auth, LDAP admin, NATS
#                           passwords, Keycloak admin, ldapSearchUser passwords,
#                           portal/selfservice provisioning API passwords).
#                           Materialised as a single sensitive-values.yaml key
#                           consumed via provider-helm Release.spec.forProvider.
#                           valuesFrom[].secretKeyRef.
#
# Sources:
#   - gentian-os/kernel/identity/nubus  (all nubus-specific credentials)
#   - gentian-os/kernel/mail/postfix    (SMTP relay password)
# =============================================================================
---
# Pattern A: PostgreSQL passwords consumed by the chart via existingSecret refs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nubus-credentials
  namespace: gentian-dev
  annotations:
    # Ensure this Secret is ready before the nubus Release is applied.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: nubus-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: pg-selfservice-password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: pg_selfservice_password
    - secretKey: pg-authsession-password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: pg_authsession_password
    - secretKey: pg-keycloak-password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: pg_keycloak_password
    - secretKey: pg-keycloak-extensions-password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: pg_keycloak_extensions_password
    - secretKey: pg-guardian-password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: pg_guardian_password
    - secretKey: pg-notifications-password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: pg_notifications_password
    - secretKey: default-admin-password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: admin_password
---
# Pattern B migration: all nubus Helm sensitive values as a single YAML Secret
# consumed via provider-helm Release valuesFrom.secretKeyRef.
#
# The template builds a Helm values file with exactly the fields that the
# provider-helm Release injects via set_sensitive. The ldapSearchUsers list is
# reproduced in full (username + lastname + password) because Helm list merge
# replaces the entire list — the plain values ConfigMap must NOT also set this
# list.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nubus-sensitive-values
  namespace: gentian-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: nubus-sensitive-values
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # provider-helm reads this key as a Helm values file (merged last → wins).
        sensitive-values.yaml: |
          global:
            secrets:
              masterPassword: {{ .master_password | quote }}
          keycloak:
            keycloak:
              auth:
                password: {{ .keycloak_admin_password | quote }}
          nubusUmcServer:
            smtp:
              auth:
                password: {{ .smtp_password | quote }}
          nubusKeycloakExtensions:
            smtp:
              auth:
                password: {{ .smtp_password | quote }}
          nubusStackDataUms:
            templateContext:
              initialPasswordAdministrator: {{ .admin_password | quote }}
              oxSystemUserPassword: "dummy"
              ldapAdminPassword: {{ .ldap_admin_password | quote }}
              # Full list required: Helm list merge replaces the entire array.
              # Usernames/lastnames duplicated here from values/dev.yaml.
              ldapSearchUsers:
                - username: ldapsearch_keycloak
                  lastname: LDAP-Search-User
                  password: {{ .ldapsearch_keycloak | quote }}
                - username: ldapsearch_nextcloud
                  lastname: LDAP-Search-User
                  password: {{ .ldapsearch_nextcloud | quote }}
                - username: ldapsearch_dovecot
                  lastname: LDAP-Search-User
                  password: {{ .ldapsearch_dovecot | quote }}
                - username: ldapsearch_postfix
                  lastname: LDAP-Search-User
                  password: {{ .ldapsearch_postfix | quote }}
          nubusLdapServer:
            ldapServer:
              auth:
                password: {{ .ldap_admin_password | quote }}
          nubusUdmListener:
            nats:
              auth:
                password: {{ .nats_udm_listener_password | quote }}
          nubusProvisioning:
            api:
              nats:
                auth:
                  password: {{ .nats_api_password | quote }}
            dispatcher:
              nats:
                auth:
                  password: {{ .nats_dispatcher_password | quote }}
            udmTransformer:
              nats:
                auth:
                  password: {{ .nats_udm_transformer_password | quote }}
            prefill:
              nats:
                auth:
                  password: {{ .nats_prefill_password | quote }}
          nubusPortalConsumer:
            provisioningApi:
              auth:
                password: {{ .portal_consumer_api_password | quote }}
          nubusSelfServiceConsumer:
            provisioningApi:
              auth:
                password: {{ .selfservice_consumer_api_password | quote }}
  data:
    # ── identity/nubus ──────────────────────────────────────────────────────
    - secretKey: master_password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: master_password
    - secretKey: keycloak_admin_password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: keycloak_admin_password
    - secretKey: admin_password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: admin_password
    - secretKey: ldap_admin_password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: ldap_admin_password
    - secretKey: ldapsearch_keycloak
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: ldapsearch_keycloak
    - secretKey: ldapsearch_nextcloud
      remoteRef:
        key: gentian-os/kernel/apps/nextcloud
        property: ldapsearch_password
    - secretKey: ldapsearch_dovecot
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: ldapsearch_dovecot
    - secretKey: ldapsearch_postfix
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: ldapsearch_postfix
    - secretKey: nats_udm_listener_password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: nats_udm_listener_password
    - secretKey: nats_api_password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: nats_api_password
    - secretKey: nats_dispatcher_password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: nats_dispatcher_password
    - secretKey: nats_udm_transformer_password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: nats_udm_transformer_password
    - secretKey: nats_prefill_password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: nats_prefill_password
    - secretKey: portal_consumer_api_password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: portal_consumer_api_password
    - secretKey: selfservice_consumer_api_password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: selfservice_consumer_api_password
    # ── mail — SMTP credential UMC presents to local postfix (staticAuthDB) ──
    - secretKey: smtp_password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: smtp_password
---
# =============================================================================
# Nubus extra-credentials secrets — restored to active Crossplane path
# (formerly under kernel/services/nubus/secrets/dev/, deployed by inactive
# 21-nubus.yaml stub AppSet).  Required by crossplane/apps/nubus/values/_base.yaml.
# =============================================================================
---
# SecretStore (fake provider) — supplies the static, non-sensitive MinIO
# access key id "ums_user" so it can be bundled with the secret access key
# from OpenBao into the portal-object-storage-credentials Secret.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: nubus-static
  namespace: gentian-dev
spec:
  provider:
    fake:
      data:
        - key: portal/object-storage/access_key_id
          value: "ums_user"
---
# Combines static MinIO username with the secret access key from OpenBao.
# Referenced by nubusPortalServer.objectStorage.auth.existingSecret.name and
# nubusPortalConsumer.objectStorage.auth.existingSecret.name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: portal-object-storage-credentials
  namespace: gentian-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: portal-object-storage-credentials
    creationPolicy: Owner
  data:
    - secretKey: access_key_id
      sourceRef:
        storeRef:
          name: nubus-static
          kind: SecretStore
      remoteRef:
        key: portal/object-storage/access_key_id
    - secretKey: secret_access_key
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: minio_ums_secret_access_key
---
# Keycloak bootstrap LDAP search credential — referenced by
# nubusKeycloakBootstrap.ldap.auth.existingSecret.name. Chart expects key "password".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-bootstrap-ldap-credentials
  namespace: gentian-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: ums-keycloak-bootstrap-ldap-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: gentian-os/kernel/identity/nubus
        property: ldapsearch_keycloak
