    # On upgrade (object already exists), create_or_modify falls back to PUT.
    # UDM TrueFalseUp syntax rejects JSON `true` (from YAML bool True) with "invalid value: ".
    # Deleting the profile first guarantees step 32 uses POST (create), which succeeds.
    # Reference: opendesk-nubus:1.15.2 /plugins/udm-data-loader/32-ox-connector-opendesk_on.yaml
