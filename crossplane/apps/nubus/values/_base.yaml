# =============================================================================
# Nubus (UMS) app-level defaults (all environments)
# =============================================================================
# Layer 2. {env}/values.yaml provides:
#   global.secrets.masterPassword,
#   all auth.password and existingSecret.keyMapping.password fields (SOPS),
#   all postgresql.connection.host fields (env-specific DNS),
#   nubusUmcServer.smtp.connection (localhost placeholder, env-specific),
#   nubusPortalServer/Consumer.objectStorage.endpoint (env-specific DNS),
#   nubusLdapServer persistence/resources, keycloak.resources,
#   nubusStackDataUms.templateContext.initialPasswordAdministrator,
#   nubusStackDataUms.templateContext.oxSystemUserPassword,
#   nubusStackDataUms.templateContext.ldapSearchUsers (list with passwords)
# =============================================================================

global:
  domain: desk.gentian.org
  nubusDeployment: true
  ingressClass: public
  ldap:
    baseDn: dc=swp-ldap,dc=internal
    domainName: desk.gentian.org
    adminDn: cn=admin,dc=swp-ldap,dc=internal
  # imagePullSecrets from values/env/{env}.yaml via global.imagePullSecrets
  certManagerClusterIssuer: letsencrypt-prod
  keycloak:
    realm: opendesk
  subDomains:
    portal: portal
    keycloak: id
  # UCR configuration: controls UDM REST API access, user templates, and UI behavior
  configUcr:
    # Suppress the 'SSL certificate will expire in X days' UMC warning.
    # The stack-data-ums chart merges global.configUcr over its default-base.conf
    # (which hardcodes host/root: 20523 — a date in early 2026). Override with
    # the actual cert-manager CA cert expiry (nubus-dev-ecdsa-ca-secret, 10y).
    # ssl/validity/host and /root are integer days-since-epoch; 24234 = 2036-05-08.
    # ssl/update/expired: "no" prevents the UMC server from overwriting these on
    # each startup from a stale LDAP object.
    ssl:
      update:
        expired: "no"
      validity:
        host: 24234
        root: 24234
    ldap:
      shadowbind: "false"
    directory:
      manager:
        mail-address:
          uniqueness: "True"
        rest:
          authorized-groups:
            domain-admins: __DELETE_KEY__
            iam-api-full-access: cn=IAM API - Full Access,cn=groups,dc=swp-ldap,dc=internal
        web:
          modules:
            users:
              user:
                add:
                  default: cn=openDesk User,cn=templates,cn=univention,dc=swp-ldap,dc=internal
                properties:
                  description:
                    syntax: TextArea
                  firstname:
                    required: "True"
                  mailPrimaryAddress:
                    required: "True"
                  username:
                    syntax: uid
                search:
                  autosearch: "True"
                wizard:
                  property:
                    invite:
                      default: "True"
                    overridePWLength:
                      default: "False"
                      visible: "False"
                    pwdChangeNextLogin:
                      default: "True"
                      visible: "False"
            wizard:
              disabled: "No"
    ucs:
      web:
        theme: light
    umc:
      web:
        sso:
          enabled: false
      cookie-banner:
        show: "false"
      login:
        password-complexity-message:
          de: "Das Passwort muss mindestens 8 Zeichen lang sein und darf keine Zahlenabfolge oder ganze Worte enthalten, wie '1234Test'."
          en: "Password must be at least 8 characters long and cannot include a number series or regular words, like '1234Test'."
      module:
        udm:
          oxmail:
            oxcontext:
              disabled: "True"
          portals:
            all:
              disabled: "True"
      self-service:
        account-registration:
          usertemplate: __DELETE_KEY__
        passwordreset:
          token_validity_period: 172800
          blacklist:
            groups: __DELETE_KEY__
          limit:
            total:
              day: 1000
              hour: 200
              minute: 120
        postgresql:
          # Fix chart bug: nubus 1.16.0 defaults umc/self-service/postgresql to
          # keycloak_user/keycloak DB — must override to selfservice_user/selfservice.
          # Password file is mounted at /var/secrets/db_password by the chart.
          database: selfservice
          username: selfservice_user
          password-file: /var/secrets/db_password
  # openDesk system extensions — load LDAP schema (opendeskFileshare*, etc.),
  # portal tiles, and default UDM data objects for the openDesk suite.
  # Required for opendeskFileshareEnabled to exist in LDAP schema and for
  # the nubus portal to show the correct openDesk tiles.
  # After changing these, re-run the nubus-stack-data-ums job to apply.
  extensions:
    - name: "opendesk-a2g-mapper"
      image:
        registry: "registry.opencode.de"
        repository: "bmi/opendesk/components/platform-development/images/opendesk-nubus-a2g-mapper"
        tag: "1.0.1@sha256:527cf7d0515df441b7ac8bc29b40f8703c87246ddc9594d9e24531571dc6359d"
  systemExtensions:
    - name: "ox"
      image:
        registry: "registry.opencode.de"
        repository: "bmi/opendesk/components/supplier/univention/images-mirror/ox-extension"
        tag: "0.34.0@sha256:47212f73585ae4744280e76a32b11c07b89cbdbdadb2c521f15543c5fb1b2a30"
    - name: "opendesk"
      image:
        registry: "registry.opencode.de"
        repository: "bmi/opendesk/components/platform-development/images/opendesk-nubus"
        tag: "1.15.2@sha256:4ef630ee30144dcf4ee9a202bf4dd60334d27cd4fe6d37bd7e0aa06c901eed9b"
    - name: "portal"
      image:
        registry: "registry.opencode.de"
        repository: "bmi/opendesk/components/supplier/univention/images-mirror/portal-extension"
        tag: "0.88.2@sha256:5e232665728b436586fe106dbd0e03a90aa6ff52fcc740555556dcca0d2dc9f7"

# Top-level ingress for the nubus portal and subcomponents.
# Proxy buffer settings prevent 502 errors with large Keycloak auth headers.
ingress:
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "128k"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "64k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    nginx.ingress.kubernetes.io/proxy-busy-buffers-size: "128k"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/use-regex: "true"
  certManager:
    enabled: false
  tls:
    enabled: true
    secretName: "wildcard-tls"
  minio:
    enabled: false

# SMTP — connection in {env}/values.yaml (placeholder/real SMTP differs per env)
# nubusUmcServer.smtp.auth.password in {env}/values.yaml

# PostgreSQL selfservice and authsession — connection.host in {env}/values.yaml
nubusUmcServer:
  ingress:
    certManager:
      enabled: false
    tls:
      secretName: "wildcard-tls"
  podAnnotations:
    reloader.stakater.com/auto: "true"
  postgresql:
    selfservice:
      auth:
        username: selfservice_user
        database: selfservice
      # connection.host in {env}/values.yaml
    authSession:
      auth:
        username: authsession_user
        database: nubus_authsession
      # connection.host in {env}/values.yaml

# Keycloak — auth.password and postgresql.connection.host in {env}/values.yaml
keycloak:
  enabled: true
  replicaCount: 1
  auth:
    username: kcadmin
    # password: in {env}/values.yaml
  postgresql:
    auth:
      username: keycloak_user
      database: keycloak
      # existingSecret (encrypted key name) in {env}/values.yaml
    # connection.host in {env}/values.yaml
  # Increase startup timeout to allow Quarkus build
  startupProbe:
    failureThreshold: 30
    periodSeconds: 30
  keycloak:
    features:
      enabled:
        - admin-fine-grained-authz:v1
        - token-exchange
    login:
      messages:
        de:
          loginTitle: "Anmeldung bei openDesk"
        en:
          loginTitle: "Sign in to openDesk"
  config:
    # Do not expose the admin console externally (matches openDesk production default).
    exposeAdminConsole: false
  # Disable the Keycloak main ingress — all external traffic goes through
  # nubusKeycloakExtensions.proxy which enriches login with captcha / brute-force
  # protection. This also prevents nginx conflicts on the overlapping /realms path.
  ingress:
    enabled: false
  # resources in {env}/values.yaml

# Guardian — disabled in openDesk
nubusGuardian:
  enabled: false
  postgresql:
    auth:
      username: guardianmanagementapi_user
      database: guardianmanagementapi
    # connection.host in {env}/values.yaml

# Notifications API — disabled in openDesk
nubusNotificationsApi:
  enabled: false
  replicaCount: 1
  postgresql:
    auth:
      username: notificationsapi_user
      database: notificationsapi
    # connection.host in {env}/values.yaml

# Two-Factor Authentication Helpdesk
nubusTwofaHelpdesk:
  enabled: true
  ingress:
    certManager:
      enabled: false
    tls:
      secretName: "wildcard-tls"

# Bundled PostgreSQL and MinIO disabled — provided by infrastructure layer
postgresql:
  enabled: false
  provisioning:
    enabled: false
minio:
  enabled: false

# Keycloak Extensions
nubusKeycloakExtensions:
  enabled: true
  postgresql:
    connection:
      ssl: "false"
    auth:
      username: keycloak_extensions_user
      database: keycloak_extensions
      # existingSecret in {env}/values.yaml
    # connection.host in {env}/values.yaml
  # smtp.auth.password in {env}/values.yaml
  proxy:
    ingress:
      # /admin omitted — extensions-proxy must NOT expose the Keycloak admin
      # console publicly (test_keycloak_admin_unavailable must return 404).
      # /js is required for the Keycloak JS adapter used by the portal.
      # Main Keycloak ingress is disabled; proxy handles ALL external traffic.
      certManager:
        enabled: false
      tls:
        secretName: "wildcard-tls"
      paths:
        - pathType: "Prefix"
          path: "/realms"
        - pathType: "Prefix"
          path: "/js"
        - pathType: "Prefix"
          path: "/resources"
        - pathType: "Prefix"
          path: "/fingerprintjs"

# Keycloak Bootstrap LDAP bind user (service account for LDAP federation)
nubusKeycloakBootstrap:
  ldap:
    auth:
      bindDn: uid=ldapsearch_keycloak,cn=users,dc=swp-ldap,dc=internal
      existingSecret:
        name: ums-keycloak-bootstrap-ldap-credentials

# Stack Data UMS — initial LDAP data loader
nubusStackDataUms:
  postgresql:
    auth:
      username: keycloak_user
      database: keycloak
      # existingSecret in {env}/values.yaml
    # connection.host in {env}/values.yaml
  nubusUmcServer:
    memcached:
      auth:
        # Set explicitly to match the bundled memcached's SASL username.
        # Chart default is also "selfservice" but an empty auth: block can
        # override that to "" (null table), causing SIGABRT in passwordreset.
        username: selfservice
      # connection.host: intentionally NOT overridden per-env.
      # The nubus umbrella chart default evaluates to
      # '{{ printf "%s-umc-server-memcached" .Release.Name }}' via tpl,
      # which correctly resolves to the bundled memcached service.
      # Overriding this with a literal string breaks UCR umc/self-service/memcached/socket.
    postgresql:
      auth:
        # Fix chart bug: stack-data-ums sets umc/self-service/postgresql/* UCR
        # from this block. Must use selfservice DB, not keycloak.
        database: selfservice
        username: selfservice_user
      # connection.host in {env}/values.yaml
  # Portal object storage — endpoint in {env}/values.yaml (env-specific DNS)
  nubusPortalConsumer:
    objectStorage:
      bucketName: ums
  nubusPortalServer:
    objectStorage:
      bucketName: ums
  stackDataContext:
    externalMailDomain: desk.gentian.org
    umcHtmlTitle: Portal - openDesk
    ldapSamlSpUrls: https://portal.desk.gentian.org/univention/saml/metadata
    portalFqdn: portal.desk.gentian.org
    smtpUser: opendesk-system@desk.gentian.org
    smtpStartTls: false
    ldapBase: dc=swp-ldap,dc=internal
    # smtpHost and smtpPort in {env}/values.yaml
  templateContext:
    opendeskAdminAttributes: true
    opendeskGroupAttributes: true
    opendeskUserAttributes: true
    defaultGroupOtherObjects: cn=Domain Users,cn=groups,dc=swp-ldap,dc=internal
    opendeskEnterprise: false
    # functional.yaml: weboffice.defaultFormat (ODF → odt/ods/odp)
    portalDirectDocsExtensionText: odt
    portalDirectDocsExtensionSheet: ods
    portalDirectDocsExtensionPresentation: odp
    # functional.yaml: portal.enforceLogin
