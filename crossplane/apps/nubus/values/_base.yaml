# Portal Server — endpoint in {env}/values.yaml (env-specific MinIO DNS)
nubusPortalServer:
  ingress:
    certManager:
      enabled: false
    tls:
      secretName: "wildcard-tls"
  podAnnotations:
    reloader.stakater.com/auto: "true"
  objectStorage:
    auth:
      existingSecret:
        name: portal-object-storage-credentials
    bucketName: ums

# Portal Consumer — endpoint in {env}/values.yaml
# provisioningApi.auth.password injected via set_sensitive (stable, Vault-derived)
nubusPortalConsumer:
  podAnnotations:
    reloader.stakater.com/auto: "true"
  objectStorage:
    auth:
      existingSecret:
        name: portal-object-storage-credentials
    bucketName: ums

# Selfservice Consumer
# provisioningApi.auth.password injected via set_sensitive (stable, Vault-derived)
nubusSelfServiceConsumer:
  podAnnotations:
    reloader.stakater.com/auto: "true"

# UDM Listener — restarts when nats auth secret changes
nubusUdmListener:
  podAnnotations:
    reloader.stakater.com/auto: "true"
  # Patch: mount corrected mq_adapter_nats.py to fix NATS subject mismatch.
  # The upstream image 0.66.x has LDAP_SUBJECT = "ldap-producer-subject" but
  # the transformer uses subjects=["ldap-producer"] (just the queue name).
  # The transformer's ensure_stream overwrites the stream config on startup,
  # causing NoStreamResponseError for the listener. This patch aligns them.
  # ConfigMap is created declaratively by install.sh (deploy_nubus) from
  # crossplane/apps/nubus/patches/mq_adapter_nats.py.
  extraVolumes:
    - name: nats-subject-patch
      configMap:
        name: '{{ .Release.Name }}-udm-listener-nats-patch'
  extraVolumeMounts:
    - name: nats-subject-patch
      mountPath: /app/listener/.venv/lib/python3.11/site-packages/univention/provisioning/listener/mq_adapter_nats.py
      subPath: mq_adapter_nats.py

# Provisioning stack — all sub-components restart on secret change (NATS passwords, API admin password)
# NATS server restarts first (when nats user secrets change), then clients pick up new credentials.
nubusProvisioning:
  api:
    podAnnotations:
      reloader.stakater.com/auto: "true"
  dispatcher:
    podAnnotations:
      reloader.stakater.com/auto: "true"
  udmTransformer:
    podAnnotations:
      reloader.stakater.com/auto: "true"
  prefill:
    podAnnotations:
      reloader.stakater.com/auto: "true"
  nats:
    podAnnotations:
      reloader.stakater.com/auto: "true"
  # NOTE: OX App Suite is an optional kernel extension (deployed per tenant
  # by the ox-workspace module).  Its provisioning-API consumer registration
  # — and the matching ESO-rendered `ox-connector-provisioning-api` secret —
  # is owned by that module, not by the kernel nubus chart.  Pre-registering
  # an OX consumer here would make the kernel install fail on any cluster
  # without OX (the register-consumers Job blocks on a tenant-scoped Secret
  # that does not yet exist), violating the "OX is optional" architecture.
  # Per-tenant OX adoption adds its own entry to nubusProvisioning.registerConsumers
  # via the ox-workspace module / its successor XOXAppSuite Composition (P2C).

# LDAP Server — replicaCounts; persistence/resources in {env}/values.yaml
nubusLdapServer:
  replicaCountPrimary: 1
  replicaCountSecondary: 0
  replicaCountProxy: 0
  # ldapServer.auth.password in {env}/values.yaml
  persistence:
    enabled: true
    # size in {env}/values.yaml

  # ─── Multi-tenant feature: cn=Tenant Admins write access to cn=temporary ──
  # UCS slapd.conf hardcodes Domain Admins for cn=temporary ACLs. Tenant admin
  # groups (cn=admins_<tenant>) need write access to lock UIDs during user
  # provisioning. The 92-gentian-tenant-acl.sh script (mounted from a
  # ConfigMap created declaratively by install.sh as part of the nubus
  # bootstrap) runs in /entrypoint.d/ before slapd starts and inserts the
  # cn=Tenant Admins group into the three cn=temporary ACL rules.
  # The Gentian operator populates cn=Tenant Admins with each tenant's
  # admins group as a nested group via buildAdminPolicyScript.
  extraVolumes:
    - name: gentian-tenant-acl
      configMap:
        name: '{{ .Release.Name }}-ldap-gentian-acl'
        defaultMode: 0755
  extraVolumeMounts:
    - name: gentian-tenant-acl
      mountPath: /entrypoint.d/92-gentian-tenant-acl.sh
      subPath: 92-gentian-tenant-acl.sh

# UMC Gateway
nubusUmcGateway:
  ingress:
    certManager:
      enabled: false
    tls:
      secretName: "wildcard-tls"

# UDM REST API
nubusUdmRestApi:
  ingress:
    certManager:
      enabled: false
    tls:
      secretName: "wildcard-tls"
    # Expose externally for e2e test user import via UDM REST API.
    enabled: true
  ldapUpdateUniventionObjectIdentifier:
    enabled: true
    suspend: false

# Redirect bare base domain → portal (required by test_base_domain_redirect)
nubusPortalFrontend:
  ingress:
    certManager:
      enabled: false
    tls:
      secretName: "wildcard-tls"
  extraIngresses:
    - name: base-domain-redirect
      host: "desk.gentian.org"
      paths:
        - pathType: ImplementationSpecific
          path: /
      ingressClassName: "public"
      annotations:
        nginx.ingress.kubernetes.io/permanent-redirect: "https://portal.desk.gentian.org/univention/portal/"
        nginx.ingress.kubernetes.io/use-regex: "true"
      tls:
        enabled: true
        secretName: "wildcard-tls"

# Extra secrets
extraSecrets: []
