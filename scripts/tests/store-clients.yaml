# ── Servers that are not shared stores ───────────────────────────────────
#
# The kernel's own PostgreSQL (kernel-postgres, in kernel-data), the two mail
# servers (Dovecot and Postfix, in system-mail when mail.serviceMode is
# `system`) and the proxy in front of them (mail-edge, in system-mail-dmz).
# Each carries a NetworkPolicy of its own chart, and these are their clients,
# held the same two ways:
#
#   scripts/tests/server_network_policies.py   (make test-store-network-policies)
#   internal/controller/server_clients_test.go
#
# `evidence` says how far the row is carried by this repository: `proven`
# when the namespace, the port and whatever a rule selects the client by are
# read from a chart, a script or the operator's code here; `inferred` when
# part of it rests on upstream software that is not vendored, named in
# `proof`. A rule may lean on nothing that is only inferred, bar the pinned
# CloudNativePG labels the stores' policies lean on too.
#
# `external: true` marks a connection that does not arrive from a pod -- from
# the internet through a load balancer. No selector can name it; it is
# admitted only by a rule with ports and no `from`, and only the proxy in the
# mail DMZ has such a rule. This table is the mail flows in one place: who
# reaches the proxy, what the proxy reaches, and who else reaches each server.
servers:
  clients:
    # ── kernel-postgres (kernel-data) ───────────────────────────────────
    - server: kernel-postgres
      client: Keycloak, whose database is here
      namespace: kernel-authentication
      podLabels: {app.kubernetes.io/name: keycloakx, app.kubernetes.io/instance: gentian-idp-keycloak}
      port: 5432
      built: none
      evidence: proven
      proof: >-
        kernel/appsets/raw/09-identity.yaml (dbHost, and the namespace the values land in),
        kernel/services/keycloak-idp/manifests/templates/configmap.yaml database.hostname and .port;
        the pod labels are upstream keycloakx 7.3.2's and no rule selects on them
    - server: kernel-postgres
      client: OpenFGA, and the migration that runs as its init container
      namespace: kernel-authorization
      podLabels: {app.kubernetes.io/name: openfga, app.kubernetes.io/instance: gentian-openfga}
      port: 5432
      built: none
      evidence: proven
      proof: >-
        kernel/appsets/raw/09-identity.yaml, kernel/services/openfga/manifests/templates/externalsecret.yaml datastore.uri,
        configmap.yaml migrationType initContainer; the pod labels are upstream openfga 0.3.10's and no rule selects on them
    - server: kernel-postgres
      client: the registrar, which records who was allowed to ask for an identity change
      namespace: kernel-control
      podLabels: {app.kubernetes.io/name: gentian-os, app.kubernetes.io/instance: gentian-os, app.kubernetes.io/component: registrar}
      port: 5432
      built: none
      evidence: proven
      proof: charts/gentian-os/templates/externalsecret-registrar-database.yaml, registrar.yaml REGISTRAR_DATABASE_URL, internal/registrar/record
    - server: kernel-postgres
      client: the operator, reading and writing the usage history and notices of the tenant that adopts the kernel realm
      namespace: kernel-control
      podLabels: {app.kubernetes.io/name: gentian-os, app.kubernetes.io/instance: gentian-os, app.kubernetes.io/component: operator}
      port: 5432
      built: none
      evidence: proven
      proof: >-
        internal/usage/sampler.go StoreForTenant (the desktop-database Secret of the tenant's namespace),
        internal/applifecycle/notifications.go notificationConn; that Secret names this server for the tenant
        that adopts the kernel realm (internal/controller/component_desktop.go ensureDatabaseRequirement)
    - server: kernel-postgres
      client: the desktop of the tenant that adopts the kernel realm
      namespace: {name: tenant-platform, labels: {gentianos.io/tier: tenant, gentianos.io/tenant: platform}}
      podLabels: {app.kubernetes.io/instance: tenant-platform-desktop}
      port: 5432
      built: kernel-realm-desktop-database
      evidence: proven
      proof: internal/controller/component_desktop.go componentDatabaseNamespace, component_network_policy.go
    - server: kernel-postgres
      client: pg_dump of the desktop database of the tenant that adopts the kernel realm, in a tenant export
      namespace: kernel-data
      podLabels: {gentianos.io/component: tenant-export}
      port: 5432
      built: export-kernel-desktop-dump
      evidence: proven
      proof: internal/controller/tenantexport_controller.go tenantWideUnits, internal/backup/desktop.go KernelDesktopDumpJob
    - server: kernel-postgres
      client: pg_restore of that database, in a tenant restore
      namespace: kernel-data
      podLabels: {gentianos.io/component: tenant-export}
      port: 5432
      built: restore-kernel-desktop
      evidence: proven
      proof: internal/controller/tenantrestore_controller.go tenantWideRestoreUnits, internal/backup/desktop.go KernelDesktopRestoreJob
    - server: kernel-postgres
      client: the Job that empties that database when the tenant is deleted
      namespace: kernel-data
      podLabels: {}
      port: 5432
      built: kernel-desktop-destroy-job
      evidence: proven
      proof: internal/controller/tenant_mailboxes.go deleteKernelDesktop, internal/backup/desktop.go KernelDesktopDestroyJob
    - server: kernel-postgres
      client: a replica or a join Job of the cluster itself, streaming from the primary
      namespace: kernel-data
      podLabels: {cnpg.io/cluster: kernel-postgres, cnpg.io/jobRole: join}
      port: 5432
      built: none
      evidence: inferred
      proof: >-
        CloudNativePG 1.25.0 pkg/specs/jobs.go (upstream; instances is 1 in kernel/data/kernel-postgres/values.yaml,
        so this is for a cluster that raises it)
    - server: kernel-postgres
      client: CloudNativePG's operator, asking an instance for its status
      namespace: kernel-data
      podLabels: {app.kubernetes.io/name: cloudnative-pg, app.kubernetes.io/instance: cnpg}
      port: 8000
      built: none
      evidence: inferred
      proof: >-
        kernel/bootstrap/chart/templates/cnpg.yaml (the namespace); the labels are chart cloudnative-pg 0.23.0's
        and the port CloudNativePG 1.25.0's pkg/management/url StatusPort, both upstream

    # ── Dovecot (system-mail) ───────────────────────────────────────────
    - server: dovecot
      client: Postfix, delivering mail for a hosted domain over LMTP
      namespace: system-mail
      podLabels: {app.kubernetes.io/name: mail, app.kubernetes.io/instance: postfix-dev}
      port: 24
      built: none
      evidence: proven
      proof: >-
        kernel/services/postfix/manifests/templates/configmap.yaml virtual_transport;
        the labels are the ones service-edge.yaml selects Postfix's pods by
    - server: dovecot
      client: Postfix, asking whether a submission credential is good
      namespace: system-mail
      podLabels: {app.kubernetes.io/name: mail, app.kubernetes.io/instance: postfix-dev}
      port: 12345
      built: none
      evidence: proven
      proof: kernel/services/postfix/manifests/templates/configmap.yaml smtpd_sasl_path
    - server: dovecot
      client: the proxy of the mail DMZ, passing on an IMAPS connection it took on 993 with the client's address in a PROXY header
      namespace: system-mail-dmz
      podLabels: {app.kubernetes.io/name: mail-edge, app.kubernetes.io/instance: mail-edge-dev}
      port: 10993
      built: none
      evidence: proven
      proof: >-
        kernel/services/mail-edge/manifests/templates/configmap.yaml (backend imaps),
        kernel/services/dovecot/manifests/templates/deployment.yaml inet_listener imaps-edge and Service dovecot-<env>-edge
    - server: dovecot
      client: the installer's check of the Deployment, on the delivery port
      namespace: system-mail
      podLabels: {gentianos.io/purpose: verify}
      port: 24
      built: none
      evidence: proven
      proof: scripts/lib/verify-kernel-services.sh verify_dovecot_installation, _run_ephemeral_pod
    - server: dovecot
      client: the installer's check of the Deployment, on the IMAP port
      namespace: system-mail
      podLabels: {gentianos.io/purpose: verify}
      port: 143
      built: none
      evidence: proven
      proof: scripts/lib/verify-kernel-services.sh verify_dovecot_installation
    - server: dovecot
      client: a pod of a tenant that reads mail by the Service's name, which the chart keeps this port for
      namespace: *tenant
      podLabels: {gentianos.io/app: wiki}
      port: 143
      built: none
      evidence: inferred
      proof: >-
        kernel/services/dovecot/manifests/templates/deployment.yaml ("143 remains for in-cluster clients");
        the operator hands this port to nobody, and no such client is named in this repository
    - server: dovecot
      client: a tenant's app that declared mail.imap and uses Dovecot by the Service's name on the TLS port
      namespace: *tenant
      podLabels: {gentianos.io/app: wiki}
      port: 993
      built: tenant-app-mail-imap
      evidence: inferred
      proof: >-
        internal/kernel/netpolicy/kernel.go (the app's egress opens the mail namespace);
        the operator hands the public name (SeedIMAP: imap.<kernelDomain>), which arrives at the mail edge instead,
        and no client that uses the Service's name is named in this repository

    # ── Postfix (system-mail) ───────────────────────────────────────────
    - server: postfix
      client: the proxy of the mail DMZ, passing on mail it took on 25 with the sender's address in a PROXY header
      namespace: system-mail-dmz
      podLabels: {app.kubernetes.io/name: mail-edge, app.kubernetes.io/instance: mail-edge-dev}
      port: 10025
      built: none
      evidence: proven
      proof: >-
        kernel/services/mail-edge/manifests/templates/configmap.yaml (backend smtp),
        kernel/services/postfix/manifests/templates/configmap.yaml postfix-<env>-edge-listeners and service-edge.yaml
    - server: postfix
      client: the proxy of the mail DMZ, passing on a submission it took on 587
      namespace: system-mail-dmz
      podLabels: {app.kubernetes.io/name: mail-edge, app.kubernetes.io/instance: mail-edge-dev}
      port: 10587
      built: none
      evidence: proven
      proof: >-
        kernel/services/mail-edge/manifests/templates/configmap.yaml (backend submission),
        kernel/services/postfix/manifests/templates/configmap.yaml postfix-<env>-edge-listeners and service-edge.yaml
    - server: postfix
      client: a tenant's app that declared mail.smtp and uses Postfix by the Service's name
      namespace: *tenant
      podLabels: {gentianos.io/app: wiki}
      port: 587
      built: tenant-app-mail-smtp
      evidence: inferred
      proof: >-
        internal/controller/mail_reconciler.go mailSharedPostfixHost (the Service's name when the cluster has no domain,
        or MAIL_SMTP_HOST) and mailSharedPostfixPort, internal/kernel/netpolicy/kernel.go;
        with a domain the app is handed the public name, which arrives at the mail edge instead

    # ── The mail edge (system-mail-dmz) ─────────────────────────────────
    # The proxy's own ports: the load balancer's 25, 587 and 993 reach the
    # pod on 2525, 2587 and 2993.
    - server: mail-edge
      client: a mail server on the internet, delivering to the MX
      external: true
      port: 2525
      built: none
      evidence: proven
      proof: kernel/services/mail-edge/manifests/templates/service.yaml (port 25)
    - server: mail-edge
      client: a mail client outside the cluster, submitting
      external: true
      port: 2587
      built: none
      evidence: proven
      proof: kernel/services/mail-edge/manifests/templates/service.yaml (port 587)
    - server: mail-edge
      client: a mail client outside the cluster, reading mail
      external: true
      port: 2993
      built: none
      evidence: proven
      proof: kernel/services/mail-edge/manifests/templates/service.yaml (port 993)
    - server: mail-edge
      client: a tenant's app that declared mail.smtp, dialling mail.<kernelDomain>
      namespace: *tenant
      podLabels: {gentianos.io/app: wiki}
      port: 2587
      built: tenant-app-mail-edge-smtp
      evidence: inferred
      proof: >-
        internal/controller/mail_reconciler.go mailSharedPostfixHost and mailSharedPostfixPort, internal/kernel/netpolicy/kernel.go;
        whether the connection still carries the pod's address when it arrives is the cluster's proxy mode, not this repository's
    - server: mail-edge
      client: a tenant's app that declared mail.imap, dialling imap.<kernelDomain>
      namespace: *tenant
      podLabels: {gentianos.io/app: wiki}
      port: 2993
      built: tenant-app-mail-edge-imap
      evidence: inferred
      proof: >-
        internal/controller/mail_reconciler.go (SeedIMAP: imap.<kernelDomain>, 993), internal/kernel/netpolicy/kernel.go;
        the source it arrives from is, as for submission, the cluster's proxy mode
    - server: mail-edge
      client: Keycloak, sending a realm's mail to mail.<kernelDomain>
      namespace: kernel-authentication
      podLabels: {app.kubernetes.io/name: keycloakx, app.kubernetes.io/instance: gentian-idp-keycloak}
      port: 2587
      built: none
      evidence: inferred
      proof: >-
        internal/controller/keycloak_tenant_smtp.go (SMTP_HOST mail.<kernelDomain>, SMTP_PORT 587);
        the source it arrives from is, as for an app, the cluster's proxy mode

  # What must NOT get in.
