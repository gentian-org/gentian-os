    - server: postfix
      client: a pod labelled as the proxy in a tenant's namespace
      namespace: *tenant
      podLabels: {app.kubernetes.io/name: mail-edge, app.kubernetes.io/instance: mail-edge-dev}
      port: 10587
    - server: postfix
      client: Dovecot on a port that believes a PROXY header
      namespace: system-mail
      podLabels: {app.kubernetes.io/name: dovecot, app.kubernetes.io/instance: dovecot-dev}
      port: 10025
    - server: postfix
      client: Dovecot on a port Postfix does not serve
      namespace: system-mail
      podLabels: {app.kubernetes.io/name: dovecot, app.kubernetes.io/instance: dovecot-dev}
      port: 465
    - server: postfix
      client: Keycloak by the Service's name, which no realm is given
      namespace: kernel-authentication
      podLabels: {app.kubernetes.io/name: keycloakx, app.kubernetes.io/instance: gentian-idp-keycloak}
      port: 587
    - server: postfix
      client: a pod of a namespace outside the layout on a port Postfix does not publish
      namespace: {name: default, labels: {}}
      podLabels: {}
      port: 8891
    - server: postfix
      client: a pod of a namespace outside the layout on the submission port
      namespace: {name: default, labels: {}}
      podLabels: {}
      port: 587

    - server: mail-edge
      client: a connection from outside the cluster on the proxy's health port
      external: true
      port: 8404
    - server: mail-edge
      client: a tenant's app on the proxy's health port
      namespace: *tenant
      podLabels: {gentianos.io/app: wiki}
      port: 8404
    - server: mail-edge
      client: a connection from outside the cluster on a port the proxy does not listen on
      external: true
      port: 143
