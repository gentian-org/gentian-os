    post:
      tags: [catalogue]
      operationId: requestSupport
      summary: Ask a partner for support with an app
      description: |
        The signed-in person asks for the support offer `offer` of this
        app (`support` in `GET /v1/apps/{catalogue}/{app}`), with an
        optional message. The store answers that it received the request;
        what it does with it — passing it to the partner, and how the
        partner answers the person — is the store's. Only an offer with
        `requestable: true` takes a request; another answers `422`
        `not-requestable`, and its `contactUrl` is the way to it. Added in
        1.3, with the feature `support`.
      security:
        - storeToken: []
