              $ref: "#/components/headers/ETag"
            Vary:
              $ref: "#/components/headers/Vary"
          content:
            application/json:
              schema:
                type: object
                required: [summary, items, nextCursor]
                properties:
                  summary:
                    $ref: "#/components/schemas/ReviewSummary"
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Review"
                  nextCursor:
                    $ref: "#/components/schemas/NextCursor"
              examples:
                reviews:
                  value:
                    summary:
                      count: 2
                      average: 4.5
                      distribution: {"1": 0, "2": 0, "3": 0, "4": 1, "5": 1}
                    items:
                      - id: rv_01J9ZC1E
                        rating: 5
                        title: Does what we need
                        text: Running it for forty people since spring. Upgrades have been uneventful.
                        author: M. K.
                        date: "2026-09-12"
                        language: en
                        version: 31.0.4
                      - id: rv_01J9YQ7B
                        rating: 4
                        title: null
                        text: Solid. The mail integration took some reading.
                        author: An administrator in Bern
                        date: "2026-08-30"
                        language: en
                        version: null
                    nextCursor: null
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/InvalidRequest"
