  /v1/apps/{catalogue}/{app}/reviews/mine:
    parameters:
      - $ref: "#/components/parameters/Catalogue"
      - $ref: "#/components/parameters/App"
    get:
      tags: [catalogue]
      operationId: getMyReview
      summary: The signed-in person's review of an app
      description: |
        One review per person and entry. `404` when they have written none.
      security:
        - storeToken: []
      responses:
        "200":
          description: Their review.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [catalogue]
      operationId: putMyReview
      summary: Write or replace the signed-in person's review
      description: |
        Writes the review, or replaces the one the person wrote before; it
        is dated anew. Only the person's own review is touched.

        Refused with `403`:
        * `review-not-acquired` where the store reviews only what a tenant
          acquired (`reviewing.requireAcquisition` in `GET /v1/meta`) and no
          tenant this person signed in for has a `confirmed` acquisition of
          the entry;
        * `tenant-refused`, as every signed-in call, while the store does
          not serve the tenant in the token.

        Refused with `409` and code `company-missing` while the account has
        no company (`PUT /v1/account/company`): a review is shown with its
        author's company size and industry.

        `scores.support` and `scores.value` are for an entry of edition
        `ee` and are refused (`400`) on any other.
      security:
        - storeToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
            examples:
              review:
                value:
                  recommend: true
                  scores: {features: 4, easeOfUse: 5, easeOfSetup: 3, support: null, value: null}
                  title: Does what we need
                  text: Running it for forty people since spring. Upgrades have been uneventful.
                  version: 31.0.4
      responses:
        "200":
          description: The review as it is now shown.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/CompanyMissing"
    delete:
      tags: [catalogue]
      operationId: deleteMyReview
      summary: Withdraw the signed-in person's review
      security:
        - storeToken: []
      responses:
        "204":
          description: Withdrawn, or there was none.
        "401":
          $ref: "#/components/responses/Unauthenticated"
