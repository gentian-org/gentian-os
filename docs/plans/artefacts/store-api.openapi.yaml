openapi: 3.1.0
info:
  title: Gentian OS store API
  version: "1.0"
  summary: What a cluster's App Store app asks of a store outside the cluster.
  license:
    name: Mozilla Public License 2.0
    identifier: MPL-2.0
  description: |
    The API a store serves and the App Store app on a Gentian OS cluster calls.

    This file is the normative format. The prose beside it
    (`store-api.md` in this directory, and `docs/design/store-contract.md`)
    explains it; where they disagree, this file is right and the prose is
    the defect.

    ## Direction

    Every request in this file is made by the cluster's side, outbound, over
    HTTPS. Nothing in it requires the store to call into a cluster, and a
    store never does: it holds no credential for one and a cluster exposes
    no endpoint to it.

    ## Who calls

    The App Store app: a platform UI installed per tenant on the cluster. Its
    backend makes these requests on behalf of the person using it.

    ## Open reads and signed-in calls

    The API has two halves, and the line between them is whether a call
    concerns a tenant.

    **Open reads** take no token: `GET /v1/meta`, `GET /v1/categories`,
    `GET /v1/apps`, `GET /v1/apps/{catalogue}/{app}` and its `/reviews` and
    `/reports`. What a store offers can be seen at once, by anyone, with no
    account. An open read never answers `401` or `403`.

    A token may be presented on an open read. The store may then add what
    it knows of the token's tenant to the answer — today one member,
    `acquired`, on an app. It is never required. A token the store cannot
    validate, or one for a tenant it does not serve, is ignored on an open
    read: the answer is the anonymous one, not an error.

    **Signed-in calls** need a token: `GET /v1/tenant` and every
    `/v1/acquisitions` operation. The tenant's administrator signs in to
    the store, with an account at the store, by OAuth 2.0 authorization
    code with PKCE (see `GET /v1/meta` and the security scheme
    `storeToken`). The app is a public client and holds no client secret.
    Its backend on the cluster exchanges the code and keeps the token; the
    browser is never handed it. The app asks for the sign-in only when the
    person acquires something or opens what the tenant has acquired.

    ## Accounts and tenants

    A tenant is an organisation in the store's records; an account is a
    person. They are separate things. The tenant's administrator creates an
    account at the store's issuer, and the store associates that account
    with the tenant. By default exactly that one account acts for the
    tenant. Whether a store lets more accounts act for a tenant, and how,
    is outside this definition for now. An account that is not associated
    with the tenant URL in its token is refused on the signed-in calls with
    the reason `tenant-not-claimed` (see `RefusalReason`).

    Whether a store serves a tenant (`tenant-refused`) is a question of the
    signed-in calls only. An anonymous visitor sees the catalogue whatever
    the standing of their tenant, and learns at sign-in whether the store
    serves it.

    ## What is sent

    *On an open read with no token:* the path and query — which categories,
    apps and pages are looked at — the language asked for, and the address
    the request comes from, which is the cluster's outbound address. Nothing
    else. A client sends no cluster identifier, no tenant URL, no cookie and
    no `Referer` or `Origin` naming a tenant on an anonymous call; its
    `User-Agent` names the client software and its version and nothing of
    the cluster. An anonymous read therefore tells the store only where the
    request came from.

    *On a signed-in call, and on an open read that carries a token:* in
    addition the bearer token, and thereby the store account and the tenant
    URL bound into it at sign-in.

    Never: a user of the tenant, a list of what is installed, cluster
    configuration. The only personal data the store receives through this
    API is the store account the person signed in with, which the store
    already holds.

    ## Store content is data

    Every text field is plain text unless its description says it is
    Markdown, and a Markdown field is the subset named `store-markdown-1`
    below. A client renders text as text. It never interprets HTML, never
    runs script, and never embeds a frame from a store. A store must not
    rely on any markup outside the subset being rendered.

    ### store-markdown-1

    CommonMark, restricted to: paragraphs and hard line breaks; emphasis and
    strong emphasis; inline code and fenced code blocks (shown preformatted,
    never executed or highlighted by a named language); bullet and ordered
    lists, nested at most two levels; headings of level 2 and 3; and inline
    links whose destination is an absolute `https` URL. Everything else is
    shown as the characters it is written with: raw HTML, images, tables,
    reference-style links, autolinks, footnotes, block quotes, thematic
    breaks, and links with any other scheme. A link is opened in a separate
    window with no opener.

    ## URLs in answers

    Every URL a store returns is absolute and `https`. Image URLs must be on
    an origin listed in `mediaOrigins` of `GET /v1/meta`, and a checkout URL
    on one listed in `checkoutOrigins`; a client refuses the others. Images
    are `image/png`, `image/jpeg` or `image/webp`; SVG is not accepted.
    Document and link URLs are opened in a separate window and never
    embedded.

    ## Language

    A request states the languages the person reads in `Accept-Language`.
    The store answers each translatable field in the best match and names
    the language of the answer in `Content-Language`. Matching is forgiving
    within a language and never across one: `de-CH` is served `de` when
    there is no `de-CH`. With no match the store answers in its
    `defaultLanguage` (`GET /v1/meta`). An answer is in one language as a
    whole; a field with no translation in that language is served in the
    default language rather than left empty. Answers that depend on the
    language carry `Vary: Accept-Language`.

    ## Paging

    A list answers `{"items": [...], "nextCursor": "..."}`. `nextCursor` is
    `null` on the last page; otherwise it is passed back as `cursor`,
    unchanged, with the same filters. A cursor is opaque and may expire, in
    which case the store answers `400` with code `invalid-request`. `limit`
    is 20 when absent and at most 100.

    ## Errors

    Every answer with a status of 400 or above is `application/problem+json`
    (RFC 9457), with the members of the `Problem` schema. `code` is the
    stable value a client branches on; `type` is `urn:gentian:store:problem:`
    followed by the same code. `title` and `detail` are for a person and are
    in the language of the request.

    | Status | `code` | Meaning |
    | --- | --- | --- |
    | 400 | `invalid-request` | A parameter or the body is malformed; `errors` names the fields |
    | 401 | `unauthenticated` | Signed-in calls only. No token, or one that is expired or not this store's. Carries `WWW-Authenticate: Bearer` |
    | 403 | `insufficient-scope` | Signed-in calls only. The token lacks the scope the operation needs |
    | 403 | `tenant-refused` | `/v1/acquisitions` operations only. The store does not serve the tenant in the token; `reason` says why |
    | 404 | `not-found` | No such app, acquisition, or page |
    | 409 | `acquisition-not-confirmed` | A credential was asked for an acquisition that is not `confirmed` |
    | 409 | `idempotency-conflict` | The `Idempotency-Key` was used before with a different body |
    | 422 | `not-acquirable` | The app or the version named exists and cannot be acquired by this tenant; `detail` says why |
    | 429 | `rate-limited` | Too many requests. Carries `Retry-After` |
    | 500 | `internal` | The store failed |
    | 503 | `unavailable` | The store is temporarily not serving. May carry `Retry-After` |

    ## Rate limiting

    Every answer may carry `RateLimit-Limit`, `RateLimit-Remaining` and
    `RateLimit-Reset` (seconds). A `429` carries `Retry-After`, in seconds,
    and the same three headers.

    A request with a valid token is counted per token. A request without
    one is counted per client address. One address is one cluster, not one
    person: every tenant of a cluster reaches the store from the cluster's
    outbound address, so a store sizes the anonymous limit for a cluster's
    worth of administrators browsing, and a client caches open reads (see
    "Caching") so that they share answers rather than repeat requests.

    ## Caching

    An open read answered without regard to a token is the same for
    everybody who asks in the same language, and is cacheable. Such an
    answer carries:

    * `Cache-Control: public, max-age=<seconds>` — the store chooses the
      time; minutes for listings, longer for `GET /v1/meta`;
    * `ETag` — a validator for exactly this answer;
    * `Vary: Accept-Language, Authorization`.

    A client may repeat the request with `If-None-Match`, and the store
    answers `304` with no body when the answer has not changed. A `304`
    counts against the rate limit like any request.

    An open read the store personalised from a token carries
    `Cache-Control: private, no-store` and no `ETag`. Every signed-in call
    carries `Cache-Control: no-store`.

    Images and documents are served from the store's own origins under the
    store's own caching; they are not part of this API.

    ## Compatibility

    `/v1` changes only by addition: new optional members, new operations,
    new values of the open enumerations named as such in a schema. A client
    ignores members it does not know and treats an unknown value of an open
    enumeration as its documented fallback. Anything else is `/v2`.
servers:
  - url: "{storeUrl}"
    description: >-
      The address a cluster names for its store (`spec.catalogue.storeUrl` on the Cluster claim).
      A cluster installed with the installer's defaults names `https://store.sovrence.com`;
      that default is provisional.
    variables:
      storeUrl:
        default: https://store.example
        description: An `https` address with no trailing slash. Every path below is appended to it.
tags:
  - name: meta
    description: Open. What a client needs to know of a store, and to sign a person in.
  - name: catalogue
    description: Open. The apps a store lists, and what it says about each. No token is needed.
  - name: tenant
    description: Signed in. Whether the store serves the tenant in the token, and what it has to tell it.
  - name: acquisitions
    description: Signed in. What a tenant has acquired, and acquiring.
security:
  - storeToken: [store.read]
paths:
  /v1/meta:
    get:
      tags: [meta]
      operationId: getMeta
      summary: Discovery
      description: |
        Names the store, the version of this API it serves, and what a
        client needs to sign a person in. An open read: it takes no token
        and ignores one. A client reads it before anything else and may
        cache it for the `max-age` the answer states.
      security: []
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The store's description of itself.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            ETag:
              $ref: "#/components/headers/ETag"
            Vary:
              $ref: "#/components/headers/Vary"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
              examples:
                meta:
                  $ref: "#/components/examples/Meta"
        "304":
          $ref: "#/components/responses/NotModified"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/tenant:
    get:
      tags: [tenant]
      operationId: getTenant
      summary: The standing of the tenant in the token
      description: |
        Answers for the tenant URL bound into the token. It is the one
        signed-in call that never answers `tenant-refused`: a refusal is
        stated in the body, with `served: false`, so that a client can show
        the reason. Every `/v1/acquisitions` operation answers `403` with
        code `tenant-refused` and the same `reason` while `served` is false.
        The open reads are not affected: the catalogue stays readable.

        A client asks this once after each sign-in, before the signed-in
        call the person wanted.

        `known` says whether the store holds licence reports that list this
        tenant URL (see `licence-report.openapi.yaml`). `notices` are shown
        to the person as they are; none of them blocks anything on the
        cluster.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: The tenant's standing.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantStanding"
              examples:
                served:
                  summary: A tenant the store serves, on a cluster with no subscription
                  $ref: "#/components/examples/TenantServed"
                refused:
                  summary: A tenant the store has no reports for
                  $ref: "#/components/examples/TenantRefused"
                notClaimed:
                  summary: An account that is not associated with the tenant
                  $ref: "#/components/examples/TenantNotClaimed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/categories:
    get:
      tags: [catalogue]
      operationId: listCategories
      security:
        - {}
        - storeToken: [store.read]
      summary: The categories apps are filed under
      description: The whole list, unpaged; a store has tens of categories, not thousands.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Every category, in the order the store shows them.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            ETag:
              $ref: "#/components/headers/ETag"
            Vary:
              $ref: "#/components/headers/Vary"
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Category"
              examples:
                categories:
                  value:
                    items:
                      - {id: collaboration, name: Collaboration}
                      - {id: files, name: Files and documents}
        "304":
          $ref: "#/components/responses/NotModified"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/apps:
    get:
      tags: [catalogue]
      operationId: listApps
      security:
        - {}
        - storeToken: [store.read]
      summary: List apps
      description: |
        The store's entries, one per coordinate. Filters combine with AND.
        The order is the store's own and is stable across the pages of one
        listing.

        An open read. With a valid token of a tenant the store serves, each
        entry may additionally carry `acquired`.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: category
          in: query
          description: A category `id` from `GET /v1/categories`. Only entries filed under it.
          schema:
            type: string
        - name: edition
          in: query
          description: Only entries of this edition.
          schema:
            $ref: "#/components/schemas/Edition"
        - name: q
          in: query
          description: |
            Free text, matched by the store against name, summary and
            description in the language of the request. At most 200
            characters. How it matches is the store's affair.
          schema:
            type: string
            maxLength: 200
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of entries.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            ETag:
              $ref: "#/components/headers/ETag"
            Vary:
              $ref: "#/components/headers/Vary"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppSummary"
                  nextCursor:
                    $ref: "#/components/schemas/NextCursor"
              examples:
                withToken:
                  summary: With a token — the entry is marked as acquired by the token's tenant
                  value:
                    items:
                      - coordinate: gentian/xwiki-ce
                        family: xwiki
                        name: XWiki
                        summary: A wiki for a team's shared knowledge.
                        iconUrl: null
                        categories: [collaboration]
                        publisher:
                          name: XWiki community
                          url: null
                        edition: ce
                        editions:
                          - {edition: ce, coordinate: gentian/xwiki-ce}
                        trustTier: certified
                        latestVersion: 16.4.1
                        price:
                          model: free
                          amount: null
                          currency: null
                          per: null
                          period: null
                          note: null
                        acquired: true
                        rating: null
                    nextCursor: null
                page:
                  summary: Anonymous — no token, no `acquired`
                  value:
                    items:
                      - coordinate: gentian/nextcloud-base-ee
                        family: nextcloud
                        name: Nextcloud
                        summary: Files, calendars and contacts for a team, on your own cluster.
                        iconUrl: https://media.store.example/icons/nextcloud.png
                        categories: [files, collaboration]
                        publisher:
                          name: Example Publisher AG
                          url: https://publisher.example
                        edition: ee
                        editions:
                          - {edition: ce, coordinate: gentian/nextcloud-base-ce}
                          - {edition: ee, coordinate: gentian/nextcloud-base-ee}
                        trustTier: certified
                        latestVersion: 31.0.4
                        price:
                          model: subscription
                          amount: "4.50"
                          currency: CHF
                          per: user
                          period: month
                          note: null
                        rating:
                          count: 2
                          average: 4.5
                          distribution: {"1": 0, "2": 0, "3": 0, "4": 1, "5": 1}
                      - coordinate: gentian/xwiki-ce
                        family: xwiki
                        name: XWiki
                        summary: A wiki for a team's shared knowledge.
                        iconUrl: null
                        categories: [collaboration]
                        publisher:
                          name: XWiki community
                          url: null
                        edition: ce
                        editions:
                          - {edition: ce, coordinate: gentian/xwiki-ce}
                        trustTier: certified
                        latestVersion: 16.4.1
                        price:
                          model: free
                          amount: null
                          currency: null
                          per: null
                          period: null
                          note: null
                        rating: null
                    nextCursor: eyJhZnRlciI6Inh3aWtpLWNlIn0
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/apps/{catalogue}/{app}:
    parameters:
      - $ref: "#/components/parameters/Catalogue"
      - $ref: "#/components/parameters/App"
    get:
      tags: [catalogue]
      operationId: getApp
      security:
        - {}
        - storeToken: [store.read]
      summary: One app in full
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The entry.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            ETag:
              $ref: "#/components/headers/ETag"
            Vary:
              $ref: "#/components/headers/Vary"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppDetail"
              examples:
                app:
                  $ref: "#/components/examples/AppDetail"
        "304":
          $ref: "#/components/responses/NotModified"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/apps/{catalogue}/{app}/reviews:
    parameters:
      - $ref: "#/components/parameters/Catalogue"
      - $ref: "#/components/parameters/App"
    get:
      tags: [catalogue]
      operationId: listReviews
      security:
        - {}
        - storeToken: [store.read]
      summary: Reviews of an app
      description: |
        Newest first. `summary` is over every review of the entry, not over
        the page, and is repeated on each page. A store that carries no
        reviews (no `reviews` in `features`) answers an empty list and a
        summary with `count` 0.

        This version of the API has no operation that writes a review.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of reviews, and the summary of all of them.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            ETag:
              $ref: "#/components/headers/ETag"
            Vary:
              $ref: "#/components/headers/Vary"
          content:
            application/json:
              schema:
                type: object
                required: [summary, items, nextCursor]
                properties:
                  summary:
                    $ref: "#/components/schemas/ReviewSummary"
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Review"
                  nextCursor:
                    $ref: "#/components/schemas/NextCursor"
              examples:
                reviews:
                  value:
                    summary:
                      count: 2
                      average: 4.5
                      distribution: {"1": 0, "2": 0, "3": 0, "4": 1, "5": 1}
                    items:
                      - id: rv_01J9ZC1E
                        rating: 5
                        title: Does what we need
                        text: Running it for forty people since spring. Upgrades have been uneventful.
                        author: M. K.
                        date: "2026-09-12"
                        language: en
                        version: 31.0.4
                      - id: rv_01J9YQ7B
                        rating: 4
                        title: null
                        text: Solid. The mail integration took some reading.
                        author: An administrator in Bern
                        date: "2026-08-30"
                        language: en
                        version: null
                    nextCursor: null
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/apps/{catalogue}/{app}/reports:
    parameters:
      - $ref: "#/components/parameters/Catalogue"
      - $ref: "#/components/parameters/App"
    get:
      tags: [catalogue]
      operationId: listReports
      security:
        - {}
        - storeToken: [store.read]
      summary: Evaluations and reports about an app
      description: |
        Documents somebody wrote about the app: a security assessment, a
        quality or accessibility evaluation, a licence review. Newest first,
        unpaged. The store states who issued each one; it does not vouch for
        it, and nothing on the cluster reads them.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Every report the store holds for the entry.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            ETag:
              $ref: "#/components/headers/ETag"
            Vary:
              $ref: "#/components/headers/Vary"
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Report"
              examples:
                reports:
                  value:
                    items:
                      - id: rp_01J8T3QH
                        kind: security
                        title: Penetration test of the 31.0 release
                        issuer: Example Security GmbH
                        date: "2026-07-02"
                        summary: Two findings of medium severity, both fixed in 31.0.3. No finding of high severity.
                        version: 31.0.3
                        documentUrl: https://media.store.example/reports/rp_01J8T3QH.pdf
                        documentType: application/pdf
        "304":
          $ref: "#/components/responses/NotModified"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/acquisitions:
    get:
      tags: [acquisitions]
      operationId: listAcquisitions
      summary: What this tenant has acquired
      description: |
        Every acquisition recorded for the tenant URL in the token, in any
        status, newest first. In this listing a confirmation never carries
        a `credential`, whatever the scopes of the token: a credential is
        handed out one acquisition at a time, by the two `POST` operations
        and by `GET /v1/acquisitions/{id}`, and only to a token with the
        scope `store.acquire`.
      parameters:
        - name: status
          in: query
          description: Only acquisitions in this status.
          schema:
            $ref: "#/components/schemas/AcquisitionStatus"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of acquisitions.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Acquisition"
                  nextCursor:
                    $ref: "#/components/schemas/NextCursor"
              examples:
                acquisitions:
                  value:
                    items:
                      - id: acq_01JA2M8Y
                        coordinate: gentian/nextcloud-base-ee
                        status: confirmed
                        createdAt: "2026-10-01T09:14:03Z"
                        updatedAt: "2026-10-01T09:16:40Z"
                        checkoutUrl: null
                        checkoutExpiresAt: null
                        failure: null
                        confirmation:
                          coordinate: gentian/nextcloud-base-ee
                          version: 31.0.4
                          digest: sha256:3f6c0a1e5b7d9c2a4e6f8091a3b5c7d9e1f20314253647586970a1b2c3d4e5f6
                          repository:
                            type: oci
                            url: oci://registry.store.example/apps
                          addons: []
                    nextCursor: null
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [acquisitions]
      operationId: acquire
      summary: Acquire an app for this tenant
      description: |
        Asks the store for an app, for the tenant URL in the token. Three
        answers:

        * `201` — acquired now. The body is the acquisition, `confirmed`,
          with its confirmation. This is what a free app answers, and a paid
          one that needs no checkout (an existing contract, say).
        * `202` — a checkout is needed. The body is the acquisition,
          `pending`, with `checkoutUrl`. The client opens that address in a
          separate window; payment happens there, at the store, and never
          passes through the cluster. The client then asks
          `GET /v1/acquisitions/{id}` until the status is no longer
          `pending`.
        * `200` — this tenant has a live acquisition of the coordinate
          already (`pending` or `confirmed`). The body is that acquisition.
          When it is `confirmed`, its confirmation is for the `version`
          asked, or for the latest version the acquisition covers when none
          is asked: this is how a client obtains the digest of a newer
          version of an app it has acquired.

        A tenant has at most one live acquisition per coordinate.

        `Idempotency-Key` makes a retry safe: a request repeated with the
        same key and the same body within 24 hours answers what the first
        one answered and creates nothing.

        Acquiring is not installing. The store records that the tenant has
        the app and, for an app whose artefacts are in a private repository,
        mints the credential that repository checks. What the cluster does
        with the confirmation is described on the `Confirmation` schema.
      security:
        - storeToken: [store.acquire]
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - name: Idempotency-Key
          in: header
          description: A value the client chooses, unique per attempt to acquire; 1 to 128 visible ASCII characters.
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcquisitionRequest"
            examples:
              latest:
                summary: The latest version
                value:
                  coordinate: gentian/nextcloud-base-ee
              pinned:
                summary: A named version
                value:
                  coordinate: gentian/nextcloud-base-ee
                  version: 31.0.4
      responses:
        "200":
          description: The tenant's existing live acquisition of this coordinate.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Acquisition"
              examples:
                existing:
                  $ref: "#/components/examples/AcquisitionConfirmed"
        "201":
          description: Acquired. The acquisition is `confirmed` and carries its confirmation.
          headers:
            Location:
              description: The acquisition, `/v1/acquisitions/{id}`.
              schema:
                type: string
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Acquisition"
              examples:
                paid:
                  summary: An app in a private repository, with its credential
                  $ref: "#/components/examples/AcquisitionConfirmed"
                free:
                  summary: A free app; no repository and no credential
                  $ref: "#/components/examples/AcquisitionFree"
        "202":
          description: A checkout is needed. The acquisition is `pending` and carries `checkoutUrl`.
          headers:
            Location:
              description: The acquisition, `/v1/acquisitions/{id}`.
              schema:
                type: string
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Acquisition"
              examples:
                checkout:
                  $ref: "#/components/examples/AcquisitionPending"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The `Idempotency-Key` was used before with a different body.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                conflict:
                  value:
                    type: urn:gentian:store:problem:idempotency-conflict
                    code: idempotency-conflict
                    title: This key was used for another request
                    status: 409
                    detail: The Idempotency-Key was first sent with a different coordinate.
        "422":
          $ref: "#/components/responses/NotAcquirable"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/acquisitions/{id}:
    parameters:
      - $ref: "#/components/parameters/AcquisitionId"
    get:
      tags: [acquisitions]
      operationId: getAcquisition
      summary: One acquisition, and its confirmation once confirmed
      description: |
        The outcome of an acquisition. While it is `pending` the answer
        carries `Retry-After`, which a client honours before it asks again
        (and never asks more often than every two seconds). Once it is
        `confirmed` the answer carries the confirmation.

        **Reading the repository credential needs the scope
        `store.acquire`.** The operation itself needs only `store.read`.
        Answered to a token that carries `store.acquire` as well, a
        confirmation's repositories carry the `credential` that is valid
        now. Answered to a token with `store.read` alone, the confirmation
        is the same without any `credential` member — it is `200`, not
        `403`: the acquisition may be read, the secret may not.

        The confirmation is for the latest version the acquisition covers,
        or for `version` when the query names one.

        An acquisition of another tenant answers `404`, not `403`.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - name: version
          in: query
          description: The version the confirmation should be for. Ignored unless the acquisition is `confirmed`.
          schema:
            type: string
      responses:
        "200":
          description: The acquisition.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Acquisition"
              examples:
                pending:
                  $ref: "#/components/examples/AcquisitionPending"
                confirmed:
                  summary: Confirmed, answered to a token with `store.acquire`
                  $ref: "#/components/examples/AcquisitionConfirmed"
                confirmedReadOnly:
                  summary: Confirmed, answered to a token with `store.read` alone; no credential
                  $ref: "#/components/examples/AcquisitionConfirmedNoCredential"
                cancelled:
                  summary: The person left the checkout
                  value:
                    id: acq_01JA2M8Y
                    coordinate: gentian/nextcloud-base-ee
                    status: cancelled
                    createdAt: "2026-10-01T09:14:03Z"
                    updatedAt: "2026-10-01T09:15:11Z"
                    checkoutUrl: null
                    checkoutExpiresAt: null
                    failure: null
                    confirmation: null
                failed:
                  summary: The checkout did not complete
                  value:
                    id: acq_01JA2M8Y
                    coordinate: gentian/nextcloud-base-ee
                    status: failed
                    createdAt: "2026-10-01T09:14:03Z"
                    updatedAt: "2026-10-01T09:15:42Z"
                    checkoutUrl: null
                    checkoutExpiresAt: null
                    failure:
                      reason: payment-declined
                      detail: The payment was declined. Nothing was charged.
                    confirmation: null
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/NotAcquirable"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/acquisitions/{id}/credential:
    parameters:
      - $ref: "#/components/parameters/AcquisitionId"
    post:
      tags: [acquisitions]
      operationId: replaceCredential
      summary: Replace an acquisition's repository credential now
      description: |
        Rotation: replaces the credential of every repository the
        acquisition's confirmation names with a newly minted one, and
        answers the confirmation with the new credentials in place. It
        takes no body. It is what an administrator asks for when a
        credential may have leaked. Nothing calls it on a schedule: a
        credential does not expire (see `Credential`), so there is nothing
        to renew.

        The credential it replaces keeps working for an overlap of 24 hours
        from this call and is refused by the repository from then on. The
        overlap is what lets a cluster in the middle of replacing one never
        hold only a credential the repository refuses. A store ends the old
        credential sooner only by ending the acquisition.

        The user name does not change: it is the tenant's (see
        `Credential`). Only the token is new.

        An acquisition with no repository answers its confirmation
        unchanged. Every store serves this operation.

        The confirmation is for the version the acquisition was last
        confirmed for; `version` in the query names another.
      security:
        - storeToken: [store.acquire]
      parameters:
        - name: version
          in: query
          description: The version the confirmation should be for.
          schema:
            type: string
      responses:
        "200":
          description: The confirmation, with the new credentials.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Confirmation"
              examples:
                replaced:
                  $ref: "#/components/examples/Confirmation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The acquisition is not `confirmed`, so it has no credential to replace.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                notConfirmed:
                  value:
                    type: urn:gentian:store:problem:acquisition-not-confirmed
                    code: acquisition-not-confirmed
                    title: This acquisition is not confirmed
                    status: 409
                    detail: The acquisition was cancelled on 2026-10-01. It has no credential.
        "422":
          $ref: "#/components/responses/NotAcquirable"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
components:
  securitySchemes:
    storeToken:
      type: http
      scheme: bearer
      description: |
        The **store token**: an access token issued by the store's own
        issuer to the tenant's administrator, signed in to the store through
        the App Store app. It is sent as `Authorization: Bearer <token>`. To
        the cluster's side it is opaque: the app reads nothing from it and
        only the store validates it.

        It is required on the signed-in calls — `GET /v1/tenant` and every
        `/v1/acquisitions` operation — and optional on the open reads,
        where it only lets the store personalise an answer.

        ## What it is, and what it is not

        It authenticates the administrator to the store, for what concerns
        the tenant: its standing and its acquisitions. It is valid at the
        store and nowhere on the cluster.

        It is **not** what pulls anything. Charts and images are pulled
        with the tenant's registry credential — the `credential` a
        confirmation carries (see `Credential`) — which the App Store app
        hands to the cluster's custodian once and does not keep. The
        registry never sees the store token, and the store token pulls
        nothing.

        ## Obtaining one

        OAuth 2.0 authorization code with PKCE (RFC 6749, RFC 7636), public
        client, no client secret: a secret shipped to every cluster is not
        one. The administrator signs in once; the result is the store token.

        1. The App Store app's backend reads `issuer`, `clientId` and
           `scopes` from `GET /v1/meta`, and the issuer's endpoints from
           `{issuer}/.well-known/oauth-authorization-server` (RFC 8414). It
           makes `state` and the PKCE verifier and keeps both, with the
           administrator's cluster session.
        2. It sends the person's browser to the authorization endpoint with
           `response_type=code`, `client_id`, `redirect_uri`, `scope`,
           `state`, `code_challenge`, `code_challenge_method=S256`, and
           `tenant_url`: the URL of the tenant the app is installed in,
           `https://<host>`, lower case, no path and no trailing slash —
           the same spelling the cluster's licence report uses for the
           tenant.
        3. The person signs in at the store, with their account there.
        4. The issuer redirects the browser to `redirect_uri` with `code`
           and `state`. That address is the backend's own callback.
        5. **The backend** exchanges the code at the token endpoint with
           `grant_type=authorization_code`, `code`, `redirect_uri`,
           `client_id` and `code_verifier`. The exchange is made from the
           cluster, server to server, never from the browser.

        ## Where the token is kept

        In the App Store app's backend on the cluster, bound to the
        administrator's cluster session, for as long as that session lasts
        and nowhere durable. It is never handed to the browser: not in a
        page, not in a cookie, not in an answer of the backend's. The
        browser carries the code through the redirect and nothing else. The
        same holds for a refresh token.

        ## The redirect address

        There is exactly one per tenant: the App Store app's own callback,

        `https://store.<the tenant's base domain>/oauth/callback`

        The App Store app is component `app-store` of a tenant, and its
        host label is `store`. The tenant's base domain is
        `<tenant>.<cluster domain>` on a multi-tenant cluster, the cluster
        domain itself for the one user tenant of a single-tenant cluster,
        or the tenant's custom domain. It is the host of `tenant_url`, so
        an issuer computes the one address from the request alone —
        `https://store.<host of tenant_url>/oauth/callback` — and no
        address is registered per cluster.

        ## What the issuer must do

        * Accept `clientId` as a public client: no secret, `S256` required,
          a request without a challenge refused.
        * Accept a `redirect_uri` only when it is, character for character,
          the one address above computed from the request's `tenant_url`:
          scheme `https`, the host `store.<host of tenant_url>`, no port,
          the path `/oauth/callback`, no query and no fragment. Any other address under the tenant's
          host is refused, as is any other path on the right host. The
          effect is that a code for a tenant is delivered only to the App
          Store app's backend of that tenant.
        * Refuse a request with no `tenant_url`, or one that is not in the
          spelling above (`error=invalid_request`).
        * Bind the tenant into the token: whatever form the token takes, the
          store's API must be able to read from it the account (`sub`), the
          tenant URL (`tenant_url`), the scopes granted and the expiry, and
          must act for that tenant URL and no other. A token is for one
          tenant. A person in charge of two signs in from each.
        * Not refuse the sign-in because the store does not serve the
          tenant, or because the account is not associated with it. It
          issues the token, and `GET /v1/tenant` states the refusal and
          its reason, so that the app can show it.

        A refresh token may be issued; if it is, it rotates on use and is
        bound to the same tenant URL. Lifetimes are the store's to set.

        ## Scopes

        * `store.read` — reading what concerns the token's tenant:
          `GET /v1/tenant` (its standing and notices),
          `GET /v1/acquisitions`, and `GET /v1/acquisitions/{id}` with its
          confirmation — **without** any repository credential. It is also
          what lets the store personalise an open read (`acquired`).
        * `store.acquire` — changing what the tenant has at the store, and
          reading a repository credential: `POST /v1/acquisitions`, which
          may start a checkout; `POST /v1/acquisitions/{id}/credential`,
          which replaces a credential; and the `credential` members in the
          answer of `GET /v1/acquisitions/{id}`. No answer carries a
          `credential` to a token without this scope.

        No scope is needed for the open reads, and none covers them: they
        are answered with no token at all. A client asks for both scopes at
        sign-in.
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      description: The languages the person reads, RFC 9110. See "Language" in the introduction.
      schema:
        type: string
      example: de-CH, de;q=0.9, en;q=0.5
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: The `ETag` of an answer the client holds. The store answers `304` with no body when it still stands.
      schema:
        type: string
      example: '"7d1c9a40"'
    Cursor:
      name: cursor
      in: query
      description: The `nextCursor` of the previous page, unchanged.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: How many items a page holds at most.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Catalogue:
      name: catalogue
      in: path
      required: true
      description: The first half of a coordinate — the name of the catalogue source the app's profile bundle is published in.
      schema:
        $ref: "#/components/schemas/Name"
    App:
      name: app
      in: path
      required: true
      description: The second half of a coordinate — the name of the app's profile.
      schema:
        $ref: "#/components/schemas/Name"
    AcquisitionId:
      name: id
      in: path
      required: true
      description: The `id` of an acquisition.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{1,64}$"
  headers:
    ContentLanguage:
      description: The language the translatable fields of this answer are in, as a BCP 47 tag.
      schema:
        type: string
      example: de
    CacheControl:
      description: |
        `public, max-age=<seconds>` on an answer given without regard to a
        token; `private, no-store` on one the store personalised from a
        token.
      schema:
        type: string
      example: public, max-age=300
    ETag:
      description: A validator for this answer, for `If-None-Match`. Absent from an answer the store personalised from a token.
      schema:
        type: string
      example: '"7d1c9a40"'
    Vary:
      description: Always `Accept-Language, Authorization` on an open read.
      schema:
        type: string
      example: Accept-Language, Authorization
    NoStore:
      description: Always `no-store`. The answer is about one tenant, and may carry a credential.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Seconds to wait before the next request.
      schema:
        type: integer
        minimum: 0
      example: 5
    RateLimitLimit:
      description: How many requests the caller may make in the current window.
      schema:
        type: integer
    RateLimitRemaining:
      description: How many of them are left.
      schema:
        type: integer
    RateLimitReset:
      description: Seconds until the window starts again.
      schema:
        type: integer
  responses:
    NotModified:
      description: The answer the client holds, named by `If-None-Match`, still stands. No body.
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
    InvalidRequest:
      description: A parameter or the body is malformed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            invalid:
              value:
                type: urn:gentian:store:problem:invalid-request
                code: invalid-request
                title: The request is not valid
                status: 400
                detail: coordinate must be <catalogue>/<app>.
                errors:
                  - field: coordinate
                    detail: must be <catalogue>/<app>
    Unauthenticated:
      description: |
        No token, or one that is expired or was not issued by this store.
        Signed-in calls only: an open read never answers this.
      headers:
        WWW-Authenticate:
          description: "`Bearer`, with `error=\"invalid_token\"` when a token was sent (RFC 6750)."
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            unauthenticated:
              value:
                type: urn:gentian:store:problem:unauthenticated
                code: unauthenticated
                title: Sign in to the store
                status: 401
                detail: The token has expired.
    InsufficientScope:
      description: The token lacks the scope the operation needs.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            scope:
              $ref: "#/components/examples/ProblemInsufficientScope"
    Forbidden:
      description: |
        Either the store does not serve the tenant in the token
        (`tenant-refused`, with `reason`), or the token lacks the scope the
        operation needs (`insufficient-scope`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            tenantRefused:
              value:
                type: urn:gentian:store:problem:tenant-refused
                code: tenant-refused
                title: The store does not serve this tenant
                status: 403
                reason: no-reports-for-tenant
                detail: >-
                  No licence report names https://acme.example. The store serves tenants of clusters that report;
                  ask the cluster's administrator whether reporting is on.
            scope:
              $ref: "#/components/examples/ProblemInsufficientScope"
    NotFound:
      description: No such app, acquisition or page — or one that is another tenant's.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            notFound:
              value:
                type: urn:gentian:store:problem:not-found
                code: not-found
                title: Not found
                status: 404
                detail: The store lists no app gentian/nextcloud-base-xx.
    NotAcquirable:
      description: The app or the version named exists and cannot be acquired by this tenant.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            version:
              value:
                type: urn:gentian:store:problem:not-acquirable
                code: not-acquirable
                title: This version cannot be acquired
                status: 422
                detail: Version 29.0.1 of gentian/nextcloud-base-ee has been withdrawn.
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            rateLimited:
              value:
                type: urn:gentian:store:problem:rate-limited
                code: rate-limited
                title: Too many requests
                status: 429
                detail: Try again in 30 seconds.
    Internal:
      description: The store failed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            internal:
              value:
                type: urn:gentian:store:problem:internal
                code: internal
                title: The store failed
                status: 500
                detail: Quote reference 7f3a91c2 when reporting this.
    Unavailable:
      description: The store is temporarily not serving.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            unavailable:
              value:
                type: urn:gentian:store:problem:unavailable
                code: unavailable
                title: The store is not available
                status: 503
                detail: Maintenance until 06:00 UTC.
  schemas:
    Name:
      type: string
      description: A DNS label, as the cluster spells the name of a catalogue source and of a profile.
      pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
      examples: [nextcloud-base-ee]
    Coordinate:
      type: string
      description: |
        `<catalogue>/<app>`: the name of a catalogue source, a slash, and
        the name of the app's profile in it. It is the identity of a store
        entry and the value an install request to the cluster carries. A
        profile's name includes its edition, so each edition of an app is
        an entry of its own.
      pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?/[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
      examples: [gentian/nextcloud-base-ee]
    Digest:
      type: string
      description: |
        The SHA-256 of an app version's profile bundle — the exact bytes the
        catalogue source serves for it — as `sha256:` and 64 lower-case
        hexadecimal characters. It is what the cluster pins and verifies:
        the cluster fetches the bundle from its own catalogue source and
        refuses it unless it hashes to this value.
      pattern: "^sha256:[0-9a-f]{64}$"
      examples: ["sha256:3f6c0a1e5b7d9c2a4e6f8091a3b5c7d9e1f20314253647586970a1b2c3d4e5f6"]
    Edition:
      type: string
      description: |
        The edition of an entry, with the values a profile carries on the
        cluster. `ce`: the community edition as its upstream publishes it.
        `pe`: a private edition, an operator's own profile. `me`: the
        community edition with active maintenance. `ee`: an enterprise
        edition, commercially licensed. Closed: a client refuses an entry
        with any other value.
      enum: [ce, pe, me, ee]
    TrustTier:
      type: string
      description: The review level the entry's profile states, with the values a profile carries on the cluster. Closed.
      enum: [platform, certified, experimental]
    NextCursor:
      type: [string, "null"]
      description: The cursor of the next page; `null` on the last.
    Url:
      type: string
      format: uri
      description: An absolute `https` URL.
      pattern: "^https://"
    Meta:
      type: object
      required: [apiVersion, name, issuer, clientId, scopes, defaultLanguage, languages, mediaOrigins, checkoutOrigins, features]
      properties:
        apiVersion:
          type: string
          description: The version of this API the store serves, `<major>.<minor>`. The major is the `/v1` of the paths.
          pattern: "^1\\.[0-9]+$"
        name:
          type: string
          description: What the store calls itself. Plain text, shown as the title of the App Store app's sign-in.
          maxLength: 80
        issuer:
          $ref: "#/components/schemas/Url"
          description: The OAuth 2.0 issuer a person signs in at. Its metadata is at `{issuer}/.well-known/oauth-authorization-server`.
        clientId:
          type: string
          description: The public client id every App Store app uses at that issuer.
        scopes:
          type: array
          description: The scopes a client asks for.
          items:
            type: string
          examples: [[store.read, store.acquire]]
        defaultLanguage:
          type: string
          description: The language the store answers in when none asked for matches. BCP 47.
        languages:
          type: array
          description: The languages the store has translations in.
          items:
            type: string
        mediaOrigins:
          type: array
          description: |
            The origins (`https://host[:port]`) image URLs in answers are
            on. A client loads images from these and from nowhere else, and
            may fix its content security policy from this list.
          items:
            type: string
        checkoutOrigins:
          type: array
          description: The origins a `checkoutUrl` is on. A client opens a checkout address on one of these and refuses any other.
          items:
            type: string
        features:
          type: array
          description: |
            What this store carries beyond the minimum. Open: a client
            ignores values it does not know. `reviews`: apps have reviews.
            `reports`: apps have evaluations and reports. `checkout`: an
            acquisition may answer `202` with a checkout address.
          items:
            type: string
        links:
          type: object
          description: Pages of the store's a client may link to. Each is opened in a separate window.
          properties:
            terms:
              $ref: "#/components/schemas/Url"
            privacy:
              $ref: "#/components/schemas/Url"
            support:
              $ref: "#/components/schemas/Url"
            account:
              $ref: "#/components/schemas/Url"
              description: Where a person manages their store account.
    TenantStanding:
      type: object
      required: [tenantUrl, known, served, refusal, notices]
      properties:
        tenantUrl:
          type: string
          description: The tenant URL the token is bound to, echoed.
        known:
          type: boolean
          description: Whether the store holds at least one licence report that lists this tenant URL.
        lastReportAt:
          type: [string, "null"]
          format: date-time
          description: The `sentAt` of the latest such report; `null` when `known` is false.
        served:
          type: boolean
          description: |
            Whether the store serves this tenant. False means every
            `/v1/acquisitions` operation answers `403` `tenant-refused`,
            and `refusal` says why. The open reads are answered either way.
        refusal:
          oneOf:
            - $ref: "#/components/schemas/Refusal"
            - type: "null"
          description: Present exactly when `served` is false.
        notices:
          type: array
          description: Things the store has to tell this tenant's administrator. Shown in order. None of them blocks anything.
          items:
            $ref: "#/components/schemas/Notice"
    RefusalReason:
      type: string
      description: |
        Why the store does not serve a tenant. Open: a client shows `detail`
        for a value it does not know.

        * `no-reports-for-tenant` — no licence report lists this tenant URL.
          Either the cluster does not report, or the URL stated at sign-in
          is not the tenant's.
        * `tenant-not-claimed` — reports exist, and the account signed in
          is not associated with this tenant: it is not the account of the
          tenant's administrator (or another the store lets act for the
          tenant). With this reason `GET /v1/tenant` answers
          `served: false`, every `/v1/acquisitions` operation answers `403`
          `tenant-refused` — also for an `id` that exists, so that the
          account learns nothing of the tenant's acquisitions — and an open
          read is answered as the anonymous one, without `acquired`.
        * `reports-stale` — reports exist and the latest is older than the
          store accepts.
        * `tenant-blocked` — the store has decided not to serve this tenant.
      examples: [no-reports-for-tenant]
    Refusal:
      type: object
      required: [reason, detail]
      properties:
        reason:
          $ref: "#/components/schemas/RefusalReason"
        detail:
          type: string
          description: The reason in words, in the language of the request. Plain text. Shown to the person as it is.
        link:
          $ref: "#/components/schemas/Link"
    Notice:
      type: object
      required: [type, severity, text]
      properties:
        type:
          type: string
          description: |
            What kind of notice. Open: a client shows a notice of a type it
            does not know like `message`.

            * `free-licence-limit` — the cluster this tenant is on has no
              subscription. The text states that the free licence covers
              clusters of fewer than 50 users that are not operated for
              resale.
            * `reports-stale` — the latest licence report is old.
            * `message` — anything else the store has to say.
          examples: [free-licence-limit]
        severity:
          type: string
          description: How prominently to show it. Closed.
          enum: [info, warning]
        title:
          type: [string, "null"]
          description: A short heading. Plain text.
          maxLength: 120
        text:
          type: string
          description: The notice. Plain text, in the language of the request.
          maxLength: 2000
        link:
          $ref: "#/components/schemas/Link"
    Link:
      type: object
      required: [url]
      properties:
        rel:
          type: string
          description: |
            What the link leads to. Open; a client shows `label`, or the
            address, for a value it does not know. Values: `homepage`,
            `documentation`, `source`, `support`, `licence`, `privacy`,
            `terms`, `subscription`.
        label:
          type: [string, "null"]
          description: What to call it. Plain text.
          maxLength: 80
        url:
          $ref: "#/components/schemas/Url"
    Category:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: Stable across languages; what the `category` filter takes and what an app's `categories` hold.
          pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
        name:
          type: string
          description: The category's name in the language of the request.
          maxLength: 80
    Publisher:
      type: object
      description: Who publishes the entry — the party that maintains or licenses it.
      required: [name]
      properties:
        name:
          type: string
          maxLength: 120
        url:
          oneOf:
            - $ref: "#/components/schemas/Url"
            - type: "null"
    EditionRef:
      type: object
      description: One edition an app is offered in, and the entry that is that edition.
      required: [edition, coordinate]
      properties:
        edition:
          $ref: "#/components/schemas/Edition"
        coordinate:
          $ref: "#/components/schemas/Coordinate"
    Price:
      type: object
      description: |
        The list price of the entry: what the store asks of anybody, the
        same with a token and without. It is shown, not computed with. What
        a tenant is charged — a contract rate, a discount, tax — is what the
        checkout says, and is not in this API.
      required: [model]
      properties:
        model:
          type: string
          description: |
            `free`: nothing is charged and no checkout follows. `one-time`:
            charged once. `subscription`: charged every `period`. `quote`:
            the store names no amount; `note` says how to obtain one. Closed.
          enum: [free, one-time, subscription, quote]
        amount:
          type: [string, "null"]
          description: A decimal number as a string, with a point and no grouping (`"4.50"`). `null` for `free` and `quote`.
          pattern: "^[0-9]+(\\.[0-9]{1,4})?$"
        currency:
          type: [string, "null"]
          description: ISO 4217, upper case. `null` exactly when `amount` is.
          pattern: "^[A-Z]{3}$"
        per:
          type: [string, "null"]
          description: What the amount is multiplied by. `tenant`, `user`, or `null` when it is a flat amount.
          enum: [tenant, user, null]
        period:
          type: [string, "null"]
          description: For `subscription`, how often it is charged.
          enum: [month, year, null]
        note:
          type: [string, "null"]
          description: Anything the numbers do not say. Plain text.
          maxLength: 300
    AppSummary:
      type: object
      required:
        - coordinate
        - family
        - name
        - summary
        - iconUrl
        - categories
        - publisher
        - edition
        - editions
        - trustTier
        - latestVersion
        - price
      properties:
        coordinate:
          $ref: "#/components/schemas/Coordinate"
        family:
          type: string
          description: The app this entry is an edition of, the same on every edition of it. Not shown; it groups entries.
          pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
        name:
          type: string
          description: The app's display name. Plain text.
          maxLength: 80
        summary:
          type: string
          description: One or two sentences. Plain text.
          maxLength: 300
        iconUrl:
          oneOf:
            - $ref: "#/components/schemas/Url"
            - type: "null"
          description: A square image, at least 128 by 128 pixels, on one of `mediaOrigins`. `null` when the store has none.
        categories:
          type: array
          description: Category ids.
          items:
            type: string
        publisher:
          $ref: "#/components/schemas/Publisher"
        edition:
          $ref: "#/components/schemas/Edition"
        editions:
          type: array
          description: Every edition the app is offered in, this entry's included, each with the coordinate of the entry that is that edition.
          minItems: 1
          items:
            $ref: "#/components/schemas/EditionRef"
        trustTier:
          $ref: "#/components/schemas/TrustTier"
        latestVersion:
          type: string
          description: The newest version the store lists for the entry.
        price:
          $ref: "#/components/schemas/Price"
        acquired:
          type: boolean
          description: |
            Whether the tenant in the token has a `confirmed` acquisition of
            this coordinate. Optional, and present only on an answer to a
            request that carried a valid token of a tenant the store
            serves; absent from every anonymous answer. A client never
            depends on it: `GET /v1/acquisitions` says the same.
        rating:
          oneOf:
            - $ref: "#/components/schemas/ReviewSummary"
            - type: "null"
          description: The summary of the entry's reviews; `null` when the store carries none.
    AppDetail:
      allOf:
        - $ref: "#/components/schemas/AppSummary"
        - type: object
          required: [description, screenshots, versions, addons, addonOf, links, licence]
          properties:
            description:
              type: string
              description: The long text. Markdown, the subset `store-markdown-1`.
              maxLength: 20000
            screenshots:
              type: array
              description: In the order to show them.
              items:
                $ref: "#/components/schemas/Screenshot"
            versions:
              type: array
              description: |
                The versions the store lists, newest first; at most 50. The
                first is `latestVersion`. Each states the digest an install
                of it is pinned to.
              minItems: 1
              maxItems: 50
              items:
                $ref: "#/components/schemas/Version"
            addons:
              type: array
              description: The add-ons that exist for this entry. Each is a store entry of its own, with its own coordinate.
              items:
                $ref: "#/components/schemas/AddonRef"
            addonOf:
              oneOf:
                - $ref: "#/components/schemas/Coordinate"
                - type: "null"
              description: When this entry is itself an add-on, the coordinate of the app it extends; otherwise `null`.
            links:
              type: array
              items:
                $ref: "#/components/schemas/Link"
            licence:
              oneOf:
                - $ref: "#/components/schemas/Licence"
                - type: "null"
              description: The licence the app is distributed under.
    Screenshot:
      type: object
      required: [url, contentType]
      properties:
        url:
          $ref: "#/components/schemas/Url"
          description: On one of `mediaOrigins`.
        contentType:
          type: string
          enum: [image/png, image/jpeg, image/webp]
        width:
          type: [integer, "null"]
          description: In pixels, when the store knows it.
        height:
          type: [integer, "null"]
        caption:
          type: [string, "null"]
          description: Also the image's alternative text. Plain text.
          maxLength: 200
    Version:
      type: object
      required: [version, digest, releasedAt, releaseNotes, requirements]
      properties:
        version:
          type: string
          description: The catalogue version of the entry, as its catalogue source's index states it.
          maxLength: 64
        digest:
          $ref: "#/components/schemas/Digest"
        releasedAt:
          type: string
          format: date-time
          description: When this version was published. RFC 3339, UTC.
        releaseNotes:
          type: string
          description: What changed. Markdown, the subset `store-markdown-1`. May be empty.
          maxLength: 20000
        requirements:
          $ref: "#/components/schemas/Requirements"
    Requirements:
      type: object
      description: |
        What the version needs, for a person to read before acquiring. It is
        a description: what the cluster enforces is what the profile bundle
        itself declares, and the cluster reads that from the bundle, never
        from here.
      properties:
        platform:
          type: [string, "null"]
          description: The Gentian OS versions it runs on, as a range (`>=0.5`).
        resources:
          type: [object, "null"]
          description: The least the app reserves, as Kubernetes quantities.
          properties:
            cpu:
              type: [string, "null"]
              examples: [500m]
            memory:
              type: [string, "null"]
              examples: [1Gi]
            storage:
              type: [string, "null"]
              examples: [10Gi]
        notes:
          type: array
          description: Anything else, one sentence each. Plain text.
          items:
            type: string
            maxLength: 300
    AddonRef:
      type: object
      required: [coordinate, name, summary]
      properties:
        coordinate:
          $ref: "#/components/schemas/Coordinate"
        name:
          type: string
          maxLength: 80
        summary:
          type: string
          maxLength: 300
    Licence:
      type: object
      required: [name]
      properties:
        spdx:
          type: [string, "null"]
          description: The SPDX identifier, when the licence has one.
        name:
          type: string
          maxLength: 120
        url:
          oneOf:
            - $ref: "#/components/schemas/Url"
            - type: "null"
    ReviewSummary:
      type: object
      required: [count, average, distribution]
      properties:
        count:
          type: integer
          minimum: 0
        average:
          type: [number, "null"]
          description: The mean rating, 1 to 5, to one decimal; `null` when `count` is 0.
          minimum: 1
          maximum: 5
        distribution:
          type: object
          description: How many reviews gave each rating. Keys `"1"` to `"5"`, all present.
          required: ["1", "2", "3", "4", "5"]
          additionalProperties: false
          properties:
            "1": {type: integer, minimum: 0}
            "2": {type: integer, minimum: 0}
            "3": {type: integer, minimum: 0}
            "4": {type: integer, minimum: 0}
            "5": {type: integer, minimum: 0}
    Review:
      type: object
      required: [id, rating, text, author, date]
      properties:
        id:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        title:
          type: [string, "null"]
          description: Plain text.
          maxLength: 120
        text:
          type: string
          description: Plain text, as its author wrote it and in the language they wrote it in. Not translated.
          maxLength: 5000
        author:
          type: string
          description: |
            The author's display name as the store chooses to show it. It is
            the only thing about the author this API carries; whether it
            is a name, initials or a description is the store's decision.
          maxLength: 80
        date:
          type: string
          format: date
          description: The day the review was written.
        language:
          type: [string, "null"]
          description: The language of `text`, BCP 47, when the store knows it.
        version:
          type: [string, "null"]
          description: The version the review is about, when the author said.
    Report:
      type: object
      required: [id, kind, title, date, summary, documentUrl]
      properties:
        id:
          type: string
        kind:
          type: string
          description: |
            What the document is. Open; a client shows a value it does not
            know as `other`. Values: `security`, `quality`, `accessibility`,
            `privacy`, `licence`, `other`.
          examples: [security]
        title:
          type: string
          description: Plain text.
          maxLength: 200
        issuer:
          type: [string, "null"]
          description: Who wrote it. Plain text.
          maxLength: 120
        date:
          type: string
          format: date
          description: The day the document is dated.
        summary:
          type: string
          description: What it found, in a few sentences. Plain text.
          maxLength: 2000
        version:
          type: [string, "null"]
          description: The version of the app it is about, when it is about one.
        documentUrl:
          $ref: "#/components/schemas/Url"
          description: The document itself. Opened in a separate window, never embedded.
        documentType:
          type: [string, "null"]
          description: The document's media type, when the store knows it.
          examples: [application/pdf]
    AcquisitionRequest:
      type: object
      required: [coordinate]
      additionalProperties: false
      properties:
        coordinate:
          $ref: "#/components/schemas/Coordinate"
        version:
          type: string
          description: The version to confirm. Absent means the latest the store lists.
    AcquisitionStatus:
      type: string
      description: |
        * `pending` — a checkout is open. `checkoutUrl` is present.
        * `confirmed` — the tenant has the app. `confirmation` is present.
        * `cancelled` — the person left the checkout, or the acquisition
          was ended later. Ending an acquisition ends the credential
          issued for it (see `Credential`).
        * `failed` — the checkout did not complete. `failure` says why.

        `pending` becomes one of the other three and never the reverse.
        `confirmed` may become `cancelled`. Closed.
      enum: [pending, confirmed, cancelled, failed]
    Acquisition:
      type: object
      required: [id, coordinate, status, createdAt, updatedAt, checkoutUrl, checkoutExpiresAt, failure, confirmation]
      properties:
        id:
          type: string
          description: The store's name for this acquisition. Opaque.
          pattern: "^[A-Za-z0-9_-]{1,64}$"
        coordinate:
          $ref: "#/components/schemas/Coordinate"
        status:
          $ref: "#/components/schemas/AcquisitionStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: When the status last changed.
        checkoutUrl:
          oneOf:
            - $ref: "#/components/schemas/Url"
            - type: "null"
          description: |
            Where the person completes the acquisition, at the store.
            Present exactly while the status is `pending`. On one of
            `checkoutOrigins`. It is opened in a separate window and is
            usable only by a person signed in to the store.
        checkoutExpiresAt:
          type: [string, "null"]
          format: date-time
          description: When an unfinished checkout is given up and the acquisition becomes `cancelled`.
        failure:
          type: [object, "null"]
          description: Present exactly when the status is `failed`.
          required: [reason, detail]
          properties:
            reason:
              type: string
              description: Open. Values include `payment-declined`, `checkout-expired`, `not-available`.
            detail:
              type: string
              description: The reason in words, in the language of the request. Plain text.
        confirmation:
          oneOf:
            - $ref: "#/components/schemas/Confirmation"
            - type: "null"
          description: Present exactly when the status is `confirmed`.
    Confirmation:
      description: |
        What the store hands the cluster's side when a tenant has an app:
        which build, and — when the build's artefacts are in a private
        repository — where they are and the credential that repository
        checks. It is a statement of facts. It is not signed, the cluster
        verifies nothing about its origin beyond the TLS connection it came
        over, and it grants nothing on the cluster.

        What the App Store app does with it, in this order, each step under
        the signed-in person's own token and subject to the cluster's own
        checks:

        1. For each distinct `repository` in the confirmation and its
           `addons`: compute the name it is declared under (see
           `Repository`; the store names nothing on the cluster), declare
           it for the tenant at the director
           (`PUT /v1/tenants/{t}/repositories/{name}` with
           `{"role": "apps", "type": <type>, "url": <url>}`), then set its
           credential at the custodian
           (`PUT /v1/credentials/repository-<name>` with the fields
           `username` and `password`, the password being `token`). The
           credential is handed over once and not kept by the app.
        2. Install at the director
           (`POST /v1/tenants/{t}/apps/{app}` with
           `{"coordinate", "digest", "defaultGrant"}`), `coordinate` and
           `digest` being exactly the ones here.

        The cluster then fetches the profile bundle from the catalogue
        source its own Cluster claim names for `<catalogue>`, and installs
        only if those bytes hash to `digest`.
      allOf:
        - $ref: "#/components/schemas/ConfirmedItem"
        - type: object
          required: [addons]
          properties:
            addons:
              type: array
              description: |
                The add-ons this acquisition includes, each with its own
                coordinate, version and digest. Empty when it includes none.
              items:
                $ref: "#/components/schemas/ConfirmedItem"
    ConfirmedItem:
      type: object
      required: [coordinate, version, digest]
      properties:
        coordinate:
          $ref: "#/components/schemas/Coordinate"
        version:
          type: string
          description: The version confirmed, for a person to read. The cluster pins `digest`, not this.
        digest:
          $ref: "#/components/schemas/Digest"
        repository:
          $ref: "#/components/schemas/Repository"
    Repository:
      type: object
      description: |
        The private repository an app's chart and images are pulled from.
        Absent for an app whose artefacts are public: a free app's
        confirmation carries no repository and no credential.

        **The store names nothing on the cluster.** A repository is its
        `type` and its `url`. The name it is declared under on the cluster
        is computed there, by the App Store app, from the tenant's name on
        the cluster and `url`:

            address = url without the leading "oci://", lower-cased
            slug    = address with every run of characters outside [a-z0-9]
                      replaced by one "-", leading and trailing "-" removed
            hash    = the first 8 hexadecimal characters, lower case, of
                      SHA-256(tenant + LF + address), UTF-8, LF being the
                      one byte 0x0A
            stem    = tenant + "-" + slug, cut to its first 31 characters,
                      trailing "-" removed
            name    = stem + "-" + hash          (at most 40 characters)

        Tenant `acme` and `oci://registry.store.example/apps` give
        `acme-registry-store-example-app-991ae7e1`; tenant `demo` and
        `oci://ghcr.io/example` give `demo-ghcr-io-example-59b6b43d`.

        The same tenant and the same `url` always give the same name, and
        two tenants never share one. A store therefore hands a tenant the
        same `url` for the same repository every time, in one spelling.
      required: [type, url]
      properties:
        type:
          type: string
          description: |
            The kind of repository, in the cluster's own spelling. Only
            `oci` is accepted from a store: an OCI registry holding charts
            and images. It is the only type a cluster pulls a tenant's app
            charts and images from with a credential today. The cluster's
            director also knows `git`, and a
            client refuses it in a confirmation — on a cluster a git
            repository of apps is a source of profiles, which is exactly
            what a store may not supply. Closed.
          enum: [oci]
        url:
          type: string
          description: |
            The registry address, `oci://<host>[/<path>]`, with no
            credentials in it and no trailing slash. It must contain the
            address the entry's profile bundle itself names for its chart:
            the same host and port, and a path that is a prefix of the
            chart's by whole segments. The cluster pulls from where the
            verified bundle says, and this declaration only supplies the
            credential for that address. It must not overlap another
            repository the same tenant has declared: the cluster does not
            install a chart whose address lies inside two of a tenant's
            repositories, rather than guess which credential is meant. A
            chart inside none is pulled with no credential.
          pattern: "^oci://[^\\s/@]+(/[^\\s@]+)?$"
          examples: ["oci://registry.store.example/apps"]
        credential:
          $ref: "#/components/schemas/Credential"
    Credential:
      type: object
      description: |
        The tenant's registry credential: what the repository checks on
        every pull. The store mints it for one tenant; the repository
        refuses pulls without it. To the cluster it is opaque: the App
        Store app hands the user name and the token to the cluster's
        custodian once, the cluster stores them in its vault, hands them to
        what pulls, and never interprets, logs or returns them.

        It is not the store token (see the security scheme `storeToken`):
        that one authenticates a person to the store, this one pulls.

        **One per tenant and repository.** The cluster keeps one credential
        for each repository address a tenant has declared. Every
        confirmation a store hands one tenant for the same `url` therefore
        carries the same `username` and a token that pulls everything that
        tenant has acquired in that repository.

        **It does not expire, for now.** A store issues credentials with no
        expiry: `expiresAt` is `null`. Two things end one. *Rotation*:
        `POST /v1/acquisitions/{id}/credential` replaces it, and the
        replaced one is refused after the overlap stated there. *The end of
        the acquisition*: a credential stops pulling an app when the
        tenant's acquisition of it ends (`cancelled`), and is refused
        altogether once it serves no acquisition.

        Holding it is what makes a private app arrive on a cluster. It does
        not keep the app to one tenant of that cluster: the cluster's chart
        installer caches charts by name and version, so a chart one tenant
        pulled can be installed by another tenant of the same cluster until
        that process restarts, and an image already on a node can be started
        by any pod that does not force a pull. The credential is not
        disclosed by either; the artefact is. Image credentials reach a pod
        only through a chart that takes `imagePullSecrets` or
        `global.imagePullSecrets`.

        Absent from a `Repository` in `GET /v1/acquisitions`, and in every
        answer to a token without the scope `store.acquire`.
      required: [username, token, expiresAt]
      properties:
        username:
          type: string
          description: |
            The user name the registry expects with the token. One per
            tenant: the store chooses it, hands the same one to the same
            tenant every time, and to no other tenant. The cluster treats
            it as opaque and stores it beside the token. Required: the
            cluster's chart installer needs a user name and a password, and
            a token with no user name fails there.
          minLength: 1
          maxLength: 255
        token:
          type: string
          description: The secret. No leading or trailing whitespace.
          minLength: 1
          maxLength: 4096
        expiresAt:
          type: [string, "null"]
          format: date-time
          description: |
            `null`: the credential does not expire. A store issues every
            credential with `null` for now. The member stays in the format,
            and stays required, so that an expiry can be introduced later
            without changing it; a client that is handed a date shows it
            and does nothing else on its account.
    Problem:
      type: object
      description: RFC 9457 problem details, with the members this API adds.
      required: [type, code, title, status]
      properties:
        type:
          type: string
          description: "`urn:gentian:store:problem:` followed by `code`."
          examples: ["urn:gentian:store:problem:tenant-refused"]
        code:
          type: string
          description: The stable value a client branches on. Open; a client treats one it does not know by its `status`.
          examples: [tenant-refused]
        title:
          type: string
          description: A short, fixed summary of the code, in the language of the request.
        status:
          type: integer
          description: The HTTP status, repeated.
        detail:
          type: string
          description: What happened this time, for a person, in the language of the request. Plain text.
        instance:
          type: string
          description: The store's reference for this occurrence, to quote when asking for help.
        reason:
          $ref: "#/components/schemas/RefusalReason"
          description: With `tenant-refused` only.
        errors:
          type: array
          description: With `invalid-request`, the fields that are wrong.
          items:
            type: object
            required: [field, detail]
            properties:
              field:
                type: string
                description: The parameter's name, or the member's path in the body (`version`).
              detail:
                type: string
