# =============================================================================
# credentials.yaml — the credential catalogue for this gentian-os release
# =============================================================================
# Every secret that must be supplied from OUTSIDE the cluster. Derived and
# generated credentials are absent by design: derived ones are HMAC-SHA256 of
# the master password and need no human, generated ones are written by a
# provider at provision time and read by ESO.
#
# This file is the source of truth. The CredentialRequirement CRs shipped in the
# platform Configuration package are generated from it by
# scripts/gen/gen-credential-requirements.py, and `make verify-gen` asserts the two
# carriers agree. Editing one without regenerating the other fails CI.
#
# Two carriers exist because of the bootstrap paradox: the catalogue of required
# credentials lives in CRDs, which arrive in the Configuration package, which
# lives in a registry, which needs a credential. Shipping the same content
# bundled with the installer breaks the cycle.
#
# EVERY path lives under gentian-os/kernel/. That is not a naming preference:
# the eso-read policy in the Cluster composition grants read on
# secret/data/gentian-os/kernel/* and nothing else, so a path outside that
# prefix cannot be read by ESO — the satisfaction probe would report unsatisfied
# forever no matter what was stored there.
#
# phase: bootstrap blocks installation. That set is deliberately tiny — under
# five — and every member must be validatable with curl or openssl alone.
# Anything needing an SDK or request signing is runtime by that fact and belongs
# to the on-cluster credential manager.
# =============================================================================

requirements:
  # ── Tier 0 ────────────────────────────────────────────────────────────────
  # The only credential that cannot be declared as data: a private deployments
  # repository cannot describe its own access. Prompted by the installer,
  # written to OpenBao, and consumed thereafter like any other.
  - name: deployments-repository
    displayName: "Deployments Repository Access"
    description: >
      Token for the Git repository holding this cluster's configuration. The
      installer needs it before it can clone the repository that would otherwise
      describe it, so it is supplied at the prompt rather than declared.
    phase: bootstrap
    scope: cluster
    optional: false
    vaultPath: gentian-os/kernel/repositories/deployments
    fields:
      - key: username
        format: string
        secret: false
        example: x-access-token
      # `password`, not `token`: the seeder writes this path with username and
      # password, and the XRepository Composition reads the same two field names
      # to build the ArgoCD repository Secret. Declaring it as `token` made this
      # catalogue the only thing asking for a field nobody writes, so its ESO
      # probe reported the credential missing while the value sat beside it
      # under the other name.
      - key: password
        format: token
        secret: true
    validate:
      type: git-https
    consumedBy:
      - kind: XRepository
        name: deployments

  # ── Root of the derived-credential class ──────────────────────────────────
  - name: master-password
    displayName: "Master Password"
    description: >
      Root of every derived credential in the cluster. Database users, service
      accounts and app passwords are HMAC-SHA256 of this value plus a salt, so
      it is the single most important secret an operator supplies and the only
      one whose loss cannot be repaired by rotation alone.
    phase: bootstrap
    scope: cluster
    optional: false
    vaultPath: gentian-os/kernel/internal/master-password
    fields:
      - key: value
        format: password
        secret: true
        minLength: 16
    # The derivation salt is deliberately NOT a field here. It is a *generated*
    # credential (§3), produced at first install and stored beside this value at
    # the same path — not something an operator can meaningfully choose. Listing
    # it made the installer demand it: a non-interactive install aborted asking
    # for DERIVATION_SALT, and an interactive one asked a human to invent one.
    # No endpoint to probe: this credential is not checked against anything
    # external, it defines internal values. The minLength rule above is the
    # whole of its validation, declared once rather than hardcoded twice.
    validate:
      type: noop
    consumedBy:
      - kind: XCluster
        name: cluster

  # ── Private chart and image registry ──────────────────────────────────────
  - name: infra-chart-registry
    displayName: "Infrastructure Chart Registry"
    description: >
      Credentials for the registry supplying infrastructure Helm charts and
      container images. A cluster pulling only from public registries can leave
      this unset.
    phase: bootstrap
    scope: cluster
    optional: true
    vaultPath: gentian-os/kernel/storage/registry
    fields:
      - key: username
        format: string
        secret: false
      - key: password
        format: password
        secret: true
    validate:
      type: oci-registry
    consumedBy:
      - kind: XRepository
        name: infra-charts

  # ── DNS-01 for wildcard TLS ───────────────────────────────────────────────
  - name: acme-dns-cloudflare
    displayName: "Cloudflare DNS API Token"
    description: >
      Token with DNS edit rights on the kernel domain's zone, used for DNS-01
      ACME challenges. Required when the cluster issues a wildcard certificate;
      not needed for HTTP-01, a private CA, or self-signed issuance.
    phase: bootstrap
    scope: cluster
    optional: true
    vaultPath: gentian-os/kernel/dns/cloudflare
    fields:
      - key: api-token
        format: token
        secret: true
    # A zone lookup for the kernel domain: one authenticated GET, so it stays
    # inside the curl-only ceiling, and it asks the question that matters —
    # can this token reach the zone DNS-01 has to write to. The token-verify
    # endpoint answers a different one: it rejects account-owned tokens outright
    # and passes tokens with no access to this domain.
    validate:
      type: cloudflare-dns
    consumedBy:
      - kind: XCluster
        name: cluster

  # ── Runtime ───────────────────────────────────────────────────────────────
  - name: smtp-relay
    displayName: "SMTP Relay Credentials"
    description: >
      Credentials for the upstream mail relay, used when the cluster sends mail
      through an external provider rather than running its own Postfix.
    phase: runtime
    scope: cluster
    optional: true
    vaultPath: gentian-os/kernel/mail/postfix
    fields:
      - key: relay_username
        format: string
        secret: false
        example: notifications@example.com
      - key: relay_password
        format: password
        secret: true
    validate:
      type: smtp
    consumedBy:
      - kind: XCluster
        name: cluster

  - name: argocd-github-webhook
    displayName: "ArgoCD GitHub Webhook Secret"
    description: >
      Shared secret validating inbound GitHub webhooks to ArgoCD. Without it
      ArgoCD still syncs on its polling interval, so this only shortens the
      delay between a push and a sync.
    phase: runtime
    scope: cluster
    optional: true
    vaultPath: gentian-os/kernel/argocd/github-webhook
    fields:
      - key: secret
        format: token
        secret: true
    validate:
      type: noop
    consumedBy:
      - kind: XCluster
        name: cluster
