# AppProfile — XWiki (wiki and knowledge management)
#
# Source chart: oci://registry.opencode.de/bmi/opendesk/components/supplier/xwiki/charts-mirror
#   xwiki v1.4.4
# Value paths verified against: opendesk/helmfile/apps/xwiki/values.yaml.gotmpl
# Chart versions from: opendesk/helmfile/environments/default/charts.yaml.gotmpl
#
# Secret inventory:
#   Kernel-provided (4):
#     oidc_client_secret  → customConfigs.xwiki\.properties.oidc\.secret
#     db_password         → externalDB.password
#     smtp_password       → properties["property:xwiki:Mail.MailConfig^Mail.SendMailConfigClass.password"]
#     ldap_bind_password  → customConfigs.xwiki\.cfg.xwiki\.authentication\.ldap\.bind_pass
#   App-internal (0):
#     none — no orchestrator-generated internal secrets needed
#
# Design notes:
#   XWiki uses OIDC for user authentication (oidc.secret client secret) and LDAP
#   for user/group synchronisation (bind_pass for ldapsearch_xwiki account). Both
#   are per-tenant credentials provisioned by the orchestrator.
#
#   The chart supports both MariaDB and PostgreSQL (controlled by
#   databases.xwiki.type). The AppProfile defaults to PostgreSQL (the openDesk
#   default). Use extraValues in the Tenant CR to override to MariaDB if needed.
#
#   The OIDC client identifier in Keycloak is "opendesk-xwiki"
#   (customConfigs.xwiki.properties.oidc.clientid).
#
#   Value paths use dot-escaped notation for xwiki config keys that contain
#   literal dots (e.g., "xwiki.authentication.ldap.bind_pass") nested inside
#   the customConfigs map — the leading "xwiki.cfg" or "xwiki.properties" part
#   is the YAML map key, and the subsequent dotted segment is the xwiki.cfg key.
#
#   The chart uses direct Helm value injection (.Values.secrets.*) → Pattern B.
apiVersion: gentianos.io/v1alpha1
kind: AppProfile
metadata:
  name: xwiki
spec:
  displayName: "XWiki"
  description: "Structured wiki and knowledge management platform with OIDC login and LDAP group sync."

  kernelRequirements:
    identity:
      oidc: true
      ldap:
        sync: true
        interval: "5m"
    database:
      engine: postgresql
      databasePerTenant: true
    mail:
      smtp:
        auth: plain
        port: 587

  provides:
    - name: wiki
      protocol: http-json

  optionalIntegrations:
    - contract: central-navigation
      provider: nubus
      capabilities:
        - navigation:register
    - contract: office-editor
      provider: collabora
      capabilities:
        - wopi:edit

  chart:
    repository: "oci://registry.opencode.de/bmi/opendesk/components/supplier/xwiki/charts-mirror"
    name: xwiki
    version: "1.4.4"

  valueMapping:
    oidc:
      # Dot-escaped: key "xwiki.properties" is the YAML map key; "oidc.secret" is
      # the dotted xwiki.properties config key inside that block.
      clientSecretKey: 'customConfigs.xwiki\.properties.oidc\.secret'
    database:
      # Supports both PostgreSQL and MariaDB; defaults to PostgreSQL.
      passwordKey: "externalDB.password"
    smtp:
      # XWiki properties map key — full dotted path inside the properties block.
      passwordKey: 'properties["property:xwiki:Mail.MailConfig^Mail.SendMailConfigClass.password"]'
    ldap:
      # Bind password for the per-tenant ldapsearch_xwiki bind account.
      bindPasswordKey: 'customConfigs.xwiki\.cfg.xwiki\.authentication\.ldap\.bind_pass'

  # No appSecrets — all credentials are kernel-provided (oidc, db, smtp, ldap).

  # Pattern B — xwiki chart injects all secrets as direct Helm values.
  deploymentMethod: tofu-controller
