# AppProfile — OpenProject (project management)
#
# Source chart: oci://registry.opencode.de/bmi/opendesk/components/supplier/openproject/charts-mirror
#   openproject v10.1.0
#   (plus opendesk-openproject-bootstrap v2.3.0 — init-time only, same OCI repo under platform-development)
# Value paths verified against: opendesk/helmfile/apps/openproject/values.yaml.gotmpl
# Chart versions from: opendesk/helmfile/environments/default/charts.yaml.gotmpl
#
# Secret inventory:
#   Kernel-provided (5):
#     oidc_client_secret  → openproject.oidc.secret
#     pg_password         → postgresql.auth.password
#     minio_secret_key    → s3.auth.secretAccessKey
#     smtp_password       → environment.OPENPROJECT_SMTP__PASSWORD
#     ldap_bind_password  → environment.OPENPROJECT_SEED_LDAP_OPENDESK_BINDPASSWORD
#   App-internal (2) → appSecrets:
#     admin_password      → openproject.admin_user.password
#     api_admin_password  → environment.OPENPROJECT_AUTHENTICATION_GLOBAL__BASIC__AUTH_PASSWORD
#
# Design notes:
#   OpenProject uses LDAP for user sync (syncs group/user attributes from UCS LDAP
#   via the OPENDESK_SEED_LDAP_* environment variables). The LDAP bind password
#   is the per-tenant ldapsearch_openproject bind account password created by
#   the orchestrator's LDAP reconciler (Inc 4).
#
#   The OIDC client identifier in Keycloak is "opendesk-openproject"
#   (openproject.oidc.identifier in the values).
#
#   The chart uses direct Helm value injection (.Values.secrets.*) → Pattern B.
apiVersion: gentianos.io/v1alpha1
kind: AppProfile
metadata:
  name: openproject
spec:
  displayName: "OpenProject"
  description: "Open-source project management with Gantt charts, Kanban boards, and LDAP-synced users."

  kernelRequirements:
    identity:
      oidc: true
      ldap:
        sync: true
        interval: "1h"
    database:
      engine: postgresql
      databasePerTenant: true
    storage:
      s3:
        bucketPerTenant: true
    mail:
      smtp:
        auth: cram-md5
        port: 587

  provides:
    - name: project-management
      protocol: http-json

  optionalIntegrations:
    - contract: central-navigation
      provider: nubus
      capabilities:
        - navigation:register
    - contract: file-store
      provider: nextcloud
      capabilities:
        - webdav:read
        - webdav:write

  chart:
    repository: "oci://registry.opencode.de/bmi/opendesk/components/supplier/openproject/charts-mirror"
    name: openproject
    version: "10.1.0"

  valueMapping:
    oidc:
      clientSecretKey: "openproject.oidc.secret"
    database:
      # All five database fields are injected via set_sensitive from OpenBao.
      # The chart receives postgresql.bundled=false via extraValues, so these
      # values configure the external PostgreSQL connection.
      hostKey: "postgresql.connection.host"
      portKey: "postgresql.connection.port"
      nameKey: "postgresql.auth.database"
      userKey: "postgresql.auth.username"
      passwordKey: "postgresql.auth.password"
    s3:
      secretKeyKey: "s3.auth.secretAccessKey"
    smtp:
      passwordKey: "environment.OPENPROJECT_SMTP__PASSWORD"
    ldap:
      # LDAP bind password for the per-tenant ldapsearch_openproject account.
      bindPasswordKey: "environment.OPENPROJECT_SEED_LDAP_OPENDESK_BINDPASSWORD"

  appSecrets:
    # Initial admin user password — seeded once on first install.
    - name: admin_password
      valuePath: "openproject.admin_user.password"
    # HTTP Basic Auth password for the OpenProject API admin user.
    - name: api_admin_password
      valuePath: "environment.OPENPROJECT_AUTHENTICATION_GLOBAL__BASIC__AUTH_PASSWORD"

  # extraValues: non-sensitive chart configuration aligned with opendesk.
  #
  # Key decisions matching opendesk/helmfile/apps/openproject/values.yaml.gotmpl:
  #   - postgresql.bundled: false — use external PostgreSQL (postgres-rw.platform-kernel)
  #     Connection details (host/port/name/user/password) injected via valueMapping above.
  #   - memcached.bundled: false — use standalone memcached deployed in tenant namespace.
  #     The memcached chart (registry.opencode.de bitnami-charts mirror v6.7.1) must be
  #     deployed separately with the opendesk image mirror before this chart starts.
  #   - image: mirrored from registry.opencode.de (opendesk images.yaml.gotmpl).
  #   - dbInit.image: postgres 16.9 from registry-1.docker.io (opendesk images.yaml.gotmpl).
  #   - LDAP seeder: all OPENPROJECT_SEED_LDAP_OPENDESK_* env vars aligned with
  #     opendesk/helmfile/apps/openproject/values.yaml.gotmpl. HOST/BINDUSER/BASEDN
  #     are dev-cluster specific (nubus-dev LDAP, dc=swp-ldap,dc=internal base DN).
  #     BINDPASSWORD is injected as set_sensitive via valueMapping.ldap (not here).
  extraValues:
    postgresql:
      bundled: false
      # auth.username, auth.database, connection.host, connection.port
      # are injected via valueMapping (set_sensitive). Only bundled: false
      # needs to be here since connection values come from OpenBao.
    memcached:
      bundled: false
      connection:
        host: "memcached"
        port: 11211
    image:
      registry: "registry.opencode.de"
      repository: "bmi/opendesk/components/supplier/openproject/images-mirror/open_desk"
      tag: "16.6.5@sha256:877ea14085ec04311d8d138d37eea43ba80f81228fdf7ed042715b8cf316178f"
    dbInit:
      image:
        registry: "registry-1.docker.io"
        repository: "library/postgres"
        tag: "16.9-alpine3.20@sha256:e5507c984377515b8c9922b0eb19f55aba2063fdc7bccf268cefd53133f97054"
    environment:
      # LDAP seeder — static values (aligned with opendesk)
      OPENPROJECT_SEED_LDAP_OPENDESK_PORT: "389"
      OPENPROJECT_SEED_LDAP_OPENDESK_SECURITY: "plain_ldap"
      OPENPROJECT_SEED_LDAP_OPENDESK_SYNC__USERS: "true"
      OPENPROJECT_SEED_LDAP_OPENDESK_FILTER: "(&(objectClass=opendeskProjectmanagementUser)(opendeskProjectmanagementEnabled=TRUE))"
      OPENPROJECT_SEED_LDAP_OPENDESK_LOGIN__MAPPING: "uid"
      OPENPROJECT_SEED_LDAP_OPENDESK_FIRSTNAME__MAPPING: "givenName"
      OPENPROJECT_SEED_LDAP_OPENDESK_LASTNAME__MAPPING: "sn"
      OPENPROJECT_SEED_LDAP_OPENDESK_MAIL__MAPPING: "mailPrimaryAddress"
      OPENPROJECT_SEED_LDAP_OPENDESK_ADMIN__MAPPING: "opendeskProjectmanagementAdmin"
      OPENPROJECT_SEED_LDAP_OPENDESK_GROUPFILTER_OPENDESK_FILTER: "(&(objectClass=opendeskProjectmanagementGroup)(opendeskProjectmanagementEnabled=TRUE))"
      OPENPROJECT_SEED_LDAP_OPENDESK_GROUPFILTER_OPENDESK_SYNC__USERS: "true"
      OPENPROJECT_SEED_LDAP_OPENDESK_GROUPFILTER_OPENDESK_GROUP__ATTRIBUTE: "cn"
      # LDAP seeder — dev-cluster specific
      OPENPROJECT_SEED_LDAP_OPENDESK_HOST: "nubus-dev-ldap-server.gentian-dev.svc.cluster.local"
      OPENPROJECT_SEED_LDAP_OPENDESK_BINDUSER: "uid=ldapsearch_openproject,cn=users,dc=swp-ldap,dc=internal"
      OPENPROJECT_SEED_LDAP_OPENDESK_BASEDN: "dc=swp-ldap,dc=internal"
      OPENPROJECT_SEED_LDAP_OPENDESK_GROUPFILTER_OPENDESK_BASE: "dc=swp-ldap,dc=internal"
    # ── SMTP (aligned with opendesk) ───────────────────────────────────────────
    # OPENPROJECT_SMTP__PASSWORD is injected via set_sensitive (valueMapping.smtp).
      OPENPROJECT_SMTP__PORT: 587
      OPENPROJECT_SMTP__SSL: "false"
      OPENPROJECT_SMTP__ADDRESS: "postfix.tenant-gtn-demo.svc.cluster.local"
      OPENPROJECT_SMTP__AUTHENTICATION: "cram_md5"
      OPENPROJECT_SMTP__ENABLE__STARTTLS__AUTO: "true"
      OPENPROJECT_SMTP__OPENSSL__VERIFY__MODE: "none"
      OPENPROJECT_SMTP__DOMAIN: "desk.gentian.org"
      OPENPROJECT_SMTP__USER__NAME: "opendesk-system@desk.gentian.org"
      OPENPROJECT_MAIL__FROM: "noreply@desk.gentian.org"
    # ── Navigation + home URL ─────────────────────────────────────────────────
      OPENPROJECT_HOME__URL: "https://portal.desk.gentian.org/"
      OPENPROJECT_SOUVAP__NAVIGATION__URL: "https://portal.desk.gentian.org/univention/portal/navigation.json?base=https%3A//portal.desk.gentian.org"
    # ── OIDC env overrides (issuer + post-logout redirect + JWKS) ─────────────
      OPENPROJECT_OPENID__CONNECT_KEYCLOAK_ISSUER: "https://id.desk.gentian.org/realms/opendesk"
      OPENPROJECT_OPENID__CONNECT_KEYCLOAK_POST__LOGOUT__REDIRECT__URI: "https://openproject.desk.gentian.org/"
      # JWKS URI — internal, same rationale as tokenEndpoint above.
      OPENPROJECT_OPENID__CONNECT_KEYCLOAK_JWKS__URI: >-
        http://nubus-dev-keycloak.gentian-dev.svc.cluster.local:8080/realms/opendesk/protocol/openid-connect/certs
    # ── Login / OmniAuth (aligned with opendesk) ──────────────────────────────
      OPENPROJECT_LOGIN__REQUIRED: "true"
      OPENPROJECT_OMNIAUTH__DIRECT__LOGIN__PROVIDER: "keycloak"
      OPENPROJECT_OAUTH__ALLOW__REMAPPING__OF__EXISTING__USERS: "true"
      OPENPROJECT_EMAIL__DELIVERY__METHOD: "smtp"
    # ── Resource requests/limits ──────────────────────────────────────────────
    # The wait-for-db init container runs a full Rails process to check DB
    # connectivity and requires more memory than the namespace LimitRange
    # default of 512Mi (causes OOMKill / exit code 137).
    appInit:
      resources:
        limits:
          cpu: "2"
          memory: "2Gi"
        requests:
          cpu: "100m"
          memory: "768Mi"
    # ── Probes (aligned with opendesk) ────────────────────────────────────────
    probes:
      liveness:
        initialDelaySeconds: 300
        failureThreshold: 30
      readiness:
        initialDelaySeconds: 150
        failureThreshold: 30
    # ── OpenProject app settings ──────────────────────────────────────────────
    openproject:
      seed_locale: "de"
      host: "openproject.desk.gentian.org"
      admin_user:
        name: "OpenProject Internal Admin"
        mail: "openproject-admin@swp-domain.internal"
        password_reset: "false"
        locked: false
      oidc:
        enabled: true
        # Browser-facing endpoints: use external host (relative → resolved against host)
        authorizationEndpoint: "/realms/opendesk/protocol/openid-connect/auth"
        endSessionEndpoint: "https://id.desk.gentian.org/realms/opendesk/protocol/openid-connect/logout"
        host: "id.desk.gentian.org"
        identifier: "opendesk-openproject"
        provider: "keycloak"
        scope: "[openid,opendesk-openproject-scope]"
        # Backend endpoints: use absolute internal Keycloak service URL.
        # Avoids hairpin NAT issues — pods cannot reach external domains that
        # route back through Cloudflare/LB.  Keycloak's split-hostname mode
        # (KC_HOSTNAME_BACKCHANNEL_DYNAMIC) is designed for exactly this:
        # the discovery document already returns internal URLs for backend
        # endpoints.  Absolute URLs bypass the host+scheme construction
        # (see OpenProject ConfigurationMapper#extract_url).
        tokenEndpoint: "http://nubus-dev-keycloak.gentian-dev.svc.cluster.local:8080/realms/opendesk/protocol/openid-connect/token"
        userinfoEndpoint: "http://nubus-dev-keycloak.gentian-dev.svc.cluster.local:8080/realms/opendesk/protocol/openid-connect/userinfo"
        attribute_map:
          login: "opendesk_username"
          admin: "openproject_admin"
      useTmpVolumes: true
      resources:
        limits:
          cpu: "4"
          memory: "4Gi"
        requests:
          cpu: "500m"
          memory: "2Gi"
    # ── Ingress ───────────────────────────────────────────────────────────────
    ingress:
      enabled: true
      ingressClassName: "public"
      host: "openproject.desk.gentian.org"
      tls:
        enabled: true
        secretName: ""
    # ── Persistence disabled (files go to S3, aligned with opendesk) ──────────
    persistence:
      enabled: false

  # Pattern B — openproject chart injects all secrets as direct Helm values.
  deploymentMethod: tofu-controller
