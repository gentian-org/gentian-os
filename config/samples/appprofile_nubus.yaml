# Spike AppProfile — Nubus
#
# Validates the CRD schema against the real server/tofu/tenant/infra-workspaces/nubus.tf.
#
# Source chart: oci://registry.opencode.de/bmi/opendesk/components/supplier/univention/charts-mirror
#   nubus v1.16.0
#
# Nubus is the kernel identity provider (Keycloak + UCS LDAP + UDM + Portal).
# It is NOT a tenant-installed app — it is a kernel service that runs once per cluster.
# This AppProfile captures its schema for orchestrator integration testing only.
#
# Secret inventory (30+ set_sensitive blocks in nubus.tf):
#   NATS cluster passwords, LDAP admin/machine/readonly credentials,
#   Keycloak admin password, provisioning API password, portal shared secret,
#   SMTP credentials, and sub-chart internal secrets.
#   ALL are app-internal (no kernel "provides" them — Nubus IS the kernel identity layer).
#
# Spike findings:
#   1. Nubus has no kernelRequirements entries (it IS the identity kernel, not a consumer).
#   2. No valueMapping needed — Nubus has no kernel providers.
#   3. All 30+ secrets map to appSecrets (internal cluster secrets).
#   4. CONCLUSION: Schema handles Nubus cleanly as a kernel-layer AppProfile with only appSecrets.
#      The "no kernelRequirements" case is valid and the schema handles it (all fields optional).
apiVersion: gentianos.io/v1alpha1
kind: AppProfile
metadata:
  name: nubus
spec:
  displayName: "Nubus (Univention Corporate Server)"
  description: "Kernel identity stack: Keycloak + UCS LDAP + UDM REST API + Univention Portal."

  # Nubus is the identity kernel — it provides identity services, it doesn't consume them.
  # No kernelRequirements needed.

  provides:
    - name: oidc-provider
      protocol: oidc
    - name: ldap-directory
      protocol: ldap
    - name: central-navigation
      protocol: http-json

  chart:
    repository: "oci://registry.opencode.de/bmi/opendesk/components/supplier/univention/charts-mirror"
    name: nubus
    version: "1.16.0"

  # No valueMapping — Nubus has no kernel providers to map values from.

  # App-internal secrets — representative subset of the 30+ set_sensitive blocks.
  # Full list is in server/tofu/tenant/infra-workspaces/nubus.tf.
  appSecrets:
    # Keycloak admin bootstrap credentials
    - name: keycloak_admin_password
      valuePath: "keycloak.global.keycloak.auth.adminPassword"
    # LDAP admin password (UCS)
    - name: ldap_admin_password
      valuePath: "global.ldap.adminPassword"
    # LDAP machine account password
    - name: ldap_machine_password
      valuePath: "global.ldap.machineCredentials.password"
    # LDAP readonly account password (for app bind accounts)
    - name: ldap_readonly_password
      valuePath: "global.ldap.credentialssecret.password"
    # UDM REST API admin password
    - name: udm_admin_password
      valuePath: "udmRestApi.global.credentialssecret.adminPassword"
    # Portal shared secret (consumed by Nextcloud centralNavigation integration)
    - name: portal_shared_secret
      valuePath: "univentionPortalServer.global.credentialssecret.machinePassword"
    # NATS cluster password
    - name: nats_password
      valuePath: "nats.auth.password"
    # Provisioning API password (used by ox-connector, nextcloud-connector)
    - name: provisioning_api_password
      valuePath: "provisioning.global.credentialssecret.machinePassword"

  deploymentMethod: tofu-controller
