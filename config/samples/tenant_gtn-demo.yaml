# Example Tenant CR — matches architecture §12.2
apiVersion: gentianos.io/v1alpha1
kind: Tenant
metadata:
  name: gtn-demo
spec:
  displayName: "GTN Demo"
  domain: gtn-demo.gentianos.example.com
  adminEmail: admin@gtn-demo.example.com

  isolation:
    mode: namespace
    ldapOU: "ou=gtn-demo"
    keycloakRealm: gtn-demo
    databasePrefix: gtn_
    s3Prefix: gtn-demo-

  mail:
    mode: selfhosted
    domain: gtn-demo.example.com
    quotaPerUser: 5Gi
    rateLimit: 100/h

  quotas:
    maxApps: 20
    storage: 100Gi
    cpu: "16"
    memory: 32Gi

  deletionPolicy: Retain

  apps:
    - profile: ox-appsuite
    - profile: openproject
      config:
        replicas: 2
