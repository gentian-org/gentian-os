# Spike AppProfile — OX App Suite
#
# Validates the CRD schema against the real server/tofu/tenant/infra-workspaces/ox.tf
# and server/apps/ox-appsuite/values/dev/values-sensitive.yaml.tftpl.
#
# Source chart: oci://registry.opencode.de/bmi/opendesk/components/supplier/open-xchange/charts-mirror
#   appsuite-public-sector v2.26.32  (plus bootstrap v4.0.2 and ox-connector v0.34.0 — separate releases)
#
# Secret inventory (12 total from values-sensitive.yaml.tftpl):
#   Kernel-provided (5):
#     oidc_client_secret  → appsuite.core-mw.secretProperties["com.openexchange.oidc.clientSecret"]
#     mariadb_root_password → global.mysql.auth.password (+ rootPassword, readPassword)
#     minio_ox_password   → appsuite.core-mw.propertiesFiles[...s3...].secretKey
#     ldap_ox_password    → appsuite.core-mw.propertiesFiles[...ldapauth...].bindDNPassword
#     redis_auth_password → appsuite.core-mw.redis.auth.password
#   App-internal (7) → appSecrets:
#     admin_password, hz_group_password, basic_auth_password, jolokia_password,
#     cookie_hash_salt, share_crypt_key, sessiond_encryption_key
#
# Spike findings:
#   1. All 5 kernel-provided secrets fit valueMapping (oidc, database, s3, cache, ldap).
#   2. OIDC client secret uses bracket-notation path — clientSecretKey supports it.
#   3. S3 key uses a deeply nested propertiesFiles path — secretKeyKey supports it (bracket notation).
#   4. LDAP bind password also uses propertiesFiles path — bindPasswordKey supports it.
#   5. All 7 app-internal secrets fit appSecrets cleanly.
#   CONCLUSION: Schema handles OX App Suite completely.
apiVersion: gentianos.io/v1alpha1
kind: AppProfile
metadata:
  name: ox-appsuite
spec:
  displayName: "OX App Suite"
  description: "Open-Xchange groupware — webmail, calendar, contacts, and collaboration."

  kernelRequirements:
    identity:
      oidc: true
      ldap:
        sync: false
    database:
      engine: mariadb
      databasePerTenant: true
    storage:
      s3:
        bucketPerTenant: true
    cache:
      engine: redis
    mail:
      smtp:
        auth: plain
        port: 587
      imap:
        port: 993

  provides:
    - name: webmailer
      protocol: http-json
    - name: calendar
      protocol: http-json
    - name: contacts
      protocol: http-json

  optionalIntegrations:
    - contract: file-store
      provider: nextcloud
      capabilities:
        - webdav:read
        - webdav:write
        - ocs:shares
    - contract: central-navigation
      provider: nubus
      capabilities:
        - navigation:register
    - contract: chat
      provider: element
      capabilities:
        - matrix:actor

  chart:
    repository: "oci://registry.opencode.de/bmi/opendesk/components/supplier/open-xchange/charts-mirror"
    name: appsuite-public-sector
    version: "2.26.32"

  # valueMapping is intentionally omitted for ox-appsuite.
  # The ox-workspace Terraform module reads ALL credentials directly from OpenBao
  # and renders them via templatefile() — it does not use the generic vm_* variable
  # injection that app-workspace provides. The bracket-notation key paths that OX
  # requires (propertiesFiles["/path"].key) are incompatible with Terraform's
  # Helm provider set_sensitive blocks.

  # App-internal secrets — the ox-workspace module reads these from OpenBao at
  # gentian-os/tenants/{tenant}/apps/ox-appsuite/internal/{name}.
  # The orchestrator (or manual seeding) must create these paths before deployment.
  # valuePath here is informational only (used by ox-workspace templatefile):
  appSecrets:
    - name: admin_password
      valuePath: "appsuite.core-mw.masterPassword"
    - name: hz_group_password
      valuePath: "appsuite.core-mw.hzGroupPassword"
    - name: basic_auth_password
      valuePath: "appsuite.core-mw.basicAuthPassword"
    - name: jolokia_password
      valuePath: "appsuite.core-mw.jolokiaPassword"
    - name: cookie_hash_salt
      valuePath: "global.appsuite.cookieHashSalt"
    - name: share_crypt_key
      valuePath: "global.appsuite.shareCryptKey"
    - name: sessiond_encryption_key
      valuePath: "global.appsuite.sessiondEncryptionKey"

  # deploymentMethod: tofu-controller — OX does not support existingSecret (Pattern B).
  #
  # tofuModulePath: use the dedicated ox-workspace module instead of the generic
  # app-workspace. OX requires templatefile() to render credentials into deeply
  # nested propertiesFiles["/path"].key structures — these cannot be passed as
  # individual Helm --set values (Terraform's Helm provider rejects bracket paths).
  # ox-workspace reads all secrets directly from OpenBao and renders the sensitive
  # YAML via services/ox-appsuite/values/sensitive.yaml.tftpl.
  deploymentMethod: tofu-controller
  tofuModulePath: "kernel/tofu/tenant/ox-workspace"

  # extraValues: non-sensitive per-tenant overrides (merged last over _base.yaml
  # and the rendered sensitive template). Use this to override hostnames, ingress
  # TLS secrets, or other values that differ between tenants.
  # Note: the majority of non-sensitive config lives in
  #   kernel/services/ox-appsuite/values/_base.yaml (loaded by ox-workspace directly).

