# Spike AppProfile — Nextcloud
#
# Validates the CRD schema against server/tofu/tenant/infra-workspaces/nextcloud.tf.
#
# Source chart: oci://registry.opencode.de/bmi/opendesk/components/platform-development/charts/opendesk-nextcloud
#   opendesk-nextcloud v4.7.2  (plus opendesk-nextcloud-management v4.7.2, opendesk-nextcloud-notifypush v4.7.2)
#
# Secret inventory (16 set_sensitive blocks across 3 charts):
#   Kernel-provided (6):
#     nextcloud_user_password (PostgreSQL)  → configuration.database.auth.password.value
#     auth_password (Redis)                 → configuration.cache.auth.password.value
#     ldapsearch_nextcloud (LDAP)           → configuration.ldap.password.value
#     nextcloud_password (MinIO/S3)         → configuration.objectstore.auth.secretKey.value
#     oidc_client_secret                    → configuration.oidc.password.value
#     smtp_password                         → configuration.smtp.auth.password.value
#   App-internal (4) → appSecrets:
#     admin_password, oidc_client_secret (already in kernel → drop from appSecrets),
#     metrics_token, status_password, portal_shared_secret
#
# Spike findings:
#   1. All 6 kernel secrets fit valueMapping cleanly (database, cache, ldap, s3, oidc, smtp).
#   2. Nextcloud uses flat value paths (no bracket notation needed) — simpler than OX.
#   3. portal_shared_secret is a contract credential (from Nubus kernel), not app-internal.
#      It should flow via an IntegrationBinding once that reconciler exists (Increment 11),
#      but for v1 it is listed in appSecrets as a pragmatic fallback.
#   4. CONCLUSION: Schema handles Nextcloud completely.
apiVersion: gentianos.io/v1alpha1
kind: AppProfile
metadata:
  name: nextcloud
spec:
  displayName: "Nextcloud"
  description: "File storage, WebDAV, sharing, and collaboration platform."

  kernelRequirements:
    identity:
      oidc: true
      ldap:
        sync: true
        interval: "1h"
    database:
      engine: postgresql
      databasePerTenant: true
    storage:
      s3:
        bucketPerTenant: true
    cache:
      engine: redis
    mail:
      smtp:
        auth: plain
        port: 587

  provides:
    - name: file-store
      protocol: webdav
    - name: filepicker
      protocol: http-json

  optionalIntegrations:
    - contract: central-navigation
      provider: nubus
      capabilities:
        - navigation:register

  chart:
    repository: "oci://registry.opencode.de/bmi/opendesk/components/platform-development/charts/opendesk-nextcloud"
    name: opendesk-nextcloud
    version: "4.7.2"

  # Schema-based mapping of kernel-provided values to Helm value keys.
  # All paths verified against server/tofu/tenant/infra-workspaces/nextcloud.tf set_sensitive blocks.
  valueMapping:
    oidc:
      clientSecretKey: "configuration.oidc.password.value"
    database:
      passwordKey: "configuration.database.auth.password.value"
    s3:
      secretKeyKey: "configuration.objectstore.auth.secretKey.value"
    cache:
      passwordKey: "configuration.cache.auth.password.value"
    smtp:
      passwordKey: "configuration.smtp.auth.password.value"
    ldap:
      bindPasswordKey: "configuration.ldap.password.value"

  # App-internal secrets — generated by orchestrator, not provided by kernel services.
  appSecrets:
    - name: admin_password
      valuePath: "configuration.administrator.password.value"
    - name: metrics_token
      valuePath: "configuration.serverinfo.token.value"
    - name: status_password
      valuePath: "aio.configuration.statusPhp.password.value"
    # portal_shared_secret comes from the Nubus kernel; in v1 it is treated as an
    # app-internal secret until IntegrationBinding (Increment 11) handles contract credentials.
    - name: portal_shared_secret
      valuePath: "configuration.opendeskIntegration.centralNavigation.password.value"

  deploymentMethod: tofu-controller
