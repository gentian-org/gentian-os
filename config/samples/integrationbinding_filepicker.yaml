# Example IntegrationBinding CR — matches architecture §12.3
# Auto-generated by the orchestrator when ox-appsuite is installed in a tenant.
# Nextcloud is a kernel service (always available cluster-wide) and acts as the
# WebDAV/filepicker provider without appearing in the tenant's apps list.
apiVersion: gentianos.io/v1alpha1
kind: IntegrationBinding
metadata:
  name: gtn-demo-filepicker
  namespace: tenant-gtn-demo
spec:
  contract: filepicker
  provider:
    app: nextcloud
    namespace: tenant-gtn-demo
  consumer:
    app: ox-appsuite
    namespace: tenant-gtn-demo
  capabilities:
    - webdav:read
    - webdav:write
    - ocs:shares
  auth:
    method: oidc-token-exchange
    vaultPath: gentianos/tenants/gtn-demo/contracts/filepicker
