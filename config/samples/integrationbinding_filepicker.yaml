# Example IntegrationBinding CR — matches architecture §12.3
# Auto-generated by the orchestrator when both nextcloud (provider) and
# ox-appsuite (consumer) are in the same tenant's app list.
apiVersion: gentianos.io/v1alpha1
kind: IntegrationBinding
metadata:
  name: acme-corp-filepicker
  namespace: tenant-acme-corp
spec:
  contract: filepicker
  provider:
    app: nextcloud
    namespace: tenant-acme-corp
  consumer:
    app: ox-appsuite
    namespace: tenant-acme-corp
  capabilities:
    - webdav:read
    - webdav:write
    - ocs:shares
  auth:
    method: oidc-token-exchange
    vaultPath: gentianos/tenants/acme-corp/contracts/filepicker
