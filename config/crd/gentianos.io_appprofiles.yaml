---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: appprofiles.gentianos.io
spec:
  group: gentianos.io
  names:
    kind: AppProfile
    listKind: AppProfileList
    plural: appprofiles
    shortNames:
    - ap
    - aps
    singular: appprofile
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Display Name
      type: string
    - jsonPath: .spec.chart.name
      name: Chart
      type: string
    - jsonPath: .spec.chart.version
      name: Version
      type: string
    - jsonPath: .spec.deploymentMethod
      name: Method
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AppProfile is the Schema for the appprofiles API.

          AppProfile is cluster-scoped — one per app type, shared across all tenants.
          An AppProfile wraps an upstream Helm chart with the schema-based value
          mapping and kernel requirements that the orchestrator needs to provision
          and wire the app for any tenant.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AppProfileSpec defines the desired state of AppProfile.
            properties:
              additionalIngresses:
                description: |-
                  AdditionalIngresses declares extra Ingress resources to create alongside
                  the primary Ingress. Use this when an app requires a second hostname
                  routed to the same (or a different) Service — for example, CryptPad
                  requires a separate sandbox subdomain for its client-side iframe
                  isolation model (httpSafeOrigin must differ from httpUnsafeOrigin).
                  Each entry is treated identically to Ingress: the orchestrator creates
                  one Kubernetes Ingress per entry with its own host, TLS secret reference,
                  and lifecycle management (stale entries are deleted on app removal).
                items:
                  description: IngressSpec declares how the orchestrator should expose
                    this app via HTTP(S).
                  properties:
                    annotations:
                      additionalProperties:
                        type: string
                      description: |-
                        Annotations are merged into the Ingress object metadata.
                        Use to set ingress class, NGINX configuration snippets, etc.
                      type: object
                    clusterIssuer:
                      default: letsencrypt-http01
                      description: |-
                        ClusterIssuer is the cert-manager ClusterIssuer to use for TLS.
                        Defaults to "letsencrypt-http01" (HTTP-01 per-host) when not set.
                        See docs/architecture.md §2.5 for the kernel-vs-vanity domain
                        model and the wildcard fallback.
                      type: string
                    ingressClassName:
                      default: nginx
                      description: |-
                        IngressClassName is the Kubernetes IngressClass to use.
                        Defaults to "nginx" when not set.
                      type: string
                    serviceName:
                      description: |-
                        ServiceName is the Kubernetes Service name that the Helm chart creates.
                        Defaults to the AppProfile name (chart name) when not set.
                      type: string
                    servicePort:
                      default: 80
                      description: ServicePort is the port on the Service to route
                        traffic to.
                      format: int32
                      type: integer
                    subDomain:
                      description: |-
                        SubDomain is the subdomain prefix prepended to the tenant domain to form the
                        Ingress host, e.g. "files" yields "files.{tenant-domain}".
                        Defaults to the app profile name (chart name) when not set.
                      type: string
                    tlsEnabled:
                      default: true
                      description: |-
                        TLSEnabled enables TLS via a cert-manager Certificate CR.
                        Defaults to true.
                      type: boolean
                  type: object
                type: array
              appSecrets:
                description: |-
                  AppSecrets declares app-internal secrets (admin passwords, session keys,
                  cluster tokens) that don't correspond to any kernel function. The
                  orchestrator generates these deterministically (HMAC-SHA256 from master
                  password + tenant + app + secret name), stores them in OpenBao, and syncs
                  them via ExternalSecret.
                items:
                  description: |-
                    AppSecret declares an app-internal secret the orchestrator must generate
                    and inject. These are credentials the app needs (admin passwords, session
                    signing keys, cluster tokens) that are not provided by any kernel service.
                  properties:
                    name:
                      description: |-
                        Name is the logical identifier for this secret (e.g., "admin_password").
                        Used as the suffix in the OpenBao path:
                        gentian-os/tenants/{tenant}/apps/{app}/internal/{name}
                      maxLength: 64
                      minLength: 1
                      pattern: ^[a-z0-9_]+$
                      type: string
                    valuePath:
                      description: |-
                        ValuePath is the dot-notation (or bracket-notation) Helm value key that
                        should receive the generated secret value.
                      minLength: 1
                      type: string
                  required:
                  - name
                  - valuePath
                  type: object
                type: array
              chart:
                description: Chart references the upstream Helm chart for this app.
                properties:
                  name:
                    description: Name is the chart name within the repository.
                    minLength: 1
                    type: string
                  repository:
                    description: Repository is the OCI repository URL (e.g., oci://registry.example.com/charts).
                    minLength: 1
                    type: string
                  version:
                    description: Version is the chart version to deploy.
                    minLength: 1
                    type: string
                required:
                - name
                - repository
                - version
                type: object
              compositionRef:
                description: |-
                  CompositionRef overrides the Crossplane Composition used to deploy this
                  app. When empty the XRD default (app-default) applies. Set to the name
                  of a purpose-built composition (e.g. "app-element", "app-ox") for
                  profiles that require deploying multiple Helm Releases.
                type: string
              deploymentMethod:
                default: crossplane
                description: |-
                  DeploymentMethod controls how the orchestrator deploys this app.
                  Defaults to crossplane. Use argocd for kernel-layer services managed
                  directly by the cache or identity reconcilers.
                enum:
                - argocd
                - crossplane
                type: string
              description:
                description: Description is an optional human-readable description.
                type: string
              displayName:
                description: DisplayName is a human-readable name for the application.
                maxLength: 128
                minLength: 1
                type: string
              extraValues:
                description: |-
                  ExtraValues provides an escape hatch for non-standard values that don't
                  fit the typed valueMapping schema. Merged into the rendered Helm values.
                  Must not contain secrets — use appSecrets for secret values.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              ingress:
                description: |-
                  Ingress declares the HTTP routing configuration for this app.
                  When set, the orchestrator creates a Kubernetes Ingress resource and a
                  cert-manager Certificate CR for TLS.
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: |-
                      Annotations are merged into the Ingress object metadata.
                      Use to set ingress class, NGINX configuration snippets, etc.
                    type: object
                  clusterIssuer:
                    default: letsencrypt-http01
                    description: |-
                      ClusterIssuer is the cert-manager ClusterIssuer to use for TLS.
                      Defaults to "letsencrypt-http01" (HTTP-01 per-host) when not set.
                      See docs/architecture.md §2.5 for the kernel-vs-vanity domain
                      model and the wildcard fallback.
                    type: string
                  ingressClassName:
                    default: nginx
                    description: |-
                      IngressClassName is the Kubernetes IngressClass to use.
                      Defaults to "nginx" when not set.
                    type: string
                  serviceName:
                    description: |-
                      ServiceName is the Kubernetes Service name that the Helm chart creates.
                      Defaults to the AppProfile name (chart name) when not set.
                    type: string
                  servicePort:
                    default: 80
                    description: ServicePort is the port on the Service to route traffic
                      to.
                    format: int32
                    type: integer
                  subDomain:
                    description: |-
                      SubDomain is the subdomain prefix prepended to the tenant domain to form the
                      Ingress host, e.g. "files" yields "files.{tenant-domain}".
                      Defaults to the app profile name (chart name) when not set.
                    type: string
                  tlsEnabled:
                    default: true
                    description: |-
                      TLSEnabled enables TLS via a cert-manager Certificate CR.
                      Defaults to true.
                    type: boolean
                type: object
              kernelRequirements:
                description: KernelRequirements declares which kernel services this
                  app requires.
                properties:
                  cache:
                    description: Cache specifies a caching backend requirement.
                    properties:
                      engine:
                        default: redis
                        description: Engine selects the caching backend. Defaults
                          to redis.
                        enum:
                        - redis
                        - memcached
                        type: string
                    type: object
                  database:
                    description: Database specifies a relational database requirement.
                    properties:
                      databasePerTenant:
                        default: true
                        description: |-
                          DatabasePerTenant creates a separate database for each tenant (default true).
                          Set to false only for shared-schema apps.
                        type: boolean
                      engine:
                        default: postgresql
                        description: Engine selects the database engine. Defaults
                          to postgresql.
                        enum:
                        - postgresql
                        - mariadb
                        type: string
                    type: object
                  identity:
                    description: Identity specifies OIDC and/or LDAP requirements.
                    properties:
                      ldap:
                        description: LDAP requests a per-tenant LDAP bind account
                          in the UCS LDAP directory.
                        properties:
                          interval:
                            description: Interval is the sync interval (e.g., "1h").
                              Defaults to "1h" when sync is true.
                            pattern: ^[0-9]+(s|m|h|d)$
                            type: string
                          sync:
                            description: Sync enables periodic user/group sync from
                              LDAP into the app's own store.
                            type: boolean
                        type: object
                      oidc:
                        description: |-
                          OIDC describes the OIDC client to register in the tenant's Keycloak realm.
                          When set, the composition emits a Client CR so every newly deployed tenant
                          automatically gets the correct Keycloak client without manual setup.
                          Leave unset for apps whose Keycloak client is managed externally
                          (e.g. kernel-realm clients managed via keycloak-config).
                        properties:
                          accessType:
                            default: PUBLIC
                            description: |-
                              AccessType controls whether the client requires a shared secret
                              (CONFIDENTIAL, for server-side apps) or relies on PKCE without a secret
                              (PUBLIC, for SPAs and mobile apps). Defaults to PUBLIC.
                            enum:
                            - PUBLIC
                            - CONFIDENTIAL
                            type: string
                          backchannelLogoutUrl:
                            description: |-
                              BackchannelLogoutURL is the endpoint Keycloak calls for backchannel logout
                              notifications (RFC 7009). Supports ${TENANT_DOMAIN} substitution.
                            type: string
                          clientId:
                            description: ClientID is the OIDC client identifier registered
                              in Keycloak.
                            minLength: 1
                            type: string
                          directAccessGrantsEnabled:
                            description: |-
                              DirectAccessGrantsEnabled enables the Resource Owner Password Credentials
                              grant (legacy / CLI apps). Defaults to false.
                            type: boolean
                          name:
                            description: |-
                              Name is the human-readable display name shown in the Keycloak admin UI.
                              Defaults to ClientID when empty.
                            type: string
                          postLogoutRedirectUris:
                            description: |-
                              PostLogoutRedirectURIs lists the allowed post-logout redirect URIs.
                              Supports ${TENANT_DOMAIN} substitution.
                            items:
                              type: string
                            type: array
                          redirectUris:
                            description: |-
                              RedirectURIs lists the valid OAuth2 redirect URIs for the authorization
                              code flow. Supports ${TENANT_DOMAIN} substitution.
                            items:
                              type: string
                            type: array
                        required:
                        - clientId
                        type: object
                    type: object
                  mail:
                    description: Mail specifies SMTP and/or IMAP requirements.
                    properties:
                      imap:
                        description: IMAP requests inbound mail (IMAP) credentials.
                        properties:
                          port:
                            default: 993
                            description: Port is the IMAP port.
                            format: int32
                            type: integer
                        type: object
                      smtp:
                        description: SMTP requests outbound mail (SMTP submission)
                          credentials.
                        properties:
                          auth:
                            description: Auth is the SMTP authentication mechanism.
                            enum:
                            - plain
                            - login
                            - cram-md5
                            type: string
                          port:
                            default: 587
                            description: Port is the SMTP submission port.
                            format: int32
                            type: integer
                        type: object
                    type: object
                  mcp:
                    description: |-
                      MCP specifies a Model Context Protocol server requirement.
                      When enabled, the orchestrator registers the app's MCP endpoint in the
                      kernel MCP registry and wires OIDC authentication.
                    properties:
                      auth:
                        default: oidc
                        description: Auth is the authentication method for MCP calls.
                        enum:
                        - oidc
                        - none
                        type: string
                      enabled:
                        default: true
                        description: Enabled activates MCP endpoint registration.
                        type: boolean
                      endpoint:
                        default: /mcp
                        description: Endpoint is the HTTP path where the app exposes
                          its MCP server.
                        pattern: ^/.*
                        type: string
                    required:
                    - enabled
                    type: object
                  storage:
                    description: Storage specifies object storage (S3) and/or filesystem
                      (WebDAV) requirements.
                    properties:
                      files:
                        description: Files requests WebDAV access to the tenant's
                          Nextcloud instance.
                        properties:
                          capabilities:
                            description: Capabilities lists the required access capabilities.
                            items:
                              type: string
                            type: array
                          protocol:
                            default: webdav
                            description: Protocol is the access protocol. Currently
                              only webdav is supported.
                            enum:
                            - webdav
                            type: string
                        type: object
                      s3:
                        description: S3 requests a per-tenant S3 bucket via the MinIO
                          kernel service.
                        properties:
                          bucketPerTenant:
                            default: true
                            description: BucketPerTenant creates a dedicated bucket
                              for each tenant. Defaults to true.
                            type: boolean
                        type: object
                    type: object
                type: object
              logo:
                description: |-
                  Logo is the application icon used in the Gentian portal. It must be a
                  data URI (data:image/svg+xml;base64,...) containing a base64-encoded SVG.
                  The LDAP reconciler writes this value to the portal entry's pathToLogo
                  attribute so the portal frontend can render it directly as an <img src>.
                pattern: ^data:image/svg\+xml;base64,[A-Za-z0-9+/]+=*$
                type: string
              optionalIntegrations:
                description: OptionalIntegrations lists contracts this app can consume
                  when available.
                items:
                  description: IntegrationRef identifies an optional integration contract
                    this app can consume.
                  properties:
                    capabilities:
                      description: Capabilities lists the specific capabilities required
                        from the contract.
                      items:
                        type: string
                      type: array
                    contract:
                      description: Contract is the name of the contract to consume.
                      minLength: 1
                      type: string
                    provider:
                      description: Provider is the expected provider app by profile
                        name.
                      type: string
                  required:
                  - contract
                  type: object
                type: array
              portalTiles:
                description: |-
                  PortalTiles defines the tiles this app contributes to the Nubus/gentian-ui
                  portal when deployed for a tenant in dedicated mode. Each tile creates a
                  UDM portal entry under swp.{tile.name}_{tenantName}.
                  Requires ingress.subDomain to be set (used as the tile base URL).
                  When empty no per-tenant portal entries are created.
                items:
                  description: |-
                    PortalTileSpec defines a single tile this app contributes to the portal when
                    deployed for a tenant in dedicated mode.
                  properties:
                    allowedGroup:
                      default: Domain Users
                      description: |-
                        AllowedGroup is the LDAP CN of the group whose members can see this tile.
                        Defaults to "Domain Users" (all authenticated portal users).
                        Use managed-by-attribute-{Capability} groups (e.g., "managed-by-attribute-Groupware")
                        to restrict to users with a specific provisioned capability.
                      type: string
                    displayName:
                      additionalProperties:
                        type: string
                      description: |-
                        DisplayName is the localized label shown in the portal.
                        Locale keys follow the UDM convention (e.g., "de_DE", "en_US").
                        At least one entry is required.
                      type: object
                    linkSuffix:
                      description: |-
                        LinkSuffix is appended to the app's base URL
                        (https://{ingress.subDomain}.{tenantDomain}) to deep-link into a sub-app.
                        Example: "#app=io.ox/mail". Defaults to empty (root URL).
                      type: string
                    linkTarget:
                      allOf:
                      - enum:
                        - newwindow
                        - samewindow
                        - embedded
                      - enum:
                        - newwindow
                        - samewindow
                        - embedded
                      default: newwindow
                      description: |-
                        LinkTarget controls how the portal opens the tile.
                        newwindow opens in a new browser tab (default).
                        embedded opens inside the gentian-ui window manager (iframe).
                      type: string
                    logo:
                      description: |-
                        Logo is an optional per-tile icon override. Must be a data URI
                        (data:image/svg+xml;base64,...). Falls back to the AppProfile logo.
                      pattern: ^data:image/svg\+xml;base64,[A-Za-z0-9+/]+=*$
                      type: string
                    name:
                      description: |-
                        Name is the unique tile identifier, forming the portal entry CN:
                        swp.{name}_{tenantName}. Must be unique within an AppProfile. Use kebab-case.
                      minLength: 1
                      pattern: ^[a-z0-9-]+$
                      type: string
                  required:
                  - displayName
                  - name
                  type: object
                type: array
              provides:
                description: Provides lists the integration contracts this app can
                  act as a provider for.
                items:
                  description: ContractRef identifies an integration contract this
                    app provides.
                  properties:
                    name:
                      description: Name is the contract name (e.g., "file-store",
                        "project-management").
                      minLength: 1
                      pattern: ^[a-z0-9-]+$
                      type: string
                    protocol:
                      description: Protocol is the technical protocol used (e.g.,
                        "http-json", "webdav").
                      type: string
                  required:
                  - name
                  type: object
                type: array
              valueMapping:
                description: |-
                  ValueMapping is the schema-based mapping of kernel-provided values to
                  Helm value keys. Validated at admission time.
                properties:
                  cache:
                    description: Cache maps caching backend values to Helm keys.
                    properties:
                      hostKey:
                        description: HostKey is the Helm value key for the cache host.
                        type: string
                      passwordKey:
                        description: PasswordKey is the Helm value key for the cache
                          password/ACL token.
                        type: string
                      portKey:
                        description: PortKey is the Helm value key for the cache port.
                        type: string
                    type: object
                  database:
                    description: Database maps database connection values to Helm
                      keys.
                    properties:
                      hostKey:
                        description: HostKey is the Helm value key for the database
                          host.
                        type: string
                      nameKey:
                        description: NameKey is the Helm value key for the database
                          name.
                        type: string
                      passwordKey:
                        description: PasswordKey is the Helm value key for the database
                          password.
                        type: string
                      portKey:
                        description: PortKey is the Helm value key for the database
                          port.
                        type: string
                      readNameKey:
                        description: |-
                          ReadNameKey is the Helm value key for the read-replica database name.
                          Useful for charts that expose separate read and write connection endpoints
                          (e.g. OX App Suite's global.mysql.readDatabase).
                        type: string
                      readUserKey:
                        description: |-
                          ReadUserKey is the Helm value key for the read-replica database user.
                          Useful for charts that expose separate read and write connection endpoints
                          (e.g. OX App Suite's global.mysql.auth.readUser).
                        type: string
                      userKey:
                        description: UserKey is the Helm value key for the database
                          user.
                        type: string
                    type: object
                  imap:
                    description: IMAP maps mail access values to Helm keys.
                    properties:
                      hostKey:
                        description: HostKey is the Helm value key for the IMAP host.
                        type: string
                      portKey:
                        description: PortKey is the Helm value key for the IMAP port.
                        type: string
                    type: object
                  ldap:
                    description: LDAP maps LDAP directory values to Helm keys.
                    properties:
                      baseDnKey:
                        description: BaseDNKey is the Helm value key for the LDAP
                          base DN.
                        type: string
                      bindDnKey:
                        description: BindDNKey is the Helm value key for the LDAP
                          bind DN.
                        type: string
                      bindPasswordKey:
                        description: |-
                          BindPasswordKey is the Helm value key for the LDAP bind password.
                          Supports bracket notation for deeply nested propertiesFiles paths, e.g.:
                          `appsuite.core-mw.propertiesFiles["/opt/.../ldapauth.properties"].bindDNPassword`
                        type: string
                      hostKey:
                        description: HostKey is the Helm value key for the LDAP host.
                        type: string
                      portKey:
                        description: PortKey is the Helm value key for the LDAP port.
                        type: string
                    type: object
                  oidc:
                    description: OIDC maps OIDC provider values to Helm keys.
                    properties:
                      clientIdKey:
                        description: ClientIDKey is the Helm value key for the OIDC
                          client ID.
                        type: string
                      clientSecretKey:
                        description: ClientSecretKey is the Helm value key for the
                          OIDC client secret.
                        type: string
                      clientSecretOpenbaoPath:
                        description: |-
                          ClientSecretOpenbaoPath overrides the default per-tenant OpenBao secret
                          path (gentian-os/tenants/{tenant}/apps/{app}/oidc) for reading the OIDC
                          client secret. Use this for apps that share a kernel-realm OIDC client
                          whose secret is stored at a fixed, non-per-tenant location.
                          Example: "gentian-os/kernel/apps/ox"
                        type: string
                      clientSecretOpenbaoProperty:
                        description: |-
                          ClientSecretOpenbaoProperty overrides the property name within the
                          OpenBao secret (default: "client-secret"). Only used together with
                          ClientSecretOpenbaoPath.
                        type: string
                      issuerKey:
                        description: IssuerKey is the Helm value key for the OIDC
                          issuer URL.
                        type: string
                    type: object
                  s3:
                    description: S3 maps object storage values to Helm keys.
                    properties:
                      accessKeyKey:
                        description: AccessKeyKey is the Helm value key for the S3
                          access key ID.
                        type: string
                      bucketKey:
                        description: BucketKey is the Helm value key for the bucket
                          name.
                        type: string
                      endpointKey:
                        description: EndpointKey is the Helm value key for the S3
                          endpoint URL.
                        type: string
                      regionKey:
                        description: RegionKey is the Helm value key for the S3 region.
                        type: string
                      secretKeyKey:
                        description: SecretKeyKey is the Helm value key for the S3
                          secret access key.
                        type: string
                    type: object
                  smtp:
                    description: SMTP maps mail submission values to Helm keys.
                    properties:
                      hostKey:
                        description: HostKey is the Helm value key for the SMTP host.
                        type: string
                      passwordKey:
                        description: PasswordKey is the Helm value key for the SMTP
                          password.
                        type: string
                      portKey:
                        description: PortKey is the Helm value key for the SMTP port.
                        type: string
                      userKey:
                        description: UserKey is the Helm value key for the SMTP username.
                        type: string
                    type: object
                type: object
            required:
            - chart
            - displayName
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
