# Stub CRD: the provider-keycloak OIDC client, for envtest only.
#
# The real definition ships with provider-keycloak and is far larger. This
# carries only what the operator reads — the name, and status.conditions — for
# the same reason config/crd/gentianos.io_xtenants.yaml exists: the reconciler
# has to be able to read these objects under envtest, where no Crossplane and no
# provider are running.
#
# Not a source of truth for the schema. A field the operator starts reading has
# to be added here too, or the test will pass against a shape the cluster does
# not have.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clients.openidclient.keycloak.crossplane.io
spec:
  group: openidclient.keycloak.crossplane.io
  names:
    categories:
      - crossplane
      - managed
      - keycloak
    kind: Client
    listKind: ClientList
    plural: clients
    singular: client
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type: { type: string }
                      status: { type: string }
                      reason: { type: string }
                      message: { type: string }
                      lastTransitionTime: { type: string, format: date-time }
