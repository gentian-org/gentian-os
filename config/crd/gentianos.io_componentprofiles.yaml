                        AppSecret declares an app-internal secret the orchestrator must generate
                        and inject. These are credentials the app needs (admin passwords, session
                        signing keys, cluster tokens) that are not provided by any kernel service.
                      properties:
                        name:
                          description: |-
                            Name is the logical identifier for this secret (e.g., "admin_password").
                            Used as the suffix in the OpenBao path:
                            gentian-os/tenants/{tenant}/apps/{app}/internal/{name}
                          maxLength: 64
                          minLength: 1
                          pattern: ^[a-z0-9_]+$
                          type: string
                        valuePath:
                          description: |-
                            ValuePath is the dot-notation (or bracket-notation) Helm value key that
                            should receive the generated secret value.
                          minLength: 1
                          type: string
                      required:
                      - name
                      - valuePath
                      type: object
                    type: array
                type: object
              sessionMaxAge:
                description: |-
                  SessionMaxAge caps the app's own session, for apps that run their own
                  login. The edge bounds reachability; it does not refresh the groups an
                  app captured at its own login, so this — not the access-token lifetime —
                  bounds what a user may still do inside the app after their rights change.
                type: string
              tenancy:
                description: |-
                  Tenancy lists the modes this component may be deployed under. It is a
                  certification claim, not a choice. "system" is exclusive.
                items:
                  description: ComponentTenancy is a mode a component may be deployed
                    under.
                  enum:
                  - system
                  - shared
                  - tenant
                  type: string
                maxItems: 2
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              trustTier:
                description: |-
                  TrustTier is the review level of this entry. "platform" is required
                  before "shared" may appear in Tenancy. Required, with no default: the
                  tier is a statement a reviewer made, not an absence.
                enum:
                - platform
                - certified
                - experimental
                type: string
              version:
                description: Version is the catalogue entry's version, not the upstream
                  project's.
                maxLength: 64
                minLength: 1
                type: string
            required:
            - package
            - tenancy
            - trustTier
            - version
            type: object
            x-kubernetes-validations:
            - message: 'system is exclusive: a component serving contracts does not
                also serve humans'
              rule: '!(''system'' in self.tenancy) || self.tenancy.size() == 1'
            - message: system components have no exposure
              rule: '!(''system'' in self.tenancy) || !has(self.expose) || self.expose.size()
                == 0'
            - message: shared tenancy requires trustTier platform
              rule: '!(''shared'' in self.tenancy) || self.trustTier == ''platform'''
            - message: 'forwardToken requires trustTier platform: the edge token is
                valid at the director and at every sibling'
              rule: '!has(self.expose) || self.expose.all(e, !(has(e.forwardToken)
                && e.forwardToken) || self.trustTier == ''platform'')'
            - message: a package is a chart, a composition or an API integration;
                only an addon, which rides on its base, has none
              rule: has(self.__package__.chart) || (has(self.__package__.compositionRef)
                && self.__package__.compositionRef.size() > 0) || has(self.__package__.apiIntegration)
                || (has(self.customization) && has(self.customization.addon))
          status:
            description: ComponentProfileStatus is the observed state of a ComponentProfile.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
