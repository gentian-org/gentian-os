---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: appcatalogues.gentianos.io
spec:
  group: gentianos.io
  names:
    kind: AppCatalogue
    listKind: AppCatalogueList
    plural: appcatalogues
    shortNames:
    - appcat
    singular: appcatalogue
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.totalApps
      name: Apps
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AppCatalogue is a singleton cluster-scoped resource maintained by the
          App Store controller. It reflects all AppProfile CRs present in the cluster
          and cross-references them with Tenant installations.

          Only one instance should exist; it is always named "default".
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AppCatalogueSpec is intentionally empty — the catalogue is
              fully status-driven.
            type: object
          status:
            description: AppCatalogueStatus holds the observed catalogue state.
            properties:
              apps:
                description: Apps lists every available AppProfile with installation
                  metadata.
                items:
                  description: CatalogueEntry summarises one AppProfile for catalogue
                    consumers.
                  properties:
                    chartVersion:
                      description: ChartVersion is the chart version declared in the
                        AppProfile.
                      type: string
                    deploymentMethod:
                      description: DeploymentMethod is the deployment pattern (argocd
                        or tofu-controller).
                      enum:
                      - argocd
                      - crossplane
                      type: string
                    description:
                      description: Description is the optional human-readable description.
                      type: string
                    displayName:
                      description: DisplayName is the human-readable application name.
                      type: string
                    installedCount:
                      description: InstalledCount is the number of Tenant CRs that
                        currently list this app.
                      type: integer
                    kernelRequirements:
                      description: |-
                        KernelRequirements is a compact human-readable list of kernel services the
                        app requires (e.g., ["oidc", "postgresql", "s3", "smtp", "ldap"]).
                      items:
                        type: string
                      type: array
                    name:
                      description: Name is the AppProfile CR name.
                      type: string
                  required:
                  - chartVersion
                  - deploymentMethod
                  - displayName
                  - installedCount
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              lastUpdated:
                description: LastUpdated is the time the catalogue was last successfully
                  reconciled.
                format: date-time
                type: string
              totalApps:
                description: TotalApps is the count of available AppProfile CRs.
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
