---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: brandings.gentianos.io
spec:
  group: gentianos.io
  names:
    kind: Branding
    listKind: BrandingList
    plural: brandings
    singular: branding
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.identity.name
      name: Name
      type: string
    - jsonPath: .status.conditions[?(@.type=="Rendered")].status
      name: Rendered
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Branding is the brand every page on the cluster shows: the concierge,
          the identity provider's screens, the desktop and the consoles. One per
          cluster, named "default"; without it they show the platform's own.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BrandingSpec is the cluster's brand.
            properties:
              hideVendorPromotions:
                description: |-
                  HideVendorPromotions takes the platform vendor's own offers off the
                  consoles, for a provider who runs the cluster under its own name.
                type: boolean
              identity:
                description: Identity is the product's name and icons.
                properties:
                  description:
                    description: Description is the installed app's description.
                    maxLength: 256
                    type: string
                  icons:
                    description: |-
                      Icons are the logo and favicon, as a manifest's icons: the first whose
                      purpose includes "any" is the logo on the pages.
                    items:
                      description: BrandIcon is one Web App Manifest image resource.
                      properties:
                        purpose:
                          description: 'Purpose, as the manifest says it: any, maskable,
                            monochrome.'
                          maxLength: 64
                          pattern: ^((any|maskable|monochrome)( (any|maskable|monochrome))*)?$
                          type: string
                        sizes:
                          description: 'Sizes, as the manifest says them: "any", or
                            "192x192 512x512".'
                          maxLength: 64
                          pattern: ^(any|[0-9]+x[0-9]+( [0-9]+x[0-9]+)*)?$
                          type: string
                        src:
                          description: |-
                            Src is an https URL, or the image itself as a data URL. A data URL keeps
                            the brand in the cluster's own repository and asks no third party
                            whenever a page is shown.
                          maxLength: 262144
                          pattern: ^(https://[^\s"'<>]+|data:image/(png|svg\+xml|webp|x-icon|vnd\.microsoft\.icon);base64,[A-Za-z0-9+/=]+)$
                          type: string
                        type:
                          description: Type is the image's media type.
                          maxLength: 64
                          type: string
                      required:
                      - src
                      type: object
                    maxItems: 8
                    type: array
                  name:
                    description: |-
                      Name is the product's name, on sign-in cards, page titles and the
                      sender of the identity provider's mail.
                    maxLength: 64
                    type: string
                  shortName:
                    description: 'ShortName is where Name does not fit: an installed
                      app''s label.'
                    maxLength: 24
                    type: string
                type: object
              tokens:
                description: |-
                  Tokens is the brand's look: a design-token document in the W3C Design
                  Tokens Community Group format (2025.10). Pages read color.brand.*,
                  color.ink.*, color.paper.*, color.status.*, font.family.* and radius.*,
                  and keep their own value for a token that is absent.
                type: object
                x-kubernetes-preserve-unknown-fields: true
            type: object
          status:
            description: BrandingStatus says whether the brand is what the pages show.
            properties:
              conditions:
                description: |-
                  Conditions: Rendered is True once the pages' stylesheet is the brand's,
                  False with the reason when the tokens cannot be rendered.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the generation Rendered describes.
                format: int64
                type: integer
            type: object
        type: object
        x-kubernetes-validations:
        - message: the Branding is a singleton named 'default', the name the operator
            reads
          rule: self.metadata.name == 'default'
    served: true
    storage: true
    subresources:
      status: {}
