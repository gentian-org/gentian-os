# yamllint disable rule:commas rule:line-length
name: Gentian authorization model v1
model_file: model.fga

# One fixture for every test. Ids follow the model's rule: a thing of a tenant
# is <tenant>/<name>, a declared role <tenant>/<profile>/<name>.
tuples:

  # --- who holds which position
  - {user: user:tom,    relation: holder, object: position:demo/tenant-administrator}
  - {user: user:pat,    relation: holder, object: position:demo/tenant-administrator}
  - {user: user:mia,    relation: holder, object: position:demo/user}
  - {user: user:max,    relation: holder, object: position:demo/user}
  - {user: user:nina,   relation: holder, object: position:demo/app-administrator}
  - {user: user:eve,    relation: holder, object: position:demo/executive}
  - {user: user:sven,   relation: holder, object: position:demo/sales-manager}
  - {user: user:marc,   relation: holder, object: position:demo/engineer}
  - {user: user:tina,   relation: holder, object: position:solo/tenant-administrator}
  - {user: user:paul,   relation: holder, object: position:solo/tenant-administrator}
  - {user: user:olaf,   relation: holder, object: position:other/user}
  - {user: user:uma,    relation: holder, object: position:user/tenant-administrator}
  - {user: user:ulf,    relation: holder, object: position:user/user}
  - {user: user:pia,    relation: holder, object: position:plain/tenant-administrator}
  - {user: user:piet,   relation: holder, object: position:plain/user}
  # and the roles given to a person directly, beside their position
  - {user: user:mia,    relation: user,   object: app:demo/nextcloud}
  - {user: user:tom,    relation: user,   object: app:demo/nextcloud}                 # an administrator who was given an app
  - {user: user:marc,   relation: holder, object: role:demo/odoo-sales/configurator}  # an engineer with one role in sales
  - {user: user:odin,   relation: admin,  object: app:demo/odoo}

  # --- cluster roles, from the Cluster claim's role holders
  - {user: user:alice,                                      relation: admin,             object: cluster:main}
  - {user: user:bea,                                        relation: break_glass,       object: cluster:main}
  # and a person, for a stated time (spec.platformAccess.roleHolders)
  - {user: user:gentian/bea-held,                           relation: break_glass,       object: cluster:main}
  # and the role holders it names (spec.platformAccess.roleHolders), each the account of its realm:
  # people of the platform tenant (realm kernel), and administrators of a tenant
  - {user: user:kernel/sam,    relation: security_officer,   object: cluster:main}
  - {user: user:kernel/audrey, relation: auditor,            object: cluster:main}
  - {user: user:kernel/serge,  relation: service_admin,      object: cluster:main}
  - {user: user:kernel/shari,  relation: shared_apps_admin,  object: cluster:main}
  - {user: user:kernel/petra,  relation: perimeter_approver, object: cluster:main}
  - {user: user:demo/tom,      relation: security_officer,   object: cluster:main}
  - {user: user:other/olaf,    relation: auditor,            object: cluster:main}

  # --- tenant demo: operated by the platform. Its administrator pat is its perimeter approver (a role
  # holder of scope tenant:demo)
  - {user: cluster:main, relation: cluster,     object: tenant:demo}
  - {user: cluster:main, relation: operated_by, object: tenant:demo}
  - {user: position:demo/tenant-administrator#holder, relation: admin, object: tenant:demo}
  - {user: position:demo/user#holder,                 relation: user,  object: tenant:demo}
  - {user: user:demo/pat, relation: perimeter_approver, object: tenant:demo}
  # and dana, a person of the platform tenant, its auditor: she reads demo's evidence and no other tenant's
  - {user: user:kernel/dana, relation: auditor, object: tenant:demo}

  # --- tenant solo administers itself: cluster stays, operated_by was removed
  - {user: cluster:main, relation: cluster, object: tenant:solo}
  - {user: position:solo/tenant-administrator#holder, relation: admin, object: tenant:solo}
  - {user: user:solo/paul, relation: perimeter_approver, object: tenant:solo}

  # --- tenant plain: operated by the platform, and as every tenant starts: nobody of its own approves
  - {user: cluster:main, relation: cluster,     object: tenant:plain}
  - {user: cluster:main, relation: operated_by, object: tenant:plain}
  - {user: position:plain/tenant-administrator#holder, relation: admin, object: tenant:plain}
  - {user: position:plain/user#holder,                 relation: user,  object: tenant:plain}

  # --- tenant user: the name of the one user tenant of a single-tenancy cluster, operated by the platform,
  # its administrator uma its perimeter approver
  - {user: cluster:main, relation: cluster,     object: tenant:user}
  - {user: cluster:main, relation: operated_by, object: tenant:user}
  - {user: position:user/tenant-administrator#holder, relation: admin, object: tenant:user}
  - {user: position:user/user#holder,                 relation: user,  object: tenant:user}
  - {user: user:user/uma, relation: perimeter_approver, object: tenant:user}

  # --- tenant other: only what olaf needs to be a person of another tenant
  - {user: position:other/user#holder, relation: user, object: tenant:other}

  # --- one installed app, administered through the position App administrator
  - {user: tenant:demo, relation: tenant, object: app:demo/nextcloud}
  - {user: position:demo/app-administrator#holder, relation: admin, object: app:demo/nextcloud}
  - {user: tenant:solo, relation: tenant, object: app:solo/wiki}

  # --- a base app and its add-on, an app of its own with roles of its own:
  # manager includes salesman, configurator stands alone
  - {user: tenant:demo,         relation: tenant, object: app:demo/odoo}
  - {user: tenant:demo,         relation: tenant, object: app:demo/odoo-sales}
  - {user: app:demo/odoo,       relation: base,   object: app:demo/odoo-sales}
  - {user: app:demo/odoo-sales, relation: addon,  object: app:demo/odoo}
  - {user: app:demo/odoo-sales, relation: app,      object: role:demo/odoo-sales/manager}
  - {user: app:demo/odoo-sales, relation: app,      object: role:demo/odoo-sales/salesman}
  - {user: app:demo/odoo-sales, relation: app,      object: role:demo/odoo-sales/configurator}
  - {user: role:demo/odoo-sales/manager,      relation: declared, object: app:demo/odoo-sales}
  - {user: role:demo/odoo-sales/salesman,     relation: declared, object: app:demo/odoo-sales}
  - {user: role:demo/odoo-sales/configurator, relation: declared, object: app:demo/odoo-sales}
  - {user: role:demo/odoo-sales/manager, relation: included_in, object: role:demo/odoo-sales/salesman}

  # --- positions of tenant demo beyond the three every tenant has: Sales
  # manager holds the add-on's role, Executive includes Sales manager,
  # Engineer is a person of the tenant and nothing in sales
  - {user: tenant:demo, relation: tenant, object: position:demo/sales-manager}
  - {user: tenant:demo, relation: tenant, object: position:demo/executive}
  - {user: tenant:demo, relation: tenant, object: position:demo/engineer}
  - {user: position:demo/sales-manager#holder, relation: holder, object: role:demo/odoo-sales/manager}
  - {user: position:demo/sales-manager#holder, relation: user,   object: tenant:demo}
  - {user: position:demo/executive,            relation: included_in, object: position:demo/sales-manager}
  - {user: position:demo/engineer#holder,      relation: user,   object: tenant:demo}

  # --- what the operator derives from the above (derived_*), never given:
  # Sales manager's role manager includes salesman, is a role on the add-on,
  # and the add-on is used inside its base
  - {user: position:demo/sales-manager#holder, relation: derived_holder, object: role:demo/odoo-sales/salesman}
  - {user: position:demo/sales-manager#holder, relation: derived_user,   object: app:demo/odoo-sales}
  - {user: position:demo/sales-manager#holder, relation: derived_user,   object: app:demo/odoo}
  # Executive holds what Sales manager holds, through the inclusion
  - {user: position:demo/executive#holder, relation: derived_holder, object: role:demo/odoo-sales/manager}
  - {user: position:demo/executive#holder, relation: derived_holder, object: role:demo/odoo-sales/salesman}
  - {user: position:demo/executive#holder, relation: derived_user,   object: tenant:demo}
  - {user: position:demo/executive#holder, relation: derived_user,   object: app:demo/odoo-sales}
  - {user: position:demo/executive#holder, relation: derived_user,   object: app:demo/odoo}
  # marc's role in sales lets him into the add-on and its base
  - {user: user:marc, relation: derived_user, object: app:demo/odoo-sales}
  - {user: user:marc, relation: derived_user, object: app:demo/odoo}
  # odin administers odoo, so its add-on
  - {user: user:odin, relation: derived_admin, object: app:demo/odoo-sales}

  # --- contracts, shared instances
  - {user: tenant:demo,        relation: tenant,   object: contract:demo/file-store}
  - {user: app:demo/nextcloud, relation: provider, object: contract:demo/file-store}
  - {user: app:demo/openproject, relation: consumer, object: contract:demo/file-store}
  - {user: cluster:main, relation: cluster,    object: shared_instance:collabora}
  - {user: tenant:demo,  relation: offered_to, object: shared_instance:collabora}

tests:
  - name: cluster roles grant exactly their own verbs
    check:
      - {user: user:alice,         object: cluster:main, assertions: {can_configure: true,  can_deploy_tenant: true,  can_approve: false, can_edit_raw: false, can_audit: true,  can_operate_system: false, can_install_shared: false, can_approve_perimeter: false}}
      - {user: user:kernel/sam,    object: cluster:main, assertions: {can_approve: true,    can_configure: false,     can_audit: true,    can_set_admission: false, can_approve_perimeter: false}}
      - {user: user:kernel/audrey, object: cluster:main, assertions: {can_audit: true,      can_approve: false,       can_configure: false}}
      - {user: user:kernel/serge,  object: cluster:main, assertions: {can_operate_system: true, can_configure: false,  can_install_shared: false}}
      - {user: user:kernel/shari,  object: cluster:main, assertions: {can_install_shared: true, can_grant_shared: true, can_operate_system: false}}
      - {user: user:kernel/petra,  object: cluster:main, assertions: {can_approve_perimeter: true, can_approve: false, can_audit: false, can_configure: false}}

  - name: the kernel tools open for who runs the cluster, not for who reads or approves
    check:
      - {user: user:alice,         object: cluster:main, assertions: {can_open_kernel_tools: true}}
      - {user: user:kernel/serge,  object: cluster:main, assertions: {can_open_kernel_tools: true}}
      - {user: user:kernel/audrey, object: cluster:main, assertions: {can_open_kernel_tools: false}}
      - {user: user:kernel/sam,    object: cluster:main, assertions: {can_open_kernel_tools: false}}
      - {user: user:kernel/petra,  object: cluster:main, assertions: {can_open_kernel_tools: false}}
      - {user: user:bea,           object: cluster:main, assertions: {can_edit_raw: true,   can_set_admission: true,  can_configure: false, can_audit: false}}
      - {user: user:mia,           object: cluster:main, assertions: {can_configure: false, can_audit: false, can_approve: false}}

  - name: a role holder holds the role as the account of its own realm, and as nothing else
    check:
      - {user: user:demo/tom,   object: cluster:main, assertions: {can_approve: true,  can_audit: true, can_configure: false}}
      - {user: user:tom,        object: cluster:main, assertions: {can_approve: false, can_audit: false}}
      - {user: user:solo/tom,   object: cluster:main, assertions: {can_approve: false, can_audit: false}}
      - {user: user:sam,        object: cluster:main, assertions: {can_approve: false, can_audit: false}}
      - {user: user:other/olaf, object: cluster:main, assertions: {can_audit: true,    can_approve: false, can_configure: false}}
      - {user: user:other/olaf, object: tenant:solo,  assertions: {can_view: true,     can_install_app: false}}

  - name: the one who installs is not the one who approves
    check:
      - {user: user:alice,      object: cluster:main, assertions: {can_approve: false}}
      - {user: user:kernel/sam, object: cluster:main, assertions: {can_deploy_tenant: false}}

  - name: tenant admin holds the tenant verbs, a user of the tenant holds none
    check:
      - {user: user:tom, object: tenant:demo, assertions: {can_install_app: true, can_set_policy: true, can_grant: true, can_manage_users: true, can_view: true, can_enter: true, can_administer: true}}
      - {user: user:mia, object: tenant:demo, assertions: {can_install_app: false, can_manage_users: false, can_grant: false, can_administer: false, can_view: true, can_enter: true}}
      - {user: user:olaf, object: tenant:demo, assertions: {can_view: false, can_enter: false, can_install_app: false}}
      - {user: user:uma, object: tenant:user, assertions: {can_install_app: true, can_view: true, can_administer: true}}
      - {user: user:ulf, object: tenant:user, assertions: {can_install_app: false, can_view: true, can_expose: false}}
      - {user: user:tom, object: tenant:user, assertions: {can_install_app: false, can_view: false}}

  - name: platform admin reaches a tenant only through operated_by
    check:
      - {user: user:alice, object: tenant:demo, assertions: {can_install_app: true, can_manage_users: true, can_administer: true}}
      - {user: user:alice, object: tenant:solo, assertions: {can_install_app: false, can_manage_users: false, can_administer: false, can_view: true}}
      - {user: user:tina,  object: tenant:solo, assertions: {can_install_app: true}}
      - {user: user:tina,  object: tenant:demo, assertions: {can_install_app: false, can_view: false}}

  - name: audit and approval derive through cluster, which cannot be withdrawn
    check:
      - {user: user:kernel/audrey, object: tenant:solo, assertions: {can_view: true, can_enter: true, can_install_app: false}}
      - {user: user:kernel/sam,    object: tenant:solo, assertions: {can_enter: true, can_view: true, can_approve_privilege: false}}

  - name: the perimeter, both directions, is its own relation, held by the perimeter approver and the cluster's administrator
    check:
      # As a tenant starts: its own administrators do not approve, its members never do.
      - {user: user:pia,  object: tenant:plain, assertions: {can_expose: false, can_approve_privilege: false, can_install_app: true, can_manage_users: true}}
      - {user: user:piet, object: tenant:plain, assertions: {can_expose: false, can_approve_privilege: false}}
      - {user: user:tom,  object: tenant:demo,  assertions: {can_expose: false, can_approve_privilege: false}}
      # The administrator named perimeter approver of their tenant approves both,
      # as the account of their realm, and there only.
      - {user: user:demo/pat, object: tenant:demo,  assertions: {can_expose: true, can_approve_privilege: true, can_enter: true, can_view: true, can_install_app: false}}
      - {user: user:pat,      object: tenant:demo,  assertions: {can_expose: false, can_approve_privilege: false}}
      - {user: user:demo/pat, object: tenant:plain, assertions: {can_expose: false, can_approve_privilege: false}}
      - {user: user:user/uma, object: tenant:user,  assertions: {can_expose: true, can_approve_privilege: true}}
      # The cluster's perimeter approver approves both on every tenant, the ones
      # that administer themselves too, and holds nothing else by it.
      - {user: user:kernel/petra, object: tenant:plain, assertions: {can_expose: true, can_approve_privilege: true, can_view: true, can_enter: true, can_install_app: false, can_manage_users: false}}
      - {user: user:kernel/petra, object: tenant:solo,  assertions: {can_expose: true, can_approve_privilege: true}}
      - {user: user:petra,        object: tenant:plain, assertions: {can_expose: false}}
      # The cluster's administrator approves in every tenant; no other
      # cluster role does.
      - {user: user:alice,  object: tenant:plain, assertions: {can_expose: true, can_approve_privilege: true}}
      - {user: user:alice,  object: tenant:demo,  assertions: {can_expose: true}}
      - {user: user:alice,  object: tenant:user,  assertions: {can_expose: true}}
      - {user: user:kernel/sam,    object: tenant:plain, assertions: {can_expose: false}}
      - {user: user:kernel/audrey, object: tenant:plain, assertions: {can_expose: false}}
      - {user: user:kernel/serge,  object: tenant:plain, assertions: {can_expose: false}}
      - {user: user:bea,           object: tenant:plain, assertions: {can_expose: false}}

  - name: a tenant that withdrew the operator is still approved for by the cluster's administrator, and nothing more
    check:
      - {user: user:alice,     object: tenant:solo, assertions: {can_expose: true, can_approve_privilege: true, can_install_app: false, can_manage_users: false}}
      - {user: user:tina,      object: tenant:solo, assertions: {can_expose: false}}
      - {user: user:solo/paul, object: tenant:solo, assertions: {can_expose: true}}

  - name: an app is used by whoever was given a role on it, not by every person of the tenant
    check:
      - {user: user:mia, object: app:demo/nextcloud, assertions: {can_use: true, can_launch: true}}
      - {user: user:max, object: app:demo/nextcloud, assertions: {can_use: false, can_launch: false}}
      - {user: user:olaf, object: app:demo/nextcloud, assertions: {can_use: false}}

  - name: grants only add — an administrator uses an app they were given, and no app they were not
    check:
      - {user: user:tom,   object: app:demo/nextcloud, assertions: {can_use: true, can_launch: true, can_administer: false}}
      - {user: user:pat,   object: app:demo/nextcloud, assertions: {can_use: false, can_administer: false}}
      - {user: user:alice, object: app:demo/nextcloud, assertions: {can_use: false, can_administer: false}}

  - name: app administration is per app, includes its use and confers nothing else
    check:
      - {user: user:nina, object: app:demo/nextcloud, assertions: {can_administer: true, can_use: true, can_write_credential: false}}
      - {user: user:nina, object: app:demo/odoo,      assertions: {can_administer: false, can_use: false}}
      - {user: user:nina, object: tenant:demo,        assertions: {can_install_app: false, can_view: false, can_enter: false}}
      - {user: user:mia,  object: app:demo/nextcloud, assertions: {can_administer: false}}

  - name: a declared role sits between user and admin — holding it is using the app, and the app's admin holds it
    check:
      - {user: user:sven, object: role:demo/odoo-sales/manager,      assertions: {holder: true}}
      - {user: user:sven, object: role:demo/odoo-sales/salesman,     assertions: {holder: true}}    # manager includes salesman
      - {user: user:sven, object: role:demo/odoo-sales/configurator, assertions: {holder: false}}
      - {user: user:sven, object: app:demo/odoo-sales,               assertions: {can_use: true, can_administer: false}}
      - {user: user:odin, object: role:demo/odoo-sales/manager,      assertions: {holder: true}}    # the base's admin administers the add-on
      - {user: user:odin, object: role:demo/odoo-sales/configurator, assertions: {holder: true}}
      - {user: user:mia,  object: role:demo/odoo-sales/salesman,     assertions: {holder: false}}

  - name: an add-on is an app of its own — its role lets a person into the base, the base's admin administers it
    check:
      - {user: user:sven, object: app:demo/odoo,       assertions: {can_use: true, can_administer: false}}
      - {user: user:odin, object: app:demo/odoo-sales, assertions: {can_administer: true, can_use: true}}
      - {user: user:odin, object: app:demo/nextcloud,  assertions: {can_administer: false, can_use: false}}
      - {user: user:max,  object: app:demo/odoo,       assertions: {can_use: false}}
      - {user: user:max,  object: app:demo/odoo-sales, assertions: {can_use: false}}

  - name: a position includes a position — who holds Executive holds what Sales manager holds
    check:
      # holder is who was given the position; what Executive holds through
      # Sales manager is in the derived entries, and the checks below read it
      - {user: user:eve,  object: position:demo/sales-manager,  assertions: {holder: false}}
      - {user: user:sven, object: position:demo/executive,      assertions: {holder: false}}
      - {user: user:eve,  object: role:demo/odoo-sales/manager, assertions: {holder: true}}
      - {user: user:eve,  object: app:demo/odoo,                assertions: {can_use: true}}
      - {user: user:eve,  object: tenant:demo,                  assertions: {can_enter: true, can_install_app: false}}

  - name: a role given directly beside a position adds that role and no other
    check:
      - {user: user:marc, object: role:demo/odoo-sales/configurator, assertions: {holder: true}}
      - {user: user:marc, object: role:demo/odoo-sales/manager,      assertions: {holder: false}}
      - {user: user:marc, object: app:demo/odoo-sales,               assertions: {can_use: true, can_administer: false}}
      - {user: user:marc, object: position:demo/sales-manager,       assertions: {holder: false}}

  - name: a tenant's admin gives roles but holds none on its apps
    check:
      - {user: user:tom, object: tenant:demo,          assertions: {can_manage_users: true}}
      - {user: user:pat, object: app:demo/odoo,        assertions: {can_use: false, can_administer: false}}
      - {user: user:pat, object: role:demo/odoo-sales/manager, assertions: {holder: false}}

  - name: secret writes for a component follow tenant administration
    check:
      - {user: user:tom,   object: app:demo/nextcloud, assertions: {can_write_credential: true}}
      - {user: user:alice, object: app:demo/nextcloud, assertions: {can_write_credential: true}}
      - {user: user:alice, object: app:solo/wiki,      assertions: {can_write_credential: false}}
      - {user: user:mia,   object: app:demo/nextcloud, assertions: {can_write_credential: false}}

  - name: a credential is written by whoever administers its scope and read by whoever may audit it
    check:
      # The cluster's own: its administrator writes, its auditor reads.
      - {user: user:alice,  object: cluster:main, assertions: {can_write_credential: true,  can_read_credential: true}}
      - {user: user:kernel/audrey, object: cluster:main, assertions: {can_write_credential: false, can_read_credential: true}}
      - {user: user:tom,    object: cluster:main, assertions: {can_write_credential: false, can_read_credential: false}}
      # A tenant's: its administrator, and the platform's through the consent
      # tuple; the cluster's auditor reads; a member does neither.
      - {user: user:tom,    object: tenant:demo, assertions: {can_write_credential: true,  can_read_credential: true}}
      - {user: user:alice,  object: tenant:demo, assertions: {can_write_credential: true,  can_read_credential: true}}
      - {user: user:kernel/audrey, object: tenant:demo, assertions: {can_write_credential: false, can_read_credential: true}}
      - {user: user:mia,    object: tenant:demo, assertions: {can_write_credential: false, can_read_credential: false}}
      # A component's follow its tenant's.
      - {user: user:tom,    object: app:demo/nextcloud, assertions: {can_read_credential: true}}
      - {user: user:kernel/audrey, object: app:demo/nextcloud, assertions: {can_read_credential: true, can_write_credential: false}}
      - {user: user:mia,    object: app:demo/nextcloud, assertions: {can_read_credential: false}}

  - name: a contract is consumed only by the apps the tenant allowed
    check:
      - {user: app:demo/openproject, object: contract:demo/file-store, assertions: {can_consume: true}}
      - {user: app:demo/odoo,        object: contract:demo/file-store, assertions: {can_consume: false}}
      - {user: app:demo/nextcloud,   object: contract:demo/file-store, assertions: {can_consume: false}}

  - name: a shared instance binds only tenants it was offered to
    check:
      - {user: tenant:demo, object: shared_instance:collabora, assertions: {can_bind: true}}
      - {user: tenant:solo, object: shared_instance:collabora, assertions: {can_bind: false}}

  - name: a tenant's evidence is read by its auditor and the cluster's, by nobody of the tenant
    check:
      - {user: user:kernel/dana,   object: tenant:demo,  assertions: {can_read_evidence: true,  can_enter: false, can_view: false, can_administer: false, can_read_credential: false}}
      - {user: user:kernel/dana,   object: tenant:solo,  assertions: {can_read_evidence: false}}
      - {user: user:kernel/dana,   object: cluster:main, assertions: {can_audit: false}}
      - {user: user:dana,          object: tenant:demo,  assertions: {can_read_evidence: false}}
      - {user: user:demo/dana,     object: tenant:demo,  assertions: {can_read_evidence: false}}
      - {user: user:kernel/audrey, object: tenant:demo,  assertions: {can_read_evidence: true}}
